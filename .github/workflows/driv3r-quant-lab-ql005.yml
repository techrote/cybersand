name: QL-005 actual packed Q1 XNOR worm plus bounded activation repair (research only)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql005_bitserial.py'
      - '.github/workflows/driv3r-quant-lab-ql005.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql005-bitserial-activation-repair
  cancel-in-progress: false
jobs:
  bitserial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Load immutable QL-003 trained and Frankenstein model roots
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Load immutable QL-004 Q1 scale-only repaired roots
        uses: actions/download-artifact@v4
        with:
          name: ql004-pinned-integer-repair
          run-id: 43801270652
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql004-source
      - name: Check host safety and actual packed XNOR arithmetic
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql002_branch_retrace.py --self-test
          python experiments/driv3r/quant_lab/ql005_bitserial.py --self-test
      - name: Perform 80 genuine STE repair updates and 144 first-pass original PNGs
        run: |
          python experiments/driv3r/quant_lab/ql005_bitserial.py --source-dir ql003-source --repair-dir ql004-source --out ql005-out --steps 40
      - name: Qualify exact HEAD, sources, optimizer state, original PNG bytes and first-pass receipts
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('ql005-out')
          r=json.loads((root/'results.json').read_text())
          assert r['source_sha']==os.environ['GITHUB_SHA']
          assert r['pinned_sources']['ql003']=='9b4103c48127e5c8538403e2a4d9e2525fbe8755'
          assert r['pinned_sources']['ql004']=='e421d69bf16d9e567f02815707c9743713e0d13b'
          assert min(r['verified_original_manifest_entries'])>=100
          assert r['new_optimizer_updates']==80 and r['heldout_n']>=4000
          assert len(r['variants'])==9 and len(r['controls'])==3
          assert len(list((root/'gallery').glob('*.png')))==144
          receipts=json.loads((root/'raw_decisions.json').read_text())
          assert len(receipts)==144
          assert all(x['first_pass'] for x in receipts)
          assert all(s['chosen'] in s['legal'] for x in receipts for s in x['steps'])
          for v in r['repair'].values():
              assert v['steps']==40 and v['nonzero_moment_tensors']>=2
              assert v['packed_weight_codes_unchanged'] and v['forward_parity_max_abs']<2e-5
          manifest=json.loads((root/'MANIFEST.json').read_text())
          assert len({v['path'] for v in manifest})==len(manifest)
          for item in manifest:
              data=(root/item['path']).read_bytes()
              assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256'], item['path']
          print('QL005 EXACT-HEAD VERIFIED',len(manifest),'entries; 144 original PNGs; 80 optimizer steps')
          PY
      - name: Preserve model-step records, packed-code source hashes and real gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql005-bitserial-repair
          path: ql005-out/
          if-no-files-found: warn
          retention-days: 21
