name: WORM-001 SPROCKET support synthetic curriculum and gallery

on:
  push:
    branches:
      - research/612-worm-sprocket-support
    paths:
      - experiments/agent_painter/worm/support_sprocket/**
      - .github/workflows/agent-painter-worm-sprocket-support.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Source identity and runner-provider policy
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          git rev-parse HEAD
          python3 tools/ci/check_ci_provider_policy.py
          sha256sum experiments/agent_painter/worm/common/worm.py experiments/agent_painter/worm/support_sprocket/curriculum.py
      - name: Actual W0 legality, split, deterministic replay and PNG tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m unittest discover -s experiments/agent_painter/worm/support_sprocket -p test_curriculum.py -v 2>&1 | tee evidence/tests.txt
      - name: Generate synthetic TRAIN/DEV and paired original PNG gallery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 experiments/agent_painter/worm/support_sprocket/curriculum.py --output evidence/sprocket-support | tee evidence/summary.jsonl
          test "$(find evidence/sprocket-support/gallery -maxdepth 1 -name '*.png' | wc -l)" -eq 24
          test "$(find evidence/sprocket-support/gallery -maxdepth 1 -name '*.json' | wc -l)" -eq 25
          test "$(wc -l < evidence/sprocket-support/dataset/train.jsonl)" -gt 100
          test "$(wc -l < evidence/sprocket-support/dataset/development.jsonl)" -gt 30
          git rev-parse HEAD > evidence/source-sha.txt
          find evidence/sprocket-support -type f -print0 | sort -z | xargs -0 sha256sum > evidence/sha256sums.txt
      - name: Preserve original gallery, data, source, failure and test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worm001-sprocket-support
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
