name: MZ-001 Pythia70 game-policy training (research only)
on:
  push:
    branches:
      - 'research/model-zoo-*'
    paths:
      - 'experiments/driv3r/model_zoo/**'
      - '.github/workflows/driv3r-model-zoo-mz001.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-zoo-mz001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train-pythia70:
    name: Pythia-70M legal-mask LoRA / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: legal-plain
            gamma: '0.0'
          - variant: legal-mild
            gamma: '0.25'
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'transformers==4.45.2' 'peft==0.13.2' 'accelerate==1.1.1' 'safetensors==0.4.5'
      - name: Contract tests before remote model access
        run: python experiments/driv3r/model_zoo/zoo_pythia.py --self-test
      - name: Real pretrained model load and bounded LoRA training
        run: |
          python experiments/driv3r/model_zoo/zoo_pythia.py --output model-zoo-out --steps 160 --batch 6 --lr 0.00025 --balance-gamma ${{ matrix.gamma }}
      - name: Validate result provenance and original PNG bytes
        if: success()
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path('model-zoo-out')
          r=json.loads((root/'results.json').read_text())
          assert r['source_sha']==os.environ['GITHUB_SHA']
          assert r['model_revision']=='e93a9faa9c77e5d09219f6c868bfc7a1bd65593c'
          assert r['train_steps']==160 and r['adapter_files']
          assert r['heldout']['stock']['n']>0
          assert 'host_legal_accuracy' in r['heldout']['adapted']
          for row in r['adapter_files']:
              p=root/row['path']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
          for label in ['stock','adapted']:
              for row in r[label]['episodes']:
                  p=root/row['png']
                  assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==row['png_sha256']
          assert r['stock']['host_executed_illegal_actions']==0
          assert r['adapted']['host_executed_illegal_actions']==0
          print('SOURCE / ADAPTER / 12 ORIGINAL PNGs VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mz001-${{ matrix.variant }}-${{ github.sha }}
          path: model-zoo-out/
          if-no-files-found: warn
          retention-days: 14
