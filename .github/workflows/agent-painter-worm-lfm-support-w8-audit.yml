name: WORM LFM support - original W8 checkpoint audit
on:
  push:
    branches: [research/612-worm-lfm-support]
    paths:
      - '.github/workflows/agent-painter-worm-lfm-support-w8-audit.yml'
      - 'experiments/agent_painter/worm/support_lfm/w8_original_audit.py'
      - 'experiments/agent_painter/worm/support_lfm/test_w8_original_audit.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: worm-lfm-support-w8-original-audit
  cancel-in-progress: false
jobs:
  audit:
    name: Genuine W8 training custody, raw EOS vs legality, no model training
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify owned source and adversarial policy tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/w8-lfm-support-policy.json
          python3 -m py_compile experiments/agent_painter/worm/support_lfm/w8_original_audit.py
          python3 -m unittest discover -s experiments/agent_painter/worm/support_lfm -p 'test_w8_original_audit.py' -v
          mkdir -p w8-support-evidence
          echo "$GITHUB_SHA" > w8-support-evidence/audit-source-head.txt
      - name: Fetch independent immutable original primary W8 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/techrote/cybersand/actions/artifacts/14169951142 --jq .digest)" = "sha256:b9d19fa758572660e837e59a13f50843639f6ea9c2350e0ff936fc41f549add9"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 400 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/techrote/cybersand/actions/artifacts/14169951142/zip" \
            -o "$RUNNER_TEMP/original-w8.zip"
          echo "b9d19fa758572660e837e59a13f50843639f6ea9c2350e0ff936fc41f549add9  $RUNNER_TEMP/original-w8.zip" | sha256sum -c
      - name: Audit true original model and optimizer receipts
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/worm/support_lfm/w8_original_audit.py \
            --artifact "$RUNNER_TEMP/original-w8.zip" --out w8-support-evidence/checkpoint-audit \
            | tee w8-support-evidence/stdout.json
          python3 - <<'PY'
          import json
          r=json.load(open("w8-support-evidence/checkpoint-audit/report.json"))
          assert r["optimizer_steps_verified"]==180 and r["verified_checkpoint_inventory_members"]==48
          assert (r["trained_syntactic_EOS7"],r["trained_host_legal"],r["trained_teacher_matches"])==(18,12,3)
          assert r["trained_raw_RETRACE"]==18 and r["anti_RETRACE_synthetic_source_cases"]==12
          assert r["new_optimizer_updates"]==r["new_model_first_passes"]==r["new_model_PNGs"]==0
          print("Original W8 custody PASS; trained online painting NOT CLAIMED")
          PY
      - name: Preserve receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worm-lfm-support-w8-original-audit
          path: w8-support-evidence/
          if-no-files-found: warn
          retention-days: 45
