name: QL-013 contextual RETRACE and novelty-exhaustion repair (research)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql013_contextual_retrace.py'
      - '.github/workflows/driv3r-quant-lab-ql013.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql013-contextual-retrace
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  contextual-retrace-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Read immutable QL-003 trained Q1 and Q4 checkpoints
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Source-faithful legality, protected-cell and novelty-guard tests
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql013_contextual_retrace.py --self-test
      - name: Four real adapter repairs, subgroup tests, stochastic and override-free long horizons
        run: |
          python experiments/driv3r/quant_lab/ql013_contextual_retrace.py \
            --parent ql003-source --out ql013-out --steps 64
      - name: Verify exact HEAD, 256 optimizer steps, original PNGs, legal actions and immutable model provenance
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import torch
          p=Path('ql013-out')
          r=json.loads((p/'results.json').read_text())
          sha=os.environ['QL_SOURCE_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          assert r['source_sha']==sha
          assert r['parent_source_sha']=='9b4103c48127e5c8538403e2a4d9e2525fbe8755'
          assert r['parent_manifest_entries']>=330
          assert r['optimizer_updates']==256 and r['heldout_n']==4352
          assert r['heldout_pairs']==128
          assert r['parent_retrace_anchor_train_states']>100
          assert r['exhausted_retrace_anchor_train_states']>=32
          assert r['novel_forward_negative_train_states']>=32
          assert len(r['training'])==4 and len(r['variants'])==6
          assert r['original_png_n']==252 and r['first_pass_trajectories']==252
          for name,t in r['training'].items():
              assert t['updates']==64 and t['optimizer_nonzero_moments']==2
              assert t['parent_packed_codes_unchanged']
              ck=torch.load(p/'models'/(name+'-optimizer.pt'),
                             map_location='cpu',weights_only=False)
              assert ck['source_sha']==sha and len(ck['trace'])==64
              assert ck['parent_source_sha']==r['parent_source_sha']
              assert torch.count_nonzero(ck['state_dict']['v']).item()>0
          rows=json.loads((p/'raw_decisions.json').read_text())
          assert len(rows)==252
          assert all(row['first_pass'] and all(
                     step['chosen'] in step['legal'] and 'STOP' in step['legal']
                     for step in row['steps']) for row in rows)
          assert len({(row['policy'],row['seed'],row['family'],row['override_rate'])
                      for row in rows}) == len(rows)
          for v in r['variants'].values():
              assert v['heldout']['n']==4352
              assert v['heldout']['host_masked_legal']==4352
              assert v['matched_pairs']['n']==128
              assert v['conditional_heldout']['total_host_masked_legal']==4352
              for subgroup in ('exhausted_with_retrace','one_fresh_with_retrace',
                               'two_plus_fresh_with_retrace','oracle_retrace'):
                  d=v['conditional_heldout'][subgroup]
                  assert d['n']>0 and d['host_masked_legal']==d['n']
              assert v['host_random_10pct']['n_episodes']==18
              assert v['no_host_random_diagnostic']['n_episodes']==18
              assert v['no_host_random_diagnostic']['total_host_overrides']==0
          assert hashlib.sha256((p/'raw_decisions.json').read_bytes()).hexdigest()==r['raw_decisions_sha256']
          manifest=json.loads((p/'MANIFEST.json').read_text())
          assert len({e['path'] for e in manifest})==len(manifest)
          for e in manifest:
              b=(p/e['path']).read_bytes()
              assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']
          assert len(list((p/'gallery').glob('*.png')))==252
          print('QL013 EXACT-HEAD CONTEXTUAL RETRACE PASS',sha,len(rows),'episodes',len(manifest),'manifest hashes')
          PY
      - name: Keep real optimizer checkpoints, negative results, 252 PNGs and action audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql013-contextual-retrace-exact-head
          path: ql013-out/
          retention-days: 21
          if-no-files-found: warn
