name: PR405 native matched A/B evidence
on:
  push:
    branches: [codex/pr405-matched-bench-20261107]
permissions:
  contents: read
jobs:
  compare:
    name: Same-runner main versus composed #405 native timing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source with retained ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
      - name: Compile and execute source-matched baseline and candidate
        shell: bash
        env:
          BASE_SHA: 3d953ed1c1f5bd0bcf582359d47863689b9e2310
          CANDIDATE_SHA: 94961320c03863a7857f355d749850658ba5b12c
        run: |
          set -euo pipefail
          mkdir -p results/baseline results/candidate
          git rev-parse HEAD > results/workflow_head.txt
          printf '%s\n' "$BASE_SHA" "$CANDIDATE_SHA" > results/arm_commits.txt
          cp native/bench/lcb201_moving_camera.cpp "$RUNNER_TEMP/lcb201_moving_camera.cpp"
          cp native/bench/wcx_surge_assessment.cpp "$RUNNER_TEMP/wcx_surge_assessment.cpp"
          git worktree add --detach "$RUNNER_TEMP/pr405-base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/pr405-candidate" "$CANDIDATE_SHA"

          # Compile both before measuring. ABBA interleaving mitigates
          # host clock/thermal drift and preserves independent raw samples.
          lscpu > results/runner-cpu.txt
          for side in baseline candidate; do
            if test "$side" = baseline; then src="$RUNNER_TEMP/pr405-base"; else src="$RUNNER_TEMP/pr405-candidate"; fi
            git -C "$src" rev-parse HEAD > "results/$side/source_sha.txt"
            sha256sum "$src/native/src/world.cpp" > "results/$side/world_sha256.txt"
            for bench in lcb201_moving_camera wcx_surge_assessment; do
              timeout 900 g++-13 -std=c++20 -O2 -DNDEBUG -I"$src/native/include" \
                "$src/native/src/world.cpp" "$src/native/src/material_rules.cpp" \
                "$src/native/src/scheduler_geometry.cpp" "$src/native/src/settled_world_discovery.cpp" \
                "$RUNNER_TEMP/$bench.cpp" -pthread -o "$RUNNER_TEMP/$side-$bench"
              sha256sum "$RUNNER_TEMP/$side-$bench" > "results/$side/$bench.sha256"
            done
          done
          sequence=(baseline candidate candidate baseline)
          for i in 0 1 2 3; do
            side="${sequence[$i]}"
            timeout 300 "$RUNNER_TEMP/$side-lcb201_moving_camera" 64 1 quiet \
              > "results/$side/rep-$i-moving-quiet-1.jsonl"
            timeout 300 "$RUNNER_TEMP/$side-lcb201_moving_camera" 64 4 flow \
              > "results/$side/rep-$i-moving-flow-4.jsonl"
            for arm in freemass pressure_dormant_nogas pressure_ref_gas pressure_dormant_gas inertial; do
              WCX_SURGE_ARM="$arm" timeout 240 "$RUNNER_TEMP/$side-wcx_surge_assessment" 96 4 \
                > "results/$side/rep-$i-surge-$arm.jsonl" \
                2> "results/$side/rep-$i-surge-$arm.stderr"
            done
          done
          python3 - <<'PY'
          import json, pathlib, statistics
          root = pathlib.Path('results')
          groups = {'baseline': (0,3), 'candidate': (1,2)}
          print('PR405_MATCHED_ABBA: two observations per arm/source in ABBA order, one ubuntu-24.04 runner, g++13 -O2; C++ kernels are source-matched')
          for name in ('moving-quiet-1','moving-flow-4'):
              source = {side: [[json.loads(s) for s in (root/side/f'rep-{i}-{name}.jsonl').read_text().splitlines()] for i in indices] for side,indices in groups.items()}
              for idx in range(len(source['baseline'][0])):
                  a = [run[idx] for run in source['baseline']]
                  b = [run[idx] for run in source['candidate']]
                  assert all((v['arm'],v['speed'],v['workers']) == (a[0]['arm'],a[0]['speed'],a[0]['workers']) for v in a+b)
                  before = statistics.median(v['p50_ms'] for v in a)
                  after = statistics.median(v['p50_ms'] for v in b)
                  print(f"{name} arm={a[0]['arm']} speed={a[0]['speed']} main_p50={before:.4f} candidate_p50={after:.4f} delta_pct={(after/before-1)*100:.1f} main_raw={[v['p50_ms'] for v in a]} candidate_raw={[v['p50_ms'] for v in b]} main_rebuilds={[v['index_rebuilds'] for v in a]} candidate_rebuilds={[v['index_rebuilds'] for v in b]}")
          for arm in ('freemass','pressure_dormant_nogas','pressure_ref_gas','pressure_dormant_gas','inertial'):
              values = {side:[json.loads((root/side/f'rep-{i}-surge-{arm}.jsonl').read_text()) for i in indices] for side,indices in groups.items()}
              a,b = values['baseline'],values['candidate']
              assert all((v['arm'],v['workers'],v['ticks']) == (a[0]['arm'],a[0]['workers'],a[0]['ticks']) for v in a+b)
              assert all(v['surface_motion_per_tick'] == a[0]['surface_motion_per_tick'] for v in a+b)
              before = statistics.median(v['tick_p50_ms'] for v in a)
              after = statistics.median(v['tick_p50_ms'] for v in b)
              print(f"{arm} main_p50={before:.4f} candidate_p50={after:.4f} delta_pct={(after/before-1)*100:.1f} main_raw={[v['tick_p50_ms'] for v in a]} candidate_raw={[v['tick_p50_ms'] for v in b]} surface_motion={a[0]['surface_motion_per_tick']:.2f}")
          PY
      - name: Preserve source-matched timing inputs and outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr405-native-matched-ab
          path: results/
          retention-days: 90
          if-no-files-found: warn
