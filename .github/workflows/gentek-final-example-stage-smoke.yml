name: GENTEK exact-candidate original example staging smoke (isolated test only)
on:
  push:
    branches: [qualification/gentek-final-example-stage-smoke-20261122]
permissions:
  contents: read
jobs:
  stage-variants:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert original staging source matches canonical release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 92bc5732de4bc6b4f5cda31d6aed47181be23502:tools/acceptance/stage_gentek80_examples.py)" = "$(git hash-object tools/acceptance/stage_gentek80_examples.py)"
          test "$(git rev-parse 92bc5732de4bc6b4f5cda31d6aed47181be23502:tools/acceptance/tests/test_stage_gentek80_examples.py)" = "$(git hash-object tools/acceptance/tests/test_stage_gentek80_examples.py)"
      - name: Five offline synthetic refusal and admission tests (not gameplay evidence)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m py_compile tools/acceptance/stage_gentek80_examples.py tools/acceptance/tests/test_stage_gentek80_examples.py
          python -m unittest discover -s tools/acceptance/tests -p test_stage_gentek80_examples.py -v 2>&1 | tee evidence/staging-synthetic.log
          grep 'Ran 5 tests' evidence/staging-synthetic.log
          grep '^OK$' evidence/staging-synthetic.log
          git rev-parse HEAD > evidence/test-checkout-sha.txt
          git rev-parse 92bc5732de4bc6b4f5cda31d6aed47181be23502:tools/acceptance/stage_gentek80_examples.py > evidence/canonical-helper-blob-sha.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek-final-example-stage-qa-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
