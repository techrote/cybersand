name: WORM-001 SPROCKET support independent W3 original artifact audit

on:
  push:
    branches: [research/612-worm-sprocket-support]
    paths:
      - experiments/agent_painter/worm/support_sprocket/audit_w3.py
      - .github/workflows/agent-painter-worm-sprocket-support-w3-audit.yml

permissions:
  contents: read
  actions: read

jobs:
  independent-original-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Source and provider policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/support-source-sha.txt
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/worm/support_sprocket/audit_w3.py
      - name: Retrieve immutable original W3 artifact without forwarding GitHub authorization to redirect
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, urllib.error, urllib.parse, shutil
          url = 'https://api.github.com/repos/techrote/cybersand/actions/artifacts/14156858169/zip'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          op = urllib.request.build_opener(NoRedirect)
          try:
              op.open(request, timeout=40)
              raise RuntimeError('Expected a signed redirect, not inline bytes')
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308):
                  raise
              signed = error.headers.get('Location', '')
          parsed = urllib.parse.urlparse(signed)
          host = parsed.hostname or ''
          if parsed.scheme != 'https' or not (
              host.endswith('.blob.core.windows.net')
              or host.endswith('.githubusercontent.com')
              or host.endswith('.github.com')):
              raise RuntimeError('Unrecognised artifact download redirect host')
          total = 0
          with urllib.request.urlopen(signed, timeout=300) as source, open('/tmp/original-w3.zip','wb') as out:
              while True:
                  block = source.read(1024*1024)
                  if not block: break
                  total += len(block)
                  if total > 370_000_000: raise RuntimeError('Artifact exceeds agreed 370MB limit')
                  out.write(block)
          print('Original W3 compressed bytes', total)
          w0 = 'https://raw.githubusercontent.com/techrote/cybersand/4bb9d6e1d0d0d78183f87d1e3c29648edafacf61/experiments/agent_painter/worm/common/worm.py'
          with urllib.request.urlopen(w0, timeout=45) as response, open('/tmp/pinned-repository-w0.py','wb') as out:
              shutil.copyfileobj(response, out)
          PY
      - name: Rehash all original checkpoint/receipt bytes, independently replay every W0 control PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/worm/support_sprocket/audit_w3.py /tmp/original-w3.zip \
            --expected-sha256 e0561e706f6222c6d4e6fe176bfb5169687f4a650ef58564e5ca82116300219e \
            --trusted-w0 /tmp/pinned-repository-w0.py \
            --report evidence/w3-independent-report.json | tee evidence/w3-independent-stdout.json
          test "$(python3 -c 'import json; a=json.load(open("evidence/w3-independent-report.json")); print(a["w0_full_json_and_pixel_replays"])')" = 18
          sha256sum /tmp/original-w3.zip /tmp/pinned-repository-w0.py > evidence/external-input-sha256.txt
          sha256sum evidence/*.json > evidence/report-sha256.txt
      - name: Preserve evidence without reuploading 319MB original model checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worm-sprocket-w3-independent-audit
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
