name: WORM SPROCKET support independent W5 S3 original paired images

on:
  push:
    branches: [research/612-worm-sprocket-support]
    paths:
      - experiments/agent_painter/worm/support_sprocket/audit_w5_s3_paired.py
      - .github/workflows/agent-painter-worm-sprocket-support-w5-s3-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: worm-sprocket-support-w5-s3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-W5-S3-against-original-W4-S2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm owned-only audited source, provider, and self-tests
        run: |
          set -euo pipefail
          mkdir -p evidence/worm-sprocket-w5-s3
          git rev-parse HEAD > evidence/worm-sprocket-w5-s3/audit-source-sha.txt
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/worm/support_sprocket/audit_w5_s3_paired.py
          python3 experiments/agent_painter/worm/support_sprocket/audit_w5_s3_paired.py --self-test \
            | tee evidence/worm-sprocket-w5-s3/self-tests.txt
      - name: Download two original primary artifacts read-only with bounded HTTPS redirects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, urllib.error, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          for label,artifact in (('s2',14169781247),('s3',14171760152)):
              request=urllib.request.Request(
                  f'https://api.github.com/repos/techrote/cybersand/actions/artifacts/{artifact}/zip',
                  headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                           'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28'})
              try:
                  urllib.request.build_opener(NoRedirect).open(request,timeout=45)
                  raise RuntimeError('GitHub did not return artifact redirect')
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301,302,303,307,308):
                      raise
                  signed=exc.headers.get('Location','')
              u=urllib.parse.urlparse(signed)
              host=u.hostname or ''
              if (u.scheme!='https' or
                  not (host.endswith('.blob.core.windows.net')
                       or host.endswith('.githubusercontent.com')
                       or host.endswith('.github.com'))):
                  raise ValueError('untrusted original artifact redirection')
              with urllib.request.urlopen(signed,timeout=90) as resp:
                  blob=resp.read(600_001)
              if not 0<len(blob)<600_000:
                  raise ValueError('original artifact missing/oversized')
              open(f'/tmp/worm-original-{label}.zip','wb').write(blob)
          PY
      - name: Retrieve exact immutable shepherd W0, not modifying common
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git rev-parse FETCH_HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > /tmp/w0-immutable-s3.py
          test "$(sha256sum /tmp/w0-immutable-s3.py | cut -c1-64)" = 81c3923cb38d7f196b99986806216388c34ebc27fd4976e168b3b370c25a323e
      - name: Independently audit two original model trajectories, source PNGs and produce six paired visual galleries
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/worm/support_sprocket/audit_w5_s3_paired.py \
            --s2 /tmp/worm-original-s2.zip --s3 /tmp/worm-original-s3.zip \
            --trusted-w0 /tmp/w0-immutable-s3.py \
            --output evidence/worm-sprocket-w5-s3/paired-audit.json \
            | tee evidence/worm-sprocket-w5-s3/console.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/worm-sprocket-w5-s3')
          r=json.loads((p/'paired-audit.json').read_text())
          assert r['original_full_W0_PNG_and_JSON_replays']==60
          assert r['identical_original_control_PNG_checks']==36
          assert r['score_statistics']['s3']['rollouts']==12
          assert r['score_statistics']['s2']['rollouts']==12
          assert len(list((p/'gallery').glob('*.png')))==6
          assert r['optimizer_updates']==r['Godot_native_paintings']==0
          print('Original two-run paired W0 replay, score, and gallery PASS')
          PY
          sha256sum /tmp/worm-original-s2.zip /tmp/worm-original-s3.zip /tmp/w0-immutable-s3.py \
            > evidence/worm-sprocket-w5-s3/original-input-sha256.txt
      - name: Checksum original support report, source-pixel crops and partial/failure evidence
        if: always()
        run: |
          set -euo pipefail
          (cd evidence/worm-sprocket-w5-s3 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) \
            > evidence/worm-sprocket-w5-s3/SHA256SUMS.txt
      - name: Upload exact-head evidence, including when incomplete
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worm-sprocket-support-w5-s3-paired-original
          path: evidence/worm-sprocket-w5-s3/
          retention-days: 90
          if-no-files-found: warn
