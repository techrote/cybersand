name: CyberSand PF gas acceptance — rapid subset integrity (no benchmark)

on:
  push:
    branches: [perf/pf-gas-acceptance-20261107]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pf-gas-acceptance-static
  cancel-in-progress: true

jobs:
  prepare:
    name: Verify exact inherited factorial and source-bound acceptance tools
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify generator and source-only scope
        run: |
          set -euo pipefail
          git diff --check
          python tools/ci/check_ci_provider_policy.py
          python tools/ci/pf_gas_acceptance.py check
      - name: Verify fail-closed rapid selection, ordering and provenance
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/ci -p test_pf_gas_acceptance.py -v
      - name: Check documentation and repository consistency
        run: |
          set -euo pipefail
          python tools/ci/check_docs.py
          python tools/ci/check_repository.py
