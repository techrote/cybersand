name: LFM2.5-VL original visible DEVELOPMENT teacher budget (NO TRAIN)
on:
  push:
    branches: [codex/agent-painter-lfm25-vl-568]
    paths:
      - 'experiments/agent_painter/lanes/lfm25_vl/original_dev_reference_budget_v1.py'
      - 'experiments/agent_painter/lanes/lfm25_vl/test_original_dev_reference_budget_v1.py'
      - '.github/workflows/agent-painter-lfm25_vl-dev-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lfm25-original-dev-reference-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-official-processor-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      ATEN_CPU_CAPABILITY: 'default'
      MKL_CBWR: 'COMPATIBLE'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact owned branch and source safety
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/agent-painter-lfm25-vl-568
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/lfm-reference-scheduling.json
          python3 -m py_compile experiments/agent_painter/lanes/lfm25_vl/original_dev_reference_budget_v1.py
          python3 -m py_compile experiments/agent_painter/lanes/lfm25_vl/test_original_dev_reference_budget_v1.py
          mkdir -p evidence
          printf '%s\n' '{"status":"FAIL_OR_PARTIAL_NO_QUALIFICATION","final_opened":false,"model_generations":0,"optimizer_updates":0,"native_executions":0}' > evidence/failure.json
          git rev-parse HEAD > evidence/source.txt
          lscpu > evidence/cpu.txt
      - name: Original reference-budget adversarial source-only tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/agent_painter/lanes/lfm25_vl -p 'test_original_dev_reference_budget_v1.py' -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-painter-native-633920373a3d406a2ede61ce4137c324f76be23b
          run-id: '43506373969'
          github-token: ${{ github.token }}
          path: evidence/original-native
      - name: Install original pinned CPU processor environment (no full weights)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/painter-lfm-reference"
          "$RUNNER_TEMP/painter-lfm-reference/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/painter-lfm-reference/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/painter-lfm-reference/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torchvision==0.29.2+cpu'
          "$RUNNER_TEMP/painter-lfm-reference/bin/python" -m pip install -r experiments/agent_painter/training/requirements-lfm25_vl.lock
          "$RUNNER_TEMP/painter-lfm-reference/bin/python" -m pip check
          "$RUNNER_TEMP/painter-lfm-reference/bin/python" -m pip freeze --all > evidence/pip-freeze.txt
      - name: Actual official LFM original six DEVELOPMENT teacher references
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/painter-lfm-reference/bin/python" \
            experiments/agent_painter/lanes/lfm25_vl/original_dev_reference_budget_v1.py \
            --corpus evidence/original-native/corpus \
            --processor-dir "$RUNNER_TEMP/lfm-original-dev-reference-small-files" \
            --output evidence/original-dev-reference
          test -f evidence/original-dev-reference/summary.json
          test ! -e evidence/original-dev-reference/INCOMPLETE.json
          "$RUNNER_TEMP/painter-lfm-reference/bin/python" - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("evidence/original-dev-reference/summary.json").read_text())
          assert x["status"]=="PASS_ORIGINAL_VISIBLE_DEV_REFERENCE_ONLY_NOT_DEV60"
          assert x["independent_development_groups"]==6 and x["native_seed_rows"]==12
          assert x["sealed_final_content_opened"] is False
          assert x["model_generations"]==x["optimizer_updates"]==x["native_executions"]==0
          assert x["future_dev60_frozen"] is False and x["provisional_512_is_approved_budget"] is False
          PY
          rm evidence/failure.json
      - name: Keep source and partial/failure processor-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lfm25-original-dev-reference-v1-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/failure.json
            evidence/source.txt
            evidence/cpu.txt
            evidence/pip-freeze.txt
            evidence/original-dev-reference/
          retention-days: 90
          if-no-files-found: warn
