name: PressureFlow candidate patch application (temporary)
on:
  push:
    branches:
      - codex/pf-run-head-repair-20261106
    paths:
      - tools/pf-run-repair-patch.b64

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'stage(candidate): pressure-run-head-repair patch transfer' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate exact upstream dependency and patch digest
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4a80af2a891332176a3912a235582d77d076a185 HEAD
          base64 --decode tools/pf-run-repair-patch.b64 | bzip2 -dc > /tmp/pf-run-repair.patch
          echo 'c0a48375aa9e16335f6b1d81d13b41f646aded3285dde5c64372fc1a0e1f687d  /tmp/pf-run-repair.patch' | sha256sum --check -
          git apply --check /tmp/pf-run-repair.patch
          git apply /tmp/pf-run-repair.patch
          git diff --check
      - name: Publish only to the isolated repair branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tools/pf-run-repair-patch.b64
          git add Makefile docs native
          git diff --cached --check
          git config user.name 'cybersand-pf-run-repair-ci'
          git config user.email 'cybersand-pf-run-repair-ci@users.noreply.github.com'
          git commit -m 'perf(pf): bounded per-run PressureFlow head repair experiment'
          git push origin HEAD:refs/heads/codex/pf-run-head-repair-20261106
          git rev-parse HEAD