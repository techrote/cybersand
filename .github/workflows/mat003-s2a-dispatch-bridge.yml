# Temporary, narrowly scoped bridge to issue exactly one user-authorized
# workflow_dispatch for S2A; delete after dispatch has been observed.
name: MAT-003 S2A one-shot dispatch bridge

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.repository == 'techrote/cybersand' &&
      github.event.issue.number == 204 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'techrote' &&
      github.event.comment.body == '/mat003-s2a-dispatch-e40cc0d-12466348465-c50d01f'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm admitted branch identity and dispatch exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.github.com/repos/${GH_REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          expected="c50d01fea636dc97cdec081e6225e936bcf9742f"
          observed="$(curl -fsSL "${auth[@]}" "${base}/git/ref/heads/codex/mat-003prepass-s2-feasibility" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          if [[ "${observed}" != "${expected}" ]]; then
            echo "HARD STOP: PR branch changed; refusing dispatch. expected=${expected} actual=${observed}" >&2
            exit 1
          fi
          state="$(curl -fsSL "${auth[@]}" "${base}/actions/workflows/mat003-s2a.yml" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["state"])')"
          if [[ "${state}" != "active" ]]; then
            echo "HARD STOP: admitted manual workflow not active: ${state}" >&2
            exit 1
          fi
          prior="$(curl -fsSL "${auth[@]}" "${base}/actions/workflows/mat003-s2a.yml/runs?event=workflow_dispatch&branch=codex%2Fmat-003prepass-s2-feasibility&per_page=1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])')"
          if [[ "${prior}" != "0" ]]; then
            echo "HARD STOP: ${prior} existing manual workflow_dispatch run(s) on admitted branch; refusing duplicate" >&2
            exit 1
          fi
          status="$(curl -sS "${auth[@]}" -o /tmp/s2a-dispatch.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"ref":"codex/mat-003prepass-s2-feasibility"}' \
            "${base}/actions/workflows/mat003-s2a.yml/dispatches")"
          if [[ "${status}" != "204" ]]; then
            echo "HARD STOP: dispatch rejected HTTP ${status}" >&2
            cat /tmp/s2a-dispatch.json >&2
            exit 1
          fi
          echo "DISPATCH_ACCEPTED: workflow_dispatch on branch ${expected}; exact admitted S2A workflow, no workflow file modification."
