name: Strata Theatre 003 optical and graphical qualification

# Explicit bounded Draft/HOLD evaluation on the owner's isolated feature branch.
# Retained native inputs must remain exact. No runtime publication or promotion.
on:
  push:
    branches: [feat/strata-theatre-003-20261125]
    paths:
      - '.github/workflows/strata-theatre-003.yml'
      - 'tools/ci/strata3-qualification-request.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: strata-theatre-003-${{ github.run_id }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GODOT_SILENCE_ROOT_WARNING: '1'
  PYTHONUTF8: '1'

jobs:
  linux:
    name: Actual Linux optical shaders and ordinary Workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      suite: ${{ steps.scope.outputs.suite }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
    steps:
      - name: Check out exact qualification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read explicit campaign scope
        id: scope
        run: |
          python3 - <<'PYTHON'
          import json,os,pathlib
          request=json.loads(pathlib.Path('tools/ci/strata3-qualification-request.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('suite='+request['suite']+'\n')
          PYTHON
      - name: Validate scope and fetch unchanged retained native inputs
        run: |
          set -euo pipefail
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/test_strata3_gallery.py
          python3 tools/ci/test_strata3_qualification.py
          python3 tools/ci/test_strata3_predecessor_compare.py
          python3 tools/ci/test_strata3_package.py
          git lfs install --local
          downloaded=false
          for attempt in 1 2 3; do
            if git lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''; then
              downloaded=true
              break
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if [[ $downloaded != true ]]; then
            # GitHub's LFS batch service can time out while its immutable media
            # endpoint remains available. Accept only the exact committed OIDs.
            python3 - <<'PYTHON'
          import hashlib,pathlib,re,subprocess,urllib.request
          revision=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          assert re.fullmatch('[0-9a-f]{40}',revision)
          names=('godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so',
                 'godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so')
          for name in names:
              pointer=subprocess.check_output(['git','show','HEAD:'+name]).decode()
              match=re.fullmatch(r'version https://git-lfs.github.com/spec/v1\noid sha256:([0-9a-f]{64})\nsize (\d+)\n',pointer)
              assert match,'Expected committed LFS identity: '+name
              expected,size=match.group(1),int(match.group(2))
              target=pathlib.Path(name)
              if target.stat().st_size==size and hashlib.sha256(target.read_bytes()).hexdigest()==expected:continue
              temporary=target.with_suffix(target.suffix+'.download')
              digest,count=hashlib.sha256(),0
              try:
                  with urllib.request.urlopen('https://media.githubusercontent.com/media/techrote/cybersand/'+revision+'/'+name,timeout=120) as response,temporary.open('wb') as output:
                      while block:=response.read(1024*1024):
                          count+=len(block)
                          assert count<=size,'Runtime download exceeded committed size'
                          digest.update(block);output.write(block)
                  assert count==size and digest.hexdigest()==expected,'Runtime download differs from committed identity'
                  temporary.replace(target)
                  print('Verified immutable media fallback:',name,size,expected)
              finally:
                  temporary.unlink(missing_ok=True)
          PYTHON
          fi
      - name: Prepare official pinned Godot and graphical display
        run: |
          set -euo pipefail
          missing=()
          command -v Xvfb >/dev/null || missing+=(xvfb)
          command -v xauth >/dev/null || missing+=(xauth)
          for package in libgl1 libegl1 libxrandr2 libxi6 libxinerama1 libxcursor1 libasound2t64; do
            [[ $(dpkg-query -W -f='${Status}' "$package" 2>/dev/null) == 'install ok installed' ]] || missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 --output "$RUNNER_TEMP/godot47.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip'
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot47.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot47.zip" -d "$RUNNER_TEMP/godot47"
          chmod +x "$RUNNER_TEMP/godot47/Godot_v4.7-stable_linux.x86_64"
      - name: Execute actual graphical native readback, identity and fresh reopening
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python3 tools/ci/qualify_strata3_workbench.py --request tools/ci/strata3-qualification-request.json --godot "$RUNNER_TEMP/godot47/Godot_v4.7-stable_linux.x86_64" --output build/strata3-linux
      - name: Requalify inherited native authoring and paired original application
        if: steps.scope.outputs.suite == 'full'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python3 tools/ci/qualify_strata2_workbench.py --godot "$RUNNER_TEMP/godot47/Godot_v4.7-stable_linux.x86_64" --output build/strata3-compatibility-linux
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python3 tools/ci/strata3_predecessor_compare.py --godot "$RUNNER_TEMP/godot47/Godot_v4.7-stable_linux.x86_64" --output build/strata3-predecessor-linux
      - name: Preserve original Linux compatibility and predecessor observations
        if: always() && steps.scope.outputs.suite == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strata3-controls-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/strata3-compatibility-linux/
            build/strata3-predecessor-linux/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve original Linux receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strata3-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: build/strata3-linux/
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Actual Windows optical shaders and ordinary Workbench
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Check out exact qualification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read explicit campaign scope
        id: scope
        shell: pwsh
        run: |
          @'
          import json,os,pathlib
          request=json.loads(pathlib.Path('tools/ci/strata3-qualification-request.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('suite='+request['suite']+'\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Campaign request failed' }
      - name: Validate scope and fetch retained Windows runtime
        shell: pwsh
        run: |
          python tools/ci/check_ci_provider_policy.py
          if ($LASTEXITCODE -ne 0) { throw 'CI provider policy failed' }
          python tools/ci/test_strata3_gallery.py
          if ($LASTEXITCODE -ne 0) { throw 'Evidence adverse controls failed' }
          python tools/ci/test_strata3_qualification.py
          if ($LASTEXITCODE -ne 0) { throw 'Optical reader controls failed' }
          python tools/ci/test_strata3_predecessor_compare.py
          if ($LASTEXITCODE -ne 0) { throw 'Paired reader controls failed' }
          python tools/ci/test_strata3_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable source custody controls failed' }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'LFS setup failed' }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Retained runtime download failed after three attempts' }
            Start-Sleep -Seconds (5 * $attempt)
          }
      - name: Authenticate pinned Godot and complete portable dependencies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-windows.zip'
          curl.exe --fail --location --retry 2 --connect-timeout 20 --max-time 300 --output $archive 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot download failed' }
          $env:STRATA_GODOT_ARCHIVE = $archive
          @'
          import os, pathlib, sys
          sys.path.insert(0, 'tools/ci')
          from run_windows_godot_regressions import prepare_godot
          executable, record = prepare_godot(pathlib.Path(os.environ['STRATA_GODOT_ARCHIVE']))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('GODOT_EXE='+str(executable)+'\nWINDOWS_DEPENDENCIES='+str(executable.parent)+'\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Godot pin verification failed' }
          $dependencies = Join-Path $env:RUNNER_TEMP 'godot-windows'
          foreach ($name in @('LICENSE.txt','COPYRIGHT.txt')) {
            curl.exe --fail --location --retry 2 --connect-timeout 20 --max-time 120 --output (Join-Path $dependencies "Godot-$name") "https://raw.githubusercontent.com/godotengine/godot/5b4e0cb0f/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Godot notice download failed' }
          }
          $runtimeLicense = Join-Path $dependencies 'Microsoft-Visual-C-Runtime-LICENSE.docx'
          $developerLicense = Join-Path $dependencies 'Microsoft-Visual-Studio-2022-LICENSE.docx'
          curl.exe --fail --location --retry 2 --connect-timeout 20 --max-time 120 --output $runtimeLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/09/Visual-C-Runtime-2015-2022-License-1.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft runtime notice download failed' }
          curl.exe --fail --location --retry 2 --connect-timeout 20 --max-time 120 --output $developerLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft redistribution notice download failed' }
          $vc = Join-Path $env:RUNNER_TEMP 'strata-vc-runtime'
          & tools/ci/stage_windows_vc_runtime.ps1 -Output $vc -License $runtimeLicense -DeveloperLicense $developerLicense
          if ($LASTEXITCODE -ne 0) { throw 'VC runtime staging failed' }
          Copy-Item (Join-Path $vc 'vcruntime140.dll') $dependencies
          Copy-Item (Join-Path $vc 'vc-runtime-provenance.json') $dependencies
      - name: Execute ordinary graphical Workbench and source-bound optical graphical campaign
        shell: pwsh
        run: |
          python tools/ci/qualify_strata3_workbench.py --request tools/ci/strata3-qualification-request.json --godot $env:GODOT_EXE --output build/strata3-windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows Strata qualification failed' }
      - name: Requalify inherited native authoring and paired original application
        if: steps.scope.outputs.suite == 'full'
        shell: pwsh
        run: |
          python tools/ci/qualify_strata2_workbench.py --godot $env:GODOT_EXE --output build/strata3-compatibility-windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows inherited native authoring failed' }
          python tools/ci/strata3_predecessor_compare.py --godot $env:GODOT_EXE --output build/strata3-predecessor-windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows paired original application observation failed' }
      - name: Preserve original Windows compatibility and predecessor observations
        if: always() && steps.scope.outputs.suite == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strata3-controls-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/strata3-compatibility-windows/
            build/strata3-predecessor-windows/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve original Windows receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strata3-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: build/strata3-windows/
          if-no-files-found: error
          retention-days: 90
      - name: Retain authenticated portable dependencies for the same source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strata3-dependencies-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.WINDOWS_DEPENDENCIES }}/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Pristine extracted Windows evaluator and ordinary launcher
    needs: [linux, windows]
    if: needs.linux.outputs.suite == 'full'
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Check out the same frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strata3-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strata3-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strata3-dependencies-${{ github.sha }}-${{ github.run_attempt }}
          path: dependencies
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strata3-controls-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: controls/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strata3-controls-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: controls/windows
      - name: Verify retained payload and build the complete evaluator
        shell: pwsh
        run: |
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'LFS setup failed' }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Retained runtime download failed after three attempts' }
            Start-Sleep -Seconds (5 * $attempt)
          }
          $archive = "build/CyberSand-Strata3-Workbench-Windows-$($env:GITHUB_SHA.Substring(0,12)).zip"
          python tools/package_strata3_workbench.py build --dependencies dependencies --linux evidence/linux --windows evidence/windows --compatibility-linux controls/linux/strata3-compatibility-linux --compatibility-windows controls/windows/strata3-compatibility-windows --predecessor-linux controls/linux/strata3-predecessor-linux --predecessor-windows controls/windows/strata3-predecessor-windows --output build/evaluation --archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Source-bound portable package refused' }
          'STRATA_ARCHIVE=' + $archive | Out-File -Append -FilePath $env:GITHUB_ENV
      - name: Extract pristine shipped bytes and repeat native graphical save/reopen
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP 'strata owner package'
          Expand-Archive -LiteralPath $env:STRATA_ARCHIVE -DestinationPath $extracted
          python tools/package_strata3_workbench.py verify --pristine $extracted
          if ($LASTEXITCODE -ne 0) { throw 'Pristine extracted package identity failed' }
          python tools/ci/qualify_strata3_workbench.py --suite full --godot (Join-Path $extracted 'Godot_v4.7-stable_win64_console.exe') --project (Join-Path $extracted 'godot') --output evidence/extracted
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows graphical execution failed' }
          $start = New-Object System.Diagnostics.ProcessStartInfo
          $start.FileName = $env:ComSpec
          $start.Arguments = '/d /s /c ""' + (Join-Path $extracted 'Open Workbench.cmd') + '" --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --quit-after 180"'
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $start
          [void]$process.Start()
          $stdout = $process.StandardOutput.ReadToEndAsync()
          $stderr = $process.StandardError.ReadToEndAsync()
          if (!$process.WaitForExit(180000)) { $process.Kill($true); throw 'Ordinary graphical launcher exceeded 180 seconds' }
          $stdout.Result | Set-Content evidence/launcher.stdout.log
          $stderr.Result | Set-Content evidence/launcher.stderr.log
          if ($process.ExitCode -ne 0 -or ($stdout.Result + $stderr.Result) -match 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:') { throw 'Ordinary graphical launcher failed' }
          $admittedLines = @($stdout.Result -split "`r?`n" | Where-Object { $_.StartsWith('STRATA_WORKBENCH_LAUNCH_ADMITTED ') })
          if ($admittedLines.Count -ne 1) { throw 'One actual ordinary Workbench admission receipt is required' }
          $admitted = $admittedLines[0].Substring('STRATA_WORKBENCH_LAUNCH_ADMITTED '.Length) | ConvertFrom-Json
          if ($admitted.source_revision -ne $env:GITHUB_SHA -or $admitted.workbench_script -ne 'res://scripts/shared_workbench.gd' -or $admitted.world_generation -le 0 -or ($admitted.worker_id -isnot [string] -or $admitted.worker_id -notmatch '^-?[1-9][0-9]{0,18}$') -or $admitted.strata_enabled -ne $false -or $admitted.extent.Count -ne 2 -or $admitted.extent[0] -ne 2048 -or $admitted.extent[1] -ne 2048) { throw 'Ordinary default play World admission identity is invalid' }
          @{ command = $start.FileName + ' ' + $start.Arguments; wrapper_pid = $process.Id; exit_code = $process.ExitCode; admitted = $admitted; source_revision = $env:GITHUB_SHA; pristine_directory = $extracted } | ConvertTo-Json -Depth 8 | Set-Content evidence/launcher.json
          python tools/package_strata3_workbench.py verify $extracted
          if ($LASTEXITCODE -ne 0) { throw 'Original payload changed during extracted execution' }
      - name: Retain qualified evaluator, checksum and complete payload manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strata3-workbench-windows-evaluator-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/CyberSand-Strata3-Workbench-Windows-*.zip
            build/CyberSand-Strata3-Workbench-Windows-*.zip.sha256
            build/CyberSand-Strata3-Workbench-Windows-*.manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain original extracted-package and launcher evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strata3-package-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
