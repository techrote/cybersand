name: SPROCKET A09 independent orthographic courtyard source screen (not TRAIN)
on:
  push:
    branches: [codex/agent-painter-sprocket-568]
    paths:
      - experiments/agent_painter/lanes/sprocket/architecture-a09-request.json
permissions:
  contents: read
  actions: read
concurrency:
  group: sprocket-architecture-a09-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact-host/branch/request and bounds before source screen
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/codex/agent-painter-sprocket-568
          test "$GITHUB_REPOSITORY" = techrote/cybersand
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('experiments/agent_painter/lanes/sprocket/architecture-a09-request.json').read_text())
          assert r=={
            'schema':'cybersand.sprocket-a09-new-architecture-source-review/1',
            'sequence':1,
            'original_native_source_sha':'633920373a3d406a2ede61ce4137c324f76be23b',
            'native_corpus_run_id':43506373969,
            'original_native_manifest_sha256':'2fdef5a3639606fb9af68319f9747a1de1e9a573da5c6197a2dcbc96579cb6cc',
            'candidate':'A09','candidate_groups':1,'host_seed_views':2,
            'source_compiler_only':True,'native_art_executions':False,
            'model_training':False,'shared_train_admission':False,
            'open_final':False,'draft_hold':True,
          }
          PY
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/architecture_revision_v1.py experiments/agent_painter/lanes/sprocket/test_architecture_revision_v1.py
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/sprocket-a09-scheduling.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-painter-native-633920373a3d406a2ede61ce4137c324f76be23b
          run-id: '43506373969'
          github-token: ${{ github.token }}
          path: evidence/source633
      - name: Real strict compiler two-seed A09 and original visible structural split checks
        run: |
          set -euo pipefail
          mkdir -p evidence/sprocket-a09
          printf '%s\n' "$GITHUB_SHA" > evidence/sprocket-a09/source-sha.txt
          python3 -m unittest discover -s experiments/agent_painter/lanes/sprocket -p 'test_architecture_revision_v1.py' -v
          python3 experiments/agent_painter/lanes/sprocket/architecture_revision_v1.py \
            --corpus evidence/source633/corpus \
            --output evidence/sprocket-a09/source-screen.json
          python3 - <<'PY'
          import json
          r=json.load(open('evidence/sprocket-a09/source-screen.json'))
          assert r['candidate_id']=='A09' and r['design_count']==1 and r['compiler_seed_views']==2
          assert len(r['views'])==2 and all(v['metrics']['clearance_route_passed'] for v in r['views'])
          assert r['new_shared_train_groups']==0 and r['native_executions']==0
          assert r['sealed_final_members_accessed']==0 and r['model_training_steps']==0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-architecture-a09-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/sprocket-a09/
          if-no-files-found: warn
          retention-days: 90
