name: LFM2.5-VL WORM-001 W7 balanced one-digit source-fenced CPU LoRA
on:
  push:
    branches: [codex/agent-painter-lfm25-vl-568]
    paths:
      - experiments/agent_painter/lanes/lfm25_vl/worm-w7-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: lfm25-vl-worm-w7-balanced-codes-support-v2-fresh-v1
  cancel-in-progress: false

jobs:
  train-one-vm:
    name: WORM W7 genuine pinned CPU steps and raw digit-code rollouts
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout exact LFM Draft source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout frozen W0 host-only observation and legal action contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          path: worm-w0
          persist-credentials: false
      - name: Checkout frozen LFM support v2 synthetic observations
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: cc27b3206cb61f98432fa95b799c9b9ff508c2bc
          path: worm-support
          persist-credentials: false
      - name: Exact source and W7 request preflight before model download
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C worm-w0 rev-parse HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git hash-object worm-w0/experiments/agent_painter/worm/common/worm.py)" = 8979b6f0296e81051194bacc907992d38e006605
          test "$(git -C worm-support rev-parse HEAD)" = cc27b3206cb61f98432fa95b799c9b9ff508c2bc
          test "$(git hash-object worm-support/experiments/agent_painter/worm/support_lfm/curriculum.py)" = f205a3a9f33632aeaafa2daa8ce25b2484bc6032
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("experiments/agent_painter/lanes/lfm25_vl/worm-w7-request.json")
          d=json.loads(p.read_text())
          assert d == {
            "schema":"cybersand.worm.lfm-w7-request/1",
            "experiment":"lfm-worm-w7-balanced-codes-support-v2-fresh-v1",
            "previous_W6_success_run":43715732784,
            "original_W6_source":"999e60c81dc71b54e20150aa4b97887f22239607",
            "original_W6_artifact":14162279448,
            "original_W6_zip_sha256":"6f1e96fb3bbf6b86890d253315ae204d3539a7e6dd2c858bf2b96181ebe24fce",
            "model_id":"LiquidAI/LFM2.5-VL-450M",
            "revision":"fc6221ca597f3315e4f82fc2df606783267b34ba",
            "worm_source":"4bb9d6e1d0d0d78183f87d1e3c29648edafacf61",
            "support_source":"cc27b3206cb61f98432fa95b799c9b9ff508c2bc",
            "objective":"balanced-original-W0-action-supervision-single-digit-code",
            "sampler":"family-balanced-five-moves-plus-stop-120-distinct-v1",
            "codes":{"STRAIGHT":"0","LEFT":"1","RIGHT":"2","BRANCH":"3","RETRACE":"4","STOP":"5"},
            "evaluation_world_seeds":[2101,2102],
            "steps":120,"deadline_seconds":2350,"CPU_vm_limit":1,
            "fresh_from_parent":True,"sealed_FINAL_opened":False,
            "native_execution":False,"Draft_HOLD":True
          }, "unexpected W7 immutable request"
          PY
          python3 -m py_compile experiments/agent_painter/lanes/lfm25_vl/worm_train_w7_v1.py
          python3 -m unittest discover -s worm-w0/experiments/agent_painter/worm/common -p test_worm.py -v
          python3 -m unittest discover -s worm-support/experiments/agent_painter/worm/support_lfm -p test_curriculum.py -v
          python3 tools/ci/check_ci_provider_policy.py
          mkdir -p evidence/diagnostics
          git rev-parse HEAD > evidence/diagnostics/source-sha.txt
          git -C worm-w0 rev-parse HEAD > evidence/diagnostics/worm-source-sha.txt
          git -C worm-support rev-parse HEAD > evidence/diagnostics/support-source-sha.txt
          lscpu > evidence/diagnostics/cpu.txt
          df -h > evidence/diagnostics/disk-before.txt
      - name: Install pinned qualified CPU stack
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lfm-worm"
          "$RUNNER_TEMP/lfm-worm/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/lfm-worm/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/lfm-worm/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torchvision==0.29.2+cpu'
          "$RUNNER_TEMP/lfm-worm/bin/python" -m pip install -r experiments/agent_painter/training/requirements-lfm25_vl.lock
          "$RUNNER_TEMP/lfm-worm/bin/python" -m pip check
          "$RUNNER_TEMP/lfm-worm/bin/python" -m pip freeze --all > evidence/diagnostics/pip-freeze.txt
      - name: Pre-download source/split/quota/action-code checks
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lfm-worm/bin/python" - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "experiments/agent_painter/lanes/lfm25_vl")
          import worm_train_w7_v1 as w7
          worm=w7.worm_source(Path("worm-w0/experiments/agent_painter/worm/common"))
          support=w7.support_source(Path("worm-support/experiments/agent_painter/worm/support_lfm"),worm)
          rows,custody=w7.dataset(support)
          train=rows["WORM_TRAIN"];dev=rows["WORM_DEV"]
          assert len(train)==1099 and len(dev)==683,(len(train),len(dev))
          assert not {x["prompt"] for x in train}&{x["prompt"] for x in dev}
          assert w7.ACTION_CODES=={"STRAIGHT":"0","LEFT":"1","RIGHT":"2",
                                  "BRANCH":"3","RETRACE":"4","STOP":"5"}
          q={"STRAIGHT":8,"LEFT":8,"RIGHT":8,"BRANCH":7,"RETRACE":7,"STOP":2}
          for family in w7.FAMILIES:
              for action,count in q.items():
                  assert sum(x["family"]==family and x["completion"]==action
                             for x in train)>=count,(family,action)
          assert custody["all_W6_four_RIGHT_history_counterfactuals_excluded"] is True
          print("W7 source-fenced, split-disjoint and quota-preflight PASS",len(train),len(dev))
          PY
      - name: Download pinned FULL official multimodal LFM and verify adapter
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/lfm-worm/bin/python" experiments/agent_painter/training/download_model.py --profile lfm25_vl --output "$RUNNER_TEMP/lfm-worm-model"
          cp "$RUNNER_TEMP/lfm-worm-model/download_receipt.json" evidence/diagnostics/model-download.json
          LFM25_SNAPSHOT="$RUNNER_TEMP/lfm-worm-model" "$RUNNER_TEMP/lfm-worm/bin/python" experiments/agent_painter/lanes/lfm25_vl/test_adapter.py > evidence/diagnostics/adapter-tests.txt 2>&1
      - name: Real bounded fresh W7 CPU optimizer, strict first pass and seed-matched PNGs
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=45s 2600s "$RUNNER_TEMP/lfm-worm/bin/python" experiments/agent_painter/lanes/lfm25_vl/worm_train_w7_v1.py \
            --model "$RUNNER_TEMP/lfm-worm-model" \
            --worm-root worm-w0/experiments/agent_painter/worm/common \
            --support-root worm-support/experiments/agent_painter/worm/support_lfm \
            --output evidence/worm-training --steps 120 --deadline 2350
      - name: Preserve partial failure evidence, original checkpoints and gallery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lfm25-vl-worm-w7-balanced-codes-fresh-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/worm-training/
            evidence/diagnostics/
          if-no-files-found: warn
          retention-days: 90
