name: Strata2 read-only original artifact inspection
# Executor loss recovery: inspect retained bytes without rerunning qualification.
on:
  push:
    branches: [feat/strata-theatre-002-20261124]
    paths: ['.github/workflows/strata2-artifact-inspection.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: strata2-artifact-inspection-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/feat/strata-theatre-002-20261124' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download exact original Linux evidence and expose bounded original receipts
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.parse, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          
          REPO = "techrote/cybersand"
          SOURCE = "1a124c0a47cd9f94e07b541e5c451602b8e8e0fd"
          RUN = 45493745153
          ARTIFACT = 14967949955
          EXPECTED = "0f2c10d46b1a5da76af436f0517090653211a8375e8adeb46730c2e4835b4b4f"
          EXPECTED_BYTES = 89677038
          EXPECTED_NAME = "strata2-linux-" + SOURCE + "-1"
          OUT = Path("strata2-artifact-inspection")
          OUT.mkdir()
          def require(value, reason):
              if not value:
                  raise RuntimeError(reason)
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def write_json(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, sort_keys=True, indent=2) + "\n", encoding="utf-8", newline="\n")
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, target):
                  require(urllib.parse.urlparse(target).scheme == "https", "Refuse non-HTTPS artifact redirect")
                  result = super().redirect_request(request, response, code, message, headers, target)
                  if result is not None and urllib.parse.urlparse(target).hostname != "api.github.com":
                      result.remove_header("Authorization")
                  return result
          opener = urllib.request.build_opener(SafeRedirect())
          def request(url):
              require(urllib.parse.urlparse(url).hostname == "api.github.com", "Only GitHub API entry points are authorized")
              return urllib.request.Request(url, headers={"Authorization":"Bearer " + os.environ["GH_READ_TOKEN"],
                  "Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"strata2-readonly-artifact-inspection"})
          receipt = {"schema":"strata2-original-artifact-inspection-v1","source_commit":SOURCE,"qualification_run":RUN,
                     "artifact_id":ARTIFACT,"status":"running","scope":"Read-only downloaded original evidence; no build, Godot replay, source mutation or PASS promotion."}
          try:
              with opener.open(request(f"https://api.github.com/repos/{REPO}/actions/artifacts/{ARTIFACT}"), timeout=30) as response:
                  metadata = json.load(response)
              write_json(OUT/"artifact-metadata.json",metadata)
              require(metadata["name"] == EXPECTED_NAME and metadata["workflow_run"]["head_sha"] == SOURCE
                      and metadata["workflow_run"]["id"] == RUN and not metadata["expired"], "Artifact source/run/name differs")
              require(metadata["digest"] == "sha256:" + EXPECTED and metadata["size_in_bytes"] == EXPECTED_BYTES,
                      "Artifact metadata differs from the independently observed receipt")
              archive = Path(os.environ["RUNNER_TEMP"])/"strata2-original-linux-artifact.zip"
              digest, count = hashlib.sha256(), 0
              with opener.open(request(f"https://api.github.com/repos/{REPO}/actions/artifacts/{ARTIFACT}/zip"), timeout=90) as response, archive.open("xb") as target:
                  while True:
                      block = response.read(1024*1024)
                      if not block: break
                      count += len(block)
                      require(count <= EXPECTED_BYTES, "Artifact exceeds its exact recorded byte count")
                      digest.update(block); target.write(block)
              require(count == EXPECTED_BYTES and digest.hexdigest() == EXPECTED, "Actual downloaded artifact bytes differ")
              receipt.update(artifact_sha256=digest.hexdigest(),artifact_bytes=count)
              with zipfile.ZipFile(archive) as zipped:
                  files = zipped.infolist()
                  require(len(files) <= 4096 and sum(item.file_size for item in files) <= 2*1024**3, "Artifact exceeds bounded read budget")
                  names = [item.filename for item in files]
                  require(len(names) == len(set(names)), "Duplicate artifact entry")
                  for name in names:
                      path = PurePosixPath(name)
                      require(not path.is_absolute() and ".." not in path.parts and "\\" not in name and "\0" not in name,
                              "Unsafe artifact entry")
                  raw_campaign = zipped.read("qualification.json")
                  campaign = json.loads(raw_campaign)
                  require(campaign.get("source_commit") == SOURCE and campaign.get("platform") == "linux",
                          "Original campaign source/platform differs")
                  ledger = campaign.get("evidence_sha256",{})
                  def original(name):
                      require(name in names, "Missing original artifact member: " + name)
                      raw = zipped.read(name)
                      if name != "qualification.json":
                          require(sha(raw) == ledger.get(name), "Original member differs from campaign ledger: " + name)
                      return raw
                  summary = {key:campaign.get(key) for key in ("schema","source_commit","source_tree","platform","status","completed","input_custody","local_delta")}
                  summary["scenes"] = [{key:item.get(key) for key in ("name","status","error")} for item in campaign.get("scenes",[])]
                  summary["cases"] = [{key:item.get(key) for key in ("label","status","exit_code","seconds")} for item in campaign.get("cases",[])]
                  write_json(OUT/"campaign-summary.json",summary)
                  print("STRATA2_CAMPAIGN_SUMMARY " + json.dumps(summary,sort_keys=True),flush=True)
                  for name in ("qualification.json","orbital-terminal/install.json","orbital-terminal/install/process.log"):
                      raw = original(name)
                      require(len(raw) <= 4*1024*1024, "Original text exceeds bounded diagnostic size")
                      path = OUT/"original"/name
                      path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(raw)
                      if name != "qualification.json":
                          text = raw.decode("utf-8")
                          print("STRATA2_TEXT_JSON " + json.dumps({"path":name,"sha256":sha(raw),"bytes":len(raw),"text":text}),flush=True)
                          encoded=base64.b64encode(raw).decode("ascii")
                          print("STRATA2_TEXT_BEGIN " + json.dumps({"id":name,"path":name,"sha256":sha(raw),"bytes":len(raw),"base64_chars":len(encoded),"chunks":(len(encoded)+4095)//4096}),flush=True)
                          for index,start in enumerate(range(0,len(encoded),4096)):
                              print("STRATA2_TEXT_CHUNK " + json.dumps({"id":name,"index":index,"data":encoded[start:start+4096]}),flush=True)
                          print("STRATA2_TEXT_END " + json.dumps({"id":name,"sha256":sha(raw),"chunks":(len(encoded)+4095)//4096}),flush=True)
                  selected = [(scene+"/stack",scene+"/reference-composite.png") for scene in
                              ("orbital-terminal","neon-rain-arcology","industrial-underworks","abyss-foundry","vertical-transfer-spine")]
                  selected += [("orbital/"+key,"orbital-terminal/"+filename) for key,filename in (
                      ("atmosphere-off","atmosphere-off.png"),("atmosphere-on","atmosphere-on.png"),
                      ("native-grid-play","native-grid-play.png"),("native-grid-scripted","native-grid-scripted.png"),
                      ("import-review","reference-import-asteroid-service-gallery-review.png"),("compose-ui","workflow-tab-2.png"))]
                  transported, skipped, used = [], [], 0
                  for identity,name in selected:
                      if name not in names:
                          skipped.append({"id":identity,"path":name,"reason":"not present in original artifact"}); continue
                      raw = original(name)
                      require(raw.startswith(b"\x89PNG\r\n\x1a\n"),"Original capture is not PNG")
                      if len(raw) > 1024*1024 or used+len(raw) > 6*1024*1024:
                          skipped.append({"id":identity,"path":name,"sha256":sha(raw),"bytes":len(raw),"reason":"bounded log transport budget"}); continue
                      used += len(raw)
                      path=OUT/"original"/name
                      path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(raw)
                      encoded=base64.b64encode(raw).decode("ascii")
                      item={"id":identity,"path":name,"sha256":sha(raw),"bytes":len(raw),"base64_chars":len(encoded),"chunks":(len(encoded)+4095)//4096,
                            "campaign_status":campaign.get("status"),"source_commit":SOURCE}
                      print("STRATA2_IMAGE_BEGIN " + json.dumps(item,sort_keys=True),flush=True)
                      for index,start in enumerate(range(0,len(encoded),4096)):
                          print("STRATA2_IMAGE_CHUNK " + json.dumps({"id":identity,"index":index,"data":encoded[start:start+4096]}),flush=True)
                      print("STRATA2_IMAGE_END " + json.dumps({"id":identity,"sha256":sha(raw),"chunks":item["chunks"]}),flush=True)
                      transported.append(item)
                  receipt.update(status="passed",original_campaign_status=campaign.get("status"),downloaded_file_count=len(files),
                                 transported_images=transported,skipped_images=skipped,transported_image_bytes=used)
          except Exception as error:
              receipt.update(status="failed",error=str(error))
              raise
          finally:
              write_json(OUT/"inspection.json",receipt)
              print("STRATA2_ARTIFACT_INSPECTION " + json.dumps(receipt,sort_keys=True),flush=True)
          PY
      - name: Retain original selected bytes and independent download receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strata2-original-artifact-inspection-1a124c0a-${{ github.run_id }}
          path: strata2-artifact-inspection/
          if-no-files-found: error
          retention-days: 90
