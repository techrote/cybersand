name: GENTEK-WINDOWS-FINAL-001 advanced mixed Workbench adversarial (DRAFT HOLD)
on:
  push:
    branches:
      - qualification/gentek-windows-final-integrator-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-python-and-windows-graphical:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preflight actual mixed test and frozen native input identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source-sha.txt
          python -m py_compile tools/architecture/gentek80_advanced_mixed.py
          if ($LASTEXITCODE -ne 0) { throw 'Python mixed test has invalid syntax' }
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Pinned mainline native and Rapier LFS restore failed' }
          $native = 'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll'
          $rapier = 'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'
          $n=(Get-FileHash $native -Algorithm SHA256).Hash.ToLowerInvariant()
          $r=(Get-FileHash $rapier -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($n -ne '668f2dd094fca611a97c2b6aa38c4cd072179fe9cf591e53578ef57c7db1625e') { throw "Inherited native binary identity differs: $n" }
          if ($r -ne 'b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7') { throw "Rapier binary identity differs: $r" }
          "native=$n" | Add-Content evidence/native-binaries.txt
          "rapier=$r" | Add-Content evidence/native-binaries.txt
      - name: Restore official source-pinned Godot Windows 4.7
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          curl.exe -fL --retry 3 -o $zip https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
          if ($LASTEXITCODE -ne 0) { throw 'Official Godot download failed' }
          $sha=(Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($sha -ne '41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9') {
            throw 'Official Godot archive checksum mismatch'
          }
          $dest=Join-Path $env:RUNNER_TEMP 'godot'
          Expand-Archive $zip $dest
          $exe=Join-Path $dest 'Godot_v4.7-stable_win64_console.exe'
          $ver=(& $exe --version | Out-String).Trim()
          if ($ver -ne '4.7.stable.official.5b4e0cb0f') { throw "Invalid Godot version: $ver" }
          "GODOT_EXE=$exe" | Out-File -Append $env:GITHUB_ENV
          "godot_archive_sha512=$sha" | Add-Content evidence/native-binaries.txt
      - name: Two real five-showcase mixed compositions in ordinary Workbench, native paint/erase and fresh-process reopen
        shell: pwsh
        run: |
          python tools/architecture/gentek80_advanced_mixed.py --godot $env:GODOT_EXE --project godot --output evidence/mixed-advanced --graphical
          if ($LASTEXITCODE -ne 0) { throw 'Exact Workbench mixed advanced acceptance FAILED: preserve original negative evidence' }
      - name: Preserve authentic Windows 2022 qualification, images and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek-final-integrator-advanced-mixed-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
