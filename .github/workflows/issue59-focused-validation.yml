name: Issue 59 focused runtime-storage validation

# Temporary source-only checkpoint. It is intentionally triggered only by this
# workflow file so later documentation/provenance edits do not fan out CI.
on:
  push:
    branches: [codex/issue-59-stage3b-runtime-sized-storage]
    paths: [.github/workflows/issue59-focused-validation.yml]

permissions:
  contents: read

concurrency:
  group: issue59-focused-runtime-storage
  cancel-in-progress: true

jobs:
  focused:
    if: github.repository == 'techrote/cybersand'
    runs-on: sengi-standard-4-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Runtime-sized storage matrix and Stage-3A parity
        run: timeout 8m make soliding-stage3b-runtime-storage-test
      - name: Stage-3A region boundary regressions
        run: |
          timeout 6m make build/test_settled_regions
          timeout 3m ./build/test_settled_regions
      - name: Issue 58 lifecycle/reset/recovery regressions
        run: |
          timeout 8m make build/test_settled_world_discovery
          timeout 4m ./build/test_settled_world_discovery
