name: RAMCACHE Strata independent published Windows consumer

on:
  push:
    branches: [integration/ramcache-strata-package-diagnostic-20261128]
    paths: ['.github/workflows/ramcache-strata-package-diagnostic.yml']

permissions:
  contents: read
  actions: read

env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  JAVA_HOME: ''

jobs:
  consume:
    name: Independently download and exercise the final published evaluator
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 50e3bcb839211eac2abe1e065750cbcba4d36f8c
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate and exercise the actual downloaded final archive
        env:
          CYBERSAND_CONSUMER_TOKEN: ${{ github.token }}
        run: |
          $driver = @'
          #!/usr/bin/env python3
          """Independently consume the already published Windows evaluator on a clean runner.
          
          The final source and all input artifact identities are pinned in an external,
          hash-pinned configuration. This does not publish a replacement evaluator, rerun
          the source campaigns, or relabel original producer execution.
          """
          from __future__ import annotations
          
          import argparse
          import base64
          import hashlib
          import importlib
          import json
          import ntpath
          import os
          import re
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import struct
          import subprocess
          import sys
          import time
          import traceback
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPOSITORY = "techrote/cybersand"
          API = "https://api.github.com/repos/" + REPOSITORY
          MAX_EXPANDED = 4 * 1024 ** 3
          CREDENTIAL_KEYS = {"CYBERSAND_CONSUMER_TOKEN", "GH_TOKEN", "GITHUB_TOKEN", "ACTIONS_RUNTIME_TOKEN"}
          FRAME_SUFFIXES = (
              "strata/optics/industrial-underworks/install/profile-classic.png",
              "strata/preference-reopen/owner-diorama-reopen.png",
              "strata/boundary-data/strata-refused-write.png",
          )
          
          
          def require(value, message):
              if not value:
                  raise RuntimeError(message)
          
          
          def sha(path):
              with Path(path).open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          
          
          def canonical(value):
              return (json.dumps(value, sort_keys=True, indent=2) + "\n").encode("utf-8")
          
          
          def write(path, value):
              Path(path).write_bytes(canonical(value))
          
          
          def read(path):
              return json.loads(Path(path).read_text(encoding="utf-8-sig"))
          
          
          def inventory(directory):
              return {p.relative_to(directory).as_posix(): {"bytes": p.stat().st_size, "sha256": sha(p)}
                      for p in sorted(directory.rglob("*")) if p.is_file()}
          
          
          def retain_downloaded_originals(installation, output, expected_files, manifest, package):
              """Retain bounded, unmodified bytes for review when the full artifact is too large.
          
              This evidence is a selected subset of the actual downloaded evaluator, not a
              second evaluator. Complete archive admission and execution remain mandatory.
              """
              selected = {name for name in expected_files if "/" not in name or name.startswith("qualification/")}
              selected.update("source/" + name for name in package.MATERIALIZED)
              selected.update({"source/.git/HEAD", "source/.git/config", "source/.git/refs/heads/portable-source"})
              if "source/.git/packed-refs" in expected_files:
                  selected.add("source/.git/packed-refs")
              selected.update(name for name in expected_files
                              if name.startswith(("source/godot/addons/cybersand_native/", "source/godot/addons/godot-rapier2d/"))
                              and (name.endswith(".gdextension") or "/runtime-provenance." in name))
              require(selected <= set(expected_files), "Selected original review files are missing")
              total = sum((installation / name).stat().st_size for name in selected)
              require(total <= 400 * 1024 ** 2, "Selected original review evidence exceeds its bounded size")
              destination = output / "downloaded-original-files"
              destination.mkdir()
              retained = {}
              for name in sorted(selected):
                  package.safe_name(name)
                  target = destination / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(installation / name, target)
                  require(sha(target) == expected_files[name], "Retained original bytes changed: " + name)
                  retained[name] = {"bytes": target.stat().st_size, "sha256": expected_files[name]}
              observed = {}
              original = manifest["source_repository"]["original_files"]
              for name, expected_blob in original.items():
                  package.safe_name(name)
                  if name in package.REGENERATED_RAPIER_IMPORTS:
                      require("source/" + name not in expected_files, "Pristine source omission changed")
                      continue
                  target = installation / "source" / name
                  digest, blob = sha(target), package.lab.blob_oid(target)
                  require(digest == expected_files["source/" + name], "Observed source hash differs: " + name)
                  if name not in package.MATERIALIZED:
                      require(blob == expected_blob, "Observed source Git blob differs: " + name)
                  observed[name] = {"bytes": target.stat().st_size, "sha256": digest, "git_blob": blob}
              write(output / "downloaded-pristine-inventory.json", expected_files)
              write(output / "downloaded-source-observations.json", observed)
              write(output / "downloaded-original-files.json", retained)
              return {"status": "passed", "files": len(retained), "expanded_bytes": total,
                      "source_files_observed": len(observed), "omitted_source_imports": package.REGENERATED_RAPIER_IMPORTS,
                      "source_observations_sha256": sha(output / "downloaded-source-observations.json"),
                      "pristine_inventory_sha256": sha(output / "downloaded-pristine-inventory.json"),
                      "selected_inventory_sha256": sha(output / "downloaded-original-files.json"),
                      "scope": "Unmodified selected bytes from the independently downloaded archive, plus full pristine hash inventory and actual tracked-source byte/blob observations. This subset is review evidence, not a runnable evaluator."}
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None
          
          
          def api(path, token):
              require(path.startswith("/") and ".." not in path, "Unsafe GitHub API path")
              request = urllib.request.Request(API + path, headers={
                  "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "CyberSand-independent-evaluator-consumer"})
              with urllib.request.build_opener(NoRedirect).open(request, timeout=60) as response:
                  data = response.read(16 * 1024 * 1024 + 1)
              require(len(data) <= 16 * 1024 * 1024, "Oversized GitHub metadata")
              return json.loads(data)
          
          
          def download_artifact(pin, expected_run, expected_source, target, token):
              metadata = api("/actions/artifacts/" + str(pin["id"]), token)
              for key in ("id", "name", "size_in_bytes", "digest"):
                  require(metadata.get(key) == pin.get(key), "Artifact metadata differs: " + key)
              require(metadata.get("expired") is False
                      and metadata.get("workflow_run", {}).get("id") == expected_run
                      and metadata["workflow_run"].get("head_sha") == expected_source, "Artifact is expired or cross-source/run")
              request = urllib.request.Request(API + "/actions/artifacts/" + str(pin["id"]) + "/zip", headers={
                  "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "CyberSand-independent-evaluator-consumer"})
              try:
                  urllib.request.build_opener(NoRedirect).open(request, timeout=60)
                  raise RuntimeError("Artifact API did not provide its expected storage redirect")
              except urllib.error.HTTPError as error:
                  require(error.code in (301, 302, 303, 307, 308), "Artifact redirect request failed")
                  signed_location = error.headers.get("Location", "")
              location = urllib.parse.urlsplit(signed_location)
              require(location.scheme == "https" and bool(location.hostname) and not location.username and not location.password,
                      "Invalid artifact storage redirect")
              # A fresh request deliberately omits the GitHub credential at the storage host.
              digest, count = hashlib.sha256(), 0
              with urllib.request.urlopen(signed_location, timeout=120) as source, target.open("xb") as destination:
                  while chunk := source.read(4 * 1024 * 1024):
                      count += len(chunk)
                      require(count <= pin["size_in_bytes"], "Artifact exceeds its exact admitted byte length")
                      digest.update(chunk)
                      destination.write(chunk)
              require(count == pin["size_in_bytes"] and "sha256:" + digest.hexdigest() == pin["digest"],
                      "Actual downloaded artifact bytes fail their admitted identity")
              return metadata
          
          
          def extract_original(archive, destination, safe_name):
              require(not destination.exists(), "Extraction must be clean")
              destination.mkdir(parents=True)
              names, folded, total = {}, set(), 0
              with zipfile.ZipFile(archive) as bundle:
                  require(bundle.testzip() is None, "Downloaded original artifact CRC failure")
                  for member in bundle.infolist():
                      if member.is_dir():
                          safe_name(member.filename.rstrip("/"))
                          continue
                      name = safe_name(member.orig_filename)
                      require(name == member.filename and name.casefold() not in folded and not member.flag_bits & 1,
                              "Unsafe, encrypted or duplicate original artifact member")
                      require(stat.S_IFMT(member.external_attr >> 16) in (0, stat.S_IFREG), "Original artifact contains a special file")
                      folded.add(name.casefold())
                      total += member.file_size
                      require(total <= MAX_EXPANDED and member.file_size <= 2 * 1024 ** 3, "Original artifact extraction bound exceeded")
                      target = destination / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      digest = hashlib.sha256()
                      with bundle.open(member) as source, target.open("xb") as output:
                          while chunk := source.read(1024 * 1024):
                              digest.update(chunk)
                              output.write(chunk)
                      require(target.stat().st_size == member.file_size, "Extracted member has the wrong size")
                      names[name] = {"bytes": member.file_size, "sha256": digest.hexdigest(), "crc32": member.CRC}
              return names
          
          
          def unique_suffix(directory, suffix):
              values = [p for p in directory.rglob("*") if p.is_file()
                        and (p.relative_to(directory).as_posix() == suffix
                             or p.relative_to(directory).as_posix().endswith("/" + suffix))]
              require(len(values) == 1, "Missing or ambiguous original member: " + suffix)
              return values[0]
          
          
          def emit_record(name, data, kind):
              digest = hashlib.sha256(data).hexdigest()
              encoded = base64.b64encode(data).decode("ascii")
              chunks = [encoded[start:start + 49152] for start in range(0, len(encoded), 49152)]
              print("CYBERSAND_RECORD_BEGIN " + json.dumps({"name": name, "kind": kind, "bytes": len(data),
                    "sha256": digest, "chunks": len(chunks)}, sort_keys=True), flush=True)
              for index, chunk in enumerate(chunks):
                  print("CYBERSAND_RECORD_CHUNK " + json.dumps({"name": name, "index": index, "data": chunk}), flush=True)
              print("CYBERSAND_RECORD_END " + json.dumps({"name": name, "sha256": digest}), flush=True)
          
          
          def verify_module_record(record, manifest, installation):
              require(record.get("schema") == 1 and record.get("status") == "passed" and record.get("source_commit") == manifest["source_commit"]
                      and record.get("source_tree") == manifest["source_tree"], "Wrong or failed loaded-module receipt")
              normalized = lambda value: ntpath.normcase(ntpath.normpath(value))
              require(normalized(record["package"]) == normalized(installation), "Module probe used another installation")
              require(type(record.get("pid")) is int and record["pid"] > 0
                      and record["startup_deadline_seconds"] == 60 and 0 <= record["elapsed_seconds"] <= 180,
                      "Invalid owned module-probe process or bound")
              rows = [record["executable"], *record["modules"]]
              require(len(rows) == 4, "Incomplete module file inventory")
              required = {
                  "Godot_v4.7-stable_win64.exe",
                  "vcruntime140.dll",
                  "source/godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll",
                  "source/godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll",
              }
              require({row["relative_path"] for row in rows} == required, "Wrong required loaded files")
              require(record["arguments"] == ["--audio-driver", "Dummy", "--rendering-method", "gl_compatibility",
                      "--rendering-driver", "opengl3_angle", "--path", ntpath.join(installation, "source", "godot"),
                      "--", "--workbench"], "Module observation ran another application command")
              for row in rows:
                  expected_path = ntpath.join(installation, *row["relative_path"].split("/"))
                  expected_hash = manifest["files_sha256"][row["relative_path"]]
                  require(row["status"] == "verified" and normalized(row["expected_path"]) == normalized(expected_path)
                          and normalized(row["observed_path"]) == normalized(expected_path)
                          and row["expected_sha256"] == row["packaged_sha256"] == row["observed_sha256"] == expected_hash,
                          "Loaded module escaped the package or its exact hash")
                  matches = [item for item in record["observed_module_inventory"]
                             if item["name"].casefold() == row["name"].casefold()]
                  require(len(matches) == 1 and normalized(matches[0]["path"]) == normalized(expected_path),
                          "Required module is absent or contradictory in the original full loader inventory")
              cleanup = record["cleanup"]
              # The unchanged observer sets terminated_owned_process only after its owned
              # Process.Kill() and a successful bounded WaitForExit(5000). ExitCode is an
              # informational property and can serialize as null; never reinterpret that
              # as zero or apply this rule to the natural-exit CMD/feature receipts.
              require(cleanup["terminated_owned_process"] is True and cleanup["environment_restored"] is True
                      and "exit_code" in cleanup and (cleanup["exit_code"] is None or type(cleanup["exit_code"]) is int)
                      and not cleanup.get("error") and not record.get("error"), "Module probe did not clean up its own process")
              return {"status": "passed", "pid": record["pid"], "files": rows, "cleanup": cleanup,
                      "cleanup_exit_code_reported": cleanup["exit_code"] is not None,
                      "scope": "Intentionally terminated owned module probe; distinct from naturally zero-exit shipped CMD runs."}
          
          
          def validate_reopen_pair(launches):
              require(isinstance(launches, list) and len(launches) == 2, "Missing original launch pair")
              for launch in launches:
                  ready, saved = launch["admission"], launch["profile"]
                  require(ready["session"] == saved["session_id"] and ready["area"] == saved["active_area"]
                          and type(ready["revision"]) is int and 0 < ready["revision"] <= saved["revision"],
                          "Original readiness contradicts its own retained durable profile")
              first, second = launches
              before, after = first["profile"], second["profile"]
              require(before["session_id"] == after["session_id"]
                      and set(first["engine_process_ids"]).isdisjoint(second["engine_process_ids"]),
                      "Reopen was not the same session in fresh engine processes")
              require(second["admission"]["revision"] >= before["revision"]
                      and after["revision"] >= before["revision"]
                      and second["admission"]["area"] == after["active_area"] == before["active_area"],
                      "Reopen rolled back or selected another active area")
              stable = ("area_id", "incarnation", "extent", "authoring_sha256", "authored_source_sha256",
                        "physics_profile_sha256", "policy_sha256", "native_format_version", "physical_hash_version")
              for area in ("a", "b", "c"):
                  left, right = before["native_areas"][area], after["native_areas"][area]
                  require(all(key in left and key in right and left[key] == right[key] for key in stable),
                          "Reopen changed durable area identity or authored policy: " + area)
                  require(right["completed_tick"] >= left["completed_tick"], "Reopen rolled back simulation ticks")
                  if area != before["active_area"]:
                      require(left == right and before["files_sha256"][left["blob"]] == after["files_sha256"][right["blob"]],
                              "No-travel reopen changed an inactive native area")
              return {"status": "passed", "session": before["session_id"], "active_area": before["active_area"],
                      "first_saved_revision": before["revision"], "reopen_ready_revision": second["admission"]["revision"],
                      "reopen_saved_revision": after["revision"], "stable_area_fields": list(stable),
                      "inactive_native_records_and_bytes_unchanged": True}
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--repository", type=Path, required=True)
              parser.add_argument("--configuration", type=Path, required=True)
              parser.add_argument("--configuration-sha256", required=True)
              parser.add_argument("--work", type=Path, required=True)
              parser.add_argument("--output", type=Path, required=True)
              args = parser.parse_args()
              repository = args.repository.resolve(strict=True)
              configuration = args.configuration.resolve(strict=True)
              require(sha(configuration) == args.configuration_sha256, "Consumer configuration changed")
              config = read(configuration)
              require(config.get("schema") == "ramcache-strata-independent-consumer-input-v1", "Wrong consumer configuration")
              work, output = args.work.resolve(), args.output.resolve()
              require(not work.exists() and not output.exists() and " " in str(work), "Use fresh work path with spaces and fresh evidence")
              require(not work.is_relative_to(repository) and not output.is_relative_to(repository)
                      and not work.is_relative_to(output) and not output.is_relative_to(work), "Consumer writes overlap source/evidence")
              work.mkdir(parents=True)
              output.mkdir(parents=True)
              token = os.environ.get("CYBERSAND_CONSUMER_TOKEN", "")
              require(bool(token), "Read-only artifact credential is required")
              credentials = {key: value for key, value in os.environ.items() if key.upper() in CREDENTIAL_KEYS}
              for key in credentials:
                  del os.environ[key]
              started = time.monotonic()
              report = {
                  "schema": "ramcache-strata-independent-published-consumer-v1", "status": "running",
                  "consumer_run": os.environ.get("GITHUB_RUN_ID", ""), "consumer_workflow_source": os.environ.get("GITHUB_SHA", ""),
                  "consumer_script_sha256": sha(Path(__file__)), "configuration_sha256": sha(configuration),
                  "application_source": config["source_commit"], "application_tree": config["source_tree"],
                  "producer_run": config["producer_run"], "producer_attempt": config["producer_attempt"],
                  "runner_image": {key: os.environ.get(key, "") for key in ("ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH")},
                  "events": [], "commands": {}, "physical_owner_gpu_test": False,
                  "credential_keys_removed_before_any_child": sorted(credentials),
                  "scope": "Independent download of the published archive, exact original producer readback, fresh shipped Windows CMD/durable reopen/module/hash execution. Original full feature campaigns are not relabelled or rerun.",
              }
              emitted_frames = []
          
              def event(name):
                  report["events"].append({"name": name, "seconds": round(time.monotonic() - started, 3)})
                  write(output / "consumer.json", report)
                  print("CYBERSAND_CONSUMER_STAGE " + json.dumps(report["events"][-1]), flush=True)
          
              def command(name, argv, cwd, environment, timeout):
                  log = output / (name + ".log")
                  before = time.monotonic()
                  row = {"argv": argv, "cwd": str(cwd), "timeout_seconds": timeout}
                  report["commands"][name] = row
                  try:
                      with log.open("wb") as stream:
                          result = subprocess.run(argv, cwd=cwd, env=environment, stdout=stream, stderr=subprocess.STDOUT, timeout=timeout)
                      row["exit_code"] = result.returncode
                  finally:
                      row["seconds"] = round(time.monotonic() - before, 3)
                      row["log_sha256"] = sha(log) if log.exists() else None
                      write(output / (name + ".json"), row)
                  require(result.returncode == 0, "Consumer command failed: " + name)
                  return log.read_bytes()
          
              try:
                  require(sys.platform == "win32", "Actual independent portable consumer requires Windows")
                  sys.path[:0] = [str(repository / "tools"), str(repository / "tools/ci")]
                  package = importlib.import_module("package_ramcache_strata")
                  require(Path(package.__file__).resolve() == repository / "tools/package_ramcache_strata.py", "Wrong consumer source module")
                  git_environment = package.lab.lab.clean_git_environment()
                  git_environment["PYTHONDONTWRITEBYTECODE"] = "1"
                  git = lambda *values: subprocess.check_output(["git", "-C", str(repository), *values], env=git_environment).decode().strip()
                  require(git("rev-parse", "HEAD") == config["source_commit"]
                          and git("rev-parse", "HEAD^{tree}") == config["source_tree"]
                          and not git("status", "--porcelain"), "Consumer checkout differs from the clean final source")
                  source = package.q.identity()
                  require(source["source_commit"] == config["source_commit"] and source["source_tree"] == config["source_tree"],
                          "Current source identity differs")
                  event("authenticating_final_main_and_published_artifacts")
                  producer = api("/actions/runs/" + str(config["producer_run"]), token)
                  require(producer["id"] == config["producer_run"] and producer["run_attempt"] == config["producer_attempt"]
                          and producer["head_sha"] == config["source_commit"] and producer["head_branch"] == "main"
                          and producer["event"] == "push" and producer["status"] == "completed"
                          and producer["conclusion"] == "success", "Producer was not a successful exact final-main push")
                  require(api("/branches/main", token)["commit"]["sha"] == config["source_commit"], "Main advanced before independent consumption")
                  report["producer_run_metadata"] = {key: producer[key] for key in (
                      "id", "run_attempt", "head_sha", "head_branch", "event", "status", "conclusion", "html_url")}
                  required_free = config["evaluator"]["size_in_bytes"] * 2 + config["inner"]["expanded_bytes"] + config["extracted"]["size_in_bytes"] + 1024 ** 3
                  require(shutil.disk_usage(work).free > required_free, "Insufficient independent runner disk for one archive and clean extraction")
                  report["disk_before"] = {"free": shutil.disk_usage(work).free, "required_with_margin": required_free}
                  artifact_records = {}
                  for label in ("evaluator", "extracted"):
                      destination = work / (label + "-original.zip")
                      artifact_records[label] = download_artifact(config[label], config["producer_run"], config["source_commit"], destination, token)
                  report["artifact_metadata"] = artifact_records
                  write(output / "artifact-metadata.json", artifact_records)
                  evaluator_root = work / "published outer artifact"
                  outer_members = extract_original(work / "evaluator-original.zip", evaluator_root, package.safe_name)
                  write(output / "evaluator-outer-members.json", outer_members)
                  inner_candidates = [p for p in evaluator_root.rglob("*.zip") if p.is_file()]
                  require(len(inner_candidates) == 1 and inner_candidates[0].name == config["inner"]["filename"], "Wrong or ambiguous published inner archive")
                  inner = inner_candidates[0]
                  require(inner.stat().st_size == config["inner"]["bytes"] and sha(inner) == config["inner"]["sha256"], "Published inner bytes differ from qualified identity")
                  identity = read(unique_suffix(evaluator_root, inner.with_suffix(".identity.json").name))
                  for key in ("filename", "bytes", "sha256", "expanded_bytes", "manifest_sha256"):
                      require(identity[key] == config["inner"][key], "Published package identity differs: " + key)
                  require(identity["source_commit"] == config["source_commit"] and identity["source_tree"] == config["source_tree"],
                          "Published package identity is cross-source")
                  report["inner_archive"] = identity
                  event("strictly_admitting_and_extracting_the_downloaded_inner_archive")
                  expected_files = package.inspect_archive(inner)
                  installation = work / "fresh independently downloaded installation"
                  installation.mkdir()
                  with zipfile.ZipFile(inner) as bundle:
                      require(bundle.testzip() is None, "Actual published inner ZIP CRC failed")
                      for name in expected_files:
                          target = installation / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with bundle.open(name) as src, target.open("xb") as dst:
                              shutil.copyfileobj(src, dst, 1024 * 1024)
                  require({name: sha(installation / name) for name in expected_files} == expected_files,
                          "Clean extraction differs from the actual published bytes")
                  manifest = package.verify(installation, pristine=True)
                  require(manifest["source_identity"] == source and sha(installation / package.MANIFEST) == identity["manifest_sha256"],
                          "Actual archive source or manifest differs from qualification")
                  require(manifest["runtime"]["cybersand_runtime"]["sha256"] == config["native_sha256"]
                          and manifest["runtime"]["rapier_runtime"]["sha256"] == config["rapier_sha256"],
                          "Actual published native runtime differs from the independently pinned retained runtime")
                  require(manifest["classic_default"] is True and manifest["objectshard_m4_included"] is False
                          and manifest["physical_gpu_acceptance_for_this_archive"] is False, "Wrong defaults or acceptance claims")
                  write(output / "evaluation-manifest.json", manifest)
                  report["downloaded_original_files"] = retain_downloaded_originals(
