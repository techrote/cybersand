name: RAMCACHE Strata portable verifier environment diagnosis

on:
  push:
    branches: [integration/ramcache-strata-package-diagnostic-20261128]
    paths: ['.github/workflows/ramcache-strata-package-diagnostic.yml']

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  JAVA_HOME: ''

jobs:
  verifier:
    name: Exercise shipped Windows verifier and observer module environment
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 746f95512606ffa61b446a4c93321b66f883b4e1
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute tracked Windows verifier and observer-environment controls
        run: |
          python -B tools/ci/test_ramcache_strata_qualification.py WindowsVerifierControls
          if ($LASTEXITCODE -ne 0) { throw 'Tracked Windows verifier controls failed' }
      - name: Independently record actual Windows 5.1 verifier and module outcomes
        run: |
          $driver = @'
          #!/usr/bin/env python3
          """Exercise exact shipped verification and the legacy observer environment on Windows."""
          from __future__ import annotations
          
          import argparse
          import hashlib
          import importlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time
          import traceback
          
          
          def sha(path: Path) -> str:
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          
          
          def write(path: Path, value: object) -> None:
              path.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          
          
          def require(value: bool, message: str) -> None:
              if not value:
                  raise RuntimeError(message)
          
          
          def main() -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--repository", type=Path, required=True)
              parser.add_argument("--expected-source", required=True)
              parser.add_argument("--output", type=Path, required=True)
              args = parser.parse_args()
              repository = args.repository.resolve(strict=True)
              output = args.output.resolve()
              require(not output.exists() and not output.is_relative_to(repository), "Use a fresh output outside source")
              output.mkdir(parents=True)
              started = time.monotonic()
              report = {
                  "schema": "ramcache-strata-payload-verifier-diagnostic-v2",
                  "status": "running", "diagnostic_only": True,
                  "full_installed_qualification_executed": False,
                  "scope": "Exact shipped Verify Package.ps1 on valid, altered and missing files plus unchanged observer commands/hash algorithms under its child-only corrected module environment; no actual loaded-module/evaluator acceptance or release publication.",
                  "expected_source": args.expected_source,
                  "runner_script_sha256": sha(Path(__file__)),
                  "workflow_run": os.environ.get("GITHUB_RUN_ID", ""),
                  "workflow_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                  "workflow_checkout": os.environ.get("GITHUB_SHA", ""),
                  "runner_image": {key: os.environ.get(key, "") for key in ("ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH")},
                  "commands": {},
              }
          
              def command(name: str, argv: list[str], environment: dict[str, str], cwd: Path) -> tuple[int, str]:
                  before = time.monotonic()
                  log = output / (name + ".log")
                  row = {"argv": argv, "cwd": str(cwd), "timeout_seconds": 180}
                  report["commands"][name] = row
                  try:
                      with log.open("wb") as stream:
                          result = subprocess.run(argv, cwd=cwd, env=environment, stdout=stream, stderr=subprocess.STDOUT, timeout=180)
                      row["exit_code"] = result.returncode
                  finally:
                      row["elapsed_seconds"] = round(time.monotonic() - before, 3)
                      row["log_sha256"] = sha(log) if log.exists() else None
                      write(output / (name + ".json"), row)
                      write(output / "diagnostic.json", report)
                  return result.returncode, log.read_text(encoding="utf-8", errors="replace")
          
              try:
                  require(sys.platform == "win32", "The actual shipped PowerShell verifier requires standard Windows")
                  sys.path[:0] = [str(repository / "tools"), str(repository / "tools/ci")]
                  package = importlib.import_module("package_ramcache_strata")
                  require(Path(package.__file__).resolve() == repository / "tools/package_ramcache_strata.py", "Wrong packager module")
                  git_environment = package.lab.lab.clean_git_environment()
                  git_environment["PYTHONDONTWRITEBYTECODE"] = "1"
                  git = lambda *arguments: subprocess.check_output(["git", "-C", str(repository), *arguments], env=git_environment).decode().strip()
                  head, tree = git("rev-parse", "HEAD"), git("rev-parse", "HEAD^{tree}")
                  require(head == args.expected_source and not git("status", "--porcelain"), "Wrong or dirty source checkout")
                  report.update(source_commit=head, source_tree=tree)
                  report["production_inputs_sha256"] = {name: sha(repository / name) for name in (
                      "tools/package_ramcache_strata.py", "tools/ci/ramcache_strata_lab_package.py", "tools/package_materials_lab_candidate.py",
                      "tools/ci/check_windows_package_modules.ps1")}
                  fixture = output / "verifier fixture with spaces"
                  (fixture / "payload").mkdir(parents=True)
                  payloads = {"payload/000-empty.bin": b"", "payload/001-abc.bin": b"abc",
                              "payload/002-multiblock.bin": bytes(range(256)) * 8192}
                  payloads.update({f"payload/{index:03d}-control.bin": f"CyberSand verifier control {index}\n".encode()
                                   for index in range(3, 101)})
                  expected = {name: hashlib.sha256(data).hexdigest() for name, data in payloads.items()}
                  require(expected["payload/000-empty.bin"] == "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                          and expected["payload/001-abc.bin"] == "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad",
                          "Independent SHA-256 known-answer controls failed")
                  for name, data in payloads.items():
                      (fixture / name).write_bytes(data)
                  script = fixture / "Verify Package.ps1"
                  script.write_text(package.VERIFY_PS1, encoding="utf-8", newline="\n")
                  write(fixture / "evaluation-manifest.json", {
                      "schema": "ramcache-strata-workbench-evaluation-v1", "source_commit": head, "files_sha256": expected})
                  write(output / "fixture-inputs.json", {
                      "files_sha256": expected, "files_bytes": {name: len(data) for name, data in payloads.items()},
                      "verifier_sha256": sha(script), "manifest_sha256": sha(fixture / "evaluation-manifest.json"),
                      "known_answers": {name: expected[name] for name in ("payload/000-empty.bin", "payload/001-abc.bin")}})
                  report["verifier_sha256"] = sha(script)
                  environment = package.lab.dependency_environment(fixture)
                  folded_environment = {key.upper(): value for key, value in environment.items()}
                  report["portable_environment"] = {key: folded_environment.get(key.upper(), "") for key in ("PATH", "PSModulePath", "SystemRoot", "PYTHONUTF8", "PYTHONNOUSERSITE")}
                  powershell = Path(os.environ.get("SystemRoot", r"C:\Windows")) / "System32/WindowsPowerShell/v1.0/powershell.exe"
                  require(powershell.is_file(), "Missing built-in Windows PowerShell executable")
                  report["powershell"] = {"path": str(powershell), "sha256": sha(powershell)}
                  prefix = [str(powershell), "-NoProfile", "-ExecutionPolicy", "Bypass"]
                  code, version = command("powershell-version", prefix + ["-Command", "$PSVersionTable.PSVersion.ToString()"], environment, fixture)
                  require(code == 0 and version.strip().startswith("5.1."), "Expected built-in Windows PowerShell 5.1")
                  argv = prefix + ["-File", str(script)]
                  code, log = command("valid-payload", argv, environment, fixture)
                  require(code == 0 and f"Verified {len(payloads)} original payload files. Application {head}" in log,
                          "Shipped verifier did not accept every known-good original file")
                  changed = fixture / "payload/001-abc.bin"
                  changed.write_bytes(b"abcd")
                  code, log = command("altered-payload", argv, environment, fixture)
                  require(code != 0 and "Changed payload: payload/001-abc.bin" in log, "Shipped verifier did not reject the altered file")
                  changed.write_bytes(payloads["payload/001-abc.bin"])
                  missing = fixture / "payload/000-empty.bin"
                  missing.unlink()
                  code, log = command("missing-payload", argv, environment, fixture)
                  require(code != 0 and "Missing payload: payload/000-empty.bin" in log, "Shipped verifier did not reject the missing file")
                  missing.write_bytes(payloads["payload/000-empty.bin"])
                  require({name: sha(fixture / name) for name in expected} == expected, "Fixture restoration or original file custody failed")
                  require(script.read_bytes() == package.VERIFY_PS1.encode("utf-8"), "Test altered the shipped verifier")
                  original_environment = dict(environment)
                  module_environment = package.windows_powershell_environment(environment)
                  require(environment == original_environment, "Observer preparation altered its parent environment")
                  require(module_environment == {key: value for key, value in environment.items() if key.upper() != "PSMODULEPATH"},
                          "Observer environment changed more than the inherited PowerShell module path")
                  require(module_environment["PATH"] == environment["PATH"], "Observer lost the actual portable application PATH")
                  probe = output / "module-observer-command-probe.ps1"
                  probe.write_text(r'''param([string]$Root)
          $ErrorActionPreference = 'Stop'
          $commands = [ordered]@{}
          foreach ($name in @('Get-FileHash', 'Get-Process', 'Start-Process', 'Get-Content', 'ConvertFrom-Json')) {
              $resolved = Get-Command -Name $name -ErrorAction Stop
              $commands[$name] = [ordered]@{ name = [string]$resolved.Name; type = [string]$resolved.CommandType; module = [string]$resolved.ModuleName }
          }
          $hashes = [ordered]@{}
          foreach ($name in @('payload/000-empty.bin', 'payload/001-abc.bin', 'payload/002-multiblock.bin')) {
              $hashes[$name] = (Get-FileHash -LiteralPath (Join-Path $Root $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          [ordered]@{ version = $PSVersionTable.PSVersion.ToString(); module_path = $env:PSModulePath; commands = $commands; hashes = $hashes } | ConvertTo-Json -Depth 6
          ''', encoding="utf-8", newline="\n")
                  code, log = command("module-observer-command-probe", prefix + ["-File", str(probe), "-Root", str(fixture)], module_environment, fixture)
                  require(code == 0, "Actual legacy observer command/module admission failed")
                  observed = json.loads(log)
                  command_names = ("Get-FileHash", "Get-Process", "Start-Process", "Get-Content", "ConvertFrom-Json")
                  require(observed.get("version", "").startswith("5.1.") and set(observed.get("commands", {})) == set(command_names),
                          "Legacy observer command inventory or PowerShell version differs")
                  for name in command_names:
                      require(observed["commands"][name]["name"] == name and observed["commands"][name]["type"], "Observer command failed resolution: " + name)
                  require(observed.get("hashes") == {name: expected[name] for name in (
                      "payload/000-empty.bin", "payload/001-abc.bin", "payload/002-multiblock.bin")}, "Get-FileHash disagrees with independent known-answer payloads")
                  require({name: sha(fixture / name) for name in expected} == expected and script.read_bytes() == package.VERIFY_PS1.encode("utf-8"),
                          "Observer command probe modified original fixture inputs")
                  report["module_observer_environment"] = {"removed_keys": sorted(key for key in environment if key.upper() == "PSMODULEPATH"),
                      "parent_unchanged": True, "portable_path_unchanged": True, "other_variables_unchanged": True,
                      "probe_script_sha256": sha(probe), "observed": observed,
                      "scope": "Actual WinPS command discovery and known-answer hashing only; final copied-application loaded-module probe still required."}
                  require(git("rev-parse", "HEAD") == head and git("rev-parse", "HEAD^{tree}") == tree and not git("status", "--porcelain"),
                          "Diagnostic changed source identity")
                  report["cases"] = {"valid": "accepted", "altered": "rejected with exact changed-file marker",
                                     "missing": "rejected with exact missing-file marker"}
                  report["fixture_restored"] = True
                  report["status"] = "passed_diagnostic_only"
                  return 0
              except BaseException as error:
                  report["status"] = "failed"
                  report["failure"] = {"type": type(error).__name__, "message": str(error)}
                  (output / "failure-traceback.log").write_text(traceback.format_exc(), encoding="utf-8")
                  return 1
              finally:
                  report["elapsed_seconds"] = round(time.monotonic() - started, 3)
                  report["retained_files_sha256"] = {path.relative_to(output).as_posix(): sha(path)
                      for path in output.rglob("*") if path.is_file() and path.name != "diagnostic.json"}
                  write(output / "diagnostic.json", report)
                  print(json.dumps({"status": report["status"], "diagnostic_only": True, "evidence": str(output),
                                    "diagnostic_sha256": sha(output / "diagnostic.json")}))
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          '@
          $driver = $driver.Replace("`r`n", "`n").TrimEnd([char[]]"`r`n") + "`n"
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/ramcache_strata_verifier_diagnostic.py", $driver, [System.Text.UTF8Encoding]::new($false))
          if ((Get-FileHash "$env:RUNNER_TEMP/ramcache_strata_verifier_diagnostic.py" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1cdd76f66b7ed93c5303f99a156476d094804155ac96344eaa095eac22c4bfd6') { throw 'External verifier diagnostic driver bytes changed' }
          python -B "$env:RUNNER_TEMP/ramcache_strata_verifier_diagnostic.py" --repository "$env:GITHUB_WORKSPACE" --expected-source 746f95512606ffa61b446a4c93321b66f883b4e1 --output "$env:RUNNER_TEMP/ramcache-verifier-diagnostic"
          if ($LASTEXITCODE -ne 0) { throw 'Actual independent Windows verifier diagnostic failed' }
      - name: Preserve original verifier evidence without publishing an evaluator
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramcache-strata-verifier-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ramcache-verifier-diagnostic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
