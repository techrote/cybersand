name: MS001 final integration source transfer

on:
  push:
    branches: [codex/issue-28-ms001]
    paths: [.github/workflows/ms001-final-transfer.yml]

permissions:
  contents: read

concurrency:
  group: ms001-final-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-28-ms001'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Bundle exact PR head and current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = 13a26b78b1ef4d6eafa5f2fc649c79976a2eb6ac
          test -z "$(git status --porcelain)"
          git fsck --full
          git lfs fsck
          mkdir "$RUNNER_TEMP/ms001-final"
          git bundle create "$RUNNER_TEMP/ms001-final/source.bundle" HEAD refs/remotes/origin/main
          tar -czf "$RUNNER_TEMP/ms001-final/lfs-objects.tar.gz" -C .git/lfs objects
          {
            printf 'source=%s\nmain=%s\n' "$GITHUB_SHA" "$(git rev-parse refs/remotes/origin/main)"
            git status --short --branch
            git lfs ls-files --long
          } > "$RUNNER_TEMP/ms001-final/identity.txt"
          (cd "$RUNNER_TEMP/ms001-final" && sha256sum source.bundle lfs-objects.tar.gz identity.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ms001-final-source-${{ github.sha }}
          path: ${{ runner.temp }}/ms001-final/
          if-no-files-found: error
          retention-days: 2
