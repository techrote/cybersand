name: PLAY Windows exception capture diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/play/*windows_crash*'
      - 'tools/play/*windows_build*'
      - '.github/workflows/play-windows-crash-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-windows-crash-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CAPTURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: ${{ github.workspace }}/evidence-play-crash
  PYTHONUTF8: '1'

jobs:
  windows-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Pin source checkout line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out exact diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CAPTURE_SHA }}
          path: source
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve source and run portable adverse controls
        working-directory: source
        run: |
          New-Item -ItemType Directory -Path $env:EVIDENCE_DIR | Out-Null
          if ((git rev-parse HEAD) -ne $env:CAPTURE_SHA) { throw 'Wrong source HEAD' }
          git rev-parse HEAD | Set-Content "$env:EVIDENCE_DIR/source-sha.txt"
          git rev-parse 'HEAD^{tree}' | Set-Content "$env:EVIDENCE_DIR/source-tree.txt"
          python tools/ci/check_ci_provider_policy.py | Tee-Object "$env:EVIDENCE_DIR/provider.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/play/test_windows_crash_contract.py 2>&1 | Tee-Object "$env:EVIDENCE_DIR/contracts.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O tools/play/test_windows_crash_contract.py 2>&1 | Tee-Object "$env:EVIDENCE_DIR/contracts-optimized.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/play/test_windows_build_process.py 2>&1 | Tee-Object "$env:EVIDENCE_DIR/build-contracts.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O tools/play/test_windows_build_process.py 2>&1 | Tee-Object "$env:EVIDENCE_DIR/build-contracts-optimized.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize accepted selected runtimes and pinned engine archive
        working-directory: source
        timeout-minutes: 6
        run: |
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          curl.exe --fail --location --connect-timeout 20 --max-time 240 --output "$env:RUNNER_TEMP/crash-godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile controls and diagnose the unchanged fixture once
        working-directory: source
        shell: cmd
        timeout-minutes: 12
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "CYBERSAND_CAPTURE_VS=%%i"
          if not defined CYBERSAND_CAPTURE_VS exit /b 1
          call "%CYBERSAND_CAPTURE_VS%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          python tools/play/run_windows_crash_capture.py --expected-source-sha "%CAPTURE_SHA%" --godot-archive "%RUNNER_TEMP%\crash-godot.zip" --output "%EVIDENCE_DIR%\campaign"
          exit /b %ERRORLEVEL%
      - name: Preserve every original result, failure, source pack and bounded dump
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: play-windows-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence-play-crash/
            !evidence-play-crash/campaign/engine/
          if-no-files-found: error
          retention-days: 30
