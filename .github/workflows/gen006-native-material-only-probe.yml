name: GEN006 native material-only negative control (experimental)

on:
  push:
    branches:
      - experiment/gen006-native-material-only-20261105
    paths:
      - native/tests/test_gen006_material_only_rehydration.cpp
      - .github/workflows/gen006-native-material-only-probe.yml
      - docs/audits/2026-11-05-gen006-native-material-only-control.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen006-native-material-probe
  cancel-in-progress: false

jobs:
  linux-real-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact diagnostic commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Record exact source and provider policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gen006-native-probe
          git rev-parse HEAD | tee build/gen006-native-probe/source-sha.txt
          git rev-parse HEAD^{tree} | tee build/gen006-native-probe/source-tree.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/ci/check_ci_provider_policy.py 2>&1 | tee build/gen006-native-probe/provider-policy.log
          g++-13 --version | head -n 1 | tee build/gen006-native-probe/compiler.txt

      - name: Build actual native World experimental probe
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          timeout 840s g++-13 -std=c++20 -O0 -g1 -pthread \
            -Wall -Wextra -Wpedantic -I native/include \
            native/src/world.cpp native/src/material_rules.cpp \
            native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp \
            native/tests/test_gen006_material_only_rehydration.cpp \
            -o build/gen006-native-probe/probe 2>&1 | tee build/gen006-native-probe/compile.log

      - name: Execute 1/4-worker native continuation and negative control
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 240s build/gen006-native-probe/probe 2>&1 | tee build/gen006-native-probe/observations.txt
          grep -q 'GEN006_NATIVE_FIXTURE_PASS' build/gen006-native-probe/observations.txt
          test "$(grep -c 'result=PASS' build/gen006-native-probe/observations.txt)" = 2

      - name: Preserve original source-matched evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen006-native-material-probe
          path: |
            build/gen006-native-probe/source-sha.txt
            build/gen006-native-probe/source-tree.txt
            build/gen006-native-probe/provider-policy.log
            build/gen006-native-probe/compiler.txt
            build/gen006-native-probe/compile.log
            build/gen006-native-probe/observations.txt
          if-no-files-found: warn
          retention-days: 45
