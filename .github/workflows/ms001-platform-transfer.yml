name: MS001 temporary bounded platform transfer
on:
  push:
    branches: [codex/issue-28-ms001]
    paths: [.github/workflows/ms001-platform-transfer.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ms001-platform-transfer
  cancel-in-progress: false
jobs:
  repack:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-28-ms001'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retrieve exact successful build and split transport only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ms001-web"
          mkdir "$root" "$RUNNER_TEMP/ms001-parts"
          timeout 10m gh run download 35413451506 -R techrote/cybersand -n ms001-web-inputs-964a9a81f2d3dced321e1693d52131e044d300bd -D "$root"
          (cd "$root" && sha256sum --check --strict SHA256SUMS)
          split -b 240M -d -a 2 "$root/development-inputs.tar.gz" "$RUNNER_TEMP/ms001-parts/sdk.part-"
          test "$(find "$RUNNER_TEMP/ms001-parts" -type f | wc -l)" -le 3
          (cd "$RUNNER_TEMP/ms001-parts" && sha256sum sdk.part-* > SHA256SUMS)
          mv "$RUNNER_TEMP/ms001-parts/SHA256SUMS" "$root/SHA256SUMS.parts"
          rm "$root/development-inputs.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ms001-web-runtime-and-templates
          path: ${{ runner.temp }}/ms001-web/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ms001-web-sdk-part-00
          path: ${{ runner.temp }}/ms001-parts/sdk.part-00
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ms001-web-sdk-part-01
          path: ${{ runner.temp }}/ms001-parts/sdk.part-01
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ms001-web-sdk-part-02
          path: ${{ runner.temp }}/ms001-parts/sdk.part-02
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
