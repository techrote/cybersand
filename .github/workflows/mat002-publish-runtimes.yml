name: MAT-002 publish source-matched runtimes

on:
  push:
    branches: [mat/material-fidelity-pass-2]
    paths: [.github/workflows/mat002-publish-runtimes.yml]

permissions:
  contents: read

concurrency:
  group: mat002-runtime-publication-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_HEAD: 6684017c96d1619fe853987f5098bff670b779c8
  PUBLICATION_BRANCH: mat/material-fidelity-pass-2
  PUBLISHER_PATH: .github/workflows/mat002-publish-runtimes.yml
  COMPANION_DOCS_COMMIT: 6a58311982941b75f46e22109a0829e5acb83c7e
  GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_VERSION: 4.7.stable.official.5b4e0cb0f
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65

jobs:
  build:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/mat/material-fidelity-pass-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    env:
      BUILD_TARGET: ${{ matrix.target }}
      CC: gcc-13
      CXX: g++-13
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact workflow installation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: ${{ matrix.target == 'linux' }}
          persist-credentials: false

      - name: Guard source identity and record build inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mat002-runtime"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          source = os.environ['SOURCE_HEAD']
          if not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('SOURCE_HEAD must be replaced with the frozen implementation SHA')
          if os.environ['GITHUB_REF'] != 'refs/heads/' + os.environ['PUBLICATION_BRANCH']:
              raise SystemExit('Unexpected publication branch')
          if git('rev-parse', 'HEAD') != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout differs from workflow installation commit')
          if git('show', '-s', '--format=%P', 'HEAD') != source:
              raise SystemExit('Publisher must be the immediate one-parent child of SOURCE_HEAD')
          if git('diff', '--name-status', source, 'HEAD') != 'A\t' + os.environ['PUBLISHER_PATH']:
              raise SystemExit('Publisher installation changed more than its own new workflow')
          if git('status', '--porcelain', '--untracked-files=no'):
              raise SystemExit('Build starts with unexpected tracked changes')
          manifests = [json.loads(pathlib.Path('godot/addons/cybersand_native', name).read_text())
                       for name in ('runtime-provenance.json', 'runtime-provenance.linux.json')]
          inputs = sorted(set().union(*(m['source_inputs'] for m in manifests)))
          build_paths = [
              'tools/build_native_extension.sh', 'tools/build_native_extension_windows.sh',
              'tools/build_pinned_godot_cpp.sh', 'tools/requirements-build.txt',
              'tools/toolchains/g++', 'tools/check_linux_runtime_floor.sh',
              'tools/ci/run_godot_regressions.py', 'Makefile', 'native/tests/test_world.cpp',
              'godot/tests/test_native_render_bridge_regression.gd',
              'godot/tests/test_native_edge_contact_regression.gd',
              'godot/tests/test_microscenario_native_observation.gd',
              'godot/tests/test_microscenarios.gd', 'godot/tests/test_material_appearance_lut.gd',
              'godot/tests/test_building_material_integration.gd',
              'third_party/native-toolchain.lock.json', 'third_party/godot-runtime.lock.json',
              'godot/third_party/rapier2d.lock.json',
          ]
          def source_digest(relative):
              committed = subprocess.check_output(['git', 'show', source + ':' + relative])
              actual = pathlib.Path(relative).read_bytes().replace(b'\r\n', b'\n')
              if actual != committed:
                  raise SystemExit('Build input differs from frozen source: ' + relative)
              return hashlib.sha256(committed).hexdigest()
          report = {
              'source_commit': source, 'source_tree': git('rev-parse', source + '^{tree}'),
              'build_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'target': os.environ['BUILD_TARGET'],
              'source_inputs': {p: source_digest(p) for p in inputs},
              'build_inputs': {p: source_digest(p) for p in build_paths},
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'mat002-runtime', 'source-inputs.json').write_text(
              json.dumps(report, indent=2) + '\n')
          print('Frozen source:', source, 'build commit:', report['build_commit'])
          PY

      - name: Install pinned SCons and check out pinned godot-cpp
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          test "$("$RUNNER_TEMP/scons/bin/python" -c 'import SCons; print(SCons.__version__)')" = '4.10.1'
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      - name: Prepare pinned LLVM-MinGW
        if: matrix.target == 'windows'
        run: |
          set -euo pipefail
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          test -x "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-g++"
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then
            ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
          fi

      - name: Build fresh Linux runtime with pinned scripts
        if: matrix.target == 'linux'
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/mat002-runtime/libcybersand_native.linux.x86_64.so
        run: |
          set -euo pipefail
          timeout 35m tools/build_pinned_godot_cpp.sh linux 2>&1 | tee "$RUNNER_TEMP/mat002-runtime/godot-cpp-build.log"
          timeout 20m tools/build_native_extension.sh 2>&1 | tee "$RUNNER_TEMP/mat002-runtime/extension-build.log"
          file "$CYBERSAND_NATIVE_OUTPUT" | tee "$RUNNER_TEMP/mat002-runtime/runtime-format.txt"
          grep -q 'ELF 64-bit.*x86-64' "$RUNNER_TEMP/mat002-runtime/runtime-format.txt"
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          timeout 1m tools/check_linux_runtime_floor.sh 2>&1 | tee "$RUNNER_TEMP/mat002-runtime/linux-runtime-floor.log"

      - name: Build fresh Windows runtime with pinned scripts
        if: matrix.target == 'windows'
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/mat002-runtime/cybersand_native.windows.x86_64.dll
        run: |
          set -euo pipefail
          timeout 35m tools/build_pinned_godot_cpp.sh windows 2>&1 | tee "$RUNNER_TEMP/mat002-runtime/godot-cpp-build.log"
          timeout 20m tools/build_native_extension_windows.sh 2>&1 | tee "$RUNNER_TEMP/mat002-runtime/extension-build.log"
          file "$CYBERSAND_NATIVE_OUTPUT" | tee "$RUNNER_TEMP/mat002-runtime/runtime-format.txt"
          grep -q 'PE32+ executable (DLL).*x86-64' "$RUNNER_TEMP/mat002-runtime/runtime-format.txt"
          "$LLVM_MINGW_ROOT/bin/llvm-objdump" -p "$CYBERSAND_NATIVE_OUTPUT" > "$RUNNER_TEMP/mat002-runtime/windows-imports.txt"

      - name: Run the current core native suite
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          timeout 15m make build/tests 2>&1 | tee "$RUNNER_TEMP/mat002-runtime/native-build.log"
          timeout 15m ./build/tests 2>&1 | tee "$RUNNER_TEMP/mat002-runtime/native-tests.log"

      - name: Prepare exact Linux Godot runtime
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          echo '147ab5673b9687ccb7a3b12fec07ea55cc674ad8a75f529d1085bf7d61fbd831  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' | sha256sum --check --strict
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = "$GODOT_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Exercise the actual rebuilt Linux GDExtension
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('tools/ci').resolve()))
          from run_godot_regressions import Case, ROOT, run_case
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'mat002-runtime')
          cases = [Case('import', ('--editor', '--quit'), 240, 3.0)]
          cases += [Case(name, ('--script', 'res://tests/' + name + '.gd'), 180, 5.0)
                    for name in ('test_native_render_bridge_regression',
                                 'test_native_edge_contact_regression',
                                 'test_microscenario_native_observation',
                                 'test_microscenarios', 'test_material_appearance_lut',
                                 'test_building_material_integration')]
          records = []
          for case in cases:
              record, failed = run_case(os.environ['GODOT_BIN'], case, output, 'publisher-smoke')
              record['command'] = [os.environ['GODOT_BIN'], '--headless', '--path', str(ROOT / 'godot'), *case.flags]
              record['cwd'] = str(ROOT)
              records.append(record)
              (output / 'godot-smoke.json').write_text(json.dumps(records, indent=2) + '\n')
              if failed:
                  raise SystemExit(1)
          PY

      - name: Record exact artifact bytes and validation scope
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so'
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'mat002-runtime')
          report = json.loads((output / 'source-inputs.json').read_text())
          target = os.environ['BUILD_TARGET']
          artifact = ('libcybersand_native.linux.x86_64.so' if target == 'linux'
                      else 'cybersand_native.windows.x86_64.dll')
          data = (output / artifact).read_bytes()
          if data.startswith(b'version https://git-lfs.github.com/spec/v1\n'):
              raise SystemExit('Build produced a pointer instead of a runtime')
          for relative, expected in report['source_inputs'].items():
              actual = hashlib.sha256(pathlib.Path(relative).read_bytes().replace(b'\r\n', b'\n')).hexdigest()
              if actual != expected:
                  raise SystemExit('Source changed during build: ' + relative)
          def first_line(command):
              return subprocess.check_output(command, text=True).splitlines()[0]
          compiler = ['/usr/bin/g++-13', '--version'] if target == 'linux' else [
              os.environ['RUNNER_TEMP'] + '/llvm-mingw/bin/x86_64-w64-mingw32-g++', '--version']
          platform_tools = [first_line(['ld', '--version'])] if target == 'linux' else [
              'LLVM-MinGW 20260826 UCRT archive SHA-256 ' + os.environ['LLVM_MINGW_SHA256'],
              'PE inspector: ' + first_line([os.environ['RUNNER_TEMP'] + '/llvm-mingw/bin/llvm-objdump', '--version']),
          ]
          report.update({
              'artifact': artifact, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data),
              'toolchain': ['Ubuntu 24.04', first_line(compiler), *platform_tools,
                            'godot-cpp ' + os.environ['GODOT_CPP_COMMIT'], 'SCons 4.10.1'],
              'native_core_suite': 'passed' if target == 'linux' else 'not-run',
              'godot_smoke': json.loads((output / 'godot-smoke.json').read_text()) if target == 'linux' else [],
              'godot_version': os.environ['GODOT_VERSION'] if target == 'linux' else None,
              'windows_execution': 'not-run', 'full_ready_ci': 'separate-pending-gate',
              'log_sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                             for p in sorted(output.glob('*.log'))},
          })
          (output / 'build-report.json').write_text(json.dumps(report, indent=2) + '\n')
          (output / 'runtime.sha256').write_text(report['sha256'] + '  ' + artifact + '\n')
          print(target, artifact, report['sha256'], report['size'])
          PY

      - name: Retain fresh runtime and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat002-runtime-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mat002-runtime/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  windows-execution:
    name: Windows headless execution of rebuilt MAT-002 runtime
    needs: build
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/mat/material-fidelity-pass-2'
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
      GODOT_WINDOWS_SHA512: 41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out exact workflow installation commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set Windows artifact and evidence directories
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write('WINDOWS_RUNTIME_ARTIFACT=' + (temporary / 'mat002-windows-runtime').as_posix() + '\n')
              environment.write('WINDOWS_VALIDATION_OUTPUT=' + (temporary / 'mat002-windows-execution').as_posix() + '\n')
          PY

      - name: Restore same-run rebuilt Windows runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mat002-runtime-windows-${{ github.run_id }}
          path: ${{ env.WINDOWS_RUNTIME_ARTIFACT }}

      - name: Materialize only pinned Windows Rapier
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""

      - name: Verify source, runtime artifact and Windows Rapier identities
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          root = pathlib.Path.cwd()
          artifact = pathlib.Path(os.environ['WINDOWS_RUNTIME_ARTIFACT'])
          output = pathlib.Path(os.environ['WINDOWS_VALIDATION_OUTPUT'])
          output.mkdir(parents=True, exist_ok=True)
          report = json.loads((artifact / 'build-report.json').read_text(encoding='utf-8'))
          if report['source_commit'] != os.environ['SOURCE_HEAD']:
              raise SystemExit('Windows artifact source_commit does not match SOURCE_HEAD')
          if report['build_commit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Windows artifact build_commit does not match this workflow commit')
          if str(report['run_id']) != os.environ['GITHUB_RUN_ID']:
              raise SystemExit('Windows artifact is not from this workflow run')
          if report.get('target') != 'windows' or report.get('artifact') != 'cybersand_native.windows.x86_64.dll':
              raise SystemExit('Unexpected Windows artifact target or filename')
          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if checkout != os.environ['GITHUB_SHA']:
              raise SystemExit('Windows test checkout does not match build_commit')
          data = (artifact / report['artifact']).read_bytes()
          if not data.startswith(b'MZ') or len(data) != report['size'] or hashlib.sha256(data).hexdigest() != report['sha256']:
              raise SystemExit('Windows runtime PE bytes/size/hash do not match build report')
          for relative, expected in report['source_inputs'].items():
              actual = hashlib.sha256((root / relative).read_bytes().replace(b'\r\n', b'\n')).hexdigest()
              if actual != expected:
                  raise SystemExit('Windows source input differs from built runtime: ' + relative)
          rapier = root / 'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'
          rapier_sha = hashlib.sha256(rapier.read_bytes()).hexdigest()
          if rapier_sha != '4e26ffa78ec2aaff434c4a70cd2ec85288b10ba5237912c35f204cb1e6ed2180':
              raise SystemExit('Windows Rapier does not match the pinned official runtime')
          installed = root / 'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll'
          shutil.copy2(artifact / report['artifact'], installed)
          if hashlib.sha256(installed.read_bytes()).hexdigest() != report['sha256']:
              raise SystemExit('Installed Windows runtime differs from the validated artifact')
          shutil.copy2(artifact / 'build-report.json', output / 'runtime-build-report.json')
          shutil.copy2(artifact / 'source-inputs.json', output / 'runtime-source-inputs.json')
          print('Windows execution source:', report['source_commit'])
          print('Windows execution runtime SHA-256:', report['sha256'])
          print('Windows Rapier SHA-256:', rapier_sha)
          PY

      - name: Prepare exact official Godot 4.7 Windows runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 --output "$RUNNER_TEMP/godot-windows.zip" "$GODOT_WINDOWS_URL"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          archive = pathlib.Path(os.environ['RUNNER_TEMP'], 'godot-windows.zip')
          data = archive.read_bytes()
          digest = hashlib.sha512(data).hexdigest()
          if digest != os.environ['GODOT_WINDOWS_SHA512']:
              raise SystemExit('Official Windows Godot archive SHA-512 mismatch')
          directory = pathlib.Path(os.environ['RUNNER_TEMP'], 'godot-windows')
          with zipfile.ZipFile(archive) as bundle:
              if bundle.testzip() is not None:
                  raise SystemExit('Official Windows Godot ZIP integrity failure')
              bundle.extractall(directory)
          binary = directory / 'Godot_v4.7-stable_win64_console.exe'
          if not binary.is_file():
              raise SystemExit('Official Windows console executable is missing')
          version = subprocess.check_output([str(binary), '--version'], text=True).strip()
          if version != os.environ['GODOT_VERSION']:
              raise SystemExit('Windows Godot version mismatch: ' + version)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write('GODOT_BIN=' + str(binary) + '\n')
          identity = {'version': version, 'archive_size': len(data), 'archive_sha512': digest,
                      'console_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                      'runtime_sha256': hashlib.sha256((directory / 'Godot_v4.7-stable_win64.exe').read_bytes()).hexdigest()}
          pathlib.Path(os.environ['WINDOWS_VALIDATION_OUTPUT'], 'godot-identity.json').write_text(
              json.dumps(identity, indent=2) + '\n', encoding='utf-8')
          print(version)
          PY

      - name: Execute all applicable Windows headless tests and retain complete results
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          import hashlib, json, os, pathlib, platform, subprocess, sys, time
          sys.path.insert(0, str(pathlib.Path('tools/ci').resolve()))
          from run_godot_regressions import Case, ROOT, discover_cases, run_case, runtime_paths, sha256, write_json
          if sys.platform != 'win32':
              raise SystemExit('This acceptance lane requires actual Windows execution')
          os.environ['CYBERSAND_SOURCE_REVISION'] = os.environ['SOURCE_HEAD']
          output = pathlib.Path(os.environ['WINDOWS_VALIDATION_OUTPUT'])
          runtime_build = json.loads((output / 'runtime-build-report.json').read_text(encoding='utf-8'))
          native, rapier = runtime_paths()
          all_cases = discover_cases()
          selected = [case for case in all_cases if not case.requires_display]
          excluded = [case for case in all_cases if case.requires_display]
          if Counter(case.name for case in all_cases) != Counter(case.name for case in selected + excluded):
              raise SystemExit('Windows scope partition omitted or duplicated a discovered case')
          if any(count != 1 for count in Counter(case.name for case in all_cases).values()):
              raise SystemExit('Windows discovery contains duplicate cases')
          source_paths = [path for path in (ROOT / 'godot').rglob('*')
                          if path.is_file() and '.godot' not in path.parts and
                          (path.suffix in ('.gd', '.gdshader', '.tscn', '.tres', '.gdextension') or path.name == 'project.godot')]
          tested_inputs = {path.relative_to(ROOT).as_posix(): sha256(path) for path in sorted(source_paths)}
          tested_inputs['tools/ci/run_godot_regressions.py'] = sha256(ROOT / 'tools/ci/run_godot_regressions.py')
          results = []
          report = {
              'source_commit': runtime_build['source_commit'], 'build_commit': runtime_build['build_commit'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'platform': platform.platform(), 'python_version': platform.python_version(),
              'godot_version': subprocess.check_output([os.environ['GODOT_BIN'], '--version'], text=True).strip(),
              'cybersand_runtime': {'path': native.relative_to(ROOT).as_posix(), 'sha256': sha256(native), 'size': native.stat().st_size},
              'rapier_runtime': {'path': rapier.relative_to(ROOT).as_posix(), 'sha256': sha256(rapier), 'size': rapier.stat().st_size},
              'scope': 'Actual Windows headless logic, profiles and scene startup; graphical pixel cases require the separate Linux rendering gate',
              'out_of_scope_graphical_cases': [case.name for case in excluded],
              'all_discovered_case_count': len(all_cases), 'applicable_case_count': len(selected),
              'assigned_cases': [case.name for case in selected], 'tested_inputs': tested_inputs,
              'status': 'running', 'completed': False, 'results': results,
          }
          if report['cybersand_runtime']['sha256'] != runtime_build['sha256']:
              raise SystemExit('Windows test runtime was replaced after artifact verification')
          write_json(output / 'windows-execution.json', report)
          started = time.monotonic()
          record, failed = run_case(os.environ['GODOT_BIN'], Case('import', ('--editor', '--quit'), 240, 3.0), output, 'preflight')
          results.append(record)
          if not failed:
              for case in selected:
                  record, _failed = run_case(os.environ['GODOT_BIN'], case, output, 'case')
                  results.append(record)
                  write_json(output / 'windows-execution.json', report)
              report['completed'] = True
          drift = [relative for relative, expected in tested_inputs.items() if sha256(ROOT / relative) != expected]
          report['source_drift'] = drift
          report['status'] = 'passed' if report['completed'] and not drift and all(record['status'] == 'passed' for record in results) else 'failed'
          report['seconds'] = round(time.monotonic() - started, 3)
          report['executed_case_count'] = sum(record['role'] == 'case' for record in results)
          report['log_sha256'] = {path.name: sha256(path) for path in sorted(output.glob('*.log'))}
          write_json(output / 'windows-execution.json', report)
          print('Windows execution:', report['status'], 'executed', report['executed_case_count'], '/', len(selected), 'applicable cases')
          raise SystemExit(0 if report['status'] == 'passed' else 1)
          PY

      - name: Retain actual Windows execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat002-windows-execution-${{ github.run_id }}
          path: ${{ env.WINDOWS_VALIDATION_OUTPUT }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    needs: [build, windows-execution]
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/mat/material-fidelity-pass-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: workspace/source
    steps:
      - name: Check out the pinned companion documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.COMPANION_DOCS_COMMIT }}
          path: workspace
          persist-credentials: false

      - name: Check out the exact publication branch head with LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: workspace/source
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Refuse publication if source or branch ownership moved
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$PUBLICATION_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$SOURCE_HEAD"
          test "$(git diff --name-only "$SOURCE_HEAD" HEAD)" = "$PUBLISHER_PATH"
          test "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code

      - name: Download this run's fresh Linux runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mat002-runtime-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/mat002-incoming/linux

      - name: Download this run's fresh Windows runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mat002-runtime-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/mat002-incoming/windows

      - name: Download this run's actual Windows execution evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mat002-windows-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/mat002-incoming/windows-execution

      - name: Verify and install artifacts with truthful new provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          root = pathlib.Path('.')
          incoming = pathlib.Path(os.environ['RUNNER_TEMP'], 'mat002-incoming')
          retained = pathlib.Path(os.environ['RUNNER_TEMP'], 'mat002-publication')
          retained.mkdir()
          run_url = 'https://github.com/techrote/cybersand/actions/runs/' + os.environ['GITHUB_RUN_ID']
          source_tree = subprocess.check_output(
              ['git', 'rev-parse', os.environ['SOURCE_HEAD'] + '^{tree}'], text=True).strip()
          expected_inputs = set()
          for name in ('runtime-provenance.json', 'runtime-provenance.linux.json'):
              expected_inputs.update(json.loads((root / 'godot/addons/cybersand_native' / name).read_text())['source_inputs'])
          expected_smoke = {'import', 'test_native_render_bridge_regression',
                            'test_native_edge_contact_regression', 'test_microscenario_native_observation',
                            'test_microscenarios', 'test_material_appearance_lut',
                            'test_building_material_integration'}
          windows_folder = incoming / 'windows-execution'
          windows_execution = json.loads((windows_folder / 'windows-execution.json').read_text())
          sys.path.insert(0, str(pathlib.Path('tools/ci').resolve()))
          from run_godot_regressions import discover_cases
          cases = discover_cases()
          expected_windows = [case.name for case in cases if not case.requires_display]
          expected_graphical = [case.name for case in cases if case.requires_display]
          for key, value in {'source_commit': os.environ['SOURCE_HEAD'],
                             'build_commit': os.environ['GITHUB_SHA'],
                             'run_id': os.environ['GITHUB_RUN_ID'],
                             'godot_version': os.environ['GODOT_VERSION'],
                             'status': 'passed', 'completed': True,
                             'all_discovered_case_count': len(cases),
                             'applicable_case_count': len(expected_windows),
                             'executed_case_count': len(expected_windows),
                             'assigned_cases': expected_windows,
                             'out_of_scope_graphical_cases': expected_graphical,
                             'source_drift': []}.items():
              if windows_execution.get(key) != value:
                  raise SystemExit('Windows execution evidence mismatch: ' + key)
          if not windows_execution.get('platform', '').startswith('Windows-'):
              raise SystemExit('Windows evidence did not execute on Windows')
          windows_results = windows_execution['results']
          if [record['name'] for record in windows_results] != ['import', *expected_windows]:
              raise SystemExit('Windows execution case order/coverage mismatch')
          if any(record.get('status') != 'passed' or record.get('returncode') != 0 or
                 record.get('diagnostic_error') or record.get('launch_error') or
                 record.get('skip_messages') or record.get('requires_display') or
                 '--headless' not in record.get('command', []) for record in windows_results):
              raise SystemExit('An applicable Windows test failed, skipped or did not execute headlessly')
          tracked = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', os.environ['SOURCE_HEAD'], 'godot'], text=True).splitlines()
          expected_tested = {relative for relative in tracked if '.godot' not in pathlib.PurePosixPath(relative).parts and
                             (pathlib.PurePosixPath(relative).suffix in ('.gd', '.gdshader', '.tscn', '.tres', '.gdextension') or
                              pathlib.PurePosixPath(relative).name == 'project.godot')}
          expected_tested.add('tools/ci/run_godot_regressions.py')
          if set(windows_execution['tested_inputs']) != expected_tested:
              raise SystemExit('Windows test-source inventory differs from frozen source')
          for relative, digest in windows_execution['tested_inputs'].items():
              committed = subprocess.check_output(['git', 'show', os.environ['SOURCE_HEAD'] + ':' + relative])
              if hashlib.sha256(committed).hexdigest() != digest:
                  raise SystemExit('Windows tested input differs from canonical source: ' + relative)
          expected_logs = {record['log'] for record in windows_results}
          if not expected_logs <= set(windows_execution['log_sha256']):
              raise SystemExit('Windows execution is missing required raw logs')
          for name, digest in windows_execution['log_sha256'].items():
              if pathlib.Path(name).name != name or hashlib.sha256((windows_folder / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Windows execution log identity mismatch')
          if windows_execution['rapier_runtime']['sha256'] != '4e26ffa78ec2aaff434c4a70cd2ec85288b10ba5237912c35f204cb1e6ed2180':
              raise SystemExit('Windows execution used a different Rapier runtime')
          shutil.copytree(windows_folder, retained / 'windows-execution')
          reports = {}
          for target in ('linux', 'windows'):
              folder = incoming / target
              report = json.loads((folder / 'build-report.json').read_text())
              for key, value in {'source_commit': os.environ['SOURCE_HEAD'], 'source_tree': source_tree,
                                 'build_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                                 'target': target}.items():
                  if report.get(key) != value:
                      raise SystemExit('Runtime build identity mismatch: ' + target + '/' + key)
              if set(report['source_inputs']) != expected_inputs:
                  raise SystemExit('Runtime report changed the required source input set')
              for relative, expected in (report['source_inputs'] | report['build_inputs']).items():
                  data = (root / relative).read_bytes().replace(b'\r\n', b'\n')
                  committed = subprocess.check_output(['git', 'show', os.environ['SOURCE_HEAD'] + ':' + relative])
                  if data != committed or hashlib.sha256(data).hexdigest() != expected:
                      raise SystemExit('Runtime source input mismatch: ' + relative)
              filename = ('libcybersand_native.linux.x86_64.so' if target == 'linux'
                          else 'cybersand_native.windows.x86_64.dll')
              if report['artifact'] != filename:
                  raise SystemExit('Unexpected runtime artifact path')
              data = (folder / filename).read_bytes()
              if data.startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                  raise SystemExit('Runtime payload is an LFS pointer')
              if hashlib.sha256(data).hexdigest() != report['sha256'] or len(data) != report['size']:
                  raise SystemExit('Runtime bytes differ from their build report')
              for name, digest in report['log_sha256'].items():
                  if pathlib.Path(name).name != name or hashlib.sha256((folder / name).read_bytes()).hexdigest() != digest:
                      raise SystemExit('Build log identity mismatch')
              if target == 'linux':
                  smoke = report['godot_smoke']
                  if report['native_core_suite'] != 'passed' or report['godot_version'] != os.environ['GODOT_VERSION']:
                      raise SystemExit('Fresh Linux runtime execution evidence is incomplete')
                  if len(smoke) != len(expected_smoke) or {r['name'] for r in smoke} != expected_smoke:
                      raise SystemExit('Focused Godot case accounting is incomplete')
                  if any(r['status'] != 'passed' or r['returncode'] != 0 or r['diagnostic_error'] for r in smoke):
                      raise SystemExit('Focused Godot case failed')
              elif report['windows_execution'] != 'not-run' or report['native_core_suite'] != 'not-run' or report['godot_smoke']:
                  raise SystemExit('Windows cross-build must not claim native execution')
              if target == 'windows':
                  tested_runtime = windows_execution['cybersand_runtime']
                  if (tested_runtime['sha256'] != report['sha256'] or tested_runtime['size'] != report['size'] or
                      tested_runtime['path'] != 'godot/addons/cybersand_native/bin/' + filename):
                      raise SystemExit('Published Windows DLL differs from the actually executed DLL')
              artifact = 'godot/addons/cybersand_native/bin/' + filename
              shutil.copy2(folder / filename, root / artifact)
              manifest = {
                  'schema_version': 1,
                  'status': 'validated-development-runtime',
                  'source_commit': os.environ['SOURCE_HEAD'], 'source_tree': source_tree,
                  'artifact': artifact, 'sha256': report['sha256'], 'size': report['size'],
                  'source_input_hash_kind': 'SHA-256 of canonical Git blob bytes; CRLF working files normalize to LF',
                  'source_inputs': report['source_inputs'],
                  'build_inputs': report['build_inputs'], 'build_commit': report['build_commit'],
                  'evidence': 'docs/audits/2026-10-19-mat002-review-and-validation.md',
                  'validated_platform': ('Linux x86_64 Godot 4.7' if target == 'linux' else
                                         'Windows x86_64 Godot 4.7 (GitHub-hosted Windows headless execution)'),
                  'toolchain': '; '.join(report['toolchain']),
                  'acceptance': (
                      'Fresh MAT-002 source passed the full core native suite. This exact rebuilt Linux GDExtension passed '
                      'Godot import, native render bridge, native edge/contact, MicroScenario native observation, '
                      'MicroScenario INT-profile (56 pair rules), appearance LUT and all-51-building integration cases '
                      'in publication run ' + os.environ['GITHUB_RUN_ID'] + '. Full ready-for-review CI is a separate gate.'
                      if target == 'linux' else
                      'Fresh MAT-002 source Windows x86_64 GDExtension cross-build and PE format inspection passed in '
                      'publication run ' + os.environ['GITHUB_RUN_ID'] + '. The identical DLL passed Godot import and all ' +
                      str(len(expected_windows)) + ' applicable headless cases on Windows; graphical cases are a separate Linux gate.'
                  ),
                  'workflow_run': run_url,
                  'workflow_attempt': (report['run_attempt'] if target == 'linux' else windows_execution['run_attempt']),
                  'build_attempt': report['run_attempt'],
                  'validation_output': ('mat002-runtime-linux-' + os.environ['GITHUB_RUN_ID'] + '/build-report.json' if target == 'linux' else
                                        'mat002-windows-execution-' + os.environ['GITHUB_RUN_ID'] + '/windows-execution.json'),
                  'other_platforms': ('Linux and Windows are built from matching native inputs and executed with Godot 4.7. '
                                      'Graphical pixel checks remain a separate Linux gate. No new browser/WebAssembly, '
                                      'owner visual acceptance, target-PC or GPU performance claim is made by this publisher.'),
              }
              name = 'runtime-provenance.linux.json' if target == 'linux' else 'runtime-provenance.json'
              destination = root / 'godot/addons/cybersand_native' / name
              destination.write_text(json.dumps(manifest, indent=2) + '\n')
              shutil.copytree(folder, retained / target)
              shutil.copy2(destination, retained / name)
              reports[target] = report
          if reports['linux']['source_inputs'] != reports['windows']['source_inputs']:
              raise SystemExit('Platform builds used different native source inputs')
          (retained / 'publication-source.json').write_text(json.dumps({
              'source_commit': os.environ['SOURCE_HEAD'], 'source_tree': source_tree,
              'installation_commit': os.environ['GITHUB_SHA'], 'workflow_run': run_url,
          }, indent=2) + '\n')
          PY
          timeout 1m tools/check_linux_runtime_floor.sh
          git diff --check

      - name: Create only the LFS runtime publication and remove this workflow
        run: |
          set -euo pipefail
          git lfs install --local
          git add -- godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so godot/addons/cybersand_native/runtime-provenance.json godot/addons/cybersand_native/runtime-provenance.linux.json
          git rm -- "$PUBLISHER_PATH"
          python3 - <<'PY'
          import os, subprocess
          allowed = {'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll',
                     'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so',
                     'godot/addons/cybersand_native/runtime-provenance.json',
                     'godot/addons/cybersand_native/runtime-provenance.linux.json', os.environ['PUBLISHER_PATH']}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          required = {os.environ['PUBLISHER_PATH'], 'godot/addons/cybersand_native/runtime-provenance.json',
                      'godot/addons/cybersand_native/runtime-provenance.linux.json'}
          if not required <= changed <= allowed:
              raise SystemExit('Unexpected staged publication write set: ' + repr(changed))
          if subprocess.check_output(['git', 'diff', '--name-only'], text=True).strip():
              raise SystemExit('Unexpected unstaged tracked changes')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(mat002): publish source-matched native runtimes'
          test "$(git show -s --format=%P HEAD)" = "$GITHUB_SHA"

      - name: Verify the committed materialized runtime gate
        run: |
          set -euo pipefail
          timeout 1m python3 tools/ci/check_ci_provider_policy.py
          timeout 5m python3 tools/ci/check_repository.py --require-materialized 2>&1 | tee "$RUNNER_TEMP/mat002-publication/repository-materialized.log"
          timeout 5m git lfs fsck 2>&1 | tee "$RUNNER_TEMP/mat002-publication/lfs-fsck.log"
          git diff --exit-code HEAD
          git diff --check HEAD

      - name: Push the verified descendant only if the branch head is unchanged
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$PUBLICATION_BRANCH"
          test "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$GITHUB_SHA"
          git push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin "HEAD:$GITHUB_REF"
          test "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$RUNNER_TEMP/mat002-publication/published-commit.txt"
          echo 'Runtime publication complete. Final normal CI must be triggered and accepted separately on the new PR head.' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain publication payloads, manifests, and gate logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat002-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/mat002-publication/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
