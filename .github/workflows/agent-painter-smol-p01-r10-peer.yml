name: SMOL P01 vs R10 original-native peer (research only)
on:
  push:
    branches: [codex/agent-painter-smol-568]
    paths:
      - experiments/agent_painter/lanes/smol/p01-r10-peer-request.json
permissions:
  contents: read
  actions: read
concurrency:
  group: smol-p01-r10-original-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-pair-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce exact source, two archived native producers and non-training scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/codex/agent-painter-smol-568
          test "$GITHUB_REPOSITORY" = techrote/cybersand
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p evidence/smol-p01-r10/original
          echo "INCOMPLETE_NOT_ADMITTED" > evidence/smol-p01-r10/incomplete.txt
          git rev-parse HEAD > evidence/smol-p01-r10/source-head.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("experiments/agent_painter/lanes/smol/p01-r10-peer-request.json").read_text())
          assert r == {
            "schema":"cybersand.smol-p01-r10-native-peer-request/1",
            "sequence":1,
            "smol_run":43601281142,
            "smol_artifact":14117110667,
            "sprocket_run":43582224721,
            "sprocket_artifact":14109121755,
            "seeds":[104729,130363],
            "original_native_bytes_only":True,
            "final_access":False,
            "new_native_execution":False,
            "optimizer_training":False,
            "global_train_admission":False,
            "draft_hold":True
          }
          PY
          python3 -m py_compile experiments/agent_painter/lanes/smol/p01_r10_original_peer.py experiments/agent_painter/lanes/smol/test_p01_r10_original_peer.py
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/smol-p01-r10-scheduling.json
      - name: Retrieve immutable GitHub original source-built native archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/techrote/cybersand/actions/artifacts/14117110667/zip" \
            -o evidence/smol-p01-r10/original/p01.zip
          curl -fLsS --retry 3 --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/techrote/cybersand/actions/artifacts/14109121755/zip" \
            -o evidence/smol-p01-r10/original/r10.zip
          echo '71ddc40478e06e3350f05eecd5e16ed77c082300f066be97bbccf8afb2370ff1  evidence/smol-p01-r10/original/p01.zip' | sha256sum -c --strict
          echo 'f7e673c414487668598eb26dc618daa019b2fc83bc70ed373cd574049f20e53c  evidence/smol-p01-r10/original/r10.zip' | sha256sum -c --strict
          sha256sum evidence/smol-p01-r10/original/*.zip > evidence/smol-p01-r10/original-sha256.txt
      - name: Read original acknowledged material pixels and test proximity in both directions
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/smol-p01-r10"
          "$RUNNER_TEMP/smol-p01-r10/bin/python" -m pip install 'Pillow==13.0.0'
          "$RUNNER_TEMP/smol-p01-r10/bin/python" -m pip check
          export SMOL_P01_NATIVE="$PWD/evidence/smol-p01-r10/original/p01.zip"
          export SPROCKET_R10_NATIVE="$PWD/evidence/smol-p01-r10/original/r10.zip"
          "$RUNNER_TEMP/smol-p01-r10/bin/python" -m unittest discover \
            -s experiments/agent_painter/lanes/smol -p test_p01_r10_original_peer.py -v
          "$RUNNER_TEMP/smol-p01-r10/bin/python" experiments/agent_painter/lanes/smol/p01_r10_original_peer.py \
            --p01 "$SMOL_P01_NATIVE" --r10 "$SPROCKET_R10_NATIVE" \
            --proposals experiments/agent_painter/lanes/smol/curriculum_proposals_v2.json \
            --offer experiments/agent_painter/lanes/smol/P01_SHARED_ADMISSION_REVIEW_OFFER.json \
            --output evidence/smol-p01-r10/report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("evidence/smol-p01-r10/report.json").read_text())
          assert d["status"]=="ORIGINAL_NATIVE_PEER_DIAGNOSTIC_REVIEW_ONLY"
          assert d["seed_comparison_pairs"]==2 and d["independent_compositions"]==2
          assert {x["seed"] for x in d["comparisons"]}=={104729,130363}
          assert d["admission"]=="HOLD_REVIEWER_AND_SHEPHERD"
          assert d["new_native_executions"]==d["new_shared_train_admissions"]==0
          assert d["optimizer_updates"]==d["model_generated_views"]==0 and not d["final_access"]
          print(json.dumps(d["comparisons"], sort_keys=True))
          PY
          "$RUNNER_TEMP/smol-p01-r10/bin/python" -m pip freeze --all > evidence/smol-p01-r10/pip-freeze.txt
          rm evidence/smol-p01-r10/incomplete.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smol-p01-r10-peer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/smol-p01-r10/report.json
            evidence/smol-p01-r10/source-head.txt
            evidence/smol-p01-r10/original-sha256.txt
            evidence/smol-p01-r10/pip-freeze.txt
            evidence/smol-p01-r10/incomplete.txt
          if-no-files-found: warn
          retention-days: 90
