name: CI-RAMFIRST-002 direct-checkout SSD versus RAM from first runner step

# Research-only branch. No production workflow or runtime change.
on:
  push:
    branches: [ci/ramfirst-four-shards-20261122]
    paths:
      - '.github/workflows/ci-ramfirst-four-shards.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-ramfirst-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  matched-shards:
    name: Paired SSD/RAM direct checkout — shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [2, 6, 12, 19]
    steps:
      - name: FIRST STEP — mount non-swap RAM filesystem before any checkout
        shell: bash
        run: |
          set -euo pipefail
          # No source, tools, game, cache or result is staged to SSD first.
          # The runner's own agent / system binaries are host-managed.
          mkdir -p "$GITHUB_WORKSPACE/ram-volume" "$GITHUB_WORKSPACE/stock-volume"
          test -z "$(find "$GITHUB_WORKSPACE/ram-volume" -mindepth 1 -maxdepth 1 -print -quit)"
          sudo mount -t tmpfs -o "size=8G,noswap,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs "$GITHUB_WORKSPACE/ram-volume"
          test "$(stat -f -c %T "$GITHUB_WORKSPACE/ram-volume")" = tmpfs
          test "$(stat -f -c %T "$GITHUB_WORKSPACE/stock-volume")" != tmpfs
          echo "RAM volume first, no swap; no intermediate SSD->RAM source copy"
          df -hT "$GITHUB_WORKSPACE/ram-volume" "$GITHUB_WORKSPACE/stock-volume"
          free -h
      - name: Direct checkout to stock filesystem (control)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          path: stock-volume/repo
      - name: Direct checkout to RAM filesystem (experimental)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          path: ram-volume/repo
      - name: Verify direct checkout storage and installed display packages
        shell: bash
        run: |
          set -euo pipefail
          RAM="$GITHUB_WORKSPACE/ram-volume/repo"
          SSD="$GITHUB_WORKSPACE/stock-volume/repo"
          test "$(stat -f -c %T "$RAM")" = tmpfs
          test "$(stat -f -c %T "$SSD")" != tmpfs
          test "$(git -C "$RAM" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$SSD" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$RAM" rev-parse HEAD^{tree})" = "$(git -C "$SSD" rev-parse HEAD^{tree})"
          # Don't modify OS packages mid-experiment: all relevant display bits
          # are present on the standard 24.04 image or fail closed.
          for dep in xvfb xauth libgl1-mesa-dri; do
            test "$(dpkg-query -W -f='${db:Status-Status}' "$dep")" = installed
          done
          command -v g++-13
          command -v xvfb-run
          command -v unzip
          command -v curl
      - name: Prepare independently on each filesystem and run 3 plus 3 Godot shards
        shell: bash
        timeout-minutes: 150
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ram-volume/repo/tools/ci/experiments/ramfirst_compare.py" \
            --shard "${{ matrix.shard }}" \
            --stock "$GITHUB_WORKSPACE/stock-volume/repo" \
            --ram "$GITHUB_WORKSPACE/ram-volume/repo" \
            --report "$GITHUB_WORKSPACE/ram-volume/report"
      - name: Retain all original per-mode source, build, and complete test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramfirst-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ram-volume/report/
            ram-volume/repo/build/ramfirst-evidence/
            stock-volume/repo/build/ramfirst-evidence/
          if-no-files-found: warn
          retention-days: 90

  independent-summary:
    name: Strict aggregation of all four paired hosts
    needs: [matched-shards]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out frozen source of verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Download every actual paired-host artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: ramfirst-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ramfirst-collected
      - name: Reject missing, incomplete, wrong-source, or failed trials
        run: |
          python3 tools/ci/experiments/reduce_ramfirst_four.py \
            --root build/ramfirst-collected --output build/ramfirst-final
          cat build/ramfirst-final/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain readable and machine-readable measured results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramfirst-four-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ramfirst-final/
          if-no-files-found: warn
          retention-days: 90
