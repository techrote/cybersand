name: PR566 Fire Smoke unresolved-recoil diagnostic

# Isolated experiment; exact PR #566 parent, no publication, merge or source
# mutation. The production A and diagnostic B arms use the SAME newly built SO.
on:
  push:
    branches: [codex/pr566-fire-smoke-recoil-ab-20261114]
    paths:
      - '.github/workflows/pr566-fire-smoke-recoil-diagnostic.yml'
      - 'godot/tests/test_pr566_exhaust_recoil.gd'
      - 'godot/native_extension/**'
      - 'tools/ci/reduce_pr566_exhaust_recoil.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr566-exhaust-recoil-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_URL: 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  RAPIER_SHA256: 566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a
  CYBERSAND_CI_WATCHDOG_SCALE: '1'

jobs:
  real-rapier-ab:
    name: Pinned Linux native World and Rapier controlled Fire/Smoke recoil A/B
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/pr566-fire-smoke-recoil-ab-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact isolated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Source identity, source-native input hashes and pinned Rapier
        run: |
          set -euo pipefail
          mkdir -p evidence/trials
          test "$(git rev-list --count 214de85adef2aaabc8e26de8612a3bf27cc1a081..HEAD)" -ge 1
          git merge-base --is-ancestor 214de85adef2aaabc8e26de8612a3bf27cc1a081 HEAD
          git rev-parse HEAD > evidence/head.txt
          git rev-parse HEAD^{tree} > evidence/tree.txt
          git rev-parse HEAD^ > evidence/parent.txt
          g++-13 --version | head -1 > evidence/compiler.txt
          sha256sum godot/native_extension/cyber_native_cell_world.hpp \
            godot/native_extension/cyber_native_cell_world.cpp \
            godot/native_extension/workbench_granular_coupling.inc \
            godot/tests/test_pr566_exhaust_recoil.gd \
            tools/ci/reduce_pr566_exhaust_recoil.py > evidence/diagnostic-inputs.sha256
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          echo "$RAPIER_SHA256  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | sha256sum -c --strict
      - name: Prepare pinned godot-cpp and build requirements
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/scons-install.log 2>&1
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'
          git -C "$RUNNER_TEMP" clone --no-checkout https://github.com/godotengine/godot-cpp.git godot-cpp >/dev/null 2>&1
          git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT" > evidence/godot-cpp-fetch.log 2>&1
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
      - name: Compile source-matched native extension with diagnostic switch OFF by default
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/pr566-exhaust-recoil.so
        run: |
          set -euo pipefail
          if ! timeout 3600 bash tools/build_pinned_godot_cpp.sh linux > evidence/build-godot-cpp.log 2>&1; then
            tail -100 evidence/build-godot-cpp.log; exit 1
          fi
          if ! timeout 3600 bash tools/build_native_extension.sh > evidence/build-native.log 2>&1; then
            tail -160 evidence/build-native.log; exit 1
          fi
          test -s "$CYBERSAND_NATIVE_OUTPUT"
          sha256sum "$CYBERSAND_NATIVE_OUTPUT" > evidence/native.so.sha256
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          bash tools/check_linux_runtime_floor.sh > evidence/abi-floor.log 2>&1
      - name: Install authenticated Godot 4.7 and import project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-explore"
          timeout 600 curl -fL --retry 3 -o "$RUNNER_TEMP/godot-explore.zip" "$GODOT_URL" > evidence/godot-download.log 2>&1
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot-explore.zip" | sha256sum -c --strict
          unzip -q "$RUNNER_TEMP/godot-explore.zip" -d "$RUNNER_TEMP/godot-explore"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-explore" -maxdepth 1 -type f -name 'Godot*' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee evidence/godot-version.txt
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          if ! timeout 1200 "$GODOT_BIN" --headless --path godot --editor --quit > evidence/import.log 2>&1; then
            tail -160 evidence/import.log; exit 1
          fi
      - name: Run identical fresh-World four-arm actual Rapier/Fire experiment
        env:
          LP_NUM_THREADS: '2'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for arm in nofire_normal nofire_suppressed fire_normal fire_suppressed; do
            trial=nofire
            [[ "$arm" == fire_* ]] && trial=fire
            suppressed=0
            [[ "$arm" == *_suppressed ]] && suppressed=1
            echo "PR566_RECOIL_RUNNING: $arm trial=$trial suppressed=$suppressed"
            if ! env CYBERSAND_RECOIL_TRIAL="$trial" \
              CYBERSAND_DIAG_SUPPRESS_EXHAUST_UNRESOLVED_RECOIL="$suppressed" \
              CYBERSAND_RECOIL_OUTPUT="$PWD/evidence/trials/${arm}.json" \
              timeout 300 "$GODOT_BIN" --headless --path godot \
                --script res://tests/test_pr566_exhaust_recoil.gd \
                > "evidence/trials/${arm}.log" 2>&1; then
              tail -120 "evidence/trials/${arm}.log"; exit 1
            fi
            tail -5 "evidence/trials/${arm}.log"
          done
      - name: Reduce exact-source Rapier velocities, unresolved impulses and controls
        run: |
          set -euo pipefail
          python3 tools/ci/reduce_pr566_exhaust_recoil.py evidence/trials evidence/recoil-summary.json \
            | tee evidence/reduction-console.log
          python3 -m json.tool evidence/recoil-summary.json >/dev/null
      - name: Retain all source hashes, per-step physics traces and original logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr566-real-rapier-exhaust-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
