name: INV154 Windows Rapier calling-thread CPU time

on:
  push:
    branches: [perf/inv154-space-step-threadtime-20261105]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inv154-thread-cpu-${{ github.sha }}
  cancel-in-progress: false

env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
  GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
  GODOT_WINDOWS_SHA512: 41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9
  GODOT_VERSION: 4.7.stable.official.5b4e0cb0f

jobs:
  windows-test-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify exact scoped source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 2e937ee37532b06d46fa49205ff2e51c1a9baa2e HEAD
          python3 tools/ci/check_ci_provider_policy.py
          mkdir -p build/inv154-thread-cpu/runtime
          git rev-parse HEAD > build/inv154-thread-cpu/runtime/source-sha.txt
          git hash-object godot/scripts/main.gd | grep -qx 791ef440efd6edb206c6f1be33989cb62e9213b2
          git hash-object godot/tests/performance/test_main_rapier_bridge_split_windows.gd | grep -qx 692472a85cf39ab6f646086859b69783d1c987bb
          git hash-object godot/scripts/rapier_physics_bridge.gd | grep -qx 87eea1f36b11375eb40be6a833433871000fbb2e
          git hash-object godot/native_extension/register_types.cpp | grep -qx "$(git rev-parse 2e937ee37532b06d46fa49205ff2e51c1a9baa2e:godot/native_extension/register_types.cpp)"
          printf '%s\n'             .github/workflows/inv154-space-step-threadtime-windows.yml             godot/tests/performance/inv154_main_rapier_thread_cpu_windows.gd             native/tests/support/cyber_thread_cpu_clock.hpp             tools/ci/inv154_thread_cpu_clock_instrumentation.patch             | sort > build/inv154-thread-cpu/runtime/allowed.txt
          git diff --name-only 2e937ee37532b06d46fa49205ff2e51c1a9baa2e...HEAD | sort > build/inv154-thread-cpu/runtime/changed.txt
          diff -u build/inv154-thread-cpu/runtime/allowed.txt build/inv154-thread-cpu/runtime/changed.txt
          sha256sum             godot/tests/performance/inv154_main_rapier_thread_cpu_windows.gd             native/tests/support/cyber_thread_cpu_clock.hpp             tools/ci/inv154_thread_cpu_clock_instrumentation.patch             godot/native_extension/register_types.cpp             > build/inv154-thread-cpu/runtime/source-inputs.sha256

      - name: Install pinned SCons
        run: |
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt

      - name: Check out exact godot-cpp
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      - name: Prepare exact LLVM-MinGW
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then
            ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
          fi

      - name: Build test-only Windows timing runtime
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "2"
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
        run: |
          set -euo pipefail
          timeout 35m tools/build_pinned_godot_cpp.sh windows
          REAL_CXX="$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-g++"
          printf '#!/usr/bin/env bash\nexec "%s" -DCYBERSAND_THREAD_CPU_CLOCK_TEST_HOOK=1 "$@"\n' "$REAL_CXX" > "$RUNNER_TEMP/thread-cpu-cxx"
          chmod +x "$RUNNER_TEMP/thread-cpu-cxx"
          "$RUNNER_TEMP/thread-cpu-cxx" --version > build/inv154-thread-cpu/runtime/compiler.txt
          git apply --check tools/ci/inv154_thread_cpu_clock_instrumentation.patch
          git apply tools/ci/inv154_thread_cpu_clock_instrumentation.patch
          sha256sum godot/native_extension/register_types.cpp > build/inv154-thread-cpu/runtime/instrumented-register-types.sha256
          WINDOWS_CXX="$RUNNER_TEMP/thread-cpu-cxx"             CYBERSAND_NATIVE_OUTPUT="$PWD/build/inv154-thread-cpu/runtime/cybersand_native.windows.x86_64.dll"             timeout 20m tools/build_native_extension_windows.sh
          git checkout -- godot/native_extension/register_types.cpp
          git diff --exit-code -- godot/native_extension/register_types.cpp
          file build/inv154-thread-cpu/runtime/cybersand_native.windows.x86_64.dll | tee build/inv154-thread-cpu/runtime/runtime-file.txt
          grep -q 'PE32+ executable (DLL).*x86-64' build/inv154-thread-cpu/runtime/runtime-file.txt
          (cd build/inv154-thread-cpu/runtime && sha256sum cybersand_native.windows.x86_64.dll > runtime.sha256)

      - name: Publish test-only runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inv154-thread-cpu-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/inv154-thread-cpu/runtime/
          if-no-files-found: error
          retention-days: 1

  windows-graphical-main:
    needs: windows-test-runtime
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve byte-exact checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore exact test runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: inv154-thread-cpu-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/inv154-thread-cpu/runtime

      - name: Materialize unchanged Rapier and install test-only clock runtime
        timeout-minutes: 12
        run: |
          set -euo pipefail
          test "$(cat build/inv154-thread-cpu/runtime/source-sha.txt)" = "$GITHUB_SHA"
          (cd build/inv154-thread-cpu/runtime && sha256sum --check --strict runtime.sha256)
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          echo "b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7  godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" | sha256sum --check --strict
          cp build/inv154-thread-cpu/runtime/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll

      - name: Execute original ABBA workload with calling-thread CPU clock
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          GODOT_SILENCE_ROOT_WARNING: '1'
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          mkdir -p build/inv154-thread-cpu/windows
          python tools/ci/check_ci_provider_policy.py > build/inv154-thread-cpu/windows/provider-policy.log 2>&1
          git diff --check
          python - <<'PY'
          import csv, hashlib, json, os, subprocess, urllib.request, zipfile
          from pathlib import Path

          root=Path.cwd()
          out=(root/'build/inv154-thread-cpu/windows').resolve()
          parent='2e937ee37532b06d46fa49205ff2e51c1a9baa2e'
          def sh(*args):
              return subprocess.check_output(args,text=True,timeout=60).strip()
          def write(name,payload):
              (out/name).write_text(payload,encoding='utf-8')

          head=sh('git','rev-parse','HEAD')
          if head!=os.environ['EXPECTED_HEAD']:
              raise RuntimeError('checkout does not equal triggering SHA')
          if subprocess.run(['git','merge-base','--is-ancestor',parent,head]).returncode:
              raise RuntimeError('branch is not descended from exact #449 head')
          source={
              'head':head,'tree':sh('git','rev-parse','HEAD^{tree}'),'parent_449':parent,
              'main_blob':sh('git','hash-object','godot/scripts/main.gd'),
              'parent_fixture_blob':sh('git','hash-object','godot/tests/performance/test_main_rapier_bridge_split_windows.gd'),
              'rapier_bridge_blob':sh('git','hash-object','godot/scripts/rapier_physics_bridge.gd'),
              'register_types_blob':sh('git','hash-object','godot/native_extension/register_types.cpp'),
              'test_runtime_sha256':hashlib.sha256((root/'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll').read_bytes()).hexdigest(),
              'rapier_runtime_sha256':hashlib.sha256((root/'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll').read_bytes()).hexdigest(),
              'test_only_native_patch':True,
          }
          if source['main_blob']!='791ef440efd6edb206c6f1be33989cb62e9213b2' or source['parent_fixture_blob']!='692472a85cf39ab6f646086859b69783d1c987bb' or source['rapier_bridge_blob']!='87eea1f36b11375eb40be6a833433871000fbb2e':
              raise RuntimeError('frozen #449 production/workload source changed')
          write('source-and-runtime.json',json.dumps(source,indent=2)+'\n')

          for name,cmd in {
              'video-controllers.json':'Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,VideoProcessor,PNPDeviceID | ConvertTo-Json -Depth 5',
              'processor.json':'Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | ConvertTo-Json -Depth 4',
              'os.json':'Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | ConvertTo-Json -Depth 4',
          }.items():
              p=subprocess.run(['powershell','-NoProfile','-NonInteractive','-Command',cmd],capture_output=True,text=True,timeout=40)
              write(name,p.stdout+'\n'+p.stderr)
              if p.returncode: raise RuntimeError('host identity failed: '+name)

          archive=out/'official-godot.zip'
          urllib.request.urlretrieve(os.environ['GODOT_WINDOWS_URL'],archive)
          digest=hashlib.sha512(archive.read_bytes()).hexdigest()
          if digest!=os.environ['GODOT_WINDOWS_SHA512']:
              raise RuntimeError('Godot archive SHA512 mismatch')
          engine_dir=out/'engine'; engine_dir.mkdir()
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None: raise RuntimeError('Godot archive CRC failure')
              for member in ('Godot_v4.7-stable_win64.exe','Godot_v4.7-stable_win64_console.exe'):
                  z.extract(member,engine_dir)
          archive.unlink()
          engine=engine_dir/'Godot_v4.7-stable_win64_console.exe'
          version=subprocess.check_output([str(engine),'--version'],text=True,timeout=30).strip()
          if version!=os.environ['GODOT_VERSION']:
              raise RuntimeError('Godot version mismatch: '+version)
          write('engine-identity.json',json.dumps({'version':version,'archive_sha512':digest},indent=2)+'\n')

          env={**os.environ,'GODOT_SILENCE_ROOT_WARNING':'1','CYBERSAND_PHASE_OUTPUT':str(out),'CYBERSAND_SOURCE_REVISION':head}
          imp=subprocess.run([str(engine),'--headless','--editor','--path','godot','--import'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=150,env=env)
          write('import.log',imp.stdout)
          if imp.returncode: raise RuntimeError('project import failed')

          argv=[str(engine),'--rendering-driver','opengl3_angle','--path','godot','--script','res://tests/performance/inv154_main_rapier_thread_cpu_windows.gd']
          write('command.json',json.dumps(argv,indent=2)+'\n')
          run=subprocess.run(argv,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=745,env=env)
          write('godot.log',run.stdout)
          matches=[line.split('INV154_THREAD_CPU ',1)[1] for line in run.stdout.splitlines() if line.startswith('INV154_THREAD_CPU ')]
          if run.returncode or len(matches)!=1:
              print(run.stdout[-12000:])
              raise RuntimeError('no successful actual Windows thread-CPU result: exit '+str(run.returncode))
          record=json.loads(matches[0])
          if record.get('schema')!='inv154-thread-cpu-v1' or record.get('platform')!='Windows' or record.get('display_server')=='headless' or record.get('failures')!=0 or not record.get('joined_worker') or record.get('overflow'):
              raise RuntimeError('fixture lifecycle or timing-helper controls failed')
          controls=record.get('thread_cpu_clock_controls',{})
          if not controls.get('available') or controls.get('negative_deltas')!=0 or controls.get('observed_resolution_100ns',0)<=0:
              raise RuntimeError('GetThreadTimes control unavailable/nonmonotonic')
          write('summary.json',json.dumps(record,indent=2)+'\n')

          raw=json.loads((out/'physics-thread-cpu.json').read_text(encoding='utf-8'))
          rows=raw['physics_rows']
          long_rows=[]
          for row in rows:
              if row.get('phase') not in ('timed_a','timed_b'): continue
              cpu100=int(row.get('bridge_thread_cpu_100ns',-1))
              bridge=int(row.get('wrapper_usec',{}).get('rapier_step',-1))
              if cpu100<0 or bridge<0: raise RuntimeError('missing calling-thread CPU or bridge wall observation')
              if int(row.get('bridge_step_delta',0))!=1: raise RuntimeError('timed callback did not advance bridge exactly once')
              if int(row['duration_usec'])>40000:
                  long_rows.append(row)
          if len(long_rows)<4:
              classification='Inconclusive'
              reason='insufficient long callbacks'
          else:
              classification=None; reason=None

          resolution100=int(controls['observed_resolution_100ns'])
          resolution_ms=resolution100/10000.0
          details=[]
          total_bridge_ms=0.0; total_cpu_ms=0.0
          for row in long_rows:
              bridge_ms=int(row['wrapper_usec']['rapier_step'])/1000.0
              cpu_ms=int(row['bridge_thread_cpu_100ns'])/10000.0
              total_bridge_ms+=bridge_ms; total_cpu_ms+=cpu_ms
              details.append({
                  'phase':row['phase'],
                  'physics_frame':int(row['physics_frames']),
                  'callback_wall_ms':int(row['duration_usec'])/1000.0,
                  'bridge_wall_ms':bridge_ms,
                  'space_step_wall_ms':int(row['bridge_step_usec'])/1000.0,
                  'thread_cpu_ms':cpu_ms,
                  'cpu_over_bridge_fraction':cpu_ms/bridge_ms if bridge_ms>0 else None,
                  'bridge_step_count':int(row['bridge_step_count_after']),
                  'actor_tick':int(row['actor_tick']),
                  'native_tick':int(row['native_tick']),
              })
          raw_fraction=total_cpu_ms/total_bridge_ms if total_bridge_ms>0 else None
          endpoint_quantization_ms=2.0*resolution_ms
          lower=sum(max(0.0,d['thread_cpu_ms']-endpoint_quantization_ms) for d in details)/total_bridge_ms if total_bridge_ms else None
          upper=sum(d['thread_cpu_ms']+endpoint_quantization_ms for d in details)/total_bridge_ms if total_bridge_ms else None
          if classification is None:
              if lower is not None and lower>=0.60:
                  classification='Mostly calling-thread CPU execution'
                  reason='conservative resolution-aware lower bound is at least 60% of bridge wall time'
              elif upper is not None and upper<=0.40:
                  classification='Mostly calling-thread off-CPU time'
                  reason='conservative resolution-aware upper bound is at most 40% of bridge wall time'
              else:
                  classification='Inconclusive'
                  reason='CPU/wall proportion overlaps the preregistered resolution-aware decision band'

          analysis={
              'schema':'inv154-thread-cpu-analysis-v1',
              'source_head':head,
              'long_callback_threshold_ms':40.0,
              'long_timed_callbacks':len(details),
              'observed_thread_cpu_resolution_100ns':resolution100,
              'observed_thread_cpu_resolution_ms':resolution_ms,
              'active_control':controls,
              'total_long_bridge_wall_ms':total_bridge_ms,
              'total_long_calling_thread_cpu_ms':total_cpu_ms,
              'raw_cpu_over_bridge_fraction':raw_fraction,
              'resolution_aware_fraction_lower':lower,
              'resolution_aware_fraction_upper':upper,
              'classification':classification,
              'reason':reason,
              'scope_note':'Low calling-thread CPU does not distinguish blocking from OS descheduling and does not exclude Rapier CPU work on other threads.',
              'long_callbacks':details,
          }
          write('thread-cpu-analysis.json',json.dumps(analysis,indent=2)+'\n')
          with (out/'long-callbacks.csv').open('w',newline='',encoding='utf-8') as f:
              fields=['phase','physics_frame','callback_wall_ms','bridge_wall_ms','space_step_wall_ms','thread_cpu_ms','cpu_over_bridge_fraction','bridge_step_count','actor_tick','native_tick']
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(details)
          print('THREAD_CPU_RESULT '+json.dumps({k:analysis[k] for k in ('long_timed_callbacks','observed_thread_cpu_resolution_ms','total_long_bridge_wall_ms','total_long_calling_thread_cpu_ms','raw_cpu_over_bridge_fraction','resolution_aware_fraction_lower','resolution_aware_fraction_upper','classification','reason')},sort_keys=True))
          PY

      - name: Retain raw samples and exact identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inv154-thread-cpu-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/inv154-thread-cpu/windows/
          if-no-files-found: warn
          retention-days: 30
