name: Workbench provider UI - Windows real child and native qualification
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'godot/scripts/workbench_agent_runner_client.gd'
      - 'godot/scripts/workbench_agent_panel.gd'
      - 'godot/tests/test_workbench_agent_runner_*.gd'
      - 'tools/workbench_api_agent/**'
      - '.github/workflows/wb-provider-ui-windows.yml'
permissions:
  contents: read
concurrency:
  group: wb-provider-ui-windows-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  windows-owned-runner:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENAI_API_KEY: ''
      NVIDIA_API_KEY: ''
      CYBERSAND_PYTHON: python
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source identity and pinned desktop libraries
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Source mismatch' }
          python tools/ci/check_ci_provider_policy.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git lfs pull --include="godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Authenticate official pinned Windows Godot
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 2 --connect-timeout 45 --max-time 300 --output "$env:RUNNER_TEMP/godot-ui.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PYTHONPATH = 'tools/ci'
          python -c "import json,sys;from pathlib import Path;from run_windows_godot_regressions import prepare_godot;binary,info=prepare_godot(Path(sys.argv[1]));Path('build').mkdir(exist_ok=True);Path('build/provider-ui-runtime.json').write_text(json.dumps(info,indent=2));Path('build/provider-ui-godot.txt').write_text(str(binary))" "$env:RUNNER_TEMP/godot-ui.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Actual Python child, native framebuffer and ordinary workbench
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'tools'
          python -m unittest -v workbench_api_agent.test_desktop workbench_api_agent.test_git_status workbench_api_agent.test_desktop_funding workbench_api_agent.test_desktop_startup workbench_api_agent.test_usage_budget workbench_api_agent.test_boilerplate workbench_api_agent.test_desktop_recovery
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $engine = Get-Content build/provider-ui-godot.txt -Raw
          python tools/wb_agent/qualify_integrated.py --godot $engine --output build/provider-ui-windows --cases runner-client boilerplate runner-startup runner-traffic runner-mounted runner-recovery client diagnostics dock-layout manual-save manual-reopen
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain original native images, receipts, failures and runtime identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-provider-ui-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/provider-ui-windows/
            build/provider-ui-runtime.json
          if-no-files-found: error
          retention-days: 90
