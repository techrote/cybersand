name: GENTEK 80 supplemental mixed Workbench admission
on:
  push:
    branches: [ci/gentek80-mixed-admission]
    paths:
      - '.github/workflows/gentek80-mixed-admission.yml'
      - 'tools/ci/gentek80_mixed_admission/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: gentek80-mixed-${{ github.run_id }}
  cancel-in-progress: false
env:
  PUBLISHED_SOURCE: bf1bd8c8e6f189b36a3cb0f582185e5d529297d0
  HARNESS: orchestration/tools/ci/gentek80_final_admission
  MIXED: orchestration/tools/ci/gentek80_mixed_admission
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  mixtures:
    name: Actual mixed Gentek Workbench (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            native: godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
            rapier: godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so
          - platform: windows
            os: windows-2022
            native: godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll
            rapier: godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PUBLISHED_SOURCE }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refuse incomplete or mismatched supplemental receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m py_compile "$MIXED"/*.py
          python -m unittest discover -s "$MIXED" -p 'test_*.py' -v > evidence/mixed-boundary-tests.log 2>&1 || { cat evidence/mixed-boundary-tests.log; exit 1; }
      - name: Retrieve exact final runtime and original validated source bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C candidate lfs install --local
          git -C candidate lfs pull --include='${{ matrix.native }},${{ matrix.rapier }}' --exclude=''
          python "$HARNESS/fetch_qualified_artifact.py" --config "$HARNESS/admission-inputs.json" --role '${{ matrix.platform }}' --destination original-bundle
      - name: Retrieve immutable already qualified Windows ZIP and dependency assets
        if: matrix.platform == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$HARNESS/fetch_qualified_artifact.py" --config "$HARNESS/admission-inputs.json" --role assets --destination original-assets
          python "$MIXED/fetch_final_assembly.py" --harness "$HARNESS" --destination final-assembly
      - name: Install pinned Linux Godot and graphical display
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 --max-time 600 -o "$RUNNER_TEMP/godot.zip" 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          bash candidate/tools/ci/prepare_linux_display.sh > evidence/display-setup.log 2>&1
      - name: Graphical Linux Composition author and independent reopen
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          GALLIVM_PERF: nopt
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            python "$MIXED/run_mixed_workbench.py" --config "$HARNESS/admission-inputs.json" \
              --candidate candidate --bundle original-bundle --platform linux --harness "$HARNESS" \
              --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --output evidence/mixed
      - name: Graphical pristine Windows ZIP Composition author and independent reopen
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $config = Get-Content "$env:HARNESS/admission-inputs.json" -Raw | ConvertFrom-Json
          python "$env:MIXED/run_mixed_workbench.py" --config "$env:HARNESS/admission-inputs.json" --candidate candidate --bundle original-bundle --platform windows --harness "$env:HARNESS" --archive final-assembly/CyberSand-Gentek80-Windows-bf1bd8c8e6f1.zip --assembly final-assembly/assembly.json --assets-archive (Join-Path original-assets $config.windows_asset_zip_name) --extraction (Join-Path $env:RUNNER_TEMP 'pristine-mixed-package') --output evidence/mixed
          if ($LASTEXITCODE -ne 0) { throw 'Graphical final Windows ZIP mixed Composition admission failed' }
      - name: Retain all original supplemental logs, frames and custody receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek80-mixed-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            evidence/
            *.download-receipt.json
          if-no-files-found: error
          retention-days: 90
