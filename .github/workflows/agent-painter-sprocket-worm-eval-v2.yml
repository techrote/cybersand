name: SPROCKET WORM-001 trained-v2 original PNG and legal-action comparison
on:
  push:
    branches:
      - codex/agent-painter-sprocket-568
    paths:
      - experiments/agent_painter/lanes/sprocket/worm-eval-request-v2.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sprocket-worm-eval-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  eval-worm:
    name: Pinned WORM v2 model versus W0 random, wall, fidget at matched seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check exact immutable v2 source lease and repository policy
        id: lease
        run: |
          set -euo pipefail
          mkdir -p evidence/worm-v2-eval
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          r=json.loads(Path('experiments/agent_painter/lanes/sprocket/worm-eval-request-v2.json').read_text())
          expected="{\"schema\":\"cybersand.worm.sprocket-eval-request/2\",\"experiment\":\"sprocket-worm-v2-balanced-001-online\",\"training_source\":\"7683d06d9ffb26417ffc9694a07e8cf25e165fc6\",\"training_run_id\":43697235301,\"training_artifact\":\"sprocket-worm-v2-7683d06d9ffb26417ffc9694a07e8cf25e165fc6\",\"model\":\"kandivault/sprocket-500m\",\"model_revision\":\"eb157d4ddddc4619e661d4a2426bb2dd000fc668\",\"w0_git_commit\":\"2be9fd02ee525f2eac999555d4e7392a1dbc739b\",\"checkpoint\":\"checkpoint-000048\",\"steps\":24,\"keep_draft\":true,\"native\":false,\"sealed_final_forbidden\":true}"
          if r!=json.loads(expected): raise SystemExit('versioned WORM v2 evaluation lease mismatch')
          if os.environ['GITHUB_REF']!='refs/heads/codex/agent-painter-sprocket-568': raise SystemExit('unexpected branch')
          Path('evidence/worm-v2-eval/source-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          Path('evidence/worm-v2-eval/request.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(r['training_run_id'])+'\n')
              f.write('artifact='+r['training_artifact']+'\n')
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/worm_rollout_v2.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.lease.outputs.artifact }}
          path: evidence/previous-v2
          run-id: ${{ steps.lease.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify actual completed 48-step source-bound checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/previous-v2/campaign')
          s=json.loads((p/'summary.json').read_text())
          c=json.loads((p/'preflight.json').read_text())['config']
          assert s['actual_training'] is True and s['status']=='complete'
          assert s['steps']==s['target_steps']==48 and s['checkpoint']=='checkpoint-000048'
          assert s['frozen_base_equal'] and s['adapter_changed']
          assert not s['native_execution'] and not s['sealed_final_opened']
          assert c['schema']=='cybersand.worm.sprocket-steering-v2'
          assert c['source_sha']=='7683d06d9ffb26417ffc9694a07e8cf25e165fc6'
          assert c['model']['model_id']=='kandivault/sprocket-500m'
          assert c['model']['revision']=='eb157d4ddddc4619e661d4a2426bb2dd000fc668'
          assert c['worm_common_git_commit']=='2be9fd02ee525f2eac999555d4e7392a1dbc739b'
          assert (p/'checkpoint-000048/inventory.json').is_file()
          print('Original 48 real steps and immutable checkpoint receipts accepted for visual evaluation only')
          PY
      - name: Retrieve original immutable W0 engine-owned walker
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 2be9fd02ee525f2eac999555d4e7392a1dbc739b
          test "$(git rev-parse FETCH_HEAD)" = 2be9fd02ee525f2eac999555d4e7392a1dbc739b
          git show 2be9fd02ee525f2eac999555d4e7392a1dbc739b:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/pinned-worm.py"
          sha256sum "$RUNNER_TEMP/pinned-worm.py" > evidence/worm-v2-eval/pinned-w0.sha256
          python3 -m py_compile "$RUNNER_TEMP/pinned-worm.py"
      - name: Install reviewed portable CPU FP32 and pinned Sprocket root model
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/painter-training"
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/painter-training/bin/python" -m pip check
          "$RUNNER_TEMP/painter-training/bin/python" -m pip freeze --all > evidence/worm-v2-eval/pip-freeze.txt
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/training/download_model.py --profile sprocket --output "$RUNNER_TEMP/painter-model"
          cp "$RUNNER_TEMP/painter-model/download_receipt.json" evidence/worm-v2-eval/model-download.json
      - name: Actual first-pass WORM v2 learned rollouts and three same-seed controls
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1400s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/lanes/sprocket/worm_rollout_v2.py \
            --model "$RUNNER_TEMP/painter-model" --w0 "$RUNNER_TEMP/pinned-worm.py" \
            --checkpoint evidence/previous-v2/campaign/checkpoint-000048 \
            --training-source 7683d06d9ffb26417ffc9694a07e8cf25e165fc6 \
            --steps 24 --output evidence/worm-v2-eval/results
      - name: Preserve checksums and partial/failure evidence
        if: always()
        run: |
          set -euo pipefail
          df -h > evidence/worm-v2-eval/disk-after.txt
          (cd evidence/worm-v2-eval && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > evidence/worm-v2-eval/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-worm-eval-v2-${{ github.sha }}
          path: evidence/worm-v2-eval/
          if-no-files-found: warn
          retention-days: 90
