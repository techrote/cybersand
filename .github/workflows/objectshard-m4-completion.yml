  independent-windows-package:
    # A fresh Windows machine consumes only the uploaded evaluator as its
    # application. The checkout supplies the separately identified observer;
    # it never rebuilds or substitutes an application runtime or script.
    needs: windows-workbench
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preserve observer source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact observer checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download the actual uploaded evaluator by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.windows-workbench.outputs.evaluator-id }}
          merge-multiple: true
          path: delivered/
      - name: Independent clean extraction and actual shipped launcher execution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected observer source SHA' }
          $archive = 'delivered/objectshard-workbench-evaluator.zip'
          $extractions = Join-Path $env:RUNNER_TEMP 'objectshard-independent-delivered'
          python tools/objectshard/qualify_workbench_zip.py --zip $archive --extract-root $extractions --output evidence/launcher --timeout (python tools/ci/execution_policy.py seconds graphical_case_seconds)
          if ($LASTEXITCODE -ne 0) { throw 'Independent shipped launcher qualification failed' }
          $copy = Join-Path $extractions 'Workbench (1)'
          python tools/objectshard/qualify_workbench.py --godot (Join-Path $copy 'Godot_v4.7-stable_win64_console.exe') --expected-source-sha $env:GITHUB_SHA --package $copy --output evidence/package-replay
          if ($LASTEXITCODE -ne 0) { throw 'Independent delivered Workbench replay failed' }
          $identity = [ordered]@{schema='objectshard-m4-independent-package-v1'; source_commit=$env:GITHUB_SHA; workflow_run=$env:GITHUB_RUN_ID; workflow_attempt=$env:GITHUB_RUN_ATTEMPT; artifact_id='${{ needs.windows-workbench.outputs.evaluator-id }}'; archive_sha256=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant(); archive_bytes=(Get-Item $archive).Length; status='passed'; application='unchanged uploaded evaluator'; observer='exact source checkout; independent fresh hosted Windows job'; physical_owner_acceptance='not established'}
          $identity | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 evidence/independent-package-identity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objectshard-m4-independent-windows-package-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 60

  publish-runtime:
    name: Publish source-leased ObjectShard production runtimes
    if: github.event_name == 'push' && github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/integration/objectshard-m4-mainline-20261122' && contains(github.event.head_commit.message, '[objectshard-m4-publish]')
    needs: [native-sanitizers, linux-workbench, windows-workbench-regressions, windows-workbench-graphical, windows-workbench, windows-native-presentation, independent-windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      OBJECTSHARD_VALIDATED_LINUX_ATTEMPT: ${{ needs.linux-workbench.outputs.attempt }}
      OBJECTSHARD_VALIDATED_WINDOWS_ATTEMPT: ${{ needs.windows-workbench.outputs.attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          lfs: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.linux-workbench.outputs.runtime-id }}
          merge-multiple: true
          path: build/production-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.windows-workbench.outputs.runtime-id }}
          merge-multiple: true
          path: build/production-windows
      - name: Revalidate both build and target execution receipts and publish four paths
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/objectshard/production_runtime.py check-source --source-sha "$GITHUB_SHA"
          git lfs install --local
          python3 tools/objectshard/production_runtime.py stage --source-sha "$GITHUB_SHA" --linux-bundle build/production-linux --windows-bundle build/production-windows
          git add -- godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/runtime-provenance.linux.json godot/addons/cybersand_native/runtime-provenance.json
          python3 tools/objectshard/production_runtime.py check-index --source-sha "$GITHUB_SHA"
          git diff --cached --check
          git diff --exit-code
          python3 tools/objectshard/production_runtime.py check-source --source-sha "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish source-matched ObjectShard Workbench runtimes'
          test "$(git rev-list --parents -n 1 HEAD)" = "$(git rev-parse HEAD) $GITHUB_SHA"
          git push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin "HEAD:$GITHUB_REF"

