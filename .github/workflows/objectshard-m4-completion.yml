name: ObjectShard M4 ordinary Workbench completion
on:
  push:
    branches: [integration/objectshard-m4-mainline-20261122, mission/objectshard-m4-completion-20261124, mission/objectshard-m4-focused-windows-20261128]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: objectshard-completion-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  PRODUCTION_REQUEST: ${{ github.event_name == 'push' && github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/integration/objectshard-m4-mainline-20261122' && contains(github.event.head_commit.message, '[objectshard-m4-publish]') }}
  PYTHONUTF8: "1"
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
jobs:
  focused-capacity-recovery:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[objectshard-m4-focused-capacity]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact source and admitted Rapier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/focused-capacity
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git lfs install --local
          python3 tools/ci/materialize_lfs.py --expected-source "$GITHUB_SHA" --include godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so --output evidence/focused-capacity/rapier-acquisition.json
          echo '566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' | sha256sum -c --strict
      - name: Build source-bound Linux native extension
        shell: bash
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/libcybersand_native.linux.x86_64.so
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/focused-capacity/scons.log 2>&1
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
          python3 tools/objectshard/native_receipt.py snapshot --receipt evidence/focused-capacity/native-source.json --expected-source-sha "$GITHUB_SHA"
          tools/build_pinned_godot_cpp.sh linux > evidence/focused-capacity/godot-cpp.log 2>&1
          tools/build_native_extension.sh > evidence/focused-capacity/native-extension.log 2>&1
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          python3 tools/objectshard/native_receipt.py seal --receipt evidence/focused-capacity/native-source.json --runtime "$CYBERSAND_NATIVE_OUTPUT" --expected-source-sha "$GITHUB_SHA"
      - name: Pinned Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 60 --max-time 600 -o "$RUNNER_TEMP/godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip'
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          test "$("$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --version)" = '4.7.stable.official.5b4e0cb0f'
      - name: Focused capacity recovery fixture
        shell: bash
        env:
          CYBERSAND_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          userdata="$RUNNER_TEMP/objectshard-focused-capacity-userdata"
          mkdir -p "$userdata"
          export HOME="$userdata"
          export XDG_DATA_HOME="$userdata"
          export XDG_CONFIG_HOME="$userdata"
          godot="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          timeout 300 "$godot" --headless --path godot --editor --quit > evidence/focused-capacity/import.log 2>&1
          timeout 600 "$godot" --headless --path godot --script res://tests/test_object_shard_m4_capacity_recovery.gd -- --objectshard-m4-workbench 2>&1 | tee evidence/focused-capacity/capacity-recovery.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objectshard-m4-focused-capacity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/focused-capacity/
          if-no-files-found: error
          retention-days: 60
  focused-windows-live-input-package:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[objectshard-m4-focused-windows]')
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      DONOR_SOURCE: 8064c73270dee2ce1a0d53316aae334136335483
      DONOR_RUN: "46139502627"
      DONOR_ARTIFACT_ID: "15260698091"
    steps:
      - name: Preserve exact Windows checkout spelling
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse only the successful immutable Windows native artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force evidence/focused-live-input,reused-native | Out-Null
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected focused source SHA' }
          $zip = Join-Path $env:RUNNER_TEMP 'donor-native.zip'
          curl.exe -fL -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o $zip "https://api.github.com/repos/techrote/cybersand/actions/artifacts/$env:DONOR_ARTIFACT_ID/zip"
          if ($LASTEXITCODE -ne 0) { throw 'Immutable donor native artifact download failed' }
          Expand-Archive $zip reused-native
          @'
          import hashlib, json, os
          from pathlib import Path
          from tools.ci import native_candidate_identity as identity
          root=Path(".")
          donor=json.loads(Path("reused-native/candidate-provenance.json").read_text(encoding="utf-8"))
          commit, tree, inputs=identity.source(root)
          dll=Path("reused-native/cybersand_native.windows.x86_64.dll")
          actual=hashlib.sha256(dll.read_bytes()).hexdigest()
          if donor.get("source_commit") != os.environ["DONOR_SOURCE"]:
              raise SystemExit("donor source identity mismatch")
          if donor.get("source_inputs") != inputs:
              raise SystemExit("native source inputs changed; donor reuse forbidden")
          if donor.get("sha256") != actual:
              raise SystemExit("donor DLL hash mismatch")
          evidence={"schema":"objectshard-focused-native-reuse-v1","current_source":commit,
                    "current_tree":tree,"donor_source":donor["source_commit"],
                    "donor_run":int(os.environ["DONOR_RUN"]),"donor_artifact_id":int(os.environ["DONOR_ARTIFACT_ID"]),
                    "native_source_inputs_identical":True,"dll_sha256":actual,
                    "scope":"focused Windows GDScript regression only; no new native qualification claim"}
          Path("evidence/focused-live-input/native-reuse.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native donor equivalence proof failed' }
          Copy-Item reused-native/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll -Force
      - name: Materialize unchanged package dependencies and pinned Godot
        shell: pwsh
        run: |
          git lfs install --local
          python tools/ci/materialize_lfs.py --expected-source $env:GITHUB_SHA --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --include godot/tools/gentek_reciprocal.exe --output evidence/focused-live-input/lfs-acquisition.json
          if ($LASTEXITCODE -ne 0) { throw 'Focused package dependency acquisition failed' }
          if ((Get-FileHash 'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7') { throw 'Rapier SHA mismatch' }
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          curl.exe -fL --retry 3 -o $zip 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed' }
          if ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant() -ne '41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9') { throw 'Godot SHA mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'godot')
      - name: Build a fresh extracted package-like source copy
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'ObjectShard focused package/Workbench (1)'
          "FOCUSED_COPY=$copy" | Out-File -Append $env:GITHUB_ENV
          $env:FOCUSED_COPY=$copy
          @'
          import os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path("tools/objectshard").resolve()))
          from package_windows_lab import copy_committed_tree
          copy_committed_tree(Path(os.environ["FOCUSED_COPY"]),Path("reused-native"),"docs/operations/objectshard-workbench-playtest.md")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Fresh extracted package-like source copy failed' }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'godot/Godot_v4.7-stable_win64_console.exe') (Join-Path $copy 'Godot_v4.7-stable_win64_console.exe')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'godot/Godot_v4.7-stable_win64.exe') (Join-Path $copy 'Godot_v4.7-stable_win64.exe')
      - name: Focused extracted-package fast pointer sweep
        shell: pwsh
        env:
          CYBERSAND_SOURCE_REVISION: ${{ github.sha }}
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'focused-live-input-profile'
          New-Item -ItemType Directory -Force $profile | Out-Null
          $env:APPDATA=$profile
          $env:LOCALAPPDATA=$profile
          $env:XDG_DATA_HOME=$profile
          $env:XDG_CONFIG_HOME=$profile
          $godot = Join-Path $env:FOCUSED_COPY 'Godot_v4.7-stable_win64_console.exe'
          & $godot --headless --path (Join-Path $env:FOCUSED_COPY 'godot') --editor --quit 2>&1 | Tee-Object evidence/focused-live-input/import.log
          if ($LASTEXITCODE -ne 0) { throw 'Focused extracted project import failed' }
          & $godot --rendering-method gl_compatibility --rendering-driver opengl3_angle --audio-driver Dummy --path (Join-Path $env:FOCUSED_COPY 'godot') --script res://tests/test_object_shard_m4_live_input.gd -- --objectshard-m4-workbench 2>&1 | Tee-Object evidence/focused-live-input/live-input.log
          if ($LASTEXITCODE -ne 0) { throw 'Focused extracted-package live-input fixture failed' }
          if (-not (Select-String -Quiet -Path evidence/focused-live-input/live-input.log -Pattern '"failures":\[\]')) { throw 'Focused live-input result lacks an empty failure ledger' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objectshard-m4-focused-windows-live-input-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/focused-live-input/
          if-no-files-found: error
          retention-days: 60

  focused-windows-art-display:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[objectshard-m4-focused-windows]')
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      DONOR_SOURCE: 8064c73270dee2ce1a0d53316aae334136335483
      DONOR_RUN: "46139502627"
      DONOR_ARTIFACT_ID: "15260698091"
    steps:
      - name: Preserve exact Windows checkout spelling
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse only the successful immutable Windows native artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force evidence/focused-art,reused-native | Out-Null
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected focused source SHA' }
          $zip = Join-Path $env:RUNNER_TEMP 'donor-native.zip'
          curl.exe -fL -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o $zip "https://api.github.com/repos/techrote/cybersand/actions/artifacts/$env:DONOR_ARTIFACT_ID/zip"
          if ($LASTEXITCODE -ne 0) { throw 'Immutable donor native artifact download failed' }
          Expand-Archive $zip reused-native
          @'
          import hashlib, json, os
          from pathlib import Path
          from tools.ci import native_candidate_identity as identity
          root=Path(".")
          donor=json.loads(Path("reused-native/candidate-provenance.json").read_text(encoding="utf-8"))
          commit, tree, inputs=identity.source(root)
          dll=Path("reused-native/cybersand_native.windows.x86_64.dll")
          actual=hashlib.sha256(dll.read_bytes()).hexdigest()
          if donor.get("source_commit") != os.environ["DONOR_SOURCE"]:
              raise SystemExit("donor source identity mismatch")
          if donor.get("source_inputs") != inputs:
              raise SystemExit("native source inputs changed; donor reuse forbidden")
          if donor.get("sha256") != actual:
              raise SystemExit("donor DLL hash mismatch")
          evidence={"schema":"objectshard-focused-native-reuse-v1","current_source":commit,
                    "current_tree":tree,"donor_source":donor["source_commit"],
                    "donor_run":int(os.environ["DONOR_RUN"]),"donor_artifact_id":int(os.environ["DONOR_ARTIFACT_ID"]),
                    "native_source_inputs_identical":True,"dll_sha256":actual,
                    "scope":"focused Windows displayed Art regression only; no new native qualification claim"}
          Path("evidence/focused-art/native-reuse.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native donor equivalence proof failed' }
          Copy-Item reused-native/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll -Force
      - name: Materialize Rapier and pinned Godot
        shell: pwsh
        run: |
          git lfs install --local
          python tools/ci/materialize_lfs.py --expected-source $env:GITHUB_SHA --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --output evidence/focused-art/lfs-acquisition.json
          if ($LASTEXITCODE -ne 0) { throw 'Focused Art dependency acquisition failed' }
          if ((Get-FileHash 'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7') { throw 'Rapier SHA mismatch' }
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          curl.exe -fL --retry 3 -o $zip 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed' }
          if ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant() -ne '41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9') { throw 'Godot SHA mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'godot')
      - name: Focused Windows ANGLE conversation-apply preparation
        shell: pwsh
        env:
          CYBERSAND_SOURCE_REVISION: ${{ github.sha }}
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'focused-art-profile'
          New-Item -ItemType Directory -Force $profile | Out-Null
          $env:APPDATA=$profile
          $env:LOCALAPPDATA=(Join-Path $profile 'local')
          $env:XDG_DATA_HOME=$profile
          $env:XDG_CONFIG_HOME=$profile
          $env:CYBERSAND_TEST_ARTIFACT_DIR=(Resolve-Path evidence/focused-art).Path
          $godot = Join-Path $env:RUNNER_TEMP 'godot/Godot_v4.7-stable_win64_console.exe'
          & $godot --headless --path godot --editor --quit 2>&1 | Tee-Object evidence/focused-art/import.log
          if ($LASTEXITCODE -ne 0) { throw 'Focused Art import failed' }
          & $godot --rendering-method gl_compatibility --rendering-driver opengl3_angle --audio-driver Dummy --path godot --script res://tests/test_art_conversation_apply_preparation.gd 2>&1 | Tee-Object evidence/focused-art/conversation-apply.log
          if ($LASTEXITCODE -ne 0) { throw 'Focused Windows displayed Art fixture failed' }
          if (-not (Select-String -Quiet -Path evidence/focused-art/conversation-apply.log -Pattern 'ART_CONVERSATION_APPLY_RESULT')) { throw 'Focused Art result marker absent' }
          if (-not (Select-String -Quiet -Path evidence/focused-art/conversation-apply.log -Pattern '"failures":\[\]')) { throw 'Focused Art result retains failures' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objectshard-m4-focused-windows-art-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/focused-art/
          if-no-files-found: error
          retention-days: 60

  presentation-linux:
    # The explicit early lane is independent of native qualification and cannot
    # publish runtimes. Its copied RG8 fixtures never call the native World.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[objectshard-m4-presentation]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Preserve exact source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned Linux project dependencies and real display
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tools/ci/materialize_lfs.py --expected-source "$GITHUB_SHA" --include godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so --include godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so --output evidence/retained-runtime-acquisition.json
          curl --fail --location --retry 3 --connect-timeout 60 --max-time 600 -o "$RUNNER_TEMP/godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip'
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          bash tools/ci/prepare_linux_display.sh > evidence/display.log 2>&1
      - name: Linux actual material parity and retained-camera witnesses
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          GALLIVM_PERF: nopt
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24 -nolisten tcp' python3 tools/objectshard/qualify_presentation.py --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --expected-source-sha "$GITHUB_SHA" --output evidence/presentation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objectshard-m4-presentation-ubuntu-24.04-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 60
  presentation-windows:
    # The explicit early lane is independent of native qualification and cannot
    # publish runtimes. Its copied RG8 fixtures never call the native World.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[objectshard-m4-presentation]')
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Preserve exact source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned Windows project dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python tools/ci/materialize_lfs.py --expected-source $env:GITHUB_SHA --include godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --output evidence/retained-runtime-acquisition.json
          if ($LASTEXITCODE -ne 0) { throw 'Exact retained project runtime unavailable' }
