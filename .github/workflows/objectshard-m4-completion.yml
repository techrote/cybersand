name: ObjectShard M4 ordinary Workbench completion
on:
  push:
    branches: [integration/objectshard-m4-mainline-20261122, mission/objectshard-m4-completion-20261124]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: objectshard-completion-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
jobs:
  native-sanitizers:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[objectshard-m4-completion]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: workspace/source
    steps:
      - name: Pinned read-only companion documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6a58311982941b75f46e22109a0829e5acb83c7e
          path: workspace
          persist-credentials: false
      - name: Exact source and authenticated compatibility history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: workspace/source
          fetch-depth: 0
          persist-credentials: false
      - name: Exact native source, ASan UBSan and ordinary World
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout "$(python3 tools/ci/execution_policy.py seconds operation_seconds)" python3 tools/material_catalogue/compatibility.py --check > evidence/material-compatibility-gate.json
          timeout "$(python3 tools/ci/execution_policy.py seconds operation_seconds)" python3 tools/material_catalogue/compiler.py --check > evidence/material-catalogue-check.json
          python3 tools/objectshard/run_native_tests.py --output evidence/native --compiler g++-13 --sanitize --suite all --suite world --jobs 2 --timeout "$(python3 tools/ci/execution_policy.py seconds native_case_seconds)" --build-timeout "$(python3 tools/ci/execution_policy.py seconds native_compile_seconds)"
          python3 tools/objectshard/run_benchmarks.py --output evidence/retained-lab-native-budgets --compiler g++-13 --jobs 2 --ticks 1200 --repetitions 3 --qualify --timeout "$(python3 tools/ci/execution_policy.py seconds native_case_seconds)" --build-timeout "$(python3 tools/ci/execution_policy.py seconds native_compile_seconds)"
          python3 -m unittest discover -s tools/objectshard -p 'test_*.py' -v > evidence/qualification-contracts.log 2>&1
          timeout "$(python3 tools/ci/execution_policy.py seconds native_suite_seconds)" python3 -m unittest discover -s tools/material_catalogue -p 'test_*.py' -v > evidence/material-compatibility.log 2>&1
          timeout "$(python3 tools/ci/execution_policy.py seconds operation_seconds)" python3 tools/material_catalogue/check_native_parity.py --output build/objectshard-m4-material-parity.json
          cp build/objectshard-m4-material-parity.json evidence/material-native-parity.json
          python3 tools/ci/check_ci_provider_policy.py > evidence/provider-policy.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objectshard-m4-native-${{ github.sha }}-${{ github.run_id }}
          path: workspace/source/evidence/
          retention-days: 60
  linux-workbench:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[objectshard-m4-completion]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact source and admitted Rapier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > evidence/source-commit.txt
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          echo '566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' | sha256sum -c --strict
      - name: Build source-bound Linux native extension
        shell: bash
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/libcybersand_native.linux.x86_64.so
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/scons.log 2>&1
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
          python3 tools/objectshard/native_receipt.py snapshot --receipt evidence/native-source.json --expected-source-sha "$GITHUB_SHA"
          tools/build_pinned_godot_cpp.sh linux > evidence/godot-cpp.log 2>&1
          tools/build_native_extension.sh > evidence/native-extension.log 2>&1
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          python3 tools/objectshard/native_receipt.py seal --receipt evidence/native-source.json --runtime "$CYBERSAND_NATIVE_OUTPUT" --expected-source-sha "$GITHUB_SHA"
          tools/check_linux_runtime_floor.sh > evidence/abi-floor.log 2>&1
      - name: Pinned graphical engine
        shell: bash
        run: |
          set -euo pipefail
          # Same official archive as the locked redirect, without the failing
          # downloads.godotengine.org acquisition frontend (HTTP 403 in 45473059187).
          godot_download_seconds="$(python3 tools/ci/execution_policy.py seconds dependency_prepare_seconds)"
          timeout "$godot_download_seconds" curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time "$godot_download_seconds" --connect-timeout 60 --max-time "$godot_download_seconds" -o "$RUNNER_TEMP/godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip'
          test "$(stat -c %s "$RUNNER_TEMP/godot.zip")" = 75664355
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          unzip -tq "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          test "$("$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --version)" = '4.7.stable.official.5b4e0cb0f'
          bash tools/ci/prepare_linux_display.sh > evidence/display.log 2>&1
      - name: Ordinary Workbench physical and regression matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/objectshard/qualify_workbench.py --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --expected-source-sha "$GITHUB_SHA" --native-receipt evidence/native-source.json --regressions --profile --output evidence/headless
      - name: Actual graphical Workbench profile
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          GALLIVM_PERF: nopt
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24 -nolisten tcp' python3 tools/objectshard/qualify_workbench.py --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --expected-source-sha "$GITHUB_SHA" --native-receipt evidence/native-source.json --profile --render --output evidence/graphical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objectshard-m4-linux-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          retention-days: 60
  windows-native:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[objectshard-m4-completion]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact Windows cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > evidence/source-commit.txt
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/scons.log 2>&1
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
          curl -fL --retry 3 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then
            ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
          fi
      - name: Exact-source Windows native artifact
        shell: bash
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
        run: |
          set -euo pipefail
          tools/build_pinned_godot_cpp.sh windows > evidence/godot-cpp-build.log 2>&1
          tools/build_native_extension_windows.sh > evidence/extension-build.log 2>&1
          mkdir -p build/objectshard-windows
          cp "$CYBERSAND_NATIVE_OUTPUT" build/objectshard-windows/
          python3 tools/ci/native_candidate_identity.py build/objectshard-windows --create
          python3 tools/ci/native_candidate_identity.py build/objectshard-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objectshard-m4-dll-${{ github.sha }}-${{ github.run_id }}
          path: build/objectshard-windows/
          if-no-files-found: error
          retention-days: 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objectshard-m4-crossbuild-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          retention-days: 60
  windows-workbench:
    needs: windows-native
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: objectshard-m4-dll-${{ github.sha }}-${{ github.run_id }}
          path: build/objectshard-windows/
      - name: Pinned native, Rapier and Godot 4.7
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Unexpected source SHA' }
          python tools/ci/native_candidate_identity.py build/objectshard-windows
          if ($LASTEXITCODE -ne 0) { throw 'Source-bound candidate refused' }
          Copy-Item build/objectshard-windows/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll -Force
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Rapier download failed' }
          if ((Get-FileHash 'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7') { throw 'Rapier SHA mismatch' }
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          curl.exe -fL --retry 3 -o $zip 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed' }
          if ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant() -ne '41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9') { throw 'Godot SHA mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'godot')
          "GODOT_ARCHIVE=$zip" | Out-File -Append $env:GITHUB_ENV
          "GODOT_EXE=$(Join-Path $env:RUNNER_TEMP 'godot/Godot_v4.7-stable_win64_console.exe')" | Out-File -Append $env:GITHUB_ENV
      - name: Windows ordinary Workbench, water, actor and equipment regressions
        shell: pwsh
        run: |
          python tools/objectshard/qualify_workbench.py --godot $env:GODOT_EXE --expected-source-sha $env:GITHUB_SHA --native-candidate build/objectshard-windows --regressions --profile --output evidence/headless
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Workbench qualification failed' }
          python tools/objectshard/qualify_workbench.py --godot $env:GODOT_EXE --expected-source-sha $env:GITHUB_SHA --native-candidate build/objectshard-windows --profile --render --output evidence/graphical
          if ($LASTEXITCODE -ne 0) { throw 'Actual graphical Workbench qualification failed' }
      - name: Portable ordinary Workbench evaluator and shipped launcher replay
        shell: pwsh
        run: |
          $notices = Join-Path $env:RUNNER_TEMP 'objectshard-notices'
          New-Item -ItemType Directory -Force $notices | Out-Null
          foreach ($name in @('LICENSE.txt','COPYRIGHT.txt')) {
            curl.exe -fL --retry 3 -o (Join-Path $notices $name) "https://raw.githubusercontent.com/godotengine/godot/5b4e0cb0f/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Godot notice download failed' }
          }
          if ((Get-FileHash (Join-Path $notices 'LICENSE.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b0435e3b3e4e55238f05f4b306f30524a1b2e20147810d436eaa554fa6855c80' -or (Get-FileHash (Join-Path $notices 'COPYRIGHT.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cb1980c88089573bcacd7221d777c689bb8bbd778799f24c27fca0fe5f774d6d') { throw 'Godot notices mismatch' }
          $runtimeLicense = Join-Path $notices 'Microsoft-Visual-C-Runtime-LICENSE.docx'
          $developerLicense = Join-Path $notices 'Microsoft-Visual-Studio-2022-LICENSE.docx'
          curl.exe -fL --retry 3 -o $runtimeLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/09/Visual-C-Runtime-2015-2022-License-1.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime licence download failed' }
          curl.exe -fL --retry 3 -o $developerLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Redistribution licence download failed' }
          $vc = Join-Path $env:RUNNER_TEMP 'objectshard-vc-runtime'
          & tools/ci/stage_windows_vc_runtime.ps1 -Output $vc -License $runtimeLicense -DeveloperLicense $developerLicense
          python tools/objectshard/package_windows_workbench.py --native-candidate build/objectshard-windows --godot-archive $env:GODOT_ARCHIVE --engine-notices $notices --vc-runtime $vc --output build/objectshard-workbench
          if ($LASTEXITCODE -ne 0) { throw 'Source-bound package refused' }
          & tools/objectshard/verify_workbench_package.ps1 -Package build/objectshard-workbench
          $extractions = Join-Path $env:RUNNER_TEMP 'objectshard-delivered-workbench'
          python tools/objectshard/qualify_workbench_zip.py --package build/objectshard-workbench --zip build/objectshard-workbench-evaluator.zip --extract-root $extractions --output evidence/launcher --timeout (python tools/ci/execution_policy.py seconds graphical_case_seconds)
          if ($LASTEXITCODE -ne 0) { throw 'Shipped launcher or tamper qualification failed' }
          $copy = Join-Path $extractions 'Workbench (1)'
          python tools/objectshard/qualify_workbench.py --godot (Join-Path $copy 'Godot_v4.7-stable_win64_console.exe') --expected-source-sha $env:GITHUB_SHA --package $copy --output evidence/package-replay
          if ($LASTEXITCODE -ne 0) { throw 'Delivered ordinary Workbench replay failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objectshard-m4-workbench-evaluator-${{ github.sha }}-${{ github.run_id }}
          path: build/objectshard-workbench-evaluator.zip
          if-no-files-found: error
          retention-days: 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: objectshard-m4-windows-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          retention-days: 60
