name: QL-017 conditional recovery and branch-ceiling extreme quant (research)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql017_dual_recovery.py'
      - '.github/workflows/driv3r-quant-lab-ql017.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql017-dual-recovery
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  ql017-separate-retrace-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU training dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Retrieve immutable QL-003 quant parents
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Retrieve immutable QL-014 Q4 frontier
        uses: actions/download-artifact@v4
        with:
          name: ql014-frontier-bitpack-qat-exact-head
          run-id: 43913182449
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql014-source
      - name: Retrieve immutable QL-015 STOP-safe Q1
        uses: actions/download-artifact@v4
        with:
          name: ql015-budget-conditioned-stop-exact-head
          run-id: 43924651098
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql015-source
      - name: Retrieve immutable QL-016 sparse-Q1 personality control
        uses: actions/download-artifact@v4
        with:
          name: ql016-contextual-character-exact-head
          run-id: 43934294625
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql016-source
      - name: Self-test conditional recovery, branch contexts and packed QAT
        run: python experiments/driv3r/quant_lab/ql017_dual_recovery.py --self-test
      - name: Run 320 real optimizer updates and generate matched original worm trajectories
        run: |
          python experiments/driv3r/quant_lab/ql017_dual_recovery.py --parent ql003-source --ql014 ql014-source --ql015 ql015-source --ql016 ql016-source --out ql017-out --fp-steps 64 --qat-steps 48
      - name: Verify exact HEAD, optimizer updates, bitpacks, raw legality and hashes
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import numpy as np,torch
          p=Path('ql017-out')
          r=json.loads((p/'results.json').read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha==os.environ['QL_SOURCE_SHA']==r['source_sha']
          assert r['ql016_source_sha']=='2859264115b97a85a2f8150e661779155051559a'
          assert r['ql016_manifest']>=300
          assert r['train_n']>5000 and r['heldout_n']==4352
          assert r['optimizer_updates']==320 and len(r['variants'])==9
          assert r['first_pass_trajectories']==324 and r['original_png_n']==324
          for name,bits,steps,cap in [
            ('recovery-fp32-no-branch-cap',32,64,1.),
            ('recovery-fp32-branch12',32,64,.12),
            ('recovery-q4-branch12',4,48,.12),
            ('recovery-q2-branch12',2,48,.12),
            ('recovery-q1-branch12',1,48,.12),
            ('recovery-q1-branch08',1,48,.08)]:
            c=torch.load(p/'models'/(name+'-optimizer.pt'),weights_only=False)
            assert c['source_sha']==sha and c['bits']==bits and c['updates']==steps
            assert c['sparse_no_chain'] and c['table_fp32'].shape==(4,2,2,2)
            assert len(c['trace'])==steps and all(v>=4 for v in c['support'].values())
            assert len(c['optimizer']['state'])==1
            assert bool(torch.count_nonzero(next(iter(c['optimizer']['state'].values()))['exp_avg']))
            assert abs(c['branch_probability_cap']-cap)<1e-8
            assert c['ql016_checkpoint_sha256']==r['ql016_checkpoint_sha256']
            if bits < 32:
              z=np.load(p/'models'/(name+'-packed.npz'))
              assert len(z['packed'])==(32*bits+7)//8 and len(z['scales'])==4
              assert c['packed_payload']['bytes']==(32*bits+7)//8+16
              assert np.array_equal(z['packed'],c['packed_payload']['packed'])
              assert np.array_equal(z['scales'],c['packed_payload']['scales'])
              assert np.count_nonzero(c['packed_payload']['decoded'][:,:,1,:])==0
          raw=json.loads((p/'raw_decisions.json').read_text())
          assert len(raw)==324
          assert len({(ep['policy'],ep['seed'],ep['family'],ep['override_rate']) for ep in raw})==324
          legal_count=0
          for ep in raw:
            assert ep['first_pass']
            for step in ep['steps']:
              assert step['chosen'] in step['legal'] and 'STOP' in step['legal']
              legal_count+=1
          assert legal_count>3000
          for name,v in r['variants'].items():
            assert v['heldout']['host_legal']==4352
            assert v['contexts']['host_legal']==4352
            assert v['contexts']['recovery']['n']>0
            assert v['contexts']['new_ground']['n']>0
            assert v['stop_budget']['terminal']['n']>0
            assert v['random_10pct']['n_episodes']==18
            assert v['no_random_diagnostic']['n_episodes']==18
            assert v['no_random_diagnostic']['total_host_overrides']==0
          assert hashlib.sha256((p/'raw_decisions.json').read_bytes()).hexdigest()==r['raw_decisions_sha256']
          manifest=json.loads((p/'MANIFEST.json').read_text())
          assert len(manifest)>=335
          assert len({x['path'] for x in manifest})==len(manifest)
          for item in manifest:
            b=(p/item['path']).read_bytes()
            assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']
          assert len(list((p/'gallery').glob('*.png')))==324
          print('QL017 EXACT-HEAD PASS',sha,'legal',legal_count,'manifest',len(manifest))
          PY
      - name: Preserve real optimizer states, packed models, host actions, PNGs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql017-conditional-recovery-exact-head
          path: ql017-out/
          retention-days: 21
          if-no-files-found: warn
