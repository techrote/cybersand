name: PUBPRES Windows evaluation package

on:
  push:
    branches: [codex/pubpres-integration-001]
    paths-ignore:
      - '.github/workflows/pubpres-integration-windows.yml'
      - '.github/workflows/pubpres-warp-transition.yml'
      - 'docs/operations/pubpres-integration-evaluation.md'
      - 'godot/tests/pubpres_transition.gd'
      - 'godot/tests/pubpres_warp_transition_oracle.gd'
      - 'tools/pubpres_integration/warp_transition.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed:
    if: github.ref == 'refs/heads/codex/pubpres-integration-001'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PUBPRES_ACCEPTED_MAIN: de109d0131641d6adc8d25bb9ced7ca3d4991105
      PUBPRES_SOURCE: ${{ github.sha }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize accepted runtimes and stage signed dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Fetch([string]$Url, [string]$File) {
            curl.exe --fail --location --retry 3 --max-time 300 --output $File $Url
            if ($LASTEXITCODE -ne 0) { throw ('Dependency capture failed: ' + $Url) }
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS initialization failed' }
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Accepted Windows runtime materialization failed' }
          $Notices = Join-Path $env:RUNNER_TEMP 'pubpres-notices'
          [void][IO.Directory]::CreateDirectory($Notices)
          Fetch 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip' (Join-Path $env:RUNNER_TEMP 'pubpres-godot.zip')
          $GodotNotices = 'https://raw.githubusercontent.com/godotengine/godot/5b4e0cb0fd279832bbdd69fed5354d4e5ad26f88/'
          foreach ($File in @('LICENSE.txt','COPYRIGHT.txt')) { Fetch ($GodotNotices+$File) (Join-Path $Notices $File) }
          $RuntimeLicense = Join-Path $Notices 'Microsoft-Visual-C-Runtime-LICENSE.docx'
          $DeveloperLicense = Join-Path $Notices 'Microsoft-Visual-Studio-2022-LICENSE.docx'
          Fetch 'https://visualstudio.microsoft.com/wp-content/uploads/2021/09/Visual-C-Runtime-2015-2022-License-1.docx' $RuntimeLicense
          Fetch 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx' $DeveloperLicense
          ./tools/ci/stage_windows_vc_runtime.ps1 -Output (Join-Path $env:RUNNER_TEMP 'pubpres-vc') -License $RuntimeLicense -DeveloperLicense $DeveloperLicense
      - name: Build the source-matched Windows x64 evaluation ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Zip = Join-Path $PWD ('delivery\CyberSand-Workbench-Windows-' + $env:PUBPRES_SOURCE.Substring(0,12) + '.zip')
          python tools/pubpres_integration/package_windows.py `
            --source-sha $env:PUBPRES_SOURCE --accepted-main $env:PUBPRES_ACCEPTED_MAIN `
            --godot-zip (Join-Path $env:RUNNER_TEMP 'pubpres-godot.zip') `
            --notices (Join-Path $env:RUNNER_TEMP 'pubpres-notices') `
            --vc (Join-Path $env:RUNNER_TEMP 'pubpres-vc') `
            --output (Join-Path $env:RUNNER_TEMP 'pubpres-build') --archive $Zip
          if ($LASTEXITCODE -ne 0) { throw 'Source-matched evaluation ZIP build failed' }
          $Installed = Join-Path $env:RUNNER_TEMP 'pubpres installed'
          Expand-Archive -LiteralPath $Zip -DestinationPath $Installed
          python tools/pubpres_integration/package_windows.py --source-sha $env:PUBPRES_SOURCE --output $Installed --verify
          if ($LASTEXITCODE -ne 0) { throw 'Extracted evaluation payload did not match its manifest' }
      - name: Verify the WARP policy with per-revision history readback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Installed = Join-Path $env:RUNNER_TEMP 'pubpres installed'
          $Project = Join-Path $env:RUNNER_TEMP 'pubpres-warp-oracle'
          $Evidence = Join-Path $PWD 'installed-evidence\warp-policy'
          [void][IO.Directory]::CreateDirectory($Evidence)
          Copy-Item -LiteralPath (Join-Path $Installed 'godot') -Destination $Project -Recurse
          $Engine = Join-Path $Installed 'Godot_v4.7-stable_win64_console.exe'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'pubpres-warp-oracle-profile'
          $env:LOCALAPPDATA = $env:APPDATA
          [void][IO.Directory]::CreateDirectory($env:APPDATA)
          $env:CYBERSAND_SOURCE_REVISION = $env:PUBPRES_SOURCE
          $env:CYBERSAND_MATERIAL_PUBLICATION = 'blit'
          & $Engine --headless --path $Project --editor --quit *> (Join-Path $Evidence 'import.log')
          if ($LASTEXITCODE -ne 0) { throw 'WARP history fixture import failed' }
          $Receipt = Join-Path $Evidence 'receipt.json'
          & $Engine --path $Project --rendering-method gl_compatibility --rendering-driver opengl3_angle --render-thread safe --audio-driver Dummy --script res://tests/pubpres_warp_transition_oracle.gd -- --material=blit --expect-warp-full "--receipt=$Receipt" *> (Join-Path $Evidence 'history.log')
          if ($LASTEXITCODE -ne 0) { throw 'WARP full-upload history fixture failed' }
          $Json = Get-Content -LiteralPath $Receipt -Raw | ConvertFrom-Json
          if (-not $Json.complete -or $Json.mode -ne 'warp_full' -or
              $Json.context.source_revision -ne $env:PUBPRES_SOURCE -or
              $Json.current_matches -ne 180 -or $Json.previous_matches -ne 180 -or $Json.sparse_entries -ne 15) {
            throw 'WARP history receipt is incomplete'
          }
      - name: Verify the portable PowerShell entry points
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Installed = Join-Path $env:RUNNER_TEMP 'pubpres installed'
          foreach ($File in Get-ChildItem -LiteralPath (Join-Path $Installed 'tools\pubpres_integration') -Filter '*.ps1') {
            $Tokens = $null
            $Errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
            if ($Errors.Count -ne 0) { throw ($File.Name+': '+($Errors | Out-String)) }
          }
          & (Join-Path $Installed 'Verify Package.cmd')
          if ($LASTEXITCODE -ne 0) { throw 'Portable manifest verification failed' }
      - name: Compare all three installed sources and retained transitions on hosted Windows ANGLE
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Installed = Join-Path $env:RUNNER_TEMP 'pubpres installed'
          $Evidence = Join-Path $PWD 'installed-evidence'
          [void][IO.Directory]::CreateDirectory($Evidence)
          $Cases = @(
            @{launcher='Quick A-B Test.cmd'; flags='-Extended -TimeoutSeconds 900'},
            @{launcher='Transition A-B Test.cmd'; flags='-TimeoutSeconds 480'}
          )
          $Results = foreach ($Case in $Cases) {
            $Launcher = Join-Path $Installed $Case.launcher
            $ProcessInfo = [Diagnostics.ProcessStartInfo]::new()
            $ProcessInfo.FileName = Join-Path $env:SystemRoot 'System32\cmd.exe'
            $ProcessInfo.Arguments = '/d /s /c ""' + $Launcher + '" ' + $Case.flags + ' -RenderingDriver opengl3_angle -RenderThread safe"'
            $ProcessInfo.WorkingDirectory = $Installed
            $ProcessInfo.UseShellExecute = $false
            $Process = [Diagnostics.Process]::Start($ProcessInfo)
            $Process.WaitForExit()
            @{ case=$Case; exit_code=$Process.ExitCode; command=$ProcessInfo.Arguments }
          }
          @{ source=$env:PUBPRES_SOURCE; render='hosted Windows ANGLE'; physical_acceptance='HOLD'; runs=@($Results) } |
            ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $Evidence 'hosted-receipt.json') -Encoding UTF8
          if (@($Results | Where-Object {$_.exit_code -ne 0}).Count -gt 0) { throw 'Installed campaign incomplete; original evidence retained' }
      - name: Qualify installed histories, queue lifetime, gameplay and recovery
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Installed = Join-Path $env:RUNNER_TEMP 'pubpres installed'
          if (-not (Test-Path -LiteralPath (Join-Path $Installed 'PUBPRES-MANIFEST.json'))) {
            throw 'No verified installed payload is available for regression execution'
          }
          python tools/pubpres_integration/qualify_installed.py `
            --installed $Installed --source-sha $env:PUBPRES_SOURCE `
            --output (Join-Path $PWD 'installed-evidence\regressions')
          if ($LASTEXITCODE -ne 0) { throw 'Installed focused regression gate failed; original logs retained' }
      - name: Qualify the portable complete-results collector
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Installed = Join-Path $env:RUNNER_TEMP 'pubpres installed'
          $Results = Join-Path $Installed 'Test-It-Results'
          $Evidence = Join-Path $PWD 'installed-evidence'
          [void][IO.Directory]::CreateDirectory($Evidence)
          if (Test-Path -LiteralPath $Results) {
            $Captured = @(Get-ChildItem -LiteralPath $Results -Directory | Where-Object {
              Test-Path -LiteralPath (Join-Path $_.FullName 'summary.json') -PathType Leaf
            })
            if ($Captured.Count -gt 0) {
              & (Join-Path $Installed 'Pack Results.cmd')
              if ($LASTEXITCODE -ne 0) { throw 'Portable result collection failed' }
              $Collection = Get-ChildItem -LiteralPath $Results -File -Filter 'All-Results-*.zip' |
                Sort-Object -Property Name -Descending | Select-Object -First 1
              if ($null -eq $Collection) { throw 'Portable result collection did not create its ZIP' }
              Add-Type -AssemblyName System.IO.Compression,System.IO.Compression.FileSystem
              $Archive = [IO.Compression.ZipFile]::OpenRead($Collection.FullName)
              try {
                $Entry = $Archive.GetEntry('COLLECTION.json')
                if ($null -eq $Entry) { throw 'Result collection lacks its run index' }
                $Reader = [IO.StreamReader]::new($Entry.Open())
                try { $Index = $Reader.ReadToEnd() | ConvertFrom-Json } finally { $Reader.Dispose() }
                if ($Index.physical_acceptance -ne 'HOLD' -or $Index.runs.Count -ne $Captured.Count -or
                    $null -eq $Archive.GetEntry('ACCEPTANCE.md') -or
                    $null -eq $Archive.GetEntry('CURRENT-PACKAGE-MANIFEST.json')) {
                  throw 'Result collection omitted a captured run or owner/source context'
                }
                foreach ($Folder in $Captured) {
                  if ($Folder.Name -notin $Index.runs -or $null -eq $Archive.GetEntry('runs/'+$Folder.Name+'/summary.json')) {
                    throw 'Result collection omitted an original run summary'
                  }
                }
              } finally { $Archive.Dispose() }
              @{ complete=$true; source=$env:PUBPRES_SOURCE; captured_runs=$Captured.Count;
                 archive=$Collection.Name; sha256=(Get-FileHash -LiteralPath $Collection.FullName -Algorithm SHA256).Hash.ToLower();
                 physical_acceptance='HOLD' } | ConvertTo-Json -Depth 5 |
                Set-Content -LiteralPath (Join-Path $Evidence 'portable-result-collection.json') -Encoding UTF8
            }
          }
      - name: Retain original installed evidence and failure receipts
        if: always()
        shell: powershell
        run: |
          $Evidence = Join-Path $PWD 'installed-evidence'
          $Installed = Join-Path $env:RUNNER_TEMP 'pubpres installed'
          $Results = Join-Path $Installed 'Test-It-Results'
          [void][IO.Directory]::CreateDirectory($Evidence)
          if (Test-Path -LiteralPath $Results) {
            Get-ChildItem -LiteralPath $Results -File -Filter '*.zip' | Copy-Item -Destination $Evidence
            foreach ($Folder in Get-ChildItem -LiteralPath $Results -Directory) {
              if (Test-Path -LiteralPath ($Folder.FullName+'.zip')) { continue }
              $Prefix = $Folder.FullName.Length+1
              foreach ($File in Get-ChildItem -LiteralPath $Folder.FullName -Recurse -File) {
                $Relative = $File.FullName.Substring($Prefix)
                if ($Relative -match '(^|\\)profile(\\|$)|^project\\') { continue }
                $Destination = Join-Path (Join-Path $Evidence $Folder.Name) $Relative
                [void][IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($Destination))
                Copy-Item -LiteralPath $File.FullName -Destination $Destination
              }
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-windows-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-windows-installed-${{ github.run_id }}-${{ github.run_attempt }}
          path: installed-evidence/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
