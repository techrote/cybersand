name: Issue 65 focused soliding

on:
  push:
    branches: [codex/issue-65-stage3b-exact-reconstruction]
    paths:
      - native/include/cybersand/settled_regions.hpp
      - native/tests/test_settled_regions.cpp

permissions:
  contents: read

concurrency:
  group: issue65-focused-soliding
  cancel-in-progress: true

jobs:
  soliding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run focused settled-region regression
        run: timeout 8m make soliding-test
