name: DRIV3R FT-014 learned STOP sidecar vs frozen feature-ablation

on:
  push:
    branches: [research/570-fleet-training-throughput-001]
    paths:
      - .github/workflows/driv3r-fleet-training-ft014.yml
      - experiments/driv3r/fleet_training/ft014_stop_sidecar.py
      - experiments/driv3r/fleet_training/request_ft014.json
      - experiments/driv3r/fleet_training/test_ft014_stop_sidecar.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train-sidecar:
    name: FT-014 synthetic game-policy STOP gate seed ${{ matrix.seed }} cohort ${{ matrix.cohort }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [9401, 9403]
        cohort: [navigation, art]
    concurrency:
      group: driv3r-ft014-${{ github.ref }}-${{ matrix.seed }}-${{ matrix.cohort }}
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: techrote/cybersand
          ref: 534cd8ffac6fbe33a714ae03a62c16045bf10259
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only requirements
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 PyYAML==6.0.2
      - name: Qualify exact source, training-only scope and provider authority
        run: |
          set -euo pipefail
          python -m compileall -q experiments/driv3r/fleet_training
          python -m unittest discover -s experiments/driv3r/fleet_training -p 'test_*.py' -v
          python tools/ci/check_ci_provider_policy.py
          python tools/ci/check_ci_scheduling_policy.py
      - name: Persist independent source and model lease
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ft014-original" "$RUNNER_TEMP/ft003-original"
          git rev-parse HEAD > "$RUNNER_TEMP/ft014-original/exact-head.txt"
          sha256sum experiments/driv3r/fleet_training/{ft014_stop_sidecar.py,request_ft014.json,test_ft014_stop_sidecar.py} > "$RUNNER_TEMP/ft014-original/owned-source.sha256"
          printf 'FT014 run=%s attempt=%s job=%s seed=%s cohort=%s head=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "${{ matrix.seed }}" "${{ matrix.cohort }}" "$GITHUB_SHA" > "$RUNNER_TEMP/ft014-original/lease.txt"
      - name: Obtain immutable upstream trained FT-003 model archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/ft003-original.zip" "https://api.github.com/repos/techrote/cybersand/actions/artifacts/14194214028/zip"
          echo "fec6d5e254a0bbe590b44ba26bbb7427960af507a5c6fe78b1d7e5fe5389c910  $RUNNER_TEMP/ft003-original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ft003-original.zip" -d "$RUNNER_TEMP/ft003-original"
          sha256sum "$RUNNER_TEMP/ft003-original.zip" >> "$RUNNER_TEMP/ft014-original/owned-source.sha256"
      - name: Train two matched STOP heads for three independent frozen policies and evaluate OOD
        run: |
          set -euo pipefail
          python experiments/driv3r/fleet_training/ft014_stop_sidecar.py --request experiments/driv3r/fleet_training/request_ft014.json --upstream upstream --ft003 "$RUNNER_TEMP/ft003-original" --output "$RUNNER_TEMP/ft014-original/run" --seed ${{ matrix.seed }} --cohort ${{ matrix.cohort }}
      - name: Preserve gate weights, legal-action receipts, galleries and failed jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft014-${{ matrix.seed }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ft014-original/
          if-no-files-found: warn
          retention-days: 14
