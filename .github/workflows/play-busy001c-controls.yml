name: PLAY-BUSY-001C process controls

on:
  push:
    branches:
      - codex/play-busy001c-cleanup-20261103
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-busy001c-controls-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  windows-process-controls:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out exact control source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve immutable source and check provider policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/play-busy001c-controls | Out-Null
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Source mismatch' }
          git rev-parse HEAD | Set-Content build/play-busy001c-controls/source-sha.txt
          git archive --format=tar.gz --output=build/play-busy001c-controls/source.tar.gz HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/check_ci_provider_policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run creation-bound process controls without Godot or native builds
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/ci/test_play_busy001c_process.py *> build/play-busy001c-controls/process.log
          $result = $LASTEXITCODE
          Get-Content build/play-busy001c-controls/process.log
          if ($result -ne 0) { exit $result }
          python -O tools/ci/test_play_busy001c_process.py *> build/play-busy001c-controls/process-optimized.log
          $result = $LASTEXITCODE
          Get-Content build/play-busy001c-controls/process-optimized.log
          if ($result -ne 0) { exit $result }
      - name: Hash retained evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build/play-busy001c-controls) {
            Get-ChildItem build/play-busy001c-controls -File | Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content build/play-busy001c-controls/SHA256SUMS
          }
      - name: Retain process-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: play-busy001c-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/play-busy001c-controls/
          if-no-files-found: error
          retention-days: 90
