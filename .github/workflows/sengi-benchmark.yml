name: Sengi historical benchmark

run-name: Sengi shard-0 benchmark ${{ inputs.trial || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      trial:
        description: Benchmark trial label
        required: true
        default: trial-1
  push:
    branches:
      - ci/sengi-benchmark-run
    paths:
      - .github/workflows/sengi-benchmark.yml

permissions:
  contents: read
  actions: read

env:
  BENCH_TRIAL: "2"
  HISTORICAL_SHA: ed4b9abe542a5de0d498a62d3de7f157fe40d129
  HISTORICAL_RUN_ID: 35434827192
  GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_VERSION: 4.7.stable.official.5b4e0cb0f

jobs:
  shard0:
    name: historical Linux shard 0
    runs-on: sengi-standard-4-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Check out exact historical PR merge source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HISTORICAL_SHA }}

      - name: Record runner identity
        run: |
          echo "source=$HISTORICAL_SHA"
          echo "nproc=$(nproc)"
          uname -a
          lscpu

      - name: Restore exact Avrea-produced historical runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-runtime-35434827192
          run-id: 35434827192
          github-token: ${{ github.token }}
          path: build/linux-runtime

      - name: Verify and install historical runtime
        run: |
          echo "benchmark_trial=$BENCH_TRIAL"
          echo "artifact_source=$(cat build/linux-runtime/source-sha.txt)"
          echo "expected_source=$HISTORICAL_SHA"
          test "$(cat build/linux-runtime/source-sha.txt)" = "$HISTORICAL_SHA"
          (
            cd build/linux-runtime
            sha256sum --check --strict runtime.sha256
          )
          cp build/linux-runtime/libcybersand_native.linux.x86_64.so \
             godot/addons/cybersand_native/bin/
          cp build/linux-runtime/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so \
             godot/addons/godot-rapier2d/bin/
          timeout 1m tools/check_linux_runtime_floor.sh

      - name: Prepare exact Godot 4.7 runtime
        run: |
          timeout 10m curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = "$GODOT_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Run exact historical shard 0
        run: |
          python3 tools/ci/run_godot_regressions.py \
            --godot "$GODOT_BIN" \
            --output build/sengi-benchmark \
            --shard-count 4 \
            --shard-index 0

      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sengi-shard0-${{ github.run_id }}
          path: build/sengi-benchmark/
          if-no-files-found: warn
          retention-days: 7