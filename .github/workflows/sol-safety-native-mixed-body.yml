name: SOL safety exact native mixed-body qualification

on:
  push:
    branches: [sol/safety-composition-20261105]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-safety-native-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_LINUX_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
  GODOT_LINUX_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
  GODOT_WINDOWS_SHA512: 41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9
  GODOT_VERSION: 4.7.stable.official.5b4e0cb0f
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65

jobs:
  linux-actual:
    name: Linux candidate-built World/Rapier mixed body
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
          persist-credentials: false
      - name: Verify exact source and provider
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/ci/check_ci_provider_policy.py
          mkdir -p build/sol-safety-native/linux
          git rev-parse HEAD > build/sol-safety-native/linux/source-sha.txt
          sha256sum native/include/cybersand/granular_contact_response.hpp godot/native_extension/workbench_granular_coupling.inc tools/experiments/sol_safety_mixed_body_capture.py > build/sol-safety-native/linux/source-inputs.sha256
      - name: Materialize pinned Linux Rapier
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" --exclude=""
          echo "566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | sha256sum --check --strict
      - name: Prepare exact build dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__=="4.10.1"'
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
      - name: Build exact candidate Linux extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "2"
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ github.workspace }}/build/sol-safety-native/linux/libcybersand_native.linux.x86_64.so
        run: |
          set -euo pipefail
          timeout 35m tools/build_pinned_godot_cpp.sh linux
          timeout 20m tools/build_native_extension.sh
          file "$CYBERSAND_NATIVE_OUTPUT" | tee build/sol-safety-native/linux/runtime-file.txt
          grep -q 'ELF 64-bit.*x86-64' build/sol-safety-native/linux/runtime-file.txt
          sha256sum "$CYBERSAND_NATIVE_OUTPUT" > build/sol-safety-native/linux/runtime.sha256
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
      - name: Prepare pinned Godot
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_LINUX_URL"
          echo "$GODOT_LINUX_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"; chmod +x "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = "$GODOT_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import and execute Original/Active actual World plus Rapier
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path godot --editor --quit > build/sol-safety-native/linux/import.log 2>&1
          for policy in original active-normal-001; do
            out="$PWD/build/sol-safety-native/linux/$policy"
            mkdir -p "$out"
            CYBERSAND_SOURCE_REVISION="$GITHUB_SHA"             LA_PHYSICAL_REGISTRATION="res://tests/fixtures/la_physical/sol-active-normal-live-001.json"             LA_PHYSICAL_CASES="shared-granular-bodies"             LA_PHYSICAL_WORKERS=1 LA_PHYSICAL_REPEAT=0 LA_PHYSICAL_OUTPUT="$out"             SOL_NORMAL_POLICY="$policy"               "$GODOT_BIN" --headless --audio-driver Dummy --path godot                 --script res://tests/support/sol_active_normal_authored.gd                 > "build/sol-safety-native/linux/$policy.log" 2>&1
          done
          python3 tools/experiments/sol_safety_mixed_body_capture.py             --original build/sol-safety-native/linux/original             --active build/sol-safety-native/linux/active-normal-001             --source-sha "$GITHUB_SHA"             --output build/sol-safety-native/linux/mixed-body-capture.json             | tee build/sol-safety-native/linux/reduction.log
          sha256sum build/sol-safety-native/linux/mixed-body-capture.json godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so >> build/sol-safety-native/linux/runtime.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sol-safety-native-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol-safety-native/linux/
          if-no-files-found: error
          retention-days: 90

  windows-build:
    name: Build exact candidate Windows runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
          persist-credentials: false
      - name: Verify exact source and prepare build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/ci/check_ci_provider_policy.py
          mkdir -p build/sol-safety-native/windows-build
          git rev-parse HEAD > build/sol-safety-native/windows-build/source-sha.txt
          sha256sum native/include/cybersand/granular_contact_response.hpp godot/native_extension/workbench_granular_coupling.inc tools/experiments/sol_safety_mixed_body_capture.py > build/sol-safety-native/windows-build/source-inputs.sha256
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; fi
      - name: Build exact Windows extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "2"
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ github.workspace }}/build/sol-safety-native/windows-build/cybersand_native.windows.x86_64.dll
        run: |
          set -euo pipefail
          timeout 35m tools/build_pinned_godot_cpp.sh windows
          timeout 20m tools/build_native_extension_windows.sh
          file "$CYBERSAND_NATIVE_OUTPUT" | tee build/sol-safety-native/windows-build/runtime-file.txt
          grep -q 'PE32+ executable (DLL).*x86-64' build/sol-safety-native/windows-build/runtime-file.txt
          (cd build/sol-safety-native/windows-build && sha256sum cybersand_native.windows.x86_64.dll > runtime.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol-safety-windows-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol-safety-native/windows-build/
          if-no-files-found: error
          retention-days: 1

  windows-actual:
    name: Actual Windows candidate World/Rapier mixed body
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sol-safety-windows-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol-safety-native/windows
      - name: Verify runtime/source and materialize pinned Rapier
        run: |
          set -euo pipefail
          test "$(cat build/sol-safety-native/windows/source-sha.txt)" = "$GITHUB_SHA"
          (cd build/sol-safety-native/windows && sha256sum --check --strict runtime.sha256)
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          echo "b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7  godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" | sha256sum --check --strict
          cp build/sol-safety-native/windows/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll
      - name: Prepare pinned Windows Godot
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 --output "$RUNNER_TEMP/godot-windows.zip" "$GODOT_WINDOWS_URL"
          echo "$GODOT_WINDOWS_SHA512  $RUNNER_TEMP/godot-windows.zip" | sha512sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot-windows"
          unzip -q "$RUNNER_TEMP/godot-windows.zip" -d "$RUNNER_TEMP/godot-windows"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-windows" -maxdepth 1 -type f -name '*console.exe' -print -quit)"
          test -n "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = "$GODOT_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import and execute Original/Active actual Windows World plus Rapier
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          mkdir -p build/sol-safety-native/windows
          "$GODOT_BIN" --headless --path godot --editor --quit > build/sol-safety-native/windows/import.log 2>&1
          for policy in original active-normal-001; do
            out="$PWD/build/sol-safety-native/windows/$policy"
            mkdir -p "$out"
            CYBERSAND_SOURCE_REVISION="$GITHUB_SHA"             LA_PHYSICAL_REGISTRATION="res://tests/fixtures/la_physical/sol-active-normal-live-001.json"             LA_PHYSICAL_CASES="shared-granular-bodies"             LA_PHYSICAL_WORKERS=1 LA_PHYSICAL_REPEAT=0 LA_PHYSICAL_OUTPUT="$out"             SOL_NORMAL_POLICY="$policy"               "$GODOT_BIN" --headless --audio-driver Dummy --path godot                 --script res://tests/support/sol_active_normal_authored.gd                 > "build/sol-safety-native/windows/$policy.log" 2>&1
          done
          python tools/experiments/sol_safety_mixed_body_capture.py             --original build/sol-safety-native/windows/original             --active build/sol-safety-native/windows/active-normal-001             --source-sha "$GITHUB_SHA"             --output build/sol-safety-native/windows/mixed-body-capture.json             | tee build/sol-safety-native/windows/reduction.log
          sha256sum build/sol-safety-native/windows/mixed-body-capture.json godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll >> build/sol-safety-native/windows/runtime.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sol-safety-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol-safety-native/windows/
          if-no-files-found: error
          retention-days: 90
