name: LFM2.5-VL WORM W14 actual family-swapped inference with optional STOP
on:
  push:
    branches: [codex/agent-painter-lfm25-vl-568]
    paths:
      - experiments/agent_painter/lanes/lfm25_vl/worm-w14-family-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: lfm25-vl-worm-w14-first-family-stop-one-model-per-vm-v1
  cancel-in-progress: false

jobs:
  resident-fleet:
    name: 24-turn-budget family-sensitivity full-VL W10 shard ${{ matrix.shard }} (1 model at a time)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [alpha, beta]
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout exact immutable evaluator source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout pinned W0 host
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          path: worm-w0
          persist-credentials: false
      - name: Checkout pinned LFM support curriculum
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: cc27b3206cb61f98432fa95b799c9b9ff508c2bc
          path: worm-support
          persist-credentials: false
      - name: Model-free preflight source and lease checking
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C worm-w0 rev-parse HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git hash-object worm-w0/experiments/agent_painter/worm/common/worm.py)" = 8979b6f0296e81051194bacc907992d38e006605
          test "$(git -C worm-support rev-parse HEAD)" = cc27b3206cb61f98432fa95b799c9b9ff508c2bc
          test "$(git hash-object worm-support/experiments/agent_painter/worm/support_lfm/curriculum.py)" = f205a3a9f33632aeaafa2daa8ce25b2484bc6032
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("experiments/agent_painter/lanes/lfm25_vl/worm-w13-fleet-request.json").read_text())
          assert r == {
            "schema":"cybersand.worm.lfm-w13-128-resident-fleet/1",
            "purpose":"four-actual-W10-LFM-128-turn-W0-host-PNG-and-matched-controls",
            "producer_source":"1e57a4df8d344b209a14df886dd898211dcc4918",
            "producer_run":43754365984,
            "checkpoint":"checkpoint-000045",
            "model":"LiquidAI/LFM2.5-VL-450M",
            "model_revision":"fc6221ca597f3315e4f82fc2df606783267b34ba",
            "alpha":[{"seed":6111,"family":"greebles"},{"seed":6127,"family":"pipework"}],
            "beta":[{"seed":6143,"family":"architecture"},{"seed":6167,"family":"greebles"}],
            "real_decisions_per_model":128,
            "model_instances_per_vm":2,
            "target_independent_loaded_models":4,
            "hosted_inference_vm_count":2,
            "native_128_unsupported":True,
            "new_optimizer_updates":0,
            "native_execution":False,
            "sealed_FINAL_opened":False,
            "Draft_HOLD":True,
            "attempt":1,
          }
          PY
          python3 -m py_compile experiments/agent_painter/lanes/lfm25_vl/worm_w14_worker_v1.py experiments/agent_painter/lanes/lfm25_vl/worm_w14_audit_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("experiments/agent_painter/lanes/lfm25_vl/worm-w14-family-request.json").read_text())
          assert d["schema"]=="cybersand.worm.lfm-w14-family-and-STOP/1"
          assert d["model"]=="LiquidAI/LFM2.5-VL-450M"
          assert d["revision"]=="fc6221ca597f3315e4f82fc2df606783267b34ba"
          assert d["producer_source"]=="1e57a4df8d344b209a14df886dd898211dcc4918"
          assert d["producer_run"]==43754365984 and d["checkpoint"]=="checkpoint-000045"
          assert d["seeds"]=={"alpha":6211,"beta":6217}
          assert d["families"]==["greebles","pipework","architecture"]
          assert d["turn_budget"]==24 and d["attempt"]==1
          assert d["stop_suppressed"] is False and d["optimizer_updates"]==0
          assert d["native_execution"] is False and d["sealed_FINAL_opened"] is False
          assert d["draft_hold"] is True and d["model_instances_per_vm"]==1
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/lfm-w13-fleet-policy.json
          mkdir -p evidence/diagnostics
          git rev-parse HEAD > evidence/diagnostics/evaluator-source.txt
          git -C worm-w0 rev-parse HEAD > evidence/diagnostics/w0-source.txt
          git -C worm-support rev-parse HEAD > evidence/diagnostics/support-source.txt
          lscpu > evidence/diagnostics/cpu.txt
          free -h > evidence/diagnostics/memory.txt
      - name: Verify immutable actual W10 checkpoint source and download producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/techrote/cybersand/actions/runs/43754365984 --jq .head_sha)" = 1e57a4df8d344b209a14df886dd898211dcc4918
          test "$(gh api repos/techrote/cybersand/actions/runs/43754365984 --jq .conclusion)" = success
          mkdir -p evidence/prior
          gh run download 43754365984 -R techrote/cybersand --name lfm25-vl-worm-w10-paired-six-way-1e57a4df8d344b209a14df886dd898211dcc4918-43754365984-1 --dir evidence/prior
          test -f evidence/prior/worm-w10/checkpoint-000045/inventory.json
          test -f evidence/prior/worm-w10/optimizer-pairs.jsonl
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("evidence/prior/worm-w10")
          m=json.loads((root/"corpus-manifest.json").read_text())
          assert hashlib.sha256((root/"optimizer-pairs.jsonl").read_bytes()).hexdigest()==m["pair_sha256"]
          s=json.loads((root/"summary.json").read_text())
          assert s["status"]=="complete" and s["actual_optimizer_updates"]==45
          assert s["real_backward_passes"]==90
          assert s["source_sha"]=="1e57a4df8d344b209a14df886dd898211dcc4918"
          PY
      - name: Install qualified official full-VL CPU packages
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lfm-w13-fleet"
          "$RUNNER_TEMP/lfm-w13-fleet/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/lfm-w13-fleet/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/lfm-w13-fleet/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torchvision==0.29.2+cpu'
          "$RUNNER_TEMP/lfm-w13-fleet/bin/python" -m pip install -r experiments/agent_painter/training/requirements-lfm25_vl.lock
          "$RUNNER_TEMP/lfm-w13-fleet/bin/python" -m pip check
          "$RUNNER_TEMP/lfm-w13-fleet/bin/python" -m pip freeze --all > evidence/diagnostics/pip-freeze.txt
      - name: Download exact complete LiquidAI full multimodal weights and processor
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/lfm-w13-fleet/bin/python" experiments/agent_painter/training/download_model.py --profile lfm25_vl --output "$RUNNER_TEMP/lfm-w13-model"
          cp "$RUNNER_TEMP/lfm-w13-model/download_receipt.json" evidence/diagnostics/model-download.json
          LFM25_SNAPSHOT="$RUNNER_TEMP/lfm-w13-model" "$RUNNER_TEMP/lfm-w13-fleet/bin/python" experiments/agent_painter/lanes/lfm25_vl/test_adapter.py > evidence/diagnostics/adapter-tests.txt 2>&1
      - name: Source-test legal W14 sampler including optional STOP
        env:
          PYTHONPATH: experiments/agent_painter/lanes/lfm25_vl:experiments/agent_painter/training
        run: |
          "$RUNNER_TEMP/lfm-w13-fleet/bin/python" - <<'PY'
          import worm_w14_worker_v1 as w
          fake={"candidate_logits":{a:0.0 for a in w.w7.ACTIONS}}
          action, receipt=w.scored_policy(fake,["LEFT","STOP"],"learned",6211,0)
          assert "STOP" in receipt["sampled_legal"] and receipt["STOP_deferred_unless_forced"] is False
          assert abs(sum(receipt["sample_probs"].values())-1.0)<1e-10
          assert action in ("LEFT","STOP") and w.TURNS==24
          PY
      - name: Actual W10 model closed-loop in three families on the SAME obstacle seed
        env:
          PYTHONPATH: experiments/agent_painter/lanes/lfm25_vl:experiments/agent_painter/training
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in alpha) seed=6211;; beta) seed=6217;; *) exit 2;; esac
          mkdir -p evidence/w14/${{ matrix.shard }}
          echo 'GO' > "$RUNNER_TEMP/w14-go"
          for family in greebles pipework architecture; do
            timeout --signal=TERM --kill-after=45s 1080s "$RUNNER_TEMP/lfm-w13-fleet/bin/python" experiments/agent_painter/lanes/lfm25_vl/worm_w14_worker_v1.py \
              --model "$RUNNER_TEMP/lfm-w13-model" \
              --worm-root worm-w0/experiments/agent_painter/worm/common \
              --support-root worm-support/experiments/agent_painter/worm/support_lfm \
              --producer-root evidence/prior/worm-w10 \
              --output evidence/w14/${{ matrix.shard }}/$family \
              --go-file "$RUNNER_TEMP/w14-go" --phase W14-family-stop \
              --lease "lfm-w14-${{ github.run_id }}-${{ matrix.shard }}-$family" \
              --seed "$seed" --family "$family"
          done
          "$RUNNER_TEMP/lfm-w13-fleet/bin/python" experiments/agent_painter/lanes/lfm25_vl/worm_w14_audit_v1.py \
            --root evidence/w14/${{ matrix.shard }} \
            --worm-root worm-w0/experiments/agent_painter/worm/common \
            --seed "$seed"
      - name: Retain original per-PID PNGs, partial/failure and CPU receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lfm25-vl-worm-w14-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/w14/
            evidence/diagnostics/
          if-no-files-found: warn
          retention-days: 90
