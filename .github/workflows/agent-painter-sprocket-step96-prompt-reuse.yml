name: SPROCKET historical step96 cross-family geometry reuse (source only)
on:
  push:
    branches: [codex/agent-painter-sprocket-568]
    paths:
      - experiments/agent_painter/lanes/sprocket/step96-prompt-reuse-request.json
permissions:
  contents: read
  actions: read
concurrency:
  group: sprocket-step96-reuse-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Source and safety contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = techrote/cybersand
          test "$GITHUB_REF" = refs/heads/codex/agent-painter-sprocket-568
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/sprocket-reuse-scheduling.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/agent_painter/lanes/sprocket/step96-prompt-reuse-request.json')
          d=json.loads(p.read_text())
          assert d=={
            'schema':'cybersand.sprocket-step96-prompt-reuse-request/1',
            'sequence':1,'early_run':43523253619,'early_artifact':14083354475,
            'early_sha256':'686f67190766d71667b8e78c9a58bdcd121070eff1b75bad21327ac63f3d6b2a',
            'late_run':43536717867,'late_artifact':14089867633,
            'late_sha256':'991d2f2c0a578d935c839d5e5b4650ad8b9b9116348a54e873340f59f115ff23',
            'read_only':True,'native_execution':False,'optimizer_steps':0,
            'model_inference':False,'final_access':False,'draft_hold':True}
          PY
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/diagnose_step96_reuse.py
          mkdir -p evidence/sprocket-step96-reuse "$RUNNER_TEMP/sprocket-reuse"
          git rev-parse HEAD > evidence/sprocket-step96-reuse/source-head.txt
          echo 'INCOMPLETE_NO_QUALITY_CLAIM' > evidence/sprocket-step96-reuse/incomplete.txt
      - name: Download and hash immutable original DEVELOPMENT first-pass archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for line in 'early 14083354475 686f67190766d71667b8e78c9a58bdcd121070eff1b75bad21327ac63f3d6b2a' 'late 14089867633 991d2f2c0a578d935c839d5e5b4650ad8b9b9116348a54e873340f59f115ff23'; do
            read -r stage id hash <<< "$line"
            curl -fLsS --retry 2 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/techrote/cybersand/actions/artifacts/$id/zip" -o "$RUNNER_TEMP/sprocket-reuse/$stage.zip"
            echo "$hash  $RUNNER_TEMP/sprocket-reuse/$stage.zip" | sha256sum -c --strict
          done
      - name: Original first-pass positive and adversarial tests
        env:
          SPROCKET_ORIGINAL_EARLY: ${{ runner.temp }}/sprocket-reuse/early.zip
          SPROCKET_ORIGINAL_LATE: ${{ runner.temp }}/sprocket-reuse/late.zip
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/agent_painter/lanes/sprocket python3 -m unittest discover -s experiments/agent_painter/lanes/sprocket -p test_diagnose_step96_reuse.py -v
          python3 experiments/agent_painter/lanes/sprocket/diagnose_step96_reuse.py --early "$SPROCKET_ORIGINAL_EARLY" --late "$SPROCKET_ORIGINAL_LATE" --output evidence/sprocket-step96-reuse/diagnostic.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('evidence/sprocket-step96-reuse/diagnostic.json').read_text())
          assert d['summary']['step96']['terminal_eos']==5
          assert d['summary']['step96']['valid_program']==1
          assert d['cross_family_exact_first_two_box_reuse'][0]['request_count']==3
          assert d['pipework_exact_nodes_edges_equal'] is True
          assert d['new_model_completions']==d['new_optimizer_updates']==d['new_native_paintings']==0
          assert d['final_opened'] is False
          PY
          rm evidence/sprocket-step96-reuse/incomplete.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-step96-reuse-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/sprocket-step96-reuse/
          if-no-files-found: warn
          retention-days: 90
