name: DRIV3R FT-011 real reached-goal STOP paired CPU training

on:
  push:
    branches: [research/570-fleet-training-throughput-001]
    paths:
      - .github/workflows/driv3r-fleet-training-ft011.yml
      - experiments/driv3r/fleet_training/ft011_goal_stop.py
      - experiments/driv3r/fleet_training/request_ft011.json
      - experiments/driv3r/fleet_training/test_ft011_goal_stop.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matched-goal-training:
    name: FT-011 synthetic game policies seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [9401, 9403]
    concurrency:
      group: driv3r-ft011-${{ matrix.seed }}
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: techrote/cybersand
          ref: 534cd8ffac6fbe33a714ae03a62c16045bf10259
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin CPU dependencies (no paid accelerator)
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 PyYAML==6.0.2
      - name: Test game authority, source custody and policy-only scope
        run: |
          set -euo pipefail
          python -m compileall -q experiments/driv3r/fleet_training
          python -m unittest discover -s experiments/driv3r/fleet_training -p 'test_*.py' -v
          python tools/ci/check_ci_provider_policy.py
          python tools/ci/check_ci_scheduling_policy.py
      - name: Record exact immutable job lease before fetching optimizer weights
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ft011-original" "$RUNNER_TEMP/ft003-original"
          git rev-parse HEAD > "$RUNNER_TEMP/ft011-original/owned-source-head.txt"
          sha256sum experiments/driv3r/fleet_training/request_ft011.json \
            experiments/driv3r/fleet_training/ft011_goal_stop.py \
            > "$RUNNER_TEMP/ft011-original/source-files.sha256"
          printf 'run=%s job=%s seed=%s branch=%s source=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_JOB" "${{ matrix.seed }}" "$GITHUB_REF" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/ft011-original/job-lease.txt"
      - name: Download verified immutable FT-003 original checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$RUNNER_TEMP/ft003-original.zip" \
            "https://api.github.com/repos/techrote/cybersand/actions/artifacts/14194214028/zip"
          echo "fec6d5e254a0bbe590b44ba26bbb7427960af507a5c6fe78b1d7e5fe5389c910  $RUNNER_TEMP/ft003-original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ft003-original.zip" -d "$RUNNER_TEMP/ft003-original"
          sha256sum "$RUNNER_TEMP/ft003-original.zip" >> "$RUNNER_TEMP/ft011-original/source-files.sha256"
      - name: Execute matched real optimizer and fresh goal/autonomy evaluation
        run: |
          set -euo pipefail
          python experiments/driv3r/fleet_training/ft011_goal_stop.py \
            --request experiments/driv3r/fleet_training/request_ft011.json \
            --upstream upstream \
            --ft003 "$RUNNER_TEMP/ft003-original" \
            --output "$RUNNER_TEMP/ft011-original/run" \
            --seed ${{ matrix.seed }}
      - name: Preserve original policies, receipts, galleries and failed-job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft011-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ft011-original/
          if-no-files-found: warn
          retention-days: 14
