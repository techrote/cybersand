name: GENTEK 80 source qualification and Windows evaluation
on:
  push:
    branches: [integration/gentek-80-001]
    paths:
      - 'Makefile'
      - 'tools/ci/test_gentek80*'
      - 'native/**'
      - 'godot/**'
      - 'examples/worldgen/**'
      - 'tools/architecture/**'
      - 'tools/ci/gentek80*'
      - 'tools/ci/build_gentek80_runtime.py'
      - 'tools/ci/run_gentek80_native.py'
      - '.github/workflows/gentek80-qualification.yml'
      - 'docs/research/gentek-80-integration-001.md'
      - 'docs/images/gentek-80/**'
      - 'docs/images/gentek80-integration/**'
      - 'docs/operations/gentek80-evaluation.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gentek80-${{ github.run_id }}
  cancel-in-progress: false
env:
  ARCHITECTURE_BASE_SHA: ac0d9fb944cb5a81369d03c0c3bc5eab50ab6742
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  RAPIER_SHA256: 566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
  RAPIER_WINDOWS_SHA256: b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7
jobs:
  publisher-guards:
    name: GENTEK-80 source and four-file publication guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Compile and challenge source-bound publisher
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ci/gentek80_runtime_publication.py
          python3 tools/ci/test_gentek80_runtime_publication.py
          python3 tools/ci/test_gen007_architectural_runtime_publication.py
          python3 tools/ci/test_lcb001_shared_contract_runtime_publication.py
          python3 tools/ci/check_ci_provider_policy.py
          # These fast source fixtures must pass before either long native build.
          python3 tools/architecture/test_classic_repair_comparison.py
          for test in tools/architecture/test_qualify_*.py tools/architecture/test_metabolist_provenance.py; do
            python3 "$test"
          done
  linux:
    needs: publisher-guards
    # Keep the bounded guards on ordinary PR/main changes. Full pinned builds,
    # graphical replay and packaging are explicit or confined to this campaign.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/integration/gentek-80-001')
    name: Linux native GENTEK-80 and graphical Workbench
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify source and pinned dependencies
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          python3 tools/ci/check_ci_provider_policy.py > evidence/provider.json
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          echo "$RAPIER_SHA256  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | sha256sum -c --strict
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/scons-install.log 2>&1
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
      - name: Existing native generation and hierarchy suites
        run: |
          set -euo pipefail
          timeout 3600 python3 tools/ci/run_gentek80_native.py --compiler g++-13 --output evidence/native-worldgen --include-worldgen > evidence/native-worldgen.log 2>&1 || { tail -150 evidence/native-worldgen.log; exit 1; }
          ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 5400 make -j2 worldgen-sanitize CXX=g++-13 > evidence/native-sanitized.log 2>&1 || { tail -150 evidence/native-sanitized.log; exit 1; }
      - name: Build exact-source native extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
        run: |
          set -euo pipefail
          timeout 3600 bash tools/build_pinned_godot_cpp.sh linux > evidence/build-godot-cpp.log 2>&1 || { tail -120 evidence/build-godot-cpp.log; exit 1; }
          timeout 3600 python3 tools/ci/build_gentek80_runtime.py --platform linux --ledger evidence/runtime-build-linux.json > evidence/build-native.log 2>&1 || { tail -160 evidence/build-native.log; exit 1; }
          sha256sum godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so > evidence/native.sha256
          # Retain the actual executed bytes even if a later acceptance guard
          # correctly refuses them; the validated publication artifact remains
          # a separate success-only output.
          cp godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so evidence/
          bash tools/check_linux_runtime_floor.sh > evidence/abi-floor.log 2>&1
      - name: Fetch pinned Godot and run actual graphical owner workflow
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          GALLIVM_PERF: nopt
        run: |
          set -euo pipefail
          timeout 600 curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          bash tools/ci/prepare_linux_display.sh > evidence/display-setup.log 2>&1
          # Exercise the actual inherited Godot receipt producer before the
          # expensive graphical/native campaigns, not just synthetic JSON.
          python3 tools/architecture/check_gentek80_workbench_receipt.py --godot "$GODOT_BIN" --output evidence/workbench-receipt-producer
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            python3 tools/architecture/qualify.py --godot "$GODOT_BIN" --project godot --output evidence/architecture --graphical --legacy-regressions
          # This integrated candidate includes accepted GEN-008 Flatten. Exercise
          # actual material-baseline author/reopen, file-faults and a quarantined
          # native owner in the same source-matched mounted Workbench. The
          # existing full GEN-008 campaign remains separate and unchanged.
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            python3 tools/ci/run_flatten_qualification.py --godot "$GODOT_BIN" --project godot \
              --evidence evidence/flatten-integration --cases 512x1
      - name: Complete catalogue, repaired geometry and compiler cache campaign
        env:
          GENTEK_TEST_COMPILER_A: /usr/bin/g++-13
          GENTEK_TEST_COMPILER_B: /usr/bin/g++-14
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gallery"
          "$RUNNER_TEMP/gallery/bin/python" -m pip install --require-hashes -r tools/architecture/requirements-render-linux.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-14
          /usr/bin/g++-14 --version
          python3 tools/architecture/test_compiler_cache.py > evidence/compiler-cache.log 2>&1
          python3 tools/architecture/test_classic_repair_comparison.py > evidence/classic-repair-comparison.log 2>&1
          for test in tools/architecture/test_qualify_*.py tools/architecture/test_metabolist_provenance.py; do
            python3 "$test" > "evidence/$(basename "$test" .py).log" 2>&1
          done
          "$RUNNER_TEMP/gallery/bin/python" tools/architecture/test_compare_interlaced_compilers.py > evidence/interlaced-parity-guards.log 2>&1
          set +e
          "$RUNNER_TEMP/gallery/bin/python" tools/architecture/render_interlaced_viaduct.py --compiler /usr/bin/g++-13 --output evidence/interlaced-gcc13 --require-clean-source > evidence/interlaced-gcc13.log 2>&1
          gcc13_status=$?
          "$RUNNER_TEMP/gallery/bin/python" tools/architecture/render_interlaced_viaduct.py --compiler /usr/bin/g++-14 --output evidence/interlaced-gcc14 --require-clean-source > evidence/interlaced-gcc14.log 2>&1
          gcc14_status=$?
          "$RUNNER_TEMP/gallery/bin/python" tools/architecture/compare_interlaced_compilers.py --gcc13 evidence/interlaced-gcc13 --gcc14 evidence/interlaced-gcc14 --source-sha "$GITHUB_SHA" --output evidence/interlaced-compiler-parity.json
          parity_status=$?
          set -e
          if (( gcc13_status != 0 || gcc14_status != 0 || parity_status != 0 )); then
            tail -80 evidence/interlaced-gcc13.log evidence/interlaced-gcc14.log
            exit 1
          fi
          "$RUNNER_TEMP/gallery/bin/python" tools/architecture/qualify_interlaced.py --compiler /usr/bin/g++-13 --parent-ref e27ff75758ef51c7b7c8b4d8a7093343cc2ecede --output evidence/interlaced-parent > evidence/interlaced-parent.log 2>&1
          "$RUNNER_TEMP/gallery/bin/python" tools/architecture/test_gentek80_campaign.py > evidence/gallery-boundaries.log 2>&1
          "$RUNNER_TEMP/gallery/bin/python" tools/architecture/gentek80_campaign.py --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --output evidence/gentek80-gallery --require-clean-source --runtime-build-ledger evidence/runtime-build-linux.json --reference-gallery docs/images/gentek80-integration/gallery-manifest.json
          "$RUNNER_TEMP/gallery/bin/python" tools/architecture/gentek80_repair_comparison.py --before 615828b28337f85e4663e03ba479616db4ddf764 --after "$GITHUB_SHA" --compiler g++-13 --output evidence/gentek80-repairs
      - name: All 80 real Workbench selections, material edits and separate-process reopen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          GALLIVM_PERF: nopt
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            python3 tools/architecture/gentek80_workbench.py --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --output evidence/gentek80-workbench --graphical
      - name: Record and attest actual source-matched Linux library
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p build/gentek80-publish-linux
          {
            echo "Ubuntu 24.04 Linux x86_64; pinned godot-cpp=$GODOT_CPP_COMMIT; SCons=4.10.1"
            g++-13 --version | head -n 1
            find "$RUNNER_TEMP/godot-cpp/bin" -maxdepth 1 -name 'libgodot-cpp*.a' -exec sha256sum '{}' ';'
            sha256sum godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          } > evidence/native-publisher-toolchain.txt
          python3 tools/ci/gentek80_runtime_publication.py record --source-sha "$GITHUB_SHA" --platform linux \
            --bundle build/gentek80-publish-linux \
            --runtime godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so \
            --toolchain evidence/native-publisher-toolchain.txt
          python3 tools/ci/gentek80_runtime_publication.py accept --source-sha "$GITHUB_SHA" --platform linux \
            --bundle build/gentek80-publish-linux --qualification evidence/architecture \
            --flatten evidence/flatten-integration --workbench evidence/gentek80-workbench --gallery evidence/gentek80-gallery --godot-archive "$RUNNER_TEMP/godot.zip"
      - name: Preserve validated Linux native and graphical receipts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek80-validated-linux-${{ github.run_id }}
          path: build/gentek80-publish-linux/
          if-no-files-found: error
          retention-days: 90
      - name: Retain original Linux results and actual native previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
  windows-build:
    needs: publisher-guards
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/integration/gentek-80-001')
    name: Pinned source-matched Windows DLL
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Prepare exact pinned Windows build inputs
        run: |
          set -euo pipefail
          mkdir -p evidence build/architecture-windows build/architecture-windows-base
          git rev-parse HEAD > evidence/source-commit.txt
          GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$RUNNER_TEMP/architecture-immutable-base" "$ARCHITECTURE_BASE_SHA"
          git -C "$RUNNER_TEMP/architecture-immutable-base" rev-parse HEAD > evidence/immutable-base-commit.txt
          python3 tools/ci/check_ci_provider_policy.py > evidence/provider.json
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/scons-install.log 2>&1
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          timeout 1200 curl -fL --retry 3 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; fi
      - name: Build pinned godot-cpp and candidate extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ github.workspace }}/build/architecture-windows/cybersand_native.windows.x86_64.dll
        run: |
          set -euo pipefail
          timeout 3600 bash tools/build_pinned_godot_cpp.sh windows > evidence/build-godot-cpp.log 2>&1 || { tail -120 evidence/build-godot-cpp.log; exit 1; }
          timeout 3600 python3 tools/ci/build_gentek80_runtime.py --platform windows --ledger build/architecture-windows/runtime-build-windows.json > evidence/build-native.log 2>&1 || { tail -160 evidence/build-native.log; exit 1; }
          python3 tools/ci/native_candidate_identity.py build/architecture-windows --create
      - name: Build immutable accepted-base DLL with the same pinned toolchain
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ github.workspace }}/build/architecture-windows-base/cybersand_native.windows.x86_64.dll
        run: |
          set -euo pipefail
          timeout 3600 bash "$RUNNER_TEMP/architecture-immutable-base/tools/build_native_extension_windows.sh" > evidence/build-immutable-base.log 2>&1 || { tail -160 evidence/build-immutable-base.log; exit 1; }
          python3 "$RUNNER_TEMP/architecture-immutable-base/tools/ci/native_candidate_identity.py" "$GITHUB_WORKSPACE/build/architecture-windows-base" --create
          sha256sum "$GODOT_CPP_ROOT/bin/libgodot-cpp.windows.template_debug.x86_64.a" > evidence/shared-godot-cpp.sha256
      - name: Bind cross-compiled Windows binary to pinned compiler and source
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          {
            echo "Ubuntu 24.04 cross-target Windows x86_64; godot-cpp=$GODOT_CPP_COMMIT; SCons=4.10.1"
            "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-g++" --version | head -n 1
            echo "LLVM-MinGW archive SHA-256=$LLVM_MINGW_SHA256"
            find "$RUNNER_TEMP/godot-cpp/bin" -maxdepth 1 -name 'libgodot-cpp*.a' -exec sha256sum '{}' ';'
            sha256sum build/architecture-windows/cybersand_native.windows.x86_64.dll
          } > evidence/native-publisher-toolchain.txt
          python3 tools/ci/gentek80_runtime_publication.py record --source-sha "$GITHUB_SHA" --platform windows \
            --bundle build/gentek80-publish-windows \
            --runtime build/architecture-windows/cybersand_native.windows.x86_64.dll \
            --toolchain evidence/native-publisher-toolchain.txt
      - name: Retain Windows source-bound prepublication custody
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek80-prepublish-windows-${{ github.run_id }}
          path: build/gentek80-publish-windows/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-windows-runtime-${{ github.run_id }}
          path: build/architecture-windows/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-windows-base-${{ github.run_id }}
          path: build/architecture-windows-base/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: architecture-windows-build-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
  windows:
    name: Windows graphical owner workflow and packaged re-execution
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Use the pinned gallery Python minor version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: architecture-windows-runtime-${{ github.run_id }}
          path: build/architecture-windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: architecture-windows-base-${{ github.run_id }}
          path: build/architecture-windows-base
      - name: Restore independently recorded Windows build custody
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gentek80-prepublish-windows-${{ github.run_id }}
          path: build/gentek80-publish-windows
      - name: Verify and install same-source native runtime and official Godot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python tools/ci/native_candidate_identity.py build/architecture-windows
          if ($LASTEXITCODE -ne 0) { throw 'Native source/runtime custody failed' }
          Copy-Item build/architecture-windows/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/ -Force
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll,godot/tools/gentek_reciprocal.exe' --exclude=''
          $rapier = 'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'
          if ((Get-FileHash $rapier -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RAPIER_WINDOWS_SHA256) { throw 'Rapier pin mismatch' }
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          curl.exe -fL --retry 3 -o $zip https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed' }
          $sha = '41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9'
          if ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant() -ne $sha) { throw 'Godot archive pin mismatch' }
          $engine = Join-Path $env:RUNNER_TEMP 'godot'
          Expand-Archive $zip $engine
          'GODOT_EXE=' + (Join-Path $engine 'Godot_v4.7-stable_win64_console.exe') | Out-File -Append $env:GITHUB_ENV
      - name: Check actual inherited Workbench receipt producer before long campaigns
        shell: pwsh
        run: |
          python tools/architecture/check_gentek80_workbench_receipt.py --godot $env:GODOT_EXE --output evidence/workbench-receipt-producer
          if ($LASTEXITCODE -ne 0) { throw 'Actual Workbench receipt producer contract failed' }
      - name: Independently verify and execute immutable accepted-base Windows reference
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'architecture-immutable-base'
          $env:GIT_LFS_SKIP_SMUDGE = '1'
          git worktree add --detach $base $env:ARCHITECTURE_BASE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Immutable-base checkout failed' }
          Remove-Item Env:GIT_LFS_SKIP_SMUDGE
          $candidate = (Resolve-Path build/architecture-windows-base).Path
          python (Join-Path $base 'tools/ci/native_candidate_identity.py') $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Immutable-base source/runtime custody failed' }
          Copy-Item (Join-Path $candidate 'cybersand_native.windows.x86_64.dll') (Join-Path $base 'godot/addons/cybersand_native/bin/') -Force
          $rapier = 'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'
          Copy-Item $rapier (Join-Path $base $rapier) -Force
          if ((Get-FileHash (Join-Path $base $rapier) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RAPIER_WINDOWS_SHA256) { throw 'Immutable-base Rapier pin mismatch' }
          python tools/architecture/qualify.py --godot $env:GODOT_EXE --project (Join-Path $base 'godot') --source-root $base --output evidence/windows-base --suite legacy-reference
          if ($LASTEXITCODE -ne 0) { throw 'Immutable-base Windows capture failed' }
      - name: Execute exact-source native materials, UI, author and independent reopen
        shell: pwsh
        run: |
          python tools/architecture/qualify.py --godot $env:GODOT_EXE --project godot --output evidence/architecture --graphical --legacy-regressions --legacy-reference evidence/windows-base/legacy-materials.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows architectural qualification failed' }
      - name: Verify combined GEN-007 plus accepted GEN-008 Flatten native Workbench
        shell: pwsh
        run: |
          python tools/ci/run_flatten_qualification.py --godot $env:GODOT_EXE --project godot --evidence evidence/flatten-integration --cases 512x1
          if ($LASTEXITCODE -ne 0) { throw 'Combined Windows architecture/Flatten qualification failed' }
      - name: Qualify all 80 catalogue styles in native materials and ordinary Windows Workbench
        shell: pwsh
        run: |
          python -m pip install Pillow==13.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Gallery dependency installation failed' }
          python tools/architecture/gentek80_campaign.py --godot $env:GODOT_EXE --output evidence/gentek80-gallery --require-clean-source --runtime-build-ledger build/architecture-windows/runtime-build-windows.json --reference-gallery docs/images/gentek80-integration/gallery-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Complete Windows catalogue campaign failed' }
          python tools/architecture/gentek80_workbench.py --godot $env:GODOT_EXE --output evidence/gentek80-workbench --graphical
          if ($LASTEXITCODE -ne 0) { throw 'All-80 Windows Workbench author/reopen failed' }
      - name: Package source-matched Windows owner candidate
        shell: pwsh
        run: |
          $notices = Join-Path $env:RUNNER_TEMP 'godot-notices'
          New-Item -ItemType Directory -Force $notices | Out-Null
          foreach ($name in @('LICENSE.txt','COPYRIGHT.txt')) {
            curl.exe -fL --retry 3 -o (Join-Path $notices $name) "https://raw.githubusercontent.com/godotengine/godot/5b4e0cb0f/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot notices download failed' }
          }
          if ((Get-FileHash (Join-Path $notices 'LICENSE.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b0435e3b3e4e55238f05f4b306f30524a1b2e20147810d436eaa554fa6855c80' -or (Get-FileHash (Join-Path $notices 'COPYRIGHT.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cb1980c88089573bcacd7221d777c689bb8bbd778799f24c27fca0fe5f774d6d') { throw 'Pinned Godot notices hash mismatch' }
          $runtimeLicense = Join-Path $notices 'Microsoft-Visual-C-Runtime-LICENSE.docx'
          $developerLicense = Join-Path $notices 'Microsoft-Visual-Studio-2022-LICENSE.docx'
          curl.exe -fL --retry 3 -o $runtimeLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/09/Visual-C-Runtime-2015-2022-License-1.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft runtime licence download failed' }
          curl.exe -fL --retry 3 -o $developerLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft VS redistribution licence download failed' }
          $vc = Join-Path $env:RUNNER_TEMP 'vc-runtime'
          & tools/ci/stage_windows_vc_runtime.ps1 -Output $vc -License $runtimeLicense -DeveloperLicense $developerLicense
          if ($LASTEXITCODE -ne 0) { throw 'VC runtime staging failed' }
          $gui = $env:GODOT_EXE.Replace('_console.exe','.exe')
          python tools/package_explore001_candidate.py --engine $gui --engine-notices $notices --native-candidate build/architecture-windows --vc-runtime $vc --readme docs/operations/gentek80-evaluation.md --output build/architecture-desktop-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Owner candidate packaging failed' }
          $archive = "build/CyberSand-Gentek80-Windows-$($env:GITHUB_SHA.Substring(0,12)).zip"
          Compress-Archive -Path build/architecture-desktop-candidate/* -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + (Split-Path $archive -Leaf) | Set-Content "$archive.sha256"
          $validation = Join-Path $env:RUNNER_TEMP 'architecture-package-validation'
          Expand-Archive $archive $validation
          $manifest = Get-Content (Join-Path $validation 'candidate-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne $env:GITHUB_SHA) { throw 'Extracted package source mismatch' }
          foreach ($entry in $manifest.files_sha256.PSObject.Properties) {
            $path = Join-Path $validation $entry.Name
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw "Extracted package file mismatch: $($entry.Name)" }
          }
          # Godot is allowed to update imported asset metadata in the *test
          # extraction* during editor import. Re-run the independent Flatten
          # package integrity gate from a second pristine extraction, never
          # from a directory already touched by the architecture owner test.
          $flattenValidation = Join-Path $env:RUNNER_TEMP 'architecture-flatten-package-validation'
          Expand-Archive $archive $flattenValidation
          python tools/ci/run_flatten_qualification.py --godot (Join-Path $flattenValidation 'Godot_v4.7-stable_win64_console.exe') --project (Join-Path $flattenValidation 'godot') --package $flattenValidation --evidence evidence/package-flatten --cases 512x1
          if ($LASTEXITCODE -ne 0) { throw 'Delivered ZIP combined architecture/Flatten author and reopen failed' }
          python tools/architecture/qualify.py --godot (Join-Path $validation 'Godot_v4.7-stable_win64_console.exe') --project (Join-Path $validation 'godot') --output evidence/package --suite owner --graphical
          if ($LASTEXITCODE -ne 0) { throw 'Delivered ZIP author/reopen failed' }
          $gentekValidation = Join-Path $env:RUNNER_TEMP 'gentek80-package-validation'
          Expand-Archive $archive $gentekValidation
          python tools/architecture/gentek80_workbench.py --godot (Join-Path $gentekValidation 'Godot_v4.7-stable_win64_console.exe') --project (Join-Path $gentekValidation 'godot') --package $gentekValidation --output evidence/package-gentek80-workbench --graphical
          if ($LASTEXITCODE -ne 0) { throw 'All-80 extracted Windows package replay failed' }
      - name: Attest Windows graphical native, Flatten and extracted owner package
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          python tools/ci/gentek80_runtime_publication.py accept --source-sha $env:GITHUB_SHA --platform windows --bundle build/gentek80-publish-windows --qualification evidence/architecture --flatten evidence/flatten-integration --package evidence/package --package-flatten evidence/package-flatten --workbench evidence/gentek80-workbench --gallery evidence/gentek80-gallery --package-workbench evidence/package-gentek80-workbench --godot-archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'GENTEK-80 Windows publication acceptance failed' }
      - name: Retain validated Windows DLL and graphical/package receipts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek80-validated-windows-${{ github.run_id }}
          path: build/gentek80-publish-windows/
          if-no-files-found: error
          retention-days: 90
      - name: Retain Windows owner evaluation ZIP and exact archive hash
        # Preserve a completed archive even when later attestation refuses it.
        # Its existence never authorizes publication or package acceptance.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek80-owner-windows-${{ github.sha }}
          path: |
            build/CyberSand-Gentek80-Windows-*.zip
            build/CyberSand-Gentek80-Windows-*.zip.sha256
          if-no-files-found: warn
          retention-days: 90
      - name: Retain original Windows process evidence and captured frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90


  publish:
    name: Atomically retain only two qualified native libraries and two provenance records
    needs: [publisher-guards, linux, windows-build, windows]
    if: github.event_name == 'push' && github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/integration/gentek-80-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout immutable built source, not a moving branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Fence source SHA, exact branch, request and remote lease
        run: |
          set -euo pipefail
          python3 tools/ci/test_gentek80_runtime_publication.py
          python3 tools/ci/gentek80_runtime_publication.py check-source --source-sha "$GITHUB_SHA"
          git lfs install --local
      - name: Retrieve validated Linux runtime and receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gentek80-validated-linux-${{ github.run_id }}
          path: build/gentek80-publish-linux
      - name: Retrieve validated Windows runtime and receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gentek80-validated-windows-${{ github.run_id }}
          path: build/gentek80-publish-windows
      - name: Independently verify both receipts and stage only the four retained paths
        run: |
          set -euo pipefail
          python3 tools/ci/gentek80_runtime_publication.py stage --source-sha "$GITHUB_SHA" \
            --linux-bundle build/gentek80-publish-linux --windows-bundle build/gentek80-publish-windows
          git add -- godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so \
            godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll \
            godot/addons/cybersand_native/runtime-provenance.linux.json \
            godot/addons/cybersand_native/runtime-provenance.json
          python3 tools/ci/gentek80_runtime_publication.py check-index --source-sha "$GITHUB_SHA"
          git diff --check --cached
          git diff --exit-code
      - name: Commit onto unchanged PR branch only, never merge
        run: |
          set -euo pipefail
          python3 tools/ci/gentek80_runtime_publication.py check-source --source-sha "$GITHUB_SHA"
          python3 tools/ci/gentek80_runtime_publication.py check-index --source-sha "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(gentek80): retain exact-source Linux and Windows runtimes'
          test "$(git rev-list --parents -n 1 HEAD)" = "$(git rev-parse HEAD) $GITHUB_SHA"
          git push --force-with-lease="refs/heads/integration/gentek-80-001:$GITHUB_SHA" \
            origin HEAD:refs/heads/integration/gentek-80-001
          {
            echo "GENTEK_FINAL_SHA=$(git rev-parse HEAD)"
            echo "GENTEK_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          } >> "$GITHUB_ENV"
          {
            echo '### GENTEK-80 source-matched runtime publication'
            echo "Built and qualified source: $GITHUB_SHA"
            echo "Four-file publication commit: $(git rev-parse HEAD)"
            echo 'Both target-OS graphical and native/Flatten and package replays passed. The PR remains unmerged.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Execute legacy publication guards from the exact final candidate
        id: final_guards
        env:
          TARGET_SHA: ${{ env.GENTEK_FINAL_SHA }}
          TARGET_TREE: ${{ env.GENTEK_FINAL_TREE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git diff --exit-code HEAD
          mkdir -p evidence/legacy-guards
          git ls-files -z tools/ci | xargs -0 sha256sum > evidence/legacy-guards/ci-source.sha256
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          folder = Path('evidence/legacy-guards')
          commands = [
              ('py-compile', ['python3', '-m', 'py_compile', 'tools/ci/gen007_architectural_runtime_publication.py']),
              ('gen007-publisher', ['python3', 'tools/ci/test_gen007_architectural_runtime_publication.py']),
              ('lcb001-publisher', ['python3', 'tools/ci/test_lcb001_shared_contract_runtime_publication.py']),
              ('provider-policy', ['python3', 'tools/ci/check_ci_provider_policy.py']),
          ]
          results = []
          receipt = {'schema': 'gentek80-final-source-legacy-guards-v1', 'passed': False,
                     'status': 'running', 'tested_candidate_commit': os.environ['TARGET_SHA'],
                     'tested_candidate_tree': os.environ['TARGET_TREE'],
                     'orchestration_commit': os.environ['GITHUB_SHA'],
                     'orchestration_run': os.environ['GITHUB_RUN_ID'], 'commands': results,
                     'source_hash_list_sha256': hashlib.sha256((folder / 'ci-source.sha256').read_bytes()).hexdigest(),
                     'scope': 'Fresh execution of the four unchanged GEN-007 guard commands. This is not the old workflow full native/platform/package campaign.'}
          def save():
              (folder / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          save()
          for name, command in commands:
              path = folder / (name + '.log')
              row = {'name': name, 'command': command, 'status': 'started', 'returncode': None}
              results.append(row)
              save()
              with path.open('wb') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
              row.update(status='completed', returncode=result.returncode,
                         log_sha256=hashlib.sha256(path.read_bytes()).hexdigest())
              save()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          clean = subprocess.run(['git', 'diff', '--exit-code', 'HEAD'], capture_output=True).returncode == 0
          passed = (head == os.environ['TARGET_SHA'] and tree == os.environ['TARGET_TREE']
                    and clean and len(results) == 4 and all(row['returncode'] == 0 for row in results))
          receipt.update(passed=passed, status='completed', tested_candidate_commit=head,
                         tested_candidate_tree=tree, tracked_inputs_unchanged=clean)
          save()
          print(json.dumps(receipt, indent=2))
          raise SystemExit(0 if passed else 1)
          PY
      - name: Retain final-candidate legacy guard evidence
        if: always() && steps.final_guards.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek80-final-guards-${{ github.run_id }}
          path: evidence/legacy-guards/
          if-no-files-found: error
          retention-days: 90
      - name: Request every applicable final-head workflow without changing Draft status
        id: final_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ env.GENTEK_FINAL_SHA }}
          TARGET_TREE: ${{ env.GENTEK_FINAL_TREE }}
          TARGET_BRANCH: integration/gentek-80-001
          ACCEPTED_MAIN: de109d0131641d6adc8d25bb9ced7ca3d4991105
        run: |
          set -euo pipefail
          mkdir -p evidence/final-dispatch
          python3 - <<'PY'
          import datetime, hashlib, json, os, subprocess
          from pathlib import Path
          folder = Path('evidence/final-dispatch')
          destination = folder / 'dispatch-request.json'
          receipt = {
              'schema': 'gentek80-final-source-dispatch-v1',
              'status': 'preparing',
              'tested_candidate_commit': os.environ['TARGET_SHA'],
              'tested_candidate_tree': os.environ['TARGET_TREE'],
              'target_branch': os.environ['TARGET_BRANCH'],
              'accepted_main': os.environ['ACCEPTED_MAIN'],
              'orchestration_commit': os.environ['GITHUB_SHA'],
              'orchestration_run': os.environ['GITHUB_RUN_ID'],
              'requested_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'requested_workflows': ['documentation.yml', 'native.yml', 'gdextension.yml', 'palette-shader-qualification.yml', 'wave-flow.yml', 'native-scope-advisory.yml'],
              'commands': [],
              'errors': [],
              'scope': 'Dispatch requests only. Each resulting run must independently show the exact candidate head and retain its own results.',
          }
          def save():
              destination.write_text(json.dumps(receipt, indent=2) + '\n')
          def execute(name, command):
              row = {'name': name, 'command': command, 'status': 'started'}
              receipt['commands'].append(row)
              save()
              try:
                  result = subprocess.run(command, capture_output=True, timeout=120)
              except subprocess.TimeoutExpired as error:
                  row.update(status='timed_out', returncode=None)
                  for stream, data in [('stdout', error.stdout or b''), ('stderr', error.stderr or b'')]:
                      path = folder / (name + '.' + stream + '.log')
                      path.write_bytes(data)
                      row[stream + '_sha256'] = hashlib.sha256(data).hexdigest()
                  save()
                  raise
              row.update(status='completed', returncode=result.returncode)
              for stream, data in [('stdout', result.stdout), ('stderr', result.stderr)]:
                  path = folder / (name + '.' + stream + '.log')
                  path.write_bytes(data)
                  row[stream + '_sha256'] = hashlib.sha256(data).hexdigest()
              save()
              return result
          save()
          api = ['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY']
                 + '/git/ref/heads/' + os.environ['TARGET_BRANCH'], '--jq', '.object.sha']
          try:
              before = execute('lease-before', api)
              receipt['branch_before'] = before.stdout.decode().strip()
              if before.returncode or receipt['branch_before'] != os.environ['TARGET_SHA']:
                  raise RuntimeError('Initial final-candidate branch lease does not match')
              receipt['status'] = 'requesting'
              for workflow in receipt['requested_workflows']:
                  command = ['gh', 'workflow', 'run', workflow, '--repo', os.environ['GITHUB_REPOSITORY'],
                             '--ref', os.environ['TARGET_BRANCH']]
                  if workflow == 'native-scope-advisory.yml':
                      command += ['-f', 'base_sha=' + os.environ['ACCEPTED_MAIN']]
                  result = execute(workflow, command)
                  if result.returncode:
                      receipt['errors'].append('Dispatch failed: ' + workflow)
                      break
              after = execute('lease-after', api)
              receipt['branch_after'] = after.stdout.decode().strip()
              if after.returncode or receipt['branch_after'] != os.environ['TARGET_SHA']:
                  receipt['errors'].append('Final-candidate branch lease changed during dispatch')
              receipt['status'] = 'failed' if receipt['errors'] else 'requested'
          except Exception as error:
              receipt['status'] = 'failed'
              receipt['errors'].append(type(error).__name__ + ': ' + str(error))
          finally:
              receipt['finished_utc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              save()
          print(json.dumps(receipt, indent=2))
          raise SystemExit(0 if receipt['status'] == 'requested' else 1)
          PY
      - name: Retain original final-head dispatch requests and failures
        if: always() && steps.final_dispatch.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek80-final-dispatch-${{ github.run_id }}
          path: evidence/final-dispatch/
          if-no-files-found: error
          retention-days: 90
