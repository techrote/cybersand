name: QL-010 matched-state contrastive extreme-quant game worms (research)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql010_paired_contrastive.py'
      - '.github/workflows/driv3r-quant-lab-ql010.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql010-matched-contrastive
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  paired-game-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Retrieve immutable original QL-003 trained Q1/Q4 parent
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Check host safety and zero-patch starting identity
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql010_paired_contrastive.py --self-test
      - name: Run 192 genuine paired-state optimizer updates and first-pass synthetic trials
        run: |
          python experiments/driv3r/quant_lab/ql010_paired_contrastive.py \
            --parent ql003-source --out ql010-out --steps 64 --horizon 96
      - name: Source-qualified checkpoint, real matched-pair, original-PNG and action validation
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import torch
          root=Path("ql010-out")
          r=json.loads((root/"results.json").read_text())
          sha=os.environ["QL_SOURCE_SHA"]
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==sha
          assert r["source_sha"]==sha
          assert r["parent_source_sha"]=="9b4103c48127e5c8538403e2a4d9e2525fbe8755"
          assert r["parent_manifest_verified"]>=330
          assert r["optimizer_updates"]==192 and r["heldout_n"]==4352
          assert r["train_matched_pairs"]==2048 and r["heldout_matched_pairs"]==512
          assert len(r["training"])==3 and len(r["variants"])==5
          assert len(r["controls"])==3
          assert r["first_pass_trajectories"]==144 and r["original_png_n"]==144
          for name,model in r["training"].items():
              assert model["updates"]==64 and model["adam_nonzero_moment_tensors"]==2
              assert model["parent_packed_codes_unchanged"] and model["frozen_class_bias"]
              checkpoint=torch.load(root/"models"/(name+"-optimizer.pt"),map_location="cpu",
                                    weights_only=False)
              assert checkpoint["source_sha"]==sha and len(checkpoint["trace"])==64
              assert checkpoint["parent_source_sha"]==r["parent_source_sha"]
              assert any(float(s["paired_contrastive"])>0 for s in checkpoint["trace"])
          raw=json.loads((root/"raw_decisions.json").read_text())
          assert len(raw)==144
          assert all(row["first_pass"] and
                     all(t["chosen"] in t["legal"] for t in row["steps"]) for row in raw)
          assert all("STOP" in row["steps"][0]["legal"] for row in raw if row["steps"])
          for model in r["variants"].values():
              h=model["heldout"]
              assert h["host_legal_masked"]==4352
              p=model["paired_heldout"]
              assert p["n_pairs"]==p["same_legal_menu_pairs"]==512
              assert p["teacher_action_diff_pairs"]==p["legal_both_teachers"]==512
              if "constant_correction_zero_gap_check" in p:
                  assert p["constant_correction_zero_gap_check"]
          assert hashlib.sha256((root/"raw_decisions.json").read_bytes()).hexdigest()==r["raw_decisions_sha256"]
          manifest=json.loads((root/"MANIFEST.json").read_text())
          assert len({m["path"] for m in manifest})==len(manifest)
          for item in manifest:
              data=(root/item["path"]).read_bytes()
              assert len(data)==item["bytes"]
              assert hashlib.sha256(data).hexdigest()==item["sha256"]
          assert len(list((root/"gallery").glob("*.png")))==144
          print("QL010 EXACT-HEAD PASS",sha,"manifest",len(manifest),
                "matched heldout pairs",r["heldout_matched_pairs"],
                "original first-pass PNGs",r["original_png_n"])
          PY
      - name: Archive immutable optimizer states, honest negative results and original images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql010-matched-state-contrastive-repair
          path: ql010-out/
          retention-days: 21
          if-no-files-found: warn
