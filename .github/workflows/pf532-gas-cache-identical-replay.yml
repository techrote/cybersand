name: PF532 sparse gas relabel exact native replay
on:
  push:
    branches: [sol/pf-gas-selective-bootstrap-20261107]
    paths:
      - '.github/workflows/pf532-gas-cache-identical-replay.yml'
      - 'native/**'
      - 'tools/ci/pf532_emit_native_replay_tape.py'
      - 'tools/ci/pf532_compare_native_input_replay.py'
      - 'tools/material_catalogue/compatibility.py'
      - 'docs/audits/2026-11-07-pf-gas-selective-cache-transition.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pf532-exact-native-replay-${{ github.run_id }}
  cancel-in-progress: false
env:
  ACCEPTED_MAIN: 81bbd5ff5cf366159e2b8a630609359c13560080
  GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_SILENCE_ROOT_WARNING: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  exact-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source and protected transition
        run: |
          set -euo pipefail
          mkdir -p build/pf532-replay/{fixtures,logs}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD
          git diff --check
          python3 tools/material_catalogue/compatibility.py --check >build/pf532-replay/material-authority.json
          git diff --name-only "$ACCEPTED_MAIN" HEAD -- native/src native/include | sort >build/pf532-replay/native-source-delta.txt
          diff -u <(printf '%s\n'             native/include/cybersand/pressure_optimization.hpp             native/src/world_pressure.inc             native/src/world_pressure_cache.inc             native/src/world_pressure_cache_state.inc             native/src/world_pressure_gas_cache.inc             native/src/world_pressure_state.inc | sort) build/pf532-replay/native-source-delta.txt
          git worktree add --detach "$RUNNER_TEMP/pf-base" "$ACCEPTED_MAIN"
          git rev-parse HEAD HEAD^{tree} "$ACCEPTED_MAIN" >build/pf532-replay/source-heads.txt
      - name: Export actual authored full-size fixture and frozen input tape
        timeout-minutes: 15
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 600 -o "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          chmod +x "$GODOT_BIN"
          export PF_CAPACITY_FIXTURE_DIR="$GITHUB_WORKSPACE/build/pf532-replay/fixtures"
          timeout 240 "$GODOT_BIN" --headless --path godot --script res://tests/pf_c2048_export_fixtures.gd             >build/pf532-replay/logs/export.log 2>&1 || { tail -120 build/pf532-replay/logs/export.log; exit 1; }
          python3 tools/ci/pf532_emit_native_replay_tape.py             --workbench-setup godot/scripts/workbench_setup.gd             --fixture build/pf532-replay/fixtures/stress-canvas.csv             --out build/pf532-replay/replay-tape.csv
      - name: Build baseline and candidate from exact sources
        timeout-minutes: 35
        run: |
          set -euo pipefail
          cp native/bench/pf532_gas_cache_input_replay.cpp "$RUNNER_TEMP/pf-base/native/bench/"
          flags=(-std=c++20 -O2 -DNDEBUG -pthread -Wall -Wextra -I native/include)
          sources=(native/src/world.cpp native/src/material_rules.cpp native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp)
          (cd "$RUNNER_TEMP/pf-base" && timeout 1100 g++-13 "${flags[@]}" "${sources[@]}" native/bench/pf532_gas_cache_input_replay.cpp             -o "$GITHUB_WORKSPACE/build/pf532-replay/baseline") >build/pf532-replay/logs/build-baseline.log 2>&1 || {
              tail -160 build/pf532-replay/logs/build-baseline.log; exit 1; }
          timeout 1100 g++-13 "${flags[@]}" "${sources[@]}" native/bench/pf532_gas_cache_input_replay.cpp             -o build/pf532-replay/candidate >build/pf532-replay/logs/build-candidate.log 2>&1 || {
              tail -160 build/pf532-replay/logs/build-candidate.log; exit 1; }
          sha256sum build/pf532-replay/baseline build/pf532-replay/candidate >build/pf532-replay/binaries.sha256
      - name: Replay identical inputs and compare every physical tick
        timeout-minutes: 65
        run: |
          set -euo pipefail
          root=build/pf532-replay
          for workers in 1 4; do
            for camera in 0 1; do
              for role in baseline candidate; do
                timeout 1000 "$root/$role" "$root/fixtures/stress-canvas.csv" "$root/replay-tape.csv" "$workers" "$camera"                   >"$root/$role-w$workers-camera$camera.csv" 2>"$root/logs/$role-w$workers-camera$camera.log" || {
                    tail -150 "$root/logs/$role-w$workers-camera$camera.log"; exit 1; }
              done
            done
          done
          python3 tools/ci/pf532_compare_native_input_replay.py "$root"
      - name: Retain exact source, tape, traces and comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pf532-identical-native-replay-${{ github.run_id }}
          path: build/pf532-replay/
          if-no-files-found: warn
          retention-days: 90
