name: QL-001 extreme bitpacked worm policy (research only)
on:
  push:
    branches:
      - 'research/driv3r-quant-lab-*'
    paths:
      - 'experiments/driv3r/quant_lab/**'
      - '.github/workflows/driv3r-quant-lab-ql001.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ql001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-quant-worm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded CPU-only runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Host legality and bit packing contract
        run: python experiments/driv3r/quant_lab/quant_worm.py --self-test
      - name: Real optimizer, QAT repair, 12 trained/untuned quant variants and 144 genuine synthetic PNGs
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py \
            --out quant-lab-out --steps 450 --repair-steps 100
      - name: Verify exact source, optimizer and complete artifact inventory
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path("quant-lab-out")
          r=json.loads((root/"results.json").read_text())
          assert r["source_sha"] == os.environ["GITHUB_SHA"]
          assert r["training"]["steps"] == 450
          assert r["repair"]["steps"] == 100
          assert r["training"]["nonzero_optimizer_moment_tensors"] > 0
          assert r["repair"]["nonzero_optimizer_moment_tensors"] > 0
          assert len(r["variants"]) == 12
          assert 0 <= r['heldout_majority_teacher_accuracy'] <= 1
          assert all('heldout_balanced_recall_supported_classes' in v and 'heldout_per_action' in v for v in r['variants'].values())
          assert len(r["baselines"]) == 4
          rows=json.loads((root/"decisions.json").read_text())
          assert len(rows) == 144
          assert len(list((root/"gallery").glob("*.png"))) == 144
          inventory=json.loads((root/"MANIFEST.json").read_text())
          assert inventory
          for row in inventory:
              f=root/row["path"]
              assert f.is_file() and len(f.read_bytes()) == row["bytes"]
              assert hashlib.sha256(f.read_bytes()).hexdigest() == row["sha256"]
          for name, desc in r["variants"].items():
              assert (root/"models"/(name+".npz")).is_file()
              for e in desc["episodes"]:
                  assert hashlib.sha256((root/e["png"]).read_bytes()).hexdigest() == e["png_sha256"]
          print("EXACT SOURCE / MODEL / ORIGINAL PNG INVENTORY VERIFIED")
          PY
      - name: Immutable research receipts, model binaries and original PNG gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql001-actual-optimizer-quant-worm-${{ github.sha }}
          path: quant-lab-out/
          if-no-files-found: warn
          retention-days: 21
