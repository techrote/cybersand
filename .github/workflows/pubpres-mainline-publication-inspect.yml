name: PUBPRES original publication preflight inspection

on:
  push:
    branches: [codex/pubpres-mainline-evidence-001-20261128]
    paths: ['.github/workflows/pubpres-mainline-publication-inspect.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: pubpres-publication-original-inspection-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/pubpres-mainline-evidence-001-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read the original failed publication receipt only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          SOURCE = "a303299e59228363a229ae80bfce6746cbbfd771"
          TREE = "30d65a4829767742be29d657367af991b1ba8085"
          RUN, ATTEMPT, JOB = 46143088429, 1, 140973443808
          ARTIFACT, SIZE = 15262511886, 10352
          DIGEST = "8cd7944dc6351a5968bb6c0c4dccf6678707cee871c0f9f6d50e99c7be458204"
          NAME = "pubpres-mainline-guarded-publication-46143088429-1"
          BASE = "https://api.github.com/repos/techrote/cybersand"
          HEADERS = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                     "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          output = Path(os.environ["RUNNER_TEMP"]) / "pubpres-original-publication-preflight"
          output.mkdir(exist_ok=False)

          def need(value, message):
              if not value:
                  raise ValueError(message)

          def api(path):
              with urllib.request.urlopen(urllib.request.Request(BASE + path, headers=HEADERS), timeout=60) as reply:
                  raw = reply.read(2 * 1024**2 + 1)
              need(len(raw) <= 2 * 1024**2, "Metadata exceeds bound")
              return json.loads(raw)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          run = api("/actions/runs/" + str(RUN))
          need(run["id"] == RUN and run["run_attempt"] == ATTEMPT and run["head_sha"] == SOURCE
               and run["head_branch"] == "codex/pubpres-playability-final-001-20261124"
               and run["path"] == ".github/workflows/pubpres-mainline.yml" and run["event"] == "push"
               and run["status"] == "completed" and run["conclusion"] == "failure", "Original failed run identity differs")
          commit = api("/git/commits/" + SOURCE)
          need(commit["sha"] == SOURCE and commit["tree"]["sha"] == TREE, "Original source tree differs")
          job = api("/actions/jobs/" + str(JOB))
          need(job["id"] == JOB and job["run_id"] == RUN and job["head_sha"] == SOURCE
               and job["name"] == "publish-qualified-runtime" and job["status"] == "completed"
               and job["conclusion"] == "failure", "Original failed publisher job differs")
          artifact = api("/actions/artifacts/" + str(ARTIFACT))
          need(artifact["id"] == ARTIFACT and artifact["name"] == NAME and artifact["size_in_bytes"] == SIZE
               and artifact["digest"] == "sha256:" + DIGEST and not artifact["expired"]
               and artifact["workflow_run"]["id"] == RUN and artifact["workflow_run"]["head_sha"] == SOURCE,
               "Original failed publication archive metadata differs")
          request = urllib.request.Request(BASE + "/actions/artifacts/" + str(ARTIFACT) + "/zip", headers=HEADERS)
          try:
              urllib.request.build_opener(NoRedirect).open(request, timeout=60)
          except urllib.error.HTTPError as reply:
              need(reply.code in (301, 302, 303, 307, 308), "Expected signed artifact redirect")
              location = reply.headers["Location"]
          else:
              raise ValueError("Original archive did not use separate signed storage")
          parsed = urllib.parse.urlsplit(location)
          need(parsed.scheme == "https" and not parsed.username and not parsed.password, "Unsafe storage URL")
          # No GitHub authorization header is sent to the signed storage URL.
          with urllib.request.urlopen(urllib.request.Request(location), timeout=60) as reply:
              raw = reply.read(SIZE + 1)
          need(len(raw) == SIZE and hashlib.sha256(raw).hexdigest() == DIGEST, "Original archive bytes differ")
          archive = output / "original-publication-preflight.zip"
          archive.write_bytes(raw)
          with zipfile.ZipFile(archive) as bundle:
              members = bundle.infolist()
              need(len(members) == 1 and members[0].filename == "PUBLICATION.json"
                   and members[0].file_size <= 2 * 1024**2 and not members[0].flag_bits & 1
                   and ((members[0].external_attr >> 16) & 0o170000) in (0, stat.S_IFREG)
                   and bundle.testzip() is None, "Unexpected original archive population, mode or CRC")
              receipt_bytes = bundle.read(members[0])
          receipt = json.loads(receipt_bytes)
          need(receipt["schema"] == "pubpres-mainline-guarded-publication-v1" and receipt["parent"] == SOURCE
               and receipt["published"] is False and receipt["merge_authorized"] is False
               and receipt["physical_acceptance"] == "HOLD", "Original publication state differs")
          need(receipt["qualification"]["source"] == "ff7a9e87b5d37fde66d4d932c9fa84cc0b3a4dae"
               and receipt["qualification"]["run"] == 46140937427 and receipt["qualification"]["attempt"] == 1
               and receipt["build"]["source"] == "b7c79f072d8d389fb3cc0e3ae0e933e9bc5a9d34"
               and receipt["build"]["run"] == 46132881112 and receipt["build"]["attempt"] == 1,
               "Original qualified source or native build binding differs")
          (output / "PUBLICATION.json").write_bytes(receipt_bytes)
          inspection = {"schema": "pubpres-publication-preflight-original-inspection-v1",
                        "source": SOURCE, "tree": TREE, "run": RUN, "attempt": ATTEMPT, "job": JOB,
                        "artifact": ARTIFACT, "zip_bytes": SIZE, "zip_sha256": DIGEST,
                        "receipt_sha256": hashlib.sha256(receipt_bytes).hexdigest(),
                        "receipt_bytes": len(receipt_bytes), "published": receipt["published"],
                        "completed_platforms_retained": sorted(receipt["platforms"]),
                        "retained_platform_focuses": {key: sorted(value["outcomes"])
                                                      for key, value in receipt["platforms"].items()},
                        "original_job_steps": [{key: row[key] for key in ("name", "status", "conclusion")}
                                               for row in job["steps"]],
                        "scope": "Original failed prepublication data only. No application execution, repository writes, native publication or acceptance."}
          (output / "INSPECTION.json").write_text(json.dumps(inspection, indent=2) + "\n", encoding="utf-8")
          print("ORIGINAL_PUBLICATION_PREFLIGHT_INSPECTION " + json.dumps(inspection, separators=(",", ":")), flush=True)
          print("ORIGINAL_PUBLICATION_PREFLIGHT_RECEIPT " + json.dumps(receipt, separators=(",", ":")), flush=True)
          PY
      - name: Preserve the unchanged original failure and its inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres-original-publication-preflight-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pubpres-original-publication-preflight
          retention-days: 90
          if-no-files-found: error
