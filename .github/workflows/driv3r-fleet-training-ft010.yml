name: DRIV3R FT-010 legal goal-corpus qualification (synthetic, no optimizer)

on:
  push:
    branches: [research/570-fleet-training-throughput-001]
    paths:
      - .github/workflows/driv3r-fleet-training-ft010.yml
      - experiments/driv3r/fleet_training/ft010_goal_reachability.py
      - experiments/driv3r/fleet_training/request_ft010.json
      - experiments/driv3r/fleet_training/test_ft010_goal_reachability.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-goal-corpus:
    name: FT-010 source-faithful-to-synthetic-host seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [9401, 9403]
    concurrency:
      group: driv3r-ft010-${{ matrix.seed }}
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: techrote/cybersand
          ref: 534cd8ffac6fbe33a714ae03a62c16045bf10259
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 PyYAML==6.0.2
      - name: Qualify all owned source and immutable provider contracts
        run: |
          set -euo pipefail
          python -m compileall -q experiments/driv3r/fleet_training
          python -m unittest discover -s experiments/driv3r/fleet_training -p 'test_*.py' -v
          python tools/ci/check_ci_provider_policy.py
          python tools/ci/check_ci_scheduling_policy.py
      - name: Source-pinned legal goal corpus with original host receipts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ft010-original"
          git rev-parse HEAD > "$RUNNER_TEMP/ft010-original/owned-source-head.txt"
          sha256sum experiments/driv3r/fleet_training/request_ft010.json \
            experiments/driv3r/fleet_training/ft010_goal_reachability.py \
            > "$RUNNER_TEMP/ft010-original/source-files.sha256"
          printf 'run=%s job=%s seed=%s source=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_JOB" "${{ matrix.seed }}" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/ft010-original/job-lease.txt"
          python experiments/driv3r/fleet_training/ft010_goal_reachability.py \
            --request experiments/driv3r/fleet_training/request_ft010.json \
            --upstream upstream \
            --output "$RUNNER_TEMP/ft010-original/run" \
            --seed ${{ matrix.seed }}
      - name: Preserve original receipts, SVGs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft010-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ft010-original/
          if-no-files-found: warn
          retention-days: 14
