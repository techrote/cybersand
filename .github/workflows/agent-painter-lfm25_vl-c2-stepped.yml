name: LFM2.5-VL C2b stepped offset research v2 (NOT TRAIN)
on:
  push:
    branches: [codex/agent-painter-lfm25-vl-568]
    paths:
      - 'experiments/agent_painter/lanes/lfm25_vl/c2_stepped_proposal_v2.json'
      - 'experiments/agent_painter/lanes/lfm25_vl/c2_stepped_research_v2.py'
      - 'experiments/agent_painter/lanes/lfm25_vl/test_c2_stepped_research_v2.py'
      - '.github/workflows/agent-painter-lfm25_vl-c2-stepped.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lfm25-c2b-stepped-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-compiler-review-only:
    name: C2b two-seed compiler/source split, no FINAL/native/model
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify literal lane/source and preserved original C2 bytes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/agent-painter-lfm25-vl-568"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object experiments/agent_painter/lanes/lfm25_vl/contrastive_proposals_v1.json)" = "226ce959c68a9e2649e88fe15c10713437cf82be"
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/lfm-c2b-ci.json
      - name: Initialize fail-closed receipt for any early test/download failure
        run: |
          mkdir -p evidence
          printf '{"status":"FAIL_OR_INCOMPLETE_NO_ADMISSION","final_targets_opened":false,"native_executions":0,"admitted_train_groups":0,"optimizer_updates":0}\n' > evidence/lfm-c2b-stepped-review-only.json
      - name: Adversarial stepped topology and source-only tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/agent_painter/lanes/lfm25_vl -p 'test_c2_stepped_research_v2.py' -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-painter-native-633920373a3d406a2ede61ce4137c324f76be23b
          run-id: '43506373969'
          github-token: ${{ github.token }}
          path: evidence/original-native
      - name: Verify original visible source and exact two-seed compiler receipts
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/lanes/lfm25_vl/c2_stepped_research_v2.py \
            --corpus evidence/original-native/corpus \
            --receipt evidence/lfm-c2b-stepped-review-only.json
      - name: Preserve evidence or failure receipt; not native or TRAIN admission
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lfm-c2b-stepped-review-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/lfm-c2b-stepped-review-only.json
          retention-days: 90
          if-no-files-found: warn
