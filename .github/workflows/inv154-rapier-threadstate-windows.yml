name: INV154 Windows Rapier thread-state discrimination

on:
  push:
    branches: [perf/inv154-rapier-threadstate-20261105]
    paths:
      - godot/tests/performance/test_main_rapier_threadstate_windows.gd
      - tools/performance/run_inv154_windows_threadstate.py
      - .github/workflows/inv154-rapier-threadstate-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inv154-rapier-threadstate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows-rapier-threadstate:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve byte-exact checkout for native pins
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Materialize exact Windows native and Rapier runtime pins
        timeout-minutes: 12
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""

      - name: Execute #449 reproduction and Windows thread-state experiment
        timeout-minutes: 38
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python tools/performance/run_inv154_windows_threadstate.py 2>&1 | tee build/inv154-threadstate-console.log

      - name: Preserve raw samples, traces, source/runtime and classification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inv154-windows-threadstate-${{ github.run_id }}
          path: |
            build/inv154-threadstate/**
            build/inv154-threadstate-console.log
          if-no-files-found: warn
          retention-days: 30
