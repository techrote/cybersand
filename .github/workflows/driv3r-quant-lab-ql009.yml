name: QL-009 sparse low-rank postquant game worm (synthetic research)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql009_sparse_lowrank.py'
      - '.github/workflows/driv3r-quant-lab-ql009.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql009-sparse-lowrank
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  sparse-lowrank:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Retrieve immutable QL-003 trained parent archive
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Verify W0 host contract and exact frozen adapter start
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql009_sparse_lowrank.py --self-test
      - name: Perform 144 genuine low-rank optimizer updates and original W0-like trials
        run: |
          python experiments/driv3r/quant_lab/ql009_sparse_lowrank.py \
            --parent ql003-source --out ql009-out --steps 48 --horizon 96
      - name: Check exact HEAD and optimizer, host-legal raw decisions, original PNG hashes
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          import torch
          root=Path('ql009-out')
          result=json.loads((root/'results.json').read_text())
          sha=os.environ['QL_SOURCE_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          assert result['source_sha']==sha
          assert result['parent_source_sha']=='9b4103c48127e5c8538403e2a4d9e2525fbe8755'
          assert result['parent_manifest_verified']>=330
          assert result['optimizer_updates']==144
          assert result['heldout_n']==4352
          assert len(result['variants'])==5 and len(result['controls'])==3
          assert result['original_png_n']==132
          for label,info in result['training'].items():
              assert info['steps']==48 and info['adam_nonzero_moment_tensors']==3
              assert info['parent_q1_q4_codes_unchanged'] and info['patch_frobenius_norm']>0
              checkpoint=torch.load(root/'models'/(label+'-optimizer.pt'),
                                    map_location='cpu', weights_only=False)
              assert len(checkpoint['trace'])==48
              assert checkpoint['source_sha']==sha
          raw=json.loads((root/'raw_decisions.json').read_text())
          assert len(raw)==result['first_pass_trajectory_count']==132
          assert all(row['first_pass'] and all(t['chosen'] in t['legal']
                     for t in row['steps']) for row in raw)
          assert all('STOP' in row['steps'][0]['legal'] for row in raw if row['steps'])
          assert all(v['heldout']['host_legal_masked']==4352
                     for v in result['variants'].values())
          manifest=json.loads((root/'MANIFEST.json').read_text())
          assert len({m['path'] for m in manifest})==len(manifest)
          for entry in manifest:
              data=(root/entry['path']).read_bytes()
              assert len(data)==entry['bytes']
              assert hashlib.sha256(data).hexdigest()==entry['sha256']
          assert len(list((root/'gallery').glob('*.png')))==132
          print('QL009 EXACT HEAD PASS',sha,'entries',len(manifest),
                'original PNGs',result['original_png_n'])
          PY
      - name: Retain original immutable optimizer states, raw first-pass decisions, PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql009-sparse-postquant-repair
          path: ql009-out/
          if-no-files-found: warn
          retention-days: 21
