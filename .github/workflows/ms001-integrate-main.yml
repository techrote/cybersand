name: MS001 integrate current main

on:
  push:
    branches: [codex/issue-28-ms001]
    paths: [.github/workflows/ms001-integrate-main.yml]

permissions:
  contents: write

concurrency:
  group: ms001-integrate-main
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-28-ms001'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: false
      - name: Merge locked current main and resolve expected conflicts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/main)" = 13a26b78b1ef4d6eafa5f2fc649c79976a2eb6ac
          git merge-base --is-ancestor 59974b45704ae1b4bc80f44c7d41c98b02aff488 HEAD
          set +e
          git merge --no-commit --no-ff refs/remotes/origin/main
          rc=$?
          set -e
          test "$rc" = 1
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected=(
            docs/reference/retrieval-corpus.json
            godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll
            godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
            godot/addons/cybersand_native/runtime-provenance.json
            godot/addons/cybersand_native/runtime-provenance.linux.json
          )
          test "${conflicts[*]}" = "${expected[*]}"
          python3 - <<'PY'
          import json, pathlib, subprocess
          ours=json.loads(subprocess.check_output(['git','show',':2:docs/reference/retrieval-corpus.json']))
          main=json.loads(subprocess.check_output(['git','show',':3:docs/reference/retrieval-corpus.json']))
          out=main
          path='operations/microscenario-reference-pack.md'
          if path not in out['documents']:
              try:
                  index=out['documents'].index('operations/profiling-observability-and-performance.md')+1
              except ValueError:
                  index=len(out['documents'])
              out['documents'].insert(index,path)
          assert not [p for p in out['documents'] if 'stage3-spark' in p]
          assert any(x.get('path')=='operations/soliding-stage3b-astra-review.md' for x in out['excluded'])
          pathlib.Path('docs/reference/retrieval-corpus.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY
          git add docs/reference/retrieval-corpus.json
          git checkout --ours --             godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll             godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so             godot/addons/cybersand_native/runtime-provenance.json             godot/addons/cybersand_native/runtime-provenance.linux.json
          git add             godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll             godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so             godot/addons/cybersand_native/runtime-provenance.json             godot/addons/cybersand_native/runtime-provenance.linux.json
          git rm -f .github/workflows/ms001-final-transfer.yml .github/workflows/ms001-integrate-main.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          python3 tools/ci/check_docs.py
          python3 tools/ci/check_m11_consistency.py
          git config user.name techrote
          git config user.email 261801702+techrote@users.noreply.github.com
          git commit -m 'merge: integrate current main into MS-001'
          git push origin HEAD:codex/issue-28-ms001
