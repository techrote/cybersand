name: Issue 65 publish source-matched runtimes

on:
  push:
    branches: [codex/issue-65-stage3b-exact-reconstruction]
    paths: [.github/workflows/issue65-publish-runtimes.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: issue65-publish-runtimes
  cancel-in-progress: true

env:
  VALIDATED_HEAD: 2cef97763579bb3cee645d15a22d254c3210410b
  VALIDATED_TREE: f03efb6d5768ae39a30f633c863c8400b27f825a
  TESTED_LINUX_RUN: "35726233644"
  TESTED_LINUX_MERGE: 962ed86e739de88a1919efd595376446fa444d88
  TESTED_LINUX_ARTIFACT: linux-runtime-35726233644
  TESTED_LINUX_ARTIFACT_ID: "10693674907"
  COMPANION_DOCS_COMMIT: 6a58311982941b75f46e22109a0829e5acb83c7e
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65

jobs:
  publish:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-65-stage3b-exact-reconstruction'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Check out publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Verify frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VALIDATED_HEAD" HEAD
          test "$(git rev-parse "$VALIDATED_HEAD^{tree}")" = "$VALIDATED_TREE"
          git diff --exit-code "$VALIDATED_HEAD" HEAD --             godot/native_extension             native/include             native/src             tools/build_native_extension.sh             tools/build_native_extension_windows.sh             tools/build_pinned_godot_cpp.sh             tools/requirements-build.txt
          git fetch --no-tags --depth=1 origin "$TESTED_LINUX_MERGE"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$VALIDATED_TREE"

      - name: Restore exact tested Linux runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.TESTED_LINUX_ARTIFACT }}
          path: ${{ runner.temp }}/linux-runtime
          github-token: ${{ github.token }}
          run-id: ${{ env.TESTED_LINUX_RUN }}

      - name: Verify exact tested Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/linux-runtime/source-sha.txt")" = "$TESTED_LINUX_MERGE"
          (cd "$RUNNER_TEMP/linux-runtime" && sha256sum --check --strict runtime.sha256)
          test "$(sha256sum "$RUNNER_TEMP/linux-runtime/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | cut -d' ' -f1)" =             "147ab5673b9687ccb7a3b12fec07ea55cc674ad8a75f529d1085bf7d61fbd831"
          cp "$RUNNER_TEMP/linux-runtime/libcybersand_native.linux.x86_64.so"              godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          timeout 1m tools/check_linux_runtime_floor.sh

      - name: Install pinned SCons
        run: |
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'

      - name: Check out exact godot-cpp
        run: |
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      - name: Prepare exact LLVM-MinGW
        run: |
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          test -x "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-g++"
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then
            ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
          fi

      - name: Build Windows x86_64
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "2"
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
        run: |
          timeout 35m tools/build_pinned_godot_cpp.sh windows
          timeout 20m tools/build_native_extension_windows.sh
          file "$CYBERSAND_NATIVE_OUTPUT" | tee "$RUNNER_TEMP/windows-file.txt"
          grep -q 'PE32+ executable (DLL).*x86-64' "$RUNNER_TEMP/windows-file.txt"
          "$LLVM_MINGW_ROOT/bin/llvm-objdump" -p "$CYBERSAND_NATIVE_OUTPUT" > "$RUNNER_TEMP/windows-imports.txt"
          sha256sum "$CYBERSAND_NATIVE_OUTPUT"
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll

      - name: Regenerate runtime provenance from actual bytes
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_RUN="$GITHUB_RUN_ID"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.')
          source = os.environ['VALIDATED_HEAD']
          tree = os.environ['VALIDATED_TREE']
          run = os.environ['BUILD_RUN']
          linux_run = os.environ['TESTED_LINUX_RUN']
          linux_merge = os.environ['TESTED_LINUX_MERGE']
          linux_artifact = os.environ['TESTED_LINUX_ARTIFACT']
          linux_artifact_id = os.environ['TESTED_LINUX_ARTIFACT_ID']

          win_path = root / 'godot/addons/cybersand_native/runtime-provenance.json'
          lin_path = root / 'godot/addons/cybersand_native/runtime-provenance.linux.json'
          win = json.loads(win_path.read_text(encoding='utf-8'))
          lin = json.loads(lin_path.read_text(encoding='utf-8'))

          inputs = set(win['source_inputs']) | set(lin['source_inputs'])
          source_inputs = {}
          for rel in sorted(inputs):
              data = (root / rel).read_bytes().replace(b'\r\n', b'\n')
              source_inputs[rel] = hashlib.sha256(data).hexdigest()

          linux = root / 'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so'
          windows = root / 'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll'
          linux_sha = hashlib.sha256(linux.read_bytes()).hexdigest()
          windows_sha = hashlib.sha256(windows.read_bytes()).hexdigest()
          evidence = 'docs/audits/2026-09-21-issue-65-stage3b-exact-reconstruction.md'

          common = {
              'source_commit': source,
              'source_tree': tree,
              'source_input_hash_kind': 'SHA-256 of canonical Git blob bytes; CRLF working files normalize to LF',
              'source_inputs': source_inputs,
              'evidence': evidence,
          }

          win.update(common)
          win.update({
              'schema_version': 1,
              'status': 'validated-build-runtime',
              'artifact': 'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll',
              'sha256': windows_sha,
              'size': windows.stat().st_size,
              'validated_platform': 'Windows x86_64 Godot 4.7 (pinned cross-build; execution unavailable)',
              'toolchain': 'LLVM-MinGW 20260826 UCRT Clang 23.1.0; godot-cpp 101ae38034304346a46ea9ea84ae156d3e860496; SCons 4.10.1; #65 frozen native/test source',
              'acceptance': f'Exact #65-source Windows x86_64 GDExtension cross-build passed in REC-004 GitHub Actions run {run}. Actual Windows execution is unavailable and not claimed.',
              'validation_output': f'GitHub Actions run {run}; source-matched publication from validated head {source}',
              'other_platforms': 'Linux runtime is the exact artifact exercised by all four Godot regression shards in run 35726233644. Browser/WebAssembly execution and hardware-GPU/target-PC performance remain unavailable and are not claimed.'
          })

          lin.update(common)
          lin.update({
              'schema_version': 1,
              'status': 'validated-development-runtime',
              'artifact': 'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so',
              'sha256': linux_sha,
              'size': linux.stat().st_size,
              'validated_platform': 'Linux x86_64 Godot 4.7',
              'toolchain': 'Ubuntu 24.04, GCC/G++ 13.3.0, binutils 2.42, SCons 4.10.1; godot-cpp 101ae38034304346a46ea9ea84ae156d3e860496; #65 frozen native/test source',
              'acceptance': f'Exact #65-source Linux x86_64 GDExtension artifact from Actions run {linux_run}; all four isolated Godot regression shards passed on these exact bytes before publication.',
              'other_platforms': 'Windows runtime is cross-built from identical validated source inputs but is not Windows execution. Browser/WebAssembly execution and hardware-GPU/target-PC performance remain unavailable and are not claimed.',
              'workflow_run': f'https://github.com/techrote/cybersand/actions/runs/{linux_run}',
              'tested_merge_commit': linux_merge,
              'artifact_id': int(linux_artifact_id),
              'validation_output': f'Actions run {linux_run} / artifact {linux_artifact}'
          })

          win_path.write_text(json.dumps(win, indent=2) + '\n', encoding='utf-8')
          lin_path.write_text(json.dumps(lin, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify generated runtime bytes and manifests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          for name in ('runtime-provenance.json', 'runtime-provenance.linux.json'):
              manifest = json.loads((root / 'godot/addons/cybersand_native' / name).read_text())
              for rel, expected in manifest['source_inputs'].items():
                  actual = hashlib.sha256((root / rel).read_bytes().replace(b'\r\n', b'\n')).hexdigest()
                  assert actual == expected, (name, rel, actual, expected)
              data = (root / manifest['artifact']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == manifest['sha256']
              assert len(data) == manifest['size']
          PY

      - name: Retain publication evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/issue65-runtimes"
          cp godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so "$RUNNER_TEMP/issue65-runtimes/"
          cp godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll "$RUNNER_TEMP/issue65-runtimes/"
          cp godot/addons/cybersand_native/runtime-provenance.json "$RUNNER_TEMP/issue65-runtimes/"
          cp godot/addons/cybersand_native/runtime-provenance.linux.json "$RUNNER_TEMP/issue65-runtimes/"
          printf '%s\n' "$VALIDATED_HEAD" > "$RUNNER_TEMP/issue65-runtimes/source-sha.txt"
          printf '%s\n' "$VALIDATED_TREE" > "$RUNNER_TEMP/issue65-runtimes/source-tree.txt"
          (cd "$RUNNER_TEMP/issue65-runtimes" && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue65-source-matched-runtimes-${{ env.VALIDATED_HEAD }}
          path: ${{ runner.temp }}/issue65-runtimes/
          if-no-files-found: error
          retention-days: 30

      - name: Create local LFS publication commit
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git add godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so godot/addons/cybersand_native/runtime-provenance.json godot/addons/cybersand_native/runtime-provenance.linux.json
          git rm -f .github/workflows/issue65-publish-runtimes.yml
          git diff --cached --check
          git config user.name techrote
          git config user.email 261801702+techrote@users.noreply.github.com
          git commit -m 'build(stage3b): publish issue 65 source-matched runtimes'
          git lfs fsck

      - name: Verify committed materialized provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$COMPANION_DOCS_COMMIT"
          mkdir -p ../docs ../tools ../validation
          git show "$COMPANION_DOCS_COMMIT:SOURCE-PROVENANCE.json" > ../SOURCE-PROVENANCE.json
          git show "$COMPANION_DOCS_COMMIT:docs/WEB_THREADING.md" > ../docs/WEB_THREADING.md
          git show "$COMPANION_DOCS_COMMIT:tools/dev.py" > ../tools/dev.py
          git show "$COMPANION_DOCS_COMMIT:docs/LOCAL_DEVELOPMENT.md" > ../docs/LOCAL_DEVELOPMENT.md
          git show "$COMPANION_DOCS_COMMIT:validation/browser-results.json" > ../validation/browser-results.json
          python3 tools/ci/check_repository.py --require-materialized
          git lfs fsck
          git diff --check HEAD

      - name: Push verified LFS publication
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/issue-65-stage3b-exact-reconstruction
