          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 --output "$RUNNER_TEMP/render-ack-godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          python - <<'PYCODE'
          import os, pathlib, sys
          sys.path.insert(0, 'tools/ci')
          from run_windows_godot_regressions import prepare_godot
          prepare_godot(pathlib.Path(os.environ['RUNNER_TEMP']) / 'render-ack-godot.zip')
          PYCODE
      - name: Run matched Main/ImageTexture ABBA normal/delayed/withheld ACK
        run: |
          set -euo pipefail
          python tools/render_ack/run_policy_graphical.py --godot "$RUNNER_TEMP/render-ack-godot/Godot_v4.7-stable_win64_console.exe" --expected-sha "$RENDER_ACK_SOURCE_SHA" --rendering-driver opengl3_angle --output build/render-ack-policy/windows-graphical
      - name: Retain all ABBA arms, native/CPU/GPU oracles and causal trace failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-ack-policy-windows-graphical-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/render-ack-policy/windows-graphical/
          if-no-files-found: warn
          retention-days: 90

  linux-graphical:
    name: Linux llvmpipe / real Main/ImageTexture / three-condition ABBA
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/render-ack-pacing-002' && github.base_ref == 'research/render-ack-feedback-001') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/render-ack-pacing-002'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
