name: RENDER-ACK-002 ACK-aware native capture research (Draft/HOLD)

# Isolated stacked experiment on #583. Baseline is unchanged; camera and GPU
# renderer untouched. Software graphic tests never assert NVIDIA performance.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/render-ack-policy.yml'
      - 'godot/scripts/simulation_worker.gd'
      - 'godot/scripts/main.gd'
      - 'godot/tests/test_render_ack_feedback.gd'
      - 'godot/tests/test_render_ack_policy.gd'
      - 'godot/tests/test_render_ack_workbench_policy.gd'
      - 'tools/render_ack/run_policy_graphical.py'
      - 'tools/render_ack/**'
      - 'godot/tests/bench_render_copy_publication.gd'
      - 'godot/tests/support/render_copy_worker.gd'
      - 'godot/tests/support/render_copy_consumer.gd'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: render-ack-policy-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'
  RENDER_ACK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux pinned Godot / native ACK + escalation controls
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/render-ack-pacing-002' && github.base_ref == 'research/render-ack-feedback-001') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/render-ack-pacing-002'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RENDER_ACK_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - name: Materialize source-matched Linux runtimes and check offline reducer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RENDER_ACK_SOURCE_SHA"
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          python3 tools/render_ack/analyze_trace.py --self-test
          python3 tools/ci/check_ci_provider_policy.py
      - name: Pin Linux Godot 4.7 archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 --output "$RUNNER_TEMP/render-ack-godot.zip" 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
          echo '0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  '"$RUNNER_TEMP/render-ack-godot.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/render-ack-godot"
          unzip -tq "$RUNNER_TEMP/render-ack-godot.zip"
          unzip -q "$RUNNER_TEMP/render-ack-godot.zip" -d "$RUNNER_TEMP/render-ack-godot"
          chmod +x "$RUNNER_TEMP/render-ack-godot/Godot_v4.7-stable_linux.x86_64"
      - name: Execute exact-head native ACK controls and retain all receipts
        run: |
          set -euo pipefail
          python3 tools/render_ack/qualify.py --godot "$RUNNER_TEMP/render-ack-godot/Godot_v4.7-stable_linux.x86_64" --expected-sha "$RENDER_ACK_SOURCE_SHA" --output build/render-ack-policy/linux
      - name: Preserve logs including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-ack-policy-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/render-ack-policy/linux/
          if-no-files-found: warn
          retention-days: 90

  windows:
    name: Windows pinned Godot / native ACK + escalation controls
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/render-ack-pacing-002' && github.base_ref == 'research/render-ack-feedback-001') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/render-ack-pacing-002'))
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RENDER_ACK_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize source-matched Windows runtimes and check offline reducer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RENDER_ACK_SOURCE_SHA"
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          python tools/render_ack/analyze_trace.py --self-test
          python tools/ci/check_ci_provider_policy.py
      - name: Authenticate the pinned Windows Godot archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 --output "$RUNNER_TEMP/render-ack-godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          python - <<'PYCODE'
          import os, pathlib, sys
          sys.path.insert(0, 'tools/ci')
          from run_windows_godot_regressions import prepare_godot
          prepare_godot(pathlib.Path(os.environ['RUNNER_TEMP']) / 'render-ack-godot.zip')
          PYCODE
      - name: Execute exact-head native ACK controls and retain all receipts
        run: |
          set -euo pipefail
          python tools/render_ack/qualify.py --godot "$RUNNER_TEMP/render-ack-godot/Godot_v4.7-stable_win64_console.exe" --expected-sha "$RENDER_ACK_SOURCE_SHA" --output build/render-ack-policy/windows
      - name: Preserve logs including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-ack-policy-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/render-ack-policy/windows/
          if-no-files-found: warn
          retention-days: 90

  windows-graphical:
    name: Windows ANGLE / real Main/ImageTexture / three-condition ABBA
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/render-ack-pacing-002' && github.base_ref == 'research/render-ack-feedback-001') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/render-ack-pacing-002'))
    runs-on: windows-2022
