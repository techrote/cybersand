          echo '0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  '"$RUNNER_TEMP/render-ack-godot.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/render-ack-godot"
          unzip -tq "$RUNNER_TEMP/render-ack-godot.zip"
          unzip -q "$RUNNER_TEMP/render-ack-godot.zip" -d "$RUNNER_TEMP/render-ack-godot"
          chmod +x "$RUNNER_TEMP/render-ack-godot/Godot_v4.7-stable_linux.x86_64"
      - name: Import the exact source before graphics tests
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/render-ack-godot/Godot_v4.7-stable_linux.x86_64" --headless --path godot --editor --quit
      - name: Run matched actual Main/ImageTexture via Xvfb llvmpipe
        run: |
          set -euo pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 GALLIVM_PERF=nopt python3 tools/render_ack/run_policy_graphical.py --godot "$RUNNER_TEMP/render-ack-godot/Godot_v4.7-stable_linux.x86_64" --expected-sha "$RENDER_ACK_SOURCE_SHA" --rendering-driver opengl3 --output build/render-ack-policy/linux-graphical
      - name: Retain raw Linux graphics controls and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-ack-policy-linux-graphical-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/render-ack-policy/linux-graphical/
          if-no-files-found: warn
          retention-days: 90

  windows-workbench:
    name: Windows ANGLE / 2048-square Workbench held-render / 1+4 native workers
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/render-ack-pacing-002' && github.base_ref == 'research/render-ack-feedback-001') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/render-ack-pacing-002'))
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RENDER_ACK_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retain signed platform native runtime and verify source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RENDER_ACK_SOURCE_SHA"
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
