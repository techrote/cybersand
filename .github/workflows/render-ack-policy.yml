      - name: Prepare official pinned Windows Godot
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 --output "$RUNNER_TEMP/render-ack-godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          python - <<'PYCODE'
          import os, pathlib, sys
          sys.path.insert(0, 'tools/ci')
          from run_windows_godot_regressions import prepare_godot
          prepare_godot(pathlib.Path(os.environ['RUNNER_TEMP']) / 'render-ack-godot.zip')
          PYCODE
      - name: Run matched 2048-square Workbench baseline/gated with 1 and 4 native workers
        run: |
          set -euo pipefail
          python tools/render_ack/run_workbench_policy.py --godot "$RUNNER_TEMP/render-ack-godot/Godot_v4.7-stable_win64_console.exe" --expected-sha "$RENDER_ACK_SOURCE_SHA" --rendering-driver opengl3_angle --output build/render-ack-policy/windows-workbench
      - name: Retain raw Workbench/Rapier 2048-square baseline/gated qualification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-ack-policy-windows-workbench-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/render-ack-policy/windows-workbench/
