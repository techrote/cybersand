name: DRIV3R long-horizon synthetic CPU training (Draft/HOLD)

on:
  pull_request:
    paths:
      - 'experiments/driv3r/training/long_horizon/**'
      - '.github/workflows/driv3r-long-horizon-training.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run bounded full training or cheap smoke'
        type: choice
        options: [full, smoke]
        default: full
  push:
    branches:
      - 'research/driv3r-long-horizon-*'
    paths:
      - 'experiments/driv3r/training/long_horizon/**'
      - '.github/workflows/driv3r-long-horizon-training.yml'

permissions:
  contents: read

concurrency:
  group: driv3r-lh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-cpu:
    name: Exact-head deterministic unit tests + real 36/72/128 CPU optimizer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      RUN_DIR: /tmp/driv3r-long-horizon-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact source (never a production merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$head" = "$expected"
          echo "Exact source: $head"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only numerical dependency (no model downloads)
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.2.6 pillow==11.3.0
      - name: Run complete lane unit tests
        shell: bash
        run: |
          python -m unittest discover -v \
            -s experiments/driv3r/training/long_horizon -t . -p 'test_*.py'
      - name: Run actual bounded CPU optimizer, write immutable artifact inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            python -m experiments.driv3r.training.long_horizon.train \
              --output "$RUN_DIR" --seed 570 --quick
          else
            python -m experiments.driv3r.training.long_horizon.train \
              --output "$RUN_DIR" --seed 570 --n-worlds-per-family 9 \
              --updates-per-stage 180 --batch 64
          fi
          test -s "$RUN_DIR/tiny-ranker-36-72-128.npz"
          test -s "$RUN_DIR/report.json"
          test -s "$RUN_DIR/SHA256SUMS.json"
          sha256sum "$RUN_DIR/tiny-ranker-36-72-128.npz"
      - name: Predeclared equal-update curriculum ablation (development only)
        shell: bash
        run: |
          set -euo pipefail
          for seed in 570 571; do
            if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
              worlds=2; updates=15
            else
              worlds=9; updates=180
            fi
            python -m experiments.driv3r.training.long_horizon.compare_curricula \
              --output "$RUN_DIR/curriculum-ablation-seed${seed}" \
              --seed-start "$seed" --seed-count 1 \
              --train-worlds-per-family "$worlds" --updates-per-stage "$updates" \
              --dev-worlds-per-family 1
            python -m experiments.driv3r.training.long_horizon.verify_ablation \
              "$RUN_DIR/curriculum-ablation-seed${seed}"
          done
          test -s "$RUN_DIR/curriculum-ablation-seed570/flat_128-seed570.npz"
          test -s "$RUN_DIR/curriculum-ablation-seed571/staged_36_72_128-seed571.npz"
      - name: Run real optimizer stress ablation and verify every original path (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            worlds=2; updates=10
          else
            worlds=4; updates=100
          fi
          python -m experiments.driv3r.training.long_horizon.intervention_lab \
            --output "$RUN_DIR/intervention-stress" --seed 572 \
            --train-worlds-per-family "$worlds" --dev-worlds-per-family 1 \
            --updates-per-stage "$updates"
          python -m experiments.driv3r.training.long_horizon.verify_intervention \
            "$RUN_DIR/intervention-stress"
          python -m experiments.driv3r.training.long_horizon.paired_geometry \
            "$RUN_DIR/intervention-stress" \
            --output "$RUN_DIR/intervention-paired-geometry.json" \
            --gallery "$RUN_DIR/intervention-original-gallery.png"
          test -s "$RUN_DIR/intervention-stress/ordinary_offpolicy_013-seed572.npz"
          test -s "$RUN_DIR/intervention-stress/stress_offpolicy_040-seed572.npz"
      - name: Run matched three-intent model controllability training and source-replay audit
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            worlds=1; updates=3
          else
            worlds=2; updates=25
          fi
          python -m experiments.driv3r.training.long_horizon.intent_lab \
            --output "$RUN_DIR/intent-ablation" --seed-start 573 --seed-count 1 \
            --train-worlds-per-family "$worlds" --dev-worlds-per-family 1 \
            --updates-per-stage "$updates"
          python -m experiments.driv3r.training.long_horizon.verify_intent \
            "$RUN_DIR/intent-ablation"
          test -s "$RUN_DIR/intent-ablation/intent_aware_cross_features-seed573.npz"
      - name: Paired on-policy teacher correction vs matched extra-offline training (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            worlds=1; updates=2
          else
            worlds=4; updates=100
          fi
          for seed in 573 574; do
            python -m experiments.driv3r.training.long_horizon.on_policy_adaptation \
              --output "$RUN_DIR/on-policy-seed${seed}" --seed "$seed" \
              --train-worlds-per-family "$worlds" --dev-worlds-per-family 1 \
              --updates-per-stage "$updates"
            python -m experiments.driv3r.training.long_horizon.verify_on_policy \
              "$RUN_DIR/on-policy-seed${seed}"
            test -s "$RUN_DIR/on-policy-seed${seed}/extra_offline_teacher-seed${seed}.npz"
            test -s "$RUN_DIR/on-policy-seed${seed}/on_policy_correction-seed${seed}.npz"
          done
      - name: History-conditioned motif adapter vs matched history-blind training (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            updates=2
          else
            updates=80
          fi
          python -m experiments.driv3r.training.long_horizon.history_motif_lab \
            --output "$RUN_DIR/history-motif" --seed 575 \
            --updates "$updates" --worlds 1
          python -m experiments.driv3r.training.long_horizon.verify_history_motif \
            "$RUN_DIR/history-motif"
          test -s "$RUN_DIR/history-motif/history_aware.npz"
          test -s "$RUN_DIR/history-motif/history_blind.npz"
          test -s "$RUN_DIR/history-motif/SHA256SUMS.json"
      - name: Matched live-stack vs executed-history training and exact original replay (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            worlds=1; updates=1
          else
            worlds=2; updates=60
          fi
          for seed in 579 580; do
            python -m experiments.driv3r.training.long_horizon.live_path_probe \
              --output "$RUN_DIR/live-path-seed${seed}" --seed "$seed" \
              --worlds "$worlds" --updates "$updates"
            python -m experiments.driv3r.training.long_horizon.live_path_probe \
              --verify "$RUN_DIR/live-path-seed${seed}"
            test -s "$RUN_DIR/live-path-seed${seed}/live.npz"
            test -s "$RUN_DIR/live-path-seed${seed}/executed.npz"
          done
      - name: Dual-clock versus executed-clock matched recovery training (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            updates=2
          else
            updates=30
          fi
          for seed in 582 583; do
            python -m experiments.driv3r.training.long_horizon.dual_clock_lab \
              --output "$RUN_DIR/dual-clock-seed${seed}" \
              --seed "$seed" --worlds 1 --updates "$updates"
            python -m experiments.driv3r.training.long_horizon.dual_clock_lab \
              --verify "$RUN_DIR/dual-clock-seed${seed}"
            test -s "$RUN_DIR/dual-clock-seed${seed}/dual_clock.npz"
            test -s "$RUN_DIR/dual-clock-seed${seed}/executed_clock.npz"
          done
      - name: STOP-margin calibration vs matched executed-clock control (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            updates=2
          else
            updates=30
          fi
          for seed in 584 585; do
            python -m experiments.driv3r.training.long_horizon.stop_calibration_lab \
              --output "$RUN_DIR/stop-margin-seed${seed}" \
              --seed "$seed" --updates "$updates"
            python -m experiments.driv3r.training.long_horizon.stop_calibration_lab \
              --verify "$RUN_DIR/stop-margin-seed${seed}"
            test -s "$RUN_DIR/stop-margin-seed${seed}/dual_clock.npz"
            test -s "$RUN_DIR/stop-margin-seed${seed}/executed_clock.npz"
          done
      - name: Matched proactive local-escape training and exact original replay (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            updates=2; devworlds=1
          else
            updates=70; devworlds=2
          fi
          for seed in 586 587; do
            python -m experiments.driv3r.training.long_horizon.trap_avoidance_lab \
              --out "$RUN_DIR/trap-prevent-seed${seed}" --seed "$seed" \
              --updates "$updates" --dev-per-family "$devworlds"
            python -m experiments.driv3r.training.long_horizon.verify_trap_avoidance \
              "$RUN_DIR/trap-prevent-seed${seed}"
            test -s "$RUN_DIR/trap-prevent-seed${seed}/baseline-seed${seed}.npz"
            test -s "$RUN_DIR/trap-prevent-seed${seed}/local_escape_sensor-seed${seed}.npz"
          done
      - name: Train bounded connected-frontier versus local/no-sensor controls (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            updates=2; trainworlds=1
          else
            updates=50; trainworlds=2
          fi
          for seed in 588 589; do
            python -m experiments.driv3r.training.long_horizon.frontier_viability_lab \
              --out "$RUN_DIR/frontier-seed${seed}" --seed "$seed" \
              --updates "$updates" --train-worlds "$trainworlds" --dev-worlds 1
            python -m experiments.driv3r.training.long_horizon.frontier_viability_lab \
              --verify "$RUN_DIR/frontier-seed${seed}"
            for arm in blind local frontier; do
              test -s "$RUN_DIR/frontier-seed${seed}/${arm}-seed${seed}.npz"
            done
            test -s "$RUN_DIR/frontier-seed${seed}/SHA256SUMS.json"
          done
      - name: Recovery-balanced versus uniform legal correction sampling (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            updates=2
          else
            updates=60
          fi
          for seed in 592 593; do
            python -m experiments.driv3r.training.long_horizon.recovery_balance_lab \
              --out "$RUN_DIR/recovery-balance-seed${seed}" --seed "$seed" --updates "$updates"
            python -m experiments.driv3r.training.long_horizon.recovery_balance_lab \
              --verify "$RUN_DIR/recovery-balance-seed${seed}"
            for arm in uniform recovery_balanced; do
              test -s "$RUN_DIR/recovery-balance-seed${seed}/${arm}-${seed}.npz"
            done
            test -s "$RUN_DIR/recovery-balance-seed${seed}/SHA256SUMS.json"
          done
      - name: Budget-conditioned versus blind competing-return training (DEV only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            updates=2
          else
            updates=40
          fi
          for seed in 594 595; do
            python -m experiments.driv3r.training.long_horizon.return_budget_lab \
              --out "$RUN_DIR/return-budget-seed${seed}" --seed "$seed" --updates "$updates"
            python -m experiments.driv3r.training.long_horizon.return_budget_lab \
              --verify "$RUN_DIR/return-budget-seed${seed}"
            for arm in blind capacity_visible; do
              test -s "$RUN_DIR/return-budget-seed${seed}/${arm}-seed${seed}.npz"
            done
            test -s "$RUN_DIR/return-budget-seed${seed}/SHA256SUMS.json"
          done
      - name: Variable-depth budget/depth generalization (matched DEV-only actions)
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.mode || 'full' }}' == 'smoke' ]]; then
            updates=1; quick=--quick
          else
            updates=30; quick=
          fi
          for seed in 596 597; do
            python -m experiments.driv3r.training.long_horizon.return_generalization_lab \
              --out "$RUN_DIR/return-gen-seed${seed}" --seed "$seed" \
              --updates "$updates" $quick
            python -m experiments.driv3r.training.long_horizon.return_generalization_lab \
              --verify "$RUN_DIR/return-gen-seed${seed}"
            for arm in blind budget_only raw_counters engineered; do
              test -s "$RUN_DIR/return-gen-seed${seed}/${arm}-seed${seed}.npz"
            done
            test -s "$RUN_DIR/return-gen-seed${seed}/SHA256SUMS.json"
          done
      - name: Store checkpoint, original traces, galleries, metrics and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driv3r-long-horizon-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_DIR }}/
          if-no-files-found: warn
          retention-days: 45
