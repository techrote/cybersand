name: ENG-LAB-001 Phase A / passive clock and Workbench qualification

# Independent Draft research. No engine defaults or native simulation changes.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/eng-lab-passive.yml'
      - 'godot/scripts/engine_lab_passive_recorder.gd'
      - 'godot/scripts/engine_lab_passive_panel.gd'
      - 'godot/scripts/main.gd'
      - 'godot/scripts/shared_workbench.gd'
      - 'godot/tests/test_engine_lab_passive_*'
      - 'tools/engine_lab/**'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: eng-lab-passive-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'
  ENG_LAB_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux pinned native + llvmpipe real Workbench passive benchmark
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/eng-lab-001-passive-benchmark' && github.base_ref == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/eng-lab-001-passive-benchmark'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.ENG_LAB_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - name: Exact source, native runtime and CI policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENG_LAB_SOURCE_SHA"
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          command -v xvfb-run
          python3 tools/ci/check_ci_provider_policy.py
      - name: Pin official Linux Godot 4.7
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            --output "$RUNNER_TEMP/eng-lab-godot.zip" \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
          echo '0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  '"$RUNNER_TEMP/eng-lab-godot.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/eng-lab-godot"
          unzip -tq "$RUNNER_TEMP/eng-lab-godot.zip"
          unzip -q "$RUNNER_TEMP/eng-lab-godot.zip" -d "$RUNNER_TEMP/eng-lab-godot"
          chmod +x "$RUNNER_TEMP/eng-lab-godot/Godot_v4.7-stable_linux.x86_64"
      - name: Execute full source-checked recorder + real Workbench smoke
        run: |
          set -euo pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 GALLIVM_PERF=nopt \
            python3 tools/engine_lab/qualify.py \
              --godot "$RUNNER_TEMP/eng-lab-godot/Godot_v4.7-stable_linux.x86_64" \
              --expected-sha "$ENG_LAB_SOURCE_SHA" --rendering-driver opengl3 \
              --output build/engine-lab/linux
      - name: Preserve failures and success reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eng-lab-passive-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/engine-lab/linux/
          if-no-files-found: warn
          retention-days: 90

  windows:
    name: Windows pinned native + ANGLE real Workbench passive benchmark
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/eng-lab-001-passive-benchmark' && github.base_ref == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/eng-lab-001-passive-benchmark'))
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.ENG_LAB_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source, native runtime and CI policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENG_LAB_SOURCE_SHA"
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          python tools/ci/check_ci_provider_policy.py
      - name: Pin official Windows Godot 4.7
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            --output "$RUNNER_TEMP/eng-lab-godot.zip" \
            'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          python - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'tools/ci')
          from run_windows_godot_regressions import prepare_godot
          prepare_godot(pathlib.Path(os.environ['RUNNER_TEMP'])/'eng-lab-godot.zip')
          PY
      - name: Execute full source-checked recorder + real Workbench smoke
        run: |
          set -euo pipefail
          python tools/engine_lab/qualify.py \
            --godot "$RUNNER_TEMP/eng-lab-godot/Godot_v4.7-stable_win64_console.exe" \
            --expected-sha "$ENG_LAB_SOURCE_SHA" --rendering-driver opengl3_angle \
            --output build/engine-lab/windows
      - name: Preserve failures and success reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eng-lab-passive-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/engine-lab/windows/
          if-no-files-found: warn
          retention-days: 90
