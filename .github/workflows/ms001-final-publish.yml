name: MS001 final authenticated publication

on:
  push:
    branches: [codex/issue-28-ms001]
    paths: [.github/workflows/ms001-final-publish.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: ms001-final-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-28-ms001'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: true
      - name: Assemble and publish exact tested tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch_parent="$(git rev-parse HEAD)"
          test "$branch_parent" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          main="$(git rev-parse refs/remotes/origin/main)"
          test "$main" = 5001f7f8665cf4e3bc67b3617796127c908ac368
          test -z "$(git status --porcelain)"

          gh api repos/techrote/cybersand/git/blobs/7e1573d5a718d7d0674fba4a484fcc585bb1acd8 --jq .content             | tr -d '\n' | base64 -d > "$RUNNER_TEMP/final.patch.gz"
          echo "5682b1255b10c0149b1d33f8ee8fc497afb16759476b30759f4c586535db0a5f  $RUNNER_TEMP/final.patch.gz"             | sha256sum --check --strict
          gzip -dc "$RUNNER_TEMP/final.patch.gz" > "$RUNNER_TEMP/final.patch"
          echo "8473df598b91094b1b92936d221f68089ac0ad88b1621892a3746883cd5c4bf8  $RUNNER_TEMP/final.patch"             | sha256sum --check --strict

          mkdir "$RUNNER_TEMP/linux" "$RUNNER_TEMP/windows"
          gh run download 35414442819 -R techrote/cybersand -n linux-godot-35414442819 -D "$RUNNER_TEMP/linux"
          gh run download 35413451506 -R techrote/cybersand             -n ms001-windows-inputs-964a9a81f2d3dced321e1693d52131e044d300bd -D "$RUNNER_TEMP/windows"
          linux="$(find "$RUNNER_TEMP/linux" -type f -name 'libcybersand_native.linux.x86_64.so' -print -quit)"
          windows="$RUNNER_TEMP/windows/cybersand_native.windows.x86_64.dll"
          test -n "$linux" && test -f "$windows"
          echo "17b3053d9f1f7d9ee1324bd00d54421df2518c6d239f4b5b8d33b4f06651fe79  $linux"             | sha256sum --check --strict
          echo "f1030f9c9d89ee392715f21cfbcd41cabded623bbd2df81ada337e9ce5b494b0  $windows"             | sha256sum --check --strict

          git reset --hard "$main"
          git clean -fdx
          git apply --index --whitespace=error "$RUNNER_TEMP/final.patch"
          cp "$linux" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          cp "$windows" godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll
          git lfs install --local
          git add godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so                   godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll
          git diff --cached --check
          tree="$(git write-tree)"
          test "$tree" = 423fd8356890bb7d7b0a728690ef93843390ce45

          git config user.name techrote
          git config user.email 261801702+techrote@users.noreply.github.com
          commit="$(printf '%s\n' 'MS-001: complete reference scenario pack and acceptance repairs'             | git commit-tree "$tree" -p "$branch_parent" -p "$main")"
          git reset --hard "$commit"
          git lfs fsck
          test "$(git ls-remote origin refs/heads/codex/issue-28-ms001 | cut -f1)" = "$branch_parent"
          git push origin "$commit":refs/heads/codex/issue-28-ms001
          printf 'published=%s\ntree=%s\nmain=%s\n' "$commit" "$tree" "$main"
