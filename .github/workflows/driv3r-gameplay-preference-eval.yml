name: DRIV3R Gameplay Preference P1-P3 bounded research qualification

# Dedicated model-research-only workflow. No native Godot, model downloads,
# external API, gameplay content changes or secrets.
on:
  push:
    branches:
      - research/driv3r-preference-eval-proxy-20261116
    paths:
      - 'experiments/driv3r/training/preference_eval/**'
      - '.github/workflows/driv3r-gameplay-preference-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driv3r-pref-p1-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  p1-source-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact research HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source syntax and run adversarial original-feature tests
        run: |
          python3 -m compileall -q experiments/driv3r/training/preference_eval
          python3 -m unittest discover -s experiments/driv3r/training/preference_eval -p 'test_*.py' -v
      - name: Train original source-feature pairwise proxy heads (no worm inference)
        run: |
          python3 experiments/driv3r/training/preference_eval/rank.py --output-dir "$RUNNER_TEMP/pref-p1"
      - name: Train and audit P3 legal-material trapped-world comparison (external synthetic only)
        run: |
          python3 experiments/driv3r/training/preference_eval/recovery_p3.py --output "$RUNNER_TEMP/pref-p1/p3"
      - name: Run P1 source-fenced cross-family falsification
        run: |
          python3 experiments/driv3r/training/preference_eval/diagnose_proxies.py --output "$RUNNER_TEMP/pref-p1/falsification.json"
      - name: Record source and trained-checkpoint hashes
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pref-p1"
          git rev-parse HEAD > "$RUNNER_TEMP/pref-p1/EXECUTED_SOURCE_SHA.txt"
          git status --short > "$RUNNER_TEMP/pref-p1/worktree_status.txt"
          sha256sum experiments/driv3r/training/preference_eval/*.py experiments/driv3r/training/preference_eval/source_features.csv > "$RUNNER_TEMP/pref-p1/SOURCE_SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/pref-p1" && sha256sum *.json > CHECKPOINT_AND_RESULT_SHA256SUMS.txt) || true
          (cd "$RUNNER_TEMP/pref-p1/p3" && sha256sum *ranker.json p3-report.json > P3_CHECKPOINT_SHA256SUMS.txt) || true
          echo 'P0-P2 use frozen original W0-derived features; P3 is a separate external synthetic trapped-world experiment with CPU-trained weak-label heads. No human votes, no native game, no real pretrained worm forwards, no new source archives.' > "$RUNNER_TEMP/pref-p1/TRUTH_BOUNDARY.txt"
      - name: Preserve exact-run trained heads and negative-control result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-gameplay-preference-p1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pref-p1/
          if-no-files-found: warn
          retention-days: 30

  p9-original-w16-propensity:
    # Independent research-data job. Never runs or alters the game/native engine.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact P9 research HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read pinned original W16 Actions archive (no model downloads)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pref-p9"
          curl --fail --location --retry 2 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/techrote/cybersand/actions/artifacts/14217467236/zip' \
            -o "$RUNNER_TEMP/pref-p9/original-W16.zip"
          echo "a7b756a3b0c2d639e5e48dad36d518dfd0e6b752deadca8b04ac11326717eafb  $RUNNER_TEMP/pref-p9/original-W16.zip" | sha256sum --check
      - name: Execute P9 original-source replay and CPU Adam propensity probes
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/driv3r/training/preference_eval/p9_clock_structure.py \
            --original "$RUNNER_TEMP/pref-p9/original-W16.zip" \
            --output "$RUNNER_TEMP/pref-p9/P9-results.json"
          git rev-parse HEAD > "$RUNNER_TEMP/pref-p9/EXECUTED_SOURCE_HEAD.txt"
          sha256sum experiments/driv3r/training/preference_eval/p8_stop_retention.py \
            experiments/driv3r/training/preference_eval/p9_clock_structure.py \
            experiments/driv3r/training/preference_eval/test_p9_clock_structure.py \
            "$RUNNER_TEMP/pref-p9/original-W16.zip" \
            "$RUNNER_TEMP/pref-p9/P9-results.json" > "$RUNNER_TEMP/pref-p9/SOURCE_AND_CHECKPOINT_SHA256SUMS.txt"
          echo 'W16 original, synthetic-W0 PyTorch-head logits; trained soft STOP-propensity probes only. No human preference, native Godot, true STOP-open rollout, game modification or checkpoint promotion.' > "$RUNNER_TEMP/pref-p9/TRUTH_BOUNDARY.txt"
      - name: Preserve original W16, trained P9 heads and exact-source results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-gameplay-preference-p9-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pref-p9/
          if-no-files-found: warn
          retention-days: 30

  p10-original-aux-head-factorial:
    # New *real auxiliary PyTorch-head forwards* inside original pinned Python W0.
    # Does not run root SLM, Godot, production providers, or paid GPUs.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact P10 research HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only PyTorch (no GPU or paid API)
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Read and hash-qualify immutable W16 producer artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pref-p10"
          curl --fail --location --retry 2 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/techrote/cybersand/actions/artifacts/14217467236/zip' \
            -o "$RUNNER_TEMP/pref-p10/original-W16.zip"
          echo "a7b756a3b0c2d639e5e48dad36d518dfd0e6b752deadca8b04ac11326717eafb  $RUNNER_TEMP/pref-p10/original-W16.zip" | sha256sum --check
      - name: Qualify original forward replay and adversarial STOP coupling
        shell: bash
        env:
          P10_W16_SOURCE: ${{ runner.temp }}/pref-p10/original-W16.zip
        run: |
          python3 -m unittest discover -s experiments/driv3r/training/preference_eval -p test_p10_live_head.py -v
      - name: Execute 162 new real auxiliary-model/W0 factorial trajectories
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/driv3r/training/preference_eval/p10_live_head.py \
            --original "$RUNNER_TEMP/pref-p10/original-W16.zip" \
            --out "$RUNNER_TEMP/pref-p10/rollouts" | tee "$RUNNER_TEMP/pref-p10/EXECUTION_SUMMARY.json"
          git rev-parse HEAD > "$RUNNER_TEMP/pref-p10/EXECUTED_SOURCE_HEAD.txt"
          sha256sum experiments/driv3r/training/preference_eval/p10_live_head.py \
            experiments/driv3r/training/preference_eval/test_p10_live_head.py \
            experiments/driv3r/training/preference_eval/p8_stop_retention.py \
            "$RUNNER_TEMP/pref-p10/original-W16.zip" \
            "$RUNNER_TEMP/pref-p10/rollouts/P10-results.json" > "$RUNNER_TEMP/pref-p10/SOURCE_AND_REPORT_SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/pref-p10/rollouts" && sha256sum *.json *.png > ROLLOUT_SHA256SUMS.txt)
          echo 'Real frozen W16 AUXILIARY PyTorch MLP inference in synthetic W0; STOP menu and 15 clock input interventions. No root Sprocket LLM, Godot, owner aesthetics, human ratings or newly trained reward model.' > "$RUNNER_TEMP/pref-p10/TRUTH_BOUNDARY.txt"
      - name: Preserve original checkpoint, 162 source-receipt trajectories and PNGs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-gameplay-preference-p10-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pref-p10/
          if-no-files-found: warn
          retention-days: 30


  p11-real-W16-stop-only-heldout:
    # Only the research-owned W16 auxiliary-head and pinned synthetic W0.
    # Never touches game/native, production provider configuration or paid GPUs.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact P11 research HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only PyTorch
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Retrieve and hash-verify original immutable W16 auxiliary checkpoint/host
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pref-p11"
          curl --fail --location --retry 2 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/techrote/cybersand/actions/artifacts/14217467236/zip' \
            -o "$RUNNER_TEMP/pref-p11/original-W16.zip"
          echo "a7b756a3b0c2d639e5e48dad36d518dfd0e6b752deadca8b04ac11326717eafb  $RUNNER_TEMP/pref-p11/original-W16.zip" | sha256sum --check
      - name: Run P11 adversarial source-model-legal-menu tests
        shell: bash
        env:
          P11_W16_SOURCE: ${{ runner.temp }}/pref-p11/original-W16.zip
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/driv3r/training/preference_eval -p test_p11_stop_only_clock.py -v
      - name: Run 648 original frozen-model trajectories across discovery and held-out worlds
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/driv3r/training/preference_eval/p11_stop_only_clock.py \
            --original "$RUNNER_TEMP/pref-p11/original-W16.zip" \
            --out "$RUNNER_TEMP/pref-p11/rollouts" > "$RUNNER_TEMP/pref-p11/EXECUTION_SUMMARY.json"
          test "$(find "$RUNNER_TEMP/pref-p11/rollouts" -maxdepth 1 -name '*.png' | wc -l)" -eq 648
          git rev-parse HEAD > "$RUNNER_TEMP/pref-p11/EXECUTED_SOURCE_HEAD.txt"
          sha256sum experiments/driv3r/training/preference_eval/p8_stop_retention.py \
            experiments/driv3r/training/preference_eval/p10_live_head.py \
            experiments/driv3r/training/preference_eval/p11_stop_only_clock.py \
            experiments/driv3r/training/preference_eval/test_p11_stop_only_clock.py \
            "$RUNNER_TEMP/pref-p11/original-W16.zip" \
            "$RUNNER_TEMP/pref-p11/rollouts/P11-results.json" > "$RUNNER_TEMP/pref-p11/SOURCE_MODEL_REPORT_SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/pref-p11/rollouts" && sha256sum *.json *.png > ROLLOUT_SHA256SUMS.txt)
          echo 'Real pretrained W16 AUXILIARY MLP forwards in synthetic pinned W0; one frozen STOP-only clock-logit substitution plus unchanged movement head. No Sprocket root language model, native gameplay, human ratings, new optimizer or provider changes.' > "$RUNNER_TEMP/pref-p11/TRUTH_BOUNDARY.txt"
      - name: Preserve exact-HEAD P11 source model 648 trajectories and PNGs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-gameplay-preference-p11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pref-p11/
          if-no-files-found: warn
          retention-days: 30
