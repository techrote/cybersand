name: SOL281 exact native and actual Rapier proof
on:
  push:
    branches: [work/sol281-native-detachment-20261027]
    paths: ['.github/workflows/sol281-async-assemble.yml']
permissions:
  contents: read
concurrency:
  group: sol281-async-proof
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/work/sol281-native-detachment-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed source and remove one-shot tooling
        id: source
        shell: bash
        run: |
          set -euo pipefail
          # Remove a redundant blank-line-only rewrite; the assembler then
          # verifies every final byte against the locally executed source hash.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/soliding/materialize_issue281_async.py')
          s=p.read_text()
          lines=s.splitlines(True)
          needle='s=once(s,"    [[nodiscard]] static std::int64_t logical_processor_count();'
          assert sum(line.startswith(needle) for line in lines)==1
          p.write_text(''.join(line for line in lines if not line.startswith(needle)))
          PY
          python3 tools/soliding/materialize_issue281_async.py
          git diff --check
          git add godot/native_extension/cyber_native_cell_world.hpp godot/native_extension/cyber_native_cell_world.cpp godot/native_extension/solid_detachment_adapter.inc godot/scripts/simulation_worker.gd
          git add -u tools/soliding/materialize_issue281_async.py .github/workflows/sol281-async-assemble.yml .github/workflows/sol281-toolchain.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(sol281): integrate exact native adapter and async transaction fence'
          git push origin HEAD:refs/heads/work/sol281-native-detachment-20261027
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  linux-rapier:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GODOT_CPP_ROOT: ${{ runner.temp }}/sol281-tools/godot-cpp
      LINUX_CXX: /usr/bin/g++-13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.assemble.outputs.source }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Load hash-verified source-pinned toolchain artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sol281-tools" build/sol281-host
          gh api repos/techrote/cybersand/actions/artifacts/12773321343/zip > "$RUNNER_TEMP/toolchain.zip"
          echo 'b88ff56fe4b9dc2c4837312f06eb6e12c231042fe8746c8a8aa2281fdfa544c8' " $RUNNER_TEMP/toolchain.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/toolchain.zip" -d "$RUNNER_TEMP/sol281-tools"
          tar -xzf "$RUNNER_TEMP/sol281-tools/godot-cpp.tar.gz" -C "$RUNNER_TEMP/sol281-tools"
          unzip -q "$RUNNER_TEMP/sol281-tools/godot-linux.zip" -d "$RUNNER_TEMP/sol281-tools"
          chmod +x "$RUNNER_TEMP/sol281-tools/Godot_v4.7-stable_linux.x86_64"
          git config --global --add safe.directory "$GODOT_CPP_ROOT"
          test "$(git -C "$GODOT_CPP_ROOT" rev-parse HEAD)" = 101ae38034304346a46ea9ea84ae156d3e860496
          git rev-parse HEAD > build/sol281-host/source.txt
          g++-13 --version > build/sol281-host/compiler.txt
          python3 tools/ci/check_ci_provider_policy.py
      - name: Build and test exact native kernel
        run: |
          set -euo pipefail
          timeout 8m make CXX=g++-13 solid-detachment-test 2>&1 | tee build/sol281-host/native.txt
      - name: Build source-matched experimental GDExtension
        run: |
          set -euo pipefail
          timeout 12m tools/build_native_extension.sh 2>&1 | tee build/sol281-host/build.txt
          sha256sum godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so > build/sol281-host/runtime.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          paths=[]
          for root in ('native','godot/native_extension','godot/scripts'):
            paths += [p for p in Path(root).rglob('*') if p.suffix in ('.cpp','.hpp','.h','.inc','.gd')]
          Path('build/sol281-host/source-inputs.json').write_text(json.dumps({'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}},indent=2))
          PY
      - name: Execute actual async native and Rapier motion/failure tests
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/sol281-tools/Godot_v4.7-stable_linux.x86_64"
          timeout 60s "$GODOT" --headless --path godot --editor --import --quit > build/sol281-host/import.txt 2>&1
          timeout 60s "$GODOT" --headless --path godot --script res://tests/test_solid_detachment.gd -- "$PWD/build/sol281-host/rapier.json" 2>&1 | tee build/sol281-host/rapier.txt
          timeout 45s "$GODOT" --headless --path godot --script res://tests/test_solid_detachment_failures.gd 2>&1 | tee build/sol281-host/failures.txt
          ! grep -E 'SCRIPT ERROR|ERROR: Failed to load' build/sol281-host/import.txt build/sol281-host/rapier.txt build/sol281-host/failures.txt
      - name: Capture real rendered native-to-body transition
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/sol281-tools/Godot_v4.7-stable_linux.x86_64"
          timeout 45s xvfb-run -a "$GODOT" --path godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1200x820 res://solid_detachment_lab.tscn -- --capture "$PWD/build/sol281-host/tree" > build/sol281-host/render.txt 2>&1
          ! grep -E 'SCRIPT ERROR|ERROR: Failed to load' build/sol281-host/render.txt
          test -s build/sol281-host/tree-anchored.png
          test -s build/sol281-host/tree-tick240.png
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sol281-linux-actual-${{ needs.assemble.outputs.source }}
          path: build/sol281-host/
          retention-days: 30
  linux-sanitize:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.assemble.outputs.source }}
          persist-credentials: false
      - name: ASan and UBSan actual World detachment
        run: |
          set -euo pipefail
          mkdir -p build/sol281-sanitize
          git rev-parse HEAD > build/sol281-sanitize/source.txt
          timeout 15m make CXX=g++-13 solid-detachment-sanitize 2>&1 | tee build/sol281-sanitize/sanitizer.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sol281-linux-sanitize-${{ needs.assemble.outputs.source }}
          path: build/sol281-sanitize/
  windows-native:
    needs: assemble
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.assemble.outputs.source }}
          persist-credentials: false
      - name: MSVC actual native World conformance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/sol281-windows | Out-Null
          git rev-parse HEAD | Set-Content build/sol281-windows/source.txt
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'MSVC toolchain absent' }
          $dev = Join-Path $install 'Common7/Tools/VsDevCmd.bat'
          $line = '"'+$dev+'" -arch=x64 && cl /nologo /EHsc /std:c++20 /Zc:__cplusplus /O1 /I native/include native/src/world.cpp native/src/material_rules.cpp native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp native/src/render_snapshot.cpp native/src/c_api.cpp native/tests/test_solid_detachment.cpp /Fe:build/sol281-windows/test.exe && build\sol281-windows\test.exe'
          & cmd /c $line 2>&1 | Tee-Object build/sol281-windows/native.txt
          if ($LASTEXITCODE -ne 0) { throw "Native build/test failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sol281-windows-native-${{ needs.assemble.outputs.source }}
          path: build/sol281-windows/
