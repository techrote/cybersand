name: SOL281 compound-coupling documentation assembly

on:
  push:
    branches: [work/sol281-native-detachment-20261027]
    paths: ['.github/workflows/sol281-doc-routing-assemble.yml']

permissions:
  contents: write

jobs:
  assemble:
    if: github.repository == 'techrote/cybersand'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconcile status, handover and retrieval routes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9e45687989bb09d8878f51452fde44435d017c0f
          python3 - <<'PY'
          from pathlib import Path
          import json
          replacements = {
            'docs/README.md': (
              '**Experimental source checkpoint:** [real native-tree detachment laboratory](systems/solid-detachment.md) and [source-qualified execution record](audits/2026-10-27-sol281-native-tree.md) now demonstrate actual native payload transfer and Linux Rapier toppling. This dry inert one-body branch is not main/release acceptance or general reactive-solid coupling; #281 stays open.',
              '**Experimental source checkpoint:** [real native-tree detachment laboratory](systems/solid-detachment.md) now demonstrates actual native payload transfer, Linux/Windows Rapier toppling and hole-preserving six-proxy Sand/Water coupling at source `41dc25ca`. Read the [initial proof](audits/2026-10-27-sol281-native-tree.md) and [compound-coupling evidence](audits/2026-10-27-sol281-compound-cellular-coupling.md). This dry inert one-body branch is not main/release acceptance, reactive Wood or general desoliding; #281 stays open.'),
            'docs/reference/status-and-roadmap.md': (
              '**Later experimental implementation checkpoint (not merged production):** [native detachment runtime](../systems/solid-detachment.md) at source 741bc077 has 520 native cells, six exact compound shapes, real async Linux Rapier motion, 13,074-check Linux/Windows native and Linux sanitizer passes, 21 motion and 20 live failure checks, and rendered captures. [The dated record](../audits/2026-10-27-sol281-native-tree.md) preserves all source and platform limits. Reactive Wood/compound cellular coupling, dynamic demotion, Windows Rapier, independent review and full qualification remain open; #281 is not closed.',
              '**Later experimental implementation checkpoint (not merged production):** [native detachment runtime](../systems/solid-detachment.md) now reaches source `41dc25ca`: 520 native cells, six exact shapes/proxies, actual Linux and Windows Rapier toppling, session-reset fences, and hole-preserving Sand/Water interaction. The [initial record](../audits/2026-10-27-sol281-native-tree.md) and [compound-coupling record](../audits/2026-10-27-sol281-compound-cellular-coupling.md) preserve exact scopes. Coupling passes 32 checks per platform with quantity conservation and real contact/displacement, while cumulative unresolved interactions remain 1,094 Linux / 2,190 Windows. Reactive Wood, dynamic demotion/fracture, persistence, independent review, full qualification and release publication remain open; #281 is not closed.'),
            'docs/operations/cybersand-codex-development-handover.md': (
              'Branch `work/sol281-native-detachment-20261027`, tested source `741bc0775c190be98e2f5d23da3d47dd354fef99`, contains the [experimental native-tree laboratory](../systems/solid-detachment.md). [Actual execution and failures](../audits/2026-10-27-sol281-native-tree.md) distinguish the dry ambient RedBrick transfer/Rapier proof from still-missing reactive Wood, compound native material occupancy, general dynamic desoliding, Windows Rapier, current published runtimes and independent/full review. Retain the successful 40592308871 evidence and do not claim #281 closed. Resume from these concrete gaps rather than rebuilding an authored falling-body demo.',
              'Branch `work/sol281-native-detachment-20261027`, executed source `41dc25ca060ecb07cef15c1640feeb9f6cce1eb4`, contains the [experimental native-tree laboratory](../systems/solid-detachment.md). [Initial motion evidence](../audits/2026-10-27-sol281-native-tree.md) and [compound Sand/Water evidence](../audits/2026-10-27-sol281-compound-cellular-coupling.md) now cover actual Linux/Windows Rapier, six exact hole-preserving proxies and session replacement. Preserve cumulative unresolved counts and do not claim production coupling. Next: reactive Wood/heterogeneous bonds, broader material cases, dynamic desoliding/fracture, persistence, cost/feel, runtime publication and independent/full review. #281 remains open.'),
            'docs/reference/retrieval-index.md': (
              '- **What actually runs for #281, and can I test native-tree toppling?** [Experimental native solid-detachment runtime and controls](../systems/solid-detachment.md), [741bc077 Linux/Windows-native/Rapier evidence and unpassed gates](../audits/2026-10-27-sol281-native-tree.md). Distinguish actual native terrain transfer from authored bodies, Windows native from Windows Rapier, and inactive rollback from dynamic desoliding.',
              '- **What actually runs for #281, including compound cellular coupling?** [Experimental native solid-detachment runtime and controls](../systems/solid-detachment.md), [initial native-tree evidence](../audits/2026-10-27-sol281-native-tree.md), then [41dc25ca Linux/Windows Sand/Water coupling evidence](../audits/2026-10-27-sol281-compound-cellular-coupling.md). Distinguish exact six-proxy holes from a filled AABB, scoped coupling from reactive Wood/general desoliding, and retained unresolved counts from a production-acceptance claim.')
          }
          for path, (old, new) in replacements.items():
              p=Path(path); text=p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'expected one routing anchor in {path}, found {text.count(old)}')
              p.write_text(text.replace(old,new,1))
          p=Path('docs/reference/retrieval-corpus.json')
          corpus=json.loads(p.read_text())
          audit='audits/2026-10-27-sol281-compound-cellular-coupling.md'
          if not any(item.get('path') == audit for item in corpus['excluded']):
              corpus['excluded'].append({'path':audit,'reason':'Dated source-41dc25ca actual Linux/Windows compound Sand/Water evidence with nonzero unresolved counters; retrieve through the current experimental solid-detachment contract, not as production soliding acceptance'})
          corpus['reviewed']='2026-10-27'
          p.write_text(json.dumps(corpus,indent=2,ensure_ascii=False)+'\n')
          PY
          python3 -m json.tool docs/reference/retrieval-corpus.json >/dev/null
          git diff --check
          git add docs/README.md docs/reference/status-and-roadmap.md \
            docs/operations/cybersand-codex-development-handover.md \
            docs/reference/retrieval-index.md docs/reference/retrieval-corpus.json
          git rm .github/workflows/sol281-doc-routing-assemble.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(sol281): route qualified compound cellular coupling and retained limits'
          git push origin HEAD:refs/heads/work/sol281-native-detachment-20261027
