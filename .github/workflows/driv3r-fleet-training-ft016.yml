name: DRIV3R FT-016 frozen STOP ending taxonomy and horizon-normalised utility

on:
  push:
    branches: [research/570-fleet-training-throughput-001]
    paths:
      - .github/workflows/driv3r-fleet-training-ft016.yml
      - experiments/driv3r/fleet_training/ft016_endings.py
      - experiments/driv3r/fleet_training/request_ft016.json
      - experiments/driv3r/fleet_training/test_ft016_endings.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  score-original-frozen-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [9401, 9403]
        cohort: [navigation, art]
        include:
          - {seed: 9401, cohort: art, ft014_artifact: 14232543956}
          - {seed: 9401, cohort: navigation, ft014_artifact: 14233139381}
          - {seed: 9403, cohort: art, ft014_artifact: 14233259126}
          - {seed: 9403, cohort: navigation, ft014_artifact: 14232149598}
    concurrency:
      group: driv3r-ft016-${{ github.ref }}-${{ matrix.seed }}-${{ matrix.cohort }}
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: techrote/cybersand
          ref: 534cd8ffac6fbe33a714ae03a62c16045bf10259
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 PyYAML==6.0.2
      - name: Exact source, legal STOP tests and policy constraints
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/driv3r/fleet_training/ft015_ood_stop.py)" = e3e232ddc11fa7e4d4b0113e741e7008ab9394a7
          python -m compileall -q experiments/driv3r/fleet_training
          python -m unittest discover -s experiments/driv3r/fleet_training -p 'test_*.py' -v
          python tools/ci/check_ci_provider_policy.py
          python tools/ci/check_ci_scheduling_policy.py
      - name: Establish exact-HEAD lease and original source inventory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ft016-original" "$RUNNER_TEMP/ft003-original" "$RUNNER_TEMP/ft014-original"
          git rev-parse HEAD > "$RUNNER_TEMP/ft016-original/exact-head.txt"
          sha256sum experiments/driv3r/fleet_training/{ft016_endings.py,request_ft016.json,test_ft016_endings.py,ft015_ood_stop.py} > "$RUNNER_TEMP/ft016-original/owned-source.sha256"
          printf 'FT016 run=%s attempt=%s job=%s seed=%s cohort=%s head=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "${{ matrix.seed }}" "${{ matrix.cohort }}" "$GITHUB_SHA" > "$RUNNER_TEMP/ft016-original/lease.txt"
      - name: Retrieve immutable checkpoint archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/ft003-original.zip" "https://api.github.com/repos/techrote/cybersand/actions/artifacts/14194214028/zip"
          echo "fec6d5e254a0bbe590b44ba26bbb7427960af507a5c6fe78b1d7e5fe5389c910  $RUNNER_TEMP/ft003-original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ft003-original.zip" -d "$RUNNER_TEMP/ft003-original"
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/ft014-original.zip" "https://api.github.com/repos/techrote/cybersand/actions/artifacts/${{ matrix.ft014_artifact }}/zip"
          unzip -q "$RUNNER_TEMP/ft014-original.zip" -d "$RUNNER_TEMP/ft014-original"
          sha256sum "$RUNNER_TEMP/ft014-original.zip" >> "$RUNNER_TEMP/ft016-original/owned-source.sha256"
      - name: Run matched goal/STOP/total-utility and legal near-goal probes
        run: |
          set -euo pipefail
          python experiments/driv3r/fleet_training/ft016_endings.py --request experiments/driv3r/fleet_training/request_ft016.json --upstream upstream --ft003 "$RUNNER_TEMP/ft003-original" --ft014 "$RUNNER_TEMP/ft014-original" --output "$RUNNER_TEMP/ft016-original/run" --seed ${{ matrix.seed }} --cohort ${{ matrix.cohort }}
      - name: Publish full original evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft016-${{ matrix.seed }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ft016-original/
          if-no-files-found: warn
          retention-days: 14
