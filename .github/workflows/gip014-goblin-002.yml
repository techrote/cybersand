name: GIP-014 goblin-002 focused discovery qualification

on:
  push:
    branches: [experiment/gip014-goblin-002-20261125]
    paths: ['tools/gip014/qualification-request-002.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gip014-goblin-002-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  linux-discovery-campaign:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize only retained Linux libraries
        run: |
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so'
          python -m pip install -r tools/gip014/requirements.txt
      - name: Provision the bounded graphical test display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Validate the existing CI provider policy
        run: python tools/ci/check_ci_provider_policy.py
      - name: Run bounded source, graphical and comparative experiments
        env:
          GODOT_SILENCE_ROOT_WARNING: '1'
          DISPLAY: ':99'
        run: |
          python tools/gip014/qualify_linux.py --out '${{ runner.temp }}/goblin002-linux' --plan full
      - name: Preserve all Linux attempts, including failures and pending actions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gip014-goblin-002-linux-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/goblin002-linux/**/*.json
            ${{ runner.temp }}/goblin002-linux/**/*.log
            ${{ runner.temp }}/goblin002-linux/**/*.png
            ${{ runner.temp }}/goblin002-linux/**/executed-game-source.zip
            !${{ runner.temp }}/goblin002-linux/**/project/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  windows-developer-evaluator:
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize only retained Windows libraries
        run: |
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS initialization failed.' }
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'
          if ($LASTEXITCODE -ne 0) { throw 'Retained Windows runtime unavailable.' }
          python -m pip install -r tools/gip014/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Process-tree monitor unavailable.' }
      - name: Qualify actual source gameplay and the extracted evaluator
        run: |
          & tools/gip014/qualify_windows.ps1 -Output (Join-Path $env:RUNNER_TEMP 'goblin002-windows')
          if ($LASTEXITCODE -ne 0) { throw 'Windows qualification failed; original attempts remain retained.' }
      - name: Preserve every Windows attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gip014-goblin-002-windows-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/goblin002-windows/source-tests/
            ${{ runner.temp }}/goblin002-windows/extracted/CyberSand-goblin/test-output/
            ${{ runner.temp }}/goblin002-windows/extracted/CyberSand-goblin/goblin-evaluator-manifest.json
            ${{ runner.temp }}/goblin002-windows/*.json
            ${{ runner.temp }}/goblin002-windows/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Retain only the qualified Draft Windows evaluator
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gip014-goblin-002-qualified-windows-evaluator-${{ github.sha }}
          path: ${{ runner.temp }}/goblin002-windows/CyberSand-goblin.zip
          if-no-files-found: error
          retention-days: 30
