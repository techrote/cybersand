name: DRIV3R FT-019 matched two-goal movement optimizer continuation

on:
  push:
    branches: [research/570-fleet-training-throughput-001]
    paths:
      - .github/workflows/driv3r-fleet-training-ft019.yml
      - experiments/driv3r/fleet_training/ft019_two_goal_training.py
      - experiments/driv3r/fleet_training/request_ft019.json
      - experiments/driv3r/fleet_training/test_ft019_two_goal_training.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train-and-evaluate-legal-goal-movement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [9401, 9403]
        cohort: [navigation, art]
    concurrency:
      group: driv3r-ft019-${{ github.ref }}-${{ matrix.seed }}-${{ matrix.cohort }}
      cancel-in-progress: false
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: techrote/cybersand
          ref: 534cd8ffac6fbe33a714ae03a62c16045bf10259
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 PyYAML==6.0.2
      - name: Verify precise predecessor and legal research scope
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/driv3r/fleet_training/ft018_two_stage.py)" = 0a1f5970d82d59cc918b3f073065c0e511ca138e
          python -m compileall -q experiments/driv3r/fleet_training
          python -m unittest discover -s experiments/driv3r/fleet_training -p 'test_*.py' -v
          python tools/ci/check_ci_provider_policy.py
          python tools/ci/check_ci_scheduling_policy.py
      - name: Establish source-pinned job and failure inventory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ft019-original" "$RUNNER_TEMP/ft003-original"
          git rev-parse HEAD > "$RUNNER_TEMP/ft019-original/exact-head.txt"
          sha256sum experiments/driv3r/fleet_training/{ft019_two_goal_training.py,request_ft019.json,test_ft019_two_goal_training.py,ft018_two_stage.py} > "$RUNNER_TEMP/ft019-original/owned-source.sha256"
          printf 'FT019 run=%s attempt=%s seed=%s cohort=%s commit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ matrix.seed }}" "${{ matrix.cohort }}" "$GITHUB_SHA" > "$RUNNER_TEMP/ft019-original/lease.txt"
      - name: Retrieve immutable original parent checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/ft003-original.zip" "https://api.github.com/repos/techrote/cybersand/actions/artifacts/14194214028/zip"
          echo "fec6d5e254a0bbe590b44ba26bbb7427960af507a5c6fe78b1d7e5fe5389c910  $RUNNER_TEMP/ft003-original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ft003-original.zip" -d "$RUNNER_TEMP/ft003-original"
      - name: Real Adam continuation and independent held-out two-goal gameplay
        run: |
          set -euo pipefail
          python experiments/driv3r/fleet_training/ft019_two_goal_training.py --request experiments/driv3r/fleet_training/request_ft019.json --upstream upstream --ft003 "$RUNNER_TEMP/ft003-original" --output "$RUNNER_TEMP/ft019-original/run" --seed ${{ matrix.seed }} --cohort ${{ matrix.cohort }}
      - name: Preserve original checkpoints, galleries, metrics and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft019-${{ matrix.seed }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ft019-original/
          if-no-files-found: warn
          retention-days: 14
