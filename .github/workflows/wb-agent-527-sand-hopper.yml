name: WB-AGENT-527 real-native Sand-hopper control

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'native/tests/test_wb_agent_sand_hopper.cpp'
      - 'native/tests/fixtures/wb_agent_sand_hopper_v1.tsv'
      - 'tools/wb_agent/verify_sand_hopper.py'
      - '.github/workflows/wb-agent-527-sand-hopper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-agent-527-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native_control_linux:
    name: Native World control and independent readback / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RESULT_DIR: build/wb-agent-527
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false
      - name: Record source and immutable controls
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD > "$RESULT_DIR/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RESULT_DIR/source-tree.txt"
          cp native/tests/fixtures/wb_agent_sand_hopper_v1.tsv "$RESULT_DIR/manifest.tsv"
          sha256sum "$RESULT_DIR/manifest.tsv" > "$RESULT_DIR/manifest-sha256.txt"
          g++ --version | head -n 1 > "$RESULT_DIR/compiler.txt"
          python3 --version >> "$RESULT_DIR/compiler.txt"
          python3 tools/ci/check_ci_provider_policy.py > "$RESULT_DIR/provider-policy.json"
          python3 tools/wb_agent/verify_sand_hopper.py --manifest "$RESULT_DIR/manifest.tsv"             2>&1 | tee "$RESULT_DIR/preflight.log"
      - name: Build actual current native World (no mock)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow             -O1 -g -pthread -I native/include             native/src/world.cpp native/src/material_rules.cpp             native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp             native/src/render_snapshot.cpp native/src/c_api.cpp             native/tests/test_wb_agent_sand_hopper.cpp             -o "$RESULT_DIR/wb_agent_sand_hopper"
          sha256sum "$RESULT_DIR/wb_agent_sand_hopper" > "$RESULT_DIR/native-binary-sha256.txt"
          ldd "$RESULT_DIR/wb_agent_sand_hopper" > "$RESULT_DIR/native-linked-libraries.txt"
      - name: Execute preregistered NORMAL and REVISED native controls
        timeout-minutes: 4
        run: |
          set -euo pipefail
          timeout 180s "$RESULT_DIR/wb_agent_sand_hopper" "$RESULT_DIR/manifest.tsv"             2>&1 | tee "$RESULT_DIR/native-original.log"
      - name: Independent control verification
        if: always()
        run: |
          set -euo pipefail
          test -f "$RESULT_DIR/native-original.log"
          python3 tools/wb_agent/verify_sand_hopper.py             --manifest "$RESULT_DIR/manifest.tsv"             --native-log "$RESULT_DIR/native-original.log"             2>&1 | tee "$RESULT_DIR/verification.log"
      - name: Preserve original positive and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-agent-527-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/wb-agent-527/*.txt
            build/wb-agent-527/*.tsv
            build/wb-agent-527/*.json
            build/wb-agent-527/*.log
          if-no-files-found: error
          retention-days: 90
