name: QL-011 observable-state counterfactual Q1/Q4 worm repair (research)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql011_observable_repair.py'
      - '.github/workflows/driv3r-quant-lab-ql011.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql011-observable-neighbour
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  observable-state-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free pinned CPU-only dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Retrieve immutable original QL-003 trained quantized model checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Self-test host legality and adapter zero-start
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql011_observable_repair.py --self-test
      - name: Execute 192 bounded real optimizer updates, matched heldout and original PNGs
        run: |
          python experiments/driv3r/quant_lab/ql011_observable_repair.py \
            --parent ql003-source --out ql011-out --steps 64 --horizon 96
      - name: Exact source/checkpoint/host receipts and original-PNG integrity validation
        run: |
          python - <<'PY'
          import json,hashlib,os,subprocess
          from pathlib import Path
          import torch
          root=Path("ql011-out")
          r=json.loads((root/"results.json").read_text())
          sha=os.environ["QL_SOURCE_SHA"]
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==sha
          assert r["source_sha"]==sha
          assert r["parent_source_sha"]=="9b4103c48127e5c8538403e2a4d9e2525fbe8755"
          assert r["parent_manifest_entries"]>=330
          assert r["optimizer_updates"]==192 and r["heldout_n"]==4352
          assert r["train_pairs"]==512 and r["heldout_pairs"]==128
          assert len(r["training"])==3 and len(r["variants"])==5 and len(r["controls"])==3
          assert r["first_pass_trajectories"]==132 and r["original_png_n"]==132
          for name,t in r["training"].items():
              assert t["updates"]==64 and t["optimizer_nonzero_moment_tensors"]==2
              assert t["parent_packed_q1_q4_codes_unchanged"]
              checkpoint=torch.load(root/"models"/(name+"-optimizer.pt"),
                                    map_location="cpu",weights_only=False)
              assert checkpoint["source_sha"]==sha and len(checkpoint["trace"])==64
              assert checkpoint["parent_source_sha"]==r["parent_source_sha"]
              assert torch.count_nonzero(checkpoint["state_dict"]["v"]).item()>0
          raw=json.loads((root/"raw_decisions.json").read_text())
          assert len(raw)==132
          assert all(row["first_pass"] and
                     all(step["chosen"] in step["legal"] for step in row["steps"])
                     for row in raw)
          assert all("STOP" in row["steps"][0]["legal"] for row in raw if row["steps"])
          assert sum(len(row["steps"]) for row in raw)>0
          for result in r["variants"].values():
              assert result["heldout"]["n"]==4352
              assert result["heldout"]["host_masked_legal"]==4352
              assert result["observable_pairs"]["n"]==128
              assert result["observable_pairs"]["different_oracle_actions"]==128
          assert hashlib.sha256((root/"raw_decisions.json").read_bytes()).hexdigest()==r["raw_decisions_sha256"]
          manifest=json.loads((root/"MANIFEST.json").read_text())
          assert len({m["path"] for m in manifest})==len(manifest)
          for m in manifest:
              b=(root/m["path"]).read_bytes()
              assert len(b)==m["bytes"] and hashlib.sha256(b).hexdigest()==m["sha256"]
          assert len(list((root/"gallery").glob("*.png")))==132
          print("QL011 EXACT-HEAD PASS",sha,len(manifest),"files",len(raw),"original PNGs")
          PY
      - name: Retain genuine optimizer states, negative metrics and source-faithful original drawings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql011-observable-neighbour-counterfactual
          path: ql011-out/
          retention-days: 21
          if-no-files-found: warn
