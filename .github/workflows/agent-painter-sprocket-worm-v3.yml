name: SPROCKET WORM-001 prompt-disjoint source-pinned CPU steering campaign v3
on:
  push:
    branches:
      - codex/agent-painter-sprocket-568
    paths:
      - experiments/agent_painter/lanes/sprocket/worm-request-v3.json

permissions:
  contents: read

concurrency:
  group: sprocket-worm-v3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  train-worm:
    name: Real SPROCKET WORM LoRA updates; strict EOS5 first passes
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin immutable experimental lease; refuse altered model or W0 contract
        run: |
          set -euo pipefail
          mkdir -p evidence/worm
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          request=json.loads(Path('experiments/agent_painter/lanes/sprocket/worm-request-v3.json').read_text())
          expected={
              'schema':'cybersand.worm.sprocket-cpu-support/3',
              'experiment':'sprocket-worm-v3-support-001',
              'model':'kandivault/sprocket-500m',
              'model_revision':'eb157d4ddddc4619e661d4a2426bb2dd000fc668',
              'w0_git_commit':'4bb9d6e1d0d0d78183f87d1e3c29648edafacf61',
              'support_git_commit':'2b6534ac21542805f4bda123f67e9624d21e39d7',
              'steps':72,'keep_draft':True,'native':False,'sealed_final_forbidden':True
          }
          if request != expected: raise SystemExit('WORM experiment source lease changed')
          if os.environ['GITHUB_REF'] != 'refs/heads/codex/agent-painter-sprocket-568':
              raise SystemExit('not sole SPROCKET lane branch')
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          Path('evidence/worm/source-sha.txt').write_text(sha+'\n')
          Path('evidence/worm/request.json').write_text(json.dumps(request,indent=2)+'\n')
          print('WORM v3 immutable source',sha,'actual CPU optimizer not yet started')
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 experiments/agent_painter/lanes/sprocket/worm_v1.py
      - name: Get exact shepherd-owned W0 source without changing local Git source
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git rev-parse FETCH_HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          mkdir -p "$RUNNER_TEMP/worm/common" "$RUNNER_TEMP/worm/support_sprocket"
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/worm/common/worm.py"
          test "$(git hash-object "$RUNNER_TEMP/worm/common/worm.py")" = 8979b6f0296e81051194bacc907992d38e006605
          git fetch --no-tags --depth=1 origin 2b6534ac21542805f4bda123f67e9624d21e39d7
          test "$(git rev-parse FETCH_HEAD)" = 2b6534ac21542805f4bda123f67e9624d21e39d7
          git show 2b6534ac21542805f4bda123f67e9624d21e39d7:experiments/agent_painter/worm/support_sprocket/curriculum.py > "$RUNNER_TEMP/worm/support_sprocket/curriculum.py"
          test "$(git hash-object "$RUNNER_TEMP/worm/support_sprocket/curriculum.py")" = 4f879502921e26d526a8976f79954ffa636c1d4a
          cp "$RUNNER_TEMP/worm/common/worm.py" evidence/worm/pinned-worm-original.py
          cp "$RUNNER_TEMP/worm/support_sprocket/curriculum.py" evidence/worm/pinned-support-original.py
          sha256sum "$RUNNER_TEMP/worm/common/worm.py" "$RUNNER_TEMP/worm/support_sprocket/curriculum.py" > evidence/worm/external-source.sha256
          python3 -m py_compile "$RUNNER_TEMP/worm/common/worm.py" "$RUNNER_TEMP/worm/support_sprocket/curriculum.py" experiments/agent_painter/lanes/sprocket/worm_train_v3.py
          python3 experiments/agent_painter/lanes/sprocket/worm_v3.py --w0 "$RUNNER_TEMP/worm/common/worm.py" --support "$RUNNER_TEMP/worm/support_sprocket/curriculum.py" --output evidence/worm/source-dataset-preflight
      - name: Matched original W0 random, wall and fidget PNG baselines
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/pinned-worm.py" --seeds 211,223 --steps 72 --output evidence/worm/baselines > evidence/worm/baseline-receipts.jsonl
          test "$(find evidence/worm/baselines -name '*.png' | wc -l)" -eq 18
          test "$(find evidence/worm/baselines -name '*.json' | wc -l)" -eq 18
          (cd evidence/worm/baselines && sha256sum *.png *.json) > evidence/worm/baseline-checksums.txt
      - name: Install reviewed CPU-only stack afresh
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/painter-training"
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/painter-training/bin/python" -m pip check
          "$RUNNER_TEMP/painter-training/bin/python" -m pip freeze --all > evidence/worm/pip-freeze.txt
          lscpu > evidence/worm/cpu.txt
          sha256sum experiments/agent_painter/training/requirements.lock > evidence/worm/environment.sha256
      - name: Download and verify exact public root Instruct model
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/training/download_model.py --profile sprocket --output "$RUNNER_TEMP/painter-model"
          cp "$RUNNER_TEMP/painter-model/download_receipt.json" evidence/worm/model-download.json
      - name: Genuine 72-step prompt-disjoint LoRA campaign; partial checkpoint custody
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1700s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/lanes/sprocket/worm_train_v3.py \
            --model "$RUNNER_TEMP/painter-model" --w0 "$RUNNER_TEMP/worm/common/worm.py" \
            --support "$RUNNER_TEMP/worm/support_sprocket/curriculum.py" \
            --output evidence/worm/campaign --steps 72 --deadline 1600
      - name: Complete artifact hashes and storage accounting
        if: always()
        run: |
          set -euo pipefail
          df -h > evidence/worm/disk-after.txt
          (cd evidence/worm && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > evidence/worm/SHA256SUMS.txt
      - name: Preserve originals, failed and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sprocket-worm-v3-${{ github.sha }}
          path: evidence/worm/
          if-no-files-found: warn
          retention-days: 90
