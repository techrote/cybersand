name: Issue 59 publish source-matched runtimes

# One-shot #59 runtime/provenance publication. The workflow deletes itself in
# the publication commit so it cannot become permanent CI.
on:
  push:
    branches: [codex/issue-59-stage3b-runtime-sized-storage]
    paths: [.github/workflows/issue59-publish-runtimes.yml]

permissions:
  contents: write

concurrency:
  group: issue59-publish-runtimes
  cancel-in-progress: true

env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65

jobs:
  build-publish:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-59-stage3b-runtime-sized-storage'
    runs-on: sengi-standard-4-ubuntu-2404
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Pin exact publication source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-tree.txt"

      - name: Install pinned SCons
        run: |
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'

      - name: Check out exact godot-cpp
        run: |
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      - name: Build Linux x86_64
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "4"
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/libcybersand_native.linux.x86_64.so
        run: |
          timeout 35m tools/build_pinned_godot_cpp.sh linux
          timeout 20m tools/build_native_extension.sh
          file "$CYBERSAND_NATIVE_OUTPUT" | grep 'ELF 64-bit.*x86-64'
          timeout 1m tools/check_linux_runtime_floor.sh "$CYBERSAND_NATIVE_OUTPUT" || timeout 1m tools/check_linux_runtime_floor.sh
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so

      - name: Prepare LLVM-MinGW
        run: |
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then
            ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
          fi

      - name: Build Windows x86_64
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "4"
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
        run: |
          timeout 35m tools/build_pinned_godot_cpp.sh windows
          timeout 20m tools/build_native_extension_windows.sh
          file "$CYBERSAND_NATIVE_OUTPUT" | grep 'PE32+ executable (DLL).*x86-64'

      - name: Retain exact build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/issue59-runtimes"
          cp "$RUNNER_TEMP/libcybersand_native.linux.x86_64.so" "$RUNNER_TEMP/issue59-runtimes/"
          cp "$RUNNER_TEMP/cybersand_native.windows.x86_64.dll" "$RUNNER_TEMP/issue59-runtimes/"
          cp "$RUNNER_TEMP/source-sha.txt" "$RUNNER_TEMP/source-tree.txt" "$RUNNER_TEMP/issue59-runtimes/"
          (cd "$RUNNER_TEMP/issue59-runtimes" && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue59-source-matched-runtimes-${{ github.sha }}
          path: ${{ runner.temp }}/issue59-runtimes/
          if-no-files-found: error
          retention-days: 30

      - name: Install exact runtime bytes and regenerate provenance
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/libcybersand_native.linux.x86_64.so" godot/addons/cybersand_native/bin/
          cp "$RUNNER_TEMP/cybersand_native.windows.x86_64.dll" godot/addons/cybersand_native/bin/
          export SOURCE_SHA="$(cat "$RUNNER_TEMP/source-sha.txt")"
          export SOURCE_TREE="$(cat "$RUNNER_TEMP/source-tree.txt")"
          export BUILD_RUN="$GITHUB_RUN_ID"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('.')
          source=os.environ['SOURCE_SHA']
          tree=os.environ['SOURCE_TREE']
          run=os.environ['BUILD_RUN']
          win_path=root/'godot/addons/cybersand_native/runtime-provenance.json'
          lin_path=root/'godot/addons/cybersand_native/runtime-provenance.linux.json'
          win=json.loads(win_path.read_text())
          lin=json.loads(lin_path.read_text())
          inputs=set(win['source_inputs']) | set(lin['source_inputs'])
          source_inputs={}
          for rel in sorted(inputs):
              data=(root/rel).read_bytes().replace(b'\r\n',b'\n')
              source_inputs[rel]=hashlib.sha256(data).hexdigest()
          required={
              'native/include/cybersand/settled_discovery.hpp',
              'native/include/cybersand/settled_regions.hpp',
              'native/include/cybersand/settled_world_discovery.hpp',
              'native/src/settled_world_discovery.cpp',
          }
          assert required <= set(source_inputs), required-set(source_inputs)
          linux=root/'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so'
          windows=root/'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll'
          linux_sha=hashlib.sha256(linux.read_bytes()).hexdigest()
          windows_sha=hashlib.sha256(windows.read_bytes()).hexdigest()
          evidence='docs/audits/2026-09-19-issue-59-stage3b-runtime-sized-storage.md'
          artifact=f'issue59-source-matched-runtimes-{source}'
          win.update({
              'schema_version':1,
              'status':'validated-build-runtime',
              'source_commit':source,
              'source_tree':tree,
              'artifact':'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll',
              'sha256':windows_sha,
              'size':windows.stat().st_size,
              'source_input_hash_kind':'SHA-256 of canonical Git blob bytes; CRLF working files normalize to LF',
              'source_inputs':source_inputs,
              'evidence':evidence,
              'validated_platform':'Windows x86_64 Godot 4.7 (pinned cross-build; execution unavailable)',
              'toolchain':'LLVM-MinGW 20260826 UCRT Clang 23.1.0; godot-cpp 101ae38034304346a46ea9ea84ae156d3e860496; Stage-3B #59 runtime-sized storage source',
              'acceptance':f'Exact #59-source Windows x86_64 GDExtension cross-build passed in Actions run {run}. Actual Windows execution is unavailable and not claimed.',
              'validation_output':f'Actions run {run} / artifact {artifact}',
              'other_platforms':'Linux runtime was rebuilt from the same exact native source. Browser/WebAssembly execution and hardware-GPU/target-PC performance remain unavailable and are not claimed.'
          })
          for k in ['equivalent_branch_head','tested_merge_commit','artifact_id','workflow_run','artifact_zip_sha256']:
              win.pop(k,None)
          lin.update({
              'schema_version':1,
              'status':'validated-development-runtime',
              'source_commit':source,
              'source_tree':tree,
              'artifact':'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so',
              'sha256':linux_sha,
              'size':linux.stat().st_size,
              'source_input_hash_kind':'SHA-256 of canonical Git blob bytes; CRLF working files normalize to LF',
              'source_inputs':source_inputs,
              'evidence':evidence,
              'validated_platform':'Linux x86_64 Godot 4.7',
              'toolchain':'Ubuntu 24.04, GCC/G++ 13.3.0, binutils 2.42, SCons 4.10.1; godot-cpp 101ae38034304346a46ea9ea84ae156d3e860496; Stage-3B #59 runtime-sized storage source',
              'acceptance':f'Exact #59-source Linux x86_64 GDExtension build and ABI-floor validation passed in Actions run {run}. Exact-head Godot acceptance is rerun after publication.',
              'other_platforms':'Windows cross-build is from the same exact native source but is not Windows execution. Browser/WebAssembly execution and hardware-GPU/target-PC performance remain unavailable and are not claimed.',
              'workflow_run':f'https://github.com/techrote/cybersand/actions/runs/{run}'
          })
          for k in ['equivalent_branch_head','tested_merge_commit','artifact_id','artifact_zip_sha256']:
              lin.pop(k,None)
          win_path.write_text(json.dumps(win,indent=2)+'\n')
          lin_path.write_text(json.dumps(lin,indent=2)+'\n')
          PY

      - name: Verify and publish LFS runtimes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          for name in ['runtime-provenance.json','runtime-provenance.linux.json']:
              m=json.loads((root/'godot/addons/cybersand_native'/name).read_text())
              for rel,expected in m['source_inputs'].items():
                  actual=hashlib.sha256((root/rel).read_bytes().replace(b'\r\n',b'\n')).hexdigest()
                  assert actual==expected,(name,rel)
              data=(root/m['artifact']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==m['sha256']
              assert len(data)==m['size']
          PY
          git lfs install --local
          git add             godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll             godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so             godot/addons/cybersand_native/runtime-provenance.json             godot/addons/cybersand_native/runtime-provenance.linux.json
          git rm -f .github/workflows/issue59-publish-runtimes.yml
          git diff --cached --check
          git config user.name techrote
          git config user.email 261801702+techrote@users.noreply.github.com
          git commit -m 'build(stage3b): publish issue 59 source-matched runtimes'
          git lfs fsck
          git push origin HEAD:codex/issue-59-stage3b-runtime-sized-storage
