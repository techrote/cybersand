name: DRIV3R fleet training FT-002 same-clock four-resident CPU qualification

on:
  push:
    branches: [research/570-fleet-training-throughput-001]
    paths:
      - .github/workflows/driv3r-fleet-training-ft001.yml
      - experiments/driv3r/fleet_training/request_quad.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driv3r-fleet-training-ft002
  cancel-in-progress: false

jobs:
  four-resident-optimizer:
    name: FT-002 four independent real CPU Adam game-policy residents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Immutable read-only game-policy trainer source
        uses: actions/checkout@v4
        with:
          repository: techrote/cybersand
          ref: 534cd8ffac6fbe33a714ae03a62c16045bf10259
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Fail-closed source/lease and CPU pulse tests
        run: python -m unittest discover -s experiments/driv3r/fleet_training -p 'test_*.py' -v
      - name: Run 1 vs 2 vs 4 real training process epochs on one ordinary CPU runner
        run: |
          python experiments/driv3r/fleet_training/four_resident.py \
            --request experiments/driv3r/fleet_training/request_quad.json \
            --upstream upstream \
            --output "${RUNNER_TEMP}/ft002-four-resident"
      - name: Preserve trained original model checkpoints, four PID pulse evidence, negative outcomes and gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft002-four-resident-${{ github.run_id }}
          path: ${{ runner.temp }}/ft002-four-resident/
          if-no-files-found: warn
          retention-days: 14
