name: DRIV3R population soft ordinal memory (P16)
on:
  push:
    branches:
      - research/570-population-game-policy-001
    paths:
      - 'experiments/driv3r/training/population/population_p16.py'
      - 'experiments/driv3r/training/population/test_population_p16.py'
      - 'experiments/driv3r/training/population/p16_replay_audit.py'
      - 'experiments/driv3r/training/population/P16_REPORT.md'
      - '.github/workflows/driv3r-population-soft-ordinal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p16-cpu-research:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only research dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Guardrails for order-sensitive host-menu policies
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest discover -s experiments/driv3r/training/population -p test_population_p16.py -v
      - name: Train eight independently seeded CPU populations
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          mkdir -p /tmp/population-p16-evidence/source
          git rev-parse HEAD > /tmp/population-p16-evidence/source/exact-head.txt
          python --version > /tmp/population-p16-evidence/source/python-version.txt 2>&1
          python -m pip freeze > /tmp/population-p16-evidence/source/pip-freeze.txt
          python experiments/driv3r/training/population/population_p16.py \
            --output /tmp/population-p16-evidence/training \
            --seeds 664 665 666 667 668 669 670 671 \
            --train-worlds 4 --validation-worlds 2 --heldout-worlds 2 \
            --epochs 12 > /tmp/population-p16-evidence/stdout.json
          (cd /tmp/population-p16-evidence/training && sha256sum -c manifest.sha256)
          for c in /tmp/population-p16-evidence/training/cohort_*/; do
            (cd "$c" && sha256sum -c manifest.sha256)
          done
      - name: Independently replay checkpoints and audit protected cells
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python experiments/driv3r/training/population/p16_replay_audit.py \
            /tmp/population-p16-evidence/training \
            /tmp/population-p16-evidence/replay.json
      - name: Archive exact source, dependencies and failure evidence
        if: always()
        run: |
          mkdir -p /tmp/population-p16-evidence/source
          for f in population_lab.py population_p1.py population_p10.py population_p11.py population_p12.py population_p13.py population_p14.py population_p15.py population_p16.py test_population_p16.py p16_replay_audit.py P16_REPORT.md; do
            cp "experiments/driv3r/training/population/$f" /tmp/population-p16-evidence/source/ || true
          done
          (cd /tmp/population-p16-evidence && find . -type f ! -name OVERALL.sha256 -print0 | sort -z | xargs -0 sha256sum > OVERALL.sha256)
          (cd /tmp/population-p16-evidence && sha256sum -c OVERALL.sha256)
      - name: Upload immutable source-matched P16 weights, trajectories and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-p16-soft-ordinal-${{ github.sha }}
          path: /tmp/population-p16-evidence/
          if-no-files-found: warn
          retention-days: 90
