name: Exact-byte Windows evaluation transport

on:
  push:
    branches: [codex/mat-workbench-evaluation-transport-20261113]
    paths: [.github/workflows/mat-workbench-evaluation-transport.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mat-workbench-evaluation-transport-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  transport:
    name: Preserve and transport the original qualified artifact bytes
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/mat-workbench-evaluation-transport-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out only the exact transport apparatus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Verify the original artifact and split its unchanged outer ZIP
        env:
          CYBERSAND_TRANSPORT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.parse, urllib.request, zipfile

          REPO = 'techrote/cybersand'
          SOURCE = 'fd1d66b18ac80f564f7078b8a0a902297895672f'
          SOURCE_TREE = 'ab10a4880d81d0875f4a4b120df40f2adcb572d9'
          PUBLICATION = '266d43a33e9eefc3e93a9dce1aaab6e5267492b8'
          RUN = 43409148541
          PACKAGE_JOB = 131855780146
          ARTIFACT = 14034308666
          OUTER_SIZE = 719116673
          OUTER_SHA256 = '37cec79cf55c0c6519cf316316d775205f6dd994078aea4e39499427256b577f'
          NAME = 'mat-workbench-windows-evaluation-' + SOURCE + '-' + str(RUN) + '-1'
          INNER = 'CyberSand-MAT-Workbench-Windows-' + SOURCE[:12] + '.zip'
          CHUNK_BYTES = 256 * 1024 * 1024
          API = 'https://api.github.com/repos/' + REPO
          headers = {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                     'Authorization': 'Bearer ' + os.environ['CYBERSAND_TRANSPORT_TOKEN'],
                     'User-Agent': 'cybersand-exact-byte-artifact-transport'}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          class HttpsRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  if urllib.parse.urlsplit(newurl).scheme != 'https':
                      raise RuntimeError('Refuse a non-HTTPS artifact redirect')
                  result = super().redirect_request(req, fp, code, msg, response_headers, newurl)
                  if result is not None:
                      result.remove_header('Authorization')
                  return result

          api_opener = urllib.request.build_opener(NoRedirect())

          def api(path):
              with api_opener.open(urllib.request.Request(API + path, headers=headers), timeout=60) as response:
                  return json.load(response)

          def sha(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()

          artifact = api('/actions/artifacts/' + str(ARTIFACT))
          assert artifact['id'] == ARTIFACT and artifact['name'] == NAME and artifact['expired'] is False
          assert artifact['size_in_bytes'] == OUTER_SIZE and artifact['digest'] == 'sha256:' + OUTER_SHA256
          assert artifact['workflow_run']['id'] == RUN and artifact['workflow_run']['head_sha'] == SOURCE
          original_run = api('/actions/runs/' + str(RUN))
          assert original_run['head_sha'] == SOURCE and original_run['event'] == 'push' and original_run['run_attempt'] == 1
          assert original_run['repository']['full_name'] == REPO
          job = api('/actions/jobs/' + str(PACKAGE_JOB))
          assert job['run_id'] == RUN and job['head_sha'] == SOURCE and job['status'] == 'completed' and job['conclusion'] == 'success'
          source = api('/commits/' + SOURCE)
          assert source['commit']['tree']['sha'] == SOURCE_TREE
          publication = api('/commits/' + PUBLICATION)
          assert [parent['sha'] for parent in publication['parents']] == [SOURCE]
          assert {entry['filename'] for entry in publication['files']} == {
              'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll',
              'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so',
              'godot/addons/cybersand_native/runtime-provenance.json',
              'godot/addons/cybersand_native/runtime-provenance.linux.json'}

          original = pathlib.Path(os.environ['RUNNER_TEMP']) / 'original-evaluation-artifact.zip'
          out = pathlib.Path('build/evaluation-transport')
          out.mkdir(parents=True, exist_ok=False)
          try:
              response = api_opener.open(urllib.request.Request(API + '/actions/artifacts/' + str(ARTIFACT) + '/zip', headers=headers), timeout=60)
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308):
                  raise RuntimeError('Artifact API returned HTTP ' + str(error.code)) from None
              location = error.headers.get('Location', '')
              address = urllib.parse.urlsplit(location)
              assert address.scheme == 'https' and address.hostname and not address.username and not address.password
              # A new request has no API authorization; signed-host redirects also strip it.
              unsigned = urllib.request.Request(location, headers={'User-Agent': headers['User-Agent']})
              response = urllib.request.build_opener(HttpsRedirect()).open(unsigned, timeout=120)
          with response, original.open('xb') as target:
              total = 0
              while block := response.read(1024 * 1024):
                  total += len(block)
                  assert total <= OUTER_SIZE
                  target.write(block)
          assert original.stat().st_size == OUTER_SIZE and sha(original) == OUTER_SHA256

          with zipfile.ZipFile(original) as archive:
              assert len(archive.namelist()) == 2 and set(archive.namelist()) == {INNER, INNER + '.sha256'}
              with archive.open(INNER) as stream:
                  inner_sha256 = hashlib.file_digest(stream, 'sha256').hexdigest()
              sidecar = archive.read(INNER + '.sha256')
              expected_sidecar = (inner_sha256 + '  ' + INNER).encode('ascii')
              assert sidecar in (expected_sidecar + b'\n', expected_sidecar + b'\r\n')
              sidecar_newline = 'CRLF' if sidecar.endswith(b'\r\n') else 'LF'
              inner_size = archive.getinfo(INNER).file_size

          parts = []
          with original.open('rb') as stream:
              while block := stream.read(CHUNK_BYTES):
                  index = len(parts)
                  name = 'original-evaluation-artifact.zip.part-' + str(index)
                  path = out / name
                  path.write_bytes(block)
                  parts.append({'index': index, 'name': name, 'offset': index * CHUNK_BYTES,
                                'size': len(block), 'sha256': sha(path)})
          assert len(parts) == 3 and sum(part['size'] for part in parts) == OUTER_SIZE
          reconstructed = hashlib.sha256()
          for part in parts:
              with (out / part['name']).open('rb') as stream:
                  while block := stream.read(1024 * 1024):
                      reconstructed.update(block)
          assert reconstructed.hexdigest() == OUTER_SHA256
          ledger = {'schema': 'cybersand-exact-byte-artifact-transport-v1',
                    'scope': 'Transport only; original ZIP bytes unchanged; no rebuild, repackaging or new qualification',
                    'repository': REPO, 'artifact_id': ARTIFACT, 'artifact_name': NAME,
                    'original_run_id': RUN, 'original_run_attempt': 1, 'source_commit': SOURCE,
                    'source_tree': SOURCE_TREE, 'publication_commit': PUBLICATION,
                    'original_outer_size': OUTER_SIZE, 'original_outer_sha256': OUTER_SHA256,
                    'inner_name': INNER, 'inner_size': inner_size, 'inner_sha256': inner_sha256,
                    'sidecar_sha256': hashlib.sha256(sidecar).hexdigest(),
                    'sidecar_newline': sidecar_newline, 'parts': parts,
                    'transport_commit': os.environ['GITHUB_SHA'],
                    'transport_run_id': os.environ['GITHUB_RUN_ID'],
                    'transport_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          (out / 'transport-ledger.json').write_text(json.dumps(ledger, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(ledger, sort_keys=True))
          PY

      - name: Retain original-byte identities before transferring parts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-transport-r6-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/evaluation-transport/transport-ledger.json
          if-no-files-found: error
          retention-days: 90

      - name: Transfer original byte range 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-transport-r6-part-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/evaluation-transport/original-evaluation-artifact.zip.part-0
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Transfer original byte range 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-transport-r6-part-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/evaluation-transport/original-evaluation-artifact.zip.part-1
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Transfer original byte range 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-transport-r6-part-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/evaluation-transport/original-evaluation-artifact.zip.part-2
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
