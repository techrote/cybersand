name: QL-015 budget-aware STOP Q4 Q2 Q1 repairs (research)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql015_budget_stop.py'
      - '.github/workflows/driv3r-quant-lab-ql015.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql015-budget-stop
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  ql015-budget-stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Retrieve source-pinned immutable QL-003 Q1 and Q4 models
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Retrieve exact-HEAD QL-014 trained Q4 checkpoint and negative evidence
        uses: actions/download-artifact@v4
        with:
          name: ql014-frontier-bitpack-qat-exact-head
          run-id: 43913182449
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql014-source
      - name: Verify host and budget stages and genuine Q1 Q2 Q4 bitpacking
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql015_budget_stop.py --self-test
      - name: Fit independent 64-step FP32 and 48-step Q4 Q2 Q1 STOP repairs and rollouts
        run: |
          python experiments/driv3r/quant_lab/ql015_budget_stop.py --parent ql003-source --ql014 ql014-source --out ql015-out --fp-steps 64 --qat-steps 48
      - name: Independently audit exact HEAD checkpoints packed models and legal trajectories
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import numpy as np
          import torch
          p=Path('ql015-out')
          r=json.loads((p/'results.json').read_text())
          sha=os.environ['QL_SOURCE_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          assert r['source_sha']==sha
          assert r['parent_source_sha']=='9b4103c48127e5c8538403e2a4d9e2525fbe8755'
          assert r['ql014_source_sha']=='eed1514a5b2c93b7a22838134ed40a56a63ee100'
          assert r['parent_manifest_entries']>=330 and r['ql014_manifest_entries']>=225
          assert r['heldout_n']==4352 and r['optimizer_updates']==208
          assert min(r['train_budget_stage_counts'])>0
          assert min(r['held_budget_stage_counts'])>0
          assert len(r['variants'])==7
          assert r['original_png_n']==252 and r['first_pass_trajectories']==252
          for name,bits,updates in (('budget-fp32',32,64),('budget-qat-q4',4,48),
                                     ('budget-qat-q2',2,48),('budget-qat-q1',1,48)):
              ck=torch.load(p/'models'/(name+'-optimizer.pt'),
                            map_location='cpu',weights_only=False)
              assert ck['source_sha']==sha and ck['ql014_source_sha']==r['ql014_source_sha']
              assert ck['ql014_checkpoint_sha256']==r['ql014_checkpoint_sha256']
              assert ck['bits']==bits and ck['updates']==updates
              assert ck['table_fp32'].shape==(3,2)
              assert len(ck['trace'])==updates and len(ck['optimizer']['state'])==1
              assert bool(torch.count_nonzero(next(iter(ck['optimizer']['state'].values()))['exp_avg']))
              assert torch.isfinite(ck['table_fp32']).all()
              if bits!=32:
                  z=np.load(p/'models'/(name+'-packed.npz'))
                  assert int(z['bits'])==bits
                  assert len(z['packed'])==(6*bits+7)//8
                  assert z['scales'].shape==(3,)
                  assert ck['packed_payload']['bytes']==len(z['packed'])+12
                  assert np.array_equal(ck['packed_payload']['packed'],z['packed'])
                  assert np.array_equal(ck['packed_payload']['scales'],z['scales'])
          raw=json.loads((p/'raw_decisions.json').read_text())
          assert len(raw)==252 and len({(x['policy'],x['seed'],x['family'],x['override_rate']) for x in raw})==252
          assert all(x['first_pass'] and all(
             s['chosen'] in s['legal'] and 'STOP' in s['legal']
             for s in x['steps']) for x in raw)
          count=sum(len(x['steps']) for x in raw)
          assert count>2000
          for name,v in r['variants'].items():
              assert v['heldout']['host_masked_legal']==4352
              assert v['host_random_10pct']['n_episodes']==18
              assert v['no_random_diagnostic']['n_episodes']==18
              assert v['no_random_diagnostic']['total_host_overrides']==0
              groups=v['budget_conditional']
              assert sum(groups[g]['n'] for g in ('early','later','terminal'))==4352
              assert all(groups[g]['host_masked_legal']==groups[g]['n'] for g in groups)
          assert hashlib.sha256((p/'raw_decisions.json').read_bytes()).hexdigest()==r['raw_decisions_sha256']
          manifest=json.loads((p/'MANIFEST.json').read_text())
          assert len({e['path'] for e in manifest})==len(manifest)
          for e in manifest:
              b=(p/e['path']).read_bytes()
              assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']
          assert len(list((p/'gallery').glob('*.png')))==252
          print('QL015 EXACT HEAD PASS',sha,'legal actions',count,'manifest',len(manifest),'PNG',r['original_png_n'])
          PY
      - name: Preserve optimizer states bitpacked models diagnostics raw decisions and first-pass PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql015-budget-conditioned-stop-exact-head
          path: ql015-out/
          retention-days: 21
          if-no-files-found: warn
