name: GEN006 native service failure and owner-retention negative control

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/experiments/gen006_surface_owner_crash_acceptance.py'
      - '.github/workflows/gen006-service-owner-containment.yml'
      - 'native/tests/gen006_streaming_slice.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen006-owner-negative-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actual-native-linux:
    name: Ubuntu 24.04 / real native owner-crash control
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Source and scope receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gen006-owner-containment
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            git hash-object native/src/world.cpp
            git hash-object native/tests/gen006_streaming_slice.cpp
            git hash-object tools/experiments/gen006_surface_owner_crash_acceptance.py
          } > build/gen006-owner-containment/source.txt
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile tools/experiments/gen006_surface_owner_crash_acceptance.py
      - name: Compile real native World and execute process-loss contrast
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          g++-13 --version | head -1 > build/gen006-owner-containment/compiler.txt
          g++-13 -std=c++20 -O0 -g0 -pthread -I native/include \
            native/src/world.cpp native/src/material_rules.cpp \
            native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp \
            native/src/world_generation.cpp native/src/generation_fields.cpp \
            native/src/generation_typed_fields.cpp native/src/generation_spatial.cpp \
            native/src/generation_grammar.cpp native/src/generation_planes.cpp \
            native/tests/gen006_streaming_slice.cpp \
            -o build/gen006-owner-containment/streaming-slice \
            > build/gen006-owner-containment/compile.log 2>&1 \
            || { cat build/gen006-owner-containment/compile.log; exit 1; }
          python3 tools/experiments/gen006_surface_owner_crash_acceptance.py \
            --exe build/gen006-owner-containment/streaming-slice \
            --root build/gen006-owner-containment/native-root \
            --logs build/gen006-owner-containment/process-logs \
            | tee build/gen006-owner-containment/acceptance.log
          grep -q GEN006_REAL_OWNER_FAILURE_NEGATIVE_CONFIRMED build/gen006-owner-containment/acceptance.log
      - name: Preserve all actual process artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen006-owner-negative-linux-${{ github.run_id }}
          path: build/gen006-owner-containment/
          retention-days: 45
          if-no-files-found: warn

  actual-native-windows:
    name: Windows Server 2022 / real native owner-crash control
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Preserve LF checkout
        shell: cmd
        run: |
          git config --global core.autocrlf false
          if errorlevel 1 exit /b 1
          git config --global core.eol lf
          if errorlevel 1 exit /b 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Source receipt and Python syntax
        shell: python
        run: |
          import pathlib, subprocess, sys
          out = pathlib.Path("build/gen006-owner-containment")
          out.mkdir(parents=True, exist_ok=True)
          with (out / "source.txt").open("w") as f:
            for args in [
              ["rev-parse", "HEAD"], ["rev-parse", "HEAD^{tree}"],
              ["hash-object", "native/src/world.cpp"],
              ["hash-object", "native/tests/gen006_streaming_slice.cpp"],
              ["hash-object", "tools/experiments/gen006_surface_owner_crash_acceptance.py"],
            ]:
              f.write(subprocess.check_output(["git", *args], text=True).strip() + "\n")
          subprocess.run([sys.executable, "tools/ci/check_ci_provider_policy.py"], check=True)
          subprocess.run([sys.executable, "-m", "py_compile",
            "tools/experiments/gen006_surface_owner_crash_acceptance.py"], check=True)
      - name: Compile native owner, execute real Windows process failure
        shell: cmd
        timeout-minutes: 30
        run: |
          for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "GEN006_VSROOT=%%i"
          if not defined GEN006_VSROOT exit /b 1
          call "%GEN006_VSROOT%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          set "GEN006_CXX=%ProgramFiles%\LLVM\bin\clang++.exe"
          if not exist "%GEN006_CXX%" set "GEN006_CXX=%GEN006_VSROOT%\VC\Tools\Llvm\x64\bin\clang++.exe"
          if not exist "%GEN006_CXX%" exit /b 1
          "%GEN006_CXX%" --version > build\gen006-owner-containment\compiler.txt 2>&1
          if errorlevel 1 exit /b 1
          "%GEN006_CXX%" -std=c++20 -O0 -I native/include native/src/world.cpp native/src/material_rules.cpp native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp native/src/world_generation.cpp native/src/generation_fields.cpp native/src/generation_typed_fields.cpp native/src/generation_spatial.cpp native/src/generation_grammar.cpp native/src/generation_planes.cpp native/tests/gen006_streaming_slice.cpp -o build\gen006-owner-containment\streaming-slice.exe > build\gen006-owner-containment\compile.log 2>&1
          if errorlevel 1 (type build\gen006-owner-containment\compile.log & exit /b 1)
          python tools\experiments\gen006_surface_owner_crash_acceptance.py --exe build\gen006-owner-containment\streaming-slice.exe --root build\gen006-owner-containment\native-root --logs build\gen006-owner-containment\process-logs > build\gen006-owner-containment\acceptance.log 2>&1
          if errorlevel 1 (type build\gen006-owner-containment\acceptance.log & exit /b 1)
          type build\gen006-owner-containment\acceptance.log
          findstr /C:"GEN006_REAL_OWNER_FAILURE_NEGATIVE_CONFIRMED" build\gen006-owner-containment\acceptance.log
          if errorlevel 1 exit /b 1
      - name: Preserve all actual process artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen006-owner-negative-windows-${{ github.run_id }}
          path: build/gen006-owner-containment/
          retention-days: 45
          if-no-files-found: warn
