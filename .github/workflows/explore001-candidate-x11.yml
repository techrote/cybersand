name: EXPLORE-001 standalone Linux X11 original workbench differential
on:
  push:
    branches: [feat/explore001-gen007-playable-workbench]
    paths: ['.github/workflows/explore001-candidate-x11.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: explore001-candidate-x11-${{ github.run_id }}
  cancel-in-progress: false
env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_URL: 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  RAPIER_SHA256: 566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a
jobs:
  source-matched-standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out current branch without changing main or other owners
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Attest source, Rapier and pinned toolchain inputs
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-head.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          git rev-parse HEAD:godot/scripts/shared_workbench.gd > evidence/workbench-source-blob.txt
          git rev-parse HEAD:godot/tests/test_workbench_canvas.gd > evidence/fixture-blob.txt
          python3 tools/ci/check_ci_provider_policy.py > evidence/provider.json
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          printf '%s  %s\n' "$RAPIER_SHA256" godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so | sha256sum -c --strict
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/pip-build.log 2>&1
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__=="4.10.1"'
          mkdir -p "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 900 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT" > evidence/godot-cpp-fetch.log 2>&1
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
      - name: Build the current exact-source native library
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/explore001-candidate.so
        run: |
          set -euo pipefail
          if ! timeout 3600 bash tools/build_pinned_godot_cpp.sh linux > evidence/build-cpp.log 2>&1; then tail -100 evidence/build-cpp.log; exit 1; fi
          if ! timeout 3600 bash tools/build_native_extension.sh > evidence/build-native.log 2>&1; then tail -160 evidence/build-native.log; exit 1; fi
          sha256sum "$CYBERSAND_NATIVE_OUTPUT" > evidence/binary.sha256
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          bash tools/check_linux_runtime_floor.sh > evidence/abi-floor.log 2>&1
      - name: Install the pinned Godot engine
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-candidate-x11"
          timeout 900 curl -fL --retry 3 -o "$RUNNER_TEMP/godot-candidate-x11.zip" "$GODOT_URL" > evidence/download.log 2>&1
          printf '%s  %s\n' "$GODOT_SHA256" "$RUNNER_TEMP/godot-candidate-x11.zip" | sha256sum -c --strict
          unzip -q "$RUNNER_TEMP/godot-candidate-x11.zip" -d "$RUNNER_TEMP/godot-candidate-x11"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-candidate-x11" -maxdepth 1 -type f -name 'Godot*' | head -1)"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version > evidence/godot-version.txt
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          if ! timeout 1200 "$GODOT_BIN" --headless --path godot --editor --quit > evidence/import.log 2>&1; then tail -120 evidence/import.log; exit 1; fi
      - name: Exercise the exact unchanged legacy fixture FIRST under X11 before any generated-map process
        run: |
          set -euo pipefail
          bash tools/ci/prepare_linux_display.sh > evidence/display.log 2>&1
          export LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 GALLIVM_PERF=nopt
          set +e
          /usr/bin/time -v -o evidence/x11-resources.txt timeout 420 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' "$GODOT_BIN" --path godot --script res://tests/test_workbench_canvas.gd > evidence/candidate-x11-workbench.log 2>&1
          code=$?
          set -e
          printf '%d\n' "$code" > evidence/x11-exit-code.txt
          tail -100 evidence/candidate-x11-workbench.log
          if test "$code" -ne 0; then echo "CANDIDATE_STANDALONE_X11_RED exit=$code"; exit 1; fi
          grep -E '^WORKBENCH_CANVAS [1-9][0-9]* checks, 0 failures$' evidence/candidate-x11-workbench.log
          echo 'CANDIDATE_STANDALONE_X11_PASS'
      - name: Run the same unchanged fixture under accepted-main headless mode for causal comparison
        run: |
          set -euo pipefail
          if ! timeout 500 "$GODOT_BIN" --headless --path godot --script res://tests/test_workbench_canvas.gd > evidence/candidate-headless-workbench.log 2>&1; then
            tail -120 evidence/candidate-headless-workbench.log; exit 1
          fi
          grep -E '^WORKBENCH_CANVAS [1-9][0-9]* checks, 0 failures$' evidence/candidate-headless-workbench.log
          echo 'CANDIDATE_HEADLESS_PASS'
      - name: Retain source hashes, native logs, exact test outputs, first refusals and performance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explore001-candidate-standalone-x11-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
