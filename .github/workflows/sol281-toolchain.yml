name: SOL281 pinned Godot toolchain preparation
on:
  push:
    branches: [work/sol281-native-detachment-20261027]
    paths: ['.github/workflows/sol281-toolchain.yml']
permissions:
  contents: read
concurrency:
  group: sol281-toolchain
  cancel-in-progress: false
jobs:
  dependencies:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/work/sol281-native-detachment-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
      GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare pinned engine and binding source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/check_ci_provider_policy.py
          mkdir -p build/sol281-toolchain
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
          curl --fail --location --retry 3 --output build/sol281-toolchain/godot-linux.zip 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
          echo "$GODOT_SHA256  build/sol281-toolchain/godot-linux.zip" | sha256sum --check --strict
      - name: Build source-pinned Linux bindings
        shell: bash
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '4'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
        run: |
          set -euo pipefail
          timeout 30m tools/build_pinned_godot_cpp.sh linux 2>&1 | tee build/sol281-toolchain/build.txt
          git -C "$GODOT_CPP_ROOT" status --porcelain=v1 --untracked-files=no
          tar --exclude='*.o' --exclude='*.os' -czf build/sol281-toolchain/godot-cpp.tar.gz -C "$RUNNER_TEMP" godot-cpp
          sha256sum "$GODOT_CPP_ROOT/bin/libgodot-cpp.linux.template_debug.x86_64.a" > build/sol281-toolchain/binding.sha256
          g++-13 --version > build/sol281-toolchain/compiler.txt
          git rev-parse HEAD > build/sol281-toolchain/workflow-source.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sol281-pinned-toolchain-${{ github.run_id }}
          path: build/sol281-toolchain/
          if-no-files-found: error
          retention-days: 7
