name: SPROCKET WORM-001 W19 single-cell material counterfactual training
on:
  push:
    branches: [codex/agent-painter-sprocket-568]
    paths: [experiments/agent_painter/lanes/sprocket/worm-request-v19.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: sprocket-worm-v19-${{ github.sha }}
  cancel-in-progress: false
jobs:
  experiment:
    name: W19 320 real CPU updates, one-cell contrast and 72 original heldout paintings
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ATEN_CPU_CAPABILITY: default
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact source, owner gate, and unique single-optimizer lease
        run: |
          set -euo pipefail
          mkdir -p evidence/w19
          python3 - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          r=json.loads(Path('experiments/agent_painter/lanes/sprocket/worm-request-v19.json').read_text())
          assert r['schema']=='cybersand.worm.sprocket-material-one-cell-contrast/19'
          assert r['root']=='kandivault/sprocket-500m' and r['revision']=='eb157d4ddddc4619e661d4a2426bb2dd000fc668'
          assert r['eos']==5 and r['real_aux_adamw_steps']==320
          assert r['training_vms']==r['optimizers_per_vm']==1
          assert r['root_forwards']==r['root_optimizer_steps']==r['lora_steps']==0
          assert r['draft_hold'] and not r['native'] and not r['sealed_final_opened']
          assert os.environ['GITHUB_REF']=='refs/heads/codex/agent-painter-sprocket-568'
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha==os.environ['GITHUB_SHA']
          Path('evidence/w19/lease.json').write_text(json.dumps({
            'source_sha':sha,'run':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'one_optimizer':True,'request':r},indent=2)+'\n')
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/worm_train_v18.py experiments/agent_painter/lanes/sprocket/worm_train_v19.py
          python3 experiments/agent_painter/lanes/sprocket/worm_train_v19.py --smoke-only
      - name: SHA-admit original W18 and W17 complete model/optimizer/RNG checkpoint artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w18" "$RUNNER_TEMP/w17"
          gh run download 43884643572 --repo techrote/cybersand --name sprocket-worm-v18-54661502bdde623622e544c8614b064f331c640d --dir "$RUNNER_TEMP/w18"
          gh run download 43871037458 --repo techrote/cybersand --name sprocket-worm-v17-4536980993be7af5052b1c78dad5adb74e865855 --dir "$RUNNER_TEMP/w17"
          echo '13189f3e71b0db9d6d0cb961221e649cf7d2e868ed0c66eb18a93d8378fd015b  '"$RUNNER_TEMP/w18/campaign/material-replay-plus-last-layer.pt" | sha256sum -c -
          echo '3d0fe44f303851db6f34f489eb17ff2b1f6dc5a5cfe569b0637716306594aec3  '"$RUNNER_TEMP/w17/campaign/closed-loop-history-retention.pt" | sha256sum -c -
          cp "$RUNNER_TEMP/w18/campaign/summary.json" evidence/w19/original-W18-summary.json
      - name: Retrieve SHA-pinned original read-only W0 host and validate identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w0"
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/w0/worm.py"
          echo '81c3923cb38d7f196b99986806216388c34ebc27fd4976e168b3b370c25a323e  '"$RUNNER_TEMP/w0/worm.py" | sha256sum -c -
          cp "$RUNNER_TEMP/w0/worm.py" evidence/w19/original-W0.py
      - name: Install pinned CPU-only single-thread torch
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/w19-venv"
          "$RUNNER_TEMP/w19-venv/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/w19-venv/bin/python" -m pip check
          "$RUNNER_TEMP/w19-venv/bin/python" -m pip freeze --all > evidence/w19/environment.txt
      - name: Run genuine two-wave optimizer and original 128-decision material galleries
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1800s "$RUNNER_TEMP/w19-venv/bin/python" experiments/agent_painter/lanes/sprocket/worm_train_v19.py --w18 "$RUNNER_TEMP/w18/campaign/material-replay-plus-last-layer.pt" --w17 "$RUNNER_TEMP/w17/campaign/closed-loop-history-retention.pt" --w0 "$RUNNER_TEMP/w0/worm.py" --output evidence/w19/campaign
      - name: Preserve immutable hashes even on partial model failure
        if: always()
        run: |
          set -euo pipefail
          (cd evidence/w19 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > evidence/w19/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-worm-v19-${{ github.sha }}
          path: evidence/w19/
          if-no-files-found: warn
          retention-days: 90
