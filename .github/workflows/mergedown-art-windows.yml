name: Art Architecture mergedown Windows integration
on:
  push:
    branches: ['art/collaborative-002']
    paths:
      - 'tools/fixtures/mergedown-art-windows-request.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mergedown-art-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  admission-runtime:
    name: Admit frozen application and publish exact same-attempt runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source: ${{ steps.request.outputs.source_commit }}
    steps:
      - name: Preserve committed text bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          path: harness
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refuse application drift and read source registration
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admission"
          python harness/tools/ci/mergedown_art_qualification.py route --harness harness --request harness/tools/fixtures/mergedown-art-windows-request.json > "$RUNNER_TEMP/admission/route.json"
          python -c "import json; assert json.load(open('$RUNNER_TEMP/admission/route.json'))['recovery'] is True"
          python harness/tools/ci/mergedown_art_qualification.py read-request --request harness/tools/fixtures/mergedown-art-windows-request.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.request.outputs.source_commit }}
          path: product
      - name: Admit complete original plans and refusal controls
        shell: bash
        run: |
          set -euo pipefail
          python harness/tools/ci/test_mergedown_art_qualification.py > "$RUNNER_TEMP/admission/refusal-tests.log" 2>&1
          python harness/tools/ci/mergedown_art_qualification.py admit --request harness/tools/fixtures/mergedown-art-windows-request.json --product product --harness harness --output "$RUNNER_TEMP/admission/admission.json"
          python product/tools/ci/test_art_evaluator_packaging.py > "$RUNNER_TEMP/admission/retained-packaging-tests.log" 2>&1
          python product/tools/ci/test_art_collaborative_packaging.py > "$RUNNER_TEMP/admission/collaborative-packaging-tests.log" 2>&1
      - name: Stage exactly the committed Windows runtime once
        working-directory: product
        env:
          PRODUCT_SOURCE: ${{ steps.request.outputs.source_commit }}
        run: |
          set -euo pipefail
          git lfs install --local
          python tools/ci/lfs_runtime_artifact.py stage --root . --include godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --expected-source "$PRODUCT_SOURCE" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/art-runtime" --allowance-seconds 600
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/art-runtime/
          if-no-files-found: error
          compression-level: 0
      - name: Retain original admission and acquisition results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/admission/
            ${{ runner.temp }}/art-runtime/acquisition.json
          if-no-files-found: warn
  windows-admission:
    name: Windows source admission and storage
    needs: admission-runtime
    runs-on: windows-2022
    # Each admitted complete plan fits this boundary (currently 195–321 min),
    # including setup, original case watchdogs, owned cleanup and evidence.
    timeout-minutes: 360
    steps:
      - name: Preserve committed text bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          path: harness
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.admission-runtime.outputs.source }}
          path: product
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: art-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/art-runtime
      - name: Verify complete same-source same-attempt runtime transport
        working-directory: product
        shell: pwsh
        env:
          PRODUCT_SOURCE: ${{ needs.admission-runtime.outputs.source }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/infrastructure" | Out-Null
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'LFS filter setup failed' }
          python tools/ci/lfs_runtime_artifact.py install --root . --include godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --expected-source $env:PRODUCT_SOURCE --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --artifact "$env:RUNNER_TEMP/art-runtime" --output "$env:RUNNER_TEMP/infrastructure/runtime-install.json" --allowance-seconds 300
          if ($LASTEXITCODE -ne 0) { throw 'Source/run/attempt runtime admission refused' }
      - name: Authenticate the exact Godot archive with the source-owned helper
        working-directory: product
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot-win47.zip'
          curl.exe -fL --retry 3 --max-time 600 -o $zip 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot download failed' }
          python -c "import sys,os,json; from pathlib import Path; sys.path.insert(0,'tools/ci'); import run_windows_godot_regressions as w; p,r=w.prepare_godot(Path(os.environ['RUNNER_TEMP'])/'godot-win47.zip'); (Path(os.environ['RUNNER_TEMP'])/'infrastructure'/'engine.json').write_text(json.dumps(r,indent=2)); print('GODOT_EXE='+str(p))" >> $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot source admission refused' }
      - name: Execute the complete registered mode
        shell: pwsh
        env:
          QUALIFICATION_MODE: storage
        run: |
          python harness/tools/ci/mergedown_art_qualification.py execute --request harness/tools/fixtures/mergedown-art-windows-request.json --product product --harness harness --godot $env:GODOT_EXE --godot-archive "$env:RUNNER_TEMP/godot-win47.zip" --mode $env:QUALIFICATION_MODE --output "$env:RUNNER_TEMP/art-evidence/$env:QUALIFICATION_MODE"
          if ($LASTEXITCODE -ne 0) { throw 'Original Windows qualification failed; retain all evidence' }
      - name: Retain original complete or failed mode evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-mode-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/art-evidence/
          if-no-files-found: warn
      - name: Retain runtime and engine admission
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-infrastructure-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infrastructure/
          if-no-files-found: warn
  windows:
    name: Windows ${{ matrix.mode }}
    needs: [admission-runtime, windows-admission]
    runs-on: windows-2022
    # Each admitted complete plan fits this boundary (currently 195–321 min),
    # including setup, original case watchdogs, owned cleanup and evidence.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [retained-core-0, retained-core-1, retained-core-2, retained-headless, retained-displayed, integration-displayed, collaborative-headless, collaborative-displayed]
    steps:
      - name: Preserve committed text bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          path: harness
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.admission-runtime.outputs.source }}
          path: product
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: art-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/art-runtime
      - name: Verify complete same-source same-attempt runtime transport
        working-directory: product
        shell: pwsh
        env:
          PRODUCT_SOURCE: ${{ needs.admission-runtime.outputs.source }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/infrastructure" | Out-Null
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'LFS filter setup failed' }
          python tools/ci/lfs_runtime_artifact.py install --root . --include godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --expected-source $env:PRODUCT_SOURCE --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --artifact "$env:RUNNER_TEMP/art-runtime" --output "$env:RUNNER_TEMP/infrastructure/runtime-install.json" --allowance-seconds 300
          if ($LASTEXITCODE -ne 0) { throw 'Source/run/attempt runtime admission refused' }
      - name: Authenticate the exact Godot archive with the source-owned helper
        working-directory: product
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot-win47.zip'
          curl.exe -fL --retry 3 --max-time 600 -o $zip 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot download failed' }
          python -c "import sys,os,json; from pathlib import Path; sys.path.insert(0,'tools/ci'); import run_windows_godot_regressions as w; p,r=w.prepare_godot(Path(os.environ['RUNNER_TEMP'])/'godot-win47.zip'); (Path(os.environ['RUNNER_TEMP'])/'infrastructure'/'engine.json').write_text(json.dumps(r,indent=2)); print('GODOT_EXE='+str(p))" >> $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot source admission refused' }
      - name: Execute the complete registered mode
        shell: pwsh
        env:
          QUALIFICATION_MODE: ${{ matrix.mode }}
        run: |
          python harness/tools/ci/mergedown_art_qualification.py execute --request harness/tools/fixtures/mergedown-art-windows-request.json --product product --harness harness --godot $env:GODOT_EXE --godot-archive "$env:RUNNER_TEMP/godot-win47.zip" --mode $env:QUALIFICATION_MODE --output "$env:RUNNER_TEMP/art-evidence/$env:QUALIFICATION_MODE"
          if ($LASTEXITCODE -ne 0) { throw 'Original Windows qualification failed; retain all evidence' }
      - name: Retain original complete or failed mode evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-mode-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/art-evidence/
          if-no-files-found: warn
      - name: Retain runtime and engine admission
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-infrastructure-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infrastructure/
          if-no-files-found: warn
  package:
    name: Deliver and execute the combined ordinary Workbench evaluator
    needs: [admission-runtime, windows-admission, windows]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Preserve committed text bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          path: harness
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.admission-runtime.outputs.source }}
          path: product
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: art-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/art-runtime
      - name: Download all original same-attempt mode evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: art-mode-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/art-evidence
          merge-multiple: true
      - name: Verify runtime and every resulting-source mode
        shell: pwsh
        env:
          PRODUCT_SOURCE: ${{ needs.admission-runtime.outputs.source }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/package-evidence" | Out-Null
          git -C product lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'LFS filter setup failed' }
          python product/tools/ci/lfs_runtime_artifact.py install --root product --include godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --expected-source $env:PRODUCT_SOURCE --run-id $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT --artifact "$env:RUNNER_TEMP/art-runtime" --output "$env:RUNNER_TEMP/package-evidence/runtime-install.json" --allowance-seconds 300
          if ($LASTEXITCODE -ne 0) { throw 'Runtime admission refused' }
          python harness/tools/ci/mergedown_art_qualification.py reduce --request harness/tools/fixtures/mergedown-art-windows-request.json --product product --harness harness --evidence "$env:RUNNER_TEMP/art-evidence" --output "$env:RUNNER_TEMP/package-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Complete same-source Windows reduction refused' }
      - name: Authenticate exact Godot and redistribution notices
        working-directory: product
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot-win47.zip'
          curl.exe -fL --retry 3 --max-time 600 -o $zip 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot download failed' }
          python -c "import sys,os,json; from pathlib import Path; sys.path.insert(0,'tools/ci'); import run_windows_godot_regressions as w; p,r=w.prepare_godot(Path(os.environ['RUNNER_TEMP'])/'godot-win47.zip'); (Path(os.environ['RUNNER_TEMP'])/'package-evidence'/'engine.json').write_text(json.dumps(r,indent=2)); print('GODOT_EXE='+str(p))" >> $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { throw 'Pinned engine admission refused' }
          $notices = Join-Path $env:RUNNER_TEMP 'art-godot-notices'
          New-Item -ItemType Directory -Force $notices | Out-Null
          foreach ($name in @('LICENSE.txt','COPYRIGHT.txt')) {
            curl.exe -fL --retry 3 --max-time 180 -o (Join-Path $notices $name) "https://raw.githubusercontent.com/godotengine/godot/5b4e0cb0f/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot notices download failed' }
          }
          $runtimeLicense = Join-Path $notices 'Microsoft-Visual-C-Runtime-LICENSE.docx'
          $developerLicense = Join-Path $notices 'Microsoft-Visual-Studio-2022-LICENSE.docx'
          curl.exe -fL --retry 3 --max-time 180 -o $runtimeLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/09/Visual-C-Runtime-2015-2022-License-1.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft runtime licence download failed' }
          curl.exe -fL --retry 3 --max-time 180 -o $developerLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft VS redistribution licence download failed' }
          ./tools/ci/stage_windows_vc_runtime.ps1 -Output (Join-Path $env:RUNNER_TEMP 'art-vc-runtime') -License $runtimeLicense -DeveloperLicense $developerLicense
      - name: Build using the original source-owned package contract
        working-directory: product
        shell: pwsh
        run: |
          $engine = Join-Path (Split-Path $env:GODOT_EXE) 'Godot_v4.7-stable_win64.exe'
          python tools/package_art_collaborative.py build --engine $engine --engine-notices "$env:RUNNER_TEMP/art-godot-notices" --vc-runtime "$env:RUNNER_TEMP/art-vc-runtime" --qualification-source "$env:RUNNER_TEMP/package-evidence/application-qualification.json" --headless-receipt "$env:RUNNER_TEMP/art-evidence/collaborative-headless/collaborative/summary.json" --displayed-receipt "$env:RUNNER_TEMP/art-evidence/collaborative-displayed/collaborative/summary.json" --output build/art-architecture-integration-windows
          if ($LASTEXITCODE -ne 0) { throw 'Original collaborative builder refused' }
      - name: Seal combined qualification and create the archive
        shell: pwsh
        run: |
          python harness/tools/ci/mergedown_art_qualification.py seal-package --request harness/tools/fixtures/mergedown-art-windows-request.json --product product --harness harness --evidence "$env:RUNNER_TEMP/package-evidence" --output product/build/art-architecture-integration-windows
          if ($LASTEXITCODE -ne 0) { throw 'Combined package qualification refused' }
          python product/tools/package_art_collaborative.py zip --output product/build/art-architecture-integration-windows
          if ($LASTEXITCODE -ne 0) { throw 'Immutable package ZIP refused' }
      - name: Execute delivered CMD from pristine extracted path containing spaces
        working-directory: product
        shell: pwsh
        run: |
          $installationRoot = Join-Path $env:RUNNER_TEMP 'Art Architecture Fresh Installation'
          Expand-Archive -Path build/art-architecture-integration-windows.zip -DestinationPath $installationRoot
          $package = Join-Path $installationRoot 'art-architecture-integration-windows'
          $evidence = Join-Path $env:RUNNER_TEMP 'package-evidence/installed-evaluator'
          python tools/package_art_collaborative.py smoke --output $package --evidence $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Actual delivered launcher failed' }
          ./tools/ci/check_windows_package_modules.ps1 -Package $package -Evidence (Join-Path $evidence 'runtime-modules.json')
          python tools/package_art_collaborative.py verify --output $package
          if ($LASTEXITCODE -ne 0) { throw 'Extracted payload changed' }
      - name: Read back every original archive member and digest
        shell: pwsh
        run: |
          python harness/tools/ci/mergedown_art_qualification.py archive-readback --request harness/tools/fixtures/mergedown-art-windows-request.json --product product --harness harness --output product/build/art-architecture-integration-windows --evidence "$env:RUNNER_TEMP/package-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Archive identity admission failed' }
      - name: Retain qualified combined Draft HOLD evaluator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-architecture-integration-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            product/build/art-architecture-integration-windows.zip
            product/build/art-architecture-integration-windows.zip.sha256
            ${{ runner.temp }}/package-evidence/delivered-archive.json
          if-no-files-found: error
          compression-level: 0
      - name: Retain original package and installed execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-package-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-evidence/
          if-no-files-found: warn
