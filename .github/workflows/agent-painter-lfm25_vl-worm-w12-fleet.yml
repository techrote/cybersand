name: LFM2.5-VL WORM W12 real four-worm 2x2 matrix resident inference
on:
  push:
    branches: [codex/agent-painter-lfm25-vl-568]
    paths:
      - experiments/agent_painter/lanes/lfm25_vl/worm-w12-fleet-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: lfm25-vl-worm-w12-four-model-two-vm-fleet-v1
  cancel-in-progress: false

jobs:
  resident-fleet:
    name: Real full-VL W10 fleet shard ${{ matrix.shard }} (2 resident models)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [alpha, beta]
    timeout-minutes: 46
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout exact immutable evaluator source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout pinned W0 host
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          path: worm-w0
          persist-credentials: false
      - name: Checkout pinned LFM support curriculum
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: cc27b3206cb61f98432fa95b799c9b9ff508c2bc
          path: worm-support
          persist-credentials: false
      - name: Model-free preflight source and lease checking
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C worm-w0 rev-parse HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git hash-object worm-w0/experiments/agent_painter/worm/common/worm.py)" = 8979b6f0296e81051194bacc907992d38e006605
          test "$(git -C worm-support rev-parse HEAD)" = cc27b3206cb61f98432fa95b799c9b9ff508c2bc
          test "$(git hash-object worm-support/experiments/agent_painter/worm/support_lfm/curriculum.py)" = f205a3a9f33632aeaafa2daa8ce25b2484bc6032
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("experiments/agent_painter/lanes/lfm25_vl/worm-w12-fleet-request.json").read_text())
          assert r == {
            "schema":"cybersand.worm.lfm-w12-resident-fleet/1",
            "purpose":"two-vms-two-pids-each-real-score-steering-W0-original-pngs",
            "producer_source":"1e57a4df8d344b209a14df886dd898211dcc4918",
            "producer_run":43754365984,
            "checkpoint":"checkpoint-000045",
            "model":"LiquidAI/LFM2.5-VL-450M",
            "model_revision":"fc6221ca597f3315e4f82fc2df606783267b34ba",
            "alpha":[{"seed":4311,"family":"greebles"},{"seed":4331,"family":"pipework"}],
            "beta":[{"seed":4351,"family":"architecture"},{"seed":4371,"family":"greebles"}],
            "real_decisions_per_model":12,
            "model_instances_per_vm":2,
            "target_independent_loaded_models":4,
            "hosted_inference_vm_count":2,
            "target_128_deferred":True,
            "new_optimizer_updates":0,
            "native_execution":False,
            "sealed_FINAL_opened":False,
            "Draft_HOLD":True,
            "attempt":1,
          }
          PY
          python3 -m py_compile experiments/agent_painter/lanes/lfm25_vl/worm_w11_resident_capacity_v1.py experiments/agent_painter/lanes/lfm25_vl/worm_w12_fleet_v1.py
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/lfm-w12-fleet-policy.json
          mkdir -p evidence/diagnostics
          git rev-parse HEAD > evidence/diagnostics/evaluator-source.txt
          git -C worm-w0 rev-parse HEAD > evidence/diagnostics/w0-source.txt
          git -C worm-support rev-parse HEAD > evidence/diagnostics/support-source.txt
          lscpu > evidence/diagnostics/cpu.txt
          free -h > evidence/diagnostics/memory.txt
      - name: Verify immutable actual W10 checkpoint source and download producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/techrote/cybersand/actions/runs/43754365984 --jq .head_sha)" = 1e57a4df8d344b209a14df886dd898211dcc4918
          test "$(gh api repos/techrote/cybersand/actions/runs/43754365984 --jq .conclusion)" = success
          mkdir -p evidence/prior
          gh run download 43754365984 -R techrote/cybersand --name lfm25-vl-worm-w10-paired-six-way-1e57a4df8d344b209a14df886dd898211dcc4918-43754365984-1 --dir evidence/prior
          test -f evidence/prior/worm-w10/checkpoint-000045/inventory.json
          test -f evidence/prior/worm-w10/optimizer-pairs.jsonl
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("evidence/prior/worm-w10")
          m=json.loads((root/"corpus-manifest.json").read_text())
          assert hashlib.sha256((root/"optimizer-pairs.jsonl").read_bytes()).hexdigest()==m["pair_sha256"]
          s=json.loads((root/"summary.json").read_text())
          assert s["status"]=="complete" and s["actual_optimizer_updates"]==45
          assert s["real_backward_passes"]==90
          assert s["source_sha"]=="1e57a4df8d344b209a14df886dd898211dcc4918"
          PY
      - name: Install qualified official full-VL CPU packages
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lfm-w12-fleet"
          "$RUNNER_TEMP/lfm-w12-fleet/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/lfm-w12-fleet/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/lfm-w12-fleet/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torchvision==0.29.2+cpu'
          "$RUNNER_TEMP/lfm-w12-fleet/bin/python" -m pip install -r experiments/agent_painter/training/requirements-lfm25_vl.lock
          "$RUNNER_TEMP/lfm-w12-fleet/bin/python" -m pip check
          "$RUNNER_TEMP/lfm-w12-fleet/bin/python" -m pip freeze --all > evidence/diagnostics/pip-freeze.txt
      - name: Download exact complete LiquidAI full multimodal weights and processor
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/lfm-w12-fleet/bin/python" experiments/agent_painter/training/download_model.py --profile lfm25_vl --output "$RUNNER_TEMP/lfm-w12-model"
          cp "$RUNNER_TEMP/lfm-w12-model/download_receipt.json" evidence/diagnostics/model-download.json
          LFM25_SNAPSHOT="$RUNNER_TEMP/lfm-w12-model" "$RUNNER_TEMP/lfm-w12-fleet/bin/python" experiments/agent_painter/lanes/lfm25_vl/test_adapter.py > evidence/diagnostics/adapter-tests.txt 2>&1
      - name: 'Four real model fleet: two independently loaded resident W10 models per VM'
        env:
          PYTHONPATH: experiments/agent_painter/lanes/lfm25_vl:experiments/agent_painter/training
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=50s 1400s "$RUNNER_TEMP/lfm-w12-fleet/bin/python" experiments/agent_painter/lanes/lfm25_vl/worm_w12_fleet_v1.py \
            --model "$RUNNER_TEMP/lfm-w12-model" \
            --worm-root worm-w0/experiments/agent_painter/worm/common \
            --support-root worm-support/experiments/agent_painter/worm/support_lfm \
            --producer-root evidence/prior/worm-w10 \
            --shard ${{ matrix.shard }} \
            --output evidence/w12-fleet/${{ matrix.shard }}
      - name: Retain original per-PID PNGs, partial/failure and CPU receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lfm25-vl-worm-w12-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/w12-fleet/
            evidence/diagnostics/
          if-no-files-found: warn
          retention-days: 90
