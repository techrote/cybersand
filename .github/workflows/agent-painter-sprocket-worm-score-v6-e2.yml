name: SPROCKET WORM-001 W6 E2 scored paired-family host-painted evaluation
on:
  push:
    branches:
      - codex/agent-painter-sprocket-568
    paths:
      - experiments/agent_painter/lanes/sprocket/worm-eval-request-v6-e2.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sprocket-worm-v6-e2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  eval-worm:
    name: Actual learned W6 W0 PNGs, host-flat ablation, three matched baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pinned W6 E2 zero-optimizer evaluation lease
        id: lease
        run: |
          set -euo pipefail
          mkdir -p evidence/worm-score-v6-e2
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          request=json.loads(Path('experiments/agent_painter/lanes/sprocket/worm-eval-request-v6-e2.json').read_text())
          expected=json.loads('''{"schema":"cybersand.worm.sprocket-eval-request/w6-e2","experiment":"sprocket-worm-w6-e2-paired-family-extended-new-seeds-live-vs-flat-stopsafe","training_source":"fbeece84ff2609e564bb43b7f40ecde1d80ef187","training_run_id":43743251862,"training_artifact":"sprocket-worm-v6-fbeece84ff2609e564bb43b7f40ecde1d80ef187","model":"kandivault/sprocket-500m","model_revision":"eb157d4ddddc4619e661d4a2426bb2dd000fc668","w0_git_commit":"4bb9d6e1d0d0d78183f87d1e3c29648edafacf61","checkpoint":"checkpoint-000024","steps":48,"temperature":2.25,"sampler":"v6-real-six-action-logits-host-legal-stop-before40-CRN-flat-ablation","keep_draft":true,"native":false,"sealed_final_forbidden":true}''')
          if request!=expected: raise SystemExit('immutable W6 E2 request contract changed')
          if os.environ['GITHUB_REF']!='refs/heads/codex/agent-painter-sprocket-568':
              raise SystemExit('non-owner branch')
          Path('evidence/worm-score-v6-e2/source-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          Path('evidence/worm-score-v6-e2/request.json').write_text(json.dumps(request,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(request['training_run_id'])+'\n')
              f.write('artifact='+request['training_artifact']+'\n')
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/worm_score_v6_e2_eval.py
          python3 experiments/agent_painter/lanes/sprocket/test_worm_score_v6_e2_eval.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.lease.outputs.artifact }}
          path: evidence/previous-v6
          run-id: ${{ steps.lease.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify original failed producer and the separately qualified step24 checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence/previous-v6')
          p=root/'campaign'
          assert not (p/'summary.json').exists(), 'original run is NOT a successful completed job'
          assert not (p/'trained-six-way-first-scores.json').exists(), 'unexpected claim of final scores'
          cfg=json.loads((p/'preflight.json').read_text())['config']
          lease=json.loads((p/'lease.json').read_text())
          assert cfg['schema']=='cybersand.worm.sprocket-family-counterfactual-v6'
          assert cfg['source_sha']=='fbeece84ff2609e564bb43b7f40ecde1d80ef187'
          assert lease['source_sha']==cfg['source_sha']
          assert lease['run_id']=='43743251862' and int(lease['steps'])==24
          assert cfg['model']['model_id']=='kandivault/sprocket-500m'
          assert cfg['model']['revision']=='eb157d4ddddc4619e661d4a2426bb2dd000fc668'
          assert cfg['model']['subfolder']==''
          assert cfg['worm_common_git_commit']=='4bb9d6e1d0d0d78183f87d1e3c29648edafacf61'
          assert cfg['worm_support_git_commit']=='2b6534ac21542805f4bda123f67e9624d21e39d7'
          assert cfg['training_pair_count']>=6 and cfg['heldout_pair_count']>=1
          assert cfg['literal_train_eval_overlap']==0
          assert cfg['synthetic_not_native'] is True and cfg['final_opened'] is False
          events=[json.loads(line) for line in (p/'progress.jsonl').read_text().splitlines()]
          assert len(events)==24 and [e['step'] for e in events]==list(range(1,25))
          assert all(len(e['ids'])==len(e['targets'])==2 and
                     e['targets'][0]!=e['targets'][1] and e['loss_tokens']==2 and
                     e['grad_norm']>0 for e in events)
          # Entire failed original upload remains immutable. Never convert its run to success.
          hashes=(root/'SHA256SUMS.txt').read_text().splitlines()
          assert len(hashes)>=75
          for line in hashes:
              expected,relative=line.split('  ',1)
              f=root/relative.removeprefix('./')
              assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==expected, f
          inventories={}
          for step in (12,24):
              ck=p/f'checkpoint-{step:06d}'
              inventory=json.loads((ck/'inventory.json').read_text())
              assert len(inventory)>=8
              for name,entry in inventory.items():
                  f=ck/name
                  assert f.is_file() and f.stat().st_size==entry['bytes']
                  assert hashlib.sha256(f.read_bytes()).hexdigest()==entry['sha256'], f
              receipt=json.loads((ck/'receipt.json').read_text())
              assert receipt['global_step']==receipt['sample_cursor']==step
              assert receipt['history']==events[:step]
              assert receipt['config']==cfg
              assert len(receipt['frozen_base_sha256'])==64
              assert (ck/'training_state.pt').stat().st_size>10_000_000
              inventories[step]=inventory
          assert inventories[12]['adapter/adapter_model.safetensors']['sha256']!=inventories[24]['adapter/adapter_model.safetensors']['sha256']
          output=Path('evidence/worm-score-v6-e2/producer-salvage-note.json')
          output.write_text(json.dumps({
             'producer_run_id':43743251862,'producer_job_id':132900838675,
             'producer_conclusion':'failure','producer_exit_code':137,
             'qualified_optimizer_updates':24,'checkpoint':'checkpoint-000024',
             'checkpoint_inventories_verified':[12,24],
             'original_artifact_id':14174007244,
             'original_artifact_upload_digest_sha256':'6a53462bd4518272eb304b1b9d35e494a6ee894012ce10069f2d78f3a577b24c',
             'entire_original_member_sha256_verified':len(hashes),
             'raw_trained_static_probe_available':(p/'trained-raw-first-pass.json').is_file(),
             'post_optimization_summary_missing':True,
             'qualification':'step24 checkpoint only; NOT successful producer job or fully qualified training campaign',
             'native':False,'sealed_final_opened':False
          },sort_keys=True,indent=2)+'\n')
          print('Original W6 producer FAIL / exit137 retained; separately valid step24 optimizer/checkpoint evidence PASS')
          PY
      - name: Obtain original pinned W0 host and independently preserve its source
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git rev-parse FETCH_HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/pinned-worm.py"
          test "$(git hash-object "$RUNNER_TEMP/pinned-worm.py")" = 8979b6f0296e81051194bacc907992d38e006605
          sha256sum "$RUNNER_TEMP/pinned-worm.py" > evidence/worm-score-v6-e2/pinned-w0.sha256
      - name: Install exact portable CPU FP32 package and reviewed model identity
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/painter-training"
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/painter-training/bin/python" -m pip check
          "$RUNNER_TEMP/painter-training/bin/python" -m pip freeze --all > evidence/worm-score-v6-e2/pip-freeze.txt
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/training/download_model.py --profile sprocket --output "$RUNNER_TEMP/painter-model"
          cp "$RUNNER_TEMP/painter-model/download_receipt.json" evidence/worm-score-v6-e2/model-download.json
      - name: Execute real W6 learned policy versus host-flat and random/wall/fidget PNGs
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3000s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/lanes/sprocket/worm_score_v6_e2_eval.py \
            --model "$RUNNER_TEMP/painter-model" --w0 "$RUNNER_TEMP/pinned-worm.py" \
            --checkpoint evidence/previous-v6/campaign/checkpoint-000024 \
            --training-source fbeece84ff2609e564bb43b7f40ecde1d80ef187 --train-run 43743251862 \
            --output evidence/worm-score-v6-e2/results
      - name: Retain original PNGs/receipts/checksums even on deadline or partial failure
        if: always()
        run: |
          set -euo pipefail
          df -h > evidence/worm-score-v6-e2/disk-after.txt
          (cd evidence/worm-score-v6-e2 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > evidence/worm-score-v6-e2/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-worm-score-v6-e2-${{ github.sha }}
          path: evidence/worm-score-v6-e2/
          if-no-files-found: warn
          retention-days: 90
