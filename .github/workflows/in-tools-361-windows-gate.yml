name: IN-TOOLS 361 successor Windows causal gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/in-tools-361-windows-gate.yml'
      - 'docs/architecture/in-tools-gameplay-admission.md'
      - 'docs/audits/2026-11-05-in-tools-361-successor-salvage.md'
      - 'docs/operations/in-tools-fixtures-and-playtest.md'
      - 'godot/tests/fixtures/lcb/in_tools/in-tools-current-main-admission.2026-11-05.json'
      - 'tools/lcb/in_tools_current_main_admission.py'
      - 'tools/lcb/test_in_tools_current_main_admission.py'
      - 'tools/play/run_in_tools_successor_windows_gate.py'
  workflow_dispatch:

concurrency:
  group: in-tools-361-windows-gate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  actual-windows-causal-gate:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out exact successor head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Materialize retained Windows runtime inputs
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""

      - name: Authenticate successor source authority
        run: |
          set -euo pipefail
          mkdir -p build/in-tools-windows-gate
          python tools/lcb/in_tools_current_main_admission.py | tee build/in-tools-windows-gate/source-admission.json
          python tools/lcb/test_in_tools_current_main_admission.py -v 2>&1 | tee build/in-tools-windows-gate/source-admission-tests.log
          git rev-parse HEAD > build/in-tools-windows-gate/source-sha.txt
          git rev-parse HEAD^{tree} > build/in-tools-windows-gate/source-tree.txt

      - name: Download official Windows Godot archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 60 --max-time 1200 --output "$RUNNER_TEMP/godot-windows.zip" "$GODOT_WINDOWS_URL"

      - name: Execute unchanged desktop-default fixture with natural process completion
        id: causal_gate
        run: |
          set +e
          python tools/play/run_in_tools_successor_windows_gate.py             --godot-archive "$RUNNER_TEMP/godot-windows.zip"             --expected-source-sha "$(git rev-parse HEAD)"             --output build/in-tools-windows-gate
          code=$?
          echo "$code" > build/in-tools-windows-gate/wrapper-exit.txt
          exit "$code"

      - name: Retain exact Windows causal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: in-tools-361-windows-causal-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/in-tools-windows-gate/
          if-no-files-found: error
          retention-days: 90
