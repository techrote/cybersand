name: MZ-004 Pythia-70M matched game-policy tuning (research only)
on:
  push:
    branches:
      - 'research/model-zoo-pythia70-mz004'
    paths:
      - 'experiments/driv3r/model_zoo/pythia70/**'
      - '.github/workflows/driv3r-model-zoo-pythia70.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mz004-pythia70-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pythia70-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only authority and controls
        run: |
          python -m unittest -v experiments.driv3r.model_zoo.mamba130.test_world
          python -m unittest -v experiments.driv3r.model_zoo.mamba130.test_counterfactual
          python -m unittest -v experiments.driv3r.model_zoo.pythia70.test_pythia70
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.3' 'pillow==11.3.0'
          python -m pip freeze > "$RUNNER_TEMP/mz004-resolved-packages.txt"
      - name: Pretrained transformer + genuinely optimized partial backbone
        run: |
          python -m experiments.driv3r.model_zoo.pythia70.run \
            --out "$RUNNER_TEMP/mz004-pythia70" --train-seeds 14 --dev-seeds 4 \
            --steps 9 --epochs 140 --tune-steps 96 --batch-size 16 \
            --head-extra-lr 0.0002 --backbone-lr 0.00004 --rollout-steps 16
      - name: Assert original forward, gradients, controls, checkpoint and images
        run: |
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mz004-pythia70'
          r=json.loads((p/'results.json').read_text())
          assert r['schema']=='MZ004-PYTHIA70-GAME-v1'
          assert r['source_sha']==os.environ['GITHUB_SHA']
          assert r['revision']=='e93a9faa9c77e5d09219f6c868bfc7a1bd65593c'
          assert 20_000_000<=r['backbone_parameters']<=150_000_000
          assert 100_000<=r['trainable_backbone_parameters']<1_000_000
          assert len(r['selected_trainable_names'])==4
          assert r['head_extra_lr']==0.0002 and r['backbone_lr']==0.00004
          assert r['train_examples']>=100 and r['test_examples']>=40
          assert r['forward_calls']>=r['train_examples']
          assert len(r['frozen_head_losses'])==140
          assert len(r['structured_losses'])==140
          assert len(r['frozen_extra_losses'])==96
          assert len(r['tuned_losses'])==96
          assert all(k in r['score'] for k in ('frozen_head','frozen_extra','structured','tuned_last_block','majority'))
          assert r['score']['tuned_last_block']['test']['paired']['changed_target_pairs']>20
          ck=p/'pythia70_game_adapter.pt'
          assert ck.stat().st_size>100000
          assert hashlib.sha256(ck.read_bytes()).hexdigest()==r['checkpoint_sha256']
          assert (p/'rollouts.png').stat().st_size>1000
          assert len(r['traces'])==20
          PY
      - name: Retain original trained model research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mz004-pythia70-${{ github.sha }}
          path: ${{ runner.temp }}/mz004-pythia70/**
          if-no-files-found: warn
          retention-days: 14
