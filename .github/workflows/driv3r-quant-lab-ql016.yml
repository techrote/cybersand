name: QL-016 contextual Q1 Q2 Q4 branch retrace personality (research)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql016_contextual_character.py'
      - '.github/workflows/driv3r-quant-lab-ql016.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql016-contextual-character
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  ql016-character:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Retrieve immutable source-pinned QL-003 Q1/Q4 parents
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Retrieve immutable exact-HEAD QL-014 Q4 contextual table
        uses: actions/download-artifact@v4
        with:
          name: ql014-frontier-bitpack-qat-exact-head
          run-id: 43913182449
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql014-source
      - name: Retrieve immutable exact-HEAD QL-015 Q1 STOP repair
        uses: actions/download-artifact@v4
        with:
          name: ql015-budget-conditioned-stop-exact-head
          run-id: 43924651098
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql015-source
      - name: Unit-check context indexing and genuine Q1 Q2 Q4 bitpack
        run: |
          python experiments/driv3r/quant_lab/ql016_contextual_character.py --self-test
      - name: Train two FP32 references and Q4 Q2 Q1 sparse-Q1 actual STE repairs
        run: |
          python experiments/driv3r/quant_lab/ql016_contextual_character.py --parent ql003-source --ql014 ql014-source --ql015 ql015-source --out ql016-out --fp-steps 64 --qat-steps 48
      - name: Independently validate immutable ancestry, packs, margins, legal actions and original evidence
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import numpy as np,torch
          root=Path('ql016-out')
          data=json.loads((root/'results.json').read_text())
          sha=os.environ['QL_SOURCE_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          assert data['source_sha']==sha
          assert data['ql014_source_sha']=='eed1514a5b2c93b7a22838134ed40a56a63ee100'
          assert data['ql015_source_sha']=='40df4242f22f908f509f808c491598f493fa2222'
          assert data['ql015_checkpoint_sha256']=='b722436434f869ffb1a37eec88259daaa24c7ef5c580dfaab4156511271937e0'
          assert data['parent_manifest']>=330
          assert data['ql014_manifest']>=225 and data['ql015_manifest']>=261
          assert data['train_n']>5000 and data['heldout_n']==4352
          assert data['optimizer_updates']==320 and len(data['variants'])==8
          assert data['original_png_n']==288 and data['first_pass_trajectories']==288
          for name,bits,steps,sparse in (
            ('ce-fp32',32,64,False),('personality-fp32',32,64,False),
            ('personality-q4',4,48,False),('personality-q2',2,48,False),
            ('personality-q1',1,48,False),('sparse-q1-no-chain',1,48,True)):
              ck=torch.load(root/'models'/(name+'-optimizer.pt'),
                            map_location='cpu',weights_only=False)
              assert ck['source_sha']==sha and ck['ql015_source_sha']==data['ql015_source_sha']
              assert ck['ql015_checkpoint_sha256']==data['ql015_checkpoint_sha256']
              assert ck['bits']==bits and ck['updates']==steps and ck['sparse']==sparse
              assert ck['table_fp32'].shape==(4,2,2,2) and len(ck['trace'])==steps
              assert len(ck['optimizer']['state'])==1
              assert bool(torch.count_nonzero(next(iter(ck['optimizer']['state'].values()))['exp_avg']))
              assert all(v>0 for v in ck['support'].values())
              if bits<32:
                  z=np.load(root/'models'/(name+'-packed.npz'))
                  assert int(z['bits'])==bits and bool(z['sparse'])==sparse
                  assert len(z['packed'])==(32*bits+7)//8 and z['scales'].shape==(4,)
                  assert np.array_equal(ck['packed_payload']['packed'],z['packed'])
                  assert np.array_equal(ck['packed_payload']['scales'],z['scales'])
                  assert ck['packed_payload']['bytes']==len(z['packed'])+16
                  if sparse:
                      assert np.count_nonzero(ck['packed_payload']['decoded'][:,:,1,:])==0
          steps=json.loads((root/'raw_decisions.json').read_text())
          assert len(steps)==288
          assert len({(e['policy'],e['seed'],e['family'],e['override_rate']) for e in steps})==288
          legal=0
          for ep in steps:
              assert ep['first_pass']
              for state in ep['steps']:
                  assert state['chosen'] in state['legal'] and 'STOP' in state['legal']
                  legal+=1
          assert legal>3000
          for name,variant in data['variants'].items():
              assert variant['heldout']['host_legal']==4352
              assert variant['random_10pct']['n_episodes']==18
              assert variant['no_random_diagnostic']['n_episodes']==18
              assert variant['no_random_diagnostic']['total_host_overrides']==0
              assert variant['budget']['terminal']['n']>0
              assert variant['budget']['nonterminal']['host_masked_legal']==variant['budget']['nonterminal']['n']
          assert hashlib.sha256((root/'raw_decisions.json').read_bytes()).hexdigest()==data['raw_decisions_sha256']
          manifest=json.loads((root/'MANIFEST.json').read_text())
          assert len(manifest)>=295
          assert len({e['path'] for e in manifest})==len(manifest)
          for item in manifest:
              b=(root/item['path']).read_bytes()
              assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']
          assert len(list((root/'gallery').glob('*.png')))==288
          print('QL016 EXACT HEAD PASS',sha,'host-legal applied actions',legal,
                'manifest',len(manifest),'original PNG',data['original_png_n'])
          PY
      - name: Preserve real optimizer states, bitpacked models, raw game decisions and original PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql016-contextual-character-exact-head
          path: ql016-out/
          retention-days: 21
          if-no-files-found: warn
