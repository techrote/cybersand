name: GIP-014 goblin002 passive evidence seal
on:
  push:
    branches:
      - experiment/gip014-goblin-002-20261125
    paths:
      - .github/workflows/gip014-goblin-002-passive-seal.yml
      - tools/gip014/passive_seal.py
      - tools/gip014/passive-seal-manifest.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gip014-goblin002-passive-seal-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  seal-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Check out passive driver and exact RESULTS history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: driver
          lfs: false
          persist-credentials: false
          fetch-depth: 0
      - name: Check out unchanged qualified source for custody monitor only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6f359ce2b24291ee219810773c641d53802fd31d
          path: qualified-source
          lfs: false
          persist-credentials: false
          fetch-depth: 0
      - name: Set up passive Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact process monitor dependency
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check -r qualified-source/tools/gip014/requirements.txt
      - name: Validate seal source syntax and fixed activation
        timeout-minutes: 2
        run: |
          python -B - <<'PY'
          import json, os, pathlib, py_compile
          base = pathlib.Path("driver/tools/gip014")
          for i, name in enumerate(("passive_seal.py", "passive_evidence.py", "evidence/passive/build_archive.py")):
              py_compile.compile(str(base/name), cfile=str(pathlib.Path(os.environ["RUNNER_TEMP"])/("goblin-seal-"+str(i)+".pyc")), doraise=True)
          value = json.loads((base/"passive-seal-manifest.json").read_bytes())
          assert value["activation_enabled"] is True and value["results_commit"] and value["results_tree"]
          assert value["stage_artifact"]["id"] == 15005776720
          print("PASSIVE_SEAL_SOURCE_GATE fixed Python parsed; seal-only; no gameplay or reader execution")
          PY
      - name: Create exclusive disposable seal root
        timeout-minutes: 1
        run: |
          sudo mkdir -p /home/agent
          sudo test ! -e /home/agent/goblin002
          sudo mkdir /home/agent/goblin002
          sudo chown "$(id -u):$(id -g)" /home/agent/goblin002
      - name: Verify restored stage and seal unchanged evidence
        timeout-minutes: 27
        env:
          GOBLIN_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: python -B driver/tools/gip014/passive_seal.py
      - name: Preserve sealed archive on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gip014-goblin-002-passive-evidence-archive-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          path: /home/agent/goblin002/deliverables/
      - name: Preserve bounded seal receipts and all failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gip014-goblin-002-passive-seal-receipts-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
          path: |
            /home/agent/goblin002/passive-seal/*.json
            /home/agent/goblin002/passive-seal/*.log
            /home/agent/goblin002/passive-seal/resource-stop
            /home/agent/goblin002/evidence/durable-data-archive/plan.json
            /home/agent/goblin002/evidence/durable-data-archive/archive-receipt.json
            /home/agent/goblin002/evidence/durable-data-archive/evidence-index.json
            /home/agent/goblin002/evidence/durable-data-archive/README.md
