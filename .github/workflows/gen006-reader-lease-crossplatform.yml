name: GEN-006 cross-platform reader lease GC preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/experiments/gen006_windows_lease_probe.py'
      - '.github/workflows/gen006-reader-lease-crossplatform.yml'
  workflow_dispatch:

permissions:
  contents: read

# Experimental filesystem proof; not native World persistence.
concurrency:
  group: gen006-winlease-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOURCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  linux:
    name: ubuntu-24.04 / actual OS-process lease probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Preserve LF checkout bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run source-guarded real OS-process probe
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gen006-winlease"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git rev-parse HEAD > "$RUNNER_TEMP/gen006-winlease/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/gen006-winlease/tree.txt"
          python -c "import platform,os,json; print(json.dumps(dict(system=platform.platform(),python=platform.python_version(),pid=os.getpid())))" > "$RUNNER_TEMP/gen006-winlease/host.json"
          python tools/experiments/gen006_windows_lease_probe.py --test > "$RUNNER_TEMP/gen006-winlease/tests.log" 2>&1 || {
            cat "$RUNNER_TEMP/gen006-winlease/tests.log"
            exit 1
          }
          cat "$RUNNER_TEMP/gen006-winlease/tests.log"
          python tools/experiments/gen006_windows_lease_probe.py --witness "$RUNNER_TEMP/gen006-winlease/witness.json"
          python -m py_compile tools/experiments/gen006_windows_lease_probe.py
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['unleased']['reader']['reason']=='BLOB_MISSING'; assert d['leased']['reader']['status']=='READ_OK'; assert d['crashed']['gc']['retired']==1" "$RUNNER_TEMP/gen006-winlease/witness.json"
          python -c "import hashlib,pathlib,sys,json; p=pathlib.Path(sys.argv[1]); print(json.dumps(dict(script_sha256=hashlib.sha256(p.read_bytes()).hexdigest())))" tools/experiments/gen006_windows_lease_probe.py > "$RUNNER_TEMP/gen006-winlease/script.json"
      - name: Retain negative and positive evidence, including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen006-winlease-ubuntu-24.04-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gen006-winlease/**
          if-no-files-found: warn
          retention-days: 90

  windows:
    name: windows-2022 / actual OS-process lease probe
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Preserve LF checkout bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run source-guarded real OS-process probe
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gen006-winlease"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git rev-parse HEAD > "$RUNNER_TEMP/gen006-winlease/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/gen006-winlease/tree.txt"
          python -c "import platform,os,json; print(json.dumps(dict(system=platform.platform(),python=platform.python_version(),pid=os.getpid())))" > "$RUNNER_TEMP/gen006-winlease/host.json"
          python tools/experiments/gen006_windows_lease_probe.py --test > "$RUNNER_TEMP/gen006-winlease/tests.log" 2>&1 || {
            cat "$RUNNER_TEMP/gen006-winlease/tests.log"
            exit 1
          }
          cat "$RUNNER_TEMP/gen006-winlease/tests.log"
          python tools/experiments/gen006_windows_lease_probe.py --witness "$RUNNER_TEMP/gen006-winlease/witness.json"
          python -m py_compile tools/experiments/gen006_windows_lease_probe.py
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['unleased']['reader']['reason']=='BLOB_MISSING'; assert d['leased']['reader']['status']=='READ_OK'; assert d['crashed']['gc']['retired']==1" "$RUNNER_TEMP/gen006-winlease/witness.json"
          python -c "import hashlib,pathlib,sys,json; p=pathlib.Path(sys.argv[1]); print(json.dumps(dict(script_sha256=hashlib.sha256(p.read_bytes()).hexdigest())))" tools/experiments/gen006_windows_lease_probe.py > "$RUNNER_TEMP/gen006-winlease/script.json"
      - name: Retain negative and positive evidence, including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen006-winlease-windows-2022-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gen006-winlease/**
          if-no-files-found: warn
          retention-days: 90
