name: C128 untimed actual-workload qualification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/experiments/mat003_c128/**'
      - '.github/workflows/mat003-c128-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s2p-untimed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
      - name: Provider policy
        run: python3 tools/ci/check_ci_provider_policy.py
      - name: Compile and qualify all actual-workload twins without timing
        run: python3 -B tools/experiments/mat003_c128/apparatus.py --output build/mat003-c128
      - name: Independently read complete untimed apparatus
        run: python3 -B tools/experiments/mat003_c128/verify.py build/mat003-c128 > build/mat003-c128/independent-readback.json
      - name: Retain complete source binaries raw observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat003-c128-untimed-${{ github.run_id }}
          path: build/mat003-c128/
          if-no-files-found: error
          retention-days: 90
