name: Wave finisher bounded Deepworks rendering diagnostic

on:
  push:
    branches: [astra/wave-mt-001-669-finisher]
    paths:
      - '.github/workflows/wave-deepworks-diagnostic.yml'
      - 'tools/diagnostics/deepworks_causal/**'

permissions:
  contents: read

concurrency:
  group: wave-deepworks-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/astra/wave-mt-001-669-finisher'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      GALLIVM_PERF: nopt
      GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
      GODOT_ARCHIVE_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
      GODOT_VERSION: 4.7.stable.official.5b4e0cb0f
    steps:
      - name: Check out separately identified diagnostic inputs
        timeout-minutes: 5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
          lfs: false

      - name: Check out unchanged failed candidate Q as project
        timeout-minutes: 5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 93a5e85dc9d5459a5f9cce00839b64090a1a0573
          path: project
          persist-credentials: false
          lfs: false

      - name: Retain registration and verify source and diagnostic inputs
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p evidence/inputs
          cp diagnostic/tools/diagnostics/deepworks_causal/*.py diagnostic/tools/diagnostics/deepworks_causal/*.gd evidence/inputs/
          cp diagnostic/.github/workflows/wave-deepworks-diagnostic.yml evidence/inputs/
          test "$(git -C project rev-parse HEAD)" = 93a5e85dc9d5459a5f9cce00839b64090a1a0573
          test "$(git -C project rev-parse 'HEAD^{tree}')" = 1035c8ae3c30fb50dafd483916f1c21b59200e2d
          test "$(git -C diagnostic rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          git -C project show --no-patch --format=fuller HEAD > evidence/project-source.txt
          git -C diagnostic show --no-patch --format=fuller HEAD > evidence/diagnostic-source.txt
          cat > evidence/input-sha256.txt <<'PINS'
          106deb3ecd464c231576c8c39d376bd19c62f48c09dbebe382c89c93ae9c70ad  run_deepworks_diagnostic.py
          9ef13adda62b828a7679bff40d2ea3608fd4861c27946fb0248bfe22662072e9  native_packet_probe.gd
          47cb3ce1162597d075b6f780e53519566f1c13fa676e90da21877f9e8b0bacfe  renderer_time_probe.gd
          PINS
          (cd diagnostic/tools/diagnostics/deepworks_causal && sha256sum --check --strict "$GITHUB_WORKSPACE/evidence/input-sha256.txt")

      - name: Materialize only the pinned Q Linux runtime bytes
        timeout-minutes: 6
        working-directory: project
        run: |
          set -euo pipefail
          timeout 300 git lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          cat > "$GITHUB_WORKSPACE/evidence/runtime.sha256" <<'PINS'
          787b23a8fb6ea732dc02243aa7097b21ace222dba5914ad67b41769fc1d1fe5f  godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so
          PINS
          sha256sum --check --strict "$GITHUB_WORKSPACE/evidence/runtime.sha256"

      - name: Prepare the pinned Godot runtime
        timeout-minutes: 8
        run: |
          set -euo pipefail
          timeout 360 curl --fail --location --retry 2 --retry-all-errors --retry-delay 2 --retry-max-time 300 --max-time 300 --output "$RUNNER_TEMP/deepworks-godot.zip" "$GODOT_URL"
          echo "$GODOT_ARCHIVE_SHA256  $RUNNER_TEMP/deepworks-godot.zip" | sha256sum --check --strict
          test "$(stat --format='%s' "$RUNNER_TEMP/deepworks-godot.zip")" = 75664355
          unzip -q "$RUNNER_TEMP/deepworks-godot.zip" -d "$RUNNER_TEMP/deepworks-godot"
          GODOT_BIN="$RUNNER_TEMP/deepworks-godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = "$GODOT_VERSION"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          printf '%s\n' "$GODOT_VERSION" > evidence/godot-version.txt
          sha256sum "$GODOT_BIN" "$RUNNER_TEMP/deepworks-godot.zip" > evidence/godot.sha256

      - name: Prepare software-rendered display
        timeout-minutes: 10
        run: bash project/tools/ci/prepare_linux_display.sh

      - name: Run the two registered diagnostic variants once
        timeout-minutes: 28
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24 -nolisten tcp' \
            python3 diagnostic/tools/diagnostics/deepworks_causal/run_deepworks_diagnostic.py \
              --project "$GITHUB_WORKSPACE/project" \
              --godot "$GODOT_BIN" \
              --output "$GITHUB_WORKSPACE/evidence"

      - name: Retain every original observation including visibility negatives
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepworks-causal-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
