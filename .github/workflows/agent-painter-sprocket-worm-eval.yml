name: SPROCKET WORM-001 source-faithful model-in-the-loop PNG evaluation
on:
  push:
    branches:
      - codex/agent-painter-sprocket-568
    paths:
      - experiments/agent_painter/lanes/sprocket/worm-eval-request-v1.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sprocket-worm-eval-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  model-worm-rollouts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate WORM checkpoint source and immutable lease
        id: lease
        run: |
          set -euo pipefail
          mkdir -p evidence/worm-eval
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('experiments/agent_painter/lanes/sprocket/worm-eval-request-v1.json').read_text())
          assert r['schema']=='cybersand.worm.sprocket-eval-request/1'
          assert r['experiment']=='sprocket-worm-v1-001-eval'
          assert r['w0_git_commit']=='2be9fd02ee525f2eac999555d4e7392a1dbc739b'
          assert r['model_revision']=='eb157d4ddddc4619e661d4a2426bb2dd000fc668'
          assert r['training_source']=='fa68d77444be254c9a9bee170d37087229e3e1ab'
          assert r['training_run_id']==43696501195
          assert r['artifact']=='sprocket-worm-v1-'+r['training_source']
          assert r['checkpoint']=='checkpoint-000012'
          assert r['steps']==24 and r['keep_draft'] is True and r['native'] is False
          assert os.environ['GITHUB_REF']=='refs/heads/codex/agent-painter-sprocket-568'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('training_run_id='+str(r['training_run_id'])+'\n')
              f.write('artifact='+r['artifact']+'\n')
          Path('evidence/worm-eval/lease.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          python3 tools/ci/check_ci_provider_policy.py
          git rev-parse HEAD > evidence/worm-eval/source-sha.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.lease.outputs.artifact }}
          path: evidence/previous-training
          run-id: ${{ steps.lease.outputs.training_run_id }}
          github-token: ${{ github.token }}
      - name: Verify training summary before loading adapter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/previous-training/campaign')
          meta=json.loads((root/'summary.json').read_text())
          assert meta['actual_training'] is True
          assert meta['status']=='complete' and meta['steps']==12
          assert meta['frozen_base_equal'] and meta['adapter_changed']
          assert meta['checkpoint']=='checkpoint-000012'
          assert not meta['native_execution'] and not meta['sealed_final_opened']
          print('Independent training evidence source-bound; visual test now eligible')
          PY
      - name: Get W0 original host implementation by immutable Git SHA
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 2be9fd02ee525f2eac999555d4e7392a1dbc739b
          test "$(git rev-parse FETCH_HEAD)" = 2be9fd02ee525f2eac999555d4e7392a1dbc739b
          git show 2be9fd02ee525f2eac999555d4e7392a1dbc739b:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/pinned-worm.py"
          sha256sum "$RUNNER_TEMP/pinned-worm.py" > evidence/worm-eval/w0.sha256
      - name: Install exact previously qualified CPU stack and model
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/painter-training"
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/painter-training/bin/python" -m pip check
          "$RUNNER_TEMP/painter-training/bin/python" -m pip freeze --all > evidence/worm-eval/pip-freeze.txt
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/training/download_model.py --profile sprocket --output "$RUNNER_TEMP/painter-model"
          cp "$RUNNER_TEMP/painter-model/download_receipt.json" evidence/worm-eval/model-download.json
      - name: Run original first-pass learned, untuned and two independent control policies
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1350s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/lanes/sprocket/worm_rollout_v1.py \
            --model "$RUNNER_TEMP/painter-model" --w0 "$RUNNER_TEMP/pinned-worm.py" \
            --checkpoint evidence/previous-training/campaign/checkpoint-000012 \
            --training-source fa68d77444be254c9a9bee170d37087229e3e1ab \
            --steps 24 --output evidence/worm-eval/results
      - name: Immutable originals and hash record
        if: always()
        run: |
          set -euo pipefail
          df -h > evidence/worm-eval/disk-after.txt
          (cd evidence/worm-eval && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > evidence/worm-eval/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-worm-eval-v1-${{ github.sha }}
          path: evidence/worm-eval/
          if-no-files-found: warn
          retention-days: 90
