name: Native #292 signed-copy endpoint regression (paired red / green)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'native/src/world.cpp'
      - 'native/tests/test_copy_extreme_coordinates.cpp'
      - '.github/workflows/native-copy-extreme-292.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copy-extreme-292-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  baseline_original_ubsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: 662ed4d88c08070dbb6f313931146a23e3631471
      EVIDENCE: build/copy-extreme-292/baseline
    steps:
      - name: Checkout immutable candidate with exact upstream history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Reproduce original main UBSan failures against the same test source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$EVIDENCE/test-source.txt"
          git rev-parse "HEAD:native/tests/test_copy_extreme_coordinates.cpp" > "$EVIDENCE/test-blob.txt"
          git worktree add --detach "$RUNNER_TEMP/copy292-baseline" "$BASE_SHA"
          echo "$BASE_SHA" > "$EVIDENCE/base-commit.txt"
          git -C "$RUNNER_TEMP/copy292-baseline" rev-parse HEAD^{tree} > "$EVIDENCE/base-tree.txt"
          git -C "$RUNNER_TEMP/copy292-baseline" rev-parse HEAD:native/src/world.cpp > "$EVIDENCE/original-world-blob.txt"
          g++ --version | head -n 1 | tee "$EVIDENCE/compiler.txt"
          localroot="$RUNNER_TEMP/copy292-baseline"
          g++ -std=c++20 -O1 -g1 -pthread -fsanitize=undefined \
            -fno-sanitize-recover=undefined -fno-omit-frame-pointer \
            -I "$localroot/native/include" \
            "$localroot/native/src/world.cpp" "$localroot/native/src/material_rules.cpp" \
            "$localroot/native/src/scheduler_geometry.cpp" \
            "$localroot/native/src/settled_world_discovery.cpp" \
            "$localroot/native/src/render_snapshot.cpp" "$localroot/native/src/c_api.cpp" \
            native/tests/test_copy_extreme_coordinates.cpp \
            -o "$EVIDENCE/original-ubsan"
          sha256sum "$EVIDENCE/original-ubsan" > "$EVIDENCE/original-binary.sha256"
          failures=0
          for fixture in material-max1 material-max2 rgba-max2 cabi-max2 zero; do
            set +e
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$EVIDENCE/original-ubsan" "$fixture" \
              > "$EVIDENCE/RED-$fixture.log" 2>&1
            rc=$?
            set -e
            if test "$rc" -eq 0 || ! grep -Fq 'runtime error: signed integer overflow' "$EVIDENCE/RED-$fixture.log"; then
              echo "RED_CONTROL_FAILED $fixture exit=$rc"
              tail -60 "$EVIDENCE/RED-$fixture.log"
              exit 1
            fi
            echo "BASELINE_RED_CONFIRMED case=$fixture exit=$rc"
            failures=$((failures+1))
          done
          test "$failures" -eq 5
          echo "COPY_EXTREME_BASELINE: 5/5 original UBSan overflow reproductions confirmed"
      - name: Retain authentic baseline sanitizer failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-copy292-original-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/copy-extreme-292/baseline/
          if-no-files-found: error
          retention-days: 90

  candidate_ubsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE: build/copy-extreme-292/candidate
    steps:
      - name: Checkout candidate exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Compile source-matched production World and C ABI with UBSan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$EVIDENCE/source-head.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE/source-tree.txt"
          git rev-parse HEAD:native/src/world.cpp > "$EVIDENCE/world-blob.txt"
          git diff --check HEAD
          python3 tools/ci/check_ci_provider_policy.py > "$EVIDENCE/provider.json"
          g++ --version | head -n 1 | tee "$EVIDENCE/compiler.txt"
          g++ -std=c++20 -O1 -g1 -pthread -fsanitize=undefined \
            -fno-sanitize-recover=undefined -fno-omit-frame-pointer -I native/include \
            native/src/world.cpp native/src/material_rules.cpp \
            native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp \
            native/src/render_snapshot.cpp native/src/c_api.cpp \
            native/tests/test_copy_extreme_coordinates.cpp -o "$EVIDENCE/candidate-ubsan"
          sha256sum "$EVIDENCE/candidate-ubsan" > "$EVIDENCE/binary.sha256"
      - name: Execute every case as separate real native UBSan process
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for fixture in material-max1 material-max2 material-ymax1 material-ymax2 \
                         rgba-max1 rgba-max2 rgba-ymax1 rgba-ymax2 \
                         cabi-max1 cabi-max2 cabi-ymax1 cabi-ymax2 \
                         min2 zero pad-and-projection negative-extent render-control; do
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              timeout 35 "$EVIDENCE/candidate-ubsan" "$fixture" \
              2>&1 | tee "$EVIDENCE/PASS-$fixture.log"
            grep -Fx "COPY_EXTREME_PASS case=$fixture" "$EVIDENCE/PASS-$fixture.log"
            count=$((count+1))
          done
          test "$count" -eq 17
          echo "COPY_EXTREME_CANDIDATE: 17/17 cases PASS under real UBSan"
      - name: Retain original candidate output including failed cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-copy292-candidate-ubsan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/copy-extreme-292/candidate/
          if-no-files-found: error
          retention-days: 90

  candidate_asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE: build/copy-extreme-292/asan
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Compile and execute actual native copy paths under ASan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$EVIDENCE/source-head.txt"
          git rev-parse HEAD:native/src/world.cpp > "$EVIDENCE/world-blob.txt"
          g++ --version | head -n 1 > "$EVIDENCE/compiler.txt"
          g++ -std=c++20 -O1 -g1 -pthread -fsanitize=address \
            -fno-omit-frame-pointer -I native/include \
            native/src/world.cpp native/src/material_rules.cpp \
            native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp \
            native/src/render_snapshot.cpp native/src/c_api.cpp \
            native/tests/test_copy_extreme_coordinates.cpp -o "$EVIDENCE/candidate-asan"
          sha256sum "$EVIDENCE/candidate-asan" > "$EVIDENCE/binary.sha256"
          count=0
          for fixture in material-max1 material-max2 material-ymax1 material-ymax2 \
                         rgba-max1 rgba-max2 rgba-ymax1 rgba-ymax2 \
                         cabi-max1 cabi-max2 cabi-ymax1 cabi-ymax2 \
                         min2 zero pad-and-projection negative-extent render-control; do
            ASAN_OPTIONS=halt_on_error=1:detect_leaks=0 \
              timeout 35 "$EVIDENCE/candidate-asan" "$fixture" \
              > "$EVIDENCE/$fixture.log" 2>&1 || {
                cat "$EVIDENCE/$fixture.log"
                exit 1
              }
            grep -Fx "COPY_EXTREME_PASS case=$fixture" "$EVIDENCE/$fixture.log"
            count=$((count+1))
          done
          test "$count" -eq 17
          echo "COPY_EXTREME_ASAN: 17/17 real native cases pass"
      - name: Preserve source, executable and ASan stdout/stderr
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-copy292-candidate-asan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/copy-extreme-292/asan/
          if-no-files-found: error
          retention-days: 90

  windows_msvc:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE: build/copy-extreme-292/msvc
    steps:
      - name: Checkout exact repaired candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Compile with actual Windows MSVC and execute all native / C ABI cases
        shell: pwsh
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'Wrong candidate SHA' }
          (git rev-parse HEAD) | Set-Content "$env:EVIDENCE\source-head.txt"
          (git rev-parse HEAD:native/src/world.cpp) | Set-Content "$env:EVIDENCE\world-blob.txt"
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere unavailable on Windows runner' }
          $installation = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $installation) { throw 'MSVC C++ workload unavailable' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw 'vcvars64.bat missing' }
          @(
            '@echo off',
            ('call "' + $vcvars + '"'),
            'if errorlevel 1 exit /b 11',
            'cl /nologo /std:c++20 /EHsc /O2 /MD /I native\include native\src\world.cpp native\src\material_rules.cpp native\src\scheduler_geometry.cpp native\src\settled_world_discovery.cpp native\src\render_snapshot.cpp native\src\c_api.cpp native\tests\test_copy_extreme_coordinates.cpp /Fe:build\copy-extreme-292\msvc\copy292.exe',
            'exit /b %errorlevel%'
          ) | Set-Content -Path "$env:EVIDENCE\build.cmd" -Encoding ascii
          $buildFile = (Resolve-Path "$env:EVIDENCE\build.cmd").Path
          & cmd.exe /d /c ('"' + $buildFile + '"') 2>&1 | Tee-Object -FilePath "$env:EVIDENCE\compiler.log"
          if ($LASTEXITCODE -ne 0) { throw "MSVC compilation exit=$LASTEXITCODE" }
          $exe = (Resolve-Path "$env:EVIDENCE\copy292.exe").Path
          (Get-FileHash $exe -Algorithm SHA256).Hash | Set-Content "$env:EVIDENCE\binary-sha256.txt"
          $cases = @('material-max1','material-max2','material-ymax1','material-ymax2',
            'rgba-max1','rgba-max2','rgba-ymax1','rgba-ymax2',
            'cabi-max1','cabi-max2','cabi-ymax1','cabi-ymax2',
            'min2','zero','pad-and-projection','negative-extent','render-control')
          $count=0
          foreach($case in $cases) {
            $actual = & $exe $case 2>&1
            $code = $LASTEXITCODE
            $actual | Set-Content "$env:EVIDENCE\$case.log"
            if ($code -ne 0 -or $actual -notcontains "COPY_EXTREME_PASS case=$case") {
              throw "Windows native case $case exit=$code detail=$actual"
            }
            $count++
          }
          if ($count -ne 17) { throw "Incomplete Windows matrix $count" }
          Write-Output "COPY_EXTREME_MSVC: 17/17 cases PASS"
      - name: Retain actual Windows MSVC build and process results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-copy292-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/copy-extreme-292/msvc/
          if-no-files-found: error
          retention-days: 90
