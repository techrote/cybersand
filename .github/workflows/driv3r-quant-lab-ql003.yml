name: QL-003 layer surgery and extreme-precision personalities (research only)
on:
  push:
    branches:
      - 'research/driv3r-quant-lab-*'
    paths:
      - 'experiments/driv3r/quant_lab/ql003_surgery.py'
      - '.github/workflows/driv3r-quant-lab-ql003.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ql003-quant-lab
  cancel-in-progress: false
jobs:
  franken-quant-worm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Verify game-legal contracts and surgery invariants
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql002_branch_retrace.py --self-test
          python experiments/driv3r/quant_lab/ql003_surgery.py --self-test
      - name: Genuine 740 optimizer steps, Frankenstein quants, paired live/frozen original PNGs
        run: |
          python experiments/driv3r/quant_lab/ql003_surgery.py --out ql003-out --steps 350 --q1-repair-steps 40
      - name: Exact source, packed model, optimizer and original PNG inventory
        run: |
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path('ql003-out')
          r=json.loads((p/'results.json').read_text())
          assert r['source_sha']==os.environ['GITHUB_SHA']
          assert r['train_n']>1000 and r['heldout_n']>1000
          assert set(r['training'])=={'regular','balanced','q1-repair'}
          assert [r['training'][k]['updates'] for k in ('regular','balanced','q1-repair')]==[350,350,40]
          assert all(v['moment_tensors_nonzero']>0 for v in r['training'].values())
          assert len(r['variants'])>=12
          assert all(v['heldout_n']==r['heldout_n'] and len(v['visual_episodes'])==18
                     for v in r['variants'].values())
          assert all(0<=v['unmasked_top_action_legal_rate']<=1 for v in r['variants'].values())
          assert len(list((p/'gallery').glob('*.png')))==18*len(r['variants'])+27
          assert len(json.loads((p/'raw_decisions.json').read_text()))==18*len(r['variants'])+27
          manifest=json.loads((p/'MANIFEST.json').read_text())
          assert len({e['path'] for e in manifest})==len(manifest)
          for e in manifest:
              b=(p/e['path']).read_bytes()
              assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256'],e['path']
          for v in r['variants'].values():
              for e in v['visual_episodes']:
                  assert hashlib.sha256((p/e['png']).read_bytes()).hexdigest()==e['png_sha256']
          print('QL003 EXACT-HEAD ALL MODEL/OPTIMIZER/PACKED/ORIGINAL PNG MANIFEST PASS',len(manifest))
          PY
      - name: Immutable optimizer checkpoints, traces, galleries and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql003-franken-quant
          path: ql003-out/
          if-no-files-found: warn
          retention-days: 21
