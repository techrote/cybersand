name: PUBPRES frozen-application balanced spawn follow-up

on:
  push:
    branches: [codex/pubpres-mainline-spawn-followup-001-20261128]
    paths:
      - '.github/workflows/pubpres-mainline-spawn-followup.yml'
      - 'tools/pubpres_mainline/common.py'
      - 'tools/pubpres_mainline/run_spawn_pair.py'
      - 'tools/pubpres_mainline/test_spawn_reader_binding.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: pubpres-spawn-followup-${{ github.run_id }}
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
  PYTHONUTF8: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  PUBPRES_OWNER: 9f2127256a555d177536cbb5fad2be7dcb322c8e
  PUBPRES_CANDIDATE: 65f71aaf4be3a67896bafac7f5220a0cb25a8fb7

jobs:
  spawn:
    name: Original P-C-C-P spawn population with corrected reader ownership
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/pubpres-mainline-spawn-followup-001-20261128'
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run: {shell: pwsh}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify corrected module ownership and original measurement tests
        run: |
          python -m unittest discover -s tools/pubpres_mainline -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Corrected reader ownership or original measurement tests failed' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 46132881112
          name: pubpres-mainline-runtimes-windows-46132881112-1
          path: runtimes
      - name: Materialize the two original application sources and Rapier identities
        run: |
          $owner = Join-Path $env:RUNNER_TEMP 'spawn-owner-source'
          $candidate = Join-Path $env:RUNNER_TEMP 'spawn-candidate-source'
          git worktree add --detach $owner $env:PUBPRES_OWNER
          if ($LASTEXITCODE -ne 0) { throw 'Frozen owner source staging failed' }
          git worktree add --detach $candidate $env:PUBPRES_CANDIDATE
          if ($LASTEXITCODE -ne 0) { throw 'Frozen final candidate source staging failed' }
          python tools/ci/materialize_lfs.py --root $owner --expected-source $env:PUBPRES_OWNER --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --output "$env:RUNNER_TEMP/spawn-dependencies-owner" --allowance-seconds 300
          if ($LASTEXITCODE -ne 0) { throw 'Original owner Rapier custody failed' }
          python tools/ci/materialize_lfs.py --root $candidate --expected-source $env:PUBPRES_CANDIDATE --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --output "$env:RUNNER_TEMP/spawn-dependencies-candidate" --allowance-seconds 300
          if ($LASTEXITCODE -ne 0) { throw 'Original final candidate Rapier custody failed' }
      - name: Acquire the identical official Stock engine and original candidate runtime
        run: |
          python tools/pubpres_mainline/setup_graphics.py --runtime runtimes/C --output "$env:RUNNER_TEMP/spawn-graphics"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned original engine or native input custody failed' }
      - name: Rerun all original P-C-C-P cases with separate application and driver identities
        run: |
          # The original1200-second failed cohort is preserved. Only aggregate
          # capacity rises to1800; all12 processes retain their original240s cap.
          python tools/pubpres_mainline/run_spawn_pair.py --owner-source "$env:RUNNER_TEMP/spawn-owner-source" --candidate-source "$env:RUNNER_TEMP/spawn-candidate-source" --owner-runtime runtimes/P --candidate-runtime runtimes/C --engine $env:GODOT_EXE --output "$env:RUNNER_TEMP/spawn-pair" --budget-seconds 1800 --frozen-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Original full balanced spawn follow-up failed; preserve every arm' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-spawn-followup-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/spawn-pair/
            !${{ runner.temp }}/spawn-pair/**/template/**
            ${{ runner.temp }}/spawn-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/spawn-dependencies-candidate/
            ${{ runner.temp }}/spawn-dependencies-owner/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
