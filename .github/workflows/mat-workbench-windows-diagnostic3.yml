name: Diagnose original Materials Lab Windows installation and capture load

on:
  push:
    branches: [codex/mat-workbench-windows-diagnostic3-20261113]
    paths:
      - '.github/workflows/mat-workbench-windows-diagnostic3.yml'
      - 'tools/ci/mat_workbench_windows_diagnostic3.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: mat-workbench-windows-diagnostic3
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/mat-workbench-windows-diagnostic3-20261113'
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CYBERSAND_LAB_CXX: 'C:\mingw64\bin\g++.exe'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      GALLIVM_PERF: nopt
      CYBERSAND_CI_WATCHDOG_SCALE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out diagnostic apparatus only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: diagnostic
          lfs: false

      - name: Check out the exact frozen candidate and full source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d66499ec3409fb657875fca7dbd0f234cf28ca49
          path: candidate
          fetch-depth: 0
          lfs: false

      - name: Select the original Python series
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore the immutable original cross-build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14007501336'
          run-id: '43358127824'
          github-token: ${{ github.token }}
          path: build-artifact
          merge-multiple: true

      - name: Prepare the original pinned runtime dependencies
        working-directory: candidate
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          echo "b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7  godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" | sha256sum --check --strict
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 --output "$RUNNER_TEMP/godot-windows.zip" https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip

      - name: Verify exact original inputs and import the frozen project
        id: prepare
        run: |
          set -euo pipefail
          python diagnostic/tools/ci/mat_workbench_windows_diagnostic3.py --candidate candidate --bundle build-artifact --godot-archive "$RUNNER_TEMP/godot-windows.zip" --evidence diagnostic-evidence --prepare

      - name: Execute original-ui-15fps with unchanged fixture limits
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          python diagnostic/tools/ci/mat_workbench_windows_diagnostic3.py --candidate candidate --evidence diagnostic-evidence --case original-ui-15fps

      - name: Retain original-ui-15fps originals immediately
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-windows-diagnostic3-original-ui-15fps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-evidence/original-ui-15fps/
            diagnostic-evidence/diagnostic.json
            diagnostic-evidence/source-before.json
            diagnostic-evidence/original-build-provenance.json
            diagnostic-evidence/observe-original-ui.gd
            diagnostic-evidence/sample-processes.ps1
          if-no-files-found: error
          retention-days: 90

      - name: Execute observed-ui-15fps with unchanged fixture limits
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          python diagnostic/tools/ci/mat_workbench_windows_diagnostic3.py --candidate candidate --evidence diagnostic-evidence --case observed-ui-15fps

      - name: Retain observed-ui-15fps originals immediately
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-windows-diagnostic3-observed-ui-15fps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-evidence/observed-ui-15fps/
            diagnostic-evidence/diagnostic.json
            diagnostic-evidence/source-before.json
            diagnostic-evidence/original-build-provenance.json
            diagnostic-evidence/observe-original-ui.gd
            diagnostic-evidence/sample-processes.ps1
          if-no-files-found: error
          retention-days: 90

      - name: Execute observed-ui-4fps with unchanged fixture limits
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          python diagnostic/tools/ci/mat_workbench_windows_diagnostic3.py --candidate candidate --evidence diagnostic-evidence --case observed-ui-4fps

      - name: Retain observed-ui-4fps originals immediately
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-windows-diagnostic3-observed-ui-4fps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-evidence/observed-ui-4fps/
            diagnostic-evidence/diagnostic.json
            diagnostic-evidence/source-before.json
            diagnostic-evidence/original-build-provenance.json
            diagnostic-evidence/observe-original-ui.gd
            diagnostic-evidence/sample-processes.ps1
          if-no-files-found: error
          retention-days: 90

      - name: Execute original-ui-4fps with unchanged fixture limits
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          python diagnostic/tools/ci/mat_workbench_windows_diagnostic3.py --candidate candidate --evidence diagnostic-evidence --case original-ui-4fps

      - name: Retain original-ui-4fps originals immediately
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-windows-diagnostic3-original-ui-4fps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-evidence/original-ui-4fps/
            diagnostic-evidence/diagnostic.json
            diagnostic-evidence/source-before.json
            diagnostic-evidence/original-build-provenance.json
            diagnostic-evidence/observe-original-ui.gd
            diagnostic-evidence/sample-processes.ps1
          if-no-files-found: error
          retention-days: 90

      - name: Execute original-world-4fps with unchanged fixture limits
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          python diagnostic/tools/ci/mat_workbench_windows_diagnostic3.py --candidate candidate --evidence diagnostic-evidence --case original-world-4fps

      - name: Retain original-world-4fps originals immediately
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-windows-diagnostic3-original-world-4fps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-evidence/original-world-4fps/
            diagnostic-evidence/diagnostic.json
            diagnostic-evidence/source-before.json
            diagnostic-evidence/original-build-provenance.json
            diagnostic-evidence/observe-original-ui.gd
            diagnostic-evidence/sample-processes.ps1
          if-no-files-found: error
          retention-days: 90

      - name: Read back all original controls and frozen source custody
        if: always() && !cancelled() && steps.prepare.outcome == 'success'
        run: |
          set -euo pipefail
          python diagnostic/tools/ci/mat_workbench_windows_diagnostic3.py --candidate candidate --evidence diagnostic-evidence --finish

      - name: Retain complete diagnostic originals and inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-windows-diagnostic3-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 90
