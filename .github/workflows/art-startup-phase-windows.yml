name: Art Windows startup phase observation
on:
  pull_request:
    paths:
      - 'tools/fixtures/art_startup_phase_probe.gd'
      - 'tools/ci/run_art_startup_phase_probe.py'
      - 'docs/audits/2026-11-25-art-startup-phase-probe/windows-bcc.md'
      - '.github/workflows/art-startup-phase-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: art-startup-phase-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-phases:
    name: Three source-pinned render and profile-cache observations
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout exact diagnostic source and application ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Materialize source-matched native runtime
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'LFS materialization failed' }
      - name: Authenticate official Godot 4.7
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot-win47-startup.zip'
          curl.exe -fL --retry 3 -o $zip 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $expected = '41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9'
          if ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected) { throw 'Godot checksum mismatch' }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'godot-win47-startup')
          'GODOT_EXE=' + (Join-Path $env:RUNNER_TEMP 'godot-win47-startup/Godot_v4.7-stable_win64_console.exe') | Out-File -Append -FilePath $env:GITHUB_ENV
      - name: Observe render intervals with fresh and reused profiles and headless control
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $failedArms = [System.Collections.Generic.List[string]]::new()
          $arms = @(
            @{ label='graphical-first'; options=@('--graphical') },
            @{ label='graphical-reused-profile'; options=@('--graphical','--profile-from','evidence/graphical-first') },
            @{ label='headless-after-graphical'; options=@() }
          )
          foreach ($arm in $arms) {
            $options = @($arm.options)
            python tools/ci/run_art_startup_phase_probe.py --godot $env:GODOT_EXE --output "evidence/$($arm.label)" --label $arm.label @options *> "evidence/$($arm.label).wrapper.log"
            if ($LASTEXITCODE -ne 0) { $failedArms.Add($arm.label) }
            Get-Content "evidence/$($arm.label).wrapper.log"
          }
          if ($failedArms.Count -gt 0) { throw ('Startup observation failed: ' + ($failedArms -join ', ')) }
      - name: Preserve every original observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-windows-startup-phases-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
