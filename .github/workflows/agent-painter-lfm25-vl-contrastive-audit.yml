name: LFM2.5-VL retrospective native evidence audit (no model or engine execution)
on:
  push:
    branches: [codex/agent-painter-lfm25-vl-568]
    paths:
      - 'experiments/agent_painter/lanes/lfm25_vl/contrastive-audit-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: lfm25-native-retrospective-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit-original-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact source, one-shot audit and no training
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("experiments/agent_painter/lanes/lfm25_vl/contrastive-audit-request.json")
          r=json.loads(p.read_text())
          assert r["schema"] == "cybersand.lfm25_vl.native-original-audit/1"
          assert r["sequence"] == 1
          assert r["original_artifact"] == 14111581483
          assert r["original_run"] == 43587733967
          assert r["no_training"] is r["no_new_native"] is r["no_admission"] is r["no_final"] is True
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/lfm-retrospective-policy.json
      - name: Install model-free image verifier
        run: python3 -m pip install --user 'Pillow==13.0.0'
      - name: Prove narrow alias repair refusal with unit tests
        run: |
          python3 -m compileall -q experiments/agent_painter/lanes/lfm25_vl/contrastive_audit_existing.py
          PYTHONPATH=experiments/agent_painter/lanes/lfm25_vl python3 -m unittest -v test_contrastive_audit_existing
      - name: Fetch original Actions ZIP (independent outer SHA, not extracted proxy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/lfm-original-audit
          curl --fail --location --silent --show-error --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/techrote/cybersand/actions/artifacts/14111581483/zip' \
            --output evidence/lfm-original-audit/original.zip
          echo 'e90014c8883bb89e1caaebfdb00cf28f2078604553a6b8de803e6caf9305aebf  evidence/lfm-original-audit/original.zip' | sha256sum -c --strict
      - name: Reverify all six original physical paintings from receipt chain
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/lanes/lfm25_vl/contrastive_audit_existing.py \
            --archive evidence/lfm-original-audit/original.zip \
            --disposition experiments/agent_painter/lanes/lfm25_vl/contrastive_disposition.json \
            --output evidence/lfm-original-audit/verified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lfm25-native-retrospective-${{ github.sha }}-${{ github.run_id }}
          path: |
            evidence/lfm-original-audit/verified/
            /tmp/lfm-retrospective-policy.json
          if-no-files-found: warn
          retention-days: 90
