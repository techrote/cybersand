name: Current-main integrated gameplay acceptance

on:
  push:
    branches: [qualification/physics-worker-1v4-20261107]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: current-main-gameplay-acceptance-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTERED_MAIN: 1f82dac1cebc9b38a319153354e4bcc774289417
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
  GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
  GODOT_WINDOWS_SHA512: 41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9
  GODOT_SILENCE_ROOT_WARNING: '1'
  PYTHONUTF8: '1'

defaults:
  run:
    shell: bash

jobs:
  source-guard:
    name: prove qualification-only delta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact qualification head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Verify registered main and qualification surface
        run: |
          set -euo pipefail
          test "$(git rev-parse "$REGISTERED_MAIN")" = "$REGISTERED_MAIN"
          python3 tools/ci/current_main_gameplay_acceptance.py verify-source --expected-base "$REGISTERED_MAIN" --output build/current-main-source-identity.json
          python3 tools/ci/test_current_main_gameplay_acceptance.py
          python3 tools/ci/check_ci_provider_policy.py
          git diff --check "$REGISTERED_MAIN"...HEAD
      - name: Retain source-boundary proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-main-gameplay-source-${{ github.run_id }}
          path: build/current-main-source-identity.json
          retention-days: 90
          if-no-files-found: error

  windows-build:
    name: fresh source-matched Windows native build
    needs: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact qualification head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Reconfirm production source is registered main
        run: |
          set -euo pipefail
          python3 tools/ci/current_main_gameplay_acceptance.py verify-source --expected-base "$REGISTERED_MAIN" --output build/source-identity.json
      - name: Install pinned SCons
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'
      - name: Check out exact godot-cpp
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
      - name: Prepare exact LLVM-MinGW
        run: |
          set -euo pipefail
          timeout 10m curl --fail --location --retry 3 --connect-timeout 60 --max-time 600 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          test -x "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-g++"
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then
            ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
          fi
      - name: Build exact Windows extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
        run: |
          set -euo pipefail
          python3 tools/ci/run_timed_command.py --policy-key native_compile_seconds --label godot-cpp-windows --output-dir build/current-main-runtime/build-timing/godot-cpp -- tools/build_pinned_godot_cpp.sh windows
          python3 tools/ci/run_timed_command.py --policy-key native_compile_seconds --label extension-windows --output-dir build/current-main-runtime/build-timing/extension -- tools/build_native_extension_windows.sh
          mkdir -p build/current-main-runtime
          cp "$CYBERSAND_NATIVE_OUTPUT" build/current-main-runtime/cybersand_native.windows.x86_64.dll
          file "$CYBERSAND_NATIVE_OUTPUT" | tee build/current-main-runtime/file.txt
          grep -q 'PE32+ executable (DLL).*x86-64' build/current-main-runtime/file.txt
          "$LLVM_MINGW_ROOT/bin/llvm-objdump" -p "$CYBERSAND_NATIVE_OUTPUT" > build/current-main-runtime/imports.txt
          cp build/source-identity.json build/current-main-runtime/
          {
            echo "registered_main=$REGISTERED_MAIN"
            echo "qualification_head=$GITHUB_SHA"
            echo "godot_cpp_commit=$GODOT_CPP_COMMIT"
            echo "scons=4.10.1"
            "$WINDOWS_CXX" --version | head -n 1
            "$LLVM_MINGW_ROOT/bin/ld.lld" --version
          } > build/current-main-runtime/toolchain.txt
          (
            cd build/current-main-runtime
            sha256sum cybersand_native.windows.x86_64.dll > runtime.sha256
            sha256sum --check --strict runtime.sha256
          )
      - name: Retain reproducible Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-main-gameplay-windows-runtime-${{ github.run_id }}
          path: build/current-main-runtime/
          retention-days: 90
          if-no-files-found: error

  windows-acceptance:
    name: same-host Godot 1-4-4-1 ABBA, three workbench canvases
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Check out exact qualification head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact fresh Windows build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-main-gameplay-windows-runtime-${{ github.run_id }}
          path: build/current-main-runtime
      - name: Materialize retained Windows Rapier and install fresh CyberSand runtime
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          echo "b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7  godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" | sha256sum --check --strict
          (cd build/current-main-runtime && sha256sum --check --strict runtime.sha256)
          cp build/current-main-runtime/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll
          test "$(git rev-parse "$REGISTERED_MAIN^{tree}")" = "ea78c459535b7806de8e200656aa78f97de539e4"
          python tools/ci/current_main_gameplay_acceptance.py verify-source --expected-base "$REGISTERED_MAIN"
      - name: Download and authenticate Godot 4.7 Windows
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 --output "$RUNNER_TEMP/godot.zip" "$GODOT_WINDOWS_URL"
          python - <<'PY'
          import hashlib, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"godot.zip"
          actual=hashlib.sha512(p.read_bytes()).hexdigest()
          expected=os.environ["GODOT_WINDOWS_SHA512"]
          assert actual == expected, (actual, expected)
          print("Godot archive SHA-512", actual)
          PY
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(cygpath -u "$RUNNER_TEMP")/godot/Godot_v4.7-stable_win64_console.exe"
          "$GODOT" --version
          sha256sum "$GODOT"
      - name: Four source-matched Godot processes on ONE Windows machine
        env:
          CYBERSAND_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          E="$(cygpath -u "$RUNNER_TEMP")/current-main-gameplay-abba"
          GODOT="$(cygpath -u "$RUNNER_TEMP")/godot/Godot_v4.7-stable_win64_console.exe"
          mkdir -p "$E"
          cp build/current-main-runtime/source-identity.json "$E/source-identity.json"
          cp build/current-main-runtime/runtime.sha256 "$E/runtime.sha256"
          cp build/current-main-runtime/toolchain.txt "$E/toolchain.txt"
          cp godot/tests/current_main_gameplay_acceptance.gd "$E/current_main_gameplay_acceptance.gd"
          {
            printf 'runner=%s\nos=%s\narchitecture=%s\nrun=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_RUN_ID"
            printf 'qualification_head=%s\nregistered_main=%s\n' "$GITHUB_SHA" "$REGISTERED_MAIN"
            echo 'same_host=one_windows_2022_job'
            echo 'process_order=1,4,4,1'
          } > "$E/host.txt"
          powershell.exe -NoProfile -Command 'Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List' > "$E/cpu.txt"
          printf '%s\n' 'Source-matched workbench (my, bench, stress) three ~60s profiles per fresh Godot process. Four runs on ONE Windows runner in 1,4,4,1 sequence. Each process has independent native World/Rapier state, actual participant sampling, exact Water ledger and screenshots. Same-host ABBA does NOT establish equal tick-count physical-state parity, main-thread CPU time or human feel.' > "$E/REPRODUCE.md"
          workers=(1 4 4 1)
          FAIL=0
          for i in 0 1 2 3; do
            w="${workers[$i]}"
            ARM="$E/arm-$i-w$w"
            mkdir -p "$ARM"
            cp "$E/source-identity.json" "$ARM/source-identity.json"
            cp "$E/runtime.sha256" "$ARM/runtime.sha256"
            printf 'arm_index=%s\nworkers=%s\nrunner=%s\nsource=%s\n' "$i" "$w" "$RUNNER_NAME" "$GITHUB_SHA" > "$ARM/REPRODUCE.txt"
            export CYBERSAND_GAMEPLAY_ACCEPTANCE_OUTPUT="$(cygpath -w "$ARM")"
            export CYBERSAND_GAMEPLAY_ACCEPTANCE_WORKERS="$w"
            echo "START same-host arm=$i workers=$w runner=$RUNNER_NAME"
            set +e
            "$GODOT" --verbose --rendering-method gl_compatibility --rendering-driver opengl3_angle --path godot --script res://tests/current_main_gameplay_acceptance.gd > "$ARM/godot.log" 2>&1
            rc=$?
            set -e
            if test -f "$ARM/results.json"; then
              set +e
              python tools/ci/current_main_gameplay_acceptance.py summarize --input "$ARM/results.json" --output "$ARM/SUMMARY.md" --csv "$ARM/summary.csv" --qualification "$ARM/qualification.json" > "$ARM/summarize.log" 2>&1
              sr=$?
              set -e
            else
              sr=1
              echo 'Results missing; inspect original Godot log' > "$ARM/SUMMARY.md"
            fi
            printf 'godot_exit=%s\nsummary_exit=%s\n' "$rc" "$sr" > "$ARM/exit-status.txt"
            if test "$rc" -ne 0 || test "$sr" -ne 0; then
              FAIL=1
              echo "REPAIR arm=$i workers=$w exit=$rc summary=$sr"
              tail -n 40 "$ARM/godot.log" || true
            else
              echo "PASS arm=$i workers=$w"
            fi
          done
          set +e
          python - "$E" <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools/ci")
          import current_main_gameplay_acceptance as qa
          root = Path(sys.argv[1])
          order = (1, 4, 4, 1)
          problems, runs = [], []
          for i, w in enumerate(order):
              p = root / f"arm-{i}-w{w}" / "results.json"
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  verdict, errors = qa.evaluate(data)
                  if data.get("configured_native_workers") != w:
                      problems.append(f"arm {i}: wrong worker configuration")
                  if verdict != "ACCEPT":
                      problems.extend(f"arm {i}: {e}" for e in errors)
                  runs.append(data)
              except (OSError, ValueError) as e:
                  problems.append(f"arm {i}: missing/unreadable actual gameplay results: {e}")
          identity = {(r.get("source_revision"),r.get("registered_main"),
                       r.get("godot"),r.get("platform"),r.get("display_server")) for r in runs}
          if len(runs) != 4 or len(identity) != 1:
              problems.append("same-source Godot/runtime identity incomplete or mismatched across arms")
          lines = ["# Current-main same-Windows-runner ABBA 1-4-4-1", "",
                   "**Functional verdict: " + ("REPAIR" if problems else "ACCEPT") + "; tuning decision: HOLD.**",
                   "", "Four fresh Godot processes on one runner. Each profile runs ~60 seconds.",
                   "Comparisons are descriptive: unequal physics tick counts and no owner-thread CPU-time samples.",
                   ""]
          report = {"schema":"cybersand-physics-same-host-abba-v1","source":runs[0].get("source_revision") if len(runs)==4 else None,
                    "registered_main":qa.BASE_MAIN,"workers":list(order),"verdict":"REPAIR" if problems else "ACCEPT",
                    "performance_decision":"HOLD","problems":problems,"profiles":{}}
          for profile in qa.REQUIRED_PROFILES:
              armrows = [next((x for x in r.get("profiles",[]) if x.get("name")==profile),{}) for r in runs]
              metrics = {}
              for label,field,percentile in (
                      ("native tick p50 ms","native_tick_ms","p50"),
                      ("native tick p95 ms","native_tick_ms","p95"),
                      ("frame interval p95 ms","process_interval_ms","p95"),
                      ("Main process callback wall p95 ms","process_callback_ms","p95"),
                      ("Main snapshot consume wall p95 ms","snapshot_consume_ms","p95"),
                      ("Main terrain gate wall p95 ms","main_workbench_terrain_gate_ms","p95"),
                      ("Rapier callback wall p95 ms","physics_callback_ms","p95")):
                  metrics[label] = [round(qa.stat(row,field,percentile),3) for row in armrows]
              metrics["native tick Hz"] = [round(float(row.get("completed_native_hz",0)),3) for row in armrows]
              metrics["Rapier tick Hz"] = [round(float(row.get("completed_rapier_hz",0)),3) for row in armrows]
              metrics["observed claimants"] = [int(row.get("workers_observed_max",-1)) for row in armrows]
              metrics["Water mismatches"] = [int(row.get("water_mismatches",-1)) for row in armrows]
              report["profiles"][profile] = metrics
              lines += [f"## {profile}","",
                        "| Actual measure | w1 first | w4 first | w4 second | w1 second |",
                        "|---|---:|---:|---:|---:|"]
              for label, samples in metrics.items():
                  lines.append(f"| {label} | " + " | ".join(map(str,samples)) + " |")
              lines.append("")
          lines += ["## Interpretation boundaries","",
                    "- No default tuning/merge or claim of speedup follows from these measurements.",
                    "- Godot callback elapsed wall time is not owner-thread CPU time.",
                    "- Final materials occur at different ticks, so are not identical-state parity controls.",
                    "- Every individual process must show native/Rapier progress, exact Water accounting and graphical captures.",
                    "- Independent physical state/impulse parity, real target PC and human feel remain unqualified."]
          if problems: lines += ["","## REPAIR"] + [f"- {p}" for p in problems]
          (root/"CAMPAIGN.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          (root/"campaign.json").write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"verdict":report["verdict"],"problems":problems},indent=2))
          sys.exit(1 if problems else 0)
          PY
          rc_campaign=$?
          set -e
          python - "$E" <<'PY'
          import hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          rows=[]
          for p in sorted(p for p in root.rglob("*") if p.is_file() and p.name!="SHA256SUMS.txt"):
              rows.append(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.relative_to(root).as_posix())
          (root/"SHA256SUMS.txt").write_text("\n".join(rows)+"\n",encoding="utf-8")
          print("evidence files",len(rows))
          PY
          if test "$FAIL" -ne 0 || test "$rc_campaign" -ne 0; then exit 1; fi
      - name: Preserve all original ABBA evidence including failed arms
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-main-gameplay-same-host-abba-${{ github.run_id }}
          path: ${{ runner.temp }}/current-main-gameplay-abba/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
