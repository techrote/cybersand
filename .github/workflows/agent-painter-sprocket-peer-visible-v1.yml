name: SPROCKET pinned peer and visible-split semantic research screen
on:
  push:
    branches: [codex/agent-painter-sprocket-568]
    paths:
      - experiments/agent_painter/lanes/sprocket/peer-visible-v1-request.json
permissions:
  contents: read
  actions: read
concurrency:
  group: sprocket-peer-visible-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read-only-peer-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce explicit one-shot request, source and hosting policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$GITHUB_REF" = "refs/heads/codex/agent-painter-sprocket-568"
          python3 - <<'PY'
          import json
          req=json.load(open("experiments/agent_painter/lanes/sprocket/peer-visible-v1-request.json"))
          assert req == {
            "schema": "cybersand.sprocket-pinned-peer-visible-request/1",
            "sequence": 1,
            "native_corpus_run": 43506373969,
            "native_source_sha": "633920373a3d406a2ede61ce4137c324f76be23b",
            "expected_pinned_peers": 4,
            "expected_comparison_pairs": 5,
            "train_read": True, "development_read": True,
            "final_targets_opened": False,
            "model_load": False, "optimizer_updates": 0,
            "native_art_execution": False, "shared_train_admission": False,
            "draft_hold": True,
          }
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/sprocket-peer-ci-policy.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-painter-native-633920373a3d406a2ede61ce4137c324f76be23b
          run-id: '43506373969'
          github-token: ${{ github.token }}
          path: evidence/source633
      - name: Offline adversarial tests and original-corpus/pinned-peer screen
        run: |
          set -euo pipefail
          mkdir -p evidence/sprocket-peer-visible-v1
          trap 'printf "SOURCE_ONLY_SCREEN_FAILED\n" > evidence/sprocket-peer-visible-v1/failure.txt' ERR
          python3 -m unittest discover -s experiments/agent_painter/lanes/sprocket -p 'test_peer_visible_witness_v1.py' -v
          python3 experiments/agent_painter/lanes/sprocket/peer_visible_witness_v1.py \
            --corpus evidence/source633/corpus \
            --output evidence/sprocket-peer-visible-v1/report.json
          python3 - <<'PY'
          import json
          r=json.load(open("evidence/sprocket-peer-visible-v1/report.json"))
          assert len(r["pinned_peer_sources"])==4
          assert len(r["comparisons"])==5
          assert len(r["original_visible_groups"])==12
          assert r["opened_partitions"]==["TRAIN","DEVELOPMENT"]
          assert not r["reviewer_approved"] and not r["final_targets_opened"]
          assert r["shared_train_groups_admitted"]==0
          assert r["optimizer_updates"]==r["model_generated_views"]==r["new_native_views"]==0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-peer-visible-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/sprocket-peer-visible-v1/
          if-no-files-found: warn
          retention-days: 90
