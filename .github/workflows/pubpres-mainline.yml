name: PUBPRES mainline convergence and source-exact qualification

on:
  push:
    branches: [codex/pubpres-playability-final-001-20261124]
    paths: ['.github/pubpres-mainline-run.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: pubpres-mainline-${{ github.run_id }}
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_CONFIG_KEY_1: core.eol
  GIT_CONFIG_VALUE_1: lf
  PYTHONUTF8: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'
  PUBPRES_MAIN: 50e3bcb839211eac2abe1e065750cbcba4d36f8c
  PUBPRES_OWNER: 9f2127256a555d177536cbb5fad2be7dcb322c8e
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      phase: ${{ steps.request.outputs.phase }}
      general_performance_status: ${{ steps.request.outputs.general_performance_status }}
      runtime_run: ${{ steps.request.outputs.runtime_run }}
      runtime_attempt: ${{ steps.request.outputs.runtime_attempt }}
      runtime_source: ${{ steps.request.outputs.runtime_source }}
      qualification_run: ${{ steps.request.outputs.qualification_run }}
      qualification_attempt: ${{ steps.request.outputs.qualification_attempt }}
      qualification_source: ${{ steps.request.outputs.qualification_source }}
      publication_commit: ${{ steps.request.outputs.publication_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Admit exact principal source, accepted main and physical owner reference
        id: request
        run: |
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m unittest discover -s tools/pubpres_mainline -p 'test_*.py'
          python3 tools/pubpres_mainline/request.py

  runtimes:
    needs: admission
    if: needs.admission.outputs.phase == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [linux, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Stage three independent source roles and one pinned dependency
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/pubpres-main" "$PUBPRES_MAIN"
          git worktree add --detach "$RUNNER_TEMP/pubpres-owner" "$PUBPRES_OWNER"
          python3 -m venv "$RUNNER_TEMP/pubpres-scons"
          "$RUNNER_TEMP/pubpres-scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          git init "$RUNNER_TEMP/pubpres-godot-cpp"
          git -C "$RUNNER_TEMP/pubpres-godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          git -C "$RUNNER_TEMP/pubpres-godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/pubpres-godot-cpp" checkout --detach FETCH_HEAD
      - name: Acquire exact Windows cross compiler
        if: matrix.platform == 'windows'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 300 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/pubpres-llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/pubpres-llvm-mingw" --strip-components=1
          ln -s llvm-ar "$RUNNER_TEMP/pubpres-llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
      - name: Build independent accepted-main, owner-evaluated and integrated native runtimes
        env:
          PLATFORM: ${{ matrix.platform }}
          GODOT_CPP_ROOT: ${{ runner.temp }}/pubpres-godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/pubpres-scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          LLVM_MINGW_ROOT: ${{ runner.temp }}/pubpres-llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/pubpres-llvm-mingw/bin/x86_64-w64-mingw32-g++
          PUBPRES_GODOT_CPP_BUILD_LOG: build/mainline-runtimes/godot-cpp.log
        run: |
          set -euo pipefail
          mkdir -p build/mainline-runtimes
          timeout 2400 bash tools/build_pinned_godot_cpp.sh "$PLATFORM" > build/mainline-runtimes/godot-cpp.log 2>&1
          status=0
          python3 tools/pubpres_playability_build/build_runtime.py --platform "$PLATFORM" --source-root "$RUNNER_TEMP/pubpres-main" --source-sha "$PUBPRES_MAIN" --output-dir build/mainline-runtimes/M || status=1
          python3 tools/pubpres_playability_build/build_runtime.py --platform "$PLATFORM" --source-root "$RUNNER_TEMP/pubpres-owner" --source-sha "$PUBPRES_OWNER" --output-dir build/mainline-runtimes/P || status=1
          python3 tools/pubpres_playability_build/build_runtime.py --platform "$PLATFORM" --source-root "$PWD" --source-sha "$GITHUB_SHA" --output-dir build/mainline-runtimes/C || status=1
          if [[ "$status" != '0' ]]; then exit "$status"; fi
          python3 tools/pubpres_mainline/verify_runtimes.py --runtime-root build/mainline-runtimes --accepted-main "$RUNNER_TEMP/pubpres-main" --owner-reference "$RUNNER_TEMP/pubpres-owner" --candidate "$PWD" --platform "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-runtimes-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mainline-runtimes/
          retention-days: 90
          if-no-files-found: warn

  qualification-linux:
    name: qualification-linux-${{ matrix.focus }}
    needs: admission
    if: needs.admission.outputs.phase == 'qualify' || needs.admission.outputs.phase == 'delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        focus: [frozen, water, members, held-placement, mainline, native-owner, selected-water, selected-members, selected-held-placement]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.admission.outputs.runtime_run }}
          name: pubpres-mainline-runtimes-linux-${{ needs.admission.outputs.runtime_run }}-${{ needs.admission.outputs.runtime_attempt }}
          path: runtimes
      - name: Materialize exact Rapier and portable authoring helper
        run: |
          python3 tools/ci/materialize_lfs.py --expected-source "$GITHUB_SHA" --include godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so --include godot/tools/gentek_reciprocal --output "$RUNNER_TEMP/runtime-acquisition.json" --allowance-seconds 600
          chmod +x godot/tools/gentek_reciprocal
      - name: Acquire exact Stock engine and original native-input binding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0
          python3 tools/pubpres_mainline/setup_graphics.py --runtime runtimes/C --output "$RUNNER_TEMP/mainline-graphics"
      - name: Run actual selected qualification population
        env:
          FOCUS: ${{ matrix.focus }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mainline-qualified"
          if [[ "$FOCUS" == 'native-owner' ]]; then
            python3 tools/pubpres_recovery_windows/run_native_owner.py --runtime "$BOUND_RUNTIME" --engine "$GODOT_EXE" --output "$out"
          elif [[ "$FOCUS" == 'mainline' ]]; then
            xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python3 tools/pubpres_mainline/run_focused.py --runtime "$BOUND_RUNTIME" --engine "$GODOT_EXE" --output "$out"
          elif [[ "$FOCUS" == selected-* ]]; then
            xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python3 tools/pubpres_mainline/run_selected_qualification.py --runtime "$BOUND_RUNTIME" --engine "$GODOT_EXE" --output "$out" --focus "${FOCUS#selected-}" --render-thread safe --lookahead 0
          else
            xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python3 tools/pubpres_final_recovery/run_qualification.py --runtime "$BOUND_RUNTIME" --engine "$GODOT_EXE" --output "$out" --focus "$FOCUS" --render-thread safe --lookahead 0
          fi
      - name: Expose bounded original rendered focus evidence
        if: always() && matrix.focus == 'mainline'
        run: python3 tools/pubpres_mainline/print_focus_evidence.py --root "$RUNNER_TEMP/mainline-qualified"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-qualified-linux-${{ matrix.focus }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainline-qualified/
            ${{ runner.temp }}/mainline-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/runtime-acquisition.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

  qualification-windows:
    name: qualification-windows-${{ matrix.focus }}
    needs: admission
    if: needs.admission.outputs.phase == 'qualify' || needs.admission.outputs.phase == 'delivery'
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        focus: [frozen, water, members, held-placement, mainline, native-owner, selected-water, selected-members, selected-held-placement]
    defaults:
      run: {shell: pwsh}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.admission.outputs.runtime_run }}
          name: pubpres-mainline-runtimes-windows-${{ needs.admission.outputs.runtime_run }}-${{ needs.admission.outputs.runtime_attempt }}
          path: runtimes
      - name: Materialize exact Rapier and portable authoring helper
        run: |
          python tools/ci/materialize_lfs.py --expected-source $env:GITHUB_SHA --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --include godot/tools/gentek_reciprocal.exe --output "$env:RUNNER_TEMP/runtime-acquisition.json" --allowance-seconds 600
          if ($LASTEXITCODE -ne 0) { throw 'Source-matched dependency acquisition failed' }
      - name: Acquire exact Stock engine and original native-input binding
        run: |
          python tools/pubpres_mainline/setup_graphics.py --runtime runtimes/C --output "$env:RUNNER_TEMP/mainline-graphics"
          if ($LASTEXITCODE -ne 0) { throw 'Official engine or exact native binding failed' }
      - name: Run actual selected qualification population
        env:
          FOCUS: ${{ matrix.focus }}
        run: |
          $out = "$env:RUNNER_TEMP/mainline-qualified"
          if ($env:FOCUS -eq 'native-owner') {
            python tools/pubpres_recovery_windows/run_native_owner.py --runtime $env:BOUND_RUNTIME --engine $env:GODOT_EXE --output $out
          } elseif ($env:FOCUS -eq 'mainline') {
            python tools/pubpres_mainline/run_focused.py --runtime $env:BOUND_RUNTIME --engine $env:GODOT_EXE --output $out
          } elseif ($env:FOCUS.StartsWith('selected-')) {
            python tools/pubpres_mainline/run_selected_qualification.py --runtime $env:BOUND_RUNTIME --engine $env:GODOT_EXE --output $out --focus $env:FOCUS.Substring(9) --render-thread safe --lookahead 0
          } else {
            python tools/pubpres_final_recovery/run_qualification.py --runtime $env:BOUND_RUNTIME --engine $env:GODOT_EXE --output $out --focus $env:FOCUS --render-thread safe --lookahead 0
          }
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows qualification failed; retain original evidence' }
      - name: Expose bounded original rendered focus evidence
        if: always() && matrix.focus == 'mainline'
        run: python tools/pubpres_mainline/print_focus_evidence.py --root "$env:RUNNER_TEMP/mainline-qualified"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-qualified-windows-${{ matrix.focus }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainline-qualified/
            ${{ runner.temp }}/mainline-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/runtime-acquisition.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

  native:
    needs: admission
    if: needs.admission.outputs.phase == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        kind: [normal, sanitizers, ownership]
    env:
      CXX: g++-13
      CC: gcc-13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Execute native material, Water, lifetime, continuation and ownership gates
        env:
          NATIVE_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          mkdir -p build/mainline-native
          git rev-parse HEAD > build/mainline-native/source.txt
          if [[ "$NATIVE_KIND" == 'normal' ]]; then
            timeout 5400 make test wave-flow-test wave-spill-test wave-body-boundary-test wave-empty-derived-test material-baseline-test persistent-area-test persistent-area-residency-test worker-pool-test > build/mainline-native/normal.log 2>&1
          elif [[ "$NATIVE_KIND" == 'sanitizers' ]]; then
            timeout 5400 env ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1 UBSAN_OPTIONS=halt_on_error=1 make sanitize wave-flow-sanitize wave-body-boundary-sanitize wave-empty-derived-sanitize persistent-area-sanitize persistent-area-residency-sanitize worker-pool-sanitize > build/mainline-native/sanitizers.log 2>&1
          else
            timeout 1800 make worker-pool-thread-sanitize > build/mainline-native/thread-sanitizer.log 2>&1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-native-${{ matrix.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/mainline-native/
          retention-days: 90
          if-no-files-found: warn

  source-gates:
    needs: admission
    if: needs.admission.outputs.phase == 'qualify' || needs.admission.outputs.phase == 'delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run: {working-directory: workspace/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6a58311982941b75f46e22109a0829e5acb83c7e
          path: workspace
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: workspace/source, persist-credentials: false, fetch-depth: 0}
      - name: Check documentation, palette/compiler identity and current source contracts
        env: {CXX: g++-13, CC: gcc-13}
        run: |
          set -euo pipefail
          mkdir -p build/mainline-source
          git rev-parse HEAD > build/mainline-source/source.txt
          python3 tools/ci/check_docs.py > build/mainline-source/docs.json
          python3 tools/ci/check_m11_consistency.py > build/mainline-source/m11.json
          python3 tools/ci/check_ci_provider_policy.py > build/mainline-source/provider.json
          python3 tools/material_catalogue/compatibility.py --check > build/mainline-source/compatibility.json
          python3 tools/material_catalogue/compiler.py --check > build/mainline-source/compiler.json
          python3 tools/material_catalogue/check_native_parity.py --output build/mainline-source/native-parity.json > build/mainline-source/native-parity.log 2>&1
          python3 tools/docs/retrieval_eval.py --output build/mainline-source/retrieval.json > build/mainline-source/retrieval.log
          python3 tools/docs/retrieval_eval.py --queries docs/reference/retrieval-challenges.json --output build/mainline-source/retrieval-challenges.json > build/mainline-source/retrieval-challenges.log
          python3 tools/docs/retrieval_eval.py --queries docs/reference/retrieval-questions-pubpres-mainline.json --output build/mainline-source/retrieval-mainline.json > build/mainline-source/retrieval-mainline.log
          if [[ "${{ needs.admission.outputs.phase }}" == 'delivery' ]]; then
            python3 tools/ci/check_repository.py > build/mainline-source/published-repository.json
          fi
          python3 -m unittest discover -s tools/pubpres_mainline -p 'test_*.py' > build/mainline-source/driver-tests.log 2>&1
          python3 -m unittest discover -s tools/ci -p 'test_portable_compiler_utf8.py' > build/mainline-source/compiler-metadata-tests.log 2>&1
          python3 -m unittest discover -s tools/ci -p 'test_portable_lld.py' > build/mainline-source/linker-custody-tests.log 2>&1
          python3 -m unittest discover -s tools/material_catalogue -p 'test_portable_linker.py' > build/mainline-source/linker-selection-tests.log 2>&1
          python3 tools/ci/test_ramcache_strata_lab_package.py DependencyReceiptTests -v > build/mainline-source/compiler-package-integration-tests.log 2>&1
          python3 -m unittest discover -s tools/ci -p 'test_portable_authoring_environment.py' > build/mainline-source/compiler-environment-tests.log 2>&1
          git diff --check HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-source-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: workspace/source/build/mainline-source/
          retention-days: 90
          if-no-files-found: warn

  features-linux:
    name: features-linux-${{ matrix.mode }}
    needs: admission
    if: needs.admission.outputs.phase == 'qualify' || needs.admission.outputs.phase == 'delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: {mode: [ramcache, strata, shared]}
    env: {LIBGL_ALWAYS_SOFTWARE: '1', LP_NUM_THREADS: '2', CXX: g++-13, CC: gcc-13}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.admission.outputs.runtime_run }}
          name: pubpres-mainline-runtimes-linux-${{ needs.admission.outputs.runtime_run }}-${{ needs.admission.outputs.runtime_attempt }}
          path: runtimes
      - name: Materialize exact dependencies and admit original build
        run: |
          set -euo pipefail
          python3 tools/ci/materialize_lfs.py --expected-source "$GITHUB_SHA" --include godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so --include godot/tools/gentek_reciprocal --output "$RUNNER_TEMP/runtime-acquisition.json" --allowance-seconds 600
          chmod +x godot/tools/gentek_reciprocal
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0
          python3 tools/pubpres_mainline/setup_graphics.py --runtime runtimes/C --output "$RUNNER_TEMP/mainline-graphics"
      - name: Execute complete accepted feature population
        env: {MODE: '${{ matrix.mode }}'}
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' python3 tools/pubpres_mainline/qualification.py run --source "$PWD" --runtime runtimes/C --project "$PWD/godot" --engine "$GODOT_EXE" --mode "$MODE" --output "$RUNNER_TEMP/mainline-feature"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-feature-linux-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainline-feature/
            ${{ runner.temp }}/mainline-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/runtime-acquisition.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

  features-windows:
    name: features-windows-${{ matrix.mode }}
    needs: admission
    if: needs.admission.outputs.phase == 'qualify' || needs.admission.outputs.phase == 'delivery'
    runs-on: windows-2022
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: {mode: [ramcache, strata, shared]}
    defaults:
      run: {shell: pwsh}
    env: {CYBERSAND_LAB_CXX: 'C:\mingw64\bin\g++.exe'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.admission.outputs.runtime_run }}
          name: pubpres-mainline-runtimes-windows-${{ needs.admission.outputs.runtime_run }}-${{ needs.admission.outputs.runtime_attempt }}
          path: runtimes
      - name: Materialize exact dependencies and admit original build
        run: |
          python tools/ci/materialize_lfs.py --expected-source $env:GITHUB_SHA --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --include godot/tools/gentek_reciprocal.exe --output "$env:RUNNER_TEMP/runtime-acquisition.json" --allowance-seconds 600
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency acquisition failed' }
          python tools/pubpres_mainline/setup_graphics.py --runtime runtimes/C --output "$env:RUNNER_TEMP/mainline-graphics"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source/build/engine admission failed' }
      - name: Execute complete accepted feature population
        env: {MODE: '${{ matrix.mode }}'}
        run: |
          python tools/pubpres_mainline/qualification.py run --source "$PWD" --runtime runtimes/C --project "$PWD/godot" --engine $env:GODOT_CONSOLE --mode $env:MODE --output "$env:RUNNER_TEMP/mainline-feature"
          if ($LASTEXITCODE -ne 0) { throw 'Resulting-source Windows feature qualification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-feature-windows-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainline-feature/
            ${{ runner.temp }}/mainline-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/runtime-acquisition.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

  original-local-evidence:
    needs: admission
    if: needs.admission.outputs.phase == 'qualify' || needs.admission.outputs.phase == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Independently verify and preserve original local evidence bytes
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: python3 tools/pubpres_mainline/publish_local_evidence.py --output "$RUNNER_TEMP/original-local-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres-mainline-original-local-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-local-evidence/
          retention-days: 90
          if-no-files-found: error

  publish-qualified-runtime:
    needs: [admission, original-local-evidence]
    if: needs.admission.outputs.phase == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true, fetch-depth: 0}
      - name: Replay original source gates and publish exactly four runtime paths
        env:
          PUBPRES_PUBLICATION_TOKEN: ${{ github.token }}
          PUBPRES_ALLOW_RUNTIME_PUBLICATION: four-path-principal-fast-forward-v1
        run: python3 tools/pubpres_mainline/publish_runtime.py --output "$RUNNER_TEMP/guarded-runtime-publication" --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-guarded-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guarded-runtime-publication/PUBLICATION.json
          retention-days: 90
          if-no-files-found: warn

# Append under jobs in the source-owned PUBPRES workflow. All outputs are from
# this exact delivery run; no old-source feature evidence is reused. Performance,
# spawn and sustained outcomes remain separate final-disposition requirements.
  package-windows:
    name: Complete source-exact Windows evaluator
    needs: [admission, source-gates, qualification-linux, qualification-windows, features-linux, features-windows]
    if: needs.admission.outputs.phase == 'delivery'
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run: {shell: pwsh}
    env:
      JAVA_HOME: ''
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      inner_sha256: ${{ steps.package.outputs.inner_sha256 }}
      inner_bytes: ${{ steps.package.outputs.inner_bytes }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      artifact_digest: ${{ steps.archive.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 0, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.admission.outputs.runtime_run }}
          name: pubpres-mainline-runtimes-windows-${{ needs.admission.outputs.runtime_run }}-${{ needs.admission.outputs.runtime_attempt }}
          path: ${{ runner.temp }}/mainline-package-runtimes
      - name: Download all three original current-source Windows feature records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pubpres-mainline-feature-windows-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainline-package-features
          merge-multiple: false
      - name: Admit final source, published runtime bytes and exact engine
        run: |
          python tools/pubpres_mainline/request.py
          if ($LASTEXITCODE -ne 0) { throw 'Final sealed delivery request refused' }
          python tools/ci/materialize_lfs.py --expected-source $env:GITHUB_SHA --include godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --include godot/tools/gentek_reciprocal.exe --output "$env:RUNNER_TEMP/package-runtime-acquisition.json" --allowance-seconds 600
          if ($LASTEXITCODE -ne 0) { throw 'Source-exact published runtime/dependency acquisition failed' }
          python tools/pubpres_mainline/setup_graphics.py --runtime "$env:RUNNER_TEMP/mainline-package-runtimes/C" --output "$env:RUNNER_TEMP/mainline-package-graphics"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source/build/engine admission failed' }
          python -m unittest discover -s tools/pubpres_mainline -p test_evaluator_boundaries.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Portable delivery integrity/refusal controls failed' }
      - name: Acquire pinned offline GNU-compatible linker input
        run: |
          $env:CYBERSAND_PORTABLE_LLD_ARCHIVE = Join-Path $env:RUNNER_TEMP 'pubpres-llvm-mingw-20260826-ucrt-x86_64.zip'
          "CYBERSAND_PORTABLE_LLD_ARCHIVE=$env:CYBERSAND_PORTABLE_LLD_ARCHIVE" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_ENV
          curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 300 --silent --show-error --output $env:CYBERSAND_PORTABLE_LLD_ARCHIVE https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Pinned linker archive acquisition failed' }
          $archive = Get-Item -LiteralPath $env:CYBERSAND_PORTABLE_LLD_ARCHIVE
          $digest = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archive.Length -ne 190721391 -or $digest -ne 'ae601f4e0f72bbdf441ad2df8bb16f037e2e9251559ea6b37b4057aef39c06c3') { throw 'Pinned linker archive identity differs' }
      - name: Stage accepted licensed portable dependency inputs
        run: |
          $notices = Join-Path $env:RUNNER_TEMP 'mainline-package-notices'
          New-Item -ItemType Directory -Path $notices | Out-Null
          foreach ($name in @('LICENSE.txt','COPYRIGHT.txt')) {
            curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output (Join-Path $notices $name) "https://raw.githubusercontent.com/godotengine/godot/5b4e0cb0f/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot licence/notice acquisition failed' }
          }
          $runtimeLicense = Join-Path $notices 'Microsoft-Visual-C-Runtime-LICENSE.docx'
          $developerLicense = Join-Path $notices 'Microsoft-Visual-Studio-2022-LICENSE.docx'
          curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output $runtimeLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/09/Visual-C-Runtime-2015-2022-License-1.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Microsoft runtime licence acquisition failed' }
          curl.exe --fail --location --retry 3 --connect-timeout 30 --max-time 180 --output $developerLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Microsoft redistribution licence acquisition failed' }
          & tools/ci/stage_windows_vc_runtime.ps1 -Output "$env:RUNNER_TEMP/mainline-package-vc" -License $runtimeLicense -DeveloperLicense $developerLicense
          if ($LASTEXITCODE -ne 0) { throw 'Signed licensed Visual Studio release runtime staging failed' }
      - name: Replay source-bound original feature receipts and build the complete evaluator
        id: package
        run: |
          @'
          import json, os, pathlib, sys
          root = pathlib.Path.cwd().resolve()
          sys.path.insert(0, str(root / 'tools/pubpres_mainline'))
          import common, qualification, package
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          runtime = temporary / 'mainline-package-runtimes/C'
          package.publication_identity(root, runtime)
          common.install_runtime(root, runtime, root / 'godot', 'windows')
          gates = {}
          for mode in ('ramcache', 'strata', 'shared'):
              folder = temporary / 'mainline-package-features' / ('pubpres-mainline-feature-windows-' + mode + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              matches = list(folder.rglob(qualification.MANIFEST))
              common.require(len(matches) == 1, 'Missing or ambiguous original current-source feature record: ' + mode)
              record = qualification.verify(root, runtime, root / 'godot', matches[0].parent, 'windows')
              common.require(record['mode'] == mode and record['source']['source_commit'] == os.environ['GITHUB_SHA'], 'Foreign feature source/mode')
              gates[mode] = str(matches[0].parent)
          common.write_json(temporary / 'mainline-package-gates.json', gates)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Independent original same-source Windows feature replay refused' }
          $gates = Get-Content -Raw "$env:RUNNER_TEMP/mainline-package-gates.json" | ConvertFrom-Json
          $archive = "$env:RUNNER_TEMP/mainline-delivery/archive/CyberSand-PUBPRES-Mainline-Windows-$($env:GITHUB_SHA.Substring(0,12)).zip"
          python tools/pubpres_mainline/package.py build --source "$PWD" --runtime "$env:RUNNER_TEMP/mainline-package-runtimes/C" --project "$PWD/godot" --godot-zip $env:GODOT_ARCHIVE --vc-runtime "$env:RUNNER_TEMP/mainline-package-vc" --notices "$env:RUNNER_TEMP/mainline-package-notices" --output "$env:RUNNER_TEMP/mainline-delivery/evaluator" --archive $archive --qualification $gates.ramcache --qualification $gates.strata --qualification $gates.shared
          if ($LASTEXITCODE -ne 0) { throw 'Complete source-exact portable evaluator build refused' }
          $receipt = Get-Content -Raw ($archive + '.json') | ConvertFrom-Json
          if ($receipt.source_commit -ne $env:GITHUB_SHA -or $receipt.archive_sha256 -notmatch '^[a-f0-9]{64}$' -or $receipt.archive_bytes -le 0) { throw 'Final inner archive identity differs' }
          "inner_sha256=$($receipt.archive_sha256)" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          "inner_bytes=$($receipt.archive_bytes)" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
          "manifest_sha256=$($receipt.manifest_sha256)" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_OUTPUT
      - name: Publish source-exact evaluator archive for separate independent extraction
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres-mainline-windows-evaluator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainline-delivery/archive/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve package custody evidence even after refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres-mainline-package-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainline-package-gates.json
            ${{ runner.temp }}/package-runtime-acquisition.json
            ${{ runner.temp }}/mainline-package-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/mainline-delivery/evaluator/PUBPRES-MAINLINE-EVALUATOR.json
            ${{ runner.temp }}/mainline-delivery/archive/*.json
          if-no-files-found: warn
          retention-days: 90

  extracted-windows:
    name: Independent extracted Windows application and authoring
    needs: [admission, package-windows]
    if: needs.admission.outputs.phase == 'delivery'
    runs-on: windows-2022
    # Each unchanged production witness retains its own registered deadline.
    # This aggregate ceiling does not extend a failed individual test.
    timeout-minutes: 160
    defaults:
      run: {shell: pwsh}
    env:
      JAVA_HOME: ''
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_INNER_SHA256: ${{ needs.package-windows.outputs.inner_sha256 }}
      EXPECTED_INNER_BYTES: ${{ needs.package-windows.outputs.inner_bytes }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.package-windows.outputs.manifest_sha256 }}
      EXPECTED_ARTIFACT_ID: ${{ needs.package-windows.outputs.artifact_id }}
      EXPECTED_ARTIFACT_DIGEST: ${{ needs.package-windows.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 0, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Independently authenticate current-run evaluator artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:EXPECTED_ARTIFACT_ID -notmatch '^[0-9]+$' -or $env:EXPECTED_ARTIFACT_DIGEST -notmatch '^[a-f0-9]{64}$') { throw 'Missing exact uploaded artifact identity' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $artifact = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/techrote/cybersand/actions/artifacts/$env:EXPECTED_ARTIFACT_ID"
          $expectedName = "pubpres-mainline-windows-evaluator-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($artifact.name -ne $expectedName -or $artifact.expired -or $artifact.digest -ne "sha256:$env:EXPECTED_ARTIFACT_DIGEST" -or $artifact.workflow_run.id -ne [long]$env:GITHUB_RUN_ID -or $artifact.workflow_run.head_sha -ne $env:GITHUB_SHA) { throw 'Independent live artifact metadata identifies a different source/run/archive' }
          $artifact | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/evaluator-download-admission.json"
      - name: Independently download the actual owner archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pubpres-mainline-windows-evaluator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainline-independent-archive
      - name: Verify independent inner archive identity
        run: |
          @'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mainline-independent-archive'
          archives = list(root.glob('*.zip'))
          assert len(archives) == 1, 'Missing or ambiguous delivered inner ZIP'
          archive = archives[0]
          with archive.open('rb') as stream: actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert actual == os.environ['EXPECTED_INNER_SHA256'] and archive.stat().st_size == int(os.environ['EXPECTED_INNER_BYTES']), 'Independent inner ZIP hash/size differs'
          with zipfile.ZipFile(archive) as bundle:
              raw = bundle.read('PUBPRES-MAINLINE-EVALUATOR.json')
              assert hashlib.sha256(raw).hexdigest() == os.environ['EXPECTED_MANIFEST_SHA256'], 'Independent package manifest differs'
              record = json.loads(raw)
              assert record['source_commit'] == os.environ['GITHUB_SHA'] and record['physical_owner_evaluated'] is False and record['merge_authorized'] is False
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('INDEPENDENT_INNER_ARCHIVE=' + str(archive) + '\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Independent exact delivered archive integrity failed' }
      - name: Execute the independently admitted shipped package
        run: |
          python tools/pubpres_mainline/extracted.py --archive $env:INDEPENDENT_INNER_ARCHIVE --sha256 $env:EXPECTED_INNER_SHA256 --installation "$env:RUNNER_TEMP/Owner (PUBPRES) Ω/nested/CyberSand Workbench" --output "$env:RUNNER_TEMP/mainline-extracted"
          if ($LASTEXITCODE -ne 0) { throw 'Actual shipped CMD, portable source/tools, authored persistence or extracted feature qualification failed' }
      - name: Preserve independent extracted original evidence, including refusals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres-mainline-extracted-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainline-extracted/
            ${{ runner.temp }}/evaluator-download-admission.json
            ${{ runner.temp }}/Owner (PUBPRES) Ω/nested/CyberSand Workbench/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

# Append under jobs in the source-owned PUBPRES workflow. Each lane waits for
# all current-source Windows correctness arms. Original raw prerequisite
# artifacts remain immutable; Fire-on runs only on a separately copied project.
  performance-windows:
    name: 'Windows balanced M-P-C comparison (skipped: observer contract repair pending) - ${{ matrix.case }}'
    needs: [admission, qualification-windows]
    # The original three-source campaigns failed registered observation/input
    # contracts. Keep this job visibly skipped until the step-addressed adapter
    # and its positive/negative controls are integrated. Do not award comparison
    # credit to an incomplete or known-invalid cohort.
    if: needs.admission.outputs.general_performance_status == 'qualified'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run: {shell: pwsh}
    env:
      JAVA_HOME: ''
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [wave_512_follow, wave_1024_follow_4, wave_gameplay_2048_follow]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 0, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.admission.outputs.runtime_run }}
          name: pubpres-mainline-runtimes-windows-${{ needs.admission.outputs.runtime_run }}-${{ needs.admission.outputs.runtime_attempt }}
          path: ${{ runner.temp }}/mainline-performance-runtimes
      - name: Download original current-source frozen correctness evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pubpres-mainline-qualified-windows-frozen-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainline-performance-prerequisites/frozen
      - name: Download original current-source broad Water evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pubpres-mainline-qualified-windows-water-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainline-performance-prerequisites/water
      - name: Admit exact source, native cohort, Rapier and official Stock Safe engine
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/pubpres_mainline/request.py
          if ($LASTEXITCODE -ne 0) { throw 'Sealed delivery request refused' }
          python tools/ci/materialize_lfs.py --expected-source $env:GITHUB_SHA --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --include godot/tools/gentek_reciprocal.exe --output "$env:RUNNER_TEMP/performance-runtime-acquisition" --allowance-seconds 600
          if ($LASTEXITCODE -ne 0) { throw 'Exact dependency acquisition failed' }
          python tools/pubpres_mainline/setup_graphics.py --runtime "$env:RUNNER_TEMP/mainline-performance-runtimes/C" --output "$env:RUNNER_TEMP/mainline-performance-graphics"
          if ($LASTEXITCODE -ne 0) { throw 'Exact engine/native admission failed' }
          git worktree add --detach "$env:RUNNER_TEMP/mainline-performance-main" $env:PUBPRES_MAIN
          if ($LASTEXITCODE -ne 0) { throw 'Registered accepted-main checkout failed' }
          git worktree add --detach "$env:RUNNER_TEMP/mainline-performance-owner" $env:PUBPRES_OWNER
          if ($LASTEXITCODE -ne 0) { throw 'Registered owner-reference checkout failed' }
      - name: Execute all six registered M-P-C-C-P-M arms and independent original readers
        env:
          REGISTERED_CASE: ${{ matrix.case }}
        run: |
          $ErrorActionPreference = 'Stop'
          $frozen = @(Get-ChildItem -Recurse -File "$env:RUNNER_TEMP/mainline-performance-prerequisites/frozen" -Filter SUMMARY.json)
          $water = @(Get-ChildItem -Recurse -File "$env:RUNNER_TEMP/mainline-performance-prerequisites/water" -Filter SUMMARY.json)
          if ($frozen.Count -ne 1 -or $water.Count -ne 1) { throw 'Missing or ambiguous original correctness prerequisite' }
          python tools/pubpres_mainline/run_performance.py --main-source "$env:RUNNER_TEMP/mainline-performance-main" --owner-source "$env:RUNNER_TEMP/mainline-performance-owner" --main-runtime "$env:RUNNER_TEMP/mainline-performance-runtimes/M" --owner-runtime "$env:RUNNER_TEMP/mainline-performance-runtimes/P" --runtime $env:BOUND_RUNTIME --engine $env:GODOT_EXE --rapier-runtime "$PWD/godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --frozen-correctness $frozen[0].FullName --water-correctness $water[0].FullName --output "$env:RUNNER_TEMP/mainline-performance" --case $env:REGISTERED_CASE
          if ($LASTEXITCODE -ne 0) { throw 'Registered comparison or equal-step physical/input parity failed; retain every adverse arm' }
      - name: Preserve all timing traces, reducers, process resources and failed-arm projects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres-mainline-performance-windows-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainline-performance/
            !${{ runner.temp }}/mainline-performance/template-M/project/
            !${{ runner.temp }}/mainline-performance/template-P/project/
            !${{ runner.temp }}/mainline-performance/template-C/project/
            ${{ runner.temp }}/mainline-performance-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/performance-runtime-acquisition/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

