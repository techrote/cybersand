          python tools/ci/materialize_lfs.py --expected-source $env:GITHUB_SHA --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --include godot/tools/gentek_reciprocal.exe --output "$env:RUNNER_TEMP/sustained-runtime-acquisition" --allowance-seconds 600
          if ($LASTEXITCODE -ne 0) { throw 'Exact dependency acquisition failed' }
          python tools/pubpres_mainline/setup_graphics.py --runtime "$env:RUNNER_TEMP/mainline-sustained-runtimes/C" --output "$env:RUNNER_TEMP/mainline-sustained-graphics"
          if ($LASTEXITCODE -ne 0) { throw 'Exact engine/native admission failed' }
      - name: Run original 300-second actions, CPU/RSS observer and reducer with selected policies
        env:
          REGISTERED_CASE: ${{ matrix.case }}
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/pubpres_mainline/run_sustained.py --runtime $env:BOUND_RUNTIME --stock-engine $env:GODOT_EXE --output "$env:RUNNER_TEMP/mainline-sustained" --case $env:REGISTERED_CASE
          if ($LASTEXITCODE -ne 0) { throw 'Original five-minute sustained workload or selected-policy admission failed' }
      - name: Preserve complete sustained actions, diagnostic segments and resource observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres-mainline-sustained-windows-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainline-sustained/
            ${{ runner.temp }}/mainline-sustained-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/sustained-runtime-acquisition/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  fire-on-windows:
    name: Windows original 90-second Fire-on owner patrols
    needs: [admission, qualification-windows]
    if: needs.admission.outputs.phase == 'delivery'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run: {shell: pwsh}
    env:
      JAVA_HOME: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 0, lfs: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.admission.outputs.runtime_run }}
          name: pubpres-mainline-runtimes-windows-${{ needs.admission.outputs.runtime_run }}-${{ needs.admission.outputs.runtime_attempt }}
          path: ${{ runner.temp }}/mainline-fire-runtimes
      - name: Download pristine current-source held-placement evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pubpres-mainline-qualified-windows-held-placement-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainline-fire-original
      - name: Admit exact dependencies and official engine
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/pubpres_mainline/request.py
          if ($LASTEXITCODE -ne 0) { throw 'Sealed delivery request refused' }
          python tools/ci/materialize_lfs.py --expected-source $env:GITHUB_SHA --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --include godot/tools/gentek_reciprocal.exe --output "$env:RUNNER_TEMP/fire-runtime-acquisition" --allowance-seconds 600
          if ($LASTEXITCODE -ne 0) { throw 'Exact dependency acquisition failed' }
          python tools/pubpres_mainline/setup_graphics.py --runtime "$env:RUNNER_TEMP/mainline-fire-runtimes/C" --output "$env:RUNNER_TEMP/mainline-fire-graphics"
          if ($LASTEXITCODE -ne 0) { throw 'Exact engine/native admission failed' }
      - name: Independently replay the original held receipt and copy its project before overlaying observers
        id: copy
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json, os, pathlib, shutil, sys
          root = pathlib.Path.cwd().resolve()
          sys.path.insert(0, str(root / 'tools/pubpres_mainline'))
          import common
          sys.path.insert(0, str(root / 'tools/pubpres_final_recovery'))
          from identity import driver_identity
          from run_campaign import source_identity
          from retained_runtime import validate_runtime
          from qualification_gate import verify_summary
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          original = temporary / 'mainline-fire-original'
          matches = list(original.rglob('SUMMARY.json'))
          common.require(len(matches) == 1, 'Missing or ambiguous original held-placement evidence')
          source = source_identity(root)
          source['native_runtime'] = validate_runtime(root, source, pathlib.Path(os.environ['BOUND_RUNTIME']), False)
          prerequisite = verify_summary(matches[0], source, driver_identity(), pathlib.Path(os.environ['GODOT_EXE']), 'held-placement')
          inventory = {p.relative_to(original).as_posix(): common.digest(p) for p in original.rglob('*') if p.is_file()}
          common.require(inventory, 'Original held-placement artifact is empty')
          copy = temporary / 'mainline-fire-working-copy'
          shutil.copytree(matches[0].parent, copy)
          custody = {'schema':'pubpres-fire-original-custody-v1', 'source':source, 'prerequisite':prerequisite,
              'original':str(original), 'working_copy':str(copy), 'original_files_sha256':inventory,
              'permitted_copy_overlays':['project/tests/flight_visibility.gd','project/tests/pubpres_playability_owner_start.gd','project/tests/flight_fire_contact.gd'],
              'original_unchanged':False}
          common.write_json(temporary / 'mainline-fire-custody.json', custody)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('FIRE_QUALIFIED_COPY=' + str(copy) + '\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Independent held-placement admission or pristine project copy failed' }
      - name: Run unchanged Wave512 and Mixed2048 90-second patrols with real Thruster fire
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/pubpres_recovery_windows/run_owner_follow.py --qualified $env:FIRE_QUALIFIED_COPY --engine $env:GODOT_EXE --output "$env:RUNNER_TEMP/mainline-fire-patrol" --thruster-fire
          if ($LASTEXITCODE -ne 0) { throw 'Original Fire-on patrol failed; retain actual raw observations' }
      - name: Run original Fire, wall-contact and Water-contact observations
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/pubpres_recovery_windows/run_owner_follow.py --qualified $env:FIRE_QUALIFIED_COPY --engine $env:GODOT_EXE --output "$env:RUNNER_TEMP/mainline-fire-contact" --contact
          if ($LASTEXITCODE -ne 0) { throw 'Original Fire/Water/wall-contact observation failed; retain raw evidence' }
      - name: Prove the original raw qualification was never mutated
        if: always() && steps.copy.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json, os, pathlib, sys
          root = pathlib.Path.cwd().resolve()
          sys.path.insert(0, str(root / 'tools/pubpres_mainline'))
          import common
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mainline-fire-custody.json'
          record = json.loads(path.read_bytes())
          original = pathlib.Path(record['original'])
          current = {p.relative_to(original).as_posix(): common.digest(p) for p in original.rglob('*') if p.is_file()}
          record['original_unchanged'] = current == record['original_files_sha256']
          common.write_json(path, record)
          common.require(record['original_unchanged'], 'Original held-placement qualification artifact was mutated')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Original raw qualification custody check failed' }
      - name: Preserve complete Fire-on traces, first-read frames and source custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres-mainline-fire-on-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainline-fire-patrol/
            ${{ runner.temp }}/mainline-fire-contact/
            ${{ runner.temp }}/mainline-fire-custody.json
            ${{ runner.temp }}/mainline-fire-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/fire-runtime-acquisition/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  # Merge this job into .github/workflows/pubpres-mainline.yml after reviewing
  # the committed paired runner. Existing workflow env/admission remain owners.
  spawn-windows:
    name: Windows owner-reference and candidate spawn comparison
    needs: admission
    if: needs.admission.outputs.phase == 'delivery'
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run: {shell: pwsh}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.admission.outputs.runtime_run }}
          name: pubpres-mainline-runtimes-windows-${{ needs.admission.outputs.runtime_run }}-${{ needs.admission.outputs.runtime_attempt }}
          path: runtimes
      - name: Materialize original owner and candidate dependency identities
        run: |
          $owner = Join-Path $env:RUNNER_TEMP 'spawn-owner-source'
          git worktree add --detach $owner $env:PUBPRES_OWNER
          if ($LASTEXITCODE -ne 0) { throw 'Frozen physical-owner source could not be staged' }
          python tools/ci/materialize_lfs.py --root $env:GITHUB_WORKSPACE --expected-source $env:GITHUB_SHA --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --output "$env:RUNNER_TEMP/spawn-dependencies-candidate" --allowance-seconds 300
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Rapier custody failed' }
          python tools/ci/materialize_lfs.py --root $owner --expected-source $env:PUBPRES_OWNER --include godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll --output "$env:RUNNER_TEMP/spawn-dependencies-owner" --allowance-seconds 300
          if ($LASTEXITCODE -ne 0) { throw 'Original owner Rapier custody failed' }
      - name: Acquire exact official Stock engine and candidate native-input binding
        run: |
          python tools/pubpres_mainline/setup_graphics.py --runtime runtimes/C --output "$env:RUNNER_TEMP/spawn-graphics"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned engine or original native build custody failed' }
      - name: Run unchanged Wave512 and Mixed2048 spawn workloads in balanced source and recorder order
        run: |
          python tools/pubpres_mainline/run_spawn_pair.py --owner-source "$env:RUNNER_TEMP/spawn-owner-source" --candidate-source $env:GITHUB_WORKSPACE --owner-runtime runtimes/P --candidate-runtime runtimes/C --engine $env:GODOT_EXE --output "$env:RUNNER_TEMP/spawn-pair" --budget-seconds 1800
          if ($LASTEXITCODE -ne 0) { throw 'Registered spawn comparison failed; preserve every original arm' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-mainline-spawn-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/spawn-pair/
            !${{ runner.temp }}/spawn-pair/**/template/**
            ${{ runner.temp }}/spawn-graphics/GRAPHICS-SETUP.json
            ${{ runner.temp }}/spawn-dependencies-candidate/
            ${{ runner.temp }}/spawn-dependencies-owner/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
