name: Agent painter SPROCKET source-qualified step96 DEVELOPMENT comparison
on:
  push:
    branches: [codex/agent-painter-sprocket-568]
    paths:
      - experiments/agent_painter/lanes/sprocket/development96-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-painter-sprocket-development96-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit source-locked step96 DEVELOPMENT-only request
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exactly one native-held-out comparison
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/development96.py
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          request = json.loads(Path("experiments/agent_painter/lanes/sprocket/development96-request.json").read_text())
          expected = {
              "schema": "cybersand.agent-painter.sprocket-development96/1",
              "experiment": "sprocket-fresh96-development-001",
              "sequence": 1,
              "training_source": "25b24bf80c593b115321387a2a0374dd5ff02548",
              "training_run_id": 43529482591,
              "training_artifact": "agent-painter-sprocket-campaign-25b24bf80c593b115321387a2a0374dd5ff02548-43529482591-1",
              "checkpoint_step": 96,
              "original_native_source": "633920373a3d406a2ede61ce4137c324f76be23b",
              "native_corpus_run_id": 43506373969,
              "native_corpus_manifest_sha256": "2fdef5a3639606fb9af68319f9747a1de1e9a573da5c6197a2dcbc96579cb6cc",
              "model": "kandivault/sprocket-500m",
              "revision": "eb157d4ddddc4619e661d4a2426bb2dd000fc668",
              "arms": ["untuned", "step96"],
              "independent_development_prompts": 6,
              "host_seed_views_per_arm": 12,
              "max_new_tokens": 512,
              "training": False,
              "native_execution": False,
              "final_targets_opened": False,
              "draft_hold": True,
          }
          if request != expected:
              raise SystemExit("DEVELOPMENT96 experiment request changed from exact approved comparison")
          if (os.environ["GITHUB_REPOSITORY"] != "techrote/cybersand"
                  or os.environ["GITHUB_REF"] != "refs/heads/codex/agent-painter-sprocket-568"
                  or not re.fullmatch(r"[a-f0-9]{40}", os.environ["GITHUB_SHA"])):
              raise SystemExit("wrong repository, branch or source")
          print("six original DEVELOPMENT language requests and two seeds per prompt; no FINAL")
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/sprocket-dev96-scheduling.json

  compare:
    name: Raw root Sprocket untuned versus exact 96-step adapter
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      ATEN_CPU_CAPABILITY: 'default'
      MKL_CBWR: 'COMPATIBLE'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-painter-native-633920373a3d406a2ede61ce4137c324f76be23b
          run-id: '43506373969'
          github-token: ${{ github.token }}
          path: evidence/native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-painter-sprocket-campaign-25b24bf80c593b115321387a2a0374dd5ff02548-43529482591-1
          run-id: '43529482591'
          github-token: ${{ github.token }}
          path: evidence/previous-campaign
      - name: Verify real complete 96-step source and progress before installing model
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("evidence/previous-campaign/campaign")
          receipt = json.loads((root / "campaign-receipt.json").read_text())
          summary = json.loads((root / "summary.json").read_text())
          if (receipt.get("source_sha") != "25b24bf80c593b115321387a2a0374dd5ff02548"
                  or receipt.get("actual_global_steps") != 96
                  or receipt.get("optimizer_steps_this_job") != 96
                  or receipt.get("result_code") != 0
                  or summary.get("status") != "completed"
                  or summary.get("checkpoint") != "checkpoint-000096"
                  or not (root / "checkpoint-000096" / "inventory.json").is_file()):
              raise SystemExit("96-step training evidence incomplete; refuse to score candidate")
          print("complete 96-step campaign claimed in source-pinned artifact; full bytes reverified in evaluator")
          PY
      - name: Install original pinned portable CPU environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sprocket-development96"
          "$RUNNER_TEMP/sprocket-development96/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/sprocket-development96/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/sprocket-development96/bin/python" -m pip check
          mkdir -p evidence/development96-environment
          "$RUNNER_TEMP/sprocket-development96/bin/python" -m pip freeze --all > evidence/development96-environment/pip-freeze.txt
          lscpu > evidence/development96-environment/cpu.txt
      - name: Download exact public root Instruct weights with official hashes
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/sprocket-development96/bin/python" experiments/agent_painter/training/download_model.py --profile sprocket --output "$RUNNER_TEMP/sprocket-development96-model"
          cp "$RUNNER_TEMP/sprocket-development96-model/download_receipt.json" evidence/development96-environment/model-download.json
      - name: Verify checkpoint inventory and compare unmodified first-pass DEVELOPMENT
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 2700s "$RUNNER_TEMP/sprocket-development96/bin/python" experiments/agent_painter/lanes/sprocket/development96.py \
            --model "$RUNNER_TEMP/sprocket-development96-model" \
            --campaign evidence/previous-campaign/campaign \
            --corpus evidence/native/corpus \
            --output evidence/development96 \
            --max-new-tokens 512
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-painter-sprocket-development96-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/development96/
            evidence/development96-environment/
          if-no-files-found: warn
          retention-days: 90
