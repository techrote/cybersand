name: PUBPRES playable successor qualification

on:
  push:
    branches: [codex/pubpres-playability-final-001-20261124]
    paths: ['.github/pubpres-playability-final-run.json']

permissions:
  contents: read
  actions: read

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  PUBPRES_FROZEN: c90dbc46e1f57f28e06b1f4205b83467335ff657
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      phase: ${{ steps.request.outputs.phase }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate complete executed source and deliberate branch request
        id: request
        run: python3 tools/pubpres_final/request.py
      - name: Provider, source and adversarial measurement contracts
        run: |
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m unittest discover -s tools/pubpres_final -v
          python3 tools/pubpres_playability/test_results_same_frame.py

  runtimes:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [linux, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Frozen reference and pinned build dependencies
        run: |
          timeout 240 git fetch --no-tags origin "$PUBPRES_FROZEN"
          git worktree add --detach "$RUNNER_TEMP/pubpres-frozen" "$PUBPRES_FROZEN"
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
      - name: Pinned Windows compiler
        if: matrix.platform == 'windows'
        run: |
          curl --fail --location --retry 3 --max-time 300 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
      - name: Independently build frozen and successor native inputs
        env:
          PLATFORM: ${{ matrix.platform }}
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          PUBPRES_GODOT_CPP_BUILD_LOG: build/pubpres-final-runtime/godot-cpp.log
        run: |
          mkdir -p build/pubpres-final-runtime
          timeout 2400 bash tools/build_pinned_godot_cpp.sh "$PLATFORM" > build/pubpres-final-runtime/godot-cpp.log 2>&1
          status=0
          python3 tools/pubpres_playability_build/build_runtime.py --platform "$PLATFORM" --source-root "$RUNNER_TEMP/pubpres-frozen" --source-sha "$PUBPRES_FROZEN" --output-dir build/pubpres-final-runtime/D || status=1
          python3 tools/pubpres_playability_build/build_runtime.py --platform "$PLATFORM" --source-root "$PWD" --source-sha "$GITHUB_SHA" --output-dir build/pubpres-final-runtime/C || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-final-runtime-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pubpres-final-runtime/
          retention-days: 90
          if-no-files-found: warn

  graphical-linux:
    needs: [plan, runtimes]
    timeout-minutes: 350
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pubpres-final-runtime-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/runtime
      - name: Linux graphical dependencies and exact source
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
          git fetch --no-tags origin "$PUBPRES_FROZEN"
          git worktree add --detach "$RUNNER_TEMP/pubpres-frozen" "$PUBPRES_FROZEN"
          git lfs install --local
          for source in "$PWD" "$RUNNER_TEMP/pubpres-frozen"; do
            git -C "$source" lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          done
          python3 tools/pubpres_playability_build/download_engine.py --platform linux --output "$RUNNER_TEMP/godot"
      - name: Source-bound correctness and matched physical comparisons
        env:
          PUBPRES_FINAL_PHASE: ${{ needs.plan.outputs.phase }}
        run: python tools/pubpres_final/run_hosted.py --runtime-root build/runtime --engine-root "${{ runner.temp }}/godot" --frozen-root "${{ runner.temp }}/pubpres-frozen" --output build/pubpres-final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-final-graphical-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/pubpres-final/
            !build/pubpres-final/**/project/**
            !build/pubpres-final/**/projects/**
            !build/pubpres-final/**/template-*/**
            ${{ runner.temp }}/godot/ENGINE.json
          retention-days: 90
          if-no-files-found: warn

  graphical-windows:
    needs: [plan, runtimes]
    timeout-minutes: 350
    runs-on: windows-2022
    steps:
      - name: Canonical Windows source bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pubpres-final-runtime-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/runtime
      - name: Windows graphical dependencies and exact source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin $env:PUBPRES_FROZEN
          if ($LASTEXITCODE -ne 0) { throw 'Frozen source fetch failed' }
          git worktree add --detach (Join-Path $env:RUNNER_TEMP 'pubpres-frozen') $env:PUBPRES_FROZEN
          if ($LASTEXITCODE -ne 0) { throw 'Frozen checkout failed' }
          git lfs install --local
          foreach ($Source in @($PWD.Path, (Join-Path $env:RUNNER_TEMP 'pubpres-frozen'))) {
            git -C $Source lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
            if ($LASTEXITCODE -ne 0) { throw 'Rapier runtime materialization failed' }
          }
          python tools/pubpres_playability_build/download_engine.py --platform windows --output (Join-Path $env:RUNNER_TEMP 'godot')
          if ($LASTEXITCODE -ne 0) { throw 'Pinned engine preparation failed' }
      - name: Source-bound correctness and matched physical comparisons
        env:
          PUBPRES_FINAL_PHASE: ${{ needs.plan.outputs.phase }}
        run: python tools/pubpres_final/run_hosted.py --runtime-root build/runtime --engine-root "${{ runner.temp }}/godot" --frozen-root "${{ runner.temp }}/pubpres-frozen" --output build/pubpres-final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-final-graphical-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/pubpres-final/
            !build/pubpres-final/**/project/**
            !build/pubpres-final/**/projects/**
            !build/pubpres-final/**/template-*/**
            ${{ runner.temp }}/godot/ENGINE.json
          retention-days: 90
          if-no-files-found: warn

  native-authority:
    needs: plan
    if: needs.plan.outputs.phase == 'final'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env: {CXX: g++-13, CC: gcc-13}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Native material, Wave, body-boundary and sanitizers
        run: |
          mkdir -p build/pubpres-final-native
          git rev-parse HEAD > build/pubpres-final-native/source.txt
          status=0
          timeout 3600 make test wave-flow-test wave-spill-test wave-body-boundary-test material-baseline-test > build/pubpres-final-native/normal.log 2>&1 || status=1
          timeout 3600 env ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1 UBSAN_OPTIONS=halt_on_error=1 make sanitize wave-flow-sanitize wave-body-boundary-sanitize > build/pubpres-final-native/sanitizers.log 2>&1 || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-final-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pubpres-final-native/
          retention-days: 90
          if-no-files-found: warn
