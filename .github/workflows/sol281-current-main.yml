name: SOL-DETACH-001 current-main qualification

on:
  push:
    branches: [sol-detach-001-current-main]
    paths:
      - native/**
      - godot/**
      - '!godot/addons/**/bin/**'
      - '!godot/addons/cybersand_native/runtime-provenance*.json'
      - tools/**
      - third_party/**
      - Makefile
      - AGENTS.md
      - .gitattributes
      - .github/workflows/sol281-current-main.yml
      - .github/workflows/rapier-bvh-build.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Every attempt retains its own positive and negative evidence.
concurrency:
  group: sol281-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  CYBERSAND_CI_WATCHDOG_SCALE: "1"
  GODOT_SILENCE_ROOT_WARNING: "1"
  PYTHONUTF8: "1"
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65

jobs:
  build:
    name: pinned native build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
      max-parallel: 2
    env:
      SCONS_JOBS: "2"
      CYBERSAND_REAL_CXX: /usr/bin/g++-13
      LINUX_CXX: /usr/bin/g++-13
      SOL281_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out exact source without stale runtime objects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Set pinned build dependency locations
        run: |
          printf 'GODOT_CPP_ROOT=%s/godot-cpp\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SCONS_PYTHON=%s/scons/bin/python\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LLVM_MINGW_ROOT=%s/llvm-mingw\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'WINDOWS_CXX=%s/llvm-mingw/bin/x86_64-w64-mingw32-g++\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Authenticate source and qualification reader
        run: |
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/sol281/test_qualification.py
          python3 tools/sol281/run_qualification.py manifest --output "build/sol281/build/$SOL281_TARGET/before.json"
      - name: Prepare pinned bindings dependencies with shared watchdog
        run: |
          python3 tools/ci/run_timed_command.py --policy-key dependency_prepare_seconds --label bindings-dependencies --output-dir "build/sol281/build/$SOL281_TARGET/prepare" -- bash -euc '
            python3 -m venv "$RUNNER_TEMP/scons"
            "$SCONS_PYTHON" -m pip install --require-hashes -r tools/requirements-build.txt
            mkdir "$GODOT_CPP_ROOT"
            git -C "$GODOT_CPP_ROOT" init
            git -C "$GODOT_CPP_ROOT" remote add origin https://github.com/godotengine/godot-cpp.git
            git -C "$GODOT_CPP_ROOT" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
            git -C "$GODOT_CPP_ROOT" checkout --detach FETCH_HEAD
            test "$(git -C "$GODOT_CPP_ROOT" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
          '
      - name: Prepare pinned Windows cross compiler
        if: matrix.target == 'windows'
        run: |
          python3 tools/ci/run_timed_command.py --policy-key dependency_prepare_seconds --label llvm-mingw --output-dir "build/sol281/build/$SOL281_TARGET/compiler" -- bash -euc '
            curl --fail --location --retry 3 "$LLVM_MINGW_URL" -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
            printf "%s  %s\n" "$LLVM_MINGW_SHA256" "$RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
            mkdir "$LLVM_MINGW_ROOT"
            tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$LLVM_MINGW_ROOT" --strip-components=1
            if [ ! -e "$LLVM_MINGW_ROOT/bin/x86_64-w64-mingw32-gcc-ar" ]; then
              ln -s llvm-ar "$LLVM_MINGW_ROOT/bin/x86_64-w64-mingw32-gcc-ar"
            fi
          '
      - name: Build source-matched pinned bindings and extension
        run: |
          python3 tools/ci/run_timed_command.py --policy-key native_compile_seconds --label godot-cpp --output-dir "build/sol281/build/$SOL281_TARGET/bindings" -- tools/build_pinned_godot_cpp.sh "$SOL281_TARGET"
          if [ "$SOL281_TARGET" = linux ]; then
            export CYBERSAND_NATIVE_OUTPUT="$PWD/build/sol281/build/linux/libcybersand_native.linux.x86_64.so"
            python3 tools/ci/run_timed_command.py --policy-key native_compile_seconds --label native-extension --output-dir build/sol281/build/linux/extension -- tools/build_native_extension.sh
            compiler_path="$LINUX_CXX"
          else
            export CYBERSAND_NATIVE_OUTPUT="$PWD/build/sol281/build/windows/cybersand_native.windows.x86_64.dll"
            python3 tools/ci/run_timed_command.py --policy-key native_compile_seconds --label native-extension --output-dir build/sol281/build/windows/extension -- tools/build_native_extension_windows.sh
            compiler_path="$WINDOWS_CXX"
          fi
          python3 tools/sol281/run_qualification.py manifest --before "build/sol281/build/$SOL281_TARGET/before.json" --output "build/sol281/build/$SOL281_TARGET/build.json" --runtime "$CYBERSAND_NATIVE_OUTPUT" --bindings "$GODOT_CPP_ROOT/bin/libgodot-cpp.$SOL281_TARGET.template_debug.x86_64.a" --compiler "$compiler_path"
      - name: Native ownership, relocation and exact contact geometry with sanitizers
        if: matrix.target == 'linux'
        run: |
          python3 tools/ci/run_timed_command.py --policy-key native_suite_seconds --label native-sol281 --output-dir build/sol281/build/linux/native-regressions -- make CXX=/usr/bin/g++-13 solid-detachment-test conservative-displacement-test solid-contact-geometry-test solid-detachment-sanitize conservative-displacement-sanitize solid-contact-geometry-sanitize
      - name: Preserve exact source archive
        if: matrix.target == 'linux'
        run: |
          git -c filter.lfs.process= -c filter.lfs.smudge= -c filter.lfs.required=false archive --format=tar.gz -o build/sol281/build/linux/source.tar.gz HEAD
          sha256sum build/sol281/build/linux/source.tar.gz > build/sol281/build/linux/source.tar.gz.sha256
      - name: Retain build artifacts and every original command receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol281-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/build/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 90

  linux-host:
    name: actual Linux host (${{ matrix.cohort }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Keep complete per-case watchdogs within the fixed hosted job ceiling.
        cohort: [core, contact-w1, contact-w4, mechanism]
      max-parallel: 3
    steps:
      - name: Check out exact host source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Retrieve source-matched native library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sol281-build-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/runtime
      - name: Materialize current Linux Rapier runtime
        run: |
          python3 tools/ci/run_timed_command.py --policy-key dependency_prepare_seconds --label rapier-runtime --output-dir build/sol281/prepare-rapier -- bash -euc '
            git lfs install --local
            git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" --exclude=""
          '
      - name: Prepare pinned Godot host archive
        run: |
          python3 tools/ci/run_timed_command.py --policy-key dependency_prepare_seconds --label godot-runtime --output-dir build/sol281/prepare-engine -- bash -euc '
            mkdir "$RUNNER_TEMP/godot"
            curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/godot.zip"
            unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
            chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          '
      - name: Run complete source-bound actual host cohort
        run: |
          python3 tools/sol281/run_qualification.py run --platform linux --cohort "${{ matrix.cohort }}" --manifest build/sol281/runtime/build.json --runtime build/sol281/runtime/libcybersand_native.linux.x86_64.so --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --godot-archive "$RUNNER_TEMP/godot/godot.zip" --output build/sol281/host
      - name: Retain original Linux logs, results and source inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol281-host-linux-${{ matrix.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/sol281/host
            build/sol281/prepare-rapier
            build/sol281/prepare-engine
          if-no-files-found: warn
          retention-days: 90

  windows-host:
    name: actual Windows host (${{ matrix.cohort }})
    needs: build
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        cohort: [core, contact-w1, contact-w4, mechanism]
      max-parallel: 3
    steps:
      - name: Preserve canonical source bytes on Windows
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check out exact host source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Retrieve source-matched native library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sol281-build-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/runtime
      - name: Authenticate MSVC focused source and derive its shared suite allowance
        # The mechanism cohort leaves room for the complete native-suite bound;
        # adding it to core would exceed the unchanged six-hour job ceiling.
        if: matrix.cohort == 'mechanism'
        id: msvc-source
        shell: pwsh
        run: |
          python tools/sol281/run_qualification.py manifest --output build/sol281/msvc/before.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suite = [double](python tools/ci/execution_policy.py seconds native_suite_seconds)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $grace = [double](python tools/ci/execution_policy.py seconds terminate_grace_seconds)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = [double](python tools/ci/execution_policy.py seconds operation_seconds)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "timeout_minutes=$([Math]::Ceiling(($suite + 2 * $grace + $metadata) / 60))" >> $env:GITHUB_OUTPUT
      - name: Build and execute focused native cases with actual Windows MSVC
        if: matrix.cohort == 'mechanism'
        timeout-minutes: ${{ fromJSON(steps.msvc-source.outputs.timeout_minutes) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'build/sol281/msvc'
          $suite = [double](python tools/ci/execution_policy.py seconds native_suite_seconds)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $grace = [double](python tools/ci/execution_policy.py seconds terminate_grace_seconds)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $before = Get-Content "$output/before.json" -Raw | ConvertFrom-Json
          $receipt = [ordered]@{
            schema = 'cybersand.sol281.msvc-command.v1'; status = 'running'
            source = $before.source; platform = 'Windows'; cohort = 'mechanism'
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            command = @($env:ComSpec, '/d', '/c', 'tools\sol281\run_msvc_contact.cmd')
            timeout_seconds = $suite; cleanup_seconds = $grace
            timed_out = $false; natural_completion = $false; returncode = $null
            started_utc = [DateTime]::UtcNow.ToString('o')
          }
          $receipt | ConvertTo-Json -Depth 10 | Set-Content "$output/receipt.json" -Encoding utf8
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $child = $null
          try {
            $child = Start-Process -FilePath $env:ComSpec -ArgumentList @('/d', '/c', 'tools\sol281\run_msvc_contact.cmd') -NoNewWindow -PassThru -RedirectStandardOutput "$output/command.log" -RedirectStandardError "$output/command.stderr.log"
            $receipt.pid = $child.Id
            if (-not $child.WaitForExit([int]($suite * 1000))) {
              $receipt.timed_out = $true
              # Only this command's process tree is eligible for timeout cleanup.
              $child.Kill($true)
              if (-not $child.WaitForExit([int]($grace * 1000))) {
                throw 'MSVC command did not exit within its cleanup allowance'
              }
            }
            $child.Refresh()
            $receipt.returncode = $child.ExitCode
            $receipt.natural_completion = -not $receipt.timed_out -and $null -ne $child.ExitCode
            $receipt.status = if ($receipt.timed_out) { 'timeout' } elseif ($child.ExitCode -eq 0) { 'passed' } else { 'failed' }
          } catch {
            $receipt.status = 'command_error'
            $receipt.error = $_.Exception.Message
            $receipt.natural_completion = $false
          } finally {
            if ($null -ne $child -and -not $child.HasExited) {
              try {
                $child.Kill($true)
                if (-not $child.WaitForExit([int]($grace * 1000))) { throw 'Owned MSVC command remains alive' }
              } catch {
                $receipt.status = 'cleanup_failed'
                $receipt.cleanup_error = $_.Exception.Message
              }
              $receipt.natural_completion = $false
            }
            $receipt.elapsed_seconds = $clock.Elapsed.TotalSeconds
            $receipt.log_sha256 = (Get-FileHash "$output/command.log" -Algorithm SHA256 -ErrorAction SilentlyContinue).Hash
            $receipt.stderr_sha256 = (Get-FileHash "$output/command.stderr.log" -Algorithm SHA256 -ErrorAction SilentlyContinue).Hash
            $receipt | ConvertTo-Json -Depth 10 | Set-Content "$output/receipt.json" -Encoding utf8
          }
          Get-Content "$output/command.log" -ErrorAction SilentlyContinue
          Get-Content "$output/command.stderr.log" -ErrorAction SilentlyContinue
          if ($receipt.status -ne 'passed' -or -not $receipt.natural_completion) { exit 1 }
      - name: Authenticate unchanged MSVC inputs and retain executable identities
        if: always() && matrix.cohort == 'mechanism' && steps.msvc-source.outcome == 'success'
        shell: pwsh
        run: |
          python tools/sol281/run_qualification.py manifest --before build/sol281/msvc/before.json --output build/sol281/msvc/after.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identities = [ordered]@{}
          foreach ($name in @('solid_detachment', 'conservative_displacement', 'solid_contact_geometry')) {
            $path = "build/sol281/msvc-bin/test_$name.exe"
            if (Test-Path $path) {
              $identities[$name] = @{ path = $path; size = (Get-Item $path).Length; sha256 = (Get-FileHash $path -Algorithm SHA256).Hash }
            }
          }
          $identities | ConvertTo-Json -Depth 5 | Set-Content build/sol281/msvc/binary-identities.json -Encoding utf8
      - name: Retain original MSVC command, source manifests and focused logs
        if: always() && matrix.cohort == 'mechanism'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # Keep the existing strict host artifact root/inventory unchanged.
          name: sol281-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/msvc
          if-no-files-found: error
          retention-days: 90
      - name: Materialize current Windows Rapier runtime
        timeout-minutes: 20
        shell: pwsh
        run: |
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned actual Windows Godot host
        timeout-minutes: 20
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/godot" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot/godot.zip" -TimeoutSec 1200
          python -m zipfile -e "$env:RUNNER_TEMP/godot/godot.zip" "$env:RUNNER_TEMP/godot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete source-bound actual Windows cohort
        shell: pwsh
        run: |
          python tools/sol281/run_qualification.py run --platform windows --cohort "${{ matrix.cohort }}" --manifest build/sol281/runtime/build.json --runtime build/sol281/runtime/cybersand_native.windows.x86_64.dll --godot "$env:RUNNER_TEMP/godot/Godot_v4.7-stable_win64_console.exe" --godot-archive "$env:RUNNER_TEMP/godot/godot.zip" --output build/sol281/host
          exit $LASTEXITCODE
      - name: Retain original Windows logs, results and source inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol281-host-windows-${{ matrix.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/host
          if-no-files-found: warn
          retention-days: 90

  evidence:
    name: complete two-platform evidence inventory
    if: always()
    needs: [build, linux-host, windows-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact qualification reader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Download every original actual-host artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sol281-host-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/evidence
      - name: Reopen all eight cohorts and reject absent or incomplete evidence
        run: python3 tools/sol281/run_qualification.py summarize --input build/sol281/evidence --output build/sol281/qualification.json
      - name: Retain bounded qualification disposition
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol281-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/qualification.json
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: publish qualified development runtimes on the draft branch
    needs: [build, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the exact qualified source with publication credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
      - name: Retrieve both original build bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sol281-build-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/publication-builds
      - name: Retrieve all eight original host bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sol281-host-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/publication-hosts
      - name: Reverify qualification and prepare truthful runtime provenance
        run: |
          git lfs install --local
          python3 tools/sol281/test_publish_runtime.py
          python3 tools/sol281/publish_runtime.py --build-root build/sol281/publication-builds --evidence-root build/sol281/publication-hosts --output build/sol281/publication.json
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('build/sol281/publication.json'))['publication_paths']
          subprocess.run(['git', 'add', '-f', '--', *paths], check=True)
          PY
          python3 tools/sol281/publish_runtime.py --build-root build/sol281/publication-builds --evidence-root build/sol281/publication-hosts --output build/sol281/publication.json --verify-staged
      - name: Publish only against the still-qualified branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_name=sol-detach-001-current-main
          actual_head="$(git ls-remote --exit-code origin "refs/heads/$branch_name" | cut -f1)"
          test "$actual_head" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish qualified SOL281 development runtimes from $GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$(git rev-parse HEAD) $GITHUB_SHA"
          git push origin "HEAD:refs/heads/$branch_name"
          gh workflow run documentation.yml --ref "$branch_name"
      - name: Retain publication decision and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sol281-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sol281/publication.json
          if-no-files-found: warn
          retention-days: 90
