name: ENG-LAB-001 four-family NVIDIA Windows owner test package (Draft/HOLD)

# Packaging-only follow-up; uses qualified source, never merges or changes defaults.
on:
  push:
    branches:
      - research/eng-lab-001-water-family-matched
    paths:
      - '.github/workflows/eng-lab-gpu-evaluation-windows.yml'
      - 'tools/engine_lab/package_windows_gpu.py'
      - 'tools/engine_lab/windows_gpu_runner.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng-lab-gpu-windows-evaluation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package and smoke exact-source NVIDIA owner Windows ZIP
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/research/eng-lab-001-water-family-matched'
    runs-on: windows-2022
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      QUALIFIED_SOURCE: 50a87a0a11388887a87f38dd11072f8b319756f2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify immutable application and materialize checked Windows native/Rapier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$QUALIFIED_SOURCE" HEAD
          git diff --exit-code "$QUALIFIED_SOURCE" HEAD -- godot examples/worldgen native third_party
          git lfs install --local
          git lfs pull --include='godot/**,examples/worldgen/**' --exclude=''
          python tools/ci/check_ci_provider_policy.py
          python -m py_compile tools/engine_lab/package_windows_gpu.py
          python -m py_compile tools/engine_lab/run_water_family_matrix.py

      - name: Download official pinned Godot 4.7 Windows runtime and license notices
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eng-lab-gpu-notices"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            --output "$RUNNER_TEMP/eng-lab-gpu-godot.zip" \
            'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 120 \
            --output "$RUNNER_TEMP/eng-lab-gpu-notices/LICENSE.txt" \
            'https://raw.githubusercontent.com/godotengine/godot/4.7-stable/LICENSE.txt'
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 120 \
            --output "$RUNNER_TEMP/eng-lab-gpu-notices/COPYRIGHT.txt" \
            'https://raw.githubusercontent.com/godotengine/godot/4.7-stable/COPYRIGHT.txt'

      - name: Package exact-qualified source and execute clean staged app smoke
        run: |
          set -euo pipefail
          python tools/engine_lab/package_windows_gpu.py \
            --source-sha "$QUALIFIED_SOURCE" \
            --godot-archive "$RUNNER_TEMP/eng-lab-gpu-godot.zip" \
            --godot-notices "$RUNNER_TEMP/eng-lab-gpu-notices" \
            --output "build/eng-lab-gpu-evaluation/CyberSand-EngineLab-NVIDIA-Windows-50a87a0a.zip" \
            --evidence "build/eng-lab-gpu-evaluation/evidence"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/eng-lab-gpu-evaluation/evidence/packaging-receipt.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['source'] == '50a87a0a11388887a87f38dd11072f8b319756f2'
          assert r['status'] == 'passed' and all(c['ok'] for c in r['smoke'].values())
          print("PACKAGE_CANDIDATE_QUALIFIED", json.dumps({
            "zip":r["zip"],"sha256":r["zip_sha256"],
            "bytes":r["zip_bytes"],"source":r["source"]},sort_keys=True))
          PY

      - name: Upload portable ZIP and exact-source build/launch receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CyberSand-EngineLab-NVIDIA-Windows-50a87a0a-${{ github.run_id }}
          path: |
            build/eng-lab-gpu-evaluation/CyberSand-EngineLab-NVIDIA-Windows-50a87a0a.zip
            build/eng-lab-gpu-evaluation/evidence/packaging-receipt.json
            build/eng-lab-gpu-evaluation/evidence/packaging-error.txt
            build/eng-lab-gpu-evaluation/evidence/smoke-*.log
            build/eng-lab-gpu-evaluation/evidence/CyberSand-EngineLab-NVIDIA-Windows/Benchmark-Results/**/import-*.log
            build/eng-lab-gpu-evaluation/evidence/CyberSand-EngineLab-NVIDIA-Windows/Benchmark-Results/**/summary.json
          if-no-files-found: warn
          retention-days: 90
