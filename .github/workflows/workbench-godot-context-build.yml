name: PHYSICS-FREEZE-002 pinned Windows EGL context repair
on:
  push:
    branches: [diagnostics/physics-angle-context-20261116]
permissions:
  contents: read
  actions: read
concurrency:
  group: workbench-godot-context-${{ github.sha }}
  cancel-in-progress: false
env:
  CYBERSAND_EVAL_SOURCE_SHA: ${{ github.sha }}
  CYBERSAND_SOURCE_REVISION: ${{ github.sha }}
jobs:
  windows-engine-and-qualification:
    name: Build source-pinned Godot and execute Windows ANGLE qualification
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize and verify the exact application and unchanged physical runtimes
        run: |
          set -euo pipefail
          mkdir -p evidence
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          python tools/ci/package_engine_lab_windows.py preflight --platform windows > evidence/source-runtime.json
          git rev-parse HEAD HEAD^{tree} > evidence/source.txt
          python tools/ci/check_ci_provider_policy.py > evidence/ci-provider.json
      - name: Check out the exact Godot 4.7 upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: godotengine/godot
          ref: 5b4e0cb0fd279832bbdd69fed5354d4e5ad26f88
          path: engine-source-build
          persist-credentials: false
          lfs: false
      - name: Authenticate dependencies, apply the reviewed EGL repair and compile Windows x64
        run: |
          set -euo pipefail
          python -u tools/ci/build_workbench_godot.py --source-dir engine-source-build --output "$RUNNER_TEMP/workbench-engine" --evidence evidence/engine-build
          python - <<'PY'
          import json,os,pathlib
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'workbench-engine'
          manifest=json.loads((output/'build-provenance.json').read_text())
          console=output/manifest['console_executable']
          assert console.is_file()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('GODOT_BIN='+str(console)+'\n')
              f.write('WORKBENCH_ENGINE_DIR='+str(output)+'\n')
          PY
      - name: Preserve the authenticated engine payload before application qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Workbench-Godot-Windows-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbench-engine/
          if-no-files-found: error
          retention-days: 90
      - name: Import the exact application with the repaired engine
        run: |
          python - <<'PY'
          import os,pathlib,subprocess
          with pathlib.Path('evidence/import.log').open('w',encoding='utf-8') as log:
              subprocess.run([os.environ['GODOT_BIN'],'--headless','--path','godot','--editor','--quit'],stdout=log,stderr=subprocess.STDOUT,timeout=240,check=True)
          PY
      - name: Execute actual Windows material, context, physics and authoring gates
        env:
          CYBERSAND_DIAG_NATIVE_RENDEZVOUS: render-overlap
        run: |
          set -euo pipefail
          python -u tools/ci/run_camera_coherence_regressions.py --godot "$GODOT_BIN" --project godot --evidence evidence/threaded-gates --graphical --render-thread separate --cases native-rendezvous native-rendezvous-integration native-render-overlap native-render-overlap-graphical material-threaded-graphical material-tiles-graphical font-mipmap-safe-graphical font-mipmap-separate-graphical depth-threaded-safe-graphical depth-threaded-separate-graphical physics-publication-graphical native-rendezvous-graphical physics-pacing-graphical temporal-contact-graphical paint-author-graphical paint-reopen-graphical
      - name: Execute forward and reverse actual physical-completion comparison
        run: |
          set -euo pipefail
          python -u tools/ci/run_native_rendezvous_comparison.py --godot "$GODOT_BIN" --project godot --evidence evidence/factorial --source-sha "$GITHUB_SHA" --rendering-driver opengl3_angle
      - name: Verify exact application and physical runtime source after execution
        if: success() || failure()
        run: python tools/ci/package_engine_lab_windows.py preflight --platform windows > evidence/source-runtime-after.json
      - name: Retain all build, negative and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Workbench-Godot-Context-Evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
