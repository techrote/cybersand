name: SOL281 unresolved-cause qualification finalizer

on:
  push:
    branches: [work/sol281-native-detachment-20261027]
    paths: ['.github/workflows/sol281-unresolved-finalize.yml']

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'techrote/cybersand'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare exact qualification commit for connector publication
        shell: bash
        run: |
          set -euo pipefail
          echo '509978c71acbf9639cfa936b1cb3b2f3583e56af186aaa4e0f2281dd2c47228d  tools/soliding/sol281_targeted_workflow.patch' | sha256sum --check --strict
          git apply --check tools/soliding/sol281_targeted_workflow.patch
          git apply tools/soliding/sol281_targeted_workflow.patch
          python3 tools/ci/check_ci_provider_policy.py
          git diff --check
          rm tools/soliding/sol281_targeted_workflow.patch
          rm .github/workflows/sol281-unresolved-finalize.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(sol281): qualify unresolved-cause diagnostics'
          echo "SOL281_FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "SOL281_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          echo "SOL281_TARGET_WORKFLOW_BLOB=$(git rev-parse HEAD:.github/workflows/sol281-targeted.yml)"
          git push --force origin HEAD:refs/heads/tmp/sol281-unresolved-final-20261028
