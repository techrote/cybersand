name: DRIV3R tiny policy pretrained CPU M1 / held-out M2
on:
  push:
    branches: [research/tiny-policy-trainer-20261116-m0]
    paths:
      - 'experiments/driv3r/training/tiny_policy/**'
      - '.github/workflows/driv3r-tiny-policy-pretrained-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tiny-policy-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  frozen-cohort:
    if: contains(github.event.head_commit.message, '[M1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [smollm2-135m, opt-125m, pythia-160m]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install numpy==2.1.3 pillow==11.1.0 transformers==4.51.3 huggingface_hub==0.30.2
      - name: Original source and CPU contract receipt
        run: |
          mkdir -p "${{ runner.temp }}/tiny-m1/${{ matrix.model }}"
          git rev-parse HEAD | tee "${{ runner.temp }}/tiny-m1/${{ matrix.model }}/source_sha.txt"
          sha256sum experiments/driv3r/training/tiny_policy/*.py | tee "${{ runner.temp }}/tiny-m1/${{ matrix.model }}/source_hashes.txt"
          python -m unittest experiments.driv3r.training.tiny_policy.test_core -v
      - name: Bounded pretrained frozen-backbone action-head training and original trajectories
        timeout-minutes: 19
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          timeout --signal=TERM --kill-after=15s 1050s python -u -m experiments.driv3r.training.tiny_policy.pretrained_cpu \
            --model "${{ matrix.model }}" --out "${{ runner.temp }}/tiny-m1/${{ matrix.model }}/trial"
      - name: Upload originals and failures, no pretrained weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-m1-${{ matrix.model }}-${{ github.sha }}
          path: ${{ runner.temp }}/tiny-m1/${{ matrix.model }}/
          retention-days: 21
          if-no-files-found: error

  m2-out-of-distribution-evaluation:
    if: contains(github.event.head_commit.message, '[M2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [smollm2-135m, opt-125m, pythia-160m]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime without starting an optimizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install numpy==2.1.3 pillow==11.1.0 transformers==4.51.3 huggingface_hub==0.30.2
      - name: Download immutable original M1 trained head
        uses: actions/download-artifact@v4
        with:
          run-id: 43790987589
          name: tiny-m1-${{ matrix.model }}-7d3aadea30830ba5e44aea6bd6c71a8666923e7e
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tiny-m2/original
      - name: Qualify original M1 source, local action host and adversarial receipts
        run: |
          test "$(cat '${{ runner.temp }}/tiny-m2/original/source_sha.txt')" = "7d3aadea30830ba5e44aea6bd6c71a8666923e7e"
          git rev-parse HEAD | tee "${{ runner.temp }}/tiny-m2/source_sha.txt"
          sha256sum experiments/driv3r/training/tiny_policy/*.py | tee "${{ runner.temp }}/tiny-m2/source_hashes.txt"
          python -m unittest experiments.driv3r.training.tiny_policy.test_core experiments.driv3r.training.tiny_policy.test_m2_transfer -v
      - name: Inference-only 48-step OOD stress / original 96-budget host
        timeout-minutes: 21
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          timeout --signal=TERM --kill-after=15s 1170s python -u -m experiments.driv3r.training.tiny_policy.m2_transfer \
            --model "${{ matrix.model }}" \
            --original "${{ runner.temp }}/tiny-m2/original/trial" \
            --out "${{ runner.temp }}/tiny-m2/evaluation"
      - name: Preserve original synthetic trajectory outputs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-m2-${{ matrix.model }}-${{ github.sha }}
          path: ${{ runner.temp }}/tiny-m2/
          retention-days: 21
          if-no-files-found: error

  m5-source-matched-cpu:
    if: contains(github.event.head_commit.message, '[M5]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source-matched local CPU optimizer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 pillow==12.3.0
      - name: Record exact source and run bounded adversarial contract tests
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          mkdir -p "${{ runner.temp }}/tiny-m5"
          git rev-parse HEAD | tee "${{ runner.temp }}/tiny-m5/source_sha.txt"
          python -VV | tee "${{ runner.temp }}/tiny-m5/python_version.txt"
          python -c 'import torch,numpy,PIL; print(torch.__version__,numpy.__version__,PIL.__version__)' | tee "${{ runner.temp }}/tiny-m5/dependencies.txt"
          sha256sum experiments/driv3r/training/tiny_policy/*.py | tee "${{ runner.temp }}/tiny-m5/source_hashes.txt"
          python -m unittest experiments.driv3r.training.tiny_policy.test_core experiments.driv3r.training.tiny_policy.test_m3_curriculum experiments.driv3r.training.tiny_policy.test_m4_ood experiments.driv3r.training.tiny_policy.test_m5_topology -v
      - name: Regenerate M3 checkpoints before M5, fail closed on source/checkpoint mismatch
        timeout-minutes: 6
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          timeout --signal=TERM --kill-after=15s 330s python -u -m experiments.driv3r.training.tiny_policy.m3_curriculum \
            --out "${{ runner.temp }}/tiny-m5/m3-regenerated"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("${{ runner.temp }}/tiny-m5")
          ck=root/"m3-regenerated/checkpoints"
          original={
              "linear":"a5d1ec8f5f956c05968f7b5b538952e68d89b861d337a48559e0de759fc32435",
              "mlp":"1b2c9cea0b99fffde0b3ebd39942835540880d93a6e70ce1518ff39c508ceeb5",
              "conv":"b44a97d0a6af84010280bf83e22c481afa15546d8b1575ef4c855d5bb6661d6d"}
          actual={n:hashlib.sha256((ck/(n+".pt")).read_bytes()).hexdigest() for n in original}
          report={"original_reference":original,"rebuilt_reference":actual,
                  "exact_matches":{n:original[n]==actual[n] for n in original},
                  "classification":"same-source CPU rebuild; divergent weights are distinct model identities"}
          (root/"m3_reference_status.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Train M5 real CPU heads, render originals and fully audit all trajectory receipts
        timeout-minutes: 9
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          timeout --signal=TERM --kill-after=15s 480s python -u -m experiments.driv3r.training.tiny_policy.m5_topology_train \
            --output "${{ runner.temp }}/tiny-m5/m5-evidence" \
            --m3-checkpoints "${{ runner.temp }}/tiny-m5/m3-regenerated/checkpoints" \
            --m3-rebuilt-from-source
          timeout --signal=TERM --kill-after=15s 210s python -u -m experiments.driv3r.training.tiny_policy.audit_m5_topology \
            --input "${{ runner.temp }}/tiny-m5/m5-evidence" \
            --m3-checkpoints "${{ runner.temp }}/tiny-m5/m3-regenerated/checkpoints" \
            | tee "${{ runner.temp }}/tiny-m5/audit.json"
      - name: Preserve generated checkpoints, original PNGs and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-m5-source-qualified-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tiny-m5/source_sha.txt
            ${{ runner.temp }}/tiny-m5/python_version.txt
            ${{ runner.temp }}/tiny-m5/dependencies.txt
            ${{ runner.temp }}/tiny-m5/source_hashes.txt
            ${{ runner.temp }}/tiny-m5/m3-regenerated/checkpoints/
            ${{ runner.temp }}/tiny-m5/m3-regenerated/report.json
            ${{ runner.temp }}/tiny-m5/m3_reference_status.json
            ${{ runner.temp }}/tiny-m5/m5-evidence/
            ${{ runner.temp }}/tiny-m5/audit.json
          retention-days: 21
          if-no-files-found: error

  m11-temporal-source-qualified:
    if: contains(github.event.head_commit.message, '[M11]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded CPU-only research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 pillow==12.3.0
      - name: Capture exact source and verify tiny-host legality/causality
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          mkdir -p "${{ runner.temp }}/tiny-m11"
          git rev-parse HEAD | tee "${{ runner.temp }}/tiny-m11/source_sha.txt"
          python -VV | tee "${{ runner.temp }}/tiny-m11/python_version.txt"
          python -c 'import torch,numpy,PIL; print(torch.__version__,numpy.__version__,PIL.__version__)' | tee "${{ runner.temp }}/tiny-m11/dependencies.txt"
          sha256sum experiments/driv3r/training/tiny_policy/*.py | tee "${{ runner.temp }}/tiny-m11/source_hashes.txt"
          python -m unittest experiments.driv3r.training.tiny_policy.test_core experiments.driv3r.training.tiny_policy.test_m11_memory_policy -v
      - name: Train all three actual temporal optimizer cohorts, evaluate blind topologies
        timeout-minutes: 10
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          timeout --signal=TERM --kill-after=15s 560s python -u -m experiments.driv3r.training.tiny_policy.m11_memory_policy \
            --out "${{ runner.temp }}/tiny-m11/trial" \
            | tee "${{ runner.temp }}/tiny-m11/training-log.txt"
      - name: Independently recompute checkpoint actions and validate original PNG receipts
        timeout-minutes: 6
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          timeout --signal=TERM --kill-after=15s 320s python -u -m experiments.driv3r.training.tiny_policy.audit_m11_memory_policy \
            --input "${{ runner.temp }}/tiny-m11/trial" \
            | tee "${{ runner.temp }}/tiny-m11/audit.json"
      - name: Upload immutable source-matched research checkpoints and full original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-m11-temporal-${{ github.sha }}
          path: ${{ runner.temp }}/tiny-m11/
          retention-days: 21
          if-no-files-found: error

  m14-dagger-source-qualified:
    if: contains(github.event.head_commit.message, '[M14]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded CPU-only research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.3.5 pillow==12.3.0
      - name: Record exact HEAD and verify causal/legal action contract
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          mkdir -p "${{ runner.temp }}/tiny-m14"
          git rev-parse HEAD | tee "${{ runner.temp }}/tiny-m14/source_sha.txt"
          python -VV | tee "${{ runner.temp }}/tiny-m14/python_version.txt"
          python -c 'import torch,numpy,PIL; print(torch.__version__,numpy.__version__,PIL.__version__)' | tee "${{ runner.temp }}/tiny-m14/dependencies.txt"
          sha256sum experiments/driv3r/training/tiny_policy/{core,m14_dagger,audit_m14_dagger,test_m14_dagger}.py | tee "${{ runner.temp }}/tiny-m14/source_hashes.txt"
          python -m unittest experiments.driv3r.training.tiny_policy.test_core experiments.driv3r.training.tiny_policy.test_m14_dagger -v
      - name: Train four genuine BC/DAgger policy variants and render original evidence
        timeout-minutes: 10
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          timeout --signal=TERM --kill-after=15s 560s python -u -m experiments.driv3r.training.tiny_policy.m14_dagger --steps 160 --out "${{ runner.temp }}/tiny-m14/trial" | tee "${{ runner.temp }}/tiny-m14/training.log"
      - name: Independent checkpoint/state/action/PNG audit
        timeout-minutes: 6
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          timeout --signal=TERM --kill-after=15s 300s python -u -m experiments.driv3r.training.tiny_policy.audit_m14_dagger --input "${{ runner.temp }}/tiny-m14/trial" | tee "${{ runner.temp }}/tiny-m14/audit.json"
      - name: Preserve source-matched research checkpoints, PNGs, receipts and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-m14-dagger-${{ github.sha }}
          path: ${{ runner.temp }}/tiny-m14/
          retention-days: 21
          if-no-files-found: error
