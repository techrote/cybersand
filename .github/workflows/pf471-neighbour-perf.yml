name: PF471 neighbour cursor source-line profile

on:
  push:
    branches: [codex/fast-in-chunk-neighbour-cursor-20261106]

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PARENT_SHA: 4a80af2a891332176a3912a235582d77d076a185
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Build exact source pair
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/parent" "$PARENT_SHA"
          mkdir -p build/pf471-perf
          build_arm() {
            local root="$1" out="$2"
            mapfile -t src < <(find "$root/native/src" -maxdepth 1 -name '*.cpp' -print | sort)
            g++-13 -std=c++20 -O2 -g -fno-omit-frame-pointer -pthread               -I"$root/native/include" "${src[@]}"               "$GITHUB_WORKSPACE/native/bench/neighbour_cursor_bench.cpp" -o "$out"
          }
          build_arm "$RUNNER_TEMP/parent" build/pf471-perf/parent
          build_arm "$GITHUB_WORKSPACE" build/pf471-perf/candidate
      - name: Attempt perf source attribution without weakening host policy
        shell: bash
        run: |
          set -uo pipefail
          scene="$GITHUB_WORKSPACE/native/bench/data/neighbour_stress_rectangles.txt"
          perf --version > build/pf471-perf/perf-version.txt 2>&1 || true
          cat /proc/sys/kernel/perf_event_paranoid > build/pf471-perf/perf-event-paranoid.txt || true
          status=0
          for arm in parent candidate; do
            perf record -F 199 -g --call-graph dwarf -o "build/pf471-perf/$arm.data" --               "build/pf471-perf/$arm" "$scene" 6 180 "build/pf471-perf/$arm.csv"               > "build/pf471-perf/$arm.json" 2> "build/pf471-perf/$arm.perf.stderr" || status=$?
            if test -s "build/pf471-perf/$arm.data"; then
              perf report --stdio --no-children -i "build/pf471-perf/$arm.data"                 > "build/pf471-perf/$arm.report.txt" 2>&1 || true
              perf annotate --stdio -i "build/pf471-perf/$arm.data"                 > "build/pf471-perf/$arm.annotate.txt" 2>&1 || true
            fi
          done
          printf 'perf_record_exit=%s\n' "$status" > build/pf471-perf/status.txt
          # Perf denial is evidence of host limitation, not a product failure.
          exit 0
      - name: Retain profile or refusal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pf471-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pf471-perf/
          if-no-files-found: error
          retention-days: 90
