name: SOL281 exact compound coupling assembly v2

on:
  push:
    branches: [work/sol281-native-detachment-20261027]
    paths: ['.github/workflows/sol281-coupling-assemble-v2.yml']

permissions:
  contents: write

concurrency:
  group: sol281-coupling-assembly-v2
  cancel-in-progress: false

jobs:
  assemble:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/work/sol281-native-detachment-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize reviewed compound occupancy and cellular coupling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 00afa3849170f5424ab3b886a96ec047cc2847af
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess, zlib
          encoded = ''.join(Path(f'tools/soliding/sol281_coupling_patch.{index:02d}').read_text() for index in range(5))
          patch = zlib.decompress(base64.b64decode(encoded))
          subprocess.run(['git', 'apply', '--binary', '--whitespace=error-all', '-'], input=patch, check=True)
          expected = {
              '.github/workflows/sol281-targeted.yml': 'fc6eb785b91c6b5e002409c03da90c86b94f8b8b7f3a9380d23d19004fd5a29b',
              'godot/scripts/solid_detachment_lab.gd': 'b49f74326386bcd4e0e6fad177befb1df003ee8d1ca1580f30c1396125cc9fc0',
              'godot/scripts/solid_detachment_session.gd': '9924ba7e81f902303a06eeb87a12a56140c83c2e60553b8fd894a0c7d2d11668',
              'godot/scripts/solid_detachment_worker.gd': 'b5718ab9958b28587b33cee4851be4527004f1b2e9a15ffb680b5040f46fcd9b',
              'godot/tests/test_solid_detachment_coupling.gd': '45ca2b3bdd76406bf42060709e10fa3f4b2604d0162936a0eebe689497ba4abd',
          }
          for path, wanted in expected.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'hash mismatch {path}: {actual} != {wanted}')
          print('materialized SOL281 compound coupling', len(patch), 'patch bytes')
          PY
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/sol281-targeted.yml').read_text())
          assert {'source', 'windows-build', 'windows-rapier', 'linux-rapier'} <= set(workflow['jobs'])
          assert Path('godot/tests/test_solid_detachment_coupling.gd').is_file()
          PY
          git add .github/workflows/sol281-targeted.yml \
            godot/scripts/solid_detachment_lab.gd \
            godot/scripts/solid_detachment_session.gd \
            godot/scripts/solid_detachment_worker.gd \
            godot/tests/test_solid_detachment_coupling.gd
          git rm tools/soliding/materialize_issue281_coupling.py \
            tools/soliding/sol281_coupling_patch.00 \
            tools/soliding/sol281_coupling_patch.01 \
            tools/soliding/sol281_coupling_patch.02 \
            tools/soliding/sol281_coupling_patch.03 \
            tools/soliding/sol281_coupling_patch.04 \
            .github/workflows/sol281-coupling-assemble.yml \
            .github/workflows/sol281-coupling-assemble-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(sol281): couple exact compound silhouette to cellular materials'
          git push origin HEAD:refs/heads/work/sol281-native-detachment-20261027
