name: GEN006 independent bounded edit queue / actual Godot native stall

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'godot/tests/gen006_bounded_edit_queue_graphical_qa.gd'
      - 'godot/tests/gen006_drag_material_roundtrip_qa.gd'
      - 'godot/tests/gen006_signed_go_stalled_owner_qa.gd'
      - '.github/workflows/gen006-bounded-edit-queue-graphical-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen006-qa-bounded-queue-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actual-native-godot-bounded-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Pinned builder #486 head, not the QA branch's older stacked baseline.
      GEN006_BUILDER_HEAD: 6f97e91093bdf4ddb109e21c3df13e90676eab6e
      GEN006_QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact qualified builder #486 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6f97e91093bdf4ddb109e21c3df13e90676eab6e
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Checkout independent QA-only test commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-only
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Verify immutable builder and QA identities
        shell: bash
        run: |
          set -euo pipefail
          dir=build/gen006-bounded-queue-qa
          mkdir -p "$dir"
          test "$(git rev-parse HEAD)" = "$GEN006_BUILDER_HEAD"
          test "$(git -C qa-only rev-parse HEAD)" = "$GEN006_QA_HEAD"
          git rev-parse HEAD | tee "$dir/builder-head.txt"
          git rev-parse 'HEAD^{tree}' | tee "$dir/builder-tree.txt"
          git -C qa-only rev-parse HEAD | tee "$dir/qa-head.txt"
          git -C qa-only rev-parse 'HEAD^{tree}' | tee "$dir/qa-tree.txt"
          for f in native/src/world.cpp native/tests/gen006_streaming_slice.cpp godot/tests/gen006_streaming_slice_demo.gd godot/tests/gen006_streaming_slice_demo.tscn; do
            git hash-object "$f" | tee -a "$dir/builder-blobs.txt"
          done
          git -C qa-only hash-object godot/tests/gen006_bounded_edit_queue_graphical_qa.gd | tee "$dir/qa-test-blob.txt"
          git -C qa-only hash-object godot/tests/gen006_drag_material_roundtrip_qa.gd | tee "$dir/qa-drag-test-blob.txt"
          git -C qa-only hash-object godot/tests/gen006_signed_go_stalled_owner_qa.gd | tee "$dir/qa-signed-go-stall-test-blob.txt"
          python3 tools/ci/check_ci_provider_policy.py
          lsb_release -a 2>&1 | tee "$dir/os.txt"
      - name: Build real CyberSand native World and generator
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          dir=build/gen006-bounded-queue-qa
          g++-13 --version | head -n 1 | tee "$dir/compiler.txt"
          g++-13 -std=c++20 -O0 -g0 -pthread -I native/include \
            native/src/world.cpp native/src/material_rules.cpp \
            native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp \
            native/src/world_generation.cpp native/src/generation_fields.cpp \
            native/src/generation_typed_fields.cpp native/src/generation_spatial.cpp \
            native/src/generation_grammar.cpp native/src/generation_planes.cpp \
            native/tests/gen006_streaming_slice.cpp \
            -o "$dir/streaming-slice" \
            > "$dir/native-compile.log" 2>&1 || { cat "$dir/native-compile.log"; exit 1; }
          sha256sum "$dir/streaming-slice" | tee "$dir/native-sha256.txt"
      - name: Execute genuine Godot 4.7 GL / 17 accepted + one refused edits
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          dir=build/gen006-bounded-queue-qa
          mkdir -p "$dir/bin" "$dir/project/tests" "$dir/screenshots"
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          curl -fsSL --retry 3 --retry-delay 3 \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7' \
            -o "$dir/godot-4.7.zip"
          echo '0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  '"$dir/godot-4.7.zip" | sha256sum --check --strict
          unzip -q "$dir/godot-4.7.zip" -d "$dir/bin"
          godot_bin="$(find "$dir/bin" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$godot_bin"
          chmod +x "$godot_bin"
          "$godot_bin" --version | tee "$dir/godot-version.txt"
          cp godot/tests/gen006_streaming_slice_demo.gd \
             godot/tests/gen006_streaming_slice_demo.tscn "$dir/project/tests/"
          cp qa-only/godot/tests/gen006_bounded_edit_queue_graphical_qa.gd \
             "$dir/project/tests/"
          cat > "$dir/project/project.godot" <<'EOP'
          config_version=5
          [application]
          config/name="GEN006 Independent Bounded Queue Native Acceptance"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=800
          window/size/window_width_override=1280
          window/size/window_height_override=800
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOP
          export GEN006_SLICE_EXECUTABLE="$PWD/$dir/streaming-slice"
          export GEN006_SLICE_ROOT="$PWD/$dir/world"
          export GEN006_QUEUE_EVIDENCE="$PWD/$dir/screenshots"
          export GEN006_SLICE_FORCE_ASYNC_TEST=1
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x800x24' \
            timeout 240 "$godot_bin" --rendering-driver opengl3 \
              --path "$dir/project" --script res://tests/gen006_bounded_edit_queue_graphical_qa.gd \
            2>&1 | tee "$dir/godot.log"
          grep -q 'GEN006_BOUNDED_QUEUE_GRAPHICAL_PASS' "$dir/godot.log"
          grep -q 'accepted_edits=17' "$dir/godot.log"
          grep -q 'refusal_without_edit=1' "$dir/godot.log"
          for name in 00-empty-queue 01-queue-saturated 02-queue-drained; do
            test -s "$dir/screenshots/$name.png"
          done
          sha256sum "$dir"/screenshots/*.png | tee "$dir/screenshots.sha256"
      - name: Independently qualify real Empty and Water drag through signed LRU reload
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          dir=build/gen006-bounded-queue-qa
          mkdir -p "$dir/drag-screenshots"
          cp qa-only/godot/tests/gen006_drag_material_roundtrip_qa.gd "$dir/project/tests/"
          export GEN006_SLICE_EXECUTABLE="$PWD/$dir/streaming-slice"
          export GEN006_SLICE_ROOT="$PWD/$dir/drag-world"
          export GEN006_DRAG_MATERIAL_EVIDENCE="$PWD/$dir/drag-screenshots"
          export GEN006_SLICE_FORCE_ASYNC_TEST=1
          export LIBGL_ALWAYS_SOFTWARE=1
          godot_bin="$(find "$dir/bin" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          xvfb-run -a -s '-screen 0 1280x800x24' \
            timeout 480 "$godot_bin" --rendering-driver opengl3 \
              --path "$dir/project" --script res://tests/gen006_drag_material_roundtrip_qa.gd \
            2>&1 | tee "$dir/drag-godot.log"
          grep -q 'GEN006_DRAG_MATERIAL_ROUNDTRIP_PASS' "$dir/drag-godot.log"
          grep -q 'native_empty_intent=4' "$dir/drag-godot.log"
          grep -q 'durable_acks=20' "$dir/drag-godot.log"
          for name in 00-materials-before-eviction 01-materials-after-reload; do
            test -s "$dir/drag-screenshots/$name.png"
          done
          sha256sum "$dir"/drag-screenshots/*.png | tee "$dir/drag-screenshots.sha256"
      - name: Independently qualify signed Go coalescing under stopped native owner
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          dir=build/gen006-bounded-queue-qa
          mkdir -p "$dir/go-stall-screenshots"
          cp qa-only/godot/tests/gen006_signed_go_stalled_owner_qa.gd "$dir/project/tests/"
          export GEN006_SLICE_EXECUTABLE="$PWD/$dir/streaming-slice"
          export GEN006_SLICE_ROOT="$PWD/$dir/go-stall-world"
          export GEN006_SIGNED_STALL_EVIDENCE="$PWD/$dir/go-stall-screenshots"
          export GEN006_SLICE_FORCE_ASYNC_TEST=1
          export LIBGL_ALWAYS_SOFTWARE=1
          godot_bin="$(find "$dir/bin" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          xvfb-run -a -s '-screen 0 1280x800x24' \
            timeout 480 "$godot_bin" --rendering-driver opengl3 \
              --path "$dir/project" --script res://tests/gen006_signed_go_stalled_owner_qa.gd \
            2>&1 | tee "$dir/go-stall-godot.log"
          grep -q 'GEN006_SIGNED_GO_STALLED_OWNER_PASS' "$dir/go-stall-godot.log"
          grep -q 'coalesced_intermediate_go=3' "$dir/go-stall-godot.log"
          grep -q 'durable_original_edit=1' "$dir/go-stall-godot.log"
          for name in 00-signed-go-live 01-signed-go-native-stopped 02-signed-go-native-restored; do
            test -s "$dir/go-stall-screenshots/$name.png"
          done
          sha256sum "$dir"/go-stall-screenshots/*.png | tee "$dir/go-stall-screenshots.sha256"
      - name: Preserve original source / native / Godot evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen006-bounded-edit-queue-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/gen006-bounded-queue-qa/*.txt
            build/gen006-bounded-queue-qa/native-compile.log
            build/gen006-bounded-queue-qa/godot.log
            build/gen006-bounded-queue-qa/screenshots/*.png
            build/gen006-bounded-queue-qa/screenshots.sha256
            build/gen006-bounded-queue-qa/drag-godot.log
            build/gen006-bounded-queue-qa/drag-screenshots/*.png
            build/gen006-bounded-queue-qa/drag-screenshots.sha256
            build/gen006-bounded-queue-qa/go-stall-godot.log
            build/gen006-bounded-queue-qa/go-stall-screenshots/*.png
            build/gen006-bounded-queue-qa/go-stall-screenshots.sha256
          if-no-files-found: warn
          retention-days: 90
