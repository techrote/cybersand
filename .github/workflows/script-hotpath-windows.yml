name: SCRIPT-HOTPATH-001 exact-head Windows GDExtension and Workbench A/B

on:
  push:
    branches: [exp/script-hotpath-001-native-fill]
    paths:
      - '.github/workflows/script-hotpath-windows.yml'
      - 'tools/ci/qualify_script_hotpath_windows.py'
      - 'godot/tests/test_paint_editor_workbench.gd'
      - 'godot/tests/*script_hotpath_native_fill.gd'
      - 'godot/scripts/workbench_paint_editor_shapes.gd'
      - 'godot/native_extension/**'
      - 'native/include/cybersand/paint_fill_planner.hpp'
      - 'tools/build_native_extension_windows.sh'
      - 'tools/build_pinned_godot_cpp.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: script-hotpath-windows-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
  GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip

jobs:
  windows-build:
    name: Pinned source-matched Windows GDExtension DLL
    # Routine Windows cross-build validation runs on the standard GitHub-hosted
    # Ubuntu runner using the pinned LLVM-MinGW toolchain below.
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify required host tools
        run: |
          python3 --version
          git --version
          curl --version
          tar --version
          xz --version
          file --version

      - name: Install pinned SCons
        run: |
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'

      - name: Check out exact godot-cpp source
        run: |
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout "$(python3 tools/ci/execution_policy.py seconds dependency_prepare_seconds)" git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      - name: Prepare exact LLVM-MinGW
        run: |
          timeout "$(python3 tools/ci/execution_policy.py seconds dependency_prepare_seconds)" curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          test -x "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-g++"
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then
            ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
          fi

      - name: Build Windows godot-cpp and CyberSand extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "2"
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
        run: |
          python3 tools/ci/run_timed_command.py --policy-key native_compile_seconds --label godot-cpp-windows --output-dir build/build-timing/godot-cpp-windows -- tools/build_pinned_godot_cpp.sh windows
          python3 tools/ci/run_timed_command.py --policy-key native_compile_seconds --label extension-windows --output-dir build/build-timing/extension-windows -- tools/build_native_extension_windows.sh
          file "$CYBERSAND_NATIVE_OUTPUT" | tee "$RUNNER_TEMP/windows-file.txt"
          grep -q 'PE32+ executable (DLL).*x86-64' "$RUNNER_TEMP/windows-file.txt"
          "$LLVM_MINGW_ROOT/bin/llvm-objdump" -p "$CYBERSAND_NATIVE_OUTPUT" > "$RUNNER_TEMP/windows-imports.txt"
          sha256sum "$CYBERSAND_NATIVE_OUTPUT"

      - name: Stage exact-source Windows GDExtension candidate
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          mkdir -p build/windows-candidate
          cp "$RUNNER_TEMP/cybersand_native.windows.x86_64.dll" build/windows-candidate/
          echo "$source_sha" > build/windows-candidate/source-sha.txt
          {
            echo "godot_cpp_commit=$GODOT_CPP_COMMIT"
            echo "llvm_mingw_sha256=$LLVM_MINGW_SHA256"
          } > build/windows-candidate/toolchain.txt
          ( cd build/windows-candidate
            sha256sum cybersand_native.windows.x86_64.dll > runtime.sha256
            sha256sum --check --strict runtime.sha256
          )
          python3 tools/ci/native_candidate_identity.py build/windows-candidate --create

      # This candidate is NOT a replacement for the committed LFS DLL or its
      # source/identity manifest. No production provenance gate is bypassed.
      - name: Retain source-matched Windows GDExtension candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-candidate-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-candidate/
          if-no-files-found: error
          retention-days: 90

      - name: Retain compiler process timing and original logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: godot-build-timing-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/build-timing/
          if-no-files-found: warn
          retention-days: 90

  windows-workbench:
    name: Windows GDExtension differential, PAINT and repeated Workbench A/B
    needs: [windows-build]
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout immutable exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 0
      - name: Restore source-matched Windows Rapier native DLL
        timeout-minutes: 10
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          python -c 'import hashlib,pathlib; p=pathlib.Path("godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll"); assert hashlib.sha256(p.read_bytes()).hexdigest()=="b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7"'
      - name: Download same-run source-derived Windows candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-candidate-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-candidate
      - name: Verify candidate identity and install only the source-derived DLL
        run: |
          set -euo pipefail
          python tools/ci/native_candidate_identity.py build/windows-candidate
          mkdir -p godot/addons/cybersand_native/bin
          cp build/windows-candidate/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/
          python -m py_compile tools/ci/qualify_script_hotpath_windows.py
      - name: Download official pinned Godot 4.7 Windows runtime
        timeout-minutes: 20
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 60 --max-time 1100 --output "$RUNNER_TEMP/godot-windows.zip" "$GODOT_WINDOWS_URL"
      - name: Run actual Windows native and fallback parity and headless Workbench ABBA
        timeout-minutes: 70
        run: |
          set -euo pipefail
          python tools/ci/qualify_script_hotpath_windows.py --archive "$RUNNER_TEMP/godot-windows.zip" --candidate build/windows-candidate --source-sha "$GITHUB_SHA" --output build/script-hotpath-windows
      - name: Retain complete exact-HEAD Windows evidence and pacing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: script-hotpath-windows-workbench-${{ github.sha }}-${{ github.run_id }}
          path: build/script-hotpath-windows/
          if-no-files-found: warn
          retention-days: 90
