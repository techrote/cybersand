name: INV154 Windows Rapier thread execution experiment

on:
  workflow_dispatch:
  push:
    branches: [codex/inv154-windows-thread-time-20261105]
    paths:
      - .github/workflows/inv154-rapier-thread-time-windows.yml
      - tools/performance/rapier_thread_time.py
      - tools/performance/rapier_thread_probe/**
      - godot/tests/performance/test_main_rapier_thread_cpu_windows.gd
      - godot/tests/performance/rapier_thread_probe/**

permissions:
  contents: read

concurrency:
  group: inv154-thread-time-${{ github.sha }}
  cancel-in-progress: false

jobs:
  targeted-windows-experiment:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize unchanged retained Windows runtimes
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull --include="godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/check_ci_provider_policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned official Godot
        shell: python
        run: |
          import hashlib, json, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'tools/ci')
          import run_windows_godot_regressions as runtime
          out = Path('build/inv154-thread-time').resolve()
          out.mkdir(parents=True, exist_ok=True)
          archive = out / 'Godot_v4.7-stable_win64.exe.zip'
          urllib.request.urlretrieve('https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip', archive)
          engine, identity = runtime.prepare_godot(archive)
          (out / 'engine-identity.json').write_text(json.dumps(identity, indent=2), encoding='utf-8')
          (out / 'engine-path.txt').write_text(str(engine), encoding='utf-8')
          archive.unlink()
      - name: Build isolated diagnostic CPU-counter extension
        shell: pwsh
        run: |
          $engine = Get-Content build/inv154-thread-time/engine-path.txt
          python tools/performance/rapier_thread_probe/build_probe.py --engine $engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import unchanged project and validate diagnostic source
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          out = Path('build/inv154-thread-time')
          engine = (out / 'engine-path.txt').read_text(encoding='utf-8')
          result = subprocess.run([engine, '--headless', '--editor', '--path', 'godot', '--import'], capture_output=True, text=True, timeout=130)
          (out / 'import.log').write_text(result.stdout + '\n' + result.stderr, encoding='utf-8')
          result.check_returncode()
          subprocess.run(['python', 'tools/performance/rapier_thread_time.py', '--validate'], check=True, timeout=60)
      - name: Three repeated profiling off and on comparisons
        shell: pwsh
        run: |
          $engine = Get-Content build/inv154-thread-time/engine-path.txt
          python tools/performance/rapier_thread_time.py --engine $engine --output build/inv154-thread-time --trials 3 --etw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve raw traces, failures and source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inv154-windows-thread-time-${{ github.run_id }}
          path: |
            build/inv154-thread-time/
            build/rapier-thread-probe/
          if-no-files-found: warn
          retention-days: 90
