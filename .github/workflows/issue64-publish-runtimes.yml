name: Issue 64 publish source-matched runtimes

# One-shot #64 publication. This branch deliberately has no PR, so publishing
# provenance does not duplicate the already-passed PR source validation.
on:
  push:
    branches: [codex/issue-64-runtime-publication]
    paths: [.github/workflows/issue64-publish-runtimes.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: issue64-publish-runtimes
  cancel-in-progress: true

env:
  SOURCE_SHA: f5bc9a887b01693bcef7116a164063d44d42a255
  SOURCE_TREE: f9eb4137f9e193457ef45e6078ec0e22d229a9f4
  SOURCE_MERGE_SHA: 8996f9871163e554fc62cb5a5190eec69de76e3d
  NATIVE_RUN: "35521544125"
  GDEXT_RUN: "35521544247"
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65

jobs:
  publish:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-64-runtime-publication'
    runs-on: avrea-ubuntu-24.04-2-vcpu
    timeout-minutes: 45
    steps:
      - name: Check out publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Reconfirm frozen source and documentation delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git merge-base HEAD "$SOURCE_SHA")" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA"..HEAD -- native godot/native_extension
          git diff --check "$SOURCE_SHA"..HEAD

      - name: Restore validated Linux runtime from source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-runtime-35521544247
          path: ${{ runner.temp }}/issue64-linux
          github-token: ${{ github.token }}
          repository: techrote/cybersand
          run-id: 35521544247

      - name: Verify and install source-validated Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/issue64-linux/source-sha.txt")" = "$SOURCE_MERGE_SHA"
          (cd "$RUNNER_TEMP/issue64-linux" && sha256sum --check --strict runtime.sha256)
          cp "$RUNNER_TEMP/issue64-linux/libcybersand_native.linux.x86_64.so" \
            godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          timeout 1m tools/check_linux_runtime_floor.sh

      - name: Install pinned SCons
        run: |
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'

      - name: Check out exact godot-cpp source
        run: |
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      - name: Prepare exact LLVM-MinGW
        run: |
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          test -x "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-g++"
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then
            ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
          fi

      - name: Build retained Windows x86_64 runtime once
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: "2"
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
        run: |
          set -euo pipefail
          timeout 35m tools/build_pinned_godot_cpp.sh windows
          timeout 20m tools/build_native_extension_windows.sh
          file "$CYBERSAND_NATIVE_OUTPUT" | grep 'PE32+ executable (DLL).*x86-64'
          cp "$CYBERSAND_NATIVE_OUTPUT" \
            godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll

      - name: Regenerate source-matched runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          export PUBLICATION_RUN="$GITHUB_RUN_ID"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.')
          source = os.environ['SOURCE_SHA']
          tree = os.environ['SOURCE_TREE']
          merge = os.environ['SOURCE_MERGE_SHA']
          native_run = os.environ['NATIVE_RUN']
          gdext_run = os.environ['GDEXT_RUN']
          publication_run = os.environ['PUBLICATION_RUN']
          win_path = root/'godot/addons/cybersand_native/runtime-provenance.json'
          lin_path = root/'godot/addons/cybersand_native/runtime-provenance.linux.json'
          win = json.loads(win_path.read_text())
          lin = json.loads(lin_path.read_text())
          inputs = sorted(set(win['source_inputs']) | set(lin['source_inputs']))
          source_inputs = {}
          for rel in inputs:
              data = (root/rel).read_bytes().replace(b'\r\n', b'\n')
              source_inputs[rel] = hashlib.sha256(data).hexdigest()
          required = {
              'native/include/cybersand/bounded_ordered_index.hpp',
              'native/include/cybersand/settled_discovery.hpp',
              'native/include/cybersand/settled_regions.hpp',
              'native/include/cybersand/settled_world_discovery.hpp',
              'native/include/cybersand/world.hpp',
              'native/src/settled_world_discovery.cpp',
              'native/src/world.cpp',
          }
          assert required <= set(source_inputs), required-set(source_inputs)
          linux = root/'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so'
          windows = root/'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll'
          linux_sha = hashlib.sha256(linux.read_bytes()).hexdigest()
          windows_sha = hashlib.sha256(windows.read_bytes()).hexdigest()
          evidence = 'docs/audits/2026-09-20-issue-64-stage3b-local-graph.md'
          win.update({
              'schema_version': 1,
              'status': 'validated-build-runtime',
              'source_commit': source,
              'source_tree': tree,
              'artifact': 'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll',
              'sha256': windows_sha,
              'size': windows.stat().st_size,
              'source_input_hash_kind': 'SHA-256 of canonical Git blob bytes; CRLF working files normalize to LF',
              'source_inputs': source_inputs,
              'evidence': evidence,
              'validated_platform': 'Windows x86_64 Godot 4.7 (pinned cross-build; execution unavailable)',
              'toolchain': 'LLVM-MinGW 20260826 UCRT Clang 23.1.0; godot-cpp 101ae38034304346a46ea9ea84ae156d3e860496; Stage-3B #64 exact local graph source',
              'acceptance': f'Exact #64 source passed the ordinary Windows cross-build in Actions run {gdext_run}; retained equivalent-source Windows bytes were rebuilt once in publication run {publication_run}. Actual Windows execution is unavailable and not claimed.',
              'validation_output': f'Actions runs {gdext_run} and {publication_run}',
              'other_platforms': 'Linux runtime was retained from the same exact-tree PR validation. Browser/WebAssembly execution and hardware-GPU/target-PC performance remain unavailable and are not claimed.'
          })
          lin.update({
              'schema_version': 1,
              'status': 'validated-development-runtime',
              'source_commit': source,
              'source_tree': tree,
              'artifact': 'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so',
              'sha256': linux_sha,
              'size': linux.stat().st_size,
              'source_input_hash_kind': 'SHA-256 of canonical Git blob bytes; CRLF working files normalize to LF',
              'source_inputs': source_inputs,
              'evidence': evidence,
              'validated_platform': 'Linux x86_64 Godot 4.7',
              'toolchain': 'Ubuntu 24.04, GCC/G++ 13.3.0, binutils 2.42, SCons 4.10.1; godot-cpp 101ae38034304346a46ea9ea84ae156d3e860496; Stage-3B #64 exact local graph source',
              'acceptance': f'Exact-tree #64 Linux x86_64 GDExtension build, ABI-floor validation, four regression shards and Linux gate passed in Actions run {gdext_run}; native/sanitizer/TSan validation passed in {native_run}. The retained artifact was built from PR merge {merge}, whose Git tree exactly equals source tree {tree}.',
              'other_platforms': 'Windows source-validation and retained cross-build use the same frozen native source but do not constitute Windows execution. Browser/WebAssembly execution and hardware-GPU/target-PC performance remain unavailable and are not claimed.',
              'workflow_run': f'https://github.com/techrote/cybersand/actions/runs/{gdext_run}'
          })
          for payload in (win, lin):
              for key in ('equivalent_branch_head', 'tested_merge_commit', 'artifact_id', 'artifact_zip_sha256'):
                  payload.pop(key, None)
          win_path.write_text(json.dumps(win, indent=2) + '\n')
          lin_path.write_text(json.dumps(lin, indent=2) + '\n')

          audit = root/'docs/audits/2026-09-20-issue-64-stage3b-local-graph.md'
          audit_text = audit.read_text()
          if 'ISSUE64_PUBLICATION_RUN' not in audit_text:
              raise SystemExit('issue64 publication marker missing')
          audit.write_text(audit_text.replace('ISSUE64_PUBLICATION_RUN', publication_run))
          PY

      - name: Verify source inputs and runtime identities before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.')
          for name in ('runtime-provenance.json', 'runtime-provenance.linux.json'):
              manifest = json.loads((root/'godot/addons/cybersand_native'/name).read_text())
              for rel, expected in manifest['source_inputs'].items():
                  actual = hashlib.sha256((root/rel).read_bytes().replace(b'\r\n', b'\n')).hexdigest()
                  assert actual == expected, (name, rel, actual, expected)
              artifact = root/manifest['artifact']
              data = artifact.read_bytes()
              assert hashlib.sha256(data).hexdigest() == manifest['sha256'], name
              assert len(data) == manifest['size'], name
          PY
          timeout 5m python3 tools/ci/check_m11_consistency.py
          git diff --check

      - name: Retain exact publication bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/issue64-runtimes"
          cp godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so "$RUNNER_TEMP/issue64-runtimes/"
          cp godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll "$RUNNER_TEMP/issue64-runtimes/"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/issue64-runtimes/source-sha.txt"
          printf '%s\n' "$SOURCE_TREE" > "$RUNNER_TEMP/issue64-runtimes/source-tree.txt"
          (cd "$RUNNER_TEMP/issue64-runtimes" && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue64-source-matched-runtimes-${{ github.sha }}
          path: ${{ runner.temp }}/issue64-runtimes/
          if-no-files-found: error
          retention-days: 30

      - name: Publish LFS runtimes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git add \
            godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll \
            godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so \
            godot/addons/cybersand_native/runtime-provenance.json \
            godot/addons/cybersand_native/runtime-provenance.linux.json \
            docs/audits/2026-09-20-issue-64-stage3b-local-graph.md
          git rm -f .github/workflows/issue64-publish-runtimes.yml
          git diff --cached --check
          git config user.name techrote
          git config user.email 261801702+techrote@users.noreply.github.com
          git commit -m 'build(stage3b): publish issue 64 source-matched runtimes'
          git lfs fsck
          git push origin HEAD:codex/issue-64-runtime-publication
