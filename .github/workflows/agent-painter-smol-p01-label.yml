name: SMOL P01 real upstream tokenizer label proposal (no TRAIN)
on:
  push:
    branches: [codex/agent-painter-smol-568]
    paths:
      - experiments/agent_painter/lanes/smol/P01_PROPOSED_LABEL_REVIEW_V1.json
      - experiments/agent_painter/lanes/smol/p01_label_review.py
      - .github/workflows/agent-painter-smol-p01-label.yml
permissions:
  contents: read
concurrency:
  group: smol-p01-label-${{ github.sha }}
  cancel-in-progress: false
jobs:
  upstream-smol-tokenizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact source and hosted-only CI policy
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REF" = refs/heads/codex/agent-painter-smol-568
          test "$GITHUB_REPOSITORY" = techrote/cybersand
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/smol-p01-ci-policy.json
      - name: Preserve partial receipt and run 12 model-free source/adversarial proofs
        run: |
          set -euo pipefail
          mkdir -p evidence/smol-p01-label
          printf '%s\n' "$GITHUB_SHA" > evidence/smol-p01-label/source-head.txt
          python3 experiments/agent_painter/lanes/smol/p01_label_review.py --self-test
          python3 experiments/agent_painter/lanes/smol/p01_label_review.py \
            --output evidence/smol-p01-label/source-only.json
      - name: Isolated pinned tokenizer dependencies, no model weights or torch training
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/p01-tokenizer"
          "$RUNNER_TEMP/p01-tokenizer/bin/python" -m pip install \
            'huggingface-hub==2.4.0' 'tokenizers==0.23.3' 'transformers==5.22.2' \
            'jinja2==3.1.6' 'markupsafe==3.0.3'
          "$RUNNER_TEMP/p01-tokenizer/bin/python" -m pip check
          "$RUNNER_TEMP/p01-tokenizer/bin/python" -m pip freeze --all > evidence/smol-p01-label/pip-freeze.txt
      - name: Fetch pinned model tokenizer/config small files only
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 600s "$RUNNER_TEMP/p01-tokenizer/bin/python" - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id="HuggingFaceTB/SmolLM2-135M-Instruct",
                            revision="12fd25f77366fa6b3b4b768ec3050bf629380bac",
                            allow_patterns=["config.json", "tokenizer.json", "tokenizer_config.json"],
                            local_dir=os.environ["RUNNER_TEMP"]+"/p01-smol")
          PY
      - name: Authentic model chat framing/complete JSON/EOS loss mask proof
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 300s "$RUNNER_TEMP/p01-tokenizer/bin/python" \
            experiments/agent_painter/lanes/smol/p01_label_review.py \
            --snapshot "$RUNNER_TEMP/p01-smol" \
            --output evidence/smol-p01-label/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smol-p01-label-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/smol-p01-label/
          if-no-files-found: warn
          retention-days: 90
