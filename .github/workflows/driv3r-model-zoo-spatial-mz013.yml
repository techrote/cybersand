name: MZ-013 20M causal transformer versus recurrent spatial paint policies (HOLD)
on:
  push:
    branches: ['research/model-zoo-spatial-paint-mz013']
    paths:
      - 'experiments/driv3r/model_zoo/spatial_paint_mz013/**'
      - '.github/workflows/driv3r-model-zoo-spatial-mz013.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mz013-spatial-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  cpu-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact-parent game-write prohibition
        run: |
          git diff --name-only 7e6c3e416588549a2bfe6d83c5d75e948d64f7f3 HEAD > "$RUNNER_TEMP/mz013-changes.txt"
          cat "$RUNNER_TEMP/mz013-changes.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          names = Path(os.environ["RUNNER_TEMP"], "mz013-changes.txt").read_text().splitlines()
          assert names and all(
              name.startswith("experiments/driv3r/model_zoo/spatial_paint_mz013/")
              or name == ".github/workflows/driv3r-model-zoo-spatial-mz013.yml"
              for name in names), names
          print("MZ-013 research-only file scope PASS")
          PY
      - name: Pinned CPU-only PyTorch and dependency evidence
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip freeze > "$RUNNER_TEMP/mz013-packages.txt"
      - name: Qualify original 2-D host and new 20M model
        run: |
          python -m unittest -v experiments.driv3r.model_zoo.spatial_paint_mz013.test_spatial
      - name: Actual matched minibatch training and independently held-out trajectories
        run: |
          python -m experiments.driv3r.model_zoo.spatial_paint_mz013.run \
            --out "$RUNNER_TEMP/mz013" --train-seeds 96 --eval-seeds 12 \
            --rollout-seeds 3 --updates 220 --batch 12
      - name: Checkpoint integrity, source exactness and independent TEST reproduction
        run: |
          python - <<'PY'
          import hashlib,json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          import torch
          from experiments.driv3r.model_zoo.spatial_paint_mz013 import run as mz
          torch.set_num_threads(2)
          out = Path(os.environ["RUNNER_TEMP"],"mz013")
          report=json.loads((out/"metrics.json").read_text())
          assert report["schema"]==mz.SCHEMA
          assert report["source_sha"]==os.environ["GITHUB_SHA"]
          assert report["parent_sha"]==mz.PARENT_SHA
          assert report["training"]["updates_per_model"]==220
          assert report["training"]["train_episodes"]==96*4*2
          assert report["training"]["test_episodes"]==12*4*2
          assert report["training"]["shifted_episodes"]==12*4*2
          assert hashlib.sha256((out/"models.pt").read_bytes()).hexdigest()==report["checkpoint_sha256"]
          state=torch.load(out/"models.pt",map_location="cpu",weights_only=True)
          assert state["schema"]==mz.SCHEMA
          assert state["source_sha"]==report["source_sha"]
          assert tuple(state["actions"])==mz.ACTIONS
          nets=mz.models(torch,state["width"])
          assert {k:sum(p.numel() for p in v.parameters()) for k,v in nets.items()} == report["parameters"]
          for name,net in nets.items():
              net.load_state_dict(state["models"][name],strict=True)
              net.eval()
              for label,seed_family,ood in (
                  ("test",range(5000,5012),False),
                  ("shifted_spacing",range(6000,6012),True)):
                  x,y=mz.tensors(torch,mz.corpus(seed_family,ood=ood))
                  actual=mz.evaluate(torch,net,x,y)
                  assert actual==report["scores"][name][label],(name,label,actual)
          assert all(a["matched"]==a["episodes"] for a in report["cached_parity"].values())
          assert ET.parse(out/"trajectories.svg").getroot().tag.endswith("svg")
          print("Exact source, real model checkpoint, TEST/OOD reproduction, stateful parity and SVG PASS")
          PY
      - name: Publish immutable trained models, metrics, trajectory gallery and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mz013-spatial-paint-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mz013/**
            ${{ runner.temp }}/mz013-packages.txt
            ${{ runner.temp }}/mz013-changes.txt
          if-no-files-found: warn
          retention-days: 14
