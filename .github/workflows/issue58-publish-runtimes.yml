name: Issue 58 publish retained source-matched runtimes

# Recovery publication only: consume the already-built exact-source artifact from
# run 35463292615, publish its bytes/provenance, then delete this workflow.
on:
  push:
    branches: [codex/issue-58-stage3b-lifecycle]
    paths: [.github/workflows/issue58-publish-runtimes.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: issue58-publish-runtimes
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-58-stage3b-lifecycle'
    runs-on: avrea-ubuntu-24.04-1-vcpu
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Restore retained exact-source runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue58-source-matched-runtimes-204ae8e1ebdc1f6e782a3278804d0ac92ef871ce
          path: ${{ runner.temp }}/issue58-runtimes
          github-token: ${{ github.token }}
          repository: techrote/cybersand
          run-id: 35463292615

      - name: Verify retained build identity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/issue58-runtimes"
          test "$(cat source-sha.txt)" = "204ae8e1ebdc1f6e782a3278804d0ac92ef871ce"
          sha256sum --check --strict SHA256SUMS
          file libcybersand_native.linux.x86_64.so | grep 'ELF 64-bit.*x86-64'
          file cybersand_native.windows.x86_64.dll | grep 'PE32+ executable (DLL).*x86-64'

      - name: Install retained runtimes and regenerate provenance
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/issue58-runtimes/libcybersand_native.linux.x86_64.so" godot/addons/cybersand_native/bin/
          cp "$RUNNER_TEMP/issue58-runtimes/cybersand_native.windows.x86_64.dll" godot/addons/cybersand_native/bin/
          export SOURCE_SHA="$(cat "$RUNNER_TEMP/issue58-runtimes/source-sha.txt")"
          export SOURCE_TREE="$(cat "$RUNNER_TEMP/issue58-runtimes/source-tree.txt")"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('.')
          source=os.environ['SOURCE_SHA']
          tree=os.environ['SOURCE_TREE']
          build_run='35463292615'
          win_path=root/'godot/addons/cybersand_native/runtime-provenance.json'
          lin_path=root/'godot/addons/cybersand_native/runtime-provenance.linux.json'
          win=json.loads(win_path.read_text())
          lin=json.loads(lin_path.read_text())
          inputs=set(win['source_inputs']) | set(lin['source_inputs'])
          source_inputs={}
          for rel in sorted(inputs):
              data=(root/rel).read_bytes().replace(b'\r\n',b'\n')
              source_inputs[rel]=hashlib.sha256(data).hexdigest()
          required={
              'native/include/cybersand/settled_world_discovery.hpp',
              'native/src/settled_world_discovery.cpp',
              'native/src/world.cpp',
          }
          assert required <= set(source_inputs), required-set(source_inputs)
          linux=root/'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so'
          windows=root/'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll'
          linux_sha=hashlib.sha256(linux.read_bytes()).hexdigest()
          windows_sha=hashlib.sha256(windows.read_bytes()).hexdigest()
          evidence='docs/audits/issue-12-2026-09-19/stage3b-parent-decision.md'
          artifact=f'issue58-source-matched-runtimes-{source}'
          win.update({
              'schema_version':1,
              'status':'validated-build-runtime',
              'source_commit':source,
              'source_tree':tree,
              'artifact':'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll',
              'sha256':windows_sha,
              'size':windows.stat().st_size,
              'source_input_hash_kind':'SHA-256 of canonical Git blob bytes; CRLF working files normalize to LF',
              'source_inputs':source_inputs,
              'evidence':evidence,
              'validated_platform':'Windows x86_64 Godot 4.7 (pinned cross-build; execution unavailable)',
              'toolchain':'LLVM-MinGW 20260826 UCRT Clang 23.1.0; godot-cpp 101ae38034304346a46ea9ea84ae156d3e860496; Stage-3B #58 lifecycle source',
              'acceptance':f'Exact #58-source Windows x86_64 GDExtension cross-build passed in Actions run {build_run}. Actual Windows execution is unavailable and not claimed.',
              'validation_output':f'Actions run {build_run} / artifact {artifact}',
              'other_platforms':'Linux runtime was rebuilt from the same exact native source. Browser/WebAssembly execution and hardware-GPU/target-PC performance remain unavailable and are not claimed.'
          })
          for k in ['equivalent_branch_head','tested_merge_commit','artifact_id','workflow_run','artifact_zip_sha256']:
              win.pop(k,None)
          lin.update({
              'schema_version':1,
              'status':'validated-development-runtime',
              'source_commit':source,
              'source_tree':tree,
              'artifact':'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so',
              'sha256':linux_sha,
              'size':linux.stat().st_size,
              'source_input_hash_kind':'SHA-256 of canonical Git blob bytes; CRLF working files normalize to LF',
              'source_inputs':source_inputs,
              'evidence':evidence,
              'validated_platform':'Linux x86_64 Godot 4.7',
              'toolchain':'Ubuntu 24.04, GCC/G++ 13.3.0, binutils 2.42, SCons 4.10.1; godot-cpp 101ae38034304346a46ea9ea84ae156d3e860496; Stage-3B #58 lifecycle source',
              'acceptance':f'Exact #58-source Linux x86_64 GDExtension build and ABI-floor validation passed in Actions run {build_run}. Exact-head Godot acceptance is rerun after publication.',
              'other_platforms':'Windows cross-build is from the same exact native source but is not Windows execution. Browser/WebAssembly execution and hardware-GPU/target-PC performance remain unavailable and are not claimed.',
              'workflow_run':f'https://github.com/techrote/cybersand/actions/runs/{build_run}'
          })
          for k in ['equivalent_branch_head','tested_merge_commit','artifact_id','artifact_zip_sha256']:
              lin.pop(k,None)
          win_path.write_text(json.dumps(win,indent=2)+'\n')
          lin_path.write_text(json.dumps(lin,indent=2)+'\n')
          PY

      - name: Verify, commit and publish retained runtimes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          for name in ['runtime-provenance.json','runtime-provenance.linux.json']:
              m=json.loads((root/'godot/addons/cybersand_native'/name).read_text())
              for rel,expected in m['source_inputs'].items():
                  actual=hashlib.sha256((root/rel).read_bytes().replace(b'\r\n',b'\n')).hexdigest()
                  assert actual==expected,(name,rel)
              data=(root/m['artifact']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==m['sha256']
              assert len(data)==m['size']
          PY
          git lfs install --local
          git add \
            godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll \
            godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so \
            godot/addons/cybersand_native/runtime-provenance.json \
            godot/addons/cybersand_native/runtime-provenance.linux.json
          git rm -f .github/workflows/issue58-publish-runtimes.yml
          git diff --cached --check
          git config user.name techrote
          git config user.email 261801702+techrote@users.noreply.github.com
          git commit -m 'build(stage3b): publish issue 58 source-matched runtimes'
          python3 tools/ci/check_repository.py --require-materialized
          git lfs fsck
          git status --porcelain=v1
          git push origin HEAD:codex/issue-58-stage3b-lifecycle
