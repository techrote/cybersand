name: QL-002 branch-retrace extreme quant repair (research only)
on:
  push:
    branches:
      - 'research/driv3r-quant-lab-*'
    paths:
      - 'experiments/driv3r/quant_lab/ql002_branch_retrace.py'
      - 'experiments/driv3r/quant_lab/quant_worm.py'
      - 'experiments/driv3r/quant_lab/QL002.md'
      - '.github/workflows/driv3r-quant-lab-ql002.yml'
      - '.github/workflows/driv3r-quant-lab-ql001.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ql002-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  learned-six-action-precision-ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only pinned dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Test actual host legal menus and curriculum coverage
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql002_branch_retrace.py --self-test
      - name: 700 real optimizer updates plus 75 Q2 STE repair updates and original PNGs
        run: |
          python experiments/driv3r/quant_lab/ql002_branch_retrace.py \
            --out ql002-out --steps 350 --repair-steps 75
      - name: Verify exact source, train and held-out evidence, packed models and every PNG
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('ql002-out')
          r=json.loads((p/'results.json').read_text())
          assert r['source_sha'] == os.environ['GITHUB_SHA']
          assert r['train_n'] > 1000 and r['heldout_n'] > 1000
          assert not set(range(2100,2180)).intersection(range(9100,9132))
          assert all(r['train_hist'].get(a,0)>0 and r['heldout_hist'].get(a,0)>0
                     for a in ('STOP','BRANCH','RETRACE','LEFT','RIGHT','STRAIGHT'))
          assert len(r['variants']) == 9 and len(r['controls']) == 3
          assert all(v['moment_tensors_nonzero'] > 0 for v in r['training'].values())
          assert [r['training'][x]['updates'] for x in
                  ('regular','balanced','q2-qat')] == [350,350,75]
          assert len(list((p/'gallery').glob('*.png'))) == 108
          d=json.loads((p/'raw_decisions.json').read_text())
          assert len(d)==108
          assert hashlib.sha256((p/'raw_decisions.json').read_bytes()).hexdigest() == r['raw_decisions_sha256']
          entries=json.loads((p/'MANIFEST.json').read_text())
          assert entries and len({e['path'] for e in entries})==len(entries)
          for e in entries:
              b=(p/e['path']).read_bytes()
              assert len(b)==e['bytes']
              assert hashlib.sha256(b).hexdigest()==e['sha256'],e['path']
          for key,v in r['variants'].items():
              assert (p/'models'/(key+'.npz')).is_file()
              assert 0<=v['unmasked_top_action_legal_rate']<=1
              for a in ('BRANCH','RETRACE','STOP'):
                  assert v['heldout_actions'][a]['count']>0
              for e in v['visual_episodes']:
                  assert hashlib.sha256((p/e['png']).read_bytes()).hexdigest() == e['png_sha256']
          print('QL-002 EXACT-HEAD model/optimizer/original-PNG INVENTORY PASS')
          PY
      - name: Immutable learned checkpoint, quant model, first-pass trace and visual records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql002-six-action-quant-${{ github.sha }}
          path: ql002-out/
          if-no-files-found: warn
          retention-days: 21
