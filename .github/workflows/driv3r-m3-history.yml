name: DRIV3R M3 real PAINT Undo, branch relocation, short native sequence
on:
  pull_request:
    paths:
      - 'experiments/driv3r/native.py'
      - 'experiments/driv3r/m3_history/**'
      - 'godot/tests/run_driv3r_m3_history.gd'
      - '.github/workflows/driv3r-m3-history.yml'
  push:
    branches: [research/570-d-m3-history-short]
    paths: ['experiments/driv3r/m3_history/qualification-request.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: driv3r-m3-history-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cheap:
    name: Static history and source-fenced protocol guards
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm immutable M1 and approved prior native M3 ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8fa90de6be209ed0b7bd125039e6ec8b332fb1a6 HEAD
          git merge-base --is-ancestor 012e77001b30823836360ea09f16a674cdfdca13 HEAD
          echo 'ebe2fa211148602c614cba0f0a40f285cba797784b70efa035832d833877f80d  experiments/driv3r/d_common/v1/interface.schema.json' | sha256sum --check --strict
      - name: Run actual M1 contracts, focused offline and old native-adapter tests
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check 'jsonschema==4.26.0'
          python3 -m compileall -q experiments/driv3r/m3_history experiments/driv3r/native.py
          python3 -m unittest discover -s experiments/driv3r/m3_history -p 'test_*.py' -v
          python3 experiments/driv3r/d_common/v1/verify.py
          python3 -m unittest discover -s experiments/driv3r/d_common/v1 -p 'test_*.py' -v
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py
  qualify_native:
    name: Real Workbench history, native readback and four-step short control
    needs: cheap
    if: github.repository == 'techrote/cybersand' && github.event_name == 'push' && github.ref == 'refs/heads/research/570-d-m3-history-short'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source-build and execute strictly bounded real M3 history episodes
        run: timeout --signal=TERM --kill-after=60 7800 bash experiments/driv3r/m3_history/ci_history.sh
      - name: Retain original native World, PAINT history receipts and refusals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-m3-history-original-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/driv3r-m3-history/
          if-no-files-found: warn
          retention-days: 90
