name: DRIV3R FT-007 frozen checkpoint STOP time-feature probe

on:
  push:
    branches: [research/570-fleet-training-throughput-001]
    paths:
      - .github/workflows/driv3r-fleet-training-ft007.yml
      - experiments/driv3r/fleet_training/request_ft007.json
      - experiments/driv3r/fleet_training/ft007_stop_feature_probe.py
      - experiments/driv3r/fleet_training/test_ft007_stop_feature_probe.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: driv3r-ft007-one-source-pinned-diagnostic
  cancel-in-progress: false

jobs:
  frozen-feature-sensitivity:
    name: FT-007 genuine frozen policy scores and original autonomous trajectories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout independently pinned population source
        uses: actions/checkout@v4
        with:
          repository: techrote/cybersand
          ref: 534cd8ffac6fbe33a714ae03a62c16045bf10259
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen CPU inference dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 PyYAML==6.0.2
      - name: Qualify all fleet-training source contracts and CI policy
        run: |
          set -euo pipefail
          python -m compileall -q experiments/driv3r/fleet_training
          python -m unittest discover -s experiments/driv3r/fleet_training -p 'test_*.py' -v
          python tools/ci/check_ci_provider_policy.py
          python tools/ci/check_ci_scheduling_policy.py
      - name: Record source and unique diagnostic job lease
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ft007-original" "$RUNNER_TEMP/ft003-original"
          git rev-parse HEAD > "$RUNNER_TEMP/ft007-original/source-head.txt"
          sha256sum experiments/driv3r/fleet_training/request_ft007.json \
            experiments/driv3r/fleet_training/ft007_stop_feature_probe.py \
            > "$RUNNER_TEMP/ft007-original/source-files.sha256"
          printf 'run=%s job=%s source=%s lease=FT-007-one-runner-no-optimizer\n' \
            "$GITHUB_RUN_ID" "$GITHUB_JOB" "$GITHUB_SHA" \
            > "$RUNNER_TEMP/ft007-original/job-lease.txt"
      - name: Fetch original frozen FT-003 archive and verify exact ZIP SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$RUNNER_TEMP/ft003-original.zip" \
            "https://api.github.com/repos/techrote/cybersand/actions/artifacts/14194214028/zip"
          echo "fec6d5e254a0bbe590b44ba26bbb7427960af507a5c6fe78b1d7e5fe5389c910  $RUNNER_TEMP/ft003-original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ft003-original.zip" -d "$RUNNER_TEMP/ft003-original"
          sha256sum "$RUNNER_TEMP/ft003-original.zip" >> "$RUNNER_TEMP/ft007-original/source-files.sha256"
      - name: Real frozen policy feature intervention and source-faithful synthetic rollouts
        run: |
          set -euo pipefail
          python experiments/driv3r/fleet_training/ft007_stop_feature_probe.py \
            --request experiments/driv3r/fleet_training/request_ft007.json \
            --upstream upstream \
            --ft003 "$RUNNER_TEMP/ft003-original" \
            --output "$RUNNER_TEMP/ft007-original/run"
      - name: Keep original score matrices, action receipts, SVGs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft007-original-${{ github.run_id }}
          path: ${{ runner.temp }}/ft007-original/
          if-no-files-found: warn
          retention-days: 14
