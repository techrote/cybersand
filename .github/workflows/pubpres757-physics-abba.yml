name: PUBPRES #757 frozen C Wave512 physics early-combined ABBA

on:
  push:
    branches: [evidence/pubpres757-wave512-full-target-20261123]
    paths: ['.github/workflows/pubpres757-physics-abba.yml']

permissions:
  contents: read
  actions: read

jobs:
  windows-physics-abba:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PUBPRES_FROZEN_SOURCE: c90dbc46e1f57f28e06b1f4205b83467335ff657
      PUBPRES_RUNTIME_RUN: '45078090513'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Preserve exact source newlines
        run: git config --global core.autocrlf false
      - name: Checkout detached evidence driver (not application source)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - name: Freeze and hash experiment wrapper
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Wrong evidence-wrapper commit' }
          $Wrapper = Join-Path $env:RUNNER_TEMP 'pubpres757_physics_abba.py'
          Copy-Item -LiteralPath 'tools/evidence/pubpres757_physics_abba.py' -Destination $Wrapper
          (Get-FileHash -LiteralPath $Wrapper -Algorithm SHA256).Hash.ToLowerInvariant() | Out-File -Encoding ascii (Join-Path $env:RUNNER_TEMP 'pubpres757-wrapper-sha256.txt')
      - name: Checkout frozen original C application and committed measurement driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c90dbc46e1f57f28e06b1f4205b83467335ff657
          persist-credentials: false
          lfs: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45078090513
          name: pubpres-completion-runtime-windows-45078090513-1
          path: build/pubpres-frozen-runtime
      - name: Verify source/native/Rapier custody and pinned Godot 4.7
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:PUBPRES_FROZEN_SOURCE) { throw 'Not executing original frozen application source' }
          $Receipt = Get-Content -LiteralPath 'build/pubpres-frozen-runtime/C/PUBPRES-RUNTIME.json' -Raw | ConvertFrom-Json
          if ($Receipt.source_commit -cne $env:PUBPRES_FROZEN_SOURCE -or $Receipt.returncode -ne 0 -or $Receipt.platform -cne 'windows' -or $Receipt.production_runtime_promotion -ne $false) {
            throw 'Original source-exact C runtime provenance failed'
          }
          $Dll = 'build/pubpres-frozen-runtime/C/cybersand_native.windows.x86_64.dll'
          $Sha = (Get-FileHash -LiteralPath $Dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Sha -cne $Receipt.runtime_sha256) { throw 'Downloaded native runtime differs from source-exact receipt' }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'LFS initialization failed' }
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Source-bound Rapier runtime unavailable' }
          python tools/pubpres_playability_build/download_engine.py --platform windows --output (Join-Path $env:RUNNER_TEMP 'pubpres-godot')
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot 4.7 download failed' }
          $Wrapper = Join-Path $env:RUNNER_TEMP 'pubpres757_physics_abba.py'
          python -m py_compile $Wrapper
          if ($LASTEXITCODE -ne 0) { throw 'Detached experiment wrapper is invalid Python' }
          [IO.Directory]::CreateDirectory('build/pubpres757-physics-abba') | Out-Null
          $Experiment = @{ schema = 'pubpres757-physics-only-experiment-v1'; frozen_application_source = $env:PUBPRES_FROZEN_SOURCE; exact_frozen_runtime_sha256 = $Sha; wrapper_evidence_commit = $env:GITHUB_SHA; wrapper_sha256 = (Get-Content (Join-Path $env:RUNNER_TEMP 'pubpres757-wrapper-sha256.txt')).Trim(); treatment_order = @('early','combined','combined','early'); source_selection = 'Original committed run_focus.py with detached wrapper selectively patching treatment sequence and environment only'; material = 'full'; presentation = 'coherent'; camera = 'follow'; mode = 'safe-ANGLE'; expected_real_rapier_steps_per_arm = 144; acceptance = 'HOLD'; purpose = 'isolate physics mailbox coupling after failed Target-upload experiment'; policy = 'no merge, source promotion or production default change' }
          $Experiment | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 'build/pubpres757-physics-abba/IDENTITY.json'
      - name: Preflight corrected expected physics treatment metadata
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $Script = @'
          import hashlib, importlib.util, json
          from pathlib import Path
          root = Path.cwd()
          wrapper = Path(__import__("os").environ["RUNNER_TEMP"]) / "pubpres757_physics_abba.py"
          spec = importlib.util.spec_from_file_location("pubpres757_physics_abba", wrapper)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          campaign = json.loads((root / "tools/pubpres_playability/campaign.json").read_bytes())
          arms = module.planned_arms("renderer-abba")
          assert [a["physics"] for a in arms] == ["early", "combined", "combined", "early"]
          assert [a["physics_mode"] for a in arms] == ["early", "combined", "combined", "early"]
          records = []
          for i, arm in enumerate(arms):
              requested = {"material": "full", **arm}
              effective = {**campaign["arms"]["C"], **{k:v for k,v in requested.items() if k != "causal"}}
              env = module.selectors(requested, "frozen-preflight-"+str(i), "stage")
              assert effective["physics"] == env["CYBERSAND_DIAG_PHYSICS_PUBLICATION"]
              assert effective["physics_mode"] == effective["physics"]
              assert env["CYBERSAND_MATERIAL_PUBLICATION"] == effective["material"] == "full"
              assert env["CYBERSAND_DIAG_PRESENTATION"] == "coherent"
              assert env["CYBERSAND_DIAG_SAME_FRAME_CONTINUATION"] == "0"
              records.append({"index":i,"expected_physics":effective["physics"],"requested_physics":env["CYBERSAND_DIAG_PHYSICS_PUBLICATION"],"material":effective["material"]})
          result={"schema":"pubpres757-physics-selector-preflight-v1","application_commit":"c90dbc46e1f57f28e06b1f4205b83467335ff657","wrapper_sha256":hashlib.sha256(wrapper.read_bytes()).hexdigest(),"bound_arms":records}
          (root/"build/pubpres757-physics-abba/WRAPPER-PREFLIGHT.json").write_text(json.dumps(result,indent=2)+"\\n")
          print(json.dumps(result,indent=2))
          '@
          $Script | Set-Content -LiteralPath 'build/pubpres757-physics-abba/preflight.py' -Encoding ascii
          python 'build/pubpres757-physics-abba/preflight.py'
          if ($LASTEXITCODE -ne 0) { throw 'Corrected wrapper preflight failed before costly renderer comparison' }
      - name: Real source-exact Windows Wave512 Full-only early combined combined early
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = 'Stop'
          $Engine = Join-Path $env:RUNNER_TEMP 'pubpres-godot/Godot_v4.7-stable_win64.exe'
          $Wrapper = Join-Path $env:RUNNER_TEMP 'pubpres757_physics_abba.py'
          python $Wrapper --source $PWD.Path --runtime 'build/pubpres-frozen-runtime/C' --engine $Engine --case wave_512_follow --mode renderer-abba --material full --retirement-source stage --output 'build/pubpres757-physics-abba/wave512'
          if ($LASTEXITCODE -ne 0) { throw 'Original-source physics-selector ABBA failed; retain negative raw captures' }
      - name: Archive original unmodified receipts and traces regardless of result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres757-exact-c-wave512-physics-early-combined-abba-${{ github.run_id }}
          path: |
            build/pubpres757-physics-abba/
            !build/pubpres757-physics-abba/**/template/**
          if-no-files-found: warn
          retention-days: 90
