name: GENTEK-MEGABLOCK draft qualification and native gallery

on:
  push:
    branches: [experiment/gentek-showcase-megablock-001]
    paths:
      - 'native/**'
      - 'godot/**'
      - 'examples/worldgen/architectural/**'
      - 'tools/worldgen/gentek_megablock_campaign.py'
      - 'tools/build*.sh'
      - 'tools/requirements-build.txt'
      - 'Makefile'
      - '.github/workflows/gentek-megablock-draft-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gentek-megablock-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  linux-gallery:
    if: github.ref_name == 'experiment/gentek-showcase-megablock-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
      GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
      GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
    steps:
      - name: Check out exact showcase source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Complete native generation and focused Megablock tests
        run: |
          set -euo pipefail
          mkdir -p build/gentek-megablock-qualification
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          timeout 3600 make -j2 worldgen-test CXX=g++-13 2>&1 | tee build/gentek-megablock-qualification/native-tests.log
          timeout 1800 make -j2 megablock-sanitize CXX=g++-13 2>&1 | tee build/gentek-megablock-qualification/sanitizer.log
      - name: Run fixed-seed native raster and performance campaign
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/megablock-images"
          "$RUNNER_TEMP/megablock-images/bin/python" -m pip install numpy==2.3.5 pillow==12.0.0
          timeout 1800 "$RUNNER_TEMP/megablock-images/bin/python" tools/worldgen/gentek_megablock_campaign.py --compiler g++-13 --output build/gentek-megablock-gallery 2>&1 | tee build/gentek-megablock-qualification/campaign.log
      - name: Fetch pinned Godot dependencies
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          echo '566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' | sha256sum -c --strict
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
      - name: Build source-matched Linux extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/libcybersand_native.linux.x86_64.so
        run: |
          set -euo pipefail
          timeout 3600 bash tools/build_pinned_godot_cpp.sh linux 2>&1 | tee build/gentek-megablock-qualification/godot-cpp-build.log
          timeout 3600 bash tools/build_native_extension.sh 2>&1 | tee build/gentek-megablock-qualification/extension-build.log
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          sha256sum "$CYBERSAND_NATIVE_OUTPUT" > build/gentek-megablock-qualification/extension-sha256.txt
      - name: Qualify actual Architectural Generator integration
        run: |
          set -euo pipefail
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          mkdir -p build/gentek-megablock-godot
          CYBERSAND_ARCHITECTURE_PHASE=native CYBERSAND_ARCHITECTURE_OUTPUT="$GITHUB_WORKSPACE/build/gentek-megablock-godot" timeout 3600 "$GODOT_BIN" --headless --path godot --script res://tests/test_architectural_generator.gd 2>&1 | tee build/gentek-megablock-qualification/godot-generator.log
          timeout 1200 "$GODOT_BIN" --headless --path godot --script res://tests/test_architectural_project_contract.gd 2>&1 | tee build/gentek-megablock-qualification/godot-contract.log
          timeout 1200 "$GODOT_BIN" --headless --path godot --script res://tests/test_megablock_project.gd 2>&1 | tee build/gentek-megablock-qualification/godot-megablock-project.log
      - name: Retain exact-source gallery and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek-megablock-linux-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/gentek-megablock-gallery/
            build/gentek-megablock-qualification/
            build/gentek-megablock-godot/
          if-no-files-found: error
          retention-days: 90

  windows-native:
    if: github.ref_name == 'experiment/gentek-showcase-megablock-001'
    needs: linux-gallery
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out exact showcase source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Linux material reference
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gentek-megablock-linux-${{ github.sha }}-${{ github.run_id }}
          path: build/linux-reference
      - name: Build and execute Windows native tests and capture adapter
        shell: cmd
        run: |
          @echo on
          for /f "tokens=*" %%I in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VS_ROOT=%%I"
          if not defined VS_ROOT exit /b 1
          call "%VS_ROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist build\gentek-megablock-windows mkdir build\gentek-megablock-windows
          if not exist build\megablock-objects mkdir build\megablock-objects
          cl /nologo /std:c++20 /EHsc /W4 /I native\include /O2 /DNDEBUG /c native\src\world_generation.cpp native\src\generation_fields.cpp native\src\generation_typed_fields.cpp native\src\generation_spatial.cpp native\src\generation_grammar.cpp native\src\generation_planes.cpp /Fo:build\megablock-objects\
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /I native\include /O2 /DNDEBUG build\megablock-objects\*.obj native\tests\test_world_generation.cpp /Fe:build\gentek-megablock-windows\test_world_generation.exe
          if errorlevel 1 exit /b 1
          build\gentek-megablock-windows\test_world_generation.exe > build\gentek-megablock-windows\classic-tests.log 2>&1
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /I native\include /O2 /DNDEBUG build\megablock-objects\*.obj native\tests\test_seeded_typology_megablock.cpp /Fe:build\gentek-megablock-windows\test_seeded_typology_megablock.exe
          if errorlevel 1 exit /b 1
          build\gentek-megablock-windows\test_seeded_typology_megablock.exe > build\gentek-megablock-windows\megablock-tests.log 2>&1
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /I native\include /O2 /DNDEBUG build\megablock-objects\*.obj native\tools\gentek_megablock_capture.cpp /Fe:build\gentek-megablock-windows\capture.exe
          if errorlevel 1 exit /b 1
      - name: Compare all 32 Windows material maps with Linux
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reference = Get-Content build/linux-reference/gentek-megablock-gallery/seed-survey.json -Raw | ConvertFrom-Json
          $results = @()
          foreach ($item in $reference) {
            $seed = [int]$item.seed
            $stem = 'seed-{0:d2}' -f $seed
            $raw = "build/gentek-megablock-windows/$stem.u16"
            & build/gentek-megablock-windows/capture.exe --seed $seed --output $raw | Set-Content "build/gentek-megablock-windows/$stem.json"
            if ($LASTEXITCODE -ne 0) { throw "Native capture failed for seed $seed" }
            $hash = (Get-FileHash $raw -Algorithm SHA256).Hash.ToLowerInvariant()
            $matches = $hash -eq $item.material_sha256
            $results += @{ seed = $seed; material_sha256 = $hash; linux_sha256 = $item.material_sha256; matches = $matches }
            if (!$matches) { throw "Cross-platform material mismatch for seed $seed" }
          }
          @{ source_sha = '${{ github.sha }}'; compiler = 'hosted MSVC C++20 /O2'; maps = $results; all_match = $true } | ConvertTo-Json -Depth 8 | Set-Content build/gentek-megablock-windows/parity.json
          Get-Content build/gentek-megablock-windows/classic-tests.log
          Get-Content build/gentek-megablock-windows/megablock-tests.log
      - name: Retain Windows native tests and material parity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek-megablock-windows-${{ github.sha }}-${{ github.run_id }}
          path: build/gentek-megablock-windows/
          if-no-files-found: error
          retention-days: 90
