name: SPROCKET WORM-001 S3 W5 discriminative live score evaluation
on:
  push:
    branches:
      - codex/agent-painter-sprocket-568
    paths:
      - experiments/agent_painter/lanes/sprocket/worm-eval-request-v5-s3.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sprocket-worm-score-v5-s3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  eval-worm:
    name: Real Sprocket checkpoint score sampling, 2 temperatures and matched W0 controls
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check immutable W5 S3 score-sampling lease and repository policy
        id: lease
        run: |
          set -euo pipefail
          mkdir -p evidence/worm-score-v5-s3
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          r=json.loads(Path('experiments/agent_painter/lanes/sprocket/worm-eval-request-v5-s3.json').read_text())
          expected="{\"schema\":\"cybersand.worm.sprocket-eval-request/s3\",\"experiment\":\"sprocket-worm-s3-v5-trained-six-way-live-common-rng\",\"training_source\":\"984ef5fd172c2db50ca1f3b69678091834fb75d3\",\"training_run_id\":43732897139,\"training_artifact\":\"sprocket-worm-v5-984ef5fd172c2db50ca1f3b69678091834fb75d3\",\"model\":\"kandivault/sprocket-500m\",\"model_revision\":\"eb157d4ddddc4619e661d4a2426bb2dd000fc668\",\"w0_git_commit\":\"4bb9d6e1d0d0d78183f87d1e3c29648edafacf61\",\"checkpoint\":\"checkpoint-000048\",\"steps\":24,\"temperatures\":[1,3],\"sampler\":\"v5-live-six-way-ce-logits-with-S2-world-tick-crn\",\"keep_draft\":true,\"native\":false,\"sealed_final_forbidden\":true}"
          if r!=json.loads(expected): raise SystemExit('versioned WORM S3 evaluation lease mismatch')
          if os.environ['GITHUB_REF']!='refs/heads/codex/agent-painter-sprocket-568': raise SystemExit('unexpected branch')
          Path('evidence/worm-score-v5-s3/source-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          Path('evidence/worm-score-v5-s3/request.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(r['training_run_id'])+'\n')
              f.write('artifact='+r['training_artifact']+'\n')
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/worm_score_v5_eval.py
          python3 experiments/agent_painter/lanes/sprocket/test_worm_score_v5_eval.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.lease.outputs.artifact }}
          path: evidence/previous-v5
          run-id: ${{ steps.lease.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify actual completed 48-step W5 discriminative checkpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/previous-v5/campaign')
          s=json.loads((p/'summary.json').read_text())
          c=json.loads((p/'preflight.json').read_text())['config']
          assert s['actual_training'] is True and s['status']=='complete'
          assert s['steps']==s['target_steps']==48 and s['checkpoint']=='checkpoint-000048'
          assert s['frozen_base_equal'] and s['adapter_changed']
          assert not s['native_execution'] and not s['sealed_final_opened']
          assert c['schema']=='cybersand.worm.sprocket-six-way-scores-v5'
          assert c['source_sha']=='984ef5fd172c2db50ca1f3b69678091834fb75d3'
          assert c['model']['model_id']=='kandivault/sprocket-500m'
          assert c['model']['revision']=='eb157d4ddddc4619e661d4a2426bb2dd000fc668'
          assert c['worm_common_git_commit']=='4bb9d6e1d0d0d78183f87d1e3c29648edafacf61'
          assert c['worm_support_git_commit']=='2b6534ac21542805f4bda123f67e9624d21e39d7'
          assert s['trained_six_way_scores']['count']==18
          assert json.loads((Path('evidence/previous-v5')/'source-dataset-preflight/manifest.json').read_text())['literal_prompt_intersection']==0
          assert (p/'checkpoint-000048/inventory.json').is_file()
          print('Original 48 real steps and immutable checkpoint receipts accepted for visual evaluation only')
          PY
      - name: Retrieve original immutable W0 engine-owned walker
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git rev-parse FETCH_HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/pinned-worm.py"
          test "$(git hash-object "$RUNNER_TEMP/pinned-worm.py")" = 8979b6f0296e81051194bacc907992d38e006605
          sha256sum "$RUNNER_TEMP/pinned-worm.py" > evidence/worm-score-v5-s3/pinned-w0.sha256
          python3 -m py_compile "$RUNNER_TEMP/pinned-worm.py"
      - name: Install reviewed portable CPU FP32 and pinned Sprocket root model
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/painter-training"
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/painter-training/bin/python" -m pip check
          "$RUNNER_TEMP/painter-training/bin/python" -m pip freeze --all > evidence/worm-score-v5-s3/pip-freeze.txt
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/training/download_model.py --profile sprocket --output "$RUNNER_TEMP/painter-model"
          cp "$RUNNER_TEMP/painter-model/download_receipt.json" evidence/worm-score-v5-s3/model-download.json
      - name: Run real model-conditioned W5 six-way CE scores, two temperatures, matched W0 controls
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 2400s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/lanes/sprocket/worm_score_v5_eval.py \
            --model "$RUNNER_TEMP/painter-model" --w0 "$RUNNER_TEMP/pinned-worm.py" \
            --checkpoint evidence/previous-v5/campaign/checkpoint-000048 \
            --training-source 984ef5fd172c2db50ca1f3b69678091834fb75d3 \
            --steps 24 --output evidence/worm-score-v5-s3/results
      - name: Preserve checksums and partial/failure evidence
        if: always()
        run: |
          set -euo pipefail
          df -h > evidence/worm-score-v5-s3/disk-after.txt
          (cd evidence/worm-score-v5-s3 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > evidence/worm-score-v5-s3/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-worm-score-v5-s3-${{ github.sha }}
          path: evidence/worm-score-v5-s3/
          if-no-files-found: warn
          retention-days: 90
