name: CyberSand PF gas real Godot C2048 ABBA screen

on:
  push:
    branches: [perf/pf-gas-acceptance-20261107]
    paths:
      - '.github/workflows/pf-gas-godot-app-matched-windows.yml'
      - 'tools/ci/pf_gas_acceptance.py'
      - 'tools/ci/pf_gas_godot_stage.py'
      - 'tools/ci/pf_gas_godot_run.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pf-gas-app-${{ github.run_id }}
  cancel-in-progress: false

env:
  BASELINE_MAIN: 24a8bbe8ccf0d17196ebbab580b924930a964584
  CANDIDATE_BUILD: b7f151f85676ffc6b2ea87f3e5c6165b890727e0
  GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
  GODOT_WINDOWS_SHA512: 41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9
  GODOT_VERSION: 4.7.stable.official.5b4e0cb0f
  GIT_LFS_SKIP_SMUDGE: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'
  PYTHONUTF8: '1'

jobs:
  c2048-real-godot:
    name: Same-Windows-host C2048 59-material eight-actor 20x2x2 ABBA
    runs-on: windows-2022
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    steps:
      - name: Ensure byte-preserving LF checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out independent acceptance harness with full source ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download previously source-built exact #504 GDExtension candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: techrote/cybersand
          run-id: 42333533378
          name: native-candidate-windows-42333533378-1
          github-token: ${{ github.token }}
          path: build/pf-gas/source-candidate
      - name: Verify #493-derived screen, source lineage, physical runtime and C2048 app
        timeout-minutes: 25
        run: |
          set -euo pipefail
          git diff --check
          python tools/ci/check_ci_provider_policy.py
          python tools/ci/pf_gas_acceptance.py check > build/pf-gas-plan.json
          python -m unittest discover -s tools/ci -p test_pf_gas_acceptance.py -v
          git worktree add --detach "$RUNNER_TEMP/pf-gas-app" "$BASELINE_MAIN"
          git -C "$RUNNER_TEMP/pf-gas-app" fetch --no-tags origin "$CANDIDATE_BUILD"
          git -C "$RUNNER_TEMP/pf-gas-app" lfs install --local
          git -C "$RUNNER_TEMP/pf-gas-app" lfs pull \
            --include="godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          mkdir -p "$RUNNER_TEMP/pf-gas-app/godot/tests/performance"
          cp godot/tests/performance/water_factorial_stress.gd \
            "$RUNNER_TEMP/pf-gas-app/godot/tests/performance/"
          python tools/ci/pf_gas_godot_stage.py \
            --app "$RUNNER_TEMP/pf-gas-app" \
            --candidate build/pf-gas/source-candidate --out build/pf-gas/identities
      - name: Execute real Windows Godot 4.7 C2048 A/B/B/A with actor and splash receipts
        timeout-minutes: 160
        run: |
          set -euo pipefail
          python tools/ci/pf_gas_godot_run.py \
            --app "$RUNNER_TEMP/pf-gas-app" --candidate build/pf-gas/source-candidate \
            --out build/pf-gas \
            --godot-url "$GODOT_WINDOWS_URL" --godot-sha512 "$GODOT_WINDOWS_SHA512" \
            --godot-version "$GODOT_VERSION"
      - name: Always preserve source-verified receipts, matched times and every failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pf-gas-c2048-real-godot-abba-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/pf-gas-plan.json
            build/pf-gas/identities/*.json
            build/pf-gas/toolchain/import.log
            build/pf-gas/ABBA/
          if-no-files-found: warn
          retention-days: 90
