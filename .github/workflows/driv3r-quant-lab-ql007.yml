name: QL-007 mixed Q4 precision islands in genuine Q1 bitserial worm (research)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql007_mixed_bridges.py'
      - '.github/workflows/driv3r-quant-lab-ql007.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql007-mixed-bridges
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Retrieve immutable source-trained QL-003 parent archive
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Validate bitpacked host policy and bridge parity
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql007_mixed_bridges.py --self-test
      - name: Execute 96 real optimizer steps and original matched-seed PNG experiments
        run: |
          python experiments/driv3r/quant_lab/ql007_mixed_bridges.py \
            --parent ql003-source --out ql007-out --steps 48
      - name: Verify exact HEAD, original traces, legal actions and SHA-256 inventory
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('ql007-out')
          data=json.loads((out/'results.json').read_text())
          sha=os.environ['QL_SOURCE_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          assert data['source_sha']==sha
          assert data['parent_sha']=='9b4103c48127e5c8538403e2a4d9e2525fbe8755'
          assert data['verified_parent_manifest_entries']>=330
          assert data['new_optimizer_updates']==96 and data['heldout_n']==4352
          assert len(data['variants'])==8 and len(data['controls'])==3
          assert data['first_pass_png_n']==156
          rows=json.loads((out/'raw_decisions.json').read_text())
          assert len(rows)==156
          assert all(row['first_pass'] and all(s['chosen'] in s['legal']
                      for s in row['steps']) for row in rows)
          for item in data['repairs'].values():
              assert item['updates']==48 and item['nonzero_moment_tensors']>=2
              assert item['fixed_q1_codes'] and item['fixed_q4_codes']
              assert item['parity_max_abs']<5e-5
          m=json.loads((out/'MANIFEST.json').read_text())
          assert len(set(x['path'] for x in m))==len(m)
          for x in m:
              b=(out/x['path']).read_bytes()
              assert x['bytes']==len(b)
              assert hashlib.sha256(b).hexdigest()==x['sha256'],x['path']
          print('QL007 EXACT HEAD PASS',sha,'manifest',len(m),'PNGs',data['first_pass_png_n'])
          PY
      - name: Retain original optimizer/checkpoints and raw first-pass galleries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql007-mixed-islands
          path: ql007-out/
          if-no-files-found: warn
          retention-days: 21
