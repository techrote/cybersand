name: MZ-015 direction-balanced 2-D turning-map training (HOLD)
on:
  push:
    branches: ['research/model-zoo-turning-maps-mz015']
    paths:
      - 'experiments/driv3r/model_zoo/turning_maps_mz015/**'
      - '.github/workflows/driv3r-model-zoo-turning-mz015.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mz015-turning-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu-train:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce strict game-code and sibling-lane write fence
        run: |
          git diff --name-only 650bad65c76c569bb5fb33c784e72a9c16d654d6 HEAD > "$RUNNER_TEMP/mz015-changes.txt"
          cat "$RUNNER_TEMP/mz015-changes.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ["RUNNER_TEMP"],"mz015-changes.txt").read_text().splitlines()
          assert p and all(s.startswith("experiments/driv3r/model_zoo/turning_maps_mz015/")
                           or s==".github/workflows/driv3r-model-zoo-turning-mz015.yml"
                           for s in p),p
          print("MZ-015 exclusive research scope PASS")
          PY
      - name: Install pinned PyTorch CPU
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip freeze > "$RUNNER_TEMP/mz015-packages.txt"
      - name: Qualify deterministic geometry, material history, legal host and recovery
        run: python -m unittest -v experiments.driv3r.model_zoo.turning_maps_mz015.test_turning
      - name: Train three policy families on identical direction-balanced exposure
        run: |
          python -m experiments.driv3r.model_zoo.turning_maps_mz015.run \
            --train-seeds 128 --test-seeds 16 --rollout-seeds 8 \
            --updates 600 --batch 16 --out "$RUNNER_TEMP/mz015"
      - name: Independent checkpoint reload and evidence integrity
        run: |
          python - <<'PY'
          import hashlib,json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          import torch
          from experiments.driv3r.model_zoo.spatial_paint_mz013.run import models
          out=Path(os.environ["RUNNER_TEMP"])/"mz015"
          m=json.loads((out/"metrics.json").read_text())
          assert m["source_sha"]==os.environ["GITHUB_SHA"]
          assert m["updates_per_model"]==600
          assert m["train_seed_families"]==128
          assert m["checkpoint_sha256"]==hashlib.sha256((out/"models.pt").read_bytes()).hexdigest()
          ckpt=torch.load(out/"models.pt",map_location="cpu",weights_only=True)
          assert ckpt["source_sha"]==os.environ["GITHUB_SHA"]
          nets=models(torch)
          del nets["transformer20m"]
          for name,net in nets.items():
              net.load_state_dict(ckpt["models"][name],strict=True)
              assert m["parameters"][name]==sum(p.numel() for p in net.parameters())
          assert ET.parse(out/"trajectories.svg").getroot().tag.endswith("svg")
          for k,v in m["closed_loop"].items():
              assert v["episodes"]==32
              assert 0<=v["clean"]<=32
              assert sum(row["n"] for row in v["by_rotation"].values())==32
          assert all(v["matches"]==v["episodes"] for v in m["cached_full_parity"].values())
          print("Exact-head source, reloaded model weights, cached parity and evidence PASS")
          PY
      - name: Upload immutable source-qualified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mz015-turning-maps-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mz015/**
            ${{ runner.temp }}/mz015-packages.txt
            ${{ runner.temp }}/mz015-changes.txt
          if-no-files-found: warn
          retention-days: 14
