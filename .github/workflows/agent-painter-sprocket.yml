name: Agent painter SPROCKET independently bounded pilot
on:
  push:
    branches: [codex/agent-painter-sprocket-568]
    paths:
      - experiments/agent_painter/lanes/sprocket/pilot-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-painter-sprocket-pilot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  request:
    name: Validate frozen Sprocket pilot request
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      steps: ${{ steps.contract.outputs.steps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact pinned source, root model, admitted corpus, limits and branch
        id: contract
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("experiments/agent_painter/lanes/sprocket/pilot-request.json")
          request = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema": "cybersand.agent-painter.sprocket-pilot-request/1",
              "experiment": "sprocket-pilot-001",
              "model": "kandivault/sprocket-500m",
              "model_revision": "eb157d4ddddc4619e661d4a2426bb2dd000fc668",
              "qualified_parent": "2a565df45efc568eb96a2166e0b77f299e289625",
              "native_source": "633920373a3d406a2ede61ce4137c324f76be23b",
              "corpus_run_id": "43506373969",
              "corpus_artifact": "agent-painter-native-633920373a3d406a2ede61ce4137c324f76be23b",
              "corpus_manifest_sha256": "2fdef5a3639606fb9af68319f9747a1de1e9a573da5c6197a2dcbc96579cb6cc",
              "steps": 16,
              "inference_proof": True,
              "train_split": "TRAIN",
              "final_targets_forbidden": True,
              "runner_processes": 1,
              "keep_draft": True,
          }
          if request != expected:
              raise SystemExit("Sprocket pilot request differs from approved, fixed contract")
          if os.environ["SOURCE_REF"] != "refs/heads/codex/agent-painter-sprocket-568":
              raise SystemExit("ref is not the independent Sprocket lane")
          if not re.fullmatch("[a-f0-9]{40}", os.environ["SOURCE_SHA"]):
              raise SystemExit("training source must be full immutable SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("steps=16\n")
          print("Sprocket source", os.environ["SOURCE_SHA"], "approved; actual training pending")
          PY

  train:
    name: One separate CPU VM, 16 real optimizer updates and raw first pass
    needs: request
    uses: ./.github/workflows/agent-painter-train.yml
    with:
      source-sha: ${{ github.sha }}
      profile: sprocket
      corpus-artifact: agent-painter-native-633920373a3d406a2ede61ce4137c324f76be23b
      corpus-run-id: '43506373969'
      output-artifact: agent-painter-sprocket-pilot-${{ github.sha }}
      steps: ${{ fromJSON(needs.request.outputs.steps) }}
      inference-proof: true
