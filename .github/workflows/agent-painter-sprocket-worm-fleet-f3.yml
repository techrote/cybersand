name: SPROCKET WORM-001 F3 four long128 concurrent W6 model-forward PNG worms
on:
  push:
    branches: [codex/agent-painter-sprocket-568]
    paths:
      - experiments/agent_painter/lanes/sprocket/worm-fleet-request-f3.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sprocket-worm-fleet-f3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  fleet:
    name: Two genuine root-Instruct W6 processes on independent VM ${{ matrix.slot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        slot: [0, 1]
    env:
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify F3 immutable four-leased inference request and source syntax
        run: |
          set -euo pipefail
          mkdir -p evidence/worm-fleet-f3
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path("experiments/agent_painter/lanes/sprocket/worm-fleet-request-f3.json")
          x=json.loads(p.read_text())
          assert x=={
            "schema":"cybersand.worm.sprocket-fleet-request/f3",
            "experiment":"four-separate-trained-model-inference-128-turn-real-png-worms",
            "model":"kandivault/sprocket-500m",
            "model_revision":"eb157d4ddddc4619e661d4a2426bb2dd000fc668",
            "w6_producer_run":43743251862,
            "w6_producer_failed":True,
            "checkpoint":"checkpoint-000024",
            "w0_source":"4bb9d6e1d0d0d78183f87d1e3c29648edafacf61",
            "f1_source":"9b4627d8f3602627291d5939f4787b5976b6c195",
            "f1_run":43765853789,
            "f2_source":"b44038a2e26850bf5f97457243f1b2f9c018d2ca",
            "f2_run":43766586563,
            "preflight_revision":3,
            "four_seeds":[8111,8123,8147,8161],
            "four_families":["greebles","pipework","architecture","greebles"],
            "per_worm_decisions":128,
            "future_bound_after_safety":128,
            "separate_runners":2,
            "models_per_runner":2,
            "zero_optimizer":True,"synthetic_not_native":True,
            "sealed_final_opened":False,"draft_hold":True}
          assert os.environ["GITHUB_REF"]=="refs/heads/codex/agent-painter-sprocket-568"
          Path("evidence/worm-fleet-f3/source-sha.txt").write_text(
            subprocess.check_output(["git","rev-parse","HEAD"],text=True))
          Path("evidence/worm-fleet-f3/request.json").write_text(
            json.dumps(x,indent=2,sort_keys=True)+"\n")
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/worm_fleet_capacity_v1.py experiments/agent_painter/lanes/sprocket/worm_fleet_four_v2.py experiments/agent_painter/lanes/sprocket/worm_fleet_long_v3.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sprocket-worm-fleet-f1-9b4627d8f3602627291d5939f4787b5976b6c195
          path: evidence/previous-f1
          run-id: '43765853789'
          github-token: ${{ github.token }}
      - name: Hard-stop without original F1 successful serial-vs-dual model residency
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/agent_painter/lanes/sprocket python3 - <<'PY'
          from worm_fleet_long_v3 import read_f1
          x=read_f1("evidence/previous-f1")
          print("Original F1 admission PASS: two independent resident root-Instruct inference PIDs, real model steps and original PNGs")
          print("F1 source",x["source_sha"],"measured throughput gain",x["throughput_gain"])
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sprocket-worm-fleet-f2-audit-b44038a2e26850bf5f97457243f1b2f9c018d2ca
          path: evidence/previous-f2
          run-id: '43766586563'
          github-token: ${{ github.token }}
      - name: Require independently original F2 four-overlapping-model completion and PNGs
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/agent_painter/lanes/sprocket python3 - <<'PY'
          from worm_fleet_long_v3 import read_f2
          original=read_f2("evidence/previous-f2")
          print("Original F2 four-model overlap admitted (seconds)",original["actual_four_MODEL_INFERENCE_interval_overlap_seconds"])
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sprocket-worm-v6-fbeece84ff2609e564bb43b7f40ecde1d80ef187
          path: evidence/previous-v6
          run-id: '43743251862'
          github-token: ${{ github.token }}
      - name: Fetch original pinned W0; never open FINAL/native materials
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git rev-parse FETCH_HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/pinned-worm.py"
          test "$(git hash-object "$RUNNER_TEMP/pinned-worm.py")" = 8979b6f0296e81051194bacc907992d38e006605
          sha256sum "$RUNNER_TEMP/pinned-worm.py" > evidence/worm-fleet-f3/pinned-w0.sha256
      - name: Install original pinned root-Instruct official processor / LoRA on CPU
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/painter-training"
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/painter-training/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/painter-training/bin/python" -m pip check
          "$RUNNER_TEMP/painter-training/bin/python" -m pip freeze --all > evidence/worm-fleet-f3/pip-freeze.txt
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/training/download_model.py --profile sprocket --output "$RUNNER_TEMP/painter-model"
          cp "$RUNNER_TEMP/painter-model/download_receipt.json" evidence/worm-fleet-f3/model-download.json
      - name: Actually execute two simultaneous original W6 model forwards and W0 PNG worms
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 4400s "$RUNNER_TEMP/painter-training/bin/python" experiments/agent_painter/lanes/sprocket/worm_fleet_long_v3.py \
            --mode fleet --slot ${{ matrix.slot }} --steps 128 \
            --model "$RUNNER_TEMP/painter-model" --w0 "$RUNNER_TEMP/pinned-worm.py" \
            --checkpoint evidence/previous-v6/campaign/checkpoint-000024 \
            --f1 evidence/previous-f1 --f2 evidence/previous-f2 --output evidence/worm-fleet-f3/results \
            --lease "${GITHUB_RUN_ID}-${GITHUB_SHA}" --deadline 3400
      - name: Preserve model decisions, original images, PID/RSS/error/Stop ledger
        if: always()
        run: |
          set -euo pipefail
          df -h > evidence/worm-fleet-f3/disk-after.txt
          (cd evidence/worm-fleet-f3 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > evidence/worm-fleet-f3/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-worm-fleet-f3-${{ matrix.slot }}-${{ github.sha }}
          path: evidence/worm-fleet-f3/
          if-no-files-found: warn
          retention-days: 90

  audit-four:
    name: Independently qualify four 128-bound overlapping model processes and original PNGs
    needs: fleet
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sprocket-worm-fleet-f3-0-${{ github.sha }}
          path: evidence/four/fleet-0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sprocket-worm-fleet-f3-1-${{ github.sha }}
          path: evidence/four/fleet-1
      - name: Verify four distinct job/PID/lease/seed same-checkpoint overlapping MODEL FORWARD windows
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/agent_painter/lanes/sprocket python3 experiments/agent_painter/lanes/sprocket/worm_fleet_long_v3.py \
            --mode audit --artifacts evidence/four --output evidence/four/four-way-audit.json \
            --expected-sha "${GITHUB_SHA}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-worm-fleet-f3-audit-${{ github.sha }}
          path: evidence/four/
          if-no-files-found: warn
          retention-days: 90
