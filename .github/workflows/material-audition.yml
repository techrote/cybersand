name: MAT-AUDITION-LIVE-001 source-matched evaluation
on:
  push:
    branches: [mat/audition-live-001]
    paths:
      - '.github/material-audition-run.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: material-audition-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Candidate-only execution. An explicit source-bound request may publish only
# the four qualified runtime/provenance paths to this branch after all target-OS
# and delivered-archive gates. No Ready promotion, merge or default retuning.
env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
  CYBERSAND_CI_WATCHDOG_SCALE: '1'

jobs:
  linux:
    name: Native parity, sanitizers and Linux current-scene audition
    if: github.ref == 'refs/heads/mat/audition-live-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact_attempt: ${{ steps.identity.outputs.attempt }}
    env:
      CYBERSAND_LAB_CXX: /usr/bin/g++-13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record source artifact attempt
        id: identity
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Validate evidence guards and native profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tools/ci/check_ci_provider_policy.py > evidence/provider-policy.json
          python3 tools/ci/test_material_audition_evidence.py > evidence/evidence-guards.log 2>&1
          python3 tools/ci/test_material_audition_publication.py > evidence/publication-guards.log 2>&1
          make -j2 CXX=g++-13 material-audition-test > evidence/native-profile.log 2>&1
          make -j2 CXX=g++-13 material-audition-sanitize > evidence/native-profile-sanitized.log 2>&1
      - name: Compare identical native probe against accepted main
        shell: bash
        run: |
          set -euo pipefail
          accepted=00cdb02f103265b6dc5224c68283e9a0c8cb449f
          mkdir -p "$RUNNER_TEMP/material-accepted" evidence/performance
          git archive "$accepted" native/include native/src | tar -xf - -C "$RUNNER_TEMP/material-accepted"
          sources=(world.cpp material_rules.cpp scheduler_geometry.cpp settled_world_discovery.cpp)
          baseline_sources=()
          candidate_sources=()
          for source in "${sources[@]}"; do
            baseline_sources+=("$RUNNER_TEMP/material-accepted/native/src/$source")
            candidate_sources+=("native/src/$source")
          done
          g++-13 -std=c++20 -O2 -pthread -I "$RUNNER_TEMP/material-accepted/native/include" "${baseline_sources[@]}" native/tests/bench_material_audition.cpp -o "$RUNNER_TEMP/material-default-bench" > evidence/performance/baseline-build.log 2>&1
          g++-13 -std=c++20 -O2 -pthread -I native/include "${candidate_sources[@]}" native/tests/bench_material_audition.cpp -o "$RUNNER_TEMP/material-audition-bench" > evidence/performance/candidate-build.log 2>&1
          timeout 20m "$RUNNER_TEMP/material-default-bench" 96 3 > evidence/performance/accepted.jsonl
          timeout 20m "$RUNNER_TEMP/material-audition-bench" 96 3 > evidence/performance/candidate.jsonl
          python3 tools/ci/reduce_material_audition_performance.py --baseline evidence/performance/accepted.jsonl --candidate evidence/performance/candidate.jsonl --output evidence/performance/summary.json
          printf '%s\n' "$accepted" > evidence/performance/accepted-source.txt
          git rev-parse HEAD > evidence/performance/candidate-source.txt
          sha256sum native/tests/bench_material_audition.cpp "$RUNNER_TEMP/material-default-bench" "$RUNNER_TEMP/material-audition-bench" > evidence/performance/probe-binaries.sha256
      - name: Prepare pinned Linux inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libvulkan1
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          curl -fL --retry 3 --max-time 600 -o "$RUNNER_TEMP/godot-linux.zip" https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot-linux.zip" | sha256sum -c --strict
          mkdir "$RUNNER_TEMP/godot47"
          unzip -q "$RUNNER_TEMP/godot-linux.zip" -d "$RUNNER_TEMP/godot47"
          chmod +x "$RUNNER_TEMP/godot47/Godot_v4.7-stable_linux.x86_64"
      - name: Build the source-matched Linux runtime
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/libcybersand_native.linux.x86_64.so
        shell: bash
        run: |
          set -euo pipefail
          timeout 45m tools/build_pinned_godot_cpp.sh linux > evidence/godot-cpp-linux.log 2>&1
          timeout 30m tools/build_native_extension.sh > evidence/extension-linux.log 2>&1
          g++-13 --version > evidence/linux-toolchain.txt
          ld --version >> evidence/linux-toolchain.txt
          sha256sum "$GODOT_CPP_ROOT/bin/libgodot-cpp.linux.template_debug.x86_64.a" >> evidence/linux-toolchain.txt
          python3 tools/ci/run_material_audition_qualification.py record --platform linux --runtime "$CYBERSAND_NATIVE_OUTPUT" --candidate build/audition-linux --toolchain evidence/linux-toolchain.txt
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          tools/check_linux_runtime_floor.sh > evidence/linux-runtime-floor.log 2>&1
      - name: Execute Linux native and graphical current-scene evidence
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/run_material_audition_qualification.py run --candidate build/audition-linux --godot "$RUNNER_TEMP/godot47/Godot_v4.7-stable_linux.x86_64" --evidence evidence/headless
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 tools/ci/run_material_audition_qualification.py run --candidate build/audition-linux --godot "$RUNNER_TEMP/godot47/Godot_v4.7-stable_linux.x86_64" --evidence evidence/graphical --graphical --audition-only
      - name: Retain original Linux evidence and candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-audition-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            build/audition-linux/
          if-no-files-found: error
          retention-days: 90

  windows-build:
    name: Pinned Windows native cross-build
    if: github.ref == 'refs/heads/mat/audition-live-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      artifact_attempt: ${{ steps.identity.outputs.attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned Windows build inputs
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          mkdir -p evidence
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          mkdir "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          curl -fL --retry 3 --max-time 600 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c --strict
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          test -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar" || ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"
      - name: Build and attest the Windows candidate
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
          CYBERSAND_AUDITION_WINDOWS_PROBE: ${{ runner.temp }}/test_material_audition.exe
        shell: bash
        run: |
          set -euo pipefail
          timeout 45m tools/build_pinned_godot_cpp.sh windows > evidence/godot-cpp-windows.log 2>&1
          timeout 30m tools/build_native_extension_windows.sh > evidence/extension-windows.log 2>&1
          timeout 15m tools/ci/build_material_audition_windows_probe.sh > evidence/native-probe-windows-build.log 2>&1
          "$WINDOWS_CXX" --version > evidence/windows-toolchain.txt
          "$LLVM_MINGW_ROOT/bin/ld.lld" --version >> evidence/windows-toolchain.txt
          sha256sum "$GODOT_CPP_ROOT/bin/libgodot-cpp.windows.template_debug.x86_64.a" >> evidence/windows-toolchain.txt
          python3 tools/ci/run_material_audition_qualification.py record --platform windows --runtime "$CYBERSAND_NATIVE_OUTPUT" --candidate build/audition-windows --toolchain evidence/windows-toolchain.txt
          cp "$CYBERSAND_AUDITION_WINDOWS_PROBE" "${CYBERSAND_AUDITION_WINDOWS_PROBE%.exe}.build.json" build/audition-windows/
          "$LLVM_MINGW_ROOT/bin/llvm-objdump" -p "$CYBERSAND_NATIVE_OUTPUT" > evidence/windows-imports.txt
      - name: Retain candidate for actual target-OS execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-audition-windows-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/audition-windows/
          if-no-files-found: error
          retention-days: 90
      - name: Retain original Windows build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-audition-windows-build-logs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Windows native, graphical and relocated offline evaluator
    needs: [windows-build]
    if: github.ref == 'refs/heads/mat/audition-live-001'
    runs-on: windows-2022
    timeout-minutes: 150
    outputs:
      artifact_attempt: ${{ steps.identity.outputs.attempt }}
    env:
      CYBERSAND_LAB_CXX: 'C:\mingw64\bin\g++.exe'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record target-OS artifact attempt
        id: identity
        shell: pwsh
        run: '"attempt=$env:GITHUB_RUN_ATTEMPT" | Out-File -Append $env:GITHUB_OUTPUT'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: material-audition-windows-build-${{ github.sha }}-${{ github.run_id }}-${{ needs.windows-build.outputs.artifact_attempt }}
          path: build/audition-windows
      - name: Authenticate Windows engine and install the source candidate
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Rapier materialization failed' }
          python tools/ci/run_material_audition_qualification.py verify --candidate build/audition-windows --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'Source candidate identity failed' }
          Copy-Item build/audition-windows/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll
          $archive = Join-Path $env:RUNNER_TEMP 'godot47.zip'
          curl.exe -fL --retry 3 -o $archive 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed' }
          $expected = '41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9'
          if ((Get-FileHash $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected) { throw 'Godot archive identity failed' }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'godot47')
          'GODOT=' + (Join-Path $env:RUNNER_TEMP 'godot47/Godot_v4.7-stable_win64_console.exe') | Out-File -Append $env:GITHUB_ENV
      - name: Execute target-OS native and graphical current-scene tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python tools/ci/test_material_audition_evidence.py > evidence/evidence-guards.log 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Evidence guards failed' }
          python tools/ci/material_audition_publication.py run-windows-probe --source-sha $env:GITHUB_SHA --windows-candidate build/audition-windows --windows-evidence evidence/windows-native
          if ($LASTEXITCODE -ne 0) { throw 'Expanded native Windows consumer suite failed' }
          python tools/ci/run_material_audition_qualification.py run --candidate build/audition-windows --godot $env:GODOT --evidence evidence/windows --graphical
          if ($LASTEXITCODE -ne 0) { throw 'Windows current-scene qualification failed' }
      - name: Stage engine notices and signed release redistributable
        shell: pwsh
        run: |
          $notices = Join-Path $env:RUNNER_TEMP 'notices'
          New-Item -ItemType Directory $notices | Out-Null
          foreach ($name in @('LICENSE.txt','COPYRIGHT.txt')) {
            curl.exe -fL --retry 3 -o (Join-Path $notices $name) "https://raw.githubusercontent.com/godotengine/godot/5b4e0cb0f/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Godot notices download failed' }
          }
          $runtimeLicense = Join-Path $notices 'Microsoft-Visual-C-Runtime-LICENSE.docx'
          $developerLicense = Join-Path $notices 'Microsoft-Visual-Studio-2022-LICENSE.docx'
          curl.exe -fL --retry 3 -o $runtimeLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/09/Visual-C-Runtime-2015-2022-License-1.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft runtime licence download failed' }
          curl.exe -fL --retry 3 -o $developerLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft redistribution licence download failed' }
          ./tools/ci/stage_windows_vc_runtime.ps1 -Output (Join-Path $env:RUNNER_TEMP 'vc-runtime') -License $runtimeLicense -DeveloperLicense $developerLicense
      - name: Build and execute the delivered offline evaluator
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'material-audition-evaluator'
          $engine = Join-Path $env:RUNNER_TEMP 'godot47/Godot_v4.7-stable_win64.exe'
          python tools/package_material_audition_candidate.py build --candidate build/audition-windows --evidence evidence/windows --engine $engine --engine-notices (Join-Path $env:RUNNER_TEMP 'notices') --vc-runtime (Join-Path $env:RUNNER_TEMP 'vc-runtime') --output $package
          if ($LASTEXITCODE -ne 0) { throw 'Evaluator assembly failed' }
          python tools/package_material_audition_candidate.py smoke --output $package --evidence evidence/relocated-package --archive delivery/CyberSand-Material-Audition-Windows.zip
          if ($LASTEXITCODE -ne 0) { throw 'Relocated evaluator execution failed' }
          python tools/package_material_audition_candidate.py verify --output $package
          if ($LASTEXITCODE -ne 0) { throw 'Pristine evaluator verification failed' }
      - name: Retain owner-ready interactive evaluator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-audition-owner-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/CyberSand-Material-Audition-Windows.zip
          if-no-files-found: error
          retention-days: 90
      - name: Retain original target-OS and extracted-package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-audition-windows-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Publish four source-matched candidate runtime paths
    needs: [linux, windows-build, windows]
    if: github.repository == 'techrote/cybersand' && github.event_name == 'push' && github.ref == 'refs/heads/mat/audition-live-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the exact qualified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Check explicit intent and current source lease
        run: |
          set -euo pipefail
          python3 tools/ci/test_material_audition_publication.py
          python3 tools/ci/material_audition_publication.py check-source --source-sha "$GITHUB_SHA"
          git lfs install --local
      - name: Restore this run's Linux evidence and runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: material-audition-linux-${{ github.sha }}-${{ github.run_id }}-${{ needs.linux.outputs.artifact_attempt }}
          path: build/publication/linux
      - name: Restore this run's Windows candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: material-audition-windows-build-${{ github.sha }}-${{ github.run_id }}-${{ needs.windows-build.outputs.artifact_attempt }}
          path: build/publication/windows-candidate
      - name: Restore this run's Windows and extracted-evaluator evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: material-audition-windows-evidence-${{ github.sha }}-${{ github.run_id }}-${{ needs.windows.outputs.artifact_attempt }}
          path: build/publication/windows-evidence
      - name: Restore the exact extracted and executed Windows archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: material-audition-owner-windows-${{ github.sha }}-${{ github.run_id }}-${{ needs.windows.outputs.artifact_attempt }}
          path: build/publication/delivery
      - name: Authenticate original evidence and stage only qualified runtimes
        run: |
          set -euo pipefail
          python3 tools/ci/material_audition_publication.py stage --source-sha "$GITHUB_SHA" --linux-bundle build/publication/linux --windows-candidate build/publication/windows-candidate --windows-evidence build/publication/windows-evidence --windows-archive build/publication/delivery/CyberSand-Material-Audition-Windows.zip
          git add -- godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/runtime-provenance.linux.json godot/addons/cybersand_native/runtime-provenance.json
          python3 tools/ci/material_audition_publication.py check-index --source-sha "$GITHUB_SHA"
          git diff --check --cached
          git diff --exit-code
      - name: Append the four-path commit under an unchanged branch lease
        run: |
          set -euo pipefail
          python3 tools/ci/material_audition_publication.py check-source --source-sha "$GITHUB_SHA"
          python3 tools/ci/material_audition_publication.py check-index --source-sha "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(materials): publish source-qualified audition candidate runtimes'
          test "$(git rev-list --parents -n 1 HEAD)" = "$(git rev-parse HEAD) $GITHUB_SHA"
          # A proven single-parent child plus an exact remote lease permits
          # only this fast-forward and refuses any concurrent branch change.
          git push --force-with-lease="refs/heads/mat/audition-live-001:$GITHUB_SHA" origin HEAD:refs/heads/mat/audition-live-001
          {
            echo '### Material audition candidate runtimes published'
            echo "Qualified source: $GITHUB_SHA"
            echo "Four-path publication: $(git rev-parse HEAD)"
            echo 'Draft/HOLD retained. No Ready promotion, merge, production-default change or physical owner acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
