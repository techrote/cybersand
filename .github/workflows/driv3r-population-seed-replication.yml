name: DRIV3R population goal-memory seed replication (P15)
on:
  push:
    branches:
      - research/570-population-game-policy-001
    paths:
      - 'experiments/driv3r/training/population/population_p15.py'
      - 'experiments/driv3r/training/population/test_population_p15.py'
      - 'experiments/driv3r/training/population/P15_REPORT.md'
      - '.github/workflows/driv3r-population-seed-replication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p15-cpu-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only research dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run independent P15 source and host-legal guardrails
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest discover -s experiments/driv3r/training/population -p test_population_p15.py -v
      - name: Train six source-pinned matched populations on CPU
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          mkdir -p /tmp/population-p15-evidence/source
          git rev-parse HEAD > /tmp/population-p15-evidence/source/exact-head.txt
          python --version > /tmp/population-p15-evidence/source/python-version.txt 2>&1
          python -m pip freeze > /tmp/population-p15-evidence/source/pip-freeze.txt
          python experiments/driv3r/training/population/population_p15.py \
            --output /tmp/population-p15-evidence/training \
            --seeds 658 659 660 661 662 663 \
            --train-worlds 4 --validation-worlds 2 --heldout-worlds 2 \
            --epochs 12 --width 32 \
            > /tmp/population-p15-evidence/stdout.json
          (cd /tmp/population-p15-evidence/training && sha256sum -c manifest.sha256)
          for c in /tmp/population-p15-evidence/training/cohort_*/; do
            (cd "$c" && sha256sum -c manifest.sha256)
          done
      - name: Preserve exact source and final comprehensive evidence manifest
        if: always()
        run: |
          mkdir -p /tmp/population-p15-evidence/source
          for f in population_lab.py population_p1.py population_p10.py population_p11.py population_p12.py population_p13.py population_p14.py population_p15.py test_population_p15.py P15_REPORT.md; do
            cp "experiments/driv3r/training/population/$f" /tmp/population-p15-evidence/source/ || true
          done
          (cd /tmp/population-p15-evidence && find . -type f ! -name OVERALL.sha256 -print0 | sort -z | xargs -0 sha256sum > OVERALL.sha256)
          (cd /tmp/population-p15-evidence && sha256sum -c OVERALL.sha256)
      - name: Upload immutable source-matched P15 models, trajectories, and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-p15-memory-stability-${{ github.sha }}
          path: /tmp/population-p15-evidence/
          if-no-files-found: warn
          retention-days: 90
