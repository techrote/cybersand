name: Native C++ validation

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/pull_request_template.md'
      - 'tools/ci/check_ci_provider_policy.py'
      - 'tools/ci/test_ci_provider_policy.py'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/pull_request_template.md'
      - 'tools/ci/check_ci_provider_policy.py'
      - 'tools/ci/test_ci_provider_policy.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

# Routine hosted budgets are derived together below. Local/test scaling remains
# available; a larger hosted override must also fit its complete job allowance.
env:
  CYBERSAND_CI_WATCHDOG_SCALE: '1'

jobs:
  ready_scope:
    name: ready validation scope
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Check out execution policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Classify ready-for-review change scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          sys.path.insert(0, "tools/ci")
          from execution_policy import watchdog_seconds

          ignored_prefixes = (".github/workflows/", "docs/")
          ignored_exact = {
              "AGENTS.md",
              ".github/pull_request_template.md",
              "tools/ci/check_ci_provider_policy.py",
              "tools/ci/test_ci_provider_policy.py",
          }

          files = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
                  f"/pulls/{os.environ['PR_NUMBER']}/files?per_page=100&page={page}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=watchdog_seconds("operation_seconds")) as response:
                  batch = json.load(response)
              files.extend(item["filename"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          def ignored(path):
              return path in ignored_exact or path.startswith(ignored_prefixes)

          required = any(not ignored(path) for path in files)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={'true' if required else 'false'}\n")
          print(
              "ready-for-review expensive validation:",
              "required" if required else "not required",
          )
          print("\n".join(files))
          PY

  policy:
    name: Native evidence and provider policy
    needs: [ready_scope]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      matrix: ${{ steps.budgets.outputs.matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Derive complete family and hosted job allowances
        id: budgets
        run: |
          set -euo pipefail
          python3 tools/ci/run_timed_command.py --policy-key operation_seconds \
            --label native-budget-plan --output-dir build/native-policy/budget-command -- \
            python3 tools/ci/native_execution_policy.py matrix --output build/native-policy/matrix.json
          printf 'matrix=%s\n' "$(cat build/native-policy/matrix.json)" >> "$GITHUB_OUTPUT"
          python3 tools/ci/native_execution_policy.py inventory --output build/native-policy/budgets.json
      - name: Check hosted provider and evidence failure controls
        run: |
          set -euo pipefail
          for check in check_ci_provider_policy test_ci_provider_policy test_native_shards test_worldgen_build_inventory test_native_watchdogs; do
            python3 tools/ci/run_timed_command.py --policy-key operation_seconds \
              --label "$check" --output-dir "build/native-policy/$check" -- \
              python3 "tools/ci/$check.py"
          done
      - name: Preserve Native policy check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-policy/
          if-no-files-found: error
          retention-days: 90

  native-shards:
    name: Native family / ${{ matrix.suite }}
    needs: [ready_scope, policy]
    if: >-
      always() && needs.policy.outputs.matrix != '' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: ubuntu-24.04
    # Each job exceeds the complete sum of its command allowances, preparation
    # and capture headroom. The planner refuses budgets above the hosted limit.
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record compiler, linker and exact source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gcc-13 --version
          g++-13 --version
          ld --version
          make --version

      - name: Execute complete test family with shared watchdogs
        id: execute
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          FAMILY_TIMEOUT_SECONDS: ${{ matrix.family_seconds }}
        run: |
          set -euo pipefail
          mkdir -p "build/native-parallel/$SUITE"
          # Preserve the original first failing command's exit, including 124.
          # The inner shell still stops at that command; no retry is introduced.
          set +e
          (
            set -euo pipefail
            echo "source_sha=$GITHUB_SHA suite=$SUITE run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "compiler=$(g++-13 --version | head -n 1)"
            python3 tools/ci/run_timed_command.py \
              --policy-key native_suite_seconds --label "native-family-$SUITE" \
              --timeout-seconds "$FAMILY_TIMEOUT_SECONDS" \
              --output-dir "build/native-parallel/$SUITE/family" -- \
              bash tools/ci/run_native_family.sh "$SUITE" "build/native-parallel/$SUITE"
            echo "Native family passed: $SUITE"
          ) 2>&1 | tee "build/native-parallel/$SUITE/run.log"
          original_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${original_status[0]}" > "build/native-parallel/$SUITE/family-exit-code.txt"
          printf '%s\n' "${original_status[1]}" > "build/native-parallel/$SUITE/log-capture-exit-code.txt"
          if [ "${original_status[0]}" -ne 0 ]; then
            exit "${original_status[0]}"
          fi
          exit "${original_status[1]}"

      - name: Retain original family outcome and source fingerprints
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          SUITE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          python3 tools/ci/verify_native_shards.py record \
            --suite "$SUITE" --outcome "$SUITE_OUTCOME" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output build/native-parallel

      - name: Preserve original family logs and scientific outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-shard-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native-parallel/
            build/physics-cli-validation/
            build/stage3b-validation-*.json
          if-no-files-found: error
          retention-days: 90

  native:
    name: native
    needs: [ready_scope, policy, native-shards]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.result != 'success' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact verifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download all original family evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-evidence
      - name: Verify complete exact-source Native qualification
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          MATRIX_RESULT: ${{ needs.native-shards.result }}
        run: |
          python3 tools/ci/verify_native_shards.py verify \
            --directory build/native-evidence \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --policy-result "$POLICY_RESULT" --matrix-result "$MATRIX_RESULT" \
            --output build/native-qualification/aggregate.json
      - name: Retain Native aggregate proof and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-qualification/
          if-no-files-found: error
          retention-days: 90

      - name: Retain advisory history across comparable native runs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/performance_history.py --current build/native-evidence --output build/execution-performance --include-jobs
      - name: Publish native execution performance observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-performance-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/execution-performance/
          if-no-files-found: warn
          retention-days: 90
