name: RENDER-COPY-290 source-matched Godot hosts
on:
  push:
    branches: [verify/render-copy290-fixed-godot-20261029]
    paths:
      - '.github/workflows/render-copy-290-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-copy-290-godot-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_URL: 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
  GODOT_SILENCE_ROOT_WARNING: '1'

jobs:
  linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_CPP_ROOT: ${{ github.workspace }}/../qual290-godot-cpp
      SCONS_PYTHON: ${{ github.workspace }}/../qual290-scons/bin/python
      SCONS_JOBS: '2'
      CYBERSAND_REAL_CXX: /usr/bin/g++-13
      LINUX_CXX: /usr/bin/g++-13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - name: Restore pinned Rapier, SCons and godot-cpp
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" --exclude=""
          echo '566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' | sha256sum --check --strict
          python3 -m venv "$(dirname "$(dirname "$SCONS_PYTHON")")"
          "$SCONS_PYTHON" -m pip install --require-hashes -r tools/requirements-build.txt
          "$SCONS_PYTHON" -c 'import SCons; assert SCons.__version__=="4.10.1"'
          mkdir "$GODOT_CPP_ROOT"
          git -C "$GODOT_CPP_ROOT" init
          git -C "$GODOT_CPP_ROOT" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$GODOT_CPP_ROOT" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$GODOT_CPP_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$GODOT_CPP_ROOT" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
      - name: Build exact-source Linux GDExtension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qual290/linux-host
          git rev-parse HEAD > build/qual290/linux-host/source.txt
          git rev-parse HEAD^{tree} > build/qual290/linux-host/tree.txt
          timeout 35m tools/build_pinned_godot_cpp.sh linux > build/qual290/linux-host/godot-cpp-build.txt 2>&1
          timeout 20m tools/build_native_extension.sh > build/qual290/linux-host/native-build.txt 2>&1
          sha256sum godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so > build/qual290/linux-host/runtime.sha256
      - name: Execute exact-source Godot 4.7 render tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = '4.7.stable.official.5b4e0cb0f'
          timeout 120s "$GODOT_BIN" --headless --path godot --editor --import --quit > build/qual290/linux-host/import.txt 2>&1
          timeout 150s "$GODOT_BIN" --headless --path godot --script res://tests/test_render_world_generation.gd > build/qual290/linux-host/render-world.txt 2>&1
          grep -F '23 assertions, 0 failures' build/qual290/linux-host/render-world.txt
          timeout 150s "$GODOT_BIN" --headless --path godot --script res://tests/test_render_patch_handoff_regression.gd > build/qual290/linux-host/render-patches.txt 2>&1
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load|FAIL' build/qual290/linux-host/import.txt build/qual290/linux-host/render-world.txt build/qual290/linux-host/render-patches.txt
          sha256sum --check --strict build/qual290/linux-host/runtime.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: render-copy-290-linux-godot-${{ github.sha }}
          path: build/qual290/linux-host/
          if-no-files-found: warn
          retention-days: 30

  windows-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GODOT_CPP_ROOT: ${{ github.workspace }}/../qual290-godot-cpp
      SCONS_PYTHON: ${{ github.workspace }}/../qual290-scons/bin/python
      SCONS_JOBS: '2'
      LLVM_MINGW_ROOT: ${{ github.workspace }}/../qual290-llvm-mingw
      WINDOWS_CXX: ${{ github.workspace }}/../qual290-llvm-mingw/bin/x86_64-w64-mingw32-g++
      CYBERSAND_NATIVE_OUTPUT: ${{ github.workspace }}/build/qual290/windows-dll/cybersand_native.windows.x86_64.dll
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - name: Prepare pinned godot-cpp and LLVM-MinGW
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$(dirname "$(dirname "$SCONS_PYTHON")")"
          "$SCONS_PYTHON" -m pip install --require-hashes -r tools/requirements-build.txt
          "$SCONS_PYTHON" -c 'import SCons; assert SCons.__version__=="4.10.1"'
          mkdir "$GODOT_CPP_ROOT" "$LLVM_MINGW_ROOT"
          git -C "$GODOT_CPP_ROOT" init
          git -C "$GODOT_CPP_ROOT" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 10m git -C "$GODOT_CPP_ROOT" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$GODOT_CPP_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$GODOT_CPP_ROOT" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
          timeout 10m curl --fail --location --retry 3 --output "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$LLVM_MINGW_ROOT" --strip-components=1
          if test ! -e "$LLVM_MINGW_ROOT/bin/x86_64-w64-mingw32-gcc-ar"; then ln -s llvm-ar "$LLVM_MINGW_ROOT/bin/x86_64-w64-mingw32-gcc-ar"; fi
      - name: Build and stage exact Windows GDExtension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qual290/windows-dll
          git rev-parse HEAD > build/qual290/windows-dll/source.txt
          git rev-parse HEAD^{tree} > build/qual290/windows-dll/tree.txt
          timeout 35m tools/build_pinned_godot_cpp.sh windows > build/qual290/windows-dll/godot-cpp-build.txt 2>&1
          timeout 20m tools/build_native_extension_windows.sh > build/qual290/windows-dll/native-build.txt 2>&1
          (cd build/qual290/windows-dll && sha256sum cybersand_native.windows.x86_64.dll > runtime.sha256)
          file "$CYBERSAND_NATIVE_OUTPUT"
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: render-copy-290-windows-dll-${{ github.sha }}
          path: build/qual290/windows-dll/
          if-no-files-found: warn
          retention-days: 30

  windows-host:
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
      GODOT_SHA512: 41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: render-copy-290-windows-dll-${{ github.sha }}
          path: build/qual290/windows-dll/
      - name: Materialize source-matched DLL, pinned Rapier, official Godot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > build/qual290/windows-dll/execution-source.txt
          test "$(cat build/qual290/windows-dll/source.txt)" = "$(git rev-parse HEAD)"
          (cd build/qual290/windows-dll && sha256sum --check --strict runtime.sha256)
          cp build/qual290/windows-dll/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          echo 'b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7  godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/godot-windows.zip" "$GODOT_WINDOWS_URL"
          python - <<'PY'
          import hashlib,os,zipfile
          p=os.environ["RUNNER_TEMP"]+"/godot-windows.zip"
          assert hashlib.sha512(open(p,"rb").read()).hexdigest()==os.environ["GODOT_SHA512"]
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              z.extractall(os.environ["RUNNER_TEMP"]+"/godot-windows")
          PY
      - name: Execute actual Windows Godot native render tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qual290/windows-host
          git rev-parse HEAD > build/qual290/windows-host/source.txt
          python - <<'PY'
          import os, pathlib, subprocess
          root=pathlib.Path.cwd()
          exe=pathlib.Path(os.environ["RUNNER_TEMP"])/"godot-windows"/"Godot_v4.7-stable_win64_console.exe"
          assert exe.is_file(),exe
          assert subprocess.check_output([str(exe),"--version"],text=True).strip()=="4.7.stable.official.5b4e0cb0f"
          out=root/"build"/"qual290"/"windows-host"
          scripts=[
            ("import",["--headless","--path","godot","--editor","--import","--quit"],120),
            ("render-world",["--headless","--path","godot","--script","res://tests/test_render_world_generation.gd"],150),
            ("render-patches",["--headless","--path","godot","--script","res://tests/test_render_patch_handoff_regression.gd"],150)]
          for name,args,timeout in scripts:
              with (out/(name+".txt")).open("w",encoding="utf-8") as f:
                  p=subprocess.run([str(exe),*args],cwd=root,stdout=f,stderr=subprocess.STDOUT,timeout=timeout)
              data=(out/(name+".txt")).read_text(encoding="utf-8",errors="replace")
              assert p.returncode==0,(name,p.returncode,data[-3000:])
              assert "SCRIPT ERROR:" not in data and "ERROR: Failed to load" not in data,(name,data[-3000:])
              if name=="render-world":
                  assert "23 assertions, 0 failures" in data,data[-3000:]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: render-copy-290-windows-host-${{ github.sha }}
          path: build/qual290/windows-host/
          if-no-files-found: warn
          retention-days: 30
