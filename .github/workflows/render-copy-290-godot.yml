name: RENDER-COPY-290 Godot validation bootstrap
on:
  push:
    branches: [verify/render-copy-per-run-godot-20261029]
    paths:
      - '.github/workflows/render-copy-290-godot.yml'
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify source and guard
        run: |
          git rev-parse HEAD
          python3 tools/ci/check_ci_provider_policy.py
