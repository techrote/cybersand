name: PUBPRES original qualification inspection

on:
  push:
    branches: [codex/pubpres-mainline-evidence-001-20261128]
    paths: ['.github/workflows/pubpres-mainline-inspect.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: pubpres-mainline-original-inspection-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inspect-original:
    name: Inspect original Q3 frozen artifact (${{ matrix.role }})
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/pubpres-mainline-evidence-001-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [linux-frozen, windows-frozen]
    steps:
      - name: Authenticate original artifact and inspect bounded original records
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSPECTION_ROLE: ${{ matrix.role }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, urllib.error, urllib.parse, urllib.request, zipfile
          REPOSITORY = "techrote/cybersand"
          SOURCE = "d9cc40b2da9ab447b9b25eef79158913e01fec01"
          TREE = "591aeca0b4741c2f9b2a8eff1cf8f8dad0a3a108"
          RUN, ATTEMPT = 46139433132, 1
          ROLES = {
              "linux-frozen": (15260559908, 37063839, "ec1dc2392ffbcc50d81ecbb3aa2bdd188302617872ab3867e4e0ab56fa9dc65b",
                               "pubpres-mainline-qualified-linux-frozen-46139433132-1"),
              "windows-frozen": (15261133104, 18433189, "cb90960157b18c2f484689fd15a4de6cf46e05e849f911840cd018767f3232ea",
                                 "pubpres-mainline-qualified-windows-frozen-46139433132-1"),
          }
          role = os.environ["INSPECTION_ROLE"]
          artifact_id, expected_bytes, expected_sha, expected_name = ROLES[role]
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("pubpres-original-inspection-" + role)
          output.mkdir(exist_ok=False)
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                     "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def api(path):
              request = urllib.request.Request("https://api.github.com/repos/" + REPOSITORY + path, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(1048577)
              if len(raw) > 1048576: raise ValueError("Bounded original metadata response exceeded")
              return json.loads(raw)
          run = api("/actions/runs/" + str(RUN))
          if not (run["id"] == RUN and run["run_attempt"] == ATTEMPT and run["head_sha"] == SOURCE
                  and run["event"] == "push" and run["head_branch"] == "codex/pubpres-playability-final-001-20261124"
                  and run["path"] == ".github/workflows/pubpres-mainline.yml"):
              raise ValueError("Original qualification source/run/attempt/workflow differs")
          metadata = api("/actions/artifacts/" + str(artifact_id))
          if not (metadata["id"] == artifact_id and metadata["name"] == expected_name and not metadata["expired"]
                  and metadata["size_in_bytes"] == expected_bytes and metadata["digest"] == "sha256:" + expected_sha
                  and metadata["workflow_run"]["id"] == RUN and metadata["workflow_run"]["head_sha"] == SOURCE):
              raise ValueError("Original artifact identity differs")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, response_headers, newurl):
                  return None
          request = urllib.request.Request("https://api.github.com/repos/" + REPOSITORY
                                           + "/actions/artifacts/" + str(artifact_id) + "/zip", headers=headers)
          try:
              urllib.request.build_opener(NoRedirect).open(request, timeout=60)
          except urllib.error.HTTPError as response:
              if response.code not in (301, 302, 303, 307, 308): raise
              download = response.headers["Location"]
          else:
              raise ValueError("Expected the authenticated artifact's signed download redirect")
          parsed = urllib.parse.urlsplit(download)
          if parsed.scheme != "https" or parsed.username or parsed.password:
              raise ValueError("Invalid artifact download redirect")
          # The GitHub credential never accompanies the separate signed storage request.
          archive = output / "original-artifact.zip"
          received, digest = 0, hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(download), timeout=90) as response, archive.open("xb") as stream:
              while block := response.read(1048576):
                  received += len(block)
                  if received > expected_bytes: raise ValueError("Original archive exceeds its authenticated size")
                  digest.update(block)
                  stream.write(block)
          if received != expected_bytes or digest.hexdigest() != expected_sha:
              raise ValueError("Original archive bytes differ")
          prefix = "mainline-qualified/"
          summary_name = prefix + "SUMMARY.json"
          expected_inventory = [("import", 2)] + [(name, 2) for name in (
              "test_workbench_physics_publication", "test_workbench_physics_causal_trace",
              "test_workbench_material_world_blend", "test_workbench_material_delivery_timing",
              "test_physical_actor_integration", "test_render_cadence_worker",
              "test_material_publication_deadline", "test_material_deadline_main_identity",
              "test_material_publication_steps", "test_material_steps_main_identity")]
          expected_inventory += [(name, 3) for name in (
              "test_full_image_ring_publication", "test_full_image_ring_main_recovery",
              "pubpres_full_image_ring_oracle", "test_workbench_material_world_blend",
              "test_workbench_material_delivery_timing")]
          expected_inventory += [("test_material_deadline_main_history", 2),
                                 ("test_material_deadline_main_history", 3),
                                 ("test_material_steps_main_history", 2)]
          records, absent = {}, []
          with zipfile.ZipFile(archive) as bundle:
              items = bundle.infolist()
              if not 0 < len(items) <= 10000 or sum(item.file_size for item in items) > 256 * 1024**2:
                  raise ValueError("Original archive population/expansion exceeds inspection bound")
              names, normalized_names = set(), set()
              for item in items:
                  name, relative = item.filename, pathlib.PurePosixPath(item.filename)
                  parts = relative.parts
                  mode = (item.external_attr >> 16) & 0o170000
                  normalized = relative.as_posix()
                  if (not parts or name in names or normalized in normalized_names or "\\" in name
                          or ":" in name or relative.is_absolute() or ".." in parts
                          or item.flag_bits & 1 or mode not in (0, stat.S_IFREG, stat.S_IFDIR)):
                      raise ValueError("Unsafe, linked, encrypted or aliased original ZIP member")
                  names.add(name)
                  normalized_names.add(normalized)
              if bundle.testzip() is not None:
                  raise ValueError("Original archive CRC failure")
              if summary_name not in names:
                  raise ValueError("Missing original frozen SUMMARY")
              def read_original(name):
                  if name not in names:
                      absent.append(name)
                      return None
                  info = bundle.getinfo(name)
                  if info.is_dir() or info.file_size > 8 * 1024**2:
                      raise ValueError("Requested original record exceeds bounded file scope")
                  raw = bundle.read(name)
                  target = output / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(raw)
                  records[name] = {"sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw)}
                  return raw
              raw_summary = read_original(summary_name)
              summary = json.loads(raw_summary.decode("utf-8-sig"))
              source = summary.get("source", {})
              if not (summary.get("schema") == "pubpres-recovery-correctness-v1"
                      and summary.get("focus") == "frozen"
                      and source.get("source_commit") == SOURCE and source.get("source_tree") == TREE
                      and source.get("qualified_exact_head") is True):
                  raise ValueError("Original frozen receipt source/tree or scope differs")
              outcomes = summary.get("outcomes", [])
              if [(row.get("test"), row.get("slots")) for row in outcomes] != expected_inventory:
                  raise ValueError("Original frozen19-case population differs")
              if any(type(row.get("valid")) is not bool for row in outcomes):
                  raise ValueError("Original outcome lacks an explicit validation status")
              compact = {key: summary.get(key) for key in (
                  "schema", "complete", "full_qualification", "physical_acceptance",
                  "focus", "headless_only", "render_thread", "lookahead", "engine_sha256",
                  "rapier_sha256", "final_source_mutations", "import_source_mutations")}
              compact["source"] = {key: source.get(key) for key in
                                   ("source_commit", "source_tree", "qualified_exact_head",
                                    "working_tree_changes", "untracked_source_files")}
              compact["outcomes"] = [{key: row.get(key) for key in
                                     ("test", "slots", "graphical", "valid", "returncode",
                                      "timed_out", "seconds", "failure", "error")} for row in outcomes]
              compact_text = json.dumps(compact, indent=2)
              if len(compact_text) > 96000:
                  raise ValueError("Compact original frozen summary exceeds console bound")
              print("ORIGINAL_FROZEN_SUMMARY_BEGIN " + role, flush=True)
              print(compact_text, flush=True)
              print("ORIGINAL_FROZEN_SUMMARY_END " + role, flush=True)
              failed = [row for row in outcomes if not row["valid"]]
              requested = []
              for row in failed:
                  case = prefix + row["test"] + "-slots" + str(row["slots"]) + "/"
                  # Labels are admitted by the exact source-bound population above.
                  requested += [case + "stdout.log", case + "process.json", case + "receipt.json"]
                  direct_json = sorted(name for name in names if name.startswith(case)
                                       and "/" not in name[len(case):] and name.endswith(".json"))
                  if len(direct_json) > 16:
                      raise ValueError("Failed original case has excessive direct receipt population")
                  requested += direct_json
                  if row["test"] == "pubpres_full_image_ring_oracle":
                      requested.append(prefix + "ring-transition.json")
              requested = list(dict.fromkeys(requested))
              # Every failed case receives a bounded excerpt; original files and ZIP remain complete.
              console_limit = min(96000, max(2048, 512000 // max(1, len(requested))))
              for name in requested:
                  raw = read_original(name)
                  if raw is None:
                      print("ORIGINAL_OPTIONAL_RECORD_ABSENT " + name, flush=True)
                      continue
                  text = raw.decode("utf-8-sig", errors="replace")
                  print("\nORIGINAL_RECORD_BEGIN " + name, flush=True)
                  if len(text) <= console_limit:
                      print(text, flush=True)
                  else:
                      half = console_limit // 2
                      print(text[:half] + "\n[BOUNDED CONSOLE EXCERPT: complete original file retained]\n" + text[-half:], flush=True)
                  print("ORIGINAL_RECORD_END " + name, flush=True)
          record = {"schema": "pubpres-mainline-original-failure-inspection-v1", "role": role,
                    "original_source": SOURCE, "original_tree": TREE, "original_run": RUN,
                    "original_attempt": ATTEMPT, "artifact": metadata,
                    "zip_sha256": digest.hexdigest(), "zip_bytes": received,
                    "records": records, "absent_optional_records": absent,
                    "failed_original_cases": [{"test": row["test"], "slots": row["slots"],
                                              "failure": row.get("failure")} for row in failed],
                    "application_executed": False,
                    "application_acceptance": "unchanged; failed arms remain failed",
                    "scope": "Read-only original19-case frozen artifact custody and bounded diagnosis. No checkout, application execution, source, fixture, watchdog or original receipt changes."}
          (output / "INSPECTION.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"original_source": SOURCE, "original_tree": TREE,
                            "artifact_id": artifact_id, "archive_verified": True,
                            "original_outcomes": len(outcomes), "failed_original_cases": record["failed_original_cases"],
                            "records": records, "absent_optional_records": absent}), flush=True)
          PY
      - name: Preserve the immutable original archive and diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pubpres-mainline-original-inspection-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pubpres-original-inspection-${{ matrix.role }}/
          if-no-files-found: warn
          retention-days: 90
