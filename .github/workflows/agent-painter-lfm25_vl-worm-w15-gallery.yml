name: LFM2.5-VL WORM W15 trained checkpoint family-swapped original PNG evaluation
on:
  push:
    branches: [codex/agent-painter-lfm25-vl-568]
    paths:
      - experiments/agent_painter/lanes/lfm25_vl/worm-w15-gallery-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: lfm25-vl-worm-w15-gallery-zero-optimizer-v1
  cancel-in-progress: false

jobs:
  resident-fleet:
    name: 24-turn live W15 learned model W0 synthetic PNG shard ${{ matrix.shard }} (1 model at a time)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [alpha, beta]
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout exact immutable evaluator source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout pinned W0 host
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          path: worm-w0
          persist-credentials: false
      - name: Checkout pinned LFM support curriculum
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: cc27b3206cb61f98432fa95b799c9b9ff508c2bc
          path: worm-support
          persist-credentials: false
      - name: Model-free preflight source and lease checking
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C worm-w0 rev-parse HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git hash-object worm-w0/experiments/agent_painter/worm/common/worm.py)" = 8979b6f0296e81051194bacc907992d38e006605
          test "$(git -C worm-support rev-parse HEAD)" = cc27b3206cb61f98432fa95b799c9b9ff508c2bc
          test "$(git hash-object worm-support/experiments/agent_painter/worm/support_lfm/curriculum.py)" = f205a3a9f33632aeaafa2daa8ce25b2484bc6032
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("experiments/agent_painter/lanes/lfm25_vl/worm-w15-gallery-request.json").read_text())
          assert r == {
            "schema":"cybersand.worm.lfm-w15-gallery-request/1",
            "original_fresh_training_source":"c61619b2bd2d556d7b58da0e6be0104e5abc4f7a",
            "training_run":43782365858,
            "checkpoint":"checkpoint-000045",
            "model":"LiquidAI/LFM2.5-VL-450M",
            "revision":"fc6221ca597f3315e4f82fc2df606783267b34ba",
            "W0_source":"4bb9d6e1d0d0d78183f87d1e3c29648edafacf61",
            "support_source":"cc27b3206cb61f98432fa95b799c9b9ff508c2bc",
            "families":["greebles","pipework","architecture"],
            "seeds":{"alpha":6211,"beta":6217},
            "turn_budget":24,
            "STOP_remains_sampleable":True,
            "model_procs_per_VM":1,
            "hosted_VM_count":2,
            "new_optimizer_updates":0,
            "native_execution":False,
            "sealed_FINAL_opened":False,
            "draft_hold":True,
            "attempt":1}
          PY
          python3 -m py_compile experiments/agent_painter/lanes/lfm25_vl/worm_w15_worker_v1.py experiments/agent_painter/lanes/lfm25_vl/worm_w15_audit_v1.py
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/lfm-w15-gallery-policy.json
          mkdir -p evidence/diagnostics
          git rev-parse HEAD > evidence/diagnostics/evaluator-source.txt
          git -C worm-w0 rev-parse HEAD > evidence/diagnostics/w0-source.txt
          git -C worm-support rev-parse HEAD > evidence/diagnostics/support-source.txt
          lscpu > evidence/diagnostics/cpu.txt
          free -h > evidence/diagnostics/memory.txt
      - name: Verify immutable actual W15 checkpoint source and download producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/techrote/cybersand/actions/runs/43782365858 --jq .head_sha)" = c61619b2bd2d556d7b58da0e6be0104e5abc4f7a
          test "$(gh api repos/techrote/cybersand/actions/runs/43782365858 --jq .conclusion)" = success
          mkdir -p evidence/prior
          gh run download 43782365858 -R techrote/cybersand --name lfm25-vl-worm-w15-family-conditional-c61619b2bd2d556d7b58da0e6be0104e5abc4f7a-43782365858-1 --dir evidence/prior
          test -f evidence/prior/worm-w15/checkpoint-000045/inventory.json
          test -f evidence/prior/worm-w15/optimizer-pairs.jsonl
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path("evidence/prior/worm-w15")
          m=json.loads((root/"corpus-manifest.json").read_text())
          assert hashlib.sha256((root/"optimizer-pairs.jsonl").read_bytes()).hexdigest()==m["pair_sha256"]
          s=json.loads((root/"summary.json").read_text())
          assert s["status"]=="complete" and s["genuine_AdamW_updates"]==45
          assert s["real_backward_passes"]==90
          assert s["source_sha"]=="c61619b2bd2d556d7b58da0e6be0104e5abc4f7a"
          PY
      - name: Install qualified official full-VL CPU packages
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lfm-w15-gallery"
          "$RUNNER_TEMP/lfm-w15-gallery/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/lfm-w15-gallery/bin/python" -m pip install -r experiments/agent_painter/training/requirements.lock
          "$RUNNER_TEMP/lfm-w15-gallery/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torchvision==0.29.2+cpu'
          "$RUNNER_TEMP/lfm-w15-gallery/bin/python" -m pip install -r experiments/agent_painter/training/requirements-lfm25_vl.lock
          "$RUNNER_TEMP/lfm-w15-gallery/bin/python" -m pip check
          "$RUNNER_TEMP/lfm-w15-gallery/bin/python" -m pip freeze --all > evidence/diagnostics/pip-freeze.txt
      - name: Download exact complete LiquidAI full multimodal weights and processor
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 900s "$RUNNER_TEMP/lfm-w15-gallery/bin/python" experiments/agent_painter/training/download_model.py --profile lfm25_vl --output "$RUNNER_TEMP/lfm-w15-gallery-model"
          cp "$RUNNER_TEMP/lfm-w15-gallery-model/download_receipt.json" evidence/diagnostics/model-download.json
          LFM25_SNAPSHOT="$RUNNER_TEMP/lfm-w15-gallery-model" "$RUNNER_TEMP/lfm-w15-gallery/bin/python" experiments/agent_painter/lanes/lfm25_vl/test_adapter.py > evidence/diagnostics/adapter-tests.txt 2>&1
      - name: Source-test legal W15 sampler including optional STOP
        env:
          PYTHONPATH: experiments/agent_painter/lanes/lfm25_vl:experiments/agent_painter/training
        run: |
          "$RUNNER_TEMP/lfm-w15-gallery/bin/python" - <<'PY'
          import worm_w15_worker_v1 as w
          fake={"candidate_logits":{a:0.0 for a in w.w7.ACTIONS}}
          action, receipt=w.scored_policy(fake,["LEFT","STOP"],"learned",6211,0)
          assert "STOP" in receipt["sampled_legal"] and receipt["STOP_deferred_unless_forced"] is False
          assert abs(sum(receipt["sample_probs"].values())-1.0)<1e-10
          assert action in ("LEFT","STOP") and w.TURNS==24
          PY
      - name: Actual W15 model closed-loop in three families on the SAME obstacle seed
        env:
          PYTHONPATH: experiments/agent_painter/lanes/lfm25_vl:experiments/agent_painter/training
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in alpha) seed=6211;; beta) seed=6217;; *) exit 2;; esac
          mkdir -p evidence/w15/${{ matrix.shard }}
          echo 'GO' > "$RUNNER_TEMP/w15-go"
          for family in greebles pipework architecture; do
            timeout --signal=TERM --kill-after=45s 1080s "$RUNNER_TEMP/lfm-w15-gallery/bin/python" experiments/agent_painter/lanes/lfm25_vl/worm_w15_worker_v1.py \
              --model "$RUNNER_TEMP/lfm-w15-gallery-model" \
              --worm-root worm-w0/experiments/agent_painter/worm/common \
              --support-root worm-support/experiments/agent_painter/worm/support_lfm \
              --producer-root evidence/prior/worm-w15 \
              --output evidence/w15/${{ matrix.shard }}/$family \
              --go-file "$RUNNER_TEMP/w15-go" --phase W15-family-stop \
              --lease "lfm-w15-${{ github.run_id }}-${{ matrix.shard }}-$family" \
              --seed "$seed" --family "$family"
          done
          "$RUNNER_TEMP/lfm-w15-gallery/bin/python" experiments/agent_painter/lanes/lfm25_vl/worm_w15_audit_v1.py \
            --root evidence/w15/${{ matrix.shard }} \
            --worm-root worm-w0/experiments/agent_painter/worm/common \
            --seed "$seed"
      - name: Retain original per-PID PNGs, partial/failure and CPU receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lfm25-vl-worm-w15-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/w15/
            evidence/diagnostics/
          if-no-files-found: warn
          retention-days: 90
