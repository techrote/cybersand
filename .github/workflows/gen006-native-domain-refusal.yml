name: GEN006 native selective-domain refusal (experimental)

on:
  push:
    branches:
      - experiment/gen006-selective-domain-refusal-20261105
    paths:
      - native/tests/test_gen006_selective_domain_refusal.cpp
      - .github/workflows/gen006-native-domain-refusal.yml
      - docs/audits/2026-11-05-gen006-selective-domain-refusal.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen006-native-selective-domain-refusal
  cancel-in-progress: false

jobs:
  linux-real-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Authenticate source compiler and CI provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gen006-domain-refusal
          git rev-parse HEAD | tee build/gen006-domain-refusal/source-sha.txt
          git rev-parse HEAD^{tree} | tee build/gen006-domain-refusal/source-tree.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          g++-13 --version | head -n 1 | tee build/gen006-domain-refusal/compiler.txt
          python3 tools/ci/check_ci_provider_policy.py 2>&1 | tee build/gen006-domain-refusal/provider-policy.log
      - name: Compile unmodified native World and diagnostic
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          timeout 840s g++-13 -std=c++20 -O0 -g1 -pthread \
            -Wall -Wextra -Wpedantic -I native/include \
            native/src/world.cpp native/src/material_rules.cpp \
            native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp \
            native/tests/test_gen006_selective_domain_refusal.cpp \
            -o build/gen006-domain-refusal/probe 2>&1 | tee build/gen006-domain-refusal/compile.log
      - name: Execute 1 and 4 configured-worker native cohorts
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 240s build/gen006-domain-refusal/probe 2>&1 | tee build/gen006-domain-refusal/observations.txt
          grep -q 'GEN006_SELECTIVE_DOMAIN_REFUSAL_PASS' build/gen006-domain-refusal/observations.txt
          test "$(grep -c 'result=PASS' build/gen006-domain-refusal/observations.txt)" = 2
      - name: Retain original source-matched outcome even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen006-native-selective-domain-refusal
          path: |
            build/gen006-domain-refusal/source-sha.txt
            build/gen006-domain-refusal/source-tree.txt
            build/gen006-domain-refusal/compiler.txt
            build/gen006-domain-refusal/provider-policy.log
            build/gen006-domain-refusal/compile.log
            build/gen006-domain-refusal/observations.txt
          if-no-files-found: warn
          retention-days: 45
