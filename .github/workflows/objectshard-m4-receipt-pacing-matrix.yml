name: ObjectShard M4 real Windows receipt-pacing matrix
on:
  workflow_dispatch:
  push:
    branches: [experiment/objectshard-m4-main-receipt-pacing-20261123]
permissions:
  contents: read
  actions: read
jobs:
  physical-pacing:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[objectshard-m4-pump-matrix]') }}
    runs-on: windows-2022
    timeout-minutes: 24
    steps:
      - name: Preserve LF source
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 45110007102
          name: objectshard-m4-fps-dll-ca72bbd387082dc54c1fab26b73c6d55b7549154-45110007102
          github-token: ${{ github.token }}
          path: build/objectshard-windows
      - name: Authenticate compatible 117 native inputs and binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          @'
          import pathlib,json,hashlib,subprocess
          p=pathlib.Path('build/objectshard-windows')
          m=json.loads((p/'candidate-provenance.json').read_text())
          assert m['source_commit']=='ca72bbd387082dc54c1fab26b73c6d55b7549154'
          assert len(m['source_inputs'])==117
          for n,h in m['source_inputs'].items():
              assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h, n
          dll=p/'cybersand_native.windows.x86_64.dll'
          assert hashlib.sha256(dll.read_bytes()).hexdigest()==m['sha256']
          info={'scope':'script-only diagnostic reuse, NOT an exact-source production runtime',
                'compiled_from':m['source_commit'],
                'tested_script_source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                'native_inputs_verified':117,'dll_sha256':m['sha256']}
          pathlib.Path('evidence/verified-source-reuse.json').write_text(json.dumps(info,indent=2))
          print(json.dumps(info))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw '117 native sources or binary mismatch' }
          Copy-Item build/objectshard-windows/cybersand_native.windows.x86_64.dll godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll -Force
      - name: Pin Rapier 0.35.2 and official Godot 4.7
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Rapier unavailable' }
          $rapier='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'
          if ((Get-FileHash $rapier -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7') { throw 'Rapier identity mismatch' }
          $zip=Join-Path $env:RUNNER_TEMP 'godot.zip'
          curl.exe -fL --retry 3 -o $zip 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Official Godot download failed' }
          if ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant() -ne '41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9') { throw 'Godot SHA512 mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'godot')
          $engine=Join-Path $env:RUNNER_TEMP 'godot/Godot_v4.7-stable_win64_console.exe'
          "GODOT_EXE=$engine" | Out-File -Append $env:GITHUB_ENV
      - name: Retain real physical edit and intermediate receipt guard
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path godot --quit *> evidence/import.log
          if ($LASTEXITCODE -ne 0) { throw 'Godot source import failed' }
          foreach ($t in @('test_object_shard_m4_same_world_physical_chain.gd','test_object_shard_m4_compact_motion_packets.gd')) {
            & $env:GODOT_EXE --headless --path godot --script "res://tests/$t" *> "evidence/$t.log"
            if ($LASTEXITCODE -ne 0) { Get-Content "evidence/$t.log"; throw "$t failed" }
            Get-Content "evidence/$t.log" | Select-Object -Last 5
          }
      - name: Four controlled real 240-tick 3-body Rapier scenarios
        shell: pwsh
        run: |
          $env:CYBERSAND_SOURCE_REVISION=$env:GITHUB_SHA
          foreach ($b in @(0,4000,8000,12000)) {
            $out=(Join-Path (Get-Location) "evidence/pump-$b.json")
            $log=(Join-Path (Get-Location) "evidence/pump-$b.log")
            Write-Host "Real 240 semantic ticks and Water/Sand/Fire; pump $b usec"
            & $env:GODOT_EXE --headless --path godot --script res://tests/profile_object_shard_worker.gd -- '--notifications=off' "--pump-usec=$b" "--output=$out" *> $log
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log | Select-Object -Last 80
              throw "Physical profile for $b failed"
            }
            Get-Content $log | Select-Object -Last 1
          }
      - name: Verify material and pose parity and measure scheduling
        shell: pwsh
        run: |
          @'
          import pathlib,json
          root=pathlib.Path('evidence')
          reports={b:json.loads((root/f'pump-{b}.json').read_text()) for b in (0,4000,8000,12000)}
          ref=reports[0]
          summary={'schema':'objectshard-m4-rigid-receipt-pacing-v1',
                   'scope':'matched Windows headless callbacks, NOT measured owner NVIDIA display FPS',
                   'source':ref['identity']['revision'],'rows':[],
                   'physical_material_pose_parity':True}
          for b,r in reports.items():
              assert r['failures']==0 and r['completed_intervals']==240, (b,r['failures'],r['completed_intervals'])
              assert r['actual_live_inputs']==ref['actual_live_inputs']==60
              assert r['actual_physics_steps']==ref['actual_physics_steps']
              assert r['publication_digests']==ref['publication_digests'],f'physics/material/pose divergence {b}'
              assert r['native_accounting']==ref['native_accounting'],f'ledger divergence {b}'
              assert sorted(r['contact_owners'])==sorted(ref['contact_owners']),f'contact divergence {b}'
              summary['rows'].append({'pump_usec':b,
                'semantic_ticks_per_second':r['semantic_ticks_per_wall_second'],
                'semantic_interval_p95_usec':r['semantic_interval_and_input_usec']['p95'],
                'callback_interval_p95_usec':r['process_callback_interval_usec']['p95'],
                'callback_interval_p99_usec':r['process_callback_interval_usec']['p99'],
                'pump_work_p95_usec':r['pump_call_while_pending_usec'].get('p95',0),
                'actual_rapier_substeps':r['actual_physics_steps'],
                'live_material_inputs':r['actual_live_inputs'],
                'checks':r['checks']})
          print(json.dumps(summary,indent=2))
          (root/'pacing-matrix-summary.json').write_text(json.dumps(summary,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native material/physics equivalence failed' }
      - name: Retain source, logs, raw profiles and adverse outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: objectshard-m4-Windows-receipt-pacing-matrix
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
