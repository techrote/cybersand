          python "$RUNNER_TEMP/camera-accepted-main/tools/ci/native_candidate_identity.py" "$GITHUB_WORKSPACE/build/native-pixel-integrated-baseline-windows"
          python - <<'PYCODE'
          import os, pathlib, shutil, sys
          sys.path.insert(0, 'tools/ci')
          import native_pixel_integrated_qualification as profile
          bundle = pathlib.Path('build/native-pixel-integrated-windows')
          profile.engine.verify_bundle(bundle, 'windows', os.environ['GITHUB_SHA'], validated=False)
          shutil.copyfile(bundle / 'cybersand_native.windows.x86_64.dll', pathlib.Path('godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll'))
          PYCODE
          cp build/native-pixel-integrated-baseline-windows/cybersand_native.windows.x86_64.dll "$RUNNER_TEMP/camera-accepted-main/godot/addons/cybersand_native/bin/"
          git lfs install --local
