name: WORM SPROCKET support original W4 recovery independent audit
on:
  push:
    branches: [research/612-worm-sprocket-support]
    paths:
      - experiments/agent_painter/worm/support_sprocket/audit_w4_recovery.py
      - .github/workflows/agent-painter-worm-sprocket-support-w4-recovery.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: worm-sprocket-support-w4-original-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-recovered-w4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scope, source and provider guardrails
        run: |
          set -euo pipefail
          mkdir -p evidence/w4-recovered
          git rev-parse HEAD > evidence/w4-recovered/support-source.txt
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/worm/support_sprocket/audit_w4_recovery.py
      - name: Download immutable original W4 recovery artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,urllib.error,urllib.parse
          url='https://api.github.com/repos/techrote/cybersand/actions/artifacts/14165042291/zip'
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
            'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          try:
              urllib.request.build_opener(NoRedirect).open(req,timeout=40)
              raise RuntimeError('artifact unexpectedly returned without redirect')
          except urllib.error.HTTPError as e:
              if e.code not in (301,302,303,307,308): raise
              signed=e.headers.get('Location','')
          host=urllib.parse.urlparse(signed)
          if host.scheme!='https' or not ((host.hostname or '').endswith('.blob.core.windows.net')
              or (host.hostname or '').endswith('.githubusercontent.com')
              or (host.hostname or '').endswith('.github.com')):
              raise RuntimeError('unexpected signed artifact domain')
          with urllib.request.urlopen(signed,timeout=120) as response:
              blob=response.read(400_000)
          if len(blob)>=400_000: raise RuntimeError('artifact ZIP exceeds bounded size')
          open('/tmp/immutable-w4-recovery.zip','wb').write(blob)
          PY
      - name: Pin and verify shepherd-owned W0 engine
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git rev-parse FETCH_HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > /tmp/immutable-w0.py
          test "$(sha256sum /tmp/immutable-w0.py | cut -c1-64)" = 81c3923cb38d7f196b99986806216388c34ebc27fd4976e168b3b370c25a323e
      - name: Replay 24 original traces and produce side-by-side PNG comparisons
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/worm/support_sprocket/audit_w4_recovery.py \
            /tmp/immutable-w4-recovery.zip --trusted-w0 /tmp/immutable-w0.py \
            --output evidence/w4-recovered | tee evidence/w4-recovered/audit-console.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/w4-recovered')
          j=json.loads((p/'w4-recovery-independent-report.json').read_text())
          assert j['complete_original_W0_JSON_and_pixel_replays']==24
          assert j['trained_original_raw_EOS5_and_legal_decisions']==144
          assert j['trained_action_histogram']=={'LEFT':144}
          assert len(j['galleries'])==6
          assert len(list((p/'contact').glob('*.png')))==6
          assert j['no_optimizer_or_Godot_native_painting'] is True
          PY
          sha256sum /tmp/immutable-w4-recovery.zip /tmp/immutable-w0.py > evidence/w4-recovered/external-inputs-sha256.txt
          (cd evidence/w4-recovered && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > evidence/w4-recovered/SHA256SUMS.txt
      - name: Retain completed or partial failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worm-sprocket-support-w4-recovered-independent
          path: evidence/w4-recovered/
          retention-days: 30
          if-no-files-found: warn
