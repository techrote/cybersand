name: Issue 61 focused sparse-witness validation

on:
  push:
    branches: [codex/issue-61-stage3b-sparse-mutation-witness]
    paths: [.github/workflows/issue61-focused-validation.yml]

permissions:
  contents: write

concurrency:
  group: issue61-focused-validation
  cancel-in-progress: true

jobs:
  focused:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-61-stage3b-sparse-mutation-witness'
    runs-on: sengi-standard-4-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Focused #61 correctness
        run: |
          set -euo pipefail
          timeout 8m make soliding-stage3b-sparse-mutation-witness-test
          timeout 8m make soliding-stage3b-runtime-storage-test
          timeout 8m make build/test_settled_world_discovery
          timeout 4m ./build/test_settled_world_discovery

      - name: Focused #61 ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        run: |
          set -euo pipefail
          timeout 12m make build/test_stage3b_sparse_mutation_witness_sanitized
          timeout 6m ./build/test_stage3b_sparse_mutation_witness_sanitized

      - name: Sparse-path structural assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "dirty_discovery_rect" native/src/world.cpp native/include/cybersand/world.hpp
          grep -q "record_discovery_mutation" native/src/world.cpp
          grep -q "notify_payload" native/src/world.cpp
          grep -q "fence_lost_payload_report" native/src/world.cpp
          git diff --check "$(git merge-base HEAD origin/main)" HEAD

      - name: Remove one-shot focused workflow after success
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/issue61-focused-validation.yml
          git config user.name techrote
          git config user.email 261801702+techrote@users.noreply.github.com
          git commit -m 'ci(stage3b): retire passed issue 61 focused validation'
          git push origin HEAD:codex/issue-61-stage3b-sparse-mutation-witness
