name: QL-004 pinned integer-activation and fixed-bitcode repair (research only)
on:
  push:
    branches:
      - 'research/driv3r-quant-lab-*'
    paths:
      - 'experiments/driv3r/quant_lab/ql004_integer_repair.py'
      - '.github/workflows/driv3r-quant-lab-ql004.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql004-integer-activation-repair
  cancel-in-progress: false
jobs:
  integer-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned free CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Download existing immutable QL-003 optimized model artifacts
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Validate source scopes, arithmetic and frozen-sign invariants
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql002_branch_retrace.py --self-test
          python experiments/driv3r/quant_lab/ql004_integer_repair.py --self-test
      - name: Genuine 96 optimizer updates and real first-pass 96-turn integer-activation comparisons
        run: |
          python experiments/driv3r/quant_lab/ql004_integer_repair.py --source-dir ql003-source --out ql004-out --steps 48
      - name: Verify exact HEAD, pinned immutable source, new checkpoints and original PNGs
        run: |
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          p=Path('ql004-out')
          r=json.loads((p/'results.json').read_text())
          assert r['source_sha']==os.environ['GITHUB_SHA']
          assert r['parent_training_source']=='9b4103c48127e5c8538403e2a4d9e2525fbe8755'
          assert r['parent_manifest_entries_verified']>=330
          assert r['new_optimizer_updates']==96
          assert r['train_n']>1000 and r['heldout_n']>1000
          assert len(r['variant_reports'])==10
          assert len(list((p/'gallery').glob('*.png')))==156
          assert len(json.loads((p/'raw_decisions.json').read_text()))==156
          for name in ('q1-scales-ce-int8','q1-scales-distilled-int8'):
              d=r['variant_reports'][name]['repair']
              assert d['updates']==48 and d['changed_tensors']>0 and d['nonzero_moment_tensors']>0
              assert d['fixed_q1_sign_code'] is True
          inventory=json.loads((p/'MANIFEST.json').read_text())
          assert len({e['path'] for e in inventory})==len(inventory)
          for e in inventory:
              data=(p/e['path']).read_bytes()
              assert len(data)==e['bytes'] and hashlib.sha256(data).hexdigest()==e['sha256'],e['path']
          for v in list(r['variant_reports'].values())+list(r['baselines'].values()):
              for e in v['trajectories']['original_pngs'] if 'trajectories' in v else v['original_pngs']:
                  assert hashlib.sha256((p/e['path']).read_bytes()).hexdigest()==e['sha256']
          print('QL004 EXACT-HEAD VERIFIED',len(inventory),'files and 156 original PNGs')
          PY
      - name: Retain actual checkpoints, model traces, integer profiles and original galleries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql004-pinned-integer-repair
          path: ql004-out/
          if-no-files-found: warn
          retention-days: 21
