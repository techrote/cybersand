name: RENDER-UPLOAD-001 source-bound publication research

# Owner-authorized isolated Draft experiment. General Draft suppression, camera
# ownership, production defaults and retained runtime publication stay unchanged.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/render-upload-research.yml'
      - 'tools/render_upload/**'
      - 'godot/scripts/main.gd'
      - 'godot/scripts/render_upload*'
      - 'godot/shaders/render_upload_copy.gdshader'
      - 'godot/tests/*render_upload*'
      - 'godot/tests/support/render_upload_profile_host.gd'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: render-upload-research-${{ github.run_id }}
  cancel-in-progress: false

env:
  GODOT_SILENCE_ROOT_WARNING: '1'
  PYTHONUTF8: '1'
  CYBERSAND_CI_WATCHDOG_SCALE: '1'

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux OpenGL / ${{ matrix.group }} / correctness and paired ABBA
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/render-upload-001') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/render-upload-001'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - group: sparse
            cases: sparse_512_w1,sparse_1024_w1,sparse_2048_w1,repeated_2048_w1,regions_2048_w1
          - group: dense-authoring
            cases: dense_2048_w1,full_2048_w1,coverage_2048_w1,manual_2048_w1,burst_2048_w1
          - group: active
            cases: active_512_w1,active_512_w4,active_2048_w1,active_2048_w4,dormant_2048_w1
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      GALLIVM_PERF: nopt
      RESEARCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RESEARCH_GROUP: ${{ matrix.group }}
      RESEARCH_CASES: ${{ matrix.cases }}
    steps:
      - name: Check out the exact research head without unrelated LFS platforms
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RESEARCH_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - name: Materialize retained Linux native and Rapier runtimes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RESEARCH_SOURCE_SHA"
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m unittest discover -s tools/render_upload -p 'test_*.py'
      - name: Authenticate pinned Godot and prepare the software OpenGL display
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 --output "$RUNNER_TEMP/render-upload-godot-linux.zip" 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
          echo '0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  '"$RUNNER_TEMP/render-upload-godot-linux.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/render-upload-godot-linux"
          unzip -tq "$RUNNER_TEMP/render-upload-godot-linux.zip"
          unzip -q "$RUNNER_TEMP/render-upload-godot-linux.zip" -d "$RUNNER_TEMP/render-upload-godot-linux"
          chmod +x "$RUNNER_TEMP/render-upload-godot-linux/Godot_v4.7-stable_linux.x86_64"
          bash tools/ci/prepare_linux_display.sh
      - name: Qualify mounted candidate integration before expensive timing
        if: matrix.group == 'dense-authoring'
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' python3 tools/render_upload/run_regressions.py --godot "$RUNNER_TEMP/render-upload-godot-linux/Godot_v4.7-stable_linux.x86_64" --rendering-driver opengl3 --source-sha "$RESEARCH_SOURCE_SHA" --output "build/render-upload-linux-$RESEARCH_GROUP/integration" --cache-root "$RUNNER_TEMP/render-upload-integration-userdata"
      - name: Execute source-matched correctness and sequential same-host ABBA twice
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' python3 tools/render_upload/run_campaign.py --godot "$RUNNER_TEMP/render-upload-godot-linux/Godot_v4.7-stable_linux.x86_64" --source-sha "$RESEARCH_SOURCE_SHA" --output "build/render-upload-linux-$RESEARCH_GROUP" --cache-root "$RUNNER_TEMP/render-upload-userdata" --cases "$RESEARCH_CASES" --frames 240 --warmup 30 --rounds 2
      - name: Retain raw observations, identities and original failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-upload-linux-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/render-upload-linux-${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 90

  windows:
    name: Windows ANGLE / ${{ matrix.group }} / correctness and paired ABBA
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/render-upload-001') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/render-upload-001'))
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - group: sparse
            cases: sparse_512_w1,sparse_1024_w1,sparse_2048_w1,repeated_2048_w1,regions_2048_w1
          - group: dense-authoring
            cases: dense_2048_w1,full_2048_w1,coverage_2048_w1,manual_2048_w1,burst_2048_w1
          - group: active
            cases: active_512_w1,active_512_w4,active_2048_w1,active_2048_w4,dormant_2048_w1
    env:
      RESEARCH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RESEARCH_GROUP: ${{ matrix.group }}
      RESEARCH_CASES: ${{ matrix.cases }}
    steps:
      - name: Check out the exact research head without unrelated LFS platforms
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RESEARCH_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize retained Windows native and Rapier runtimes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RESEARCH_SOURCE_SHA"
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          python tools/ci/check_ci_provider_policy.py
          python -m unittest discover -s tools/render_upload -p 'test_*.py'
      - name: Authenticate the pinned Windows archive and actual sibling engine
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 --output "$RUNNER_TEMP/render-upload-godot-windows.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          python - <<'PYCODE'
          import os, pathlib, sys
          sys.path.insert(0, 'tools/ci')
          from run_windows_godot_regressions import prepare_godot
          prepare_godot(pathlib.Path(os.environ['RUNNER_TEMP']) / 'render-upload-godot-windows.zip')
          PYCODE
      - name: Qualify mounted candidate integration before expensive timing
        if: matrix.group == 'dense-authoring'
        run: |
          set -euo pipefail
          python tools/render_upload/run_regressions.py --godot "$RUNNER_TEMP/render-upload-godot-windows/Godot_v4.7-stable_win64_console.exe" --rendering-driver opengl3_angle --source-sha "$RESEARCH_SOURCE_SHA" --output "build/render-upload-windows-$RESEARCH_GROUP/integration" --cache-root "$RUNNER_TEMP/render-upload-integration-userdata"
      - name: Execute source-matched correctness and sequential same-host ABBA twice
        run: |
          set -euo pipefail
          python tools/render_upload/run_campaign.py --godot "$RUNNER_TEMP/render-upload-godot-windows/Godot_v4.7-stable_win64_console.exe" --rendering-driver opengl3_angle --source-sha "$RESEARCH_SOURCE_SHA" --output "build/render-upload-windows-$RESEARCH_GROUP" --cache-root "$RUNNER_TEMP/render-upload-userdata" --cases "$RESEARCH_CASES" --frames 240 --warmup 30 --rounds 2
      - name: Retain raw observations, identities and original failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: render-upload-windows-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/render-upload-windows-${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 90
