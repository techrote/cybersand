name: RENDER-ACK-002 portable Windows owner evaluation (Draft/HOLD)

# Packaging-only follow-up; uses qualified source, never merges or changes defaults.
on:
  push:
    branches:
      - research/render-ack-pacing-002
    paths:
      - '.github/workflows/render-ack-evaluation-windows.yml'
      - 'tools/render_ack/package_windows_eval.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-ack-002-windows-evaluation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package and smoke exact-source Windows owner ZIP
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/research/render-ack-pacing-002'
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
      QUALIFIED_SOURCE: c2ec5a92fa7b3e1553361579b3b34b27176753c4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify immutable application and materialize signed Windows native/Rapier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$QUALIFIED_SOURCE" HEAD
          git diff --exit-code "$QUALIFIED_SOURCE" HEAD -- godot examples/worldgen native third_party
          git lfs install --local
          git lfs pull --include='godot/**,examples/worldgen/**' --exclude=''
          python tools/render_ack/analyze_trace.py --self-test

      - name: Download official pinned Godot 4.7 Windows runtime and license notices
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/render-ack-notices"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            --output "$RUNNER_TEMP/render-ack-godot.zip" \
            'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 120 \
            --output "$RUNNER_TEMP/render-ack-notices/LICENSE.txt" \
            'https://raw.githubusercontent.com/godotengine/godot/4.7-stable/LICENSE.txt'
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 120 \
            --output "$RUNNER_TEMP/render-ack-notices/COPYRIGHT.txt" \
            'https://raw.githubusercontent.com/godotengine/godot/4.7-stable/COPYRIGHT.txt'

      - name: Package exact-qualified source and execute clean staged app smoke
        run: |
          set -euo pipefail
          python tools/render_ack/package_windows_eval.py \
            --source-sha "$QUALIFIED_SOURCE" \
            --godot-archive "$RUNNER_TEMP/render-ack-godot.zip" \
            --godot-notices "$RUNNER_TEMP/render-ack-notices" \
            --output "build/render-ack-evaluation/CyberSand-RENDER-ACK-002-Windows-c2ec5a92.zip" \
            --evidence "build/render-ack-evaluation/evidence"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/render-ack-evaluation/evidence/packaging-receipt.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['source'] == 'c2ec5a92fa7b3e1553361579b3b34b27176753c4'
          assert r['status'] == 'passed' and all(c['ok'] for c in r['smoke'].values())
          print("PACKAGE_CANDIDATE_QUALIFIED", json.dumps({
            "zip":r["zip"],"sha256":r["zip_sha256"],
            "bytes":r["zip_bytes"],"source":r["source"]},sort_keys=True))
          PY

      - name: Upload portable ZIP and exact-source build/launch receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CyberSand-RENDER-ACK-002-Windows-c2ec5a92-${{ github.run_id }}
          path: |
            build/render-ack-evaluation/CyberSand-RENDER-ACK-002-Windows-c2ec5a92.zip
            build/render-ack-evaluation/evidence/packaging-receipt.json
            build/render-ack-evaluation/evidence/packaging-error.txt
            build/render-ack-evaluation/evidence/smoke-*.log
          if-no-files-found: warn
          retention-days: 90
