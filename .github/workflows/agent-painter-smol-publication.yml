name: Smol painter existing-evidence publication
on:
  push:
    branches: [codex/agent-painter-smol-568]
    paths: ['experiments/agent_painter/lanes/smol/publication-request.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-painter-smol-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publication:
    name: Verify original Smol evidence and publish with separate publisher identity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: publisher
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PRODUCER_SOURCE: fef6654ecd0828f765af1a13d2d10469013a3ea6
      PRODUCER_RUN: '43522896533'
      PRODUCER_ATTEMPT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: publisher
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fef6654ecd0828f765af1a13d2d10469013a3ea6
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - name: Establish hosted CPU checkpoint-readback environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../producer rev-parse HEAD)" = "$PRODUCER_SOURCE"
          python3 -m venv "$RUNNER_TEMP/smol-publication"
          "$RUNNER_TEMP/smol-publication/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/smol-publication/bin/python" -m pip install 'Pillow==13.0.0' 'PyYAML==6.0.3' 'jsonschema==4.26.0' 'safetensors==0.8.0' 'numpy==2.5.4'
          "$RUNNER_TEMP/smol-publication/bin/python" -m pip check
      - name: Verify publication repair contracts
        run: |
          set -euo pipefail
          mkdir -p publication-checks
          "$RUNNER_TEMP/smol-publication/bin/python" -m unittest discover -s experiments/agent_painter/lanes/smol/tests -p 'test_*.py' -v 2>&1 | tee publication-checks/lane-tests.log
          "$RUNNER_TEMP/smol-publication/bin/python" -m unittest discover -s experiments/agent_painter/tests -p 'test_training.py' -v 2>&1 | tee publication-checks/training-contracts.log
          python3 tools/ci/check_ci_provider_policy.py > publication-checks/provider.json
          python3 tools/ci/check_ci_scheduling_policy.py --output publication-checks/scheduling.json
      - name: Collect immutable producer artifacts and authoritative job assignments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/smol-publication/bin/python" experiments/agent_painter/lanes/smol/publication.py recover \
            --directory evidence --request experiments/agent_painter/lanes/smol/publication-request.json
      - name: Reverify original checkpoints native cells and gallery without execution
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/smol-publication/bin/python" experiments/agent_painter/lanes/smol/package.py \
            --directory evidence --output release --source-sha "$PRODUCER_SOURCE" \
            --producer-root "$GITHUB_WORKSPACE/producer" --producer-run-id "$PRODUCER_RUN" \
            --producer-run-attempt "$PRODUCER_ATTEMPT" \
            --job-assignments evidence/publication/job-assignments.json \
            --artifact-custody evidence/publication/producer-artifacts.json
      - name: Record verified Actions delivery and preserve release permission failure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path('release/MANIFEST.json').read_text())
          record = {
              'schema': 'smol-publication-delivery-v1',
              'delivery': 'github-actions-artifact', 'github_release_published': False,
              'producer': manifest['producer'], 'publisher': manifest['publisher'],
              'bundle_artifact': f"smol-release-{os.environ['GITHUB_SHA']}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              'gallery_artifact': f"smol-gallery-{os.environ['GITHUB_SHA']}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              'retention_days': 90,
              'preserved_release_failure': {
                  'source_sha': 'e02bfb5d30972d8a1a84f30af7d485f13bb55fc7',
                  'run_id': 43527715072, 'run_attempt': 1,
                  'job_id': 132237491960, 'http_status': 403,
                  'error': 'Resource not accessible by integration',
                  'url': 'https://github.com/techrote/cybersand/actions/runs/43527715072',
                  'verification_before_release_request': 'passed',
              },
              'model_training_or_inference_repeated': False,
              'native_execution_repeated': False,
              'claim_limits': [
                  'Actions evidence is available for 90 days; a public GitHub release was not created.',
                  'Open smol-gallery.html for the paired comparison; extract the native ZIP and open gallery/index.html for receipt/readback links.',
                  'Original PNGs are native material readbacks, not framebuffer screenshots.',
                  'The accepted T network does not fulfill the requested three-branch manifold.',
              ],
          }
          path = Path('release/PUBLICATION.json')
          with path.open('x') as output:
              json.dump(record, output, indent=2, sort_keys=True)
              output.write('\n')
          with Path('release/SHA256SUMS.txt').open('a') as output:
              output.write(hashlib.sha256(path.read_bytes()).hexdigest() + '  PUBLICATION.json\n')
          print(json.dumps({'delivery': record['delivery'], 'github_release_published': False,
                            'bundle_artifact': record['bundle_artifact'], 'retention_days': 90}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smol-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publisher/release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smol-gallery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publisher/release/smol-gallery.html
            publisher/release/smol-native-*.zip
            publisher/release/MANIFEST.json
            publisher/release/SHA256SUMS.txt
            publisher/release/PUBLICATION.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: smol-publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publisher/publication-checks/
            publisher/evidence/publication/
            publisher/release/MANIFEST.json
            publisher/release/SHA256SUMS.txt
            publisher/release/PUBLICATION.json
          if-no-files-found: warn
          retention-days: 90
