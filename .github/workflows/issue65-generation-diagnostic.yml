name: Issue 65 generation diagnostic

on:
  push:
    branches: [codex/issue-65-stage3b-exact-reconstruction]
    paths: [.github/workflows/issue65-generation-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile focused fixture
        run: |
          cat > /tmp/issue65_generation.cpp <<'CPP'
          #include "cybersand/settled_regions.hpp"
          #include <array>
          #include <cstdint>
          #include <iostream>
          #include <span>
          using namespace cybersand::soliding;

          DiscoverySignals quiet() { return {true, true, true, false, false, false}; }
          constexpr DiscoveryCell sand{1, 7, 3, 220, false};
          RegionTileKey key(std::int64_t x, std::int64_t y, std::uint64_t incarnation = 1) {
              return {incarnation, y / 32, x / 32, y / 4, x / 4, y, x};
          }
          template<class Regions, std::size_t N>
          RegionOutcome put(Regions& regions, RegionTileKey tile_key, DiscoveryBounds bounds,
                            std::uint64_t revision, const std::array<DiscoveryCell, N>& cells,
                            std::uint8_t sealed_edges = 0x0f) {
              return regions.upsert({tile_key, bounds, revision, 20, quiet(),
                                     std::span<const DiscoveryCell>{cells}, sealed_edges});
          }
          template<class Regions>
          void dump(const char* tag, const Regions& r, std::size_t step) {
              const auto m=r.metrics();
              std::cout << tag << " step=" << step
                        << " region_count=" << r.region_count()
                        << " pending=" << r.pending_components()
                        << " refusal=" << static_cast<unsigned>(r.last_refusal())
                        << " tickets=" << m.reconstruction_tickets
                        << " restarts=" << m.reconstruction_restarts
                        << " waits=" << m.reconstruction_waits
                        << " service=" << m.reconstruction_service_units
                        << " reclamation=" << m.reclamation_units
                        << " region_refusals=" << m.region_refusals
                        << " resource_generation=" << m.resource_generation
                        << "\n";
          }
          int main() {
              using Regions = SettledRegions<1, 1, 1, 1, 1, 2, 1, 2>;
              const std::array<DiscoveryCell, 1> one{sand};
              Regions regions(29);
              const auto k=key(0,0,29);
              std::cout << "put1=" << static_cast<unsigned>(put(regions,k,{0,0,1,1},1,one)) << "\n";
              for (std::size_t i=0;i<500 && regions.pending_components()!=0;++i) {
                  dump("initial-before",regions,i);
                  const auto used=regions.advance(1);
                  std::cout << "initial-used=" << used << "\n";
                  if (used==0) break;
              }
              dump("initial-after",regions,500);
              auto first=regions.region_at(0);
              if (first) std::cout << "first_generation=" << first->handle.generation << "\n";
              std::cout << "put2=" << static_cast<unsigned>(put(regions,k,{0,0,1,1},2,one)) << "\n";
              dump("replace-start",regions,0);
              for (std::size_t i=0;i<1000 && regions.pending_components()!=0;++i) {
                  const auto used=regions.advance(1);
                  dump("replace-after",regions,i);
                  std::cout << "replace-used=" << used << "\n";
                  if (used==0) break;
              }
              dump("replace-final",regions,1000);
              return 0;
          }
          CPP
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Inative/include -O0 -g3 /tmp/issue65_generation.cpp -o /tmp/issue65_generation
      - name: Run focused fixture
        run: /tmp/issue65_generation
