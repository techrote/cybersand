name: Experimental neighbour cursor focused exactness

on:
  push:
    branches:
      - codex/neighbour-cursor-independent-qualification-20261106
    paths:
      - native/bench/neighbour_cursor_focused.cpp
      - native/bench/run_neighbour_cursor_focused.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neighbour-cursor-focused-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  independent-focused-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source, Python and compiler
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          python3 -m py_compile native/bench/run_neighbour_cursor_focused.py
          g++-13 --version
          python3 tools/ci/check_ci_provider_policy.py
      - name: Exactness across original and candidate, 1/6 workers, ASan/UBSan and TSan
        shell: bash
        run: |
          set -euxo pipefail
          ulimit -c 0
          python3 native/bench/run_neighbour_cursor_focused.py \
            --repo . \
            --out "${RUNNER_TEMP}/neighbour-focused" \
            --baseline 4a80af2a891332176a3912a235582d77d076a185 \
            --candidate "${GITHUB_SHA}" \
            --asan --tsan \
            | tee "${RUNNER_TEMP}/neighbour-focused-summary.log"
      - name: Publish only reproducible inputs, JSON and logs (no runtimes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighbour-cursor-focused-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/neighbour-focused-summary.log
            ${{ runner.temp }}/neighbour-focused/*.json
            ${{ runner.temp }}/neighbour-focused/*.log
            ${{ runner.temp }}/neighbour-focused/replay/*.json
            ${{ runner.temp }}/neighbour-focused/replay/*.log
            ${{ runner.temp }}/neighbour-focused/sanitizers/*.json
            ${{ runner.temp }}/neighbour-focused/sanitizers/*.log
