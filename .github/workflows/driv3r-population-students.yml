name: DRIV3R CPU sequence-student distillation (P10)
on:
  push:
    branches:
      - research/570-population-game-policy-001
    paths:
      - 'experiments/driv3r/training/population/**'
      - '.github/workflows/driv3r-population-students.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p10-sequence-students:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU-only model-side dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run P10 host-action and student-distillation guardrails
        run: python -m unittest discover -s experiments/driv3r/training/population -p test_population_p10.py -v
      - name: Prepare source-pinned P0 teacher checkpoints (external synthetic host)
        run: |
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          python experiments/driv3r/training/population/population_lab.py \
            --output /tmp/population-p10-teachers --seed 619 --population 3 \
            --train-episodes 36 --selection-episodes 8 --test-episodes 12
      - name: Train three independent student cohorts and preserve negative controls
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          mkdir -p /tmp/population-p10-evidence
          for cohort in 643 644 645; do
            python experiments/driv3r/training/population/population_p10.py \
              --p0-output /tmp/population-p10-teachers \
              --output "/tmp/population-p10-evidence/p10_${cohort}" \
              --seed "${cohort}" --train-worlds 24 --validation-worlds 6 \
              --heldout-worlds 8 --epochs 6 --teacher-variants 3 \
              --width 40 --horizon 40
          done
      - name: Preserve exact source, environment and SHA-256 manifest
        if: always()
        run: |
          mkdir -p /tmp/population-p10-evidence/source
          cp experiments/driv3r/training/population/population_p10.py /tmp/population-p10-evidence/source/
          cp experiments/driv3r/training/population/test_population_p10.py /tmp/population-p10-evidence/source/
          cp experiments/driv3r/training/population/population_lab.py /tmp/population-p10-evidence/source/
          cp experiments/driv3r/training/population/population_p1.py /tmp/population-p10-evidence/source/
          git rev-parse HEAD > /tmp/population-p10-evidence/source-commit.txt
          python -m pip freeze > /tmp/population-p10-evidence/python-versions.txt
          (cd /tmp/population-p10-evidence && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/population-p10-sha256.txt
      - name: Upload immutable candidate checkpoints and original trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-p10-sequence-student-evidence
          path: |
            /tmp/population-p10-evidence
            /tmp/population-p10-sha256.txt
          retention-days: 14
          if-no-files-found: warn
