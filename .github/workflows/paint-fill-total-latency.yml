name: SCRIPT-HOTPATH-LATENCY-001 full source-to-rendered-fill A/B

# Measurement-only experimental workflow. No production code promotion or merge.
on:
  push:
    branches: [exp/script-hotpath-end-to-end-latency-001]
    paths:
      - ".github/workflows/paint-fill-total-latency.yml"
      - "godot/tests/bench_paint_fill_total_latency.gd"
      - "godot/scripts/workbench_paint_editor_controller.gd"
      - "tools/ci/qualify_paint_fill_total_latency.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paint-fill-total-latency-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    name: Rendered mounted Workbench ABBA ${{ matrix.scenario }}
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/exp/script-hotpath-end-to-end-latency-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [16k, 65k, 262k]
    env:
      GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
      GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
      CYBERSAND_SHA256: 81dd101064d4baf64a9c93c03d74aff09d2e65bdc9594ffc7643fee6444bb554
      RAPIER_SHA256: 566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a
      PYTHONUTF8: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - name: Checkout exact source without all large LFS payloads
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 0
      - name: Restore source-matched Linux CyberSand and pinned Rapier
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" --exclude=""
          echo "$CYBERSAND_SHA256  godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so" | sha256sum --check --strict
          echo "$RAPIER_SHA256  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | sha256sum --check --strict
          mkdir -p build
          python3 tools/ci/check_repository.py --json build/paint-latency-repository-check.json
      - name: Restore official Godot 4.7 with archive pin
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 60 --max-time 600 \
            --output "$RUNNER_TEMP/godot-linux.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot-linux.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot-linux.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = "4.7.stable.official.5b4e0cb0f"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import mounted Workbench project and establish X11
        timeout-minutes: 12
        run: |
          set -euo pipefail
          timeout 240 "$GODOT_BIN" --headless --editor --path godot --import
          bash tools/ci/prepare_linux_display.sh
      - name: Run four source-matched native and four script full-fill trials
        timeout-minutes: 65
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' \
            timeout 62m python3 tools/ci/qualify_paint_fill_total_latency.py \
              --godot "$GODOT_BIN" \
              --scenario "${{ matrix.scenario }}" \
              --expected-source "$GITHUB_SHA" \
              --output "build/paint-fill-total-${{ matrix.scenario }}"
      - name: Retain all A/B timing JSON and raw mounted Workbench logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paint-fill-total-${{ matrix.scenario }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/paint-fill-total-${{ matrix.scenario }}/qualification.json
            build/paint-fill-total-${{ matrix.scenario }}/run-*.log
            build/paint-latency-repository-check.json
          if-no-files-found: warn
          retention-days: 90
