name: PLAY desktop manual packet identity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/play/*manual_packet.py'
      - 'tools/ci/check_repository.py'
      - 'tools/ci/execution_policy.py'
      - 'godot/tests/support/ci_execution_policy.json'
      - 'docs/operations/play-desktop-manual-qualification.md'
      - '.github/workflows/play-desktop-packet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-desktop-packet-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PACKET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: ${{ github.workspace }}/evidence-play-desktop
  PYTHONUTF8: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      metadata_minutes: ${{ steps.plan.outputs.metadata_minutes }}
      source_checkout_minutes: ${{ steps.plan.outputs.source_checkout_minutes }}
      controls_minutes: ${{ steps.plan.outputs.controls_minutes }}
      dependency_minutes: ${{ steps.plan.outputs.dependency_minutes }}
      engine_minutes: ${{ steps.plan.outputs.engine_minutes }}
      packet_minutes: ${{ steps.plan.outputs.packet_minutes }}
      setup_minutes: ${{ steps.plan.outputs.setup_minutes }}
      artifact_minutes: ${{ steps.plan.outputs.artifact_minutes }}
      job_minutes: ${{ steps.plan.outputs.job_minutes }}
    steps:
      - name: Check out exact planning source
        timeout-minutes: 5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PACKET_SHA }}
          persist-credentials: false
      - name: Select Python for budget planning
        timeout-minutes: 5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Derive the complete source policy budget
        timeout-minutes: 5
        id: plan
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0, 'tools/play')
          import create_manual_packet as packet
          result = packet.budgets()
          print(json.dumps(result, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name, value in result.items():
                  output.write(name + '=' + str(value) + '\n')
          PYCODE

  linux:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.job_minutes) }}
    defaults:
      run:
        shell: bash
        working-directory: workspace/source
    steps:
      - name: Check out pinned companion documentation
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.setup_minutes) }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6a58311982941b75f46e22109a0829e5acb83c7e
          path: workspace
          persist-credentials: false
      - name: Check out exact source and all retained runtime objects
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.source_checkout_minutes) }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PACKET_SHA }}
          path: workspace/source
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Select Python
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.setup_minutes) }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact source identity
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.metadata_minutes) }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/play')
          import create_manual_packet as packet
          with packet.metadata_budget():
              source = packet.clean_identity(Path.cwd(), os.environ['PACKET_SHA'])
          output = Path(os.environ['EVIDENCE_DIR'])
          (output / 'source-sha.txt').write_text(source['commit'] + '\n')
          (output / 'source-tree.txt').write_text(source['tree'] + '\n')
          PYCODE
      - name: Run original adverse packet controls
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.controls_minutes) }}
        run: |
          set -euo pipefail
          python tools/ci/check_ci_provider_policy.py | tee "$EVIDENCE_DIR/provider.json"
          python tools/play/test_manual_packet.py 2>&1 | tee "$EVIDENCE_DIR/contracts.log"
          python -O tools/play/test_manual_packet.py 2>&1 | tee "$EVIDENCE_DIR/contracts-optimized.log"
      - name: Verify every retained LFS object
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.dependency_minutes) }}
        run: |
          set -euo pipefail
          git lfs fsck 2>&1 | tee "$EVIDENCE_DIR/lfs-fsck.log"
      - name: Authenticate and extract pinned engine without executing it
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.engine_minutes) }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            url='https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          else
            url='https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
          fi
          download_seconds="$(python -c 'import sys; sys.path.insert(0, "tools/ci"); from execution_policy import watchdog_seconds; print(watchdog_seconds("dependency_prepare_seconds"))')"
          curl --fail --location --connect-timeout 60 --max-time "$download_seconds" --output "$RUNNER_TEMP/manual-godot.zip" "$url"
          python - <<'PYCODE'
          import hashlib, json, os, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools/play')
          sys.path.insert(0, 'tools/ci')
          from create_manual_packet import require
          import run_windows_godot_regressions as windows
          archive = Path(os.environ['RUNNER_TEMP']) / 'manual-godot.zip'
          if os.environ['RUNNER_OS'] == 'Windows':
              algorithm, pin = 'sha512', windows.GODOT_SHA512
              members = ('Godot_v4.7-stable_win64.exe', 'Godot_v4.7-stable_win64_console.exe')
          else:
              lock = json.loads(Path('third_party/godot-runtime.lock.json').read_text())
              require(archive.stat().st_size == lock['editor']['size'], 'Linux archive size mismatch')
              algorithm, pin = 'sha256', lock['editor']['sha256']
              members = ('Godot_v4.7-stable_linux.x86_64',)
          require(hashlib.new(algorithm, archive.read_bytes()).hexdigest() == pin, 'Official engine archive mismatch')
          directory = archive.with_suffix('')
          with zipfile.ZipFile(archive) as bundle:
              require(bundle.testzip() is None, 'Engine archive CRC failure')
              for member in members:
                  require(bundle.namelist().count(member) == 1, 'Missing or duplicate engine member')
                  bundle.extract(member, directory)
          if os.environ['RUNNER_OS'] != 'Windows':
              (directory / members[0]).chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('PACKET_GODOT=' + str(directory / members[0]) + '\n')
          print('Pinned archive verified and exact members extracted. No engine was executed.')
          PYCODE
      - name: Create actual-host identity packet
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.packet_minutes) }}
        run: |
          set -euo pipefail
          python tools/play/create_manual_packet.py --expected-sha "$PACKET_SHA" \
            --godot "$PACKET_GODOT" --godot-archive "$RUNNER_TEMP/manual-godot.zip" \
            --output "$EVIDENCE_DIR/packet" 2>&1 | tee "$EVIDENCE_DIR/create.log"
      - name: Independently reverify the original identity packet
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.packet_minutes) }}
        run: |
          set -euo pipefail
          python tools/play/create_manual_packet.py --verify-packet "$EVIDENCE_DIR/packet" \
            2>&1 | tee "$EVIDENCE_DIR/reverify.log"
      - name: Preserve final clean source observation
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.metadata_minutes) }}
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all > "$EVIDENCE_DIR/source-status-after.txt"
          test ! -s "$EVIDENCE_DIR/source-status-after.txt"
      - name: Retain original identity checks and untested manual sheet
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.artifact_minutes) }}
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: play-desktop-packet-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-play-desktop/
          if-no-files-found: error
          retention-days: 90

  windows:
