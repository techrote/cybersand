name: EXPLORE-001 Windows source-equivalent corrected-script replay
on:
  push:
    branches: [feat/explore001-gen007-playable-workbench]
    paths: ['.github/workflows/explore001-windows-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: explore001-windows-replay-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  windows-real-host:
    name: Frozen Windows DLL + independently matched production inputs + current script
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PREBUILT_SOURCE: 32aee91a76a44275e1f9a0d403728489042e980c
      SOURCE_BUILD_RUN: '42438795051'
    steps:
      - name: Check out complete candidate ancestry to verify compiler source identity
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Attest identical production source compared with the previously built DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $current = (git rev-parse HEAD).Trim()
          $current | Set-Content evidence/current-head.txt
          $prebuilt = $env:PREBUILT_SOURCE
          if ((git merge-base $prebuilt $current).Trim() -ne $prebuilt) { throw 'Original compiled source is not an ancestor' }
          $diffs = @(git diff --name-only "$prebuilt" "$current")
          $diffs | Set-Content evidence/source-differences.txt
          $allowed = @(
            '.github/workflows/explore001-qualification.yml',
            '.github/workflows/explore001-windows-replay.yml',
            'godot/tests/test_explore001_generated_workbench.gd',
            'godot/tests/test_explore001_admission_probe.gd',
            'godot/scripts/workbench_generator_dialog.gd',
            'godot/scripts/workbench_generated_map.gd',
            'godot/tests/test_explore001_reopen_diagnostic.gd'
          )
          foreach ($path in $diffs) {
            if ($path -notin $allowed) { throw "Production source changed since pinned DLL build: $path" }
          }
          if ('godot/tests/test_explore001_reopen_diagnostic.gd' -notin $diffs) { throw 'Expected fresh-process identity diagnosis is absent' }
          "PREBUILT_NATIVE_SOURCE=$prebuilt" | Set-Content evidence/source-matched-proof.txt
          "CURRENT_TEST_SOURCE=$current" | Add-Content evidence/source-matched-proof.txt
          "Only test and independent CI source differences admitted" | Add-Content evidence/source-matched-proof.txt
      - name: Retrieve previous same-repo authenticated source-built DLL artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: explore001-win-runtime-42438795051
          run-id: 42438795051
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: build/windows-source-runtime
      - name: Check original build identity, install DLL and pinned Rapier
        shell: pwsh
        run: |
          $original = (Get-Content 'build/windows-source-runtime/source-commit.txt').Trim()
          if ($original -ne $env:PREBUILT_SOURCE) { throw 'Downloaded DLL built from wrong source' }
          $dll = 'build/windows-source-runtime/cybersand_native.windows.x86_64.dll'
          if (!(Test-Path $dll)) { throw 'Compiled DLL is absent' }
          $digest = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $digest | Set-Content evidence/native-dll-sha256.txt
          if (!(Select-String -Path 'build/windows-source-runtime/native-dll.sha256' -Pattern $digest -SimpleMatch)) { throw 'Compiled DLL hash does not match source artifact' }
          Copy-Item $dll 'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll' -Force
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          $rapier='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'
          if ((Get-FileHash $rapier -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7') { throw 'Rapier hash mismatch' }
      - name: Fetch source-pinned Godot 4.7 and import the corrected current script
        shell: pwsh
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'Godot_v4.7-stable_win64.exe.zip'
          curl.exe -fL --retry 3 -o $zip 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Godot acquisition refused' }
          $sha='41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9'
          if ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant() -ne $sha) { throw 'Godot binary does not match pin' }
          $dir=Join-Path $env:RUNNER_TEMP 'godot-explore'
          Expand-Archive -Path $zip -DestinationPath $dir
          $exe=Join-Path $dir 'Godot_v4.7-stable_win64_console.exe'
          if (!(Test-Path $exe)) { throw 'Godot console binary missing' }
          (& $exe --version) | Set-Content evidence/godot-version.txt
          if (((Get-Content evidence/godot-version.txt) -join ' ') -notmatch '4.7.stable.official.5b4e0cb0f') { throw 'Unexpected Godot engine version' }
          'GODOT_EXE=' + $exe | Out-File -Append -FilePath $env:GITHUB_ENV
          & $exe --headless --path godot --editor --quit *> evidence/import.log
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/import.log -Tail 160; throw 'Current script import rejected' }
      - name: Execute bounded diagnostic to locate exact native World-admission checkpoint
        shell: pwsh
        run: |
          $stdout = 'evidence/admission-probe.stdout.log'
          $stderr = 'evidence/admission-probe.stderr.log'
          $args = @('--headless','--path','godot','--script','res://tests/test_explore001_admission_probe.gd')
          $child = Start-Process -FilePath $env:GODOT_EXE -ArgumentList $args -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            if (!$child.WaitForExit(150000)) {
              Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue
              Get-Content $stdout -Tail 120 -ErrorAction SilentlyContinue
              Get-Content $stderr -Tail 120 -ErrorAction SilentlyContinue
              throw 'Admission probe exceeded 150-second external process watchdog'
            }
            $child.Refresh()
            Get-Content $stdout -Tail 120 -ErrorAction SilentlyContinue
            Get-Content $stderr -Tail 120 -ErrorAction SilentlyContinue
            if ($child.ExitCode -ne 0) { throw "Admission probe failed with exit code $($child.ExitCode)" }
          } finally {
            if (!$child.HasExited) { Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Prepare a fresh starting map and inspect exact saved-vs-regenerated source identity
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --path godot --script res://tests/test_explore001_generated_workbench.gd > evidence/source-first.stdout.log 2> evidence/source-first.stderr.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content evidence/source-first.stdout.log -Tail 130
            Get-Content evidence/source-first.stderr.log -Tail 130
            throw 'Initial source-attested generated map did not complete'
          }
          if (!(Select-String evidence/source-first.stdout.log -Pattern 'EXPLORE001_RESULTS checks=55 failures=0')) {
            throw 'Initial source process did not complete the 55-assertion control'
          }
          & $env:GODOT_EXE --headless --path godot --script res://tests/test_explore001_reopen_diagnostic.gd *> evidence/reopen-diagnostic.log
          Get-Content evidence/reopen-diagnostic.log -Tail 65
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-process identity diagnostic failed to execute' }
          if (!(Select-String evidence/reopen-diagnostic.log -Pattern 'EXPLORE_REOPEN_PROBE_RESULT')) {
            throw 'Fresh-process identity diagnostic did not report its source comparison'
          }
      - name: Execute source-attested real native World with authored edits and fresh process
        shell: pwsh
        run: |
          $env:CYBERSAND_EXPLORE_REOPEN = ''
          & $env:GODOT_EXE --headless --path godot --script res://tests/test_explore001_generated_workbench.gd *> evidence/actual-new.log
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/actual-new.log -Tail 170; throw 'Corrected Windows generated start failed' }
          $env:CYBERSAND_EXPLORE_REOPEN = '1'
          & $env:GODOT_EXE --headless --path godot --script res://tests/test_explore001_generated_workbench.gd *> evidence/actual-reopened.log
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/actual-reopened.log -Tail 170; throw 'Fresh-process restored Windows map failed' }
          Remove-Item Env:CYBERSAND_EXPLORE_REOPEN
          Select-String -Path evidence/actual-new.log,evidence/actual-reopened.log -Pattern 'EXPLORE001_RESULTS'
      - name: Retain original Windows source proof and every actual-process failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: explore001-windows-corrected-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
