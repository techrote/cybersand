name: MZ-007 GRU-19M trained game-policy research (no game edits)
on:
  push:
    branches:
      - 'research/model-zoo-gru-game-mz007'
    paths:
      - 'experiments/driv3r/model_zoo/gru_game/**'
      - '.github/workflows/driv3r-model-zoo-gru-game.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mz007-gru-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  gru-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pillow==11.3.0'
          python -m pip freeze > "$RUNNER_TEMP/mz007-resolved-packages.txt"
      - name: Verify inherited external game contract and new recurrent architecture
        run: |
          python -m unittest -v experiments.driv3r.model_zoo.mamba130.test_world
          python -m unittest -v experiments.driv3r.model_zoo.mamba130.test_counterfactual
          python -m unittest -v experiments.driv3r.model_zoo.gru_game.test_gru_game
      - name: Real source-seeded 19M recurrent training plus matched small policy
        run: |
          python -m experiments.driv3r.model_zoo.gru_game.run \
            --out "$RUNNER_TEMP/mz007-gru" \
            --train-seeds 120 --dev-seeds 8 --steps 10 \
            --updates 600 --batch-size 64 --eval-batch 8 --rollout-steps 20
      - name: Verify exact-source checkpoint, real training, goal swaps, and original traces
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'mz007-gru'
          r = json.loads((p/'results.json').read_text())
          assert r['schema'] == 'MZ007-GRU19M-GAME-v1'
          assert r['source_sha'] == os.environ['GITHUB_SHA']
          assert 18_000_000 <= r['parameters'] <= 22_000_000
          assert r['trainable_parameters'] == r['parameters']
          assert r['updates'] == 600 and r['sequence_length'] == 4
          assert len(r['losses']['gru']) == len(r['losses']['structured']) == 600
          assert r['train_examples'] > 2500 and r['dev_examples'] > 100
          assert r['scores']['gru']['test']['paired']['changed_target_pairs'] > 50
          assert all(k in r['scores'] for k in
                     ('gru', 'gru_no_history', 'structured', 'majority'))
          assert len(r['traces']) == 16 and all(t['turns'] > 0 for t in r['traces'])
          ck = p/'gru19m_game_policy.pt'
          assert ck.stat().st_size > 40_000_000
          assert hashlib.sha256(ck.read_bytes()).hexdigest() == r['checkpoint_sha256']
          import torch
          from experiments.driv3r.model_zoo.gru_game.run import (
              make_network, make_control, observations)
          from experiments.driv3r.model_zoo.mamba130.counterfactual import samples
          from experiments.driv3r.model_zoo.mamba130.run_counterfactual import measure
          saved = torch.load(ck, map_location='cpu', weights_only=True)
          assert saved['schema'] == r['schema'] and saved['source_sha'] == r['source_sha']
          assert saved['updates'] == r['updates']
          torch.set_num_threads(2)
          net = make_network(torch)
          net.load_state_dict(saved['recurrent_weights'], strict=True)
          net.eval()
          baseline = make_control(torch)
          baseline.load_state_dict(saved['structured_control'], strict=True)
          baseline.eval()
          rows = samples(range(1200, 1208), 10)
          features = torch.tensor(observations(rows), dtype=torch.float32)
          with torch.inference_mode():
              n = net(features).argmax(-1).tolist()
              b = baseline(features[:, -1, :]).argmax(-1).tolist()
          assert measure(rows, n) == r['scores']['gru']['test']
          assert measure(rows, b) == r['scores']['structured']['test']
          from PIL import Image
          with Image.open(p/'rollouts.png') as im: im.verify()
          PY
      - name: Preserve original model, metrics and trajectory/gallery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mz007-gru-${{ github.sha }}
          path: ${{ runner.temp }}/mz007-gru/**
          if-no-files-found: warn
          retention-days: 14
