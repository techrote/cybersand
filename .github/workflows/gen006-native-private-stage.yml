name: GEN006 private native bundle stage (experimental)

on:
  push:
    branches:
      - experiment/gen006-native-private-stage-20261105
    paths:
      - native/tests/test_gen006_private_bundle_stage.cpp
      - .github/workflows/gen006-native-private-stage.yml
      - docs/audits/2026-11-05-gen006-native-private-stage.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen006-native-private-stage
  cancel-in-progress: false

jobs:
  linux-real-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Record source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gen006-private-stage
          git rev-parse HEAD | tee build/gen006-private-stage/source-sha.txt
          git rev-parse HEAD^{tree} | tee build/gen006-private-stage/source-tree.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          g++-13 --version | head -n 1 | tee build/gen006-private-stage/compiler.txt
          python3 tools/ci/check_ci_provider_policy.py 2>&1 | tee build/gen006-private-stage/provider-policy.log
      - name: Compile actual production World with independent probe
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          timeout 840s g++-13 -std=c++20 -O0 -g1 -pthread \
            -Wall -Wextra -Wpedantic -I native/include \
            native/src/world.cpp native/src/material_rules.cpp \
            native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp \
            native/tests/test_gen006_private_bundle_stage.cpp \
            -o build/gen006-private-stage/probe 2>&1 | tee build/gen006-private-stage/compile.log
      - name: Execute bounded native refusal and continuation controls
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 240s build/gen006-private-stage/probe 2>&1 | tee build/gen006-private-stage/observations.txt
          grep -q 'GEN006_PRIVATE_STAGE_PASS' build/gen006-private-stage/observations.txt
          test "$(grep -c 'result=PASS' build/gen006-private-stage/observations.txt)" = 2
      - name: Preserve original negative or positive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen006-private-stage-native
          path: |
            build/gen006-private-stage/source-sha.txt
            build/gen006-private-stage/source-tree.txt
            build/gen006-private-stage/compiler.txt
            build/gen006-private-stage/provider-policy.log
            build/gen006-private-stage/compile.log
            build/gen006-private-stage/observations.txt
          if-no-files-found: warn
          retention-days: 45
