name: MAT-002 bounded phase workbench
on:
  push:
    branches: [mat/phase-quantity-quench]
    paths: [.github/workflows/mat002-workbench.yml]
permissions:
  contents: read
concurrency:
  group: mat002-workbench
  cancel-in-progress: false
jobs:
  integration:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/mat/phase-quantity-quench'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: workspace/source
    steps:
      - name: Check out exact companion documentation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6a58311982941b75f46e22109a0829e5acb83c7e
          path: workspace
          persist-credentials: false
      - name: Check out the guarded integration source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: workspace/source
          fetch-depth: 0
          persist-credentials: true
      - name: Verify the qualified native core is unchanged
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/mat/phase-quantity-quench
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code dd4f6ca01d4bf29d009d62f3142531bef99ed474 HEAD -- native Makefile godot/native_extension
          git diff --exit-code
          mkdir -p build/mat002
      - name: Integrate exact adapter and documentation changes
        run: |
          set -euo pipefail
          python3 -m py_compile .github/mat002_finish.py
          python3 .github/mat002_finish.py
          git diff --check
          git diff --stat
      - name: Validate current docs, historical integrity and retrieval routes
        run: |
          set -euo pipefail
          timeout 1m python3 tools/ci/check_ci_provider_policy.py
          timeout 5m python3 tools/ci/check_docs.py 2>&1 | tee build/mat002/docs.log
          timeout 5m python3 tools/ci/check_m11_consistency.py 2>&1 | tee build/mat002/historical.log
          timeout 2m python3 tools/docs/retrieval_eval.py --output build/mat002/frozen.json
          timeout 2m python3 tools/docs/retrieval_eval.py --queries docs/reference/retrieval-challenges.json --output build/mat002/challenges.json
          python3 tools/ci/test_godot_regression_sharding.py
      - name: Preserve the implementation for exact-source runtime qualification
        run: |
          set -euo pipefail
          git rm -- .github/mat002_finish.py
          python3 - <<'PY'
          import subprocess
          allowed = {'godot/native_extension/cyber_native_cell_world.cpp', '.github/mat002_finish.py',
                     'docs/systems/water-design.md', 'docs/systems/materials-and-rule-kernels.md',
                     'docs/systems/intermaterial-interactions.md', 'docs/reference/level-saves-and-replay.md',
                     'docs/architecture/chunk-tile-and-buffer-model.md', 'docs/reference/status-and-roadmap.md',
                     'docs/operations/cybersand-codex-development-handover.md', 'docs/README.md',
                     'docs/reference/retrieval-index.md', 'docs/reference/retrieval-corpus.json',
                     'docs/reference/retrieval-challenges.json', 'docs/audits/2026-10-18-mat002-phase-quantity.md'}
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          # The new audit is not yet tracked; do not pick up arbitrary untracked files.
          if changed != allowed - {'docs/audits/2026-10-18-mat002-phase-quantity.md'}:
              raise SystemExit('Unexpected tracked integration write set: ' + repr(changed))
          for path in sorted(allowed - {'.github/mat002_finish.py'}):
              subprocess.run(['git', 'add', '--', path], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mat002): reject invalid adapter state and document phase contracts' -m 'Preflight material-local byte domains, record tested native phase quantities and versioned interaction semantics, and preserve runtime/save qualification as separate gates. Refs #160.'
          test "$(git show -s --format=%P HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/mat/phase-quantity-quench
          git rev-parse HEAD | tee build/mat002/source-commit.txt
      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat002-integration-${{ github.run_id }}
          path: workspace/source/build/mat002/
          if-no-files-found: warn
          retention-days: 30
