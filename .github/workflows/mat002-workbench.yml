name: MAT-002 bounded phase workbench
on:
  push:
    branches: [mat/phase-quantity-quench]
    paths: [.github/workflows/mat002-workbench.yml]
permissions:
  contents: read
concurrency:
  group: mat002-workbench
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/mat/phase-quantity-quench'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Guard source and branch ownership
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/mat/phase-quantity-quench
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code ec05d7227885bda59bf72a5889b004296b9a07e5 HEAD -- native/src native/include godot Makefile
          git diff --exit-code
          mkdir -p build/mat002
          g++-13 --version | head -1
      - name: Apply the exact reviewed source transformation
        run: |
          set -euo pipefail
          python3 -m py_compile .github/mat002_apply.py
          python3 .github/mat002_apply.py
          git diff --check
          git diff --stat
      - name: Run all quantity and quench regression groups
        run: |
          set -euo pipefail
          printf '#include "phase_quantity_tests.hpp"\nint main() { return cybersand::mat002_tests::run_all() ? 0 : 1; }\n' > build/mat002/main.cpp
          timeout 5m g++-13 -std=c++20 -O1 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Inative/include -Inative/tests native/src/world.cpp native/src/material_rules.cpp native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp native/src/render_snapshot.cpp native/src/c_api.cpp build/mat002/main.cpp -o build/mat002/candidate
          timeout 10m build/mat002/candidate 2>&1 | tee build/mat002/quantity-tests.log
      - name: Run the complete core native suite
        run: |
          set -euo pipefail
          timeout 5m make build/tests
          timeout 15m ./build/tests 2>&1 | tee build/mat002/native-tests.log
      - name: Commit only the qualified source delta
        run: |
          set -euo pipefail
          git rm -- .github/mat002_apply.py
          python3 - <<'PY'
          import subprocess
          allowed = {'Makefile', 'native/src/world.cpp', 'native/include/cybersand/world.hpp',
                     'native/include/cybersand/interaction_rules.hpp', 'native/tests/test_world.cpp',
                     '.github/mat002_apply.py'}
          changed = set(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit('Unexpected source write set: ' + repr(changed))
          PY
          git add -- Makefile native/src/world.cpp native/include/cybersand/world.hpp native/include/cybersand/interaction_rules.hpp native/tests/test_world.cpp
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(materials): preserve phase inventory and accumulate quench progress' -m 'Retain Water/Steam/Ice quantity, bound hot-cell quenching, version the affected interaction rules, and integrate the public-World regressions. Refs #160.'
          test "$(git show -s --format=%P HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/mat/phase-quantity-quench
          git rev-parse HEAD | tee build/mat002/source-commit.txt
          sha256sum native/src/world.cpp native/include/cybersand/world.hpp native/include/cybersand/interaction_rules.hpp native/tests/test_world.cpp native/tests/phase_quantity_tests.hpp > build/mat002/source-inputs.sha256
      - name: Retain source and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat002-candidate-${{ github.run_id }}
          path: |
            build/mat002/*.log
            build/mat002/*.txt
            build/mat002/*.sha256
          if-no-files-found: warn
          retention-days: 30
