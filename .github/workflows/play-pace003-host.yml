name: PLAY-PACE-003 shared-host graphical qualification

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'native/**'
      - 'tools/play/**'
      - 'tools/ci/run_godot_regressions.py'
      - 'tools/ci/run_windows_godot_regressions.py'
      - 'tools/ci/godot_process_monitor.py'
      - 'tools/ci/godot_timeout_diagnostics.py'
      - 'tools/ci/check_repository.py'
      - '.github/workflows/play-pace003-host.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'godot/**'
      - 'native/**'
      - 'tools/play/**'
      - 'tools/ci/run_godot_regressions.py'
      - 'tools/ci/run_windows_godot_regressions.py'
      - 'tools/ci/godot_process_monitor.py'
      - 'tools/ci/godot_timeout_diagnostics.py'
      - 'tools/ci/check_repository.py'
      - '.github/workflows/play-pace003-host.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: play-pace003-${{ github.ref }}
  cancel-in-progress: false

env:
  QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: build/play-pace003
  GODOT_VERSION: 4.7.stable.official.5b4e0cb0f
  GODOT_SILENCE_ROOT_WARNING: '1'
  PYTHONUTF8: '1'

jobs:
  ready_scope:
    name: ready validation scope
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Classify ready-for-review change scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          exact = {
              "tools/ci/run_godot_regressions.py",
              "tools/ci/run_windows_godot_regressions.py",
              "tools/ci/godot_process_monitor.py",
              "tools/ci/godot_timeout_diagnostics.py",
              "tools/ci/check_repository.py",
              ".github/workflows/play-pace003-host.yml",
          }
          files = []
          page = 1
          while True:
              url = (f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
                     f"/pulls/{os.environ['PR_NUMBER']}/files?per_page=100&page={page}")
              request = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              files.extend(item["filename"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1
          required = any(path in exact or path.startswith(("godot/", "native/", "tools/play/"))
                         for path in files)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={'true' if required else 'false'}\n")
          print(json.dumps({"qualification_required": required, "changed_paths": files}))
          PY

  linux:
    name: Linux graphical 1-worker and Auto
    needs: [ready_scope]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
      GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      GALLIVM_PERF: nopt
    steps:
      - name: Check out exact qualification head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          lfs: false
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Record exact source and hosted environment
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          workflow = pathlib.Path(".github/workflows/play-pace003-host.yml")
          receipt = {"source_sha": source,
                     "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                     "workflow_sha256": hashlib.sha256(workflow.read_bytes()).hexdigest(),
                     "platform": platform.platform(), "python": platform.python_version(),
                     "environment": {key: os.environ.get(key) for key in (
                         "QUALIFICATION_SHA", "GITHUB_SHA", "GITHUB_EVENT_NAME", "GITHUB_RUN_ID",
                         "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA",
                         "ImageOS", "ImageVersion", "LIBGL_ALWAYS_SOFTWARE", "LP_NUM_THREADS", "GALLIVM_PERF")}}
          pathlib.Path(os.environ["EVIDENCE_DIR"], "workflow-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          if source != os.environ["QUALIFICATION_SHA"]:
              raise SystemExit("Checkout differs from requested exact head")
          PY
          lscpu > "$EVIDENCE_DIR/lscpu.txt"
          cat /etc/os-release > "$EVIDENCE_DIR/os-release.txt"
          python tools/ci/check_ci_provider_policy.py | tee "$EVIDENCE_DIR/provider-policy.json"
          python tools/play/test_pace003_campaign.py 2>&1 | tee "$EVIDENCE_DIR/apparatus-tests.log"

      - name: Materialize retained Linux runtimes
        timeout-minutes: 5
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" --exclude="" 2>&1 | tee "$EVIDENCE_DIR/lfs.log"

      - name: Verify retained runtime source and payload identities
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/preflight.log"
          import json, os, pathlib, shutil, sys
          sys.path.insert(0, "tools/play")
          import run_pace003_campaign as campaign
          source = campaign.source_identity()
          campaign.require(source["source_sha"] == os.environ["QUALIFICATION_SHA"]
                           and source["source_mode"] == "clean-recorded-inputs",
                           "Qualification requires the clean exact source head")
          runtimes = campaign.runtime_identity()
          out = pathlib.Path(os.environ["EVIDENCE_DIR"])
          (out / "preflight.json").write_text(json.dumps({"source": source, "runtimes": runtimes}, indent=2) + "\n")
          for kind, identity in runtimes.items():
              shutil.copyfile(identity["manifest"], out / (kind + "-runtime-provenance.json"))
          print("Retained native and Rapier source/payload identities verified")
          PY

      - name: Prepare pinned Linux Godot
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 20 --max-time 240 --output "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          test "$("$GODOT_BIN" --version)" = "$GODOT_VERSION"
          sha256sum "$RUNNER_TEMP/godot.zip" "$GODOT_BIN" > "$EVIDENCE_DIR/godot.sha256"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install hosted software graphics
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee "$EVIDENCE_DIR/apt-update.log"
          sudo apt-get install --no-install-recommends --yes xvfb xauth libgl1-mesa-dri mesa-utils 2>&1 | tee "$EVIDENCE_DIR/apt-install.log"

      - name: Measure actual shared-host graphical 1-worker and Auto pair
        # The runner enforces 240 s fresh import and 180 s per measurement
        # process. This aggregate step budget is not a per-test extension.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -nolisten tcp" bash -c '
            set -euo pipefail
            glxinfo -B > "$EVIDENCE_DIR/graphics.txt"
            python tools/play/run_pace003_campaign.py --godot "$GODOT_BIN" \
              --output "$EVIDENCE_DIR/campaign" --seconds 15 --repetitions 1 \
              --rig jetbarrel --policy 0 --rendering-driver opengl3
          ' 2>&1 | tee "$EVIDENCE_DIR/execution.log"

      - name: Verify original campaign and exact-head binding
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/readback.log"
          import json, os, pathlib, sys
          sys.path.insert(0, "tools/play")
          import run_pace003_campaign as campaign
          out = pathlib.Path(os.environ["EVIDENCE_DIR"])
          report = campaign.verify_directory(out / "campaign")
          preflight = json.loads((out / "preflight.json").read_text())
          campaign.require(report["source_sha"] == os.environ["QUALIFICATION_SHA"]
                           and report["source_mode"] == "clean-recorded-inputs"
                           and report["execution_inputs"] == preflight["source"]["execution_inputs"]
                           and report["runtimes"] == preflight["runtimes"],
                           "Campaign differs from preflight exact source/runtime")
          print("Original logs, reductions, PNGs and exact-head source/runtime binding verified")
          PY

      - name: Retain original Linux success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: play-pace003-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/play-pace003/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows graphical 1-worker and Auto
    needs: [ready_scope]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.draft == false &&
        (github.event.action != 'ready_for_review' ||
         needs.ready_scope.outputs.required == 'true')))
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GODOT_WINDOWS_URL: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
    steps:
      - name: Check out exact qualification head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.QUALIFICATION_SHA }}
          lfs: false
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Record exact source and hosted environment
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          workflow = pathlib.Path(".github/workflows/play-pace003-host.yml")
          receipt = {"source_sha": source,
                     "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                     "workflow_sha256": hashlib.sha256(workflow.read_bytes()).hexdigest(),
                     "platform": platform.platform(), "python": platform.python_version(),
                     "environment": {key: os.environ.get(key) for key in (
                         "QUALIFICATION_SHA", "GITHUB_SHA", "GITHUB_EVENT_NAME", "GITHUB_RUN_ID",
                         "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "ImageOS", "ImageVersion")}}
          pathlib.Path(os.environ["EVIDENCE_DIR"], "workflow-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          if source != os.environ["QUALIFICATION_SHA"]:
              raise SystemExit("Checkout differs from requested exact head")
          PY
          python tools/ci/check_ci_provider_policy.py | tee "$EVIDENCE_DIR/provider-policy.json"
          python tools/play/test_pace003_campaign.py 2>&1 | tee "$EVIDENCE_DIR/apparatus-tests.log"

      - name: Record Windows CPU and graphics adapter
        shell: pwsh
        run: |
          $identity = @{
            Cpu = @(Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors)
            Graphics = @(Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, VideoProcessor)
            OperatingSystem = @(Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, TotalVisibleMemorySize)
          }
          $identity | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:EVIDENCE_DIR/host.json"

      - name: Materialize retained Windows runtimes
        timeout-minutes: 5
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude="" 2>&1 | tee "$EVIDENCE_DIR/lfs.log"

      - name: Verify retained runtime source and payload identities
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/preflight.log"
          import json, os, pathlib, shutil, sys
          sys.path.insert(0, "tools/play")
          import run_pace003_campaign as campaign
          source = campaign.source_identity()
          campaign.require(source["source_sha"] == os.environ["QUALIFICATION_SHA"]
                           and source["source_mode"] == "clean-recorded-inputs",
                           "Qualification requires the clean exact source head")
          runtimes = campaign.runtime_identity()
          retained = campaign.windows.verify_retained_runtime(campaign.ROOT)
          out = pathlib.Path(os.environ["EVIDENCE_DIR"])
          (out / "preflight.json").write_text(json.dumps({"source": source, "runtimes": runtimes,
                                                        "windows_retained": retained}, indent=2) + "\n")
          for kind, identity in runtimes.items():
              shutil.copyfile(identity["manifest"], out / (kind + "-runtime-provenance.json"))
          print("Retained native and Rapier source/payload identities verified")
          PY

      - name: Prepare pinned Windows Godot
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 20 --max-time 240 --output "$RUNNER_TEMP/godot-windows.zip" "$GODOT_WINDOWS_URL"
          python - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/godot-prepare.log"
          import json, os, pathlib, sys
          sys.path.insert(0, "tools/ci")
          import run_windows_godot_regressions as windows
          binary, identity = windows.prepare_godot(pathlib.Path(os.environ["RUNNER_TEMP"], "godot-windows.zip").resolve())
          pathlib.Path(os.environ["EVIDENCE_DIR"], "godot-identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("GODOT_BIN=" + str(binary) + "\n")
          print(json.dumps(identity, indent=2))
          PY

      - name: Measure actual shared-host graphical 1-worker and Auto pair
        # ANGLE selects the hosted Windows graphics path; original engine logs
        # remain authoritative about the actual adapter. This is no device gate.
        # Fresh import is <=240 s and each measurement process is <=180 s.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python tools/play/run_pace003_campaign.py --godot "$GODOT_BIN" \
            --output "$EVIDENCE_DIR/campaign" --seconds 15 --repetitions 1 \
            --rig jetbarrel --policy 0 --rendering-driver opengl3_angle \
            2>&1 | tee "$EVIDENCE_DIR/execution.log"

      - name: Verify original campaign and exact-head binding
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/readback.log"
          import json, os, pathlib, sys
          sys.path.insert(0, "tools/play")
          import run_pace003_campaign as campaign
          out = pathlib.Path(os.environ["EVIDENCE_DIR"])
          report = campaign.verify_directory(out / "campaign")
          preflight = json.loads((out / "preflight.json").read_text())
          campaign.require(report["source_sha"] == os.environ["QUALIFICATION_SHA"]
                           and report["source_mode"] == "clean-recorded-inputs"
                           and report["execution_inputs"] == preflight["source"]["execution_inputs"]
                           and report["runtimes"] == preflight["runtimes"],
                           "Campaign differs from preflight exact source/runtime")
          print("Original logs, reductions, PNGs and exact-head source/runtime binding verified")
          PY

      - name: Retain original Windows success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: play-pace003-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/play-pace003/
          if-no-files-found: error
          retention-days: 30
