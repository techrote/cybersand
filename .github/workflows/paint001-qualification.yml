name: PAINT-001 exact-head native and persistence qualification
on:
  push:
    branches: [feat/paint001-shape-planner-20261108]
    paths:
      - '.github/workflows/paint001-qualification.yml'
      - 'godot/native_extension/**'
      - 'native/**'
      - 'godot/scripts/workbench_*.gd'
      - 'godot/scripts/shared_workbench.gd'
      - 'godot/scripts/simulation_worker.gd'
      - 'godot/scripts/microscenario_contract.gd'
      - 'godot/tests/test_paint_editor_*.gd'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # Preserve independent manual requests; only newer push-source proposals
  # supersede earlier push-source proposals for this one-off qualification.
  group: paint001-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_URL: 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  RAPIER_SHA256: 566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a
  CYBERSAND_CI_WATCHDOG_SCALE: '1'
jobs:
  linux-real:
    name: Linux source-matched PAINT edit, generated persistence and native readback
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout current source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve exact source and pinned Rapier identity
        run: |
          set -euo pipefail
          mkdir -p evidence/frames
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          g++-13 --version | head -1 > evidence/compiler.txt
          sha256sum godot/native_extension/cyber_prepared_liquid_world.hpp godot/native_extension/cyber_demo_bridge.hpp godot/scripts/workbench_setup.gd godot/scripts/workbench_generated_map.gd godot/tests/test_paint_editor_history.gd > evidence/changed-inputs.sha256
          python3 tools/ci/check_ci_provider_policy.py > evidence/provider.json
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          echo "$RAPIER_SHA256  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | sha256sum -c --strict
          sha256sum godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so > evidence/rapier.sha256
      - name: Prepare exact pinned godot-cpp and SCons
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/scons-install.log 2>&1
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'
          mkdir -p "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT" > evidence/godot-cpp-fetch.log 2>&1
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
      - name: Compile and stage real source-matched native GDExtension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/paint001-native.so
        run: |
          set -euo pipefail
          if ! timeout 3600 bash tools/build_pinned_godot_cpp.sh linux > evidence/build-godot-cpp.log 2>&1; then
            tail -120 evidence/build-godot-cpp.log
            exit 1
          fi
          if ! timeout 3600 bash tools/build_native_extension.sh > evidence/build-native.log 2>&1; then
            tail -160 evidence/build-native.log
            exit 1
          fi
          test -s "$CYBERSAND_NATIVE_OUTPUT"
          sha256sum "$CYBERSAND_NATIVE_OUTPUT" > evidence/native-candidate.sha256
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          bash tools/check_linux_runtime_floor.sh > evidence/abi-floor.log 2>&1
      - name: Install and import Godot 4.7 with source-matched native and Rapier
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-explore"
          timeout 600 curl -fL --retry 3 -o "$RUNNER_TEMP/godot-explore.zip" "$GODOT_URL" > evidence/godot-download.log 2>&1
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot-explore.zip" | sha256sum -c --strict
          unzip -q "$RUNNER_TEMP/godot-explore.zip" -d "$RUNNER_TEMP/godot-explore"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-explore" -maxdepth 1 -type f -name 'Godot*' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version > evidence/godot-version.txt
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          if ! timeout 1200 "$GODOT_BIN" --headless --path godot --editor --quit > evidence/import.log 2>&1; then
            tail -160 evidence/import.log
            exit 1
          fi
      - name: Run actual native edit and geometry tests with 1 and 4 workers
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/paint001-native" LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p "$XDG_DATA_HOME"
          run_paint() {
            local name="$1" script="$2"
            if ! timeout 1800 "$GODOT_BIN" --headless --path godot --script "res://tests/$script.gd" > "evidence/$name.log" 2>&1; then
              tail -160 "evidence/$name.log"; exit 1
            fi
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "evidence/$name.log"; then exit 1; fi
            tail -3 "evidence/$name.log"
          }
          run_paint shapes test_paint_editor_shapes
          for n in 1 4; do
            export PAINT_TEST_WORKERS="$n"
            run_paint "native-workers-$n" test_paint_editor_native
          done
          unset PAINT_TEST_WORKERS
          run_paint executor test_paint_editor_executor
          run_paint recovery test_paint_editor_recovery
      - name: Fresh-process ordinary and generated saved-start native reconstruction
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/paint001-history" LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p "$XDG_DATA_HOME"
          for variant in author reopen; do
            if test "$variant" = reopen; then export CYBERSAND_PAINT_HISTORY_REOPEN=1; else unset CYBERSAND_PAINT_HISTORY_REOPEN || true; fi
            if ! timeout 1800 "$GODOT_BIN" --headless --path godot --script res://tests/test_paint_editor_history.gd > "evidence/history-$variant.log" 2>&1; then
              tail -180 "evidence/history-$variant.log"; exit 1
            fi
            grep -E 'PAINT_EDITOR_HISTORY checks=[1-9][0-9]* failures=0' "evidence/history-$variant.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "evidence/history-$variant.log"; then exit 1; fi
          done
      - name: Actual X11/OpenGL Workbench fill, selection, persistence and fresh-process reopen
        run: |
          set -euo pipefail
          bash tools/ci/prepare_linux_display.sh > evidence/display-setup.log 2>&1
          export LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 GALLIVM_PERF=nopt
          for family in ordinary generated; do
            export XDG_DATA_HOME="$RUNNER_TEMP/paint001-workbench-$family"
            mkdir -p "$XDG_DATA_HOME"
            for variant in author reopen; do
              unset PAINT_REOPEN PAINT_GENERATED_REOPEN || true
              if test "$variant" = reopen; then
                if test "$family" = ordinary; then export PAINT_REOPEN=1; else export PAINT_GENERATED_REOPEN=1; fi
              fi
              if test "$family" = ordinary; then script=test_paint_editor_workbench; else script=test_paint_editor_generated_workbench; fi
              label="$family-$variant"
              if ! timeout 2400 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' "$GODOT_BIN" --path godot --script "res://tests/$script.gd" > "evidence/$label.log" 2>&1; then
                tail -180 "evidence/$label.log"; exit 1
              fi
              grep -F 'PAINT_EDITOR_' "evidence/$label.log" | tail -3
              if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "evidence/$label.log"; then exit 1; fi
            done
          done
      # These two unchanged fixtures have requires_display=false in the
      # accepted-main run_godot_regressions.py planner. The original red run
      # incorrectly used software OpenGL rather than the baseline headless mode.
      # Keep actual EXPLORE-001 visual acceptance above under X11/OpenGL.
      - name: Existing Workbench and GEN-007 controls in accepted headless mode
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 GALLIVM_PERF=nopt
          if ! timeout 3000 "$GODOT_BIN" --headless --path godot --script res://tests/test_workbench_canvas.gd > evidence/workbench-regression.log 2>&1; then
            tail -150 evidence/workbench-regression.log
            exit 1
          fi
          grep -E '^WORKBENCH_CANVAS [1-9][0-9]* checks, 0 failures$' evidence/workbench-regression.log
          if ! timeout 2400 "$GODOT_BIN" --headless --path godot --script res://tests/test_worldgen_planes.gd > evidence/worldgen-regression.log 2>&1; then
            tail -150 evidence/worldgen-regression.log
            exit 1
          fi
          if grep -E 'SCRIPT ERROR:|Parse Error:' evidence/workbench-regression.log evidence/worldgen-regression.log; then
            echo 'One or more GDScript parse/runtime errors occurred'; exit 1
          fi
      - name: Preserve first failure and corrected run evidence, runtime hashes and unaltered frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paint001-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
