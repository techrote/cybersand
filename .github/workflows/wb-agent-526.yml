name: WB-AGENT-001 focused Godot owner qualification

on:
  # Dedicated source-owner coverage continues after a composed implementation
  # merges; main's normal Native/GDExtension build provides source-build gates.
  push:
    branches: [main]
    paths:
      - 'godot/scripts/workbench_agent_footprint.gd'
      - 'godot/scripts/workbench_agent_signed_frame.gd'
      - 'godot/scripts/workbench_authoring_*.gd'
      - 'godot/scripts/simulation_worker.gd'
      # This suite also executes the actual host, render identity, authored-start
      # save/reopen, and agent-disabled manual workbench paths. They must not
      # silently escape the dedicated native-owner gate after main integration.
      - 'godot/scripts/main.gd'
      - 'godot/scripts/shared_workbench.gd'
      - 'godot/scripts/simulation_snapshot.gd'
      - 'godot/scripts/workbench_setup.gd'
      - 'godot/native_extension/**'
      - 'godot/tests/test_workbench_agent_*.gd'
      - 'godot/tests/test_workbench_authoring_*.gd'
      - 'godot/tests/test_native_render_bridge_regression.gd'
      - 'godot/tests/test_workbench_input.gd'
      - '.github/workflows/wb-agent-526.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'godot/scripts/workbench_agent_footprint.gd'
      - 'godot/scripts/workbench_agent_signed_frame.gd'
      - 'godot/scripts/workbench_authoring_*.gd'
      - 'godot/scripts/simulation_worker.gd'
      # This suite also executes the actual host, render identity, authored-start
      # save/reopen, and agent-disabled manual workbench paths. They must not
      # silently escape the dedicated native-owner gate after main integration.
      - 'godot/scripts/main.gd'
      - 'godot/scripts/shared_workbench.gd'
      - 'godot/scripts/simulation_snapshot.gd'
      - 'godot/scripts/workbench_setup.gd'
      - 'godot/native_extension/**'
      - 'godot/tests/test_workbench_agent_*.gd'
      - 'godot/tests/test_workbench_authoring_*.gd'
      - 'godot/tests/test_native_render_bridge_regression.gd'
      - 'godot/tests/test_workbench_input.gd'
      - '.github/workflows/wb-agent-526.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-agent-526-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  linux-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE: build/wb-agent-526
      WB_AGENT_EVIDENCE_DIR: ${{ github.workspace }}/build/wb-agent-526
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out the immutable PR source
        timeout-minutes: 5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Select Python
        timeout-minutes: 5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record source and CI provider identity
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD | tee "$EVIDENCE/source-commit.txt"
          git rev-parse 'HEAD^{tree}' | tee "$EVIDENCE/source-tree.txt"
          git diff --check HEAD | tee "$EVIDENCE/diff-check.log"
          python tools/ci/check_ci_provider_policy.py 2>&1 | tee "$EVIDENCE/provider.log"
      - name: Materialize the current source's pinned native and Rapier binaries
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude='' 2>&1 | tee "$EVIDENCE/lfs.log"
          # A selective LFS pull deliberately leaves other-platform pointers absent.
          # Global 'git lfs fsck' reports those unrelated absent objects as errors;
          # verify the two materialized binaries and capture their exact hashes below.
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [
              'godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so',
              'godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so',
          ]
          hashes = {}
          for path in files:
              data = Path(path).read_bytes()
              assert len(data) > 1024, f'Native dependency is missing or still an LFS pointer: {path}'
              assert not data.startswith(b'version https://git-lfs.github.com/spec/v1'), f'Unmaterialized LFS pointer: {path}'
              hashes[path] = {'size':len(data), 'sha256':hashlib.sha256(data).hexdigest()}
          Path('build/wb-agent-526/runtime-hashes.json').write_text(json.dumps(hashes, indent=2) + '\n')
          PY
      - name: Download and authenticate the locked official Godot 4.7 editor
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('third_party/godot-runtime.lock.json').read_text())
          Path('build/wb-agent-526/godot-lock.json').write_text(json.dumps(lock,indent=2) + '\n')
          with open('build/wb-agent-526/godot-url.txt','w') as f:
              f.write(lock['editor']['origin_url']+'\n')
          PY
          curl --fail --location --connect-timeout 45 --max-time 260 --output "$RUNNER_TEMP/wb-agent-526-godot.zip" "$(cat "$EVIDENCE/godot-url.txt")"
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          lock = json.loads(Path('third_party/godot-runtime.lock.json').read_text())
          archive = Path(os.environ['RUNNER_TEMP'])/'wb-agent-526-godot.zip'
          assert archive.stat().st_size == lock['editor']['size'], 'Godot archive size mismatch'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == lock['editor']['sha256'], 'Godot archive SHA256 mismatch'
          binary = 'Godot_v4.7-stable_linux.x86_64'
          dest = Path(os.environ['RUNNER_TEMP'])/'wb-agent-526-godot'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, 'Damaged Godot archive'
              assert z.namelist().count(binary)==1, 'Godot binary missing/duplicate'
              z.extract(binary,dest)
          (dest/binary).chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('GODOT_BIN='+str(dest/binary)+'\n')
          PY
      - name: Import exact project and run ownerless geometry/envelope/failure controls
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --version | tee "$EVIDENCE/godot-version.txt"
          grep -Fx '4.7.stable.official.5b4e0cb0f' "$EVIDENCE/godot-version.txt"
          timeout 120 "$GODOT_BIN" --headless --path godot --editor --import --quit 2>&1 | tee "$EVIDENCE/import.log"
          for script in test_workbench_agent_footprint.gd test_workbench_agent_signed_frame.gd test_workbench_authoring_envelope.gd test_workbench_agent_failures.gd; do
            timeout 120 "$GODOT_BIN" --headless --path godot --script "res://tests/$script" 2>&1 | tee "$EVIDENCE/$script.log"
          done
      - name: Run real-worker native-ID and actual post-draw framebuffer acceptance
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          for program in xvfb-run Xvfb xauth; do command -v "$program"; done
          timeout 360 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$GODOT_BIN" --path godot --rendering-method gl_compatibility \
            --script res://tests/test_workbench_agent_owner.gd \
            2>&1 | tee "$EVIDENCE/real-owner-graphical.log"
      - name: Regress agent-disabled manual editing, rendering and saved-start reopen
        timeout-minutes: 18
        shell: bash
        env:
          CYBERSAND_WORKBENCH_TEST_NAME: wb-agent-526-regression
        run: |
          set -euo pipefail
          # These operate through the existing workbench without any #526
          # agent task/authorization. Keep an original log for every process.
          for script in test_native_render_bridge_regression.gd test_workbench_input.gd; do
            timeout 210 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
              "$GODOT_BIN" --path godot --rendering-method gl_compatibility \
              --script "res://tests/$script" \
              2>&1 | tee "$EVIDENCE/$script.manual-regression.log"
          done
          # The older test_workbench_canvas.gd exercises the separate feature-
          # launcher and controlled-liquid replacement handshake. On the
          # published Draft-pinned Linux binary it refused before any editing
          # (original RED run 42385916349). Exercise the *same real* main.tscn
          # entrypoint already qualified by #526 owner, with no agent present.
          timeout 150 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$GODOT_BIN" --path godot --rendering-method gl_compatibility \
            --script res://tests/test_workbench_agent_disabled.gd \
            2>&1 | tee "$EVIDENCE/agent-disabled-manual-save.log"
          WB_AGENT_DISABLED_REOPEN=1 timeout 150 \
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$GODOT_BIN" --path godot --rendering-method gl_compatibility \
            --script res://tests/test_workbench_agent_disabled.gd \
            2>&1 | tee "$EVIDENCE/agent-disabled-manual-reopen.log"
      - name: Retain original execution logs and all failed checkpoints
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-agent-526-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/wb-agent-526/
          if-no-files-found: error
          retention-days: 90

  windows-owner:
    # Actual Windows Godot/GL owner run on the same exact GDScript source.
    # Uses retained LFS native binaries (not a Windows source build).
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE: build/wb-agent-526-windows
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out the same immutable PR head
        timeout-minutes: 5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Select Python 3.12
        timeout-minutes: 5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source and materialize retained Windows native DLLs
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$EVIDENCE/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/source-tree.txt"
          git diff --check HEAD
          python tools/ci/check_ci_provider_policy.py > "$EVIDENCE/provider.log" 2>&1
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude='' > "$EVIDENCE/lfs.log" 2>&1
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=[
              'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll',
              'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll',
          ]
          result={}
          for name in paths:
              payload=Path(name).read_bytes()
              assert len(payload)>1024 and payload[:2]==b'MZ',f'Not a materialized PE DLL: {name}'
              result[name]={'size':len(payload),'sha256':hashlib.sha256(payload).hexdigest(),'origin':'repository LFS; NOT rebuilt at candidate head'}
          Path('build/wb-agent-526-windows/runtime-hashes.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Obtain official Windows Godot 4.7 and record binary identity
        timeout-minutes: 12
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 45 --max-time 600             -o "$EVIDENCE/godot.zip"             'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('build/wb-agent-526-windows')
          archive=root/'godot.zip'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None,'Corrupt Windows Godot editor archive'
              names=z.namelist()
              assert names.count('Godot_v4.7-stable_win64_console.exe')==1
              assert names.count('Godot_v4.7-stable_win64.exe')==1
              z.extractall(root/'editor')
          (root/'godot-editor.txt').write_text(str((root/'editor'/'Godot_v4.7-stable_win64_console.exe').resolve())+'\n')
          (root/'godot-archive-identity.json').write_text(json.dumps({
              'origin':'official Godot 4.7 stable release URL; archive SHA recorded, not pinned by third_party linux lock',
              'size':archive.stat().st_size,
              'sha256':hashlib.sha256(archive.read_bytes()).hexdigest()
          },indent=2)+'\n')
          archive.unlink()
          PY
      - name: Run real Windows native-worker and graphical workbench regressions
        timeout-minutes: 32
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,subprocess,sys
          from pathlib import Path
          evidence=Path('build/wb-agent-526-windows')
          editor=(evidence/'godot-editor.txt').read_text().strip()
          env=os.environ.copy()
          env['WB_AGENT_EVIDENCE_DIR']=str(evidence.resolve())
          cases=[
              ('version',['--version'],30),
              ('import',['--headless','--path','godot','--editor','--import','--quit'],240),
              ('geometry',['--headless','--path','godot','--script','res://tests/test_workbench_agent_footprint.gd'],180),
              ('signed-frame',['--headless','--path','godot','--script','res://tests/test_workbench_agent_signed_frame.gd'],180),
              ('envelope',['--headless','--path','godot','--script','res://tests/test_workbench_authoring_envelope.gd'],180),
              ('failure-controls',['--headless','--path','godot','--script','res://tests/test_workbench_agent_failures.gd'],180),
              # No --headless: this must produce an ACTUAL Windows render/draw.
              ('native-owner-graphical',['--path','godot','--rendering-method','gl_compatibility','--script','res://tests/test_workbench_agent_owner.gd'],420),
              ('manual-input-graphical',['--path','godot','--rendering-method','gl_compatibility','--script','res://tests/test_workbench_input.gd'],240),
              ('manual-save-graphical',['--path','godot','--rendering-method','gl_compatibility','--script','res://tests/test_workbench_agent_disabled.gd'],240),
              ('manual-reopen-graphical',['--path','godot','--rendering-method','gl_compatibility','--script','res://tests/test_workbench_agent_disabled.gd'],240),
          ]
          # A zero process exit is not an assertion result: demand the explicit
          # source-defined summary from each executed real Godot test, including
          # at least its previously qualified checks and exactly zero failures.
          # Minima permit future tests to add stronger coverage without a CI edit.
          expected_summaries={
              'geometry':(r'WB_AGENT_FOOTPRINT: (\d+) assertions, 0 failure\(s\)',24),
              'signed-frame':(r'WB_AGENT_SIGNED_FRAME: (\d+) assertions, 0 failures',28),
              'envelope':(r'WB_AGENT_ENVELOPE: (\d+) assertions, 0 failures',20),
              'failure-controls':(r'WB_AGENT_FAILURE: (\d+) assertions, 0 failures',13),
              'native-owner-graphical':(r'WB_AGENT_OWNER: (\d+) assertions, 0 failures',141),
              'manual-input-graphical':(r'WORKBENCH_INPUT \{"checks":(\d+),"failures":\[\]',24),
              'manual-save-graphical':(r'WB_AGENT_DISABLED: (\d+) assertions, 0 failures, second_process=false',6),
              'manual-reopen-graphical':(r'WB_AGENT_DISABLED: (\d+) assertions, 0 failures, second_process=true',3),
          }
          failures=[]
          for name,args,timeout in cases:
              local=env.copy()
              if name=='manual-reopen-graphical':
                  local['WB_AGENT_DISABLED_REOPEN']='1'
              else:
                  local.pop('WB_AGENT_DISABLED_REOPEN',None)
              output=evidence/(name+'.log')
              with output.open('wb') as log:
                  try:
                      r=subprocess.run([editor]+args,stdout=log,stderr=subprocess.STDOUT,env=local,timeout=timeout,check=False)
                      code=r.returncode
                  except subprocess.TimeoutExpired:
                      code=124
              print(name,'exit',code,flush=True)
              if code==0 and name in expected_summaries:
                  pattern,minimum=expected_summaries[name]
                  match=re.search(pattern,output.read_text(encoding='utf-8',errors='replace'))
                  if match is None or int(match.group(1))<minimum:
                      print(name,'missing or insufficient zero-failure test summary',flush=True)
                      failures.append(name+'-test-summary')
              if code:
                  failures.append(name)
                  # Source import is a dependency for meaningful later tests.
                  if name=='import': break
          (evidence/'actual-result.txt').write_text('FAILED: '+','.join(failures) if failures else 'PASS: all real Windows cases')
          if failures: sys.exit('Real Windows owner qualification failed: '+','.join(failures))
          version=(evidence/'version.log').read_text(errors='replace').strip()
          assert '4.7.stable.official.5b4e0cb0f' in version, 'Wrong Godot 4.7 build: '+version
          PY
      - name: Preserve original Windows test and frame evidence, including RED
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-agent-526-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/wb-agent-526-windows/
          if-no-files-found: error
          retention-days: 90

  linux-source-rebuild:
    # Dedicated fresh Linux native source-build on path-scoped PR or manual
    # qualification. Main already builds the current production Native and
    # GDExtension matrices: avoid redundant compilation on each main push.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE: build/wb-agent-526-source-rebuilt
      WB_AGENT_EVIDENCE_DIR: ${{ github.workspace }}/build/wb-agent-526-source-rebuilt
      GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact PR source, no retained native binaries
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Pin Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source and materialize pinned Rapier only
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD | tee "$EVIDENCE/source-commit.txt"
          git rev-parse 'HEAD^{tree}' | tee "$EVIDENCE/source-tree.txt"
          git diff --check HEAD
          python3 tools/ci/check_ci_provider_policy.py 2>&1 | tee "$EVIDENCE/provider.log"
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude='' 2>&1 | tee "$EVIDENCE/rapier-lfs.log"
          echo '566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' | sha256sum --check --strict
          sha256sum godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so | tee "$EVIDENCE/rapier.sha256"
      - name: Fresh source-build of godot-cpp and CyberSand native extension
        timeout-minutes: 42
        shell: bash
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/libcybersand_native.linux.x86_64.so
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt 2>&1 | tee "$EVIDENCE/scons-install.log"
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'
          mkdir "$GODOT_CPP_ROOT"
          git -C "$GODOT_CPP_ROOT" init
          git -C "$GODOT_CPP_ROOT" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$GODOT_CPP_ROOT" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$GODOT_CPP_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$GODOT_CPP_ROOT" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
          printf 'godot_cpp=%s\nscons=4.10.1\n' "$GODOT_CPP_COMMIT" > "$EVIDENCE/build-toolchain.txt"
          g++-13 --version | head -n 1 | tee -a "$EVIDENCE/build-toolchain.txt"
          timeout 1400 tools/build_pinned_godot_cpp.sh linux 2>&1 | tee "$EVIDENCE/godot-cpp-build.log"
          timeout 1400 tools/build_native_extension.sh 2>&1 | tee "$EVIDENCE/native-build.log"
          file "$CYBERSAND_NATIVE_OUTPUT" | tee "$EVIDENCE/native-file.txt"
          grep -q 'ELF 64-bit.*x86-64' "$EVIDENCE/native-file.txt"
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          sha256sum "$CYBERSAND_NATIVE_OUTPUT" | tee "$EVIDENCE/rebuilt-native.sha256"
          sha256sum godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so | tee "$EVIDENCE/staged-native.sha256"
          # Preserve the actual fresh-built candidate, not only its hash and logs.
          # This is CI evidence, never a commit or promotion of the retained LFS binary.
          cp "$CYBERSAND_NATIVE_OUTPUT" "$EVIDENCE/libcybersand_native.linux.x86_64.so"
          (
            cd "$EVIDENCE"
            sha256sum libcybersand_native.linux.x86_64.so > candidate-runtime.sha256
            sha256sum --check --strict candidate-runtime.sha256
          )
      - name: Retrieve hash-locked Godot 4.7 editor
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path("third_party/godot-runtime.lock.json").read_text())
          Path("build/wb-agent-526-source-rebuilt/godot-lock.json").write_text(json.dumps(lock,indent=2)+"\n")
          Path("build/wb-agent-526-source-rebuilt/godot-url.txt").write_text(lock["editor"]["origin_url"]+"\n")
          PY
          curl --fail --location --connect-timeout 45 --max-time 260 --output "$RUNNER_TEMP/wb-agent-526-built-godot.zip" "$(cat "$EVIDENCE/godot-url.txt")"
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          lock=json.loads(Path("third_party/godot-runtime.lock.json").read_text())["editor"]
          zpath=Path(os.environ["RUNNER_TEMP"])/"wb-agent-526-built-godot.zip"
          assert zpath.stat().st_size==lock["size"]
          assert hashlib.sha256(zpath.read_bytes()).hexdigest()==lock["sha256"]
          name="Godot_v4.7-stable_linux.x86_64"
          dest=Path(os.environ["RUNNER_TEMP"])/"wb-agent-526-built-godot"
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None and z.namelist().count(name)==1
              z.extract(name,dest)
          (dest/name).chmod(0o755)
          with open(os.environ["GITHUB_ENV"],"a") as e:
              e.write("GODOT_BIN="+str(dest/name)+"\n")
          PY
      - name: Exercise signed authoring host against freshly built native World
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --version | tee "$EVIDENCE/godot-version.txt"
          grep -Fx '4.7.stable.official.5b4e0cb0f' "$EVIDENCE/godot-version.txt"
          timeout 120 "$GODOT_BIN" --headless --path godot --editor --import --quit 2>&1 | tee "$EVIDENCE/import-rebuilt.log"
          timeout 120 "$GODOT_BIN" --headless --path godot --script res://tests/test_workbench_agent_signed_frame.gd 2>&1 | tee "$EVIDENCE/signed-bounds-rebuilt.log"
          timeout 360 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$GODOT_BIN" --path godot --rendering-method gl_compatibility \
            --script res://tests/test_workbench_agent_owner.gd 2>&1 | tee "$EVIDENCE/real-signed-owner-rebuilt.log"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          path=Path("godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so")
          Path(os.environ["EVIDENCE"],"runtime-identities.json").write_text(json.dumps({
              "source":os.environ["SOURCE_SHA"],
              "sha256":hashlib.sha256(path.read_bytes()).hexdigest(),
              "bytes":path.stat().st_size,
              "origin":"rebuilt_from_exact_checkout_not_retained_native_LFS",
          },indent=2)+"\n")
          PY
      - name: Preserve source build logs and original native/render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-agent-526-source-rebuilt-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/wb-agent-526-source-rebuilt/
          if-no-files-found: warn
          retention-days: 90
