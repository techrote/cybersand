name: GEN006 independent native-stall Godot responsiveness acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'godot/tests/gen006_native_stall_graphical_qa.gd'
      - '.github/workflows/gen006-native-stall-graphical-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen006-native-stall-qa-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-stall-real-godot:
    name: Ubuntu 24.04 / suspended real native PID / actual OpenGL
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GEN006_QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # Independently qualify the actual builder, not the older #511 stacked base.
      # Update only after verifying a successor builder head and re-executing.
      GEN006_BUILDER_HEAD: b53a54b1bd707614557e8f14cc0f1675986c41eb
    steps:
      - name: Checkout independent test-only source at exact QA head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Checkout exact published #486 builder (without writing its branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b53a54b1bd707614557e8f14cc0f1675986c41eb
          path: builder
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Verify provenance, source scopes and CI provider
        shell: bash
        run: |
          set -euo pipefail
          dir=builder/build/gen006-native-stall-qa
          mkdir -p "$dir"
          git -C qa rev-parse HEAD | tee "$dir/qa-head.txt"
          test "$(git -C qa rev-parse HEAD)" = "$GEN006_QA_HEAD"
          git -C builder rev-parse HEAD | tee "$dir/builder-head.txt"
          test "$(git -C builder rev-parse HEAD)" = "$GEN006_BUILDER_HEAD"
          git -C builder rev-parse 'HEAD^{tree}' | tee "$dir/builder-tree.txt"
          git -C qa rev-parse 'HEAD^{tree}' | tee "$dir/qa-tree.txt"
          for f in native/src/world.cpp native/tests/gen006_streaming_slice.cpp godot/tests/gen006_streaming_slice_demo.gd godot/tests/gen006_streaming_slice_demo.tscn; do
            printf '%s ' "$f" >> "$dir/builder-blobs.txt"
            git -C builder hash-object "$f" >> "$dir/builder-blobs.txt"
          done
          git -C qa hash-object godot/tests/gen006_native_stall_graphical_qa.gd | tee "$dir/qa-test-blob.txt"
          lsb_release -a 2>&1 | tee "$dir/os.txt"
          python3 builder/tools/ci/check_ci_provider_policy.py
      - name: Compile real builder native World, no production substitutions
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cd builder
          dir=build/gen006-native-stall-qa
          g++-13 --version | head -n 1 | tee "$dir/compiler.txt"
          g++-13 -std=c++20 -O0 -g0 -pthread -I native/include \
            native/src/world.cpp native/src/material_rules.cpp \
            native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp \
            native/src/world_generation.cpp native/src/generation_fields.cpp \
            native/src/generation_typed_fields.cpp native/src/generation_spatial.cpp \
            native/src/generation_grammar.cpp native/src/generation_planes.cpp \
            native/tests/gen006_streaming_slice.cpp \
            -o "$dir/streaming-slice" \
            > "$dir/native-compile.log" 2>&1 || { cat "$dir/native-compile.log"; exit 1; }
          sha256sum "$dir/streaming-slice" | tee "$dir/native-runtime.sha256"
      - name: Run actual Godot 4.7 OpenGL while its native PID is stopped
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cd builder
          dir=build/gen006-native-stall-qa
          mkdir -p "$dir/bin" "$dir/project/tests" "$dir/screenshots"
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          curl -fsSL --retry 3 --retry-delay 3 \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7' \
            -o "$dir/godot-4.7.zip"
          echo '0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  '"$dir/godot-4.7.zip" | sha256sum --check --strict
          unzip -q "$dir/godot-4.7.zip" -d "$dir/bin"
          godot_bin="$(find "$dir/bin" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          test -n "$godot_bin"
          chmod +x "$godot_bin"
          "$godot_bin" --version | tee "$dir/godot-version.txt"
          cp godot/tests/gen006_streaming_slice_demo.gd \
             godot/tests/gen006_streaming_slice_demo.tscn "$dir/project/tests/"
          cp ../qa/godot/tests/gen006_native_stall_graphical_qa.gd "$dir/project/tests/"
          cat > "$dir/project/project.godot" <<'EOP'
          config_version=5
          [application]
          config/name="GEN006 Independent Native Stall GL Qualification"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=800
          window/size/window_width_override=1280
          window/size/window_height_override=800
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOP
          export GEN006_SLICE_EXECUTABLE="$PWD/$dir/streaming-slice"
          export GEN006_SLICE_ROOT="$PWD/$dir/world"
          export GEN006_STALL_EVIDENCE="$PWD/$dir/screenshots"
          export GEN006_SLICE_FORCE_ASYNC_TEST=1
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x800x24' \
            timeout 240 "$godot_bin" --rendering-driver opengl3 \
              --path "$dir/project" --script res://tests/gen006_native_stall_graphical_qa.gd \
            2>&1 | tee "$dir/graphical.log"
          grep -q 'GEN006_NATIVE_STALL_GRAPHICAL_PASS' "$dir/graphical.log"
          for name in 00-live-before-stop 01-native-stopped-ui-live 02-native-resumed-edit-confirmed; do
            test -s "$dir/screenshots/$name.png"
          done
          sha256sum "$dir"/screenshots/*.png | tee "$dir/screenshots.sha256"
          test "$(wc -c < "$dir/world/gen006-current.rgba")" = 16384
      - name: Preserve exact-head evidence and original negative output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen006-native-stall-real-godot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            builder/build/gen006-native-stall-qa/qa-head.txt
            builder/build/gen006-native-stall-qa/qa-tree.txt
            builder/build/gen006-native-stall-qa/builder-head.txt
            builder/build/gen006-native-stall-qa/builder-tree.txt
            builder/build/gen006-native-stall-qa/builder-blobs.txt
            builder/build/gen006-native-stall-qa/qa-test-blob.txt
            builder/build/gen006-native-stall-qa/native-runtime.sha256
            builder/build/gen006-native-stall-qa/os.txt
            builder/build/gen006-native-stall-qa/compiler.txt
            builder/build/gen006-native-stall-qa/native-compile.log
            builder/build/gen006-native-stall-qa/godot-version.txt
            builder/build/gen006-native-stall-qa/graphical.log
            builder/build/gen006-native-stall-qa/screenshots/*.png
            builder/build/gen006-native-stall-qa/screenshots.sha256
          if-no-files-found: warn
          retention-days: 90
