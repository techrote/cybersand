name: WORM LFM support W13 original 128-turn STOP and pixel replay
on:
  push:
    branches: [research/612-worm-lfm-support]
    paths:
      - experiments/agent_painter/worm/support_lfm/audit_w13_original.py
      - experiments/agent_painter/worm/support_lfm/test_w13_original_audit.py
      - .github/workflows/agent-painter-worm-lfm-support-w13-original.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: worm-lfm-support-w13-original-read-only
  cancel-in-progress: false
jobs:
  original-128:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact support branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Independently checkout immutable shared W0
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          path: original-w0
          persist-credentials: false
      - name: Immutable source, W0 binary and safety preflight
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original-w0 rev-parse HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git hash-object original-w0/experiments/agent_painter/worm/common/worm.py)" = 8979b6f0296e81051194bacc907992d38e006605
          python3 -m py_compile experiments/agent_painter/worm/support_lfm/audit_w13_original.py experiments/agent_painter/worm/support_lfm/test_w13_original_audit.py
          mkdir -p evidence/original evidence/independent
          git rev-parse HEAD > evidence/independent/support-source.txt
          git -C original-w0 rev-parse HEAD > evidence/independent/w0-source.txt
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output evidence/independent/ci-scheduling.json
      - name: Fetch ONLY already completed original W13 producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/techrote/cybersand/actions/runs/43771476464 --jq .head_sha)" = 245290cab2352381dbd1eaf16374c577138b4ade
          test "$(gh api repos/techrote/cybersand/actions/runs/43771476464 --jq .conclusion)" = success
          gh api repos/techrote/cybersand/actions/artifacts/14185385444/zip > evidence/original/alpha.zip
          gh api repos/techrote/cybersand/actions/artifacts/14185425004/zip > evidence/original/beta.zip
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          for name,pin in {
            "alpha":"0e69b23c100a00b438d4e2d9d07fa4550e276368e0ad4635e38a6c858f79b95e",
            "beta":"36fa8876f249b0263d19dc40bea17731e8a4776da9cc82400189a876980380ff"
          }.items():
              path=Path(f"evidence/original/{name}.zip")
              assert hashlib.sha256(path.read_bytes()).hexdigest()==pin
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
              print("Original producer",name,"immutable ZIP/CRC PASS")
          PY
      - name: Eight independent adversarial corruption checks
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/worm/support_lfm/test_w13_original_audit.py \
            --alpha evidence/original/alpha.zip \
            --beta evidence/original/beta.zip
      - name: Reproduce 512 model-scored HOST choices, four real PNGs and 12 W0 control PNGs
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/worm/support_lfm/audit_w13_original.py \
            --alpha evidence/original/alpha.zip \
            --beta evidence/original/beta.zip \
            --w0-dir original-w0/experiments/agent_painter/worm/common \
            --gallery evidence/independent/ORIGINAL-W0-16-PNGs \
            --output evidence/independent/W13-source-stop-audit.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("evidence/independent")
          r=json.loads((root/"W13-source-stop-audit.json").read_text())
          assert r["independent_pinned_W0_png_byte_replay"] is True
          assert r["genuine_original_model_score_forwards"]==512
          assert r["original_STOP_legal_but_masked_choices"]==512
          assert r["same_state_counterfactual_STOP_choices_NOT_rollouts"]==49
          assert r["same_state_flat_choices_different_NOT_rollouts"]==93
          pngs=list((root/"ORIGINAL-W0-16-PNGs").glob("*.png"))
          assert len(pngs)==16
          sha={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(pngs)}
          (root/"original-PNG-manifest-sha256.json").write_text(json.dumps(sha,indent=2,sort_keys=True)+"\n")
          print("HOST+W0 exact original-byte replay PASS (not neural reexecution)")
          PY
      - name: Preserve original artifacts and independent report even if checks fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worm-lfm-support-W13-original-four-resident-STOP-audit-NO-MODEL
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
