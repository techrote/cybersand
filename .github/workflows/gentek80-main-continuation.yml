name: GENTEK 80 accepted-main Linux continuation
on:
  push:
    branches: [ci/gentek80-main-integration]
    paths:
      - '.github/workflows/gentek80-main-continuation.yml'
      - 'tools/ci/gentek80_main_continue.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: gentek80-main-linux-continuation-${{ github.run_id }}
  cancel-in-progress: false
env:
  TARGET_SHA: 87148d66e816f3fd4033e8227a7d310652e2812a
  TARGET_TREE: a24d0ed7a1f18d02716dec3a8cee378d18b38c63
  ACCEPTED_MAIN: 7b03aa437561ec63e31fd09531171360ab60eeb4
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
jobs:
  linux:
    name: Continue Linux on unchanged candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      GALLIVM_PERF: nopt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate unchanged source, runtime and original failed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git -C candidate merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD
          git -C candidate lfs install --local
          git -C candidate lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          mkdir -p evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14648037406" > evidence/original-artifact.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('evidence/original-artifact.json').read_text())
          assert d['id'] == 14648037406 and d['name'] == 'gentek80-main-evidence-linux-44770730491'
          assert d['digest'] == 'sha256:f4042fd567ca277d4a23de372b7d8109298e70a35f4062cc0d5f873575edf68d'
          assert d['size_in_bytes'] == 2836980 and not d['expired']
          assert d['workflow_run']['id'] == 44770730491
          assert d['workflow_run']['head_sha'] == '561a0ac544027b8fa85b3e24ed7b903ab9732719'
          PY
      - name: Retain the untouched original Linux evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 44770730491
          name: gentek80-main-evidence-linux-44770730491
          path: evidence/original-linux
      - name: Install pinned Godot and graphical display
        shell: bash
        run: |
          set -euo pipefail
          python orchestration/tools/ci/gentek80_main_integration/prepare_inputs.py --candidate candidate --output evidence/inputs
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 --max-time 600 -o "$RUNNER_TEMP/godot.zip" 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          echo "GODOT_EXE=$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" >> "$GITHUB_ENV"
          bash candidate/tools/ci/prepare_linux_display.sh > evidence/display-setup.log 2>&1
      - name: Reuse completed cases and execute canonical paint plus remaining regressions
        shell: bash
        run: |
          set -euo pipefail
          python orchestration/tools/ci/gentek80_main_continue.py --candidate candidate --godot "$GODOT_EXE" --prior evidence/original-linux/focused --output evidence/continuation
      - name: Graphical Genteks, flyer, native material motion, lazy Art and landscape join
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' python candidate/tools/architecture/gentek80_main_integration.py --godot "$GODOT_EXE" --output evidence/integration --fixture-dir evidence/inputs/fixtures --graphical
      - name: Real large-map capacity and fresh-process authored starts
        shell: bash
        run: |
          set -euo pipefail
          python candidate/tools/qualify_workbench_landscapes.py --godot "$GODOT_EXE" --manifest evidence/inputs/graftloom-manifest.json --output evidence/landscape --fixture-dir evidence/inputs/fixtures --map graftloom-slipway
      - name: Preserve original and continuation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek80-main-linux-continuation-${{ github.run_id }}
          path: |
            evidence/**/*.json
            evidence/**/*.log
            evidence/**/*.png
            evidence/**/*.txt
          if-no-files-found: error
          retention-days: 90
