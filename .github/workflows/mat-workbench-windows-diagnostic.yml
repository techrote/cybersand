name: Diagnose frozen MAT-AUTH and Workbench on Windows

on:
  push:
    branches: [codex/mat-workbench-windows-diagnostic-20261113]
    paths:
      - '.github/workflows/mat-workbench-windows-diagnostic.yml'
      - 'tools/ci/mat_workbench_windows_diagnostic.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: mat-workbench-windows-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/mat-workbench-windows-diagnostic-20261113'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CYBERSAND_LAB_CXX: 'C:\mingw64\bin\g++.exe'
      GODOT_SILENCE_ROOT_WARNING: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      GALLIVM_PERF: nopt
      CYBERSAND_CI_WATCHDOG_SCALE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out diagnostic apparatus only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: diagnostic
          lfs: false

      - name: Check out the exact frozen candidate and full source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 90719c72b9fcf90593fb7878354051ad601b47fd
          path: candidate
          fetch-depth: 0
          lfs: false

      - name: Select the original Python series
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore the immutable original cross-build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13996438401'
          run-id: '43334477644'
          github-token: ${{ github.token }}
          path: build-artifact
          merge-multiple: true

      - name: Prepare the original pinned runtime dependencies
        working-directory: candidate
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" --exclude=""
          echo "b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7  godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll" | sha256sum --check --strict
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 --output "$RUNNER_TEMP/godot-windows.zip" https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip

      - name: Diagnose original fixture, exact backend request, World UI and capture load
        run: |
          set -euo pipefail
          python diagnostic/tools/ci/mat_workbench_windows_diagnostic.py --candidate candidate --bundle build-artifact --godot-archive "$RUNNER_TEMP/godot-windows.zip" --evidence diagnostic-evidence

      - name: Retain original logs, userdata, phase traces and process samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mat-workbench-windows-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 90
