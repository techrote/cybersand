name: WORM SPROCKET support audit original W3 online images

on:
  push:
    branches: [research/612-worm-sprocket-support]
    paths:
      - experiments/agent_painter/worm/support_sprocket/audit_w3_online.py
      - .github/workflows/agent-painter-worm-sprocket-support-w3-online.yml

permissions:
  contents: read
  actions: read

jobs:
  original-w3-online:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Source and provider policy, no model download
        run: |
          set -euo pipefail
          mkdir -p evidence/original-pngs
          git rev-parse HEAD > evidence/support-commit.txt
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/worm/support_sprocket/audit_w3_online.py
      - name: Retrieve immutable original W3 online ZIP without passing bearer token to redirect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, urllib.error, urllib.parse
          url='https://api.github.com/repos/techrote/cybersand/actions/artifacts/14158947403/zip'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
               'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          try:
              urllib.request.build_opener(NoRedirect).open(req,timeout=40)
              raise RuntimeError('unexpected direct response')
          except urllib.error.HTTPError as e:
              if e.code not in (301,302,303,307,308): raise
              signed=e.headers.get('Location','')
          host=urllib.parse.urlparse(signed)
          if host.scheme!='https' or not ((host.hostname or '').endswith('.blob.core.windows.net')
              or (host.hostname or '').endswith('.githubusercontent.com')
              or (host.hostname or '').endswith('.github.com')):
              raise RuntimeError('unrecognised artifact host')
          with urllib.request.urlopen(signed,timeout=120) as response:
              blob=response.read(300_000)
          if len(blob)>=300_000: raise RuntimeError('oversize ZIP')
          open('/tmp/original-w3-online.zip','wb').write(blob)
          PY
      - name: Retrieve pinned W0 engine from original repository commit
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git rev-parse FETCH_HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > /tmp/original-w0.py
          test "$(sha256sum /tmp/original-w0.py | cut -c1-64)" = 81c3923cb38d7f196b99986806216388c34ebc27fd4976e168b3b370c25a323e
      - name: Original model raw decisions and pixel-perfect replay audit
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/worm/support_sprocket/audit_w3_online.py \
            /tmp/original-w3-online.zip --trusted-w0 /tmp/original-w0.py \
            --report evidence/online-audit.json
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          a=json.loads(Path('evidence/online-audit.json').read_text())
          assert a['original_png_and_full_JSON_replays']==30
          assert a['trained_legal_EOS_first_passes']==144
          assert a['distinct_learned_action_sequences_across_six_rollouts']==1
          with ZipFile('/tmp/original-w3-online.zip') as z:
              for name in z.namelist():
                  if name.startswith('results/png-and-json/') and name.endswith('.png'):
                      Path('evidence/original-pngs',Path(name).name).write_bytes(z.read(name))
          assert len(list(Path('evidence/original-pngs').glob('*.png')))==30
          PY
          sha256sum /tmp/original-w3-online.zip /tmp/original-w0.py > evidence/external-inputs-sha256.txt
          (cd evidence && sha256sum online-audit.json original-pngs/*.png > SHA256SUMS.txt)
      - name: Preserve report, all original PNGs and partial failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worm-sprocket-support-original-w3-online-audit
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
