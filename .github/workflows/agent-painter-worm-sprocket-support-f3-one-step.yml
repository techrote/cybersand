name: WORM SPROCKET support F3 source-faithful one-action opportunity audit
on:
  push:
    branches:
      - research/612-worm-sprocket-support
    paths:
      - experiments/agent_painter/worm/support_sprocket/f3_one_step_opportunity.py
      - experiments/agent_painter/worm/support_sprocket/test_f3_one_step_opportunity.py
      - .github/workflows/agent-painter-worm-sprocket-support-f3-one-step.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sprocket-f3-one-step-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-pinned-one-action-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download immutable original F3 and its original W0 host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/f3-opportunity
          git rev-parse HEAD > evidence/f3-opportunity/auditor-source-sha.txt
          curl --fail --silent --show-error --location --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/techrote/cybersand/actions/artifacts/14183924474/zip \
            -o evidence/f3-opportunity/original-f3.zip
          echo "5eb64e5f7d5335809f631aa11caf9edbfcf1a67f546601d5d14e795cc61f7af6  evidence/f3-opportunity/original-f3.zip" | sha256sum -c -
          curl --fail --silent --show-error --location --max-time 60 \
            https://raw.githubusercontent.com/techrote/cybersand/4bb9d6e1d0d0d78183f87d1e3c29648edafacf61/experiments/agent_painter/worm/common/worm.py \
            -o evidence/f3-opportunity/pinned-original-w0.py
          echo "81c3923cb38d7f196b99986806216388c34ebc27fd4976e168b3b370c25a323e  evidence/f3-opportunity/pinned-original-w0.py" | sha256sum -c -
      - name: Reproduce 512 original-score single-step interventions; run adversarial tests
        env:
          SPROCKET_F3_ORIGINAL_ZIP: ${{ github.workspace }}/evidence/f3-opportunity/original-f3.zip
          SPROCKET_F3_PINNED_W0: ${{ github.workspace }}/evidence/f3-opportunity/pinned-original-w0.py
        run: |
          set -euo pipefail
          cd experiments/agent_painter/worm/support_sprocket
          python3 -m py_compile f3_one_step_opportunity.py test_f3_one_step_opportunity.py
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -m unittest -v test_f3_one_step_opportunity \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/f3-opportunity/test-results.txt"
          timeout --signal=TERM --kill-after=5s 120s \
            python3 f3_one_step_opportunity.py "$SPROCKET_F3_ORIGINAL_ZIP" \
              --w0 "$SPROCKET_F3_PINNED_W0" \
              --output "$GITHUB_WORKSPACE/evidence/f3-opportunity/one-step-results" \
              > "$GITHUB_WORKSPACE/evidence/f3-opportunity/report-stdout.json"
      - name: Publish exact-source reports and original-W0 single-step PNG comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sprocket-f3-one-step-original-${{ github.sha }}
          path: |
            evidence/f3-opportunity/auditor-source-sha.txt
            evidence/f3-opportunity/test-results.txt
            evidence/f3-opportunity/report-stdout.json
            evidence/f3-opportunity/one-step-results/
          if-no-files-found: warn
          retention-days: 90
