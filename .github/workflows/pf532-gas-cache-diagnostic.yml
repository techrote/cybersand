name: PF532 bounded gas-cache admission diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pf532-gas-cache-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
env:
  ACCEPTED_MAIN: 81bbd5ff5cf366159e2b8a630609359c13560080
  GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_SILENCE_ROOT_WARNING: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Lock exact branch source
        run: |
          set -euo pipefail
          mkdir -p build/pf532-diag/{fixtures,logs}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD
          git diff --check
          python3 tools/material_catalogue/compatibility.py --check >build/pf532-diag/material-authority.json
          python3 -m py_compile tools/ci/pf532_instrument_native_replay_diag.py
      - name: Export authored stress-canvas and frozen tape
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 600 -o "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          chmod +x "$GODOT_BIN"
          export PF_CAPACITY_FIXTURE_DIR="$GITHUB_WORKSPACE/build/pf532-diag/fixtures"
          timeout 240 "$GODOT_BIN" --headless --path godot --script res://tests/pf_c2048_export_fixtures.gd >build/pf532-diag/logs/export.log 2>&1
          python3 tools/ci/pf532_emit_native_replay_tape.py --workbench-setup godot/scripts/workbench_setup.gd --fixture build/pf532-diag/fixtures/stress-canvas.csv --out build/pf532-diag/replay-tape.csv
      - name: Build diagnostic-only candidate driver
        run: |
          set -euo pipefail
          python3 tools/ci/pf532_instrument_native_replay_diag.py --source native/bench/pf532_gas_cache_input_replay.cpp --out "$RUNNER_TEMP/pf532_diag.cpp"
          flags=(-std=c++20 -O2 -DNDEBUG -pthread -Wall -Wextra -I native/include)
          sources=(native/src/world.cpp native/src/material_rules.cpp native/src/scheduler_geometry.cpp native/src/settled_world_discovery.cpp)
          timeout 1100 g++-13 "${flags[@]}" "${sources[@]}" "$RUNNER_TEMP/pf532_diag.cpp" -o build/pf532-diag/candidate >build/pf532-diag/logs/build.log 2>&1 || { tail -160 build/pf532-diag/logs/build.log; exit 1; }
      - name: Run one bounded exact-input lane
        run: |
          set -euo pipefail
          timeout 1000 build/pf532-diag/candidate build/pf532-diag/fixtures/stress-canvas.csv build/pf532-diag/replay-tape.csv 1 0 >build/pf532-diag/candidate-w1-camera0.csv 2>build/pf532-diag/logs/run.log
          python3 - <<'PY'
          import csv, json, pathlib
          root=pathlib.Path("build/pf532-diag")
          rows=list(csv.DictReader((root/"candidate-w1-camera0.csv").open()))
          last={k:int(rows[-1][k]) for k in (
              "gas_reference_passes","gas_reuses","gas_component_reuses",
              "gas_member_validations","gas_invalidation_pairs","gas_component_invalidations",
              "gas_cache_builds","gas_valid_components","gas_members","gas_dirty_chunks",
              "gas_dirty_chunks_queued","gas_capacity_fallbacks","gas_budget_fallbacks",
              "gas_cache_build_cells","gas_member_initializations","gas_member_builds",
              "gas_component_proof_checks","gas_restart_fallbacks","seed_cells","bfs_cells","relabel_cells")}
          first_activity={}
          for key in ("gas_dirty_chunks_queued","gas_capacity_fallbacks","gas_budget_fallbacks",
                      "gas_cache_build_cells","gas_member_initializations","gas_member_builds",
                      "gas_component_proof_checks","gas_cache_builds","gas_component_reuses"):
              first_activity[key]=next((int(r["tick"]) for r in rows if int(r[key])>0),None)
          out={"schema":"pf532-gas-cache-admission-diagnostic-v1","ticks":len(rows),
               "final":last,"first_activity_tick":first_activity}
          (root/"diagnosis.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("PF532_GAS_CACHE_DIAGNOSTIC",json.dumps(out,sort_keys=True))
          PY
      - name: Preserve bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pf532-gas-cache-diagnostic-${{ github.run_id }}
          path: build/pf532-diag/
          retention-days: 30
          if-no-files-found: warn
