name: SOL281 unresolved-cause assembly
# Retry after correcting the exact staged patch chunk.

on:
  push:
    branches: [work/sol281-native-detachment-20261027]
    paths: ['.github/workflows/sol281-unresolved-assemble.yml']

permissions:
  contents: write

jobs:
  assemble:
    if: github.repository == 'techrote/cybersand'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact unresolved-cause patch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'EOF'
          e6dd87ba68136f3484b60035d44b4c092701d1804441d9023aac2d1bdf3f4393  tools/soliding/sol281_unresolved_patch.00
          b853c768abb0907b3bb662dd45b14baeb7f506fa6c6e8e8cdca3c6625c3ff565  tools/soliding/sol281_unresolved_patch.01
          5f9bfb6fb6d0e7aeeb30887ff30d829e3e9cec9fe7d6ce6f732497aaa3071f77  tools/soliding/sol281_unresolved_patch.02
          e974b9f7ade81affcabe2f9c172f72a670a18f686990c4fd61d5a0f38bf859db  tools/soliding/sol281_unresolved_patch.03
          899bd4eea7a06d952560e251e1638713ad469680503b6e7493227631c9423ebf  tools/soliding/sol281_unresolved_patch.04
          EOF
          cat tools/soliding/sol281_unresolved_patch.0* > /tmp/sol281-unresolved.patch
          echo 'b75e7c6e62b0c78b5201a5498dcd8eb2cee9c8475b592d71ad2e3e9d5dbdbf43  /tmp/sol281-unresolved.patch' | sha256sum -c -
          git apply --check /tmp/sol281-unresolved.patch
          git apply /tmp/sol281-unresolved.patch
          test -f godot/tests/test_solid_detachment_unresolved_diagnostics.gd
          python3 tools/ci/check_ci_provider_policy.py
          git diff --check
          rm tools/soliding/sol281_unresolved_patch.0*
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(sol281): classify unresolved coupling causes [skip ci]'
          git push origin HEAD:refs/heads/work/sol281-native-detachment-20261027
