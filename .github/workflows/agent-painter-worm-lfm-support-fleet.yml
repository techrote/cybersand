name: WORM LFM support fleet four-episode evidence gate (source-only)
on:
  push:
    branches:
      - research/612-worm-lfm-support
    paths:
      - 'experiments/agent_painter/worm/support_lfm/**'
      - '.github/workflows/agent-painter-worm-lfm-support-fleet.yml'
  pull_request:
    paths:
      - 'experiments/agent_painter/worm/support_lfm/**'
      - '.github/workflows/agent-painter-worm-lfm-support-fleet.yml'
permissions:
  contents: read
  actions: read
jobs:
  fleet-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only four-process audit regressions (not resident models)
        run: |
          python3 -m py_compile experiments/agent_painter/worm/support_lfm/fleet_episode_audit.py
          python3 -m py_compile experiments/agent_painter/worm/support_lfm/capture_fleet_pulse.py
          python3 -m py_compile experiments/agent_painter/worm/support_lfm/compare_fleet_capacity.py
          python3 experiments/agent_painter/worm/support_lfm/test_fleet_episode_audit.py -v
      - name: Generate actual original W0-only adverse/control PNGs
        run: |
          python3 experiments/agent_painter/worm/common/worm.py \
            --output worm-lfm-fleet-w0-controls \
            --seeds 51001,51002,51003,51004 \
            --families greebles,pipework,architecture \
            --modes random,wall,fidget \
            --steps 16
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          folder=Path("worm-lfm-fleet-w0-controls")
          png=sorted(folder.glob("*.png"))
          traces=sorted(folder.glob("*.json"))
          assert len(png)==len(traces)==36
          manifest={"schema":"worm-lfm-fleet-controls-only/1",
                    "trained_model_inference":False,"resident_inference_processes":0,
                    "native_godot":False,"decision_budget":16,
                    "files":[{"path":p.relative_to(folder).as_posix(),"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
                             for p in png+traces]}
          (folder/"SHA256.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          assert all((folder / x["path"]).is_file() and
                     hashlib.sha256((folder / x["path"]).read_bytes()).hexdigest()==x["sha256"]
                     for x in manifest["files"]), "invalid artifact-relative hash receipt"
          print("W0 source-only original PNG/trace pairs:",len(png))
          PY
      - name: Archive clearly labelled W0-only baseline gallery
        uses: actions/upload-artifact@v4
        with:
          name: worm-lfm-fleet-W0-CONTROLS-NOT-MODELS
          path: worm-lfm-fleet-w0-controls/
          if-no-files-found: error
          retention-days: 14

  original-w12-fleet-replay:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout current support audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout original immutable W0 authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: techrote/cybersand
          ref: 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          path: original-w0
          persist-credentials: false
      - name: Source/policy preflight without model or optimizer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original-w0 rev-parse HEAD)" = 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          test "$(git hash-object original-w0/experiments/agent_painter/worm/common/worm.py)" = 8979b6f0296e81051194bacc907992d38e006605
          python3 -m py_compile experiments/agent_painter/worm/support_lfm/audit_w12_original.py
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/lfm-w12-ci-policy.json
          mkdir -p evidence/producer evidence/independent/gallery
          git rev-parse HEAD > evidence/independent/support-source.txt
          git -C original-w0 rev-parse HEAD > evidence/independent/w0-source.txt
      - name: Download fixed original W12 artifacts; refuse producer revision drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/techrote/cybersand/actions/runs/43766388326 --jq .head_sha)" = 0eea751c37d69589717681eca1703882d17587a9
          test "$(gh api repos/techrote/cybersand/actions/runs/43766388326 --jq .conclusion)" = success
          gh api repos/techrote/cybersand/actions/artifacts/14182048141/zip > evidence/producer/alpha.zip
          gh api repos/techrote/cybersand/actions/artifacts/14182129882/zip > evidence/producer/beta.zip
      - name: Independently replay all four original model-scored PNGs and controls
        run: |
          set -euo pipefail
          python3 experiments/agent_painter/worm/support_lfm/audit_w12_original.py \
            --alpha evidence/producer/alpha.zip \
            --beta evidence/producer/beta.zip \
            --w0-dir original-w0/experiments/agent_painter/worm/common \
            --output evidence/independent/w12-original-audit.json
          python3 - <<'PY'
          import json, pathlib, zipfile, sys
          sys.path.insert(0, 'original-w0/experiments/agent_painter/worm/common')
          import worm
          gallery=pathlib.Path('evidence/independent/gallery')
          report=json.loads(pathlib.Path('evidence/independent/w12-original-audit.json').read_text())
          assert report['original_W0_png_replays']==4 and report['actual_model_score_forwards']==48
          for shard in ('alpha','beta'):
              with zipfile.ZipFile(f'evidence/producer/{shard}.zip') as z:
                  p=f'w12-fleet/{shard}/'
                  summary=json.loads(z.read(p+'summary.json'))
                  for lease,seed in zip(summary['distinct_lease_ids'],summary['independent_seeds']):
                      base=p+lease+'/'
                      (gallery/f'{seed}-ORIGINAL-W12-trained-score.png').write_bytes(z.read(base+'original-w0.png'))
                      fam=json.loads(z.read(base+'completed.json'))['family']
                      for mode in ('random','wall','fidget'):
                          ctl=worm.run(seed=seed,family=fam,mode=mode,steps=12,size=96)
                          (gallery/f'{seed}-W0-{mode}-control.png').write_bytes(worm.png_bytes(ctl))
          assert len(list(gallery.glob('*.png')))==16
          print('Four original model-scored W0 PNGs + 12 source-faithful matched W0 controls')
          PY
      - name: Preserve original producer and independent evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worm-lfm-W12-four-live-ORIGINAL-support-NO-optimizer
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
