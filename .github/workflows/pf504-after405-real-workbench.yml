name: PF504 on accepted #405 real 2048x1024 workbench BCCB
on:
  push:
    branches: [integration/pf504-after-405-20261107]
    paths:
      - '.github/workflows/pf504-after405-real-workbench.yml'
      - 'godot/tests/pf504_stress_canvas_actual_workbench.gd'
      - 'tools/ci/pf504_after405_real_workbench_readback.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pf504-post405-workbench-${{ github.run_id }}
  cancel-in-progress: false
env:
  BASE_SOURCE: 81bbd5ff5cf366159e2b8a630609359c13560080
  CANDIDATE_SOURCE: ${{ github.sha }}
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_URL: "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7"
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  RAPIER_SHA256: 566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a
jobs:
  actual-workbench-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout test-only experimental harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
      - name: Checkout exact admitted C2048 control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 81bbd5ff5cf366159e2b8a630609359c13560080
          path: baseline
      - name: Checkout exact PR504 optimized C2048 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Lock production source, capacity and authored stress-canvas
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SOURCE"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          python3 -m py_compile harness/tools/ci/pf504_after405_real_workbench_readback.py
          python3 harness/tools/ci/check_ci_provider_policy.py
          diff -r --exclude=world_pressure.inc baseline/native/src candidate/native/src
          diff -r baseline/native/include candidate/native/include
          diff -r baseline/godot/native_extension candidate/godot/native_extension
          cmp baseline/godot/scripts/workbench_setup.gd candidate/godot/scripts/workbench_setup.gd
          cmp baseline/godot/tests/pf_c2048_actual_workbench.gd candidate/godot/tests/pf_c2048_actual_workbench.gd
          test -n "$(diff -q baseline/native/src/world_pressure.inc candidate/native/src/world_pressure.inc || true)"
          echo "71723fa32bbd29aafe93f1a8dd233cece1eec7ed295da81c1e021f635085c17a  baseline/native/src/world_pressure.inc" | sha256sum -c --strict
          echo "899ada71b89d30ba063e047bdd5b02346948008f1b7c0bec9fa0f2272e4d86ec  candidate/native/src/world_pressure.inc" | sha256sum -c --strict
          printf 'baseline=%s\ncandidate=%s\nharness=%s\n' "$BASE_SOURCE" "$CANDIDATE_SOURCE" "$(git -C harness rev-parse HEAD)" > evidence/source-identities.txt
          sha256sum baseline/godot/scripts/workbench_setup.gd harness/godot/tests/pf504_stress_canvas_actual_workbench.gd >> evidence/source-identities.txt
          cp harness/godot/tests/pf504_stress_canvas_actual_workbench.gd baseline/godot/tests/pf504_stress_canvas_actual_workbench.gd
      - name: Stage pinned real Rapier dependency
        run: |
          set -euo pipefail
          git -C baseline lfs install --local
          git -C baseline lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" --exclude=""
          echo "$RAPIER_SHA256  baseline/godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | sha256sum -c --strict
      - name: Prepare pinned SCons and godot-cpp sources
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r baseline/tools/requirements-build.txt
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'
          mkdir -p "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
      - name: Compile two source-matched native libraries with one compiler
        run: |
          set -euo pipefail
          export GODOT_CPP_ROOT="$RUNNER_TEMP/godot-cpp"
          export SCONS_PYTHON="$RUNNER_TEMP/scons/bin/python"
          export SCONS_JOBS=2 CYBERSAND_REAL_CXX=/usr/bin/g++-13 LINUX_CXX=/usr/bin/g++-13
          (cd baseline && timeout 2100 bash tools/build_pinned_godot_cpp.sh linux) > evidence/godot-cpp-build.log 2>&1 || { tail -100 evidence/godot-cpp-build.log; exit 1; }
          for arm in B C; do
            if [ "$arm" = B ]; then source_dir=baseline; else source_dir=candidate; fi
            export CYBERSAND_NATIVE_OUTPUT="$RUNNER_TEMP/pf504-$arm.so"
            (cd "$source_dir" && timeout 2100 bash tools/build_native_extension.sh) > "evidence/native-build-$arm.log" 2>&1 || { tail -120 "evidence/native-build-$arm.log"; exit 1; }
            test -s "$CYBERSAND_NATIVE_OUTPUT"
            file "$CYBERSAND_NATIVE_OUTPUT" >> evidence/native-runtime-types.txt
            sha256sum "$CYBERSAND_NATIVE_OUTPUT" | cut -d' ' -f1 > "evidence/runtime-$arm.sha256"
          done
          test "$(cat evidence/runtime-B.sha256)" != "$(cat evidence/runtime-C.sha256)"
          cp "$RUNNER_TEMP/pf504-B.so" baseline/godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          (cd baseline && bash tools/check_linux_runtime_floor.sh) > evidence/abi-floor.log
          cat evidence/abi-floor.log
      - name: Fetch pinned Godot 4.7 and import actual workbench
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-pf504"
          timeout 600 curl -fL --retry 3 -o "$RUNNER_TEMP/godot-pf504.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot-pf504.zip" | sha256sum -c --strict
          unzip -q "$RUNNER_TEMP/godot-pf504.zip" -d "$RUNNER_TEMP/godot-pf504"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-pf504" -maxdepth 1 -type f -name 'Godot*' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version > evidence/godot-version.txt
          timeout 180 "$GODOT_BIN" --headless --path baseline/godot --editor --quit > evidence/import.log 2>&1 || { tail -100 evidence/import.log; exit 1; }
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Play full 2048x1024 stress-canvas with eight live Rapier barrels in B-C-C-B order
        run: |
          set -euo pipefail
          bash baseline/tools/ci/prepare_linux_display.sh
          export LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 GALLIVM_PERF=nopt
          export PF_C2048_CAPACITY=2048
          for case_id in B1 C1 C2 B2; do
            arm="$(printf '%s' "$case_id" | cut -c1)"
            repetition="$(printf '%s' "$case_id" | cut -c2)"
            if [ "$arm" = B ]; then compiled="$BASE_SOURCE"; else compiled="$CANDIDATE_SOURCE"; fi
            export PF504_BENCH_ARM="$arm" PF504_BENCH_REPEAT="$repetition" CYBERSAND_SOURCE_SHA="$compiled"
            cp "$RUNNER_TEMP/pf504-$arm.so" baseline/godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
            echo "$(cat evidence/runtime-$arm.sha256)  baseline/godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so" | sha256sum -c --strict
            if timeout 1500 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -nolisten tcp" \
              "$GODOT_BIN" --headless --path baseline/godot \
              --script res://tests/pf504_stress_canvas_actual_workbench.gd \
              > "evidence/stress-$case_id.log" 2>&1; then
              echo "PF504_WORKBENCH_EXIT $case_id 0"
            else
              ret=$?
              echo "PF504_WORKBENCH_EXIT $case_id $ret"
              tail -160 "evidence/stress-$case_id.log"
              exit 1
            fi
          done
          python3 harness/tools/ci/pf504_after405_real_workbench_readback.py evidence
      - name: Preserve original build, source and actual gameplay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pf504-post405-real-workbench-bccb-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
