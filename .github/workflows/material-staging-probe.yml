name: MATERIAL-STAGING-REUSE-001 focused Windows comparison
on:
  push:
    branches: [diagnostics/material-staging-reuse-20261116]
permissions:
  contents: read
  actions: read
concurrency:
  group: material-staging-probe-${{ github.run_id }}
  cancel-in-progress: false
env:
  CYBERSAND_EVAL_SOURCE_SHA: ${{ github.sha }}
  CYBERSAND_SOURCE_REVISION: ${{ github.sha }}
  CYBERSAND_CI_WATCHDOG_SCALE: '1'
jobs:
  windows-staging:
    name: Windows full / one-slot / two-slot staging, forward and reverse
    runs-on: windows-2022
    # Six independent 900-second process watchdogs plus preparation, import
    # and artifact headroom. None is a physical performance acceptance limit.
    timeout-minutes: 130
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify retained Windows DLLs and exact compiler inputs
        run: |
          set -euo pipefail
          mkdir -p evidence
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          python tools/ci/package_engine_lab_windows.py preflight --platform windows > evidence/source-runtime.json
          git rev-parse HEAD HEAD^{tree} > evidence/source.txt
          python tools/ci/check_ci_provider_policy.py > evidence/ci-provider.json
          python tools/ci/test_physics_freeze_comparison.py > evidence/comparison-guard-tests.log 2>&1
          python tools/ci/run_material_staging_comparison.py --self-test > evidence/staging-guard-tests.log 2>&1
      - name: Acquire and verify pinned Godot 4.7 Windows engine
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 600 -o "$RUNNER_TEMP/godot-4.7-staging.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          python - <<'PY'
          import json,os,pathlib,subprocess,sys,zipfile
          sys.path.insert(0,'tools/ci')
          from package_engine_lab_windows import CONSOLE,ENGINE_VERSION,ENGINE_ZIP_HASH,digest
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'godot-4.7-staging.zip'
          if digest(archive,'sha512')!=ENGINE_ZIP_HASH: raise RuntimeError('Pinned Godot archive SHA512 mismatch')
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'material-staging-godot'
          output.mkdir(exist_ok=False)
          with zipfile.ZipFile(archive) as bundle:
              if bundle.testzip() is not None: raise RuntimeError('Godot archive CRC failure')
              for member in bundle.infolist():
                  if not (output/member.filename).resolve().is_relative_to(output.resolve()): raise RuntimeError('Unsafe Godot archive member')
              bundle.extractall(output)
          godot=output/CONSOLE
          version=subprocess.check_output([str(godot),'--version'],text=True,timeout=30).strip()
          if version!=ENGINE_VERSION: raise RuntimeError('Wrong Godot version')
          pathlib.Path('evidence/godot.json').write_text(json.dumps({'version':version,'executable':str(godot),'executable_sha256':digest(godot),'archive_sha512':ENGINE_ZIP_HASH},indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as target: target.write('GODOT_BIN='+godot.as_posix()+'\n')
          PY
      - name: Run six serial ordinary coupled 2048 Follow arms
        run: |
          set -euo pipefail
          python -u tools/ci/run_material_staging_comparison.py --godot "$GODOT_BIN" --project godot --evidence evidence/staging-comparison --source-sha "$GITHUB_SHA" --rendering-driver opengl3_angle --timeout 900 2>&1 | tee evidence/staging-comparison.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Material-Staging-Windows-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
