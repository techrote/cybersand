name: MATERIAL-HISTORY-TARGETS-001 focused Windows comparison
on:
  push:
    branches: [diagnostics/material-staging-reuse-20261116]
permissions:
  contents: read
  actions: read
concurrency:
  group: material-staging-probe-${{ github.run_id }}
  cancel-in-progress: false
env:
  CYBERSAND_EVAL_SOURCE_SHA: ${{ github.sha }}
  CYBERSAND_SOURCE_REVISION: ${{ github.sha }}
  CYBERSAND_CI_WATCHDOG_SCALE: '1'
jobs:
  windows-staging:
    name: Windows full / two / three history targets, forward and reverse
    runs-on: windows-2022
    # Six independent 900-second process watchdogs plus preparation, import,
    # three targeted GPU correctness cases and artifact headroom. None is a physical performance acceptance limit.
    timeout-minutes: 160
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify retained Windows DLLs and exact compiler inputs
        run: |
          set -euo pipefail
          mkdir -p evidence
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          python tools/ci/package_engine_lab_windows.py preflight --platform windows > evidence/source-runtime.json
          git rev-parse HEAD HEAD^{tree} > evidence/source.txt
          python tools/ci/check_ci_provider_policy.py > evidence/ci-provider.json
          python tools/ci/test_physics_freeze_comparison.py > evidence/comparison-guard-tests.log 2>&1
          python tools/ci/run_material_staging_comparison.py --self-test > evidence/staging-guard-tests.log 2>&1
      - name: Acquire and verify pinned Godot 4.7 Windows engine
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 600 -o "$RUNNER_TEMP/godot-4.7-staging.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          python - <<'PY'
          import json,os,pathlib,subprocess,sys,zipfile
          sys.path.insert(0,'tools/ci')
          from package_engine_lab_windows import CONSOLE,ENGINE_VERSION,ENGINE_ZIP_HASH,digest
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'godot-4.7-staging.zip'
          if digest(archive,'sha512')!=ENGINE_ZIP_HASH: raise RuntimeError('Pinned Godot archive SHA512 mismatch')
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'material-staging-godot'
          output.mkdir(exist_ok=False)
          with zipfile.ZipFile(archive) as bundle:
              if bundle.testzip() is not None: raise RuntimeError('Godot archive CRC failure')
              for member in bundle.infolist():
                  if not (output/member.filename).resolve().is_relative_to(output.resolve()): raise RuntimeError('Unsafe Godot archive member')
              bundle.extractall(output)
          godot=output/CONSOLE
          version=subprocess.check_output([str(godot),'--version'],text=True,timeout=30).strip()
          if version!=ENGINE_VERSION: raise RuntimeError('Wrong Godot version')
          pathlib.Path('evidence/godot.json').write_text(json.dumps({'version':version,'executable':str(godot),'executable_sha256':digest(godot),'archive_sha512':ENGINE_ZIP_HASH},indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as target: target.write('GODOT_BIN='+godot.as_posix()+'\n')
          PY
      - name: Import exact project for the targeted GPU correctness gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,re,subprocess,time
          folder=pathlib.Path('evidence/material-gpu-correctness')
          folder.mkdir(parents=True,exist_ok=True)
          command=[os.environ['GODOT_BIN'],'--headless','--path',str(pathlib.Path('godot').resolve()),'--editor','--quit']
          receipt={'source_sha':os.environ['GITHUB_SHA'],'command':command,'timeout_seconds':240,'complete':False}
          path=folder/'import.json'
          path.write_text(json.dumps(receipt,indent=2)+'\n')
          started=time.monotonic()
          try:
              with (folder/'import.log').open('w',encoding='utf-8') as log:
                  result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=240)
              receipt['exit_code']=result.returncode
              text=(folder/'import.log').read_text(encoding='utf-8',errors='replace')
              if result.returncode!=0 or re.search(r'SCRIPT ERROR:|SHADER ERROR:|Parse Error:|Failed to load script|Failed loading resource:',text):
                  raise RuntimeError('Project import failed; inspect retained import.log')
              receipt['complete']=True
          except Exception as error:
              receipt['error']=str(error)
              raise
          finally:
              receipt['elapsed_seconds']=time.monotonic()-started
              path.write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Verify both actual ANGLE history counts and direct-update repair
        run: |
          set -euo pipefail
          # Both counts use the same transaction source. Each real GPU case has
          # the established 600s process watchdog; failure prevents all timing arms.
          export CYBERSAND_DIAG_MATERIAL_STAGING_SLOTS=3
          export CYBERSAND_DIAG_MATERIAL_COPY_MODE=runs
          for targets in 2 3; do
          export CYBERSAND_DIAG_MATERIAL_HISTORY_TARGETS="$targets"
          folder="evidence/material-gpu-correctness/history$targets"
          mkdir -p "$folder"
          python -u tools/ci/run_camera_coherence_regressions.py --godot "$GODOT_BIN" --project godot --evidence "$folder" --graphical --cases material-tiles-graphical 2>&1 | tee "$folder/runner.log"
          python - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          sys.path.insert(0,'tools/ci')
          from run_physics_freeze_comparison import need
          targets=int(os.environ['CYBERSAND_DIAG_MATERIAL_HISTORY_TARGETS'])
          folder=pathlib.Path('evidence/material-gpu-correctness')/('history'+str(targets))
          summary=json.loads((folder/'summary.json').read_text(encoding='utf-8'))
          casefolder=folder/'material-tiles-graphical'
          report=json.loads((casefolder/'material-tiles.json').read_text(encoding='utf-8'))
          text=(casefolder/'console.log').read_text(encoding='utf-8',errors='replace')
          need(summary.get('complete') is True and summary.get('source_sha')==os.environ['GITHUB_SHA'],'Wrong or incomplete GPU gate source')
          cases=summary.get('cases',[])
          need(len(cases)==1 and cases[0].get('name')=='material-tiles-graphical' and cases[0].get('graphical') is True,'Wrong GPU gate selection')
          case=cases[0]
          need(case.get('status')=='passed' and case.get('exit_code')==0,'GPU gate process failed')
          need(hashlib.sha256((casefolder/'console.log').read_bytes()).hexdigest()==case['log_sha256'],'GPU gate log differs from executed receipt')
          command=case['command']
          need('--headless' not in command and command[command.index('--rendering-driver')+1]=='opengl3_angle','GPU gate did not launch ANGLE')
          need(report.get('display')=='Windows' and report.get('driver')=='opengl3_angle','GPU gate did not execute Windows ANGLE')
          need(report.get('godot',{}).get('major')==4 and report['godot'].get('minor')==7,'GPU gate used the wrong Godot version')
          completions=re.findall(r'^MATERIAL_TILE_PUBLICATION: (\d+) assertions, (\d+) failures\s*$',text,re.M)
          need(len(completions)==1 and int(completions[0][0])==report.get('assertions') and int(completions[0][1])==report.get('failures')==0,'GPU gate marker/JSON disagree or report failures')
          need(report['assertions']>0 and report.get('histories_completed')==2 and report.get('large_completed') is True and report.get('shader_pairs_completed')==8,'Incomplete material/history/shader GPU gate')
          need({'scripts/main.gd','scripts/blit_material_publisher.gd','tests/test_material_tile_publication.gd'}<=summary.get('executed_files_sha256',{}).keys(),'Missing GPU gate executed-source identities')
          for relative,expected in summary['executed_files_sha256'].items():
              need(hashlib.sha256((pathlib.Path('godot')/relative).read_bytes()).hexdigest()==expected,'GPU gate executed source changed: '+relative)
          observations=report.get('observations',[])
          shaders=[row for row in observations if 'shader' in row]
          expected={('material_palette',0.0),('material_palette',0.37),('material_palette',1.0)}
          expected.update((name,0.37) for name in ('material_emission','material_vapour_trail','blacksite_nine_backdrop','blacksite_nine_grade','neon_reliquary_backdrop'))
          need(len(shaders)==8 and {(row['shader'],round(row['blend'],2)) for row in shaders}==expected,'Missing or duplicate appearance comparison')
          need(all(re.fullmatch(r'[0-9a-f]{64}',row.get('full_sha256','')) and row['full_sha256']==row.get('blit_sha256') for row in shaders),'GPU appearance bytes differ')
          need(sum(row.get('label')=='edit after World replacement' for row in observations)==2,'Both exact R8/RG8 history sequences did not complete')
          pools=[row for row in observations if row.get('label')=='staging pool sequence']
          need(len(pools)==6 and {(row.get('staging_slots'),tuple(row.get('extent',[]))) for row in pools}=={(slots,extent) for slots in (1,2,3) for extent in ((256,256),(317,259))},'Missing square/NPOT one/two/three-resource ring coverage')
          for row in pools:
              need(len(row.get('sequence',[]))==16,'Incomplete staging ring sequence')
              need(all(item.get('kind')=='texture2d_array' and item.get('resource_layers')==1 and item.get('layer')==0 for item in row['sequence']),'GPU ring sequence did not use independent one-layer resources')
          heights=[row for row in observations if row.get('label')=='maximum copy height']
          need(len(heights)==12 and all(row.get('height')==16383 for row in heights),'Missing maximum-height GPU cases')
          for slots in (1,2,3):
              rows=[row['publication'] for row in heights if row.get('staging_slots')==slots]
              need(len(rows)==slots*2,'Missing maximum-height ring repetitions')
              ids={}
              for slot in range(slots):
                  samples=[row for row in rows if row.get('staging_slot')==slot]
                  need(len(samples)==2 and len({row.get('staging_resource_rid') for row in samples})==1,'Maximum-height ring slot did not recur with a stable resource')
                  ids[slot]=samples[0]['staging_resource_rid']
              need(len(set(ids.values()))==slots and all(rid>0 for rid in ids.values()),'Maximum-height slots share one resource')
          copies=[row for row in observations if row.get('label')=='horizontal copy coalescing']
          case_names={'joined','skipped','atlas_row','world_row','npot'}
          need(len(copies)==20 and {(row.get('case'),row.get('mode'),row.get('channels')) for row in copies}=={(case,mode,channels) for case in case_names for mode in ('tiles','runs') for channels in (1,2)},'Missing or duplicate exact copy-mode boundary cases')
          paired={}
          for row in copies:
              pub=row['publication'];mode=row['mode'];changed=len(row['changed_indices'])
              actual=row['expected_runs'] if mode=='runs' else changed
              need(pub.get('copy_mode')==mode and pub.get('copy_destinations')==1 and pub.get('whole_gpu_copy') is False,'Copy-mode GPU case did not use the intended sparse route')
              need(pub.get('updated_tiles')==changed and pub.get('copy_run_count')==pub.get('gpu_blit_calls')==actual,'GPU boundary case reported wrong actual copy runs')
              need(pub.get('uncoalesced_gpu_blit_calls')==changed and pub.get('coalesced_gpu_blit_calls_saved')==changed-actual and pub.get('retirement_blit_calls')==1,'GPU boundary case miscounted baseline or retirement')
              need(pub.get('blit_pixels')==pub.get('uncoalesced_blit_pixels') and pub.get('estimated_target_write_bytes')==4*pub['blit_pixels'],'GPU boundary coalescing changed destination pixel area')
              need(pub.get('atlas_capacity')==4 and pub.get('submitted_bytes')==4*64*64*row['channels'],'GPU boundary coalescing changed staging capacity or bytes')
              hashes=(row.get('current_sha256'),row.get('previous_sha256'))
              need(all(isinstance(value,str) and re.fullmatch(r'[0-9a-f]{64}',value) for value in hashes),'Missing actual GPU history hashes for copy-mode comparison')
              paired.setdefault((row['case'],row['channels']),{})[mode]=(hashes,pub['submitted_bytes'],pub['blit_pixels'])
              if mode=='runs':
                  need((pub['coalesced_gpu_blit_calls_saved']>0)==(row['case'] in {'joined','atlas_row','npot'}),'GPU row-boundary case has unexpected saved copies')
          need(len(paired)==10 and all(values.get('tiles')==values.get('runs') for values in paired.values()),'Per-tile and coalesced copies differ in actual GPU histories or work volume')
          dense=[row for row in observations if row.get('label')=='dense 2048² full refresh']
          need(len(dense)==1 and dense[0]['publication'].get('submitted_bytes')==8388608,'Missing complete 2048² full-refresh proof')
          publications=[row['publication'] for row in observations if 'publication' in row]
          need(publications and all(row.get('staging_backend')=='texture2d_array' and row.get('staging_resource_layers')==1 and row.get('staging_layer')==(0 if row.get('submitted_bytes',0)>0 else -1) for row in publications),'Wrong GPU staging resource kind or layer')
          need(all(row.get('history_targets')==targets for row in publications),'GPU gate did not use the selected history count')
          densepub=dense[0]['publication']
          need(densepub.get('staging_slots')==3 and densepub.get('allocated_gpu_bytes')==targets*16777216+5+11173888*3,'Wrong bounded 2048 history/staging texture payload')
          need(densepub.get('history_storage_bytes')==targets*16777216 and densepub.get('maximum_history_cache_bytes')==targets*8388608,'Wrong history storage/cache bound')
          roles=[densepub.get(key) for key in ('current_texture_rid','previous_texture_rid','spare_texture_rid')]
          need(all(isinstance(value,(int,float)) and int(value)==value for value in roles) and roles[0]>0 and roles[1]>0 and (roles[2]>0 if targets==3 else roles[2]==0),'Missing actual history roles')
          need(len(set(roles[:targets]))==targets and densepub.get('history_target_rid')==roles[0],'History target roles are aliased or incorrectly committed')
          delayed=[row for row in observations if row.get('label')=='direct update delayed recycling']
          rounds=7 if targets==3 else 5
          need(len(delayed)==4*rounds and {(row.get('channels'),row.get('role'),row.get('turn')) for row in delayed}=={(channels,role,turn) for channels in (1,2) for role in ('current','previous') for turn in range(rounds)},'Missing delayed direct-update recycling coverage')
          need(all(re.fullmatch(r'[0-9a-f]{64}',row.get(role+'_sha256','')) and row[role+'_sha256']==row.get('expected_'+role+'_sha256') for row in delayed for role in ('current','previous')),'Direct wrapper update left stale current/previous GPU bytes after recycling')
          identities=[row for row in observations if row.get('label')=='direct update preserves Main identity']
          need(len(identities)==2 and {row.get('channels') for row in identities}=={1,2},'Missing direct-update Main identity checks')
          verified={'history_targets':targets,'allocated_gpu_bytes':densepub['allocated_gpu_bytes'],'maximum_history_cache_bytes':densepub['maximum_history_cache_bytes'],'direct_update_recycling_rows':len(delayed),'source_sha':summary['source_sha'],'complete':True,'scope':'Actual Windows ANGLE GPU correctness; no physical NVIDIA acceptance','assertions':report['assertions'],'failures':0,'shader_pairs':len(shaders),'history_sequences':2,'resource_pool_sequences':len(pools),'maximum_height_cases':len(heights),'coalescing_mode_cases':len(copies),'coalescing_mode_pairs':len(paired),'full_refresh_bytes':dense[0]['publication']['submitted_bytes'],'report_sha256':hashlib.sha256((casefolder/'material-tiles.json').read_bytes()).hexdigest(),'log_sha256':case['log_sha256']}
          (folder/'verified-gpu-gate.json').write_text(json.dumps(verified,indent=2)+'\n')
          print('MATERIAL_HISTORY_GPU_GATE',json.dumps(verified,sort_keys=True))
          PY
          done
      - name: Verify actual ANGLE prepare commit fallback and retained-spare transactions
        run: |
          set -euo pipefail
          mkdir -p evidence/material-gpu-correctness/transaction
          python -u tools/ci/run_camera_coherence_regressions.py --godot "$GODOT_BIN" --project godot --evidence evidence/material-gpu-correctness/transaction --graphical --cases material-history-graphical 2>&1 | tee evidence/material-gpu-correctness/transaction/runner.log
          python - <<'PY'
          import hashlib,json,os,pathlib,re,sys
          sys.path.insert(0,'tools/ci')
          from run_camera_coherence_regressions import validate_material_history_receipt
          from run_physics_freeze_comparison import need
          from package_engine_lab_windows import ENGINE_VERSION
          folder=pathlib.Path('evidence/material-gpu-correctness/transaction')
          summary=json.loads((folder/'summary.json').read_text(encoding='utf-8'))
          need(summary.get('complete') is True and summary.get('source_sha')==os.environ['GITHUB_SHA'],'Wrong or incomplete transaction gate source')
          cases=summary.get('cases',[])
          need(len(cases)==1 and cases[0].get('name')=='material-history-graphical','Wrong transaction GPU gate selection')
          case=cases[0];casefolder=folder/'material-history-graphical'
          log=casefolder/'console.log';receipt=casefolder/'material-history.json'
          text=log.read_text(encoding='utf-8',errors='replace')
          need(case.get('status')=='passed' and case.get('exit_code')==0 and case.get('graphical') is True,'Transaction GPU process failed')
          command=case['command']
          need('--headless' not in command and command[command.index('--rendering-driver')+1]=='opengl3_angle' and 'ANGLE' in text,'Transaction did not execute actual Windows ANGLE')
          need('Godot Engine v'+ENGINE_VERSION in text,'Transaction used the wrong pinned Godot engine')
          need(hashlib.sha256(log.read_bytes()).hexdigest()==case.get('log_sha256') and hashlib.sha256(receipt.read_bytes()).hexdigest()==case.get('receipt_sha256'),'Transaction receipt/log differs from execution record')
          need({'scripts/main.gd','scripts/blit_material_publisher.gd','tests/test_material_history_transaction.gd'}<=summary.get('executed_files_sha256',{}).keys(),'Missing transaction source identity')
          for relative,expected in summary['executed_files_sha256'].items():
              need(hashlib.sha256((pathlib.Path('godot')/relative).read_bytes()).hexdigest()==expected,'Transaction executed source changed: '+relative)
          verified=validate_material_history_receipt(json.loads(receipt.read_text(encoding='utf-8')),text)
          need(verified==case.get('material_history'),'Transaction runner and workflow receipt reduction differ')
          verified.update(source_sha=summary['source_sha'],complete=True,scope='Actual Windows ANGLE transaction correctness; no physical NVIDIA acceptance',report_sha256=case['receipt_sha256'],log_sha256=case['log_sha256'])
          (folder/'verified-gpu-gate.json').write_text(json.dumps(verified,indent=2)+'\n',encoding='utf-8')
          print('MATERIAL_TRANSACTION_GPU_GATE',json.dumps(verified,sort_keys=True))
          PY
      - name: Run six serial ordinary coupled 2048 Follow history arms
        run: |
          set -euo pipefail
          python -u tools/ci/run_material_staging_comparison.py --godot "$GODOT_BIN" --project godot --evidence evidence/staging-comparison --source-sha "$GITHUB_SHA" --rendering-driver opengl3_angle --timeout 900 --history-comparison 2>&1 | tee evidence/staging-comparison.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Material-Staging-Windows-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
