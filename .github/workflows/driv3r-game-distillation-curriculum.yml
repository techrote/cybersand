name: "DRIV3R game distillation — original Q8 anchored student (research)"
on:
  push:
    branches: [research/driv3r-game-distill-student-001]
    paths:
      - 'experiments/driv3r/training/distillation/**'
      - '.github/workflows/driv3r-game-distillation-curriculum.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: driv3r-distill-student-${{ github.ref }}
  cancel-in-progress: true
jobs:
  student-cpu:
    name: Immutable original d1 source → 450 Adam + 300 repair + D003/004/005/006 bounded students → D007 STOP repair + synthetic galleries
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: CPU dependencies
        run: python3 -m pip install --disable-pip-version-check numpy==2.2.6 pillow==11.3.0
      - name: Original real d1 teacher acquisition, exact immutable ZIP check
        env:
          GH_TOKEN: ${{ github.token }}
          DRIV3R_TEACHER_CORPUS: ${{ runner.temp }}/distill-source/original_teachers.jsonl
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/distill-source"
          gh api -H 'Accept: application/vnd.github+json' repos/techrote/cybersand/actions/artifacts/14181164165/zip > "$RUNNER_TEMP/distill-source/greyhound.zip"
          gh api -H 'Accept: application/vnd.github+json' repos/techrote/cybersand/actions/artifacts/14182441899/zip > "$RUNNER_TEMP/distill-source/branchwitch.zip"
          python3 -m experiments.driv3r.training.distillation.prepare_corpus "$RUNNER_TEMP/distill-source/greyhound.zip" "$RUNNER_TEMP/distill-source/branchwitch.zip" "$DRIV3R_TEACHER_CORPUS"
          test "$(sha256sum "$DRIV3R_TEACHER_CORPUS" | cut -d' ' -f1)" = '140342c16a0b8c6c8d2c3bc6071767885b15096d5a53bbf304979f3015c86522'
      - name: Deterministic legality, protected-cell and split tests
        env:
          DRIV3R_TEACHER_CORPUS: ${{ runner.temp }}/distill-source/original_teachers.jsonl
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib, pathlib, unittest
          root = pathlib.Path('experiments/driv3r/training/distillation')
          modules = [importlib.import_module('experiments.driv3r.training.distillation.' + p.stem)
                     for p in sorted(root.glob('test_*.py'))]
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromModule(m) for m in modules)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Genuine 450-update tiny neural student, held-out synthetic controls
        env:
          DRIV3R_TEACHER_CORPUS: ${{ runner.temp }}/distill-source/original_teachers.jsonl
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/distilled-student"
          python3 -m experiments.driv3r.training.distillation.lab --out "$RUNNER_TEMP/distilled-student" --steps 450
          cp "$DRIV3R_TEACHER_CORPUS" "$RUNNER_TEMP/distilled-student/original_teachers.jsonl"
          git rev-parse HEAD > "$RUNNER_TEMP/distilled-student/source-commit.txt"
          (cd "$RUNNER_TEMP/distilled-student" && sha256sum * > SHA256SUMS.txt)
      - name: Genuine 300-update on-policy adverse-state repair and matched synthetic evaluation
        run: |
          set -euo pipefail
          DRIV3R_TEACHER_CORPUS="$RUNNER_TEMP/distill-source/original_teachers.jsonl" \
            python3 -m experiments.driv3r.training.distillation.repair \
            --input "$RUNNER_TEMP/distilled-student/student.npz" \
            --out "$RUNNER_TEMP/distilled-student" --steps 300
          rm -f "$RUNNER_TEMP/distilled-student/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/distilled-student" && sha256sum * > SHA256SUMS.txt)
      - name: Genuine D003 multi-candidate style rehearsal and disjoint evaluation
        env:
          DRIV3R_TEACHER_CORPUS: ${{ runner.temp }}/distill-source/original_teachers.jsonl
        run: |
          set -euo pipefail
          python3 -m experiments.driv3r.training.distillation.style_restore \
            --base "$RUNNER_TEMP/distilled-student/student.npz" \
            --repair "$RUNNER_TEMP/distilled-student/repair_student.npz" \
            --corpus "$RUNNER_TEMP/distilled-student/repair_train_corpus.npz" \
            --repair-metrics "$RUNNER_TEMP/distilled-student/repair_metrics.json" \
            --out "$RUNNER_TEMP/distilled-student" --steps 160
          rm -f "$RUNNER_TEMP/distilled-student/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/distilled-student" && sha256sum * > SHA256SUMS.txt)
      - name: D004 genuine 3x180 Adam trap/style rebalance; unseen 3001-3016 test worlds
        env:
          DRIV3R_TEACHER_CORPUS: ${{ runner.temp }}/distill-source/original_teachers.jsonl
        run: |
          set -euo pipefail
          python3 -m experiments.driv3r.training.distillation.trap_rebalance \
            --base "$RUNNER_TEMP/distilled-student/student.npz" \
            --repair "$RUNNER_TEMP/distilled-student/repair_student.npz" \
            --restored "$RUNNER_TEMP/distilled-student/style_restored_student.npz" \
            --style-metrics "$RUNNER_TEMP/distilled-student/style_rehearsal_metrics.json" \
            --out "$RUNNER_TEMP/distilled-student" --steps 180
          rm -f "$RUNNER_TEMP/distilled-student/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/distilled-student" && sha256sum * > SHA256SUMS.txt)
      - name: D005 genuine 3x160 Adam frontier rescue; disjoint 4001-4016 evidence
        env:
          DRIV3R_TEACHER_CORPUS: ${{ runner.temp }}/distill-source/original_teachers.jsonl
        run: |
          set -euo pipefail
          python3 -m experiments.driv3r.training.distillation.frontier_rescue \
            --base "$RUNNER_TEMP/distilled-student/student.npz" \
            --repair "$RUNNER_TEMP/distilled-student/repair_student.npz" \
            --restored "$RUNNER_TEMP/distilled-student/style_restored_student.npz" \
            --rebalance "$RUNNER_TEMP/distilled-student/trap_rebalanced_student.npz" \
            --source-metrics "$RUNNER_TEMP/distilled-student/trap_rebalance_metrics.json" \
            --out "$RUNNER_TEMP/distilled-student" --steps 160
          rm -f "$RUNNER_TEMP/distilled-student/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/distilled-student" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: D006 honest-STOP squeeze recovery; genuine 3x140 Adam, new seed-disjoint evaluation
        env:
          DRIV3R_TEACHER_CORPUS: ${{ runner.temp }}/distill-source/original_teachers.jsonl
        run: |
          set -euo pipefail
          python3 -m experiments.driv3r.training.distillation.exhaustion_recovery \
            --base "$RUNNER_TEMP/distilled-student/frontier_student.npz" \
            --metrics "$RUNNER_TEMP/distilled-student/frontier_metrics.json" \
            --out "$RUNNER_TEMP/distilled-student" --steps 140
          rm -f "$RUNNER_TEMP/distilled-student/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/distilled-student" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: D007 local STOP hard-negative repair — three real bounded Adam students, new test worlds
        env:
          DRIV3R_TEACHER_CORPUS: ${{ runner.temp }}/distill-source/original_teachers.jsonl
        run: |
          set -euo pipefail
          python3 -m experiments.driv3r.training.distillation.stop_repair \
            --frontier "$RUNNER_TEMP/distilled-student/frontier_student.npz" \
            --exhaustion "$RUNNER_TEMP/distilled-student/exhaustion_student.npz" \
            --exhaustion-metrics "$RUNNER_TEMP/distilled-student/exhaustion_metrics.json" \
            --out "$RUNNER_TEMP/distilled-student" --steps 120
          python3 -m experiments.driv3r.training.distillation.audit_stop_repair \
            --frontier "$RUNNER_TEMP/distilled-student/frontier_student.npz" \
            --exhaustion "$RUNNER_TEMP/distilled-student/exhaustion_student.npz" \
            --out "$RUNNER_TEMP/distilled-student"
          rm -f "$RUNNER_TEMP/distilled-student/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/distilled-student" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: D017 genuine 3x200 Adam source-Q8 branch gates, 1152 matched synthetic episodes
        run: |
          set -euo pipefail
          python3 -m experiments.driv3r.training.distillation.source_parent_branch_gate \
            --corpus "$RUNNER_TEMP/distill-source/original_teachers.jsonl" \
            --d007 "$RUNNER_TEMP/distilled-student/stop_repaired_student.npz" \
            --out "$RUNNER_TEMP/distilled-student" --steps 200
          rm -f "$RUNNER_TEMP/distilled-student/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/distilled-student" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Immutable original research checkpoint and negative controls (never Git)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-distillation-student-001-${{ github.run_id }}
          path: ${{ runner.temp }}/distilled-student/
          retention-days: 90
          if-no-files-found: warn
