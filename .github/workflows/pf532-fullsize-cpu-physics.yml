name: PF532 full-size gas-cache CPU and gameplay qualification
on:
  push:
    branches: [sol/pf-gas-selective-bootstrap-20261107]
    paths:
      - '.github/workflows/pf532-fullsize-cpu-physics.yml'
      - 'native/**'
      - 'godot/tests/pf532_stress_canvas_actual_workbench.gd'
      - 'tools/ci/pf532_full_cpu_probe.py'
      - 'tools/ci/pf532_fullsize_host_probe.py'
      - 'tools/ci/pf532_fullsize_cpu_physics_readback.py'
      - 'tools/ci/pf532_stress_workbench_readback.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pf532-fullsize-cpu-${{ github.run_id }}
  cancel-in-progress: false
env:
  BASE_SOURCE: 81bbd5ff5cf366159e2b8a630609359c13560080
  CANDIDATE_SOURCE: ${{ github.sha }}
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_URL: "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7"
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  RAPIER_SHA256: 566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a
jobs:
  actual-workbench-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact candidate harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: harness
      - name: Checkout exact accepted-main control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BASE_SOURCE }}
          path: baseline
      - name: Checkout exact PR532 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: candidate
      - name: Lock production source, MAT-AUTH and authored stress-canvas
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SOURCE"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          (cd harness && python3 tools/material_catalogue/compatibility.py --check) > evidence/material-authority.json
          git -C harness diff --name-only "$BASE_SOURCE" "$CANDIDATE_SOURCE" -- native/src native/include | sort > evidence/native-source-delta.txt
          diff -u <(printf '%s\n'             native/include/cybersand/pressure_optimization.hpp             native/src/world_pressure.inc             native/src/world_pressure_cache.inc             native/src/world_pressure_cache_state.inc             native/src/world_pressure_gas_cache.inc | sort) evidence/native-source-delta.txt
          cmp baseline/godot/scripts/workbench_setup.gd candidate/godot/scripts/workbench_setup.gd
          cmp baseline/godot/native_extension/pressure_optimization_inspection.inc candidate/godot/native_extension/pressure_optimization_inspection.inc
          cp harness/godot/tests/pf532_stress_canvas_actual_workbench.gd baseline/godot/tests/pf532_stress_canvas_actual_workbench.gd
          python3 -m py_compile harness/tools/ci/pf532_stress_workbench_readback.py             harness/tools/ci/pf532_full_cpu_probe.py harness/tools/ci/pf532_fullsize_host_probe.py             harness/tools/ci/pf532_fullsize_cpu_physics_readback.py
          python3 harness/tools/ci/check_ci_provider_policy.py
          git -C baseline fetch --no-tags origin "$CANDIDATE_SOURCE"
          python3 harness/tools/ci/pf532_full_cpu_probe.py --baseline baseline --candidate candidate --out evidence
          python3 harness/tools/ci/pf532_fullsize_host_probe.py --app baseline --out evidence
          printf 'baseline=%s\ncandidate=%s\nharness=%s\n' "$BASE_SOURCE" "$CANDIDATE_SOURCE" "$(git -C harness rev-parse HEAD)" > evidence/source-identities.txt
      - name: Stage pinned Rapier
        run: |
          set -euo pipefail
          git -C baseline lfs install --local
          git -C baseline lfs pull --include="godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" --exclude=""
          echo "$RAPIER_SHA256  baseline/godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | sha256sum -c --strict
      - name: Prepare pinned SCons and godot-cpp
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r baseline/tools/requirements-build.txt
          mkdir -p "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
      - name: Compile exact baseline and candidate native libraries
        run: |
          set -euo pipefail
          export GODOT_CPP_ROOT="$RUNNER_TEMP/godot-cpp"
          export SCONS_PYTHON="$RUNNER_TEMP/scons/bin/python"
          export SCONS_JOBS=2 CYBERSAND_REAL_CXX=/usr/bin/g++-13 LINUX_CXX=/usr/bin/g++-13
          (cd baseline && timeout 2100 bash tools/build_pinned_godot_cpp.sh linux) > evidence/godot-cpp-build.log 2>&1 || { tail -100 evidence/godot-cpp-build.log; exit 1; }
          for arm in B C; do
            if [ "$arm" = B ]; then source_dir=baseline; else source_dir=candidate; fi
            export CYBERSAND_NATIVE_OUTPUT="$RUNNER_TEMP/pf532-$arm.so"
            (cd "$source_dir" && timeout 2100 bash tools/build_native_extension.sh) > "evidence/native-build-$arm.log" 2>&1 || { tail -120 "evidence/native-build-$arm.log"; exit 1; }
            test -s "$CYBERSAND_NATIVE_OUTPUT"
            sha256sum "$CYBERSAND_NATIVE_OUTPUT" | cut -d' ' -f1 > "evidence/runtime-$arm.sha256"
          done
          test "$(cat evidence/runtime-B.sha256)" != "$(cat evidence/runtime-C.sha256)"
          cp "$RUNNER_TEMP/pf532-B.so" baseline/godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          (cd baseline && bash tools/check_linux_runtime_floor.sh) > evidence/abi-floor.log
      - name: Fetch Godot 4.7 and import actual workbench
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-pf532"
          timeout 600 curl -fL --retry 3 -o "$RUNNER_TEMP/godot-pf532.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot-pf532.zip" | sha256sum -c --strict
          unzip -q "$RUNNER_TEMP/godot-pf532.zip" -d "$RUNNER_TEMP/godot-pf532"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-pf532" -maxdepth 1 -type f -name 'Godot*' | head -1)"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version > evidence/godot-version.txt
          timeout 180 "$GODOT_BIN" --headless --path baseline/godot --editor --quit > evidence/import.log 2>&1 || { tail -100 evidence/import.log; exit 1; }
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Run full 2048x1024 eight-barrel workbench B-C-C-B
        run: |
          set -euo pipefail
          bash baseline/tools/ci/prepare_linux_display.sh
          export LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 GALLIVM_PERF=nopt
          export PF_C2048_CAPACITY=2048 CYBERSAND_PF_FULL_PROFILE=1
          for case_id in B1 C1 C2 B2; do
            arm="$(printf '%s' "$case_id" | cut -c1)"
            repetition="$(printf '%s' "$case_id" | cut -c2)"
            if [ "$arm" = B ]; then compiled="$BASE_SOURCE"; else compiled="$CANDIDATE_SOURCE"; fi
            export PF532_BENCH_ARM="$arm" PF532_BENCH_REPEAT="$repetition" CYBERSAND_SOURCE_SHA="$compiled"
            cp "$RUNNER_TEMP/pf532-$arm.so" baseline/godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
            echo "$(cat evidence/runtime-$arm.sha256)  baseline/godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so" | sha256sum -c --strict
            timeout 1500 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -nolisten tcp"               "$GODOT_BIN" --headless --path baseline/godot --script res://tests/pf532_stress_canvas_actual_workbench.gd               > "evidence/stress-$case_id.log" 2>&1 || { tail -160 "evidence/stress-$case_id.log"; exit 1; }
          done
          CANDIDATE_SOURCE="$CANDIDATE_SOURCE" PYTHONPATH=harness/tools/ci             python3 harness/tools/ci/pf532_fullsize_cpu_physics_readback.py evidence
      - name: Preserve exact source, CPU, cache, worker and gameplay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pf532-fullsize-cpu-physics-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
