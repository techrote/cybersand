name: PR379 Godot 117991 Windows A/B diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/play/run_godot117991_ab.py'
      - 'tools/play/godot117991.patch'
      - '.github/workflows/play-windows-godot117991-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr379-godot117991-ab-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  APP_SHA: e7e404b696fb9fc48cdadc95a69baf3a6f5fc6d1
  EVIDENCE_DIR: ${{ github.workspace }}/evidence-pr379-godot117991-ab
  PROJECT_TEMPLATE: ${{ github.workspace }}/frozen-project-template
  AB_WORK: ${{ runner.temp }}/pr379-godot117991-ab-work
  PYTHONUTF8: '1'

jobs:
  windows-ab:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'experiment/pr379-godot117991-windows-ab-20261105') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'experiment/pr379-godot117991-windows-ab-20261105')
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Pin checkout line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out diagnostic harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check out frozen CyberSand application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e7e404b696fb9fc48cdadc95a69baf3a6f5fc6d1
          path: app
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Check out Godot 4.7 stable control A
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: godotengine/godot
          ref: 5b4e0cb0fd279832bbdd69fed5354d4e5ad26f88
          path: engine-a
          fetch-depth: 1
          persist-credentials: false

      - name: Check out Godot 4.7 stable counterfactual B
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: godotengine/godot
          ref: 5b4e0cb0fd279832bbdd69fed5354d4e5ad26f88
          path: engine-b
          fetch-depth: 1
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate diagnostic source and portable controls
        run: |
          New-Item -ItemType Directory -Path $env:EVIDENCE_DIR | Out-Null
          if ((git -C app rev-parse HEAD) -ne $env:APP_SHA) { throw 'Frozen CyberSand checkout moved' }
          if ((git -C app rev-parse 'HEAD^{tree}') -ne '3b5acd41fd7fb49ac8b06c94719fa1a700d8fd57') { throw 'Frozen CyberSand tree differs' }
          if ((git -C engine-a rev-parse HEAD) -ne '5b4e0cb0fd279832bbdd69fed5354d4e5ad26f88') { throw 'Godot A checkout moved' }
          if ((git -C engine-b rev-parse HEAD) -ne '5b4e0cb0fd279832bbdd69fed5354d4e5ad26f88') { throw 'Godot B checkout moved' }
          Push-Location harness
          python tools/ci/check_ci_provider_policy.py 2>&1 | Tee-Object "$env:EVIDENCE_DIR/provider-policy.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile tools/play/run_godot117991_ab.py
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location app
          python tools/play/test_windows_crash_contract.py 2>&1 | Tee-Object "$env:EVIDENCE_DIR/crash-contracts.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/play/test_windows_build_process.py 2>&1 | Tee-Object "$env:EVIDENCE_DIR/build-contracts.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Materialize frozen runtime inputs and project template
        timeout-minutes: 45
        run: |
          Push-Location app
          git lfs install --local
          python -c "import subprocess; subprocess.run(['git','lfs','pull','--include=godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'], check=True, timeout=1200)"
          Pop-Location
          python -c "from pathlib import Path; import shutil; src=Path('app/godot'); dst=Path(r'$env:PROJECT_TEMPLATE'); shutil.copytree(src,dst,ignore=shutil.ignore_patterns('.godot'))"
          curl.exe --fail --location --connect-timeout 60 --max-time 1200 --output "$env:RUNNER_TEMP/pr379-official-godot.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Phase 1 - reproduce with official pinned Reference O
        shell: cmd
        timeout-minutes: 180
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "CYBERSAND_CAPTURE_VS=%%i"
          if not defined CYBERSAND_CAPTURE_VS exit /b 1
          call "%CYBERSAND_CAPTURE_VS%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          python app\tools\play\run_windows_crash_capture.py --expected-source-sha "%APP_SHA%" --godot-archive "%RUNNER_TEMP%\pr379-official-godot.zip" --output "%EVIDENCE_DIR%\official-o"
          set "REFERENCE_RC=%ERRORLEVEL%"
          echo %REFERENCE_RC%>"%EVIDENCE_DIR%\official-o-runner-exit.txt"
          rem A captured crash is an expected scientific observation, not a reason to suppress later A/B work.
          exit /b 0

      - name: Install pinned SCons for matched rebuilds
        run: |
          python -m pip install --disable-pip-version-check --no-input scons==4.8.1 2>&1 | Tee-Object "$env:EVIDENCE_DIR/scons-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          scons --version 2>&1 | Tee-Object "$env:EVIDENCE_DIR/scons-version.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Phases 2 and 3 - matched A/B build, pilot and conditional expansion
        shell: cmd
        timeout-minutes: 330
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "CYBERSAND_AB_VS=%%i"
          if not defined CYBERSAND_AB_VS exit /b 1
          call "%CYBERSAND_AB_VS%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          python harness\tools\play\run_godot117991_ab.py ^
            --app app ^
            --project-template "%PROJECT_TEMPLATE%" ^
            --engine-a-source engine-a ^
            --engine-b-source engine-b ^
            --patch harness\tools\play\godot117991.patch ^
            --broker "%EVIDENCE_DIR%\official-o\tools\windows_crash_debugger.exe" ^
            --reference "%EVIDENCE_DIR%\official-o" ^
            --evidence "%EVIDENCE_DIR%\ab" ^
            --work "%AB_WORK%"
          exit /b %ERRORLEVEL%

      - name: Preserve source-bound experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr379-godot117991-ab-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence-pr379-godot117991-ab/
            !evidence-pr379-godot117991-ab/official-o/engine/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve Control A engine and PDB
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr379-godot117991-control-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            engine-a/bin/godot.windows.editor.x86_64.llvm.exe
            engine-a/bin/*.pdb
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve Counterfactual B engine and PDB
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr379-godot117991-counterfactual-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            engine-b/bin/godot.windows.editor.x86_64.llvm.exe
            engine-b/bin/*.pdb
          if-no-files-found: warn
          retention-days: 30
