name: SPROCKET WORM-001 W20 replayable material-world action-local trainer
on:
  push:
    branches: [codex/agent-painter-sprocket-568]
    paths: [experiments/agent_painter/lanes/sprocket/worm-request-v20.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: sprocket-worm-v20-${{ github.sha }}
  cancel-in-progress: false
jobs:
  experiment:
    name: W20 320 genuine CPU steps, legal-prefix witnesses and 90 paintings
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ATEN_CPU_CAPABILITY: default
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check exact source, isolation, single optimizer and owner gate
        run: |
          set -euo pipefail
          mkdir -p evidence/w20
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          r=json.loads(Path('experiments/agent_painter/lanes/sprocket/worm-request-v20.json').read_text())
          assert r['schema']=='cybersand.worm.sprocket-host-replay-material-router/20'
          assert r['root']=='kandivault/sprocket-500m'
          assert r['revision']=='eb157d4ddddc4619e661d4a2426bb2dd000fc668'
          assert r['eos']==5 and r['auxiliary_optimizer_steps']==320
          assert r['training_vms']==r['optimizers_per_vm']==1
          assert r['root_forwards']==r['root_optimizer_steps']==r['LoRA_steps']==0
          assert r['draft_hold'] and not r['native'] and not r['sealed_FINAL']
          assert r['intervention_scope']=='persistent-synthetic-world-one-cell'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/agent-painter-sprocket-568'
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha==os.environ['GITHUB_SHA']
          Path('evidence/w20/lease.json').write_text(json.dumps({
              'source_sha':sha,'run_id':os.environ['GITHUB_RUN_ID'],
              'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'one_optimizer':True,'owner_boundary':r},indent=2)+'\n')
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/worm_train_v18.py experiments/agent_painter/lanes/sprocket/worm_train_v19.py experiments/agent_painter/lanes/sprocket/worm_train_v20.py
          python3 experiments/agent_painter/lanes/sprocket/worm_train_v20.py --smoke-only
      - name: SHA-admit three immutable original completed model/optimizer/RNG checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w19" "$RUNNER_TEMP/w18" "$RUNNER_TEMP/w17"
          gh run download 43886179141 --repo techrote/cybersand --name sprocket-worm-v19-08bf72a2bcd14ef5b875036f2a1c0c4d2ab4b319 --dir "$RUNNER_TEMP/w19"
          gh run download 43884643572 --repo techrote/cybersand --name sprocket-worm-v18-54661502bdde623622e544c8614b064f331c640d --dir "$RUNNER_TEMP/w18"
          gh run download 43871037458 --repo techrote/cybersand --name sprocket-worm-v17-4536980993be7af5052b1c78dad5adb74e865855 --dir "$RUNNER_TEMP/w17"
          echo '0358824dd721118fe9e9bbad7b19d0bfd48be36ce038a18bf7b952c7f9eee01b  '"$RUNNER_TEMP/w19/campaign/onpolicy-material-replay-and-branch.pt" | sha256sum -c -
          echo '13189f3e71b0db9d6d0cb961221e649cf7d2e868ed0c66eb18a93d8378fd015b  '"$RUNNER_TEMP/w18/campaign/material-replay-plus-last-layer.pt" | sha256sum -c -
          echo '3d0fe44f303851db6f34f489eb17ff2b1f6dc5a5cfe569b0637716306594aec3  '"$RUNNER_TEMP/w17/campaign/closed-loop-history-retention.pt" | sha256sum -c -
          cp "$RUNNER_TEMP/w19/campaign/summary.json" evidence/w20/original-W19-summary.json
          cp "$RUNNER_TEMP/w18/campaign/summary.json" evidence/w20/original-W18-summary.json
      - name: Read-only SHA-admit original external synthetic W0 host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w20"
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/w20/W0.py"
          echo '81c3923cb38d7f196b99986806216388c34ebc27fd4976e168b3b370c25a323e  '"$RUNNER_TEMP/w20/W0.py" | sha256sum -c -
          cp "$RUNNER_TEMP/w20/W0.py" evidence/w20/original-W0.py
      - name: Install pinned single-thread CPU PyTorch
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/w20-venv"
          "$RUNNER_TEMP/w20-venv/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          "$RUNNER_TEMP/w20-venv/bin/python" -m pip check
          "$RUNNER_TEMP/w20-venv/bin/python" -m pip freeze --all > evidence/w20/environment.txt
      - name: Run real two-wave CPU training, world-reachability proof and matched gallery
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 2200s "$RUNNER_TEMP/w20-venv/bin/python" experiments/agent_painter/lanes/sprocket/worm_train_v20.py --w19 "$RUNNER_TEMP/w19/campaign/onpolicy-material-replay-and-branch.pt" --w18 "$RUNNER_TEMP/w18/campaign/material-replay-plus-last-layer.pt" --w17 "$RUNNER_TEMP/w17/campaign/closed-loop-history-retention.pt" --w0 "$RUNNER_TEMP/w20/W0.py" --output evidence/w20/campaign
      - name: Preserve hashes of successful and partial failure evidence
        if: always()
        run: |
          set -euo pipefail
          (cd evidence/w20 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > evidence/w20/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-worm-v20-${{ github.sha }}
          path: evidence/w20/
          if-no-files-found: warn
          retention-days: 90
