name: ENG-LAB-001 Phase B / four Water families with real Needle and native/Rapier clocks

# Research-only; stacked on #602. CI starts with one case per platform.
# Promote to full 16-case matrix only after the reference smoke passes.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/eng-lab-water-family.yml'
      - 'godot/tests/bench_engine_lab_water_family.gd'
      - 'tools/engine_lab/run_water_family_matrix.py'
      - 'docs/operations/engine-lab-water-family-comparison.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: eng-lab-water-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  GODOT_SILENCE_ROOT_WARNING: '1'
  MATRIX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # First complete reference application smoke before high-cost comparison.
  WATER_MATRIX_MODE: smoke

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows ANGLE / real Needle + native Workbench 4-Water-family reference
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/eng-lab-001-water-family-matched' && github.base_ref == 'research/eng-lab-001-passive-benchmark') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/eng-lab-001-water-family-matched'))
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.MATRIX_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source, binary materialization, repo policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATRIX_SOURCE_SHA"
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll,godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          python tools/ci/check_ci_provider_policy.py
      - name: Authenticate pinned Windows Godot 4.7
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            --output "$RUNNER_TEMP/eng-lab-water-godot.zip" \
            'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          python - <<'PY'
          import os,pathlib,sys
          sys.path.insert(0,'tools/ci')
          from run_windows_godot_regressions import prepare_godot
          prepare_godot(pathlib.Path(os.environ['RUNNER_TEMP'])/'eng-lab-water-godot.zip')
          PY
      - name: Run exact-head pinned graphical policy/Needle experiment
        run: |
          set -euo pipefail
          python tools/engine_lab/run_water_family_matrix.py \
            --godot "$RUNNER_TEMP/eng-lab-water-godot/Godot_v4.7-stable_win64_console.exe" \
            --expected-sha "$MATRIX_SOURCE_SHA" --rendering-driver opengl3_angle \
            --mode "$WATER_MATRIX_MODE" --case-timeout 360 \
            --output "build/engine-lab-water/windows"
      - name: Preserve all raw receipts, per-frame samples and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eng-lab-water-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/engine-lab-water/windows/
          if-no-files-found: warn
          retention-days: 90

  linux:
    name: Linux llvmpipe / real Needle + native Workbench 4-Water-family reference
    if: github.repository == 'techrote/cybersand' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/eng-lab-001-water-family-matched' && github.base_ref == 'research/eng-lab-001-passive-benchmark') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/eng-lab-001-water-family-matched'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.MATRIX_SOURCE_SHA }}
          fetch-depth: 0
          lfs: false
      - name: Verify exact source, native and Rapier payload, repo policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATRIX_SOURCE_SHA"
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          command -v xvfb-run
          python3 tools/ci/check_ci_provider_policy.py
      - name: Authenticate pinned Linux Godot 4.7
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            --output "$RUNNER_TEMP/eng-lab-water-godot.zip" \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
          echo '0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  '"$RUNNER_TEMP/eng-lab-water-godot.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/eng-lab-water-godot"
          unzip -tq "$RUNNER_TEMP/eng-lab-water-godot.zip"
          unzip -q "$RUNNER_TEMP/eng-lab-water-godot.zip" -d "$RUNNER_TEMP/eng-lab-water-godot"
          chmod +x "$RUNNER_TEMP/eng-lab-water-godot/Godot_v4.7-stable_linux.x86_64"
      - name: Run exact-head pinned graphical policy/Needle experiment with Xvfb
        run: |
          set -euo pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=2 GALLIVM_PERF=nopt \
            python3 tools/engine_lab/run_water_family_matrix.py \
              --godot "$RUNNER_TEMP/eng-lab-water-godot/Godot_v4.7-stable_linux.x86_64" \
              --expected-sha "$MATRIX_SOURCE_SHA" --rendering-driver opengl3 \
              --mode "$WATER_MATRIX_MODE" --case-timeout 360 \
              --output "build/engine-lab-water/linux"
      - name: Preserve all raw receipts, per-frame samples and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eng-lab-water-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/engine-lab-water/linux/
          if-no-files-found: warn
          retention-days: 90
