name: PR566 mask-coherent flyer presentation candidate

# Exact evaluated #566 source foundation; no native changes, no merge/Ready.
# Uses prequalified #566 Windows native runtime and physical Windows Godot
# graphical rendering, independent of the preceding A/B experiment.
on:
  push:
    branches: [codex/pr566-mask-coherent-flyer-20261114]
    paths:
      - '.github/workflows/pr566-mask-coherent-render.yml'
      - 'godot/scripts/main.gd'
      - 'godot/scripts/physical_actor_session.gd'
      - 'godot/scripts/workbench_presentation_coherence.gd'
      - 'godot/tests/test_workbench_presentation_coherence.gd'
      - 'godot/tests/test_pr566_mask_coherent_ab.gd'
      - 'tools/ci/run_pr566_mask_coherent_windows.py'
      - 'tools/ci/reduce_pr566_mask_coherent_ab.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr566-mask-coherent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-graphics:
    name: Actual Windows 4.7 GL/ANGLE + Rapier mask-coherent candidate A/B
    runs-on: windows-2022
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact isolated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          fetch-depth: 12

      - name: Python pinned
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify ordinary ancestry and prevent native/camera source changes
        run: |
          set -euo pipefail
          mkdir -p evidence
          git merge-base --is-ancestor 214de85adef2aaabc8e26de8612a3bf27cc1a081 HEAD
          git diff --exit-code 214de85adef2aaabc8e26de8612a3bf27cc1a081 HEAD -- \
            native godot/native_extension godot/scripts/workbench_physics_bridge.gd \
            godot/scripts/pixel_camera_transform.gd godot/scripts/simulation_worker.gd
          git rev-parse HEAD > evidence/source-head.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          git diff --name-only 214de85adef2aaabc8e26de8612a3bf27cc1a081 HEAD > evidence/changed-paths.txt

      - name: Reuse independently source-qualified PR566 Windows DLL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-pixel-integrated-build-windows-43537909868-1
          repository: techrote/cybersand
          run-id: 43537909868
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/pr566-qualified

      - name: Verify pinned Windows Rapier2D
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          echo 'b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7  godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' | sha256sum --check --strict

      - name: Acquire exact official Windows Godot 4.7
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 --output "$RUNNER_TEMP/pr566-godot-4.7.zip" 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'

      - name: Execute exact native, safety unit, input regression, eight graphical A/B arms
        run: |
          set -euo pipefail
          python tools/ci/run_pr566_mask_coherent_windows.py \
            --godot-zip "$RUNNER_TEMP/pr566-godot-4.7.zip" \
            --engine-directory "$RUNNER_TEMP/pr566-coherent-godot" \
            --evidence evidence | tee evidence/candidate-summary.log
          python -m json.tool evidence/summary.json >/dev/null

      - name: Preserve exact-source Windows frame PNGs, host traces and fail logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr566-mask-coherent-win-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
