name: WB-ART + PAINT source-built installed Workbench qualification
on:
  push:
    branches:
      - codex/wb-art-repair-20261111
      - codex/wb-art-paint-integrated-20261111
      - codex/native-pixel-scrolling-20261113
    paths:
      - '.github/workflows/wb-art-paint-qualification.yml'
      - 'tools/ci/run_workbench_qualification.py'
      - 'tools/package_explore001_candidate.py'
      - 'tools/ci/check_windows_package_modules.ps1'
      - 'tools/ci/test_workbench_profile_packaging.py'
      - 'third_party/rapier-bvh-build.lock.json'
      - 'third_party/patches/rapier-0.35.1-cooperative-bvh-join.patch'
      - 'tools/ci/stage_windows_vc_runtime.ps1'
      - 'godot/**'
      - 'native/**'
      - 'examples/worldgen/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wb-art-paint-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
  GODOT_URL: 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
  GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  RAPIER_SHA256: 566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz
  LLVM_MINGW_SHA256: cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65
  RAPIER_WINDOWS_SHA256: b54e54bd1a03ae9094b788bf869212b5405b4a04793792d5a7cd81632cb10dd7
  CYBERSAND_CI_WATCHDOG_SCALE: '1'
  WORKBENCH_INTEGRATED: ${{ github.ref_name == 'codex/wb-art-paint-integrated-20261111' || github.ref_name == 'codex/native-pixel-scrolling-20261113' }}
  CAMERA_QUALIFICATION: ${{ github.ref_name == 'codex/native-pixel-scrolling-20261113' }}

jobs:
  linux-real:
    name: Linux source-built installed generator and authoring qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout current source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve exact source and pinned Rapier identity
        run: |
          set -euo pipefail
          mkdir -p evidence/frames
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          g++-13 --version | head -1 > evidence/compiler.txt
          sha256sum godot/native_extension/cyber_native_cell_world.cpp godot/scripts/workbench_generator_dialog.gd godot/scripts/shared_workbench.gd godot/scripts/simulation_worker.gd > evidence/changed-inputs.sha256
          python3 tools/ci/check_ci_provider_policy.py > evidence/provider.json
          python3 tools/ci/test_workbench_profile_packaging.py > evidence/package-contract-tests.log 2>&1
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          echo "$RAPIER_SHA256  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so" | sha256sum -c --strict
          sha256sum godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so > evidence/rapier.sha256
      - name: Prepare exact pinned godot-cpp and SCons
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/scons-install.log 2>&1
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'
          mkdir -p "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT" > evidence/godot-cpp-fetch.log 2>&1
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
      - name: Compile and stage real source-matched native GDExtension
        id: native_runtime
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/wb-art-paint-native.so
        run: |
          set -euo pipefail
          if ! timeout 3600 bash tools/build_pinned_godot_cpp.sh linux > evidence/build-godot-cpp.log 2>&1; then
            tail -120 evidence/build-godot-cpp.log
            exit 1
          fi
          if ! timeout 3600 bash tools/build_native_extension.sh > evidence/build-native.log 2>&1; then
            tail -160 evidence/build-native.log
            exit 1
          fi
          test -s "$CYBERSAND_NATIVE_OUTPUT"
          sha256sum "$CYBERSAND_NATIVE_OUTPUT" > evidence/native-candidate.sha256
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          bash tools/check_linux_runtime_floor.sh > evidence/abi-floor.log 2>&1
      - name: Install and import Godot 4.7 with source-matched native and Rapier
        id: godot_runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-explore"
          timeout 600 curl -fL --retry 3 -o "$RUNNER_TEMP/godot-explore.zip" "$GODOT_URL" > evidence/godot-download.log 2>&1
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot-explore.zip" | sha256sum -c --strict
          unzip -q "$RUNNER_TEMP/godot-explore.zip" -d "$RUNNER_TEMP/godot-explore"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-explore" -maxdepth 1 -type f -name 'Godot*' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version > evidence/godot-version.txt
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          if ! timeout 1200 "$GODOT_BIN" --headless --path godot --editor --quit > evidence/import.log 2>&1; then
            tail -160 evidence/import.log
            exit 1
          fi
      - name: Qualify source camera coordinates and actual display-pixel scrolling
        id: camera_source
        if: env.CAMERA_QUALIFICATION == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          GALLIVM_PERF: nopt
        run: |
          set -euo pipefail
          bash tools/ci/prepare_linux_display.sh > evidence/camera-display-setup.log 2>&1
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            python3 tools/ci/run_workbench_qualification.py camera --godot "$GODOT_BIN" \
            --project godot --evidence evidence/camera-source
      - name: Retain source camera results before longer Linux regressions
        if: ${{ always() && env.CAMERA_QUALIFICATION == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-pixel-camera-linux-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/camera-source/*.log
            evidence/camera-source/*.json
            evidence/camera-source/frames/
            evidence/camera-source/*-frames/
          if-no-files-found: warn
          retention-days: 90
      - name: Validate installed profiles and real X11 generate, install, paint, save and reopen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          GALLIVM_PERF: nopt
        run: |
          set -euo pipefail
          bash tools/ci/prepare_linux_display.sh > evidence/display-setup.log 2>&1
          python3 tools/ci/run_workbench_qualification.py stage-linux --output "$RUNNER_TEMP/wb-art-paint-package"
          combined=()
          if test "$WORKBENCH_INTEGRATED" = true; then combined=(--combined); fi
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            python3 tools/ci/run_workbench_qualification.py installed --godot "$GODOT_BIN" \
            --package "$RUNNER_TEMP/wb-art-paint-package" --scratch "$RUNNER_TEMP/wb-art-paint-installed" \
            --evidence evidence/installed "${combined[@]}"
          if test "$CAMERA_QUALIFICATION" = true; then
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
              python3 tools/ci/run_workbench_qualification.py camera --godot "$GODOT_BIN" \
              --project "$RUNNER_TEMP/wb-art-paint-installed/complete/godot" --evidence evidence/camera-installed
          fi
      - name: Execute accepted agent regressions and integrated PAINT suites
        # Keep independent regression evidence when installed validation fails.
        # A prior failure still fails this job and prevents candidate publication.
        # Camera iterations already collect all independent graphical cases;
        # run the long authoring campaign once that source gate succeeds.
        if: ${{ !cancelled() && steps.native_runtime.outcome == 'success' && steps.godot_runtime.outcome == 'success' && (env.CAMERA_QUALIFICATION != 'true' || steps.camera_source.outcome == 'success') }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          GALLIVM_PERF: nopt
        run: |
          set -euo pipefail
          paint=()
          if test "$WORKBENCH_INTEGRATED" = true; then paint=(--paint); fi
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            python3 tools/ci/run_workbench_qualification.py regressions --godot "$GODOT_BIN" \
            --project godot --evidence evidence/regressions "${paint[@]}"
      - name: Retain exact-source Linux logs, inventories, runtime hashes and actual frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-art-paint-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
  cross-build:
    name: Pinned LLVM-MinGW x86_64 source-matched DLL
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record source and stage toolchains
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          python3 tools/ci/check_ci_provider_policy.py > evidence/provider.json
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/scons.log 2>&1
          "$RUNNER_TEMP/scons/bin/python" -c 'import SCons; assert SCons.__version__ == "4.10.1"'
          mkdir -p "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" init
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT" > evidence/godot-cpp-fetch.log 2>&1
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/godot-cpp" rev-parse HEAD)" = "$GODOT_CPP_COMMIT"
          timeout 1200 curl -fL --retry 3 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL" > evidence/llvm-mingw-download.log 2>&1
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          if test ! -e "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; then ln -s llvm-ar "$RUNNER_TEMP/llvm-mingw/bin/x86_64-w64-mingw32-gcc-ar"; fi
      - name: Build the pinned Windows godot-cpp library and CyberSand GDExtension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          LLVM_MINGW_ROOT: ${{ runner.temp }}/llvm-mingw
          WINDOWS_CXX: ${{ runner.temp }}/llvm-mingw/bin/x86_64-w64-mingw32-g++
          CYBERSAND_NATIVE_OUTPUT: ${{ runner.temp }}/cybersand_native.windows.x86_64.dll
        run: |
          set -euo pipefail
          if ! timeout 3600 bash tools/build_pinned_godot_cpp.sh windows > evidence/build-godot-cpp.log 2>&1; then
            tail -120 evidence/build-godot-cpp.log
            exit 1
          fi
          if ! timeout 3600 bash tools/build_native_extension_windows.sh > evidence/build-dll.log 2>&1; then
            tail -160 evidence/build-dll.log
            exit 1
          fi
          test -s "$CYBERSAND_NATIVE_OUTPUT"
          file "$CYBERSAND_NATIVE_OUTPUT" > evidence/pe-file.txt
          sha256sum "$CYBERSAND_NATIVE_OUTPUT" > evidence/native-dll.sha256
          mkdir -p build/wb-art-paint-windows
          cp "$CYBERSAND_NATIVE_OUTPUT" build/wb-art-paint-windows/
          cp evidence/source-commit.txt build/wb-art-paint-windows/
          cp evidence/native-dll.sha256 build/wb-art-paint-windows/
          python3 tools/ci/native_candidate_identity.py build/wb-art-paint-windows --create
      - name: Preserve Windows DLL for exact-head hosted process
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-art-paint-win-runtime-${{ github.run_id }}
          path: build/wb-art-paint-windows/
          if-no-files-found: error
          retention-days: 90
      - name: Retain original build/toolchain errors and source identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-art-paint-win-crossbuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
  windows-execution:
    name: Windows graphical installed generator and authoring qualification
    needs: cross-build
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout same exact production/test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download source-built candidate DLL from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wb-art-paint-win-runtime-${{ github.run_id }}
          path: build/wb-art-paint-windows
      - name: Install exact-source extension and pinned Rapier
        id: native_runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source-commit.txt
          $expected = Get-Content build/wb-art-paint-windows/source-commit.txt
          if ((git rev-parse HEAD).Trim() -ne $expected.Trim()) { throw 'Source head differs from produced DLL' }
          python tools/ci/native_candidate_identity.py build/wb-art-paint-windows
          if ($LASTEXITCODE -ne 0) { throw 'Candidate provenance refused' }
          $dll = 'build/wb-art-paint-windows/cybersand_native.windows.x86_64.dll'
          if (!(Test-Path $dll)) { throw 'Candidate DLL is absent' }
          $dest = 'godot/addons/cybersand_native/bin/cybersand_native.windows.x86_64.dll'
          Copy-Item $dll $dest -Force
          $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha | Set-Content evidence/native-dll-sha256.txt
          if (!(Select-String -Path 'build/wb-art-paint-windows/native-dll.sha256' -Pattern $sha -SimpleMatch)) { throw 'Candidate DLL hash mismatch' }
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll' --exclude=''
          $rapier = 'godot/addons/godot-rapier2d/bin/libgodot_rapier.windows.x86_64-pc-windows-msvc.dll'
          if ((Get-FileHash $rapier -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RAPIER_WINDOWS_SHA256) { throw 'Pinned Rapier DLL mismatch' }
      - name: Fetch and authenticate official pinned Godot Windows 4.7
        id: godot_runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'godot-win47.zip'
          curl.exe -fL --retry 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw 'Godot download failed' }
          $expected = '41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9'
          if ((Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected) { throw 'Pinned Godot SHA512 mismatch' }
          $output = Join-Path $env:RUNNER_TEMP 'godot-win47'
          Expand-Archive -Path $zip -DestinationPath $output
          $exe = Join-Path $output 'Godot_v4.7-stable_win64_console.exe'
          if (!(Test-Path $exe)) { throw 'Pinned Godot console executable absent' }
          (& $exe --version) | Set-Content evidence/godot-version.txt
          if (((Get-Content evidence/godot-version.txt) -join ' ') -notmatch '4.7.stable.official.5b4e0cb0f') { throw 'Godot version mismatch' }
          'GODOT_EXE=' + $exe | Out-File -Append -FilePath $env:GITHUB_ENV
      - name: Qualify source camera coordinates and actual Windows ANGLE scrolling
        id: camera_source
        if: env.CAMERA_QUALIFICATION == 'true'
        shell: pwsh
        run: |
          python tools/ci/run_workbench_qualification.py camera --godot $env:GODOT_EXE --project godot --evidence evidence/camera-source
          if ($LASTEXITCODE -ne 0) { throw 'Native-resolution camera qualification failed' }
      - name: Retain source camera results before longer Windows regressions
        if: ${{ always() && env.CAMERA_QUALIFICATION == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-pixel-camera-windows-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/camera-source/*.log
            evidence/camera-source/*.json
            evidence/camera-source/frames/
            evidence/camera-source/*-frames/
          if-no-files-found: warn
          retention-days: 90
      - name: Package a source-matched owner desktop candidate
        shell: pwsh
        run: |
          python tools/ci/test_workbench_profile_packaging.py *> evidence/package-contract-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Package integrity contract tests failed' }
          $notices = Join-Path $env:RUNNER_TEMP 'godot-notices'
          New-Item -ItemType Directory -Force $notices | Out-Null
          foreach ($name in @('LICENSE.txt','COPYRIGHT.txt')) {
            curl.exe -fL --retry 3 -o (Join-Path $notices $name) "https://raw.githubusercontent.com/godotengine/godot/5b4e0cb0f/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Godot notices download failed' }
          }
          if ((Get-FileHash (Join-Path $notices 'LICENSE.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b0435e3b3e4e55238f05f4b306f30524a1b2e20147810d436eaa554fa6855c80' -or (Get-FileHash (Join-Path $notices 'COPYRIGHT.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cb1980c88089573bcacd7221d777c689bb8bbd778799f24c27fca0fe5f774d6d') { throw 'Pinned Godot notices hash mismatch' }
          $runtimeLicense = Join-Path $notices 'Microsoft-Visual-C-Runtime-LICENSE.docx'
          $developerLicense = Join-Path $notices 'Microsoft-Visual-Studio-2022-LICENSE.docx'
          curl.exe -fL --retry 3 -o $runtimeLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/09/Visual-C-Runtime-2015-2022-License-1.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft runtime licence download failed' }
          curl.exe -fL --retry 3 -o $developerLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft VS redistribution licence download failed' }
          $vcRuntime = Join-Path $env:RUNNER_TEMP 'cybersand-vc-runtime'
          ./tools/ci/stage_windows_vc_runtime.ps1 -Output $vcRuntime -License $runtimeLicense -DeveloperLicense $developerLicense
          $engine = Join-Path (Split-Path $env:GODOT_EXE) 'Godot_v4.7-stable_win64.exe'
          $guide = 'docs/operations/explore001-desktop-playtest.md'
          if ($env:WORKBENCH_INTEGRATED -eq 'true') { $guide = 'docs/operations/wb-art-paint-integrated-candidate.md' }
          if ($env:CAMERA_QUALIFICATION -eq 'true') { $guide = 'docs/operations/native-pixel-scrolling.md' }
          python tools/package_explore001_candidate.py --engine $engine --engine-notices $notices --vc-runtime $vcRuntime --native-candidate build/wb-art-paint-windows --output build/wb-art-paint-desktop-candidate --readme $guide
          if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging refused' }
      - name: Exercise the delivered Windows GUI in fresh non-Git installations
        shell: pwsh
        run: |
          $candidate = (Resolve-Path 'build/wb-art-paint-desktop-candidate').Path
          $validation = Join-Path $env:RUNNER_TEMP 'wb-art-paint-installed'
          $packagedEngine = Join-Path $candidate 'Godot_v4.7-stable_win64_console.exe'
          $combined = @()
          if ($env:WORKBENCH_INTEGRATED -eq 'true') { $combined = @('--combined') }
          python tools/ci/run_workbench_qualification.py installed --godot $packagedEngine --package $candidate --scratch $validation --evidence evidence/installed @combined
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows graphical qualification failed' }
          ./tools/ci/check_windows_package_modules.ps1 -Package (Join-Path $validation 'complete') -Evidence 'evidence/installed/runtime-modules.json'
          if ($env:CAMERA_QUALIFICATION -eq 'true') {
            $installedEngine = Join-Path $validation 'complete/Godot_v4.7-stable_win64_console.exe'
            $installedProject = Join-Path $validation 'complete/godot'
            python tools/ci/run_workbench_qualification.py camera --godot $installedEngine --project $installedProject --evidence evidence/camera-installed
            if ($LASTEXITCODE -ne 0) { throw 'Installed native-resolution camera qualification failed' }
          }
      - name: Execute accepted agent regressions and integrated PAINT suites on the same DLL
        if: ${{ !cancelled() && steps.native_runtime.outcome == 'success' && steps.godot_runtime.outcome == 'success' && (env.CAMERA_QUALIFICATION != 'true' || steps.camera_source.outcome == 'success') }}
        shell: pwsh
        run: |
          $paint = @()
          if ($env:WORKBENCH_INTEGRATED -eq 'true') { $paint = @('--paint') }
          python tools/ci/run_workbench_qualification.py regressions --godot $env:GODOT_EXE --project godot --evidence evidence/regressions @paint
          if ($LASTEXITCODE -ne 0) { throw 'Source-matched Windows authoring regression failed' }
      - name: Retain qualified standalone Windows owner candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.CAMERA_QUALIFICATION == 'true' && 'native-pixel-scrolling' || 'wb-art-paint' }}-windows-desktop-${{ github.sha }}
          path: build/wb-art-paint-desktop-candidate/
          if-no-files-found: error
          retention-days: 90
      - name: Retain exact-source Windows logs, inventories, runtime hashes and actual frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-art-paint-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
