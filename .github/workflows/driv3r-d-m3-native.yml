name: DRIV3R M3 single-cycle native Workbench qualification
on:
  pull_request:
    paths:
      - 'experiments/driv3r/m3_native/**'
      - '.github/workflows/driv3r-d-m3-native.yml'
  push:
    branches: [research/570-d-m3-native-smoke]
    paths:
      - 'experiments/driv3r/m3_native/qualification-request.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: driv3r-m3-native-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cheap:
    name: M3 offline preflight and exact frozen M1 guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify M1 ancestry and unchanged approved schema bytes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8fa90de6be209ed0b7bd125039e6ec8b332fb1a6 HEAD
          echo 'ebe2fa211148602c614cba0f0a40f285cba797784b70efa035832d833877f80d  experiments/driv3r/d_common/v1/interface.schema.json' | sha256sum --check --strict
      - name: Check M3 pilot controls and entire frozen contract
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check 'jsonschema==4.26.0'
          python3 -m compileall -q experiments/driv3r/m3_native
          python3 -m unittest discover -s experiments/driv3r/m3_native -p 'test_*.py' -v
          python3 experiments/driv3r/d_common/v1/verify.py
          python3 -m unittest discover -s experiments/driv3r/d_common/v1 -p 'test_*.py' -v
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py
  native:
    name: Explicit single-cycle source-built real native Workbench
    needs: cheap
    if: github.repository == 'techrote/cybersand' && github.event_name == 'push' && github.ref == 'refs/heads/research/570-d-m3-native-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin source build and execute the one authorized native recovery episode
        run: timeout --signal=TERM --kill-after=60 7800 bash experiments/driv3r/m3_native/ci_native.sh
      - name: Upload exact native receipts and readback/replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-m3-original-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/driv3r-m3/
          if-no-files-found: warn
          retention-days: 90
