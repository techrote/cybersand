name: MZ-006 ModernBERT last-block CPU game-policy training (research only)
on:
  push:
    branches:
      - 'research/model-zoo-modernbert-mz006'
    paths:
      - 'experiments/driv3r/model_zoo/modernbert/**'
      - '.github/workflows/driv3r-model-zoo-modernbert.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mz006-modernbert-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modernbert-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only contract and counterfactual tests
        run: |
          python -m py_compile experiments/driv3r/model_zoo/modernbert/run.py
          python -m unittest -v experiments.driv3r.model_zoo.mamba130.test_world
          python -m unittest -v experiments.driv3r.model_zoo.mamba130.test_counterfactual
          python -m unittest -v experiments.driv3r.model_zoo.modernbert.test_modernbert
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.3' 'pillow==11.3.0'
          python -m pip freeze > "$RUNNER_TEMP/mz006-resolved-packages.txt"
      - name: Real ModernBERT pretrained-layer CPU training and matched controls
        run: |
          python -m experiments.driv3r.model_zoo.modernbert.run \
            --out "$RUNNER_TEMP/mz006-modernbert" \
            --train-seeds 14 --dev-seeds 4 --steps 9 --updates 96 \
            --batch-size 8 --eval-batch 8 --rollout-steps 16
      - name: Verify exact source, pretrained weights, optimizer and original evidence
        run: |
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mz006-modernbert'
          r=json.loads((p/'results.json').read_text())
          assert r['schema']=='MZ006-MODERNBERT-GAME-v1'
          assert r['source_sha']==os.environ['GITHUB_SHA']
          assert r['revision']=='8949b909ec900327062f0ebf497f51aef5e6f0c8'
          assert 140_000_000<=r['encoder_parameters']<=170_000_000
          assert 500_000<=r['trainable_parameters']<=15_000_000
          assert r['pretrained_layer_tuned']>=20
          assert len(r['training_losses'])==len(r['frozen_head_losses'])==len(r['structured_losses'])==96
          assert r['train_examples']>=400 and r['test_examples']>=100
          assert r['scores']['modernbert_tuned']['test']['paired']['changed_target_pairs']>=100
          assert all(x in r['scores'] for x in ('modernbert_tuned','modernbert_frozen','structured','majority'))
          assert len(r['traces'])==16 and all(x['turns']>0 for x in r['traces'])
          ck=p/'modernbert_game_lastblock.pt'
          assert ck.stat().st_size>100_000
          assert hashlib.sha256(ck.read_bytes()).hexdigest()==r['checkpoint_sha256']
          import torch
          state=torch.load(ck,map_location='cpu',weights_only=True)
          assert state['source_sha']==r['source_sha']
          assert state['last_pretrained_layer']==r['pretrained_layer_tuned']
          assert len(state['trainable_state'])>=10
          from PIL import Image
          with Image.open(p/'rollouts.png') as im:
              im.verify()
          PY
      - name: Preserve checkpoint, metrics and original game traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mz006-modernbert-${{ github.sha }}
          path: ${{ runner.temp }}/mz006-modernbert/**
          if-no-files-found: warn
          retention-days: 14
