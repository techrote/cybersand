name: WB-AGENT-527 real four-tool foundation composition

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'godot/scripts/workbench_agent_four_tool_bridge.gd'
      - 'godot/scripts/workbench_agent_step_sequence.gd'
      - 'godot/tests/test_workbench_agent_four_tool_join.gd'
      - 'godot/tests/test_workbench_agent_signed_join.gd'
      - 'godot/tests/test_workbench_agent_hopper_godot.gd'
      - 'godot/tests/test_workbench_agent_step_sequence.gd'
      - 'docs/audits/2026-11-07-wb-agent-527-step-stop-native.md'
      - '.github/workflows/wb-agent-527-join.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-agent-527-join-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actual-native-godot-four-tool-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE: build/wb-agent-527-join
      WB_AGENT_527_IMAGE_DIR: ${{ github.workspace }}/build/wb-agent-527-join
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Qualify integrated source or compose the isolated upstream foundation
        env:
          FOUNDATION_SHA: 8f07084aeb4c8fbda5caf371ad791848c120fedf
          COMMON_BASE: 1f82dac1cebc9b38a319153354e4bcc774289417
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          if test -f godot/scripts/workbench_authoring_host.gd; then
            # A composed consumer already owns its reviewed foundation. Never
            # replace it or test an uncommitted merge of an older dependency.
            git diff --exit-code HEAD
            git rev-parse HEAD > "$EVIDENCE/foundation-sha.txt"
            git rev-parse 'HEAD^{tree}' > "$EVIDENCE/foundation-tree.txt"
            git rev-parse 'HEAD^{tree}' > "$EVIDENCE/QUALIFIED-INTEGRATED-TREE.txt"
            git status --short > "$EVIDENCE/uncommitted-status.txt"
          else
            git fetch --no-tags --depth=100 origin "$FOUNDATION_SHA"
            test "$(git merge-base HEAD "$FOUNDATION_SHA")" = "$COMMON_BASE"
            # #526 and accepted main overlap in some documentation routes.
            # Preserve accepted-main content for overlapping doc hunks;
            # all Godot executable paths are independently owned and disjoint.
            git -c user.name='WB-Agent CI' -c user.email='ci@users.noreply.github.com' \
              merge -X ours --no-commit --no-ff "$FOUNDATION_SHA"
            test -z "$(git diff --name-only --diff-filter=U)"
            printf '%s\\n' "$FOUNDATION_SHA" > "$EVIDENCE/foundation-sha.txt"
            git rev-parse "$FOUNDATION_SHA^{tree}" > "$EVIDENCE/foundation-tree.txt"
            git write-tree > "$EVIDENCE/COMPOSED-UNCOMMITTED-TREE.txt"
            git diff --cached --name-only "$COMMON_BASE" > "$EVIDENCE/composed-changed-paths.txt"
            git status --short > "$EVIDENCE/uncommitted-status.txt"
          fi
      - name: Record exact source and diff
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD | tee "$EVIDENCE/source-sha.txt"
          git rev-parse 'HEAD^{tree}' | tee "$EVIDENCE/source-tree.txt"
          git diff --check HEAD | tee "$EVIDENCE/diff-check.log"
          python3 tools/ci/check_ci_provider_policy.py | tee "$EVIDENCE/provider.json"
      - name: Materialize same-source pinned native and Rapier GDExtensions
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so,godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude='' 2>&1 | tee "$EVIDENCE/lfs.log"
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          paths=['godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so',
                 'godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so']
          result={}
          for name in paths:
              data=Path(name).read_bytes()
              assert len(data)>1024 and not data.startswith(b'version https://git-lfs'),name
              result[name]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          Path('build/wb-agent-527-join/runtime-hashes.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Fetch verified Godot 4.7 from locked upstream
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('third_party/godot-runtime.lock.json').read_text())
          Path('build/wb-agent-527-join/godot-lock.json').write_text(json.dumps(lock,indent=2)+'\n')
          Path('build/wb-agent-527-join/godot-url.txt').write_text(lock['editor']['origin_url']+'\n')
          PY
          curl --fail --location --connect-timeout 45 --max-time 260 \
            --output "$RUNNER_TEMP/wb-agent-527-godot.zip" "$(cat "$EVIDENCE/godot-url.txt")"
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          lock=json.loads(Path('third_party/godot-runtime.lock.json').read_text())
          archive=Path(os.environ['RUNNER_TEMP'])/'wb-agent-527-godot.zip'
          assert archive.stat().st_size==lock['editor']['size']
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==lock['editor']['sha256']
          binary='Godot_v4.7-stable_linux.x86_64'
          dest=Path(os.environ['RUNNER_TEMP'])/'wb-agent-527-godot'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None and z.namelist().count(binary)==1
              z.extract(binary,dest)
          (dest/binary).chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('GODOT_BIN='+str(dest/binary)+'\n')
          PY
      - name: Import Godot and execute combined actual four-tool + native Stop acceptance
        timeout-minutes: 10
        run: |
          set -euo pipefail
          "$GODOT_BIN" --version | tee "$EVIDENCE/godot-version.txt"
          grep -Fx '4.7.stable.official.5b4e0cb0f' "$EVIDENCE/godot-version.txt"
          timeout 150 "$GODOT_BIN" --headless --path godot --editor --import --quit 2>&1 | tee "$EVIDENCE/import.log"
          timeout 420 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$GODOT_BIN" --path godot --rendering-method gl_compatibility \
            --script res://tests/test_workbench_agent_four_tool_join.gd \
            2>&1 | tee "$EVIDENCE/real-four-tool-join-original.log"
          grep -E 'WB_AGENT_527_JOIN: [0-9]+ assertions, 0 failures' "$EVIDENCE/real-four-tool-join-original.log"
          timeout 420 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$GODOT_BIN" --path godot --rendering-method gl_compatibility \
            --script res://tests/test_workbench_agent_signed_join.gd \
            2>&1 | tee "$EVIDENCE/real-signed-four-tool-experimental.log"
          grep -E 'WB_AGENT_527_SIGNED_JOIN: [0-9]+ assertions, 0 failures' "$EVIDENCE/real-signed-four-tool-experimental.log"
          grep -Fq 'func agent_manual_intent_revision()' godot/scripts/simulation_worker.gd
          timeout 420 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$GODOT_BIN" --path godot --rendering-method gl_compatibility \
            --script res://tests/test_workbench_agent_step_sequence.gd \
            2>&1 | tee "$EVIDENCE/real-composed-step-final-ack-original.log"
          grep -E 'WB_AGENT_527_STEP: [0-9]+ assertions, 0 failures' "$EVIDENCE/real-composed-step-final-ack-original.log"
          grep -F 'WB_AGENT_527_FINAL_ACK_CONFLICT_RESULT ' "$EVIDENCE/real-composed-step-final-ack-original.log"
          if grep -Fq 'WB_AGENT_527_FINAL_ACK_CONFLICT_NOT_APPLICABLE' "$EVIDENCE/real-composed-step-final-ack-original.log"; then
            echo 'ERROR: composed final-ACK regression was skipped' >&2
            exit 1
          fi
      - name: Source-lock the unchanged frozen v2 Sand-hopper and run actual four-tool experiment
        timeout-minutes: 20
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '549a1db2520bcfb35f068f46b62320d7325d6297037ca2faf23c3b488d80347c' \
            'native/tests/fixtures/wb_agent_sand_hopper_v2.tsv' | sha256sum --check -
          cp native/tests/fixtures/wb_agent_sand_hopper_v2.tsv \
            godot/tests/wb-agent-527-v2-runtime.tsv
          timeout 1000 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            "$GODOT_BIN" --path godot --rendering-method gl_compatibility \
            --script res://tests/test_workbench_agent_hopper_godot.gd \
            2>&1 | tee "$EVIDENCE/real-32-sand-four-tool-experimental.log"
          grep -E 'WB_AGENT_527_HOPPER_GODOT: [0-9]+ assertions, 0 failures' \
            "$EVIDENCE/real-32-sand-four-tool-experimental.log"
      - name: Preserve first-failure source/worker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-agent-527-join-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/wb-agent-527-join/
          if-no-files-found: error
          retention-days: 90
