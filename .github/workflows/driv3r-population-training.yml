name: DRIV3R population game policy training

on:
  push:
    branches:
      - research/570-population-game-policy-001
    paths:
      - 'experiments/driv3r/training/population/**'
      - '.github/workflows/driv3r-population-training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Guardrail unit tests
        run: python -m unittest discover -s experiments/driv3r/training/population -p 'test_*.py' -v
      - name: Train actual population policies on synthetic worlds
        run: python experiments/driv3r/training/population/population_lab.py --output /tmp/population-evidence --seed 619 --population 3 --train-episodes 36 --selection-episodes 8 --test-episodes 12
      - name: Train P1 novelty/reward candidate population and frozen-observation controls
        run: python experiments/driv3r/training/population/population_p1.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p1 --seed 620 --offspring 4 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12
      - name: Replicate P1 population training across four independent seed cohorts
        run: |
          for cohort_seed in 621 622 623 624; do
            python experiments/driv3r/training/population/population_p1.py \
              --p0-output /tmp/population-evidence \
              --output /tmp/population-evidence/p1_replica_${cohort_seed} \
              --seed "${cohort_seed}" \
              --offspring 4 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12
          done
      - name: Train P2 matched optimizer-time novelty versus reward-only population (cohort 625)
        run: python experiments/driv3r/training/population/population_p2.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p2_625 --seed 625 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12
      - name: Replicate P2 with independent unseen worlds and population (cohort 626)
        run: python experiments/driv3r/training/population/population_p2.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p2_626 --seed 626 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12
      - name: Train P3 four-arm causal ablation with 60-step heldout stress (cohort 627)
        run: python experiments/driv3r/training/population/population_p3.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p3_627 --seed 627 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12 --long-horizon 60
      - name: Replicate P3 independently with unseen worlds and matched four-arm policies (cohort 628)
        run: python experiments/driv3r/training/population/population_p3.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p3_628 --seed 628 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12 --long-horizon 60
      - name: Train P4 four-arm post-episode phenotype-feedback population (cohort 629)
        run: python experiments/driv3r/training/population/population_p4.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p4_629 --seed 629 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12 --horizon 60
      - name: Replicate P4 independently against unseen game worlds (cohort 630)
        run: python experiments/driv3r/training/population/population_p4.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p4_630 --seed 630 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12 --horizon 60
      - name: P5 measured-novelty versus exact-value-permuted sham, seed 632
        run: python experiments/driv3r/training/population/population_p5.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p5_632 --seed 632 --members 3 --train-episodes 12 --selection-episodes 6 --holdout-episodes 6 --horizon 48
      - name: P5 independent matched-feedback cohort, seed 633
        run: python experiments/driv3r/training/population/population_p5.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p5_633 --seed 633 --members 3 --train-episodes 12 --selection-episodes 6 --holdout-episodes 6 --horizon 48
      - name: Train P6 multi-generation archive ecology (cohort 634)
        run: python experiments/driv3r/training/population/population_p6.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p6_634 --seed 634 --generations 3 --offspring 4 --train-episodes 8 --selection-episodes 5 --holdout-episodes 6 --horizon 48 --portfolio 4
      - name: Replicate P6 with independently held-out worlds (cohort 635)
        run: python experiments/driv3r/training/population/population_p6.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p6_635 --seed 635 --generations 3 --offspring 4 --train-episodes 8 --selection-episodes 5 --holdout-episodes 6 --horizon 48 --portfolio 4
      - name: P7 fitted train-only spatial/action encoder vs three ancestry controls, cohort 636
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/driv3r/training/population/population_p7.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p7_636 --seed 636 --generations 3 --offspring 4 --train-episodes 8 --selection-episodes 5 --holdout-episodes 6 --horizon 48 --portfolio 4
      - name: P7 independent fitted encoder and held-out cohort 637
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/driv3r/training/population/population_p7.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p7_637 --seed 637 --generations 3 --offspring 4 --train-episodes 8 --selection-episodes 5 --holdout-episodes 6 --horizon 48 --portfolio 4
      - name: P8 TRAIN-only neural temporal encoder and five-arm population, cohort 638
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/driv3r/training/population/population_p8.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p8_638 --seed 638 --generations 2 --offspring 3 --train-episodes 5 --selection-episodes 4 --holdout-episodes 4 --horizon 48 --portfolio 3 --encoder-steps 160 --probe-count 6 --probe-worlds 4
      - name: P8 independent neural temporal encoder and held-out cohort 639
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/driv3r/training/population/population_p8.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p8_639 --seed 639 --generations 2 --offspring 3 --train-episodes 5 --selection-episodes 4 --holdout-episodes 4 --horizon 48 --portfolio 3 --encoder-steps 160 --probe-count 6 --probe-worlds 4
      - name: P9 environment-adversary tournament with random/frozen controls, cohort 640
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/driv3r/training/population/population_p9.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p9_640 --seed 640 --generations 2 --offspring 3 --train-episodes 7 --selection-episodes 4 --holdout-episodes 6 --horizon 40 --portfolio 2 --proposals 3
      - name: P9 independent game-scenario curriculum cohort 641
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/driv3r/training/population/population_p9.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p9_641 --seed 641 --generations 2 --offspring 3 --train-episodes 7 --selection-episodes 4 --holdout-episodes 6 --horizon 40 --portfolio 2 --proposals 3
      - name: P9 third independent challenge-curriculum replication, cohort 642
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/driv3r/training/population/population_p9.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p9_642 --seed 642 --generations 2 --offspring 3 --train-episodes 7 --selection-episodes 4 --holdout-episodes 6 --horizon 40 --portfolio 2 --proposals 3
      - name: Retain exact experimental source for reproducibility
        run: |
          mkdir -p /tmp/population-evidence/source
          cp experiments/driv3r/training/population/*.py /tmp/population-evidence/source/
      - name: Capture exact commit and environment
        run: |
          git rev-parse HEAD > /tmp/population-evidence/source-commit.txt
          python -m pip freeze > /tmp/population-evidence/python-versions.txt
          (cd /tmp/population-evidence && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/population-sha256.txt
      - name: Preserve original training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-game-policy-evidence
          path: |
            /tmp/population-evidence/
            /tmp/population-sha256.txt
          if-no-files-found: warn
          retention-days: 14
