name: DRIV3R population game policy training

on:
  push:
    branches:
      - research/570-population-game-policy-001
    paths:
      - 'experiments/driv3r/training/population/**'
      - '.github/workflows/driv3r-population-training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Guardrail unit tests
        run: python -m unittest discover -s experiments/driv3r/training/population -p 'test_*.py' -v
      - name: Train actual population policies on synthetic worlds
        run: python experiments/driv3r/training/population/population_lab.py --output /tmp/population-evidence --seed 619 --population 3 --train-episodes 36 --selection-episodes 8 --test-episodes 12
      - name: Train P1 novelty/reward candidate population and frozen-observation controls
        run: python experiments/driv3r/training/population/population_p1.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p1 --seed 620 --offspring 4 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12
      - name: Replicate P1 population training across four independent seed cohorts
        run: |
          for cohort_seed in 621 622 623 624; do
            python experiments/driv3r/training/population/population_p1.py \
              --p0-output /tmp/population-evidence \
              --output /tmp/population-evidence/p1_replica_${cohort_seed} \
              --seed "${cohort_seed}" \
              --offspring 4 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12
          done
      - name: Train P2 matched optimizer-time novelty versus reward-only population (cohort 625)
        run: python experiments/driv3r/training/population/population_p2.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p2_625 --seed 625 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12
      - name: Replicate P2 with independent unseen worlds and population (cohort 626)
        run: python experiments/driv3r/training/population/population_p2.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p2_626 --seed 626 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12
      - name: Train P3 four-arm causal ablation with 60-step heldout stress (cohort 627)
        run: python experiments/driv3r/training/population/population_p3.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p3_627 --seed 627 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12 --long-horizon 60
      - name: Replicate P3 independently with unseen worlds and matched four-arm policies (cohort 628)
        run: python experiments/driv3r/training/population/population_p3.py --p0-output /tmp/population-evidence --output /tmp/population-evidence/p3_628 --seed 628 --members 3 --train-episodes 18 --selection-episodes 8 --holdout-episodes 12 --long-horizon 60
      - name: Retain exact experimental source for reproducibility
        run: |
          mkdir -p /tmp/population-evidence/source
          cp experiments/driv3r/training/population/*.py /tmp/population-evidence/source/
      - name: Capture exact commit and environment
        run: |
          git rev-parse HEAD > /tmp/population-evidence/source-commit.txt
          python -m pip freeze > /tmp/population-evidence/python-versions.txt
          (cd /tmp/population-evidence && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/population-sha256.txt
      - name: Preserve original training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-game-policy-evidence
          path: |
            /tmp/population-evidence/
            /tmp/population-sha256.txt
          if-no-files-found: warn
          retention-days: 14
