name: SPROCKET v3 prospective threefamily source-built native Art research (no TRAIN)
on:
  push:
    branches: [codex/agent-painter-sprocket-568]
    paths:
      - experiments/agent_painter/lanes/sprocket/threefamily-v3-native-request.json
permissions:
  contents: read
  actions: read
concurrency:
  group: sprocket-threefamily-v3-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-locked-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce explicit v3 prospective native request and hosting constraints
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile experiments/agent_painter/lanes/sprocket/threefamily_native_v3.py
          python3 - <<'PY'
          import json, os
          r=json.load(open('experiments/agent_painter/lanes/sprocket/threefamily-v3-native-request.json'))
          assert r == {
            'schema':'cybersand.agent-painter.sprocket-threefamily-native-proposals/1',
            'sequence':1,'original_native_run':43506373969,
            'original_native_source':'633920373a3d406a2ede61ce4137c324f76be23b',
            'source_compiler_run':43587356114,
            'source_compiler_sha':'af673d4497f199d2ce10a6aa7ff1b89dffc23c37',
            'candidate_groups':4,'host_seed_views':8,'native_test':True,
            'shared_train_admission':False,'model_training':False,
            'final_targets_opened':False,'draft_hold':True,
          }
          assert os.environ['GITHUB_REF']=='refs/heads/codex/agent-painter-sprocket-568'
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted'
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py --output /tmp/sprocket-v3-native-scheduling.json

  native-replay:
    needs: source-locked-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-painter-native-633920373a3d406a2ede61ce4137c324f76be23b
          run-id: '43506373969'
          github-token: ${{ github.token }}
          path: evidence/source633
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sprocket-threefamily-v3-compiler-only-af673d4497f199d2ce10a6aa7ff1b89dffc23c37-43587356114-1
          run-id: '43587356114'
          github-token: ${{ github.token }}
          path: evidence/original-screen
      - name: Verify original screen, build venv and stage 8 native cases without admission
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sprocket-v3-native"
          "$RUNNER_TEMP/sprocket-v3-native/bin/python" -m pip install 'Pillow==13.0.0'
          "$RUNNER_TEMP/sprocket-v3-native/bin/python" experiments/agent_painter/lanes/sprocket/threefamily_native_v3.py \
            --stage preflight --corpus evidence/source633/corpus \
            --original-screen evidence/original-screen/screen.json \
            --output evidence/sprocket-v3-native-preflight --source-sha "$GITHUB_SHA"
      - name: Build pinned native World and replay actual v3 Greebles/Architecture Art cases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p evidence/build
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          echo '566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' | sha256sum -c --strict
          "$RUNNER_TEMP/sprocket-v3-native/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt > evidence/build/install-scons.log 2>&1
          export GODOT_CPP_ROOT="$RUNNER_TEMP/sprocket-v3-godot-cpp"
          export SCONS_PYTHON="$RUNNER_TEMP/sprocket-v3-native/bin/python"
          export SCONS_JOBS=4
          export CYBERSAND_REAL_CXX=/usr/bin/g++-13
          export LINUX_CXX=/usr/bin/g++-13
          export CYBERSAND_NATIVE_OUTPUT="$RUNNER_TEMP/sprocket-v3-native.so"
          mkdir -p "$GODOT_CPP_ROOT"
          git -C "$GODOT_CPP_ROOT" init
          git -C "$GODOT_CPP_ROOT" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$GODOT_CPP_ROOT" fetch --depth=1 origin 101ae38034304346a46ea9ea84ae156d3e860496 > evidence/build/godot-cpp-fetch.log 2>&1
          git -C "$GODOT_CPP_ROOT" checkout --detach FETCH_HEAD
          if ! timeout 3600 bash tools/build_pinned_godot_cpp.sh linux > evidence/build/godot-cpp.log 2>&1; then tail -100 evidence/build/godot-cpp.log; exit 1; fi
          if ! timeout 3600 bash tools/build_native_extension.sh > evidence/build/native.log 2>&1; then tail -100 evidence/build/native.log; exit 1; fi
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          bash tools/check_linux_runtime_floor.sh > evidence/build/abi-floor.log 2>&1
          python3 experiments/agent_painter/native/runtime.py stamp --source-sha "$GITHUB_SHA" --output evidence/native-build.json
          timeout 600 curl -fsSL --retry 3 -o "$RUNNER_TEMP/sprocket-v3-godot.zip" 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7'
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $RUNNER_TEMP/sprocket-v3-godot.zip" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/sprocket-v3-godot"
          unzip -q "$RUNNER_TEMP/sprocket-v3-godot.zip" -d "$RUNNER_TEMP/sprocket-v3-godot"
          GODOT_BIN="$RUNNER_TEMP/sprocket-v3-godot/Godot_v4.7-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version > evidence/build/godot-version.txt
          "$RUNNER_TEMP/sprocket-v3-native/bin/python" experiments/agent_painter/lanes/sprocket/threefamily_native_v3.py \
            --stage execute --corpus evidence/source633/corpus \
            --original-screen evidence/original-screen/screen.json \
            --output evidence/sprocket-v3-native --source-sha "$GITHUB_SHA" \
            --godot "$GODOT_BIN" --runtime-manifest evidence/native-build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprocket-threefamily-v3-prospective-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/build/
            evidence/native-build.json
            evidence/sprocket-v3-native-preflight/
            evidence/sprocket-v3-native/
          if-no-files-found: warn
          retention-days: 90
