name: PUBPRES Windows full-texture storage comparison

on:
  # Rejected mechanism retained for explicit reproduction only. Subsequent
  # production changes use the installed M/I/C comparison workflow.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gameplay:
    if: github.ref == 'refs/heads/codex/pubpres-integration-001'
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the retained installed-package identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Artifact = gh api repos/${{ github.repository }}/actions/artifacts/14634619834 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $Artifact.expired -or
              $Artifact.workflow_run.id -ne 44747735460 -or
              $Artifact.workflow_run.head_sha -ne '673204d1c887eeb32dae247007316b687f177727' -or
              $Artifact.digest -ne 'sha256:7ceba45fe27c39e330f2fad892f3e365ff8ea84a33e5921c3e8ee9a9bf6aed2e') {
            throw 'The retained installed package does not match its pinned identity'
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44747735460
          name: pubpres-windows-package-44747735460-1
          path: ${{ runner.temp }}/pubpres-full-storage-package
      - name: Verify and extract the retained evaluation ZIP
        shell: pwsh
        run: |
          $Folder = Join-Path $env:RUNNER_TEMP 'pubpres-full-storage-package'
          $Zip = Join-Path $Folder 'CyberSand-Workbench-Windows-673204d1c887.zip'
          $Checksum = [IO.File]::ReadAllText($Zip+'.sha256').Split(' ')[0]
          if ($Checksum -notmatch '^[0-9a-f]{64}$' -or (Get-FileHash -LiteralPath $Zip).Hash -ne $Checksum) {
            throw 'The evaluation ZIP differs from its archived checksum'
          }
          Expand-Archive -LiteralPath $Zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'pubpres-full-storage-installed')
      - name: Compare immutable full-image update and replacement in actual Workbench
        shell: pwsh
        run: |
          python tools/pubpres_integration/full_storage_gameplay.py `
            --installed (Join-Path $env:RUNNER_TEMP 'pubpres-full-storage-installed') `
            --output (Join-Path $PWD 'full-storage-evidence') `
            --gameplay godot/tests/pubpres_source_gameplay.gd `
            --transition godot/tests/pubpres_transition.gd `
            --oracle godot/tests/pubpres_source_transition_oracle.gd `
            --campaign tools/pubpres_integration/source_campaign.json
          if ($LASTEXITCODE -ne 0) { throw 'Full-texture comparison incomplete; original evidence retained' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-full-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-storage-evidence/
          if-no-files-found: warn
          retention-days: 90
