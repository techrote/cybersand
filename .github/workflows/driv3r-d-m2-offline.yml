name: DRIV3R M2 approved-interface offline preparation
on:
  push:
    branches: [research/570-d-m2-preflight]
    paths:
      - 'experiments/driv3r/stage_d/**'
      - 'experiments/driv3r/m2_preflight/**'
      - '.github/workflows/driv3r-d-m2-offline.yml'
  pull_request:
    paths:
      - 'experiments/driv3r/stage_d/**'
      - 'experiments/driv3r/m2_preflight/**'
      - '.github/workflows/driv3r-d-m2-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driv3r-m2-offline-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  offline:
    name: M2 cheap offline ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [contract, direct, guidance, procedural]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert frozen M1 provenance and unchanged schema bytes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8fa90de6be209ed0b7bd125039e6ec8b332fb1a6 HEAD
          echo 'ebe2fa211148602c614cba0f0a40f285cba797784b70efa035832d833877f80d  experiments/driv3r/d_common/v1/interface.schema.json' | sha256sum --check --strict
          python3 -m compileall -q experiments/driv3r/d_common/v1 experiments/driv3r/stage_d
      - name: Execute exact-head contract and lane-specific offline regressions
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            contract)
              python3 -m pip install --user --disable-pip-version-check 'jsonschema==4.26.0'
              python3 experiments/driv3r/d_common/v1/verify.py
              python3 -m unittest discover -s experiments/driv3r/d_common/v1 -p 'test_*.py' -v
              ;;
            direct)
              python3 -m unittest discover -s experiments/driv3r/stage_d/direct -p 'test_*.py' -v
              ;;
            guidance)
              python3 -m unittest discover -s experiments/driv3r/stage_d/guidance -p 'test_*.py' -v
              python3 -m experiments.driv3r.stage_d.guidance.cli "$RUNNER_TEMP/m2-guide" --seed 570
              ;;
            procedural)
              python3 -m unittest discover -s experiments/driv3r/stage_d/procedural -p 'test_*.py' -v
              python3 experiments/driv3r/stage_d/procedural/runner.py --out "$RUNNER_TEMP/m2-development"
              python3 - "$RUNNER_TEMP/m2-development/index.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v['qualification']=='DEVELOPMENT_SYNTHETIC_ONLY'
          assert v['native_replay_verified'] is False and v['model_decisions']==0
          assert all(c['verification']=='OFFLINE_REPLAY_PASS' for c in v['cases'])
          print('M2 synthetic corpus cases:',len(v['cases']))
          PY
              ;;
            *) echo 'Unknown offline lane'; exit 2 ;;
          esac
      - name: State the evidence boundary
        if: always()
        run: |
          echo 'M2 source-pinned offline/static conformance only.'
          echo 'NO native World / model weights / OpenAI calls / held-out evaluation / merge authorization.'
