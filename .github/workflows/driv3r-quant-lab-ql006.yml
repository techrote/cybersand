name: QL-006 trainable sparse Q1 activation gates (research only)
on:
  pull_request:
    paths:
      - 'experiments/driv3r/quant_lab/ql006_activation_gates.py'
      - '.github/workflows/driv3r-quant-lab-ql006.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ql006-activation-gates
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Skip historical optimizer jobs when the latest commit does not edit the model
        id: delta
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || git show --format= --name-only HEAD | grep -Fxq 'experiments/driv3r/quant_lab/ql006_activation_gates.py'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.delta.outputs.run == 'true'
        with:
          python-version: '3.11'
      - name: Install free pinned CPU toolchain
        if: steps.delta.outputs.run == 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'numpy==2.1.3' 'Pillow==11.1.0'
      - name: Load immutable QL-003 original trained and Franken model archive
        if: steps.delta.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ql003-franken-quant
          run-id: 43795394633
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql003-source
      - name: Load immutable QL-005 original bitserial results and optimizer archive
        if: steps.delta.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ql005-bitserial-repair
          run-id: 43808122526
          repository: techrote/cybersand
          github-token: ${{ github.token }}
          path: ql005-source
      - name: Validate packed operations, synthetic host authority and new STE gradients
        if: steps.delta.outputs.run == 'true'
        run: |
          python experiments/driv3r/quant_lab/quant_worm.py --self-test
          python experiments/driv3r/quant_lab/ql002_branch_retrace.py --self-test
          python experiments/driv3r/quant_lab/ql005_bitserial.py --self-test
          python experiments/driv3r/quant_lab/ql006_activation_gates.py --self-test
      - name: Run 96 real optimizer updates, held-out state tests and first-pass PNG trajectories
        if: steps.delta.outputs.run == 'true'
        run: |
          python experiments/driv3r/quant_lab/ql006_activation_gates.py \
            --parent ql003-source --ql005 ql005-source --out ql006-out --steps 48
      - name: Verify exact HEAD, sealed parents, model steps, legal actions and PNG hashes
        if: steps.delta.outputs.run == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('ql006-out')
          data=json.loads((root/'results.json').read_text())
          sha=os.environ['QL_SOURCE_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          assert data['source_sha']==sha
          assert data['pinned_sources']=={
             'ql003':'9b4103c48127e5c8538403e2a4d9e2525fbe8755',
             'ql005':'fab9f69b3b773bba25eb598ac600bd44eadf0cde'}
          assert min(data['verified_parent_manifest_entries'])>100
          assert data['new_optimizer_updates']==96
          assert data['heldout_n']>=4000
          assert len(data['variants'])==8 and len(data['controls'])==3
          assert data['first_pass_png_n']==168
          decisions=json.loads((root/'raw_decisions.json').read_text())
          assert len(decisions)==168 and all(row['first_pass'] for row in decisions)
          assert all(step['chosen'] in step['legal'] for row in decisions for step in row['steps'])
          for repair in data['repairs'].values():
              assert repair['steps']==48
              assert repair['nonzero_optimizer_moment_tensors']==3
              assert repair['packed_q1_bits_unchanged']
              assert repair['inference_parity_max_abs']<3e-5
          manifest=json.loads((root/'MANIFEST.json').read_text())
          assert len({row['path'] for row in manifest})==len(manifest)
          for row in manifest:
              raw=(root/row['path']).read_bytes()
              assert row['bytes']==len(raw)
              assert hashlib.sha256(raw).hexdigest()==row['sha256'],row['path']
          print('QL006 EXACT HEAD PASS',sha,'manifest',len(manifest),
                'PNG',data['first_pass_png_n'],'model steps',data['new_optimizer_updates'])
          PY
      - name: Preserve original optimizer receipts, packed-model parents, source-hashed first-pass evidence
        if: always() && steps.delta.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ql006-ternary-gates
          path: ql006-out/
          if-no-files-found: warn
          retention-days: 21
