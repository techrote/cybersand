name: DRIV3R M3 short resident d1-Q8 real native selection
on:
  pull_request:
    paths:
      - 'experiments/driv3r/m3_model/**'
      - '.github/workflows/driv3r-m3-model-short.yml'
  push:
    branches: [research/570-m3-model-short]
    paths: ['experiments/driv3r/m3_model/qualification-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: driv3r-m3-short-q8-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  contract:
    name: Short Q8 model+native source and protocol preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure immutable M1 and qualified real-native history ancestor
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8fa90de6be209ed0b7bd125039e6ec8b332fb1a6 HEAD
          git merge-base --is-ancestor 98320dab1e248820576c30dd6da5591d2e6ad9a4 HEAD
          echo 'ebe2fa211148602c614cba0f0a40f285cba797784b70efa035832d833877f80d  experiments/driv3r/d_common/v1/interface.schema.json' | sha256sum --check --strict
      - name: Offline adversarial source, model-choice and native admission tests
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check 'jsonschema==4.26.0'
          python3 -m compileall -q experiments/driv3r/m3_model
          python3 -m unittest discover -s experiments/driv3r/m3_model -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/driv3r/m3_history -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/driv3r/d_common/v1 -p 'test_*.py' -v
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py
  native:
    name: Model selects up to 4 genuinely native one-cell actions
    needs: contract
    if: github.repository == 'techrote/cybersand' && github.event_name == 'push' && github.ref == 'refs/heads/research/570-m3-model-short'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source-build pinned Godot and acquire exact official resident Q8
        run: timeout --signal=TERM --kill-after=60 7800 bash experiments/driv3r/m3_model/ci_short.sh
      - name: Preserve first-pass native receipts, model responses and outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-m3-q8-short-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/driv3r-m3-model/
          if-no-files-found: warn
          retention-days: 90
