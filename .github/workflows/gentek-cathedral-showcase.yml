name: GENTEK Cathedral showcase qualification
on:
  push:
    branches: [experiment/gentek-showcase-cathedral-001]
    paths:
      - 'native/**'
      - 'godot/**'
      - 'examples/worldgen/architectural/**'
      - 'tools/ci/gentek_cathedral_evidence.py'
      - '.github/workflows/gentek-cathedral-showcase.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-material-campaign:
    if: github.ref_name == 'experiment/gentek-showcase-cathedral-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GODOT_CPP_COMMIT: 101ae38034304346a46ea9ea84ae156d3e860496
      GODOT_URL: https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7
      GODOT_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
      CYBERSAND_SOURCE_COMMIT: ${{ github.sha }}
      CYBERSAND_ARCHITECTURE_OUTPUT: ${{ github.workspace }}/build/cathedral-showcase
      XDG_DATA_HOME: ${{ github.workspace }}/build/cathedral-profile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare source and pinned dependencies
        run: |
          set -euo pipefail
          mkdir -p "$CYBERSAND_ARCHITECTURE_OUTPUT"
          test "$(git rev-parse HEAD)" = "$CYBERSAND_SOURCE_COMMIT"
          git lfs install --local
          git lfs pull --include='godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' --exclude=''
          echo '566e68ae53bfb2eb7018c8e7d0dd3727121bf696462039b780a33d6b8369c66a  godot/addons/godot-rapier2d/bin/libgodot_rapier.linux.x86_64-unknown-linux-gnu.so' | sha256sum -c --strict
          python3 -m venv "$RUNNER_TEMP/scons"
          "$RUNNER_TEMP/scons/bin/python" -m pip install --require-hashes -r tools/requirements-build.txt
          git init "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" remote add origin https://github.com/godotengine/godot-cpp.git
          timeout 600 git -C "$RUNNER_TEMP/godot-cpp" fetch --depth=1 origin "$GODOT_CPP_COMMIT"
          git -C "$RUNNER_TEMP/godot-cpp" checkout --detach FETCH_HEAD
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$GODOT_URL"
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum -c --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
      - name: Focused native catalogue and structural tests
        run: |
          set -euo pipefail
          timeout 3600 make -j2 worldgen-test CXX=g++-13 2>&1 | tee "$CYBERSAND_ARCHITECTURE_OUTPUT/native-tests.log"
      - name: Build pinned bindings
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          SCONS_PYTHON: ${{ runner.temp }}/scons/bin/python
          SCONS_JOBS: '2'
          CYBERSAND_REAL_CXX: /usr/bin/g++-13
          LINUX_CXX: /usr/bin/g++-13
        run: timeout 3600 bash tools/build_pinned_godot_cpp.sh linux > "$CYBERSAND_ARCHITECTURE_OUTPUT/bindings-build.log" 2>&1
      - name: Snapshot inputs and build source-matched extension
        env:
          GODOT_CPP_ROOT: ${{ runner.temp }}/godot-cpp
          LINUX_CXX: /usr/bin/g++-13
          CYBERSAND_NATIVE_OUTPUT: ${{ github.workspace }}/build/cathedral-showcase/libcybersand_native.linux.x86_64.so
        run: |
          set -euo pipefail
          python3 tools/ci/gentek_cathedral_evidence.py snapshot --output "$CYBERSAND_ARCHITECTURE_OUTPUT" --godot-cpp "$GODOT_CPP_ROOT"
          timeout 3600 bash tools/build_native_extension.sh 2>&1 | tee "$CYBERSAND_ARCHITECTURE_OUTPUT/native-build.log"
          cp "$CYBERSAND_NATIVE_OUTPUT" godot/addons/cybersand_native/bin/libcybersand_native.linux.x86_64.so
          "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --headless --path godot --editor --quit > "$CYBERSAND_ARCHITECTURE_OUTPUT/import.log" 2>&1
      - name: Existing GEN-007 and 73-member CLASSIC qualification
        run: |
          set -euo pipefail
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          timeout 1800 "$GODOT_BIN" --headless --path godot --script res://tests/test_architectural_project_contract.gd 2>&1 | tee "$CYBERSAND_ARCHITECTURE_OUTPUT/project-contract.log"
          CYBERSAND_ARCHITECTURE_PHASE=native timeout 3600 "$GODOT_BIN" --headless --path godot --script res://tests/test_architectural_generator.gd 2>&1 | tee "$CYBERSAND_ARCHITECTURE_OUTPUT/classic-native.log"
      - name: Cathedral native-material campaign and timings
        run: |
          set -euo pipefail
          timeout 1800 "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" --headless --path godot --script res://tests/test_gentek_cathedral_showcase.gd 2>&1 | tee "$CYBERSAND_ARCHITECTURE_OUTPUT/cathedral-native.log"
          test "$(find "$CYBERSAND_ARCHITECTURE_OUTPUT" -maxdepth 1 -name 'cathedral-megaframe-*.png' | wc -l)" -eq 18
      - name: Existing five-card preview install save and fresh-process reopen
        env:
          CYBERSAND_ARCHITECTURE_REQUIRE_GRAPHICS: '1'
        run: |
          set -euo pipefail
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          CYBERSAND_CATHEDRAL_PHASE=author timeout 900 xvfb-run -a "$GODOT_BIN" --path godot --rendering-method gl_compatibility --script res://tests/test_gentek_cathedral_showcase.gd 2>&1 | tee "$CYBERSAND_ARCHITECTURE_OUTPUT/cathedral-author.log"
          CYBERSAND_CATHEDRAL_PHASE=reopen timeout 900 xvfb-run -a "$GODOT_BIN" --path godot --rendering-method gl_compatibility --script res://tests/test_gentek_cathedral_showcase.gd 2>&1 | tee "$CYBERSAND_ARCHITECTURE_OUTPUT/cathedral-reopen.log"
      - name: Seal unchanged source and retained native evidence
        run: |
          python3 tools/ci/gentek_cathedral_evidence.py seal \
            --output "$CYBERSAND_ARCHITECTURE_OUTPUT" \
            --runtime "$CYBERSAND_ARCHITECTURE_OUTPUT/libcybersand_native.linux.x86_64.so" \
            --godot "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
      - name: Retain complete native evidence and built runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gentek-cathedral-showcase-${{ github.sha }}
          path: build/cathedral-showcase/
          if-no-files-found: error
          retention-days: 90
