name: MS-000 validated source publication
on:
  push:
    branches: [codex/issue-27-ms000-validated]
    paths: [.github/workflows/ms000-workbench.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-27-ms000-validated'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify tested source and publish without rewriting another branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import base64, bz2, hashlib, json, os, pathlib, subprocess, urllib.request
          branch = 'refs/heads/codex/issue-27-ms000-validated'
          assert os.environ['GITHUB_REF'] == branch
          assert os.environ['GITHUB_REPOSITORY'] == 'techrote/cybersand'
          def git(*args, input=None):
              return subprocess.check_output(['git', *args], input=input)
          def check_tip():
              tip = git('ls-remote', 'origin', branch).decode().split()[0]
              assert tip == os.environ['GITHUB_SHA'], 'Concurrent change: refusing publication'
          check_tip()
          chunks = []
          for sha in [
              '09588f61343e7e65fe2ae39d586ba2402c250cc4',
              'b38992c47137edc695269a03c6a9b6bcd801ac97',
              '6d413a3a01cdb4677903c435c96899cb45dfbdc8',
              '182960d30f67aecf9add9f0e0845f54a9baae076',
          ]:
              request = urllib.request.Request(
                  'https://api.github.com/repos/techrote/cybersand/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              assert blob['encoding'] == 'base64' and blob['sha'] == sha
              raw = base64.b64decode(''.join(blob['content'].split()), validate=True)
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              chunks.append(raw)
          compressed = b''.join(chunks)
          assert hashlib.sha256(compressed).hexdigest() == 'a239bced96f49cb9a6ffd264ce105879ede25d2be005b2b16b2770e10031593b'
          raw = bz2.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == '6c9c53c6c8592137bd4210ad72136f5420513aee558f3a51770237fa529707f7'
          payload = json.loads(raw)
          assert payload['schema'] == 1
          assert payload['base_commit'] == '781a2d7cb5d5a66bf1cff8fc6654e0ab708e419c'
          git('merge-base', '--is-ancestor', payload['base_commit'], 'HEAD')
          assert not git('status', '--porcelain').strip()
          patch = payload['patch'].encode('utf-8')
          git('apply', '--index', '--check', '-', input=patch)
          git('apply', '--index', '-', input=patch)
          expected_paths = set(payload['files'])
          assert len(expected_paths) == 37
          assert set(git('diff', '--cached', '--name-only').decode().splitlines()) == expected_paths
          for path, expected in payload['files'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == expected, path
          git('rm', '.github/workflows/ms000-workbench.yml')
          git('diff', '--cached', '--check')
          tree = git('write-tree').decode().strip()
          assert tree == 'a1f318a3ea183bf7ee831249b4f767e95f8ebebc', tree
          git('commit', '-m', 'feat(ms000): publish validated shared scenario harness (#27)')
          assert not git('status', '--porcelain').strip()
          check_tip()
          git('push', 'origin', 'HEAD:' + branch)
          print('Published implementation:', git('rev-parse', 'HEAD').decode().strip())
          print('Verified tested tree:', tree)
          print('All 37 source-file SHA-256 checks passed; temporary workflow removed.')
          PY
