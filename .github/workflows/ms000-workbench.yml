name: MS-000 isolated source workbench
on:
  push:
    branches: [codex/issue-27-microscenarios-harness]
    paths: [.github/workflows/ms000-workbench.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'techrote/cybersand' && github.ref == 'refs/heads/codex/issue-27-microscenarios-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate and materialize tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 781a2d7cb5d5a66bf1cff8fc6654e0ab708e419c
          test "$(git ls-remote origin refs/heads/codex/issue-27-microscenarios-harness | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import base64, bz2, hashlib, json, pathlib, subprocess
          hashes = [
              '3fd7da15fc9bdbfd524eace8ff52ed6659b86957d40f066e5255ed29db7ac7b3',
              '91f3d8e68a4d815ef9eb4689e3db41a852d8ba7e671868d6bde772e615e7fce5',
              'fc484f8a26505a29fe8d357f1e7305253d4403acef0a55a2077e0a6ef912451e',
              '9105c8855befce6eabd1567d7237a123b08fe6bd50fdd6fcba29f1017d4060a4',
          ]
          parts = []
          for number, expected in enumerate(hashes, 1):
              raw = pathlib.Path(f'.ms000-part-{number}').read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              print(f'part {number}: {actual}', flush=True)
              assert actual == expected, f'part {number} checksum mismatch'
              parts.append(raw.strip())
          payload = bz2.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(payload).hexdigest() == '1c0f6ea79f3c49b949b57f5d2a890f29f3fcbd4d6525aeeace33d3c90bade4db'
          patches = json.loads(payload)
          assert set(patches) == {'prerequisite', 'implementation'}
          for key, message in [
              ('prerequisite', 'fix(ui): keep Tower launcher from capturing Space (#24)'),
              ('implementation', 'feat(ms000): share declarative scenario harness across existing owners'),
          ]:
              patch = patches[key].encode('utf-8')
              subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
              if key == 'implementation':
                  manifest = json.loads(pathlib.Path('docs/audits/2026-09-19-ms000-source.json').read_text())
                  for path, expected in manifest['files'].items():
                      assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == expected, path
                  subprocess.run(['git', 'rm', '.github/workflows/ms000-workbench.yml', *[f'.ms000-part-{n}' for n in range(1,5)]], check=True)
              subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
              subprocess.run(['git', 'commit', '-m', message], check=True)
          assert not subprocess.check_output(['git', 'status', '--porcelain']).strip()
          print('Verified implementation commit:', subprocess.check_output(['git','rev-parse','HEAD']).decode().strip())
          PY
          test "$(git ls-remote origin refs/heads/codex/issue-27-microscenarios-harness | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/issue-27-microscenarios-harness
      - name: Retain pinned companion for documentation validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 6a58311982941b75f46e22109a0829e5acb83c7e
          git archive --format=tar.gz --output="$RUNNER_TEMP/ms000-companion.tar.gz" 6a58311982941b75f46e22109a0829e5acb83c7e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ms000-companion
          path: ${{ runner.temp }}/ms000-companion.tar.gz
          if-no-files-found: error
          retention-days: 3
