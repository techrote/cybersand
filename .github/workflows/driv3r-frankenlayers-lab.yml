name: "DRIV3R Frankenlayers Lab — Wave 16 frozen-Q4 residual repair"
on:
  pull_request:
    paths:
      - 'experiments/driv3r/frankenlayers_lab/**'
      - '.github/workflows/driv3r-frankenlayers-lab.yml'
  push:
    branches: [research/619-frankenlayers-lab]
    paths:
      - 'experiments/driv3r/frankenlayers_lab/run-request.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave2.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave3.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave4.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave5.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave6.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave7.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave8.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave9.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave10.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave12.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave13.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave14.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave15.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave16.json'
      - '.github/workflows/driv3r-frankenlayers-lab.yml'

permissions:
  contents: read

concurrency:
  group: driv3r-franken-lab-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  cheap:
    name: Lab flow, patch, scope and request invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed before downloading models
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 67bc90e685f3311f73b6dbb3b0f6773d10e64623 HEAD
          python3 -m compileall -q experiments/driv3r/frankenlayers_lab
          python3 -m unittest experiments.driv3r.frankenlayers.test_frankenlayers experiments.driv3r.frankenlayers_lab.test_lab experiments.driv3r.frankenlayers_lab.test_holdout experiments.driv3r.frankenlayers_lab.test_counterfactual experiments.driv3r.frankenlayers_lab.test_lowbit experiments.driv3r.frankenlayers_lab.test_lowbit_causal experiments.driv3r.frankenlayers_lab.test_iq2 experiments.driv3r.frankenlayers_lab.test_iq2_causal experiments.driv3r.frankenlayers_lab.test_q4_causal experiments.driv3r.frankenlayers_lab.test_repair -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          from experiments.driv3r.frankenlayers_lab.flows import WAVE1_FLOWS, WAVE2_FLOWS, WAVE3_FLOWS, WAVE5_FLOWS, WAVE6_FLOWS, LAB_FLOWS
          p=Path("experiments/driv3r/frankenlayers_lab/run-request.json")
          r=json.loads(p.read_text())
          assert r["schema"]=="cybersand-d1-frankenlayers-lab-request/1"
          assert r["lineage"]["source_head"]=="67bc90e685f3311f73b6dbb3b0f6773d10e64623"
          assert r["lineage"]["model_q8_sha256"]=="073313d92b53b0ac8193db6e906cb3c78a98183d244b15b7b8f5426115c6738c"
          assert r["lineage"]["llama_commit"]=="8642541b255bfb5dc39cd351a178be09013a55d6"
          assert r["max_parallel"]==2 and r["timeout_minutes"]<=95
          assert r["no_game_changes"] and not any(r[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert r["experiments"] == [
              dict(label=k,mode=k,flow=list(v),seed=570)
              for k,v in WAVE1_FLOWS.items()
          ]
          p2=Path("experiments/driv3r/frankenlayers_lab/run-request-wave2.json")
          w=json.loads(p2.read_text())
          assert w["schema"]=="cybersand-d1-frankenlayers-lab-wave2/1"
          assert w["lineage"]["first_wave_sha"]=="a418d2f718ffb7786c357a3eb2a4a7112d74760b"
          assert w["lineage"]["first_wave_actions_run"]==43790709596
          assert w["lineage"]["model_q8_sha256"]==r["lineage"]["model_q8_sha256"]
          assert w["lineage"]["llama_commit"]==r["lineage"]["llama_commit"]
          assert w["lineage"]["w0_commit"]==r["lineage"]["w0_commit"]
          assert w["max_parallel"]==2 and w["timeout_minutes"]<=95
          assert w["no_game_changes"] and not any(w[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w["experiments"] == [
              dict(label=k,mode=k,flow=list(v),quant="q8",seed=570)
              for k,v in WAVE2_FLOWS.items()
          ] + [dict(label="aero6q4",mode="aero6",flow=list(WAVE1_FLOWS["aero6"]),quant="q4_k_m",seed=570)]
          p3=Path("experiments/driv3r/frankenlayers_lab/run-request-wave3.json")
          w3=json.loads(p3.read_text())
          assert w3["schema"]=="cybersand-d1-frankenlayers-lab-wave3/1"
          assert w3["lineage"]["wave2_source_sha"]=="d4c9e5605776cb67741ce89302c6aac43a2770e8"
          assert w3["lineage"]["wave2_run"]==43797802175
          assert w3["lineage"]["model_q8_sha256"]==r["lineage"]["model_q8_sha256"]
          assert w3["lineage"]["llama_commit"]==r["lineage"]["llama_commit"]
          assert w3["lineage"]["w0_commit"]==r["lineage"]["w0_commit"]
          assert w3["max_parallel"]==2 and w3["timeout_minutes"]<=95
          assert w3["no_game_changes"] and not any(w3[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w3["experiments"]==[
              dict(label=k,mode=k,flow=list(v),quant="q8",seed=570)
              for k,v in WAVE3_FLOWS.items()
          ]
          w4=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave4.json").read_text())
          assert w4["schema"]=="cybersand-d1-frankenlayers-lab-wave4/1"
          assert w4["lineage"]["wave3_source_sha"]=="61e316986f95672793c324b9df489a905994bb69"
          assert w4["lineage"]["wave3_run"]==43802923136
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w4["lineage"][key]==r["lineage"][key]
          assert w4["max_parallel"]==2 and w4["timeout_minutes"]<=95 and w4["no_game_changes"]
          assert not any(w4[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w4["experiments"]==[
            dict(label=label,mode=mode,flow=list(WAVE3_FLOWS[mode]),quant=quant,seed=seed)
            for label,mode,quant,seed in (
              ("aero5_no23_q4","aero5_no23","q4_k_m",570),
              ("tailflip4_q4","tailflip4","q4_k_m",570),
              ("aero5_no23_s571","aero5_no23","q8",571),
              ("echo4_s571","echo4","q8",571),
            )
          ]
          w5=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave5.json").read_text())
          assert w5["schema"]=="cybersand-d1-frankenlayers-lab-wave5/1"
          assert w5["lineage"]["wave4_source_sha"]=="b6fae6dd81cef49c0f60f8589e2d643daa3bd8b6"
          assert w5["lineage"]["wave4_run"]==43808813584
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w5["lineage"][key]==r["lineage"][key]
          assert w5["max_parallel"]==2 and w5["timeout_minutes"]<=95 and w5["no_game_changes"]
          assert not any(w5[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w5["experiments"]==[
            dict(label=label,mode=mode,flow=list((WAVE5_FLOWS if mode in WAVE5_FLOWS else WAVE3_FLOWS)[mode]),quant=quant,seed=seed)
            for label,mode,quant,seed in (
              ("aero4_no10","aero4_no10","q8",570),
              ("aero5_tailflip","aero5_tailflip","q8",570),
              ("echo4_q4","echo4","q4_k_m",570),
              ("aero5_no23_q4_s571","aero5_no23","q4_k_m",571),
            )
          ]
          w6=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave6.json").read_text())
          assert w6["schema"]=="cybersand-d1-frankenlayers-lab-wave6/1"
          assert w6["lineage"]["wave5_source_sha"]=="e0632c91f1d5b12822347107fe43715a24d150a7"
          assert w6["lineage"]["wave5_run"]==43815557706
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w6["lineage"][key]==r["lineage"][key]
          assert w6["max_parallel"]==2 and w6["timeout_minutes"]<=95 and w6["no_game_changes"]
          assert not any(w6[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w6["experiments"]==[
            dict(label=label,mode=mode,flow=list((WAVE6_FLOWS if mode in WAVE6_FLOWS else WAVE5_FLOWS)[mode]),quant=quant,seed=seed)
            for label,mode,quant,seed in (
              ("aero4_no10_q4","aero4_no10","q4_k_m",570),
              ("aero4_no10_s571","aero4_no10","q8",571),
              ("aero4_no10_q4_s571","aero4_no10","q4_k_m",571),
              ("aero4_no2","aero4_no2","q8",570),
            )
          ]
          from experiments.driv3r.frankenlayers_lab.holdout import CASES, HOLDOUT_SEED, STEPS, SIZE
          from experiments.driv3r.frankenlayers.patch_runtime import FLOWS as BASE_FLOWS
          w7=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave7.json").read_text())
          assert w7["schema"]=="cybersand-d1-frankenlayers-lab-wave7-heldout/1"
          assert w7["lineage"]["wave6_source_sha"]=="c2be0c6c0fc0be791547af14a79fff272645e31f"
          assert w7["lineage"]["wave6_run"]==43829466716
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w7["lineage"][key]==r["lineage"][key]
          host=w7["test_host"]
          assert host["seed"]==HOLDOUT_SEED and host["steps"]==STEPS and host["size"]==SIZE
          assert host["scenarios"]==list(CASES.values())
          assert host["synthetic_obstacle_overlay_only"] and host["native_game"] is False
          assert w7["max_parallel"]==2 and w7["timeout_minutes"]<=95 and w7["no_game_changes"]
          assert not any(w7[k] for k in ("paid_api","paid_gpu","merge","ready"))
          expected=[
            ("aero4_no10_q4_holdout","aero4_no10","q4_k_m"),
            ("aero5_no23_q4_holdout","aero5_no23","q4_k_m"),
            ("aero4_no2_q8_holdout","aero4_no2","q8"),
            ("aerohound8_q8_holdout","aerohound","q8"),
          ]
          assert w7["experiments"]==[
            dict(label=label,mode=mode,flow=list((LAB_FLOWS if mode in LAB_FLOWS else BASE_FLOWS)[mode]),
                 quant=quant,seed=HOLDOUT_SEED)
            for label,mode,quant in expected
          ]
          w8=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave8.json").read_text())
          assert w8["schema"]=="cybersand-d1-frankenlayers-lab-wave8-holdout-repair/1"
          assert w8["lineage"]["failed_wave7_source_sha"]=="3d0d5d0281dcc7497d0a3a8c173a998a3991d296"
          assert w8["lineage"]["failed_wave7_run"]==43847173709
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w8["lineage"][key]==r["lineage"][key]
          assert w8["experiments"]==w7["experiments"]
          assert w8["test_host"]==w7["test_host"]
          assert w8["max_parallel"]==2 and w8["timeout_minutes"]<=95 and w8["no_game_changes"]
          assert not any(w8[k] for k in ("paid_api","paid_gpu","merge","ready"))
          from experiments.driv3r.frankenlayers_lab.counterfactual import PAIRS, SEED as CAUSAL_SEED, STEPS as CAUSAL_STEPS, FAMILY as CAUSAL_FAMILY
          w9=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave9.json").read_text())
          assert w9["schema"]=="frankenlayers-wave9-matched-geometry/1"
          assert w9["lineage"]["wave8_source_sha"]=="e945aed597969fead1e2d765910078343fcfda5a"
          assert w9["lineage"]["wave8_actions_run"]==43857283673
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w9["lineage"][key]==r["lineage"][key]
          assert w9["test_host"]["seed"]==CAUSAL_SEED and w9["test_host"]["steps_per_variant"]==CAUSAL_STEPS
          assert w9["test_host"]["fixed_family"]==CAUSAL_FAMILY
          assert w9["test_host"]["scenarios"]==list(PAIRS)
          assert w9["experiments"]==[
            dict(label=label,mode=mode,flow=list(LAB_FLOWS[mode]),quant=quant,seed=CAUSAL_SEED)
            for label,mode,quant in (
              ("aero4_no10_q4_causal","aero4_no10","q4_k_m"),
              ("aero5_no23_q4_causal","aero5_no23","q4_k_m"),
              ("aero4_no2_q8_causal","aero4_no2","q8"),
            )
          ]
          assert w9["max_parallel"]==2 and w9["timeout_minutes"]<=95 and w9["no_game_changes"]
          assert not any(w9[k] for k in ("paid_api","paid_gpu","merge","ready"))

          # Immutable Wave-10 IQ3_XS screen: no model download before validation.
          w10=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave10.json").read_text())
          assert w10["schema"]=="frankenlayers-wave10-lowbit-screen/1"
          assert w10["lineage"]["wave9_source_sha"]=="dc33462525bda1c9c26c5eb9d6c79a19c3de21e5"
          assert w10["lineage"]["wave9_actions_run"]==43867417750
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w10["lineage"][key]==r["lineage"][key]
          assert w10["quant"]=={"target":"IQ3_XS","input":"Q8_0","allow_requantize":True,"imatrix":None,"lossy_conversion":True}
          assert w10["experiments"]==[
            dict(label=label,mode=mode,flow=list(LAB_FLOWS[mode]),quant="iq3_xs",seed=seed)
            for label,mode,seed in (
              ("aero4_no10_iq3_s570","aero4_no10",570),
              ("aero4_no10_iq3_s571","aero4_no10",571),
              ("aero4_no2_iq3_s570","aero4_no2",570),
            )
          ]
          assert w10["max_parallel"]==2 and w10["timeout_minutes"]<=95 and w10["no_game_changes"]
          assert not any(w10[k] for k in ("paid_api","paid_gpu","merge","ready"))
          # Wave 11 is one calibrated pilot, preserving the three Wave-10 failures.
          w11=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave11.json").read_text())
          assert w11["schema"]=="frankenlayers-wave11-calibrated-iq3-pilot/1"
          assert w11["lineage"]["failed_wave10_run"]==43876518503
          assert w11["quant"]["target"]=="IQ3_XS" and w11["quant"]["calibration_chunks"]==8
          assert w11["quant"]["imatrix_source"]=="pinned Q8 stock, disjoint synthetic game prompts"
          assert w11["experiments"]==[dict(label="aero4_no10_iq3_cal_s570",
                mode="aero4_no10",flow=list(LAB_FLOWS["aero4_no10"]),
                quant="iq3_xs",seed=570)]
          assert w11["max_parallel"]==1 and w11["timeout_minutes"]<=95
          assert w11["no_game_changes"] and not any(w11[k] for k in ("paid_api","paid_gpu","merge","ready"))
          # Wave 12: immutable causal IQ3 pilot replication; no inference before this check.
          w12=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave12.json").read_text())
          assert w12["schema"]=="frankenlayers-wave12-calibrated-iq3-matched-geometry/1"
          assert w12["lineage"]["wave11_source_sha"]=="01ae051b14ba7a8767b53df56af54d5e80f49198"
          assert w12["lineage"]["wave11_success_run"]==43885385220
          assert w12["lineage"]["wave11_artifact_id"]==14234559968
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w12["lineage"][key]==r["lineage"][key]
          assert w12["quant"]["target"]=="IQ3_XS" and w12["quant"]["input"]=="Q8_0"
          assert w12["quant"]["imatrix_source"]=="pinned Q8 stock, train-only game-state prompts"
          assert w12["quant"]["calibration_seeds"]==[101,103,107,109]
          assert w12["quant"]["calibration_rows"]==96 and w12["quant"]["calibration_chunks"]==8
          assert w12["test_host"]=={
            "seed":CAUSAL_SEED,"fixed_family":CAUSAL_FAMILY,
            "steps_per_variant":CAUSAL_STEPS,
            "scenarios":list(PAIRS),"synthetic_obstacles_only":True,"native_game":False}
          assert w12["experiments"]==[
            dict(label=label,mode=mode,flow=list(LAB_FLOWS[mode]),quant="iq3_xs",seed=CAUSAL_SEED)
            for label,mode in (
              ("aero4_no10_iq3_causal","aero4_no10"),
              ("aero4_no2_iq3_causal","aero4_no2"),
            )
          ]
          assert w12["max_parallel"]==2 and w12["timeout_minutes"]<=95
          assert w12["no_game_changes"] and not any(w12[k] for k in ("paid_api","paid_gpu","merge","ready"))
          # Wave 13 calibrated IQ2: only two pre-registered four-layer carcasses.
          w13=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave13.json").read_text())
          assert w13["schema"]=="frankenlayers-wave13-calibrated-iq2-matched-geometry/1"
          assert w13["lineage"]["wave12_source_sha"]=="408e85a5a7464c0c70e40fecf30bec081948f63b"
          assert w13["lineage"]["wave12_success_run"]==43895653253
          assert w13["lineage"]["wave12_artifacts"]==[14241756780,14244410809]
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w13["lineage"][key]==r["lineage"][key]
          assert w13["quant"]==dict(target="IQ2_XS",input="Q8_0",allow_requantize=True,
              imatrix_source="pinned Q8 stock, train-only game-state prompts",
              calibration_rows=96,calibration_chunks=8,calibration_seeds=[101,103,107,109],lossy_conversion=True)
          assert w13["test_host"]==w12["test_host"]
          assert w13["experiments"]==[
              dict(label=label,mode=mode,flow=list(LAB_FLOWS[mode]),quant="iq2_xs",seed=CAUSAL_SEED)
              for label,mode in (
                ("aero4_no10_iq2_causal","aero4_no10"),
                ("aero4_no2_iq2_causal","aero4_no2"),
              )
          ]
          assert w13["max_parallel"]==2 and w13["timeout_minutes"]<=95
          assert w13["no_game_changes"] and not any(w13[k] for k in ("paid_api","paid_gpu","merge","ready"))

          # Wave 14 keeps failed IQ2 evidence, tests intermediate Q4 and one new bridge.
          w14=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave14.json").read_text())
          assert w14["schema"]=="frankenlayers-wave14-q4-bridge-matched-geometry/1"
          assert w14["lineage"]["wave13_source_sha"]=="735a1369ebfe1c31a54fad04259eed0b09a9c15d"
          assert w14["lineage"]["wave13_success_run"]==43905570049
          assert w14["lineage"]["wave13_artifacts"]==[14248073156,14246818135]
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w14["lineage"][key]==r["lineage"][key]
          assert w14["quant"]==dict(target="Q4_K_M",input="Q8_0",allow_requantize=True,lossy_conversion=True,importance_matrix=None)
          assert w14["test_host"]==w13["test_host"]
          assert w14["experiments"]==[
              dict(label=label,mode=mode,flow=list(LAB_FLOWS[mode]),quant="q4_k_m",seed=CAUSAL_SEED)
              for label,mode in (("aero4_no2_q4_causal","aero4_no2"),
                                 ("aero4_bridge_q4_causal","aero4_bridge"))
          ]
          assert w14["max_parallel"]==2 and w14["timeout_minutes"]<=95
          assert w14["no_game_changes"] and not any(w14[k] for k in ("paid_api","paid_gpu","merge","ready"))
          # Wave 15 is a new immutable request; never retroactively modify older runs.
          from experiments.driv3r.frankenlayers_lab.flows import WAVE15_FLOWS
          w15=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave15.json").read_text())
          assert w15["schema"]=="frankenlayers-wave15-q4-reorder-and-echo-matched-geometry/1"
          assert w15["lineage"]["wave14_source_sha"]=="00f12efcb6cd9a53b77ef381d2d512487cef0bc6"
          assert w15["lineage"]["wave14_success_run"]==43916995562
          assert w15["lineage"]["wave14_artifacts"]==[14256180124,14255401097]
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
              assert w15["lineage"][key]==r["lineage"][key]
          assert w15["quant"]==w14["quant"] and w15["test_host"]==w14["test_host"]
          assert w15["experiments"]==[
              dict(label=label,mode=mode,flow=list(WAVE15_FLOWS[mode]),quant="q4_k_m",seed=CAUSAL_SEED)
              for label,mode in (
                ("aero4_no2_tailflip_q4_causal","aero4_no2_tailflip"),
                ("aero5_no2_echo10_q4_causal","aero5_no2_echo10"),
              )
          ]
          assert w15["max_parallel"]==2 and w15["timeout_minutes"]<=95 and w15["no_game_changes"]
          assert not any(w15[k] for k in ("paid_api","paid_gpu","merge","ready"))
          # Wave 16: actual bounded CPU training of an EXTERNAL residual scorer.
          w16=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave16.json").read_text())
          assert w16["schema"]=="frankenlayers-wave16-frozen-q4-residual-repair/1"
          assert w16["lineage"]["wave15_source_sha"]=="451f80662d0aa95413b5e26ef7d03a0a356b4735"
          assert w16["lineage"]["wave15_success_run"]==43928294407
          assert w16["lineage"]["wave15_artifacts"]==[14260196745,14260212927]
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
              assert w16["lineage"][key]==r["lineage"][key]
          from experiments.driv3r.frankenlayers_lab.infer_repair import TRAIN_SEED,EVAL_SEED,TRAIN_FAMILY,EVAL_FAMILY,MODE
          from experiments.driv3r.frankenlayers_lab.repair_adapter import N_FEATURES,EPOCHS
          assert w16["train"]["seed"]==TRAIN_SEED and w16["train"]["family"]==TRAIN_FAMILY
          assert w16["train"]["adapter_parameters"]==N_FEATURES==55
          assert w16["train"]["epochs"]==EPOCHS==80 and w16["train"]["base_model_frozen"]
          assert w16["test_host"]["seed"]==EVAL_SEED and w16["test_host"]["fixed_family"]==EVAL_FAMILY
          assert w16["test_host"]["shifted_obstacles"] and not w16["test_host"]["native_game"]
          assert w16["experiments"]==[dict(label="aero4_no2_q4_learned_repair",mode=MODE,
              flow=list(LAB_FLOWS[MODE]),quant="q4_k_m",seed=EVAL_SEED)]
          assert w16["quant"]==w15["quant"]
          assert w16["max_parallel"]==1 and w16["timeout_minutes"]<=95 and w16["no_game_changes"]
          assert not any(w16[k] for k in ("paid_api","paid_gpu","merge","ready"))
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py
      - name: Git exact-head scope guard
        run: |
          set -euo pipefail
          git diff --name-only 67bc90e685f3311f73b6dbb3b0f6773d10e64623...HEAD > /tmp/changed.txt
          if grep -vE '^(experiments/driv3r/frankenlayers_lab/|[.]github/workflows/driv3r-frankenlayers-lab[.]yml$)' /tmp/changed.txt > /tmp/unexpected.txt; then
            cat /tmp/unexpected.txt
            exit 1
          fi
          test ! -s /tmp/unexpected.txt

  brain:
    name: Learned Q4 residual repair / ${{ matrix.mode }}
    if: github.repository == 'techrote/cybersand' && github.event_name == 'push' && github.ref == 'refs/heads/research/619-frankenlayers-lab'
    needs: cheap
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include:
          - mode: aero4_no2_q4_learned_repair
            flow: aero4_no2
            quant: q4_k_m
            seed: 3891
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire source-pinned immutable d1 Q8 donor
        run: |
          set -euo pipefail
          mkdir -p "evidence/${{ matrix.mode }}"
          timeout --signal=TERM --kill-after=30 1250 python3 -m experiments.driv3r.backend acquire \
            --runtime-dir "$RUNNER_TEMP/d1-lab-donor" \
            --evidence "evidence/${{ matrix.mode }}/donor-acquisition" --timeout-seconds 1200
      - name: Build patched pinned llama.cpp LFM3 decision-only runtime
        run: |
          set -euo pipefail
          export LLAMA_ROOT="$RUNNER_TEMP/franken-lab-llama"
          git init "$LLAMA_ROOT"
          git -C "$LLAMA_ROOT" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$LLAMA_ROOT" fetch --depth=1 origin 8642541b255bfb5dc39cd351a178be09013a55d6
          git -C "$LLAMA_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$LLAMA_ROOT" rev-parse HEAD)" = 8642541b255bfb5dc39cd351a178be09013a55d6
          python3 -m experiments.driv3r.frankenlayers_lab.patch_lab \
            --llama-root "$LLAMA_ROOT" --receipt "evidence/${{ matrix.mode }}/runtime-patch.json"
          git -C "$LLAMA_ROOT" diff -- src/models/lfm3.cpp > "evidence/${{ matrix.mode }}/lfm3.patch"
          cmake -S "$LLAMA_ROOT" -B "$LLAMA_ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build "$LLAMA_ROOT/build" --config Release --target llama-server llama-quantize llama-imatrix -j2
          sha256sum "$LLAMA_ROOT/build/bin/llama-server" > "evidence/${{ matrix.mode }}/binary.sha256"
          ldd "$LLAMA_ROOT/build/bin/llama-server" > "evidence/${{ matrix.mode }}/binary-ldd.txt"
      - name: Acquire read-only pinned W0 legal-action host
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/franken-w0.py"
          test "$(git hash-object "$RUNNER_TEMP/franken-w0.py")" = 8979b6f0296e81051194bacc907992d38e006605
      - name: Requantise immutable Q8 donor to Q4_K_M and record exact receipt
        run: |
          set -euo pipefail
          MODEL_PATH="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          print(json.loads(Path(os.environ['RUNNER_TEMP']+'/d1-lab-donor/runtime-manifest.json').read_text())['model'])
          PY
          )"
          mkdir -p "$RUNNER_TEMP/franken-lab-q4"
          Q4_MODEL="$RUNNER_TEMP/franken-lab-q4/d1-2B-from-Q8-Q4_K_M.gguf"
          timeout --signal=TERM --kill-after=20 1000 "$RUNNER_TEMP/franken-lab-llama/build/bin/llama-quantize"             --allow-requantize "$MODEL_PATH" "$Q4_MODEL" Q4_K_M 2             > "evidence/${{ matrix.mode }}/quantize.log" 2>&1
          test -s "$Q4_MODEL"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from experiments.driv3r.backend import PINS,sha256_file
          root=Path(os.environ['RUNNER_TEMP'])
          src=Path(json.loads((root/'d1-lab-donor/runtime-manifest.json').read_text())['model'])
          out=root/'franken-lab-q4/d1-2B-from-Q8-Q4_K_M.gguf'
          assert sha256_file(src)==PINS['model']['sha256'] and out.stat().st_size>1000000
          receipt={'schema':'cybersand-franken-q4-requant/1','quant':'Q4_K_M',
                   'allow_requantize':True,'source_kind':'immutable Q8 donor, not FP16',
                   'q8_sha256':sha256_file(src),'q8_bytes':src.stat().st_size,
                   'q4_sha256':sha256_file(out),'q4_bytes':out.stat().st_size,
                   'llama_commit':'8642541b255bfb5dc39cd351a178be09013a55d6'}
          dest=Path('evidence/'+os.environ['MATRIX_MODE']+'/quantize-receipt.json')
          dest.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
        env:
          MATRIX_MODE: ${{ matrix.mode }}
      - name: Real-model residual training and disjoint four-arm evaluation
        run: |
          set -euo pipefail
          MODEL_PATH="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          print(json.loads(Path(os.environ['RUNNER_TEMP']+'/d1-lab-donor/runtime-manifest.json').read_text())['model'])
          PY
          )"
          timeout --signal=TERM --kill-after=45 4200 python3 -m experiments.driv3r.frankenlayers_lab.infer_repair             --binary "$RUNNER_TEMP/franken-lab-llama/build/bin/llama-server"             --model-q8 "$MODEL_PATH"             --model-q4 "$RUNNER_TEMP/franken-lab-q4/d1-2B-from-Q8-Q4_K_M.gguf"             --quant-receipt "evidence/${{ matrix.mode }}/quantize-receipt.json"             --w0 "$RUNNER_TEMP/franken-w0.py"             --mode "${{ matrix.flow }}" --seed "${{ matrix.seed }}" --source-sha "$GITHUB_SHA"             --output "evidence/${{ matrix.mode }}/inference"
      - name: Retain true failure evidence and checksums
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "evidence/${{ matrix.mode }}"
          lscpu > "evidence/${{ matrix.mode }}/cpu.txt"
          (cd "evidence/${{ matrix.mode }}" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "evidence/${{ matrix.mode }}/SHA256SUMS.txt"
      - name: Upload original per-carcass matched-geometry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-franken-lab-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_id }}
          path: evidence/${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 90
