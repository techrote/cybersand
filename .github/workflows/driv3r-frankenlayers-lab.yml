name: "DRIV3R Frankenlayers Lab — sparse and Q4 mutant wave"
on:
  pull_request:
    paths:
      - 'experiments/driv3r/frankenlayers_lab/**'
      - '.github/workflows/driv3r-frankenlayers-lab.yml'
  push:
    branches: [research/619-frankenlayers-lab]
    paths:
      - 'experiments/driv3r/frankenlayers_lab/run-request.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave2.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave3.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave4.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave5.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave6.json'
      - 'experiments/driv3r/frankenlayers_lab/run-request-wave7.json'
      - '.github/workflows/driv3r-frankenlayers-lab.yml'

permissions:
  contents: read

concurrency:
  group: driv3r-franken-lab-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  cheap:
    name: Lab flow, patch, scope and request invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed before downloading models
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 67bc90e685f3311f73b6dbb3b0f6773d10e64623 HEAD
          python3 -m compileall -q experiments/driv3r/frankenlayers_lab
          python3 -m unittest experiments.driv3r.frankenlayers.test_frankenlayers experiments.driv3r.frankenlayers_lab.test_lab experiments.driv3r.frankenlayers_lab.test_holdout -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          from experiments.driv3r.frankenlayers_lab.flows import WAVE1_FLOWS, WAVE2_FLOWS, WAVE3_FLOWS, WAVE5_FLOWS, WAVE6_FLOWS
          p=Path("experiments/driv3r/frankenlayers_lab/run-request.json")
          r=json.loads(p.read_text())
          assert r["schema"]=="cybersand-d1-frankenlayers-lab-request/1"
          assert r["lineage"]["source_head"]=="67bc90e685f3311f73b6dbb3b0f6773d10e64623"
          assert r["lineage"]["model_q8_sha256"]=="073313d92b53b0ac8193db6e906cb3c78a98183d244b15b7b8f5426115c6738c"
          assert r["lineage"]["llama_commit"]=="8642541b255bfb5dc39cd351a178be09013a55d6"
          assert r["max_parallel"]==2 and r["timeout_minutes"]<=95
          assert r["no_game_changes"] and not any(r[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert r["experiments"] == [
              dict(label=k,mode=k,flow=list(v),seed=570)
              for k,v in WAVE1_FLOWS.items()
          ]
          p2=Path("experiments/driv3r/frankenlayers_lab/run-request-wave2.json")
          w=json.loads(p2.read_text())
          assert w["schema"]=="cybersand-d1-frankenlayers-lab-wave2/1"
          assert w["lineage"]["first_wave_sha"]=="a418d2f718ffb7786c357a3eb2a4a7112d74760b"
          assert w["lineage"]["first_wave_actions_run"]==43790709596
          assert w["lineage"]["model_q8_sha256"]==r["lineage"]["model_q8_sha256"]
          assert w["lineage"]["llama_commit"]==r["lineage"]["llama_commit"]
          assert w["lineage"]["w0_commit"]==r["lineage"]["w0_commit"]
          assert w["max_parallel"]==2 and w["timeout_minutes"]<=95
          assert w["no_game_changes"] and not any(w[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w["experiments"] == [
              dict(label=k,mode=k,flow=list(v),quant="q8",seed=570)
              for k,v in WAVE2_FLOWS.items()
          ] + [dict(label="aero6q4",mode="aero6",flow=list(WAVE1_FLOWS["aero6"]),quant="q4_k_m",seed=570)]
          p3=Path("experiments/driv3r/frankenlayers_lab/run-request-wave3.json")
          w3=json.loads(p3.read_text())
          assert w3["schema"]=="cybersand-d1-frankenlayers-lab-wave3/1"
          assert w3["lineage"]["wave2_source_sha"]=="d4c9e5605776cb67741ce89302c6aac43a2770e8"
          assert w3["lineage"]["wave2_run"]==43797802175
          assert w3["lineage"]["model_q8_sha256"]==r["lineage"]["model_q8_sha256"]
          assert w3["lineage"]["llama_commit"]==r["lineage"]["llama_commit"]
          assert w3["lineage"]["w0_commit"]==r["lineage"]["w0_commit"]
          assert w3["max_parallel"]==2 and w3["timeout_minutes"]<=95
          assert w3["no_game_changes"] and not any(w3[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w3["experiments"]==[
              dict(label=k,mode=k,flow=list(v),quant="q8",seed=570)
              for k,v in WAVE3_FLOWS.items()
          ]
          w4=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave4.json").read_text())
          assert w4["schema"]=="cybersand-d1-frankenlayers-lab-wave4/1"
          assert w4["lineage"]["wave3_source_sha"]=="61e316986f95672793c324b9df489a905994bb69"
          assert w4["lineage"]["wave3_run"]==43802923136
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w4["lineage"][key]==r["lineage"][key]
          assert w4["max_parallel"]==2 and w4["timeout_minutes"]<=95 and w4["no_game_changes"]
          assert not any(w4[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w4["experiments"]==[
            dict(label=label,mode=mode,flow=list(WAVE3_FLOWS[mode]),quant=quant,seed=seed)
            for label,mode,quant,seed in (
              ("aero5_no23_q4","aero5_no23","q4_k_m",570),
              ("tailflip4_q4","tailflip4","q4_k_m",570),
              ("aero5_no23_s571","aero5_no23","q8",571),
              ("echo4_s571","echo4","q8",571),
            )
          ]
          w5=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave5.json").read_text())
          assert w5["schema"]=="cybersand-d1-frankenlayers-lab-wave5/1"
          assert w5["lineage"]["wave4_source_sha"]=="b6fae6dd81cef49c0f60f8589e2d643daa3bd8b6"
          assert w5["lineage"]["wave4_run"]==43808813584
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w5["lineage"][key]==r["lineage"][key]
          assert w5["max_parallel"]==2 and w5["timeout_minutes"]<=95 and w5["no_game_changes"]
          assert not any(w5[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w5["experiments"]==[
            dict(label=label,mode=mode,flow=list((WAVE5_FLOWS if mode in WAVE5_FLOWS else WAVE3_FLOWS)[mode]),quant=quant,seed=seed)
            for label,mode,quant,seed in (
              ("aero4_no10","aero4_no10","q8",570),
              ("aero5_tailflip","aero5_tailflip","q8",570),
              ("echo4_q4","echo4","q4_k_m",570),
              ("aero5_no23_q4_s571","aero5_no23","q4_k_m",571),
            )
          ]
          w6=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave6.json").read_text())
          assert w6["schema"]=="cybersand-d1-frankenlayers-lab-wave6/1"
          assert w6["lineage"]["wave5_source_sha"]=="e0632c91f1d5b12822347107fe43715a24d150a7"
          assert w6["lineage"]["wave5_run"]==43815557706
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w6["lineage"][key]==r["lineage"][key]
          assert w6["max_parallel"]==2 and w6["timeout_minutes"]<=95 and w6["no_game_changes"]
          assert not any(w6[k] for k in ("paid_api","paid_gpu","merge","ready"))
          assert w6["experiments"]==[
            dict(label=label,mode=mode,flow=list((WAVE6_FLOWS if mode in WAVE6_FLOWS else WAVE5_FLOWS)[mode]),quant=quant,seed=seed)
            for label,mode,quant,seed in (
              ("aero4_no10_q4","aero4_no10","q4_k_m",570),
              ("aero4_no10_s571","aero4_no10","q8",571),
              ("aero4_no10_q4_s571","aero4_no10","q4_k_m",571),
              ("aero4_no2","aero4_no2","q8",570),
            )
          ]
          from experiments.driv3r.frankenlayers_lab.holdout import CASES, HOLDOUT_SEED, STEPS, SIZE
          from experiments.driv3r.frankenlayers.patch_runtime import FLOWS as BASE_FLOWS
          w7=json.loads(Path("experiments/driv3r/frankenlayers_lab/run-request-wave7.json").read_text())
          assert w7["schema"]=="cybersand-d1-frankenlayers-lab-wave7-heldout/1"
          assert w7["lineage"]["wave6_source_sha"]=="c2be0c6c0fc0be791547af14a79fff272645e31f"
          assert w7["lineage"]["wave6_run"]==43829466716
          for key in ("llama_commit","model_q8_sha256","w0_commit"):
            assert w7["lineage"][key]==r["lineage"][key]
          host=w7["test_host"]
          assert host["seed"]==HOLDOUT_SEED and host["steps"]==STEPS and host["size"]==SIZE
          assert host["scenarios"]==list(CASES.values())
          assert host["synthetic_obstacle_overlay_only"] and host["native_game"] is False
          assert w7["max_parallel"]==2 and w7["timeout_minutes"]<=95 and w7["no_game_changes"]
          assert not any(w7[k] for k in ("paid_api","paid_gpu","merge","ready"))
          expected=[
            ("aero4_no10_q4_holdout","aero4_no10","q4_k_m"),
            ("aero5_no23_q4_holdout","aero5_no23","q4_k_m"),
            ("aero4_no2_q8_holdout","aero4_no2","q8"),
            ("aerohound8_q8_holdout","aerohound","q8"),
          ]
          assert w7["experiments"]==[
            dict(label=label,mode=mode,flow=list((LAB_FLOWS if mode in LAB_FLOWS else BASE_FLOWS)[mode]),
                 quant=quant,seed=HOLDOUT_SEED)
            for label,mode,quant in expected
          ]
          PY
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/ci/check_ci_scheduling_policy.py
      - name: Git exact-head scope guard
        run: |
          set -euo pipefail
          git diff --name-only 67bc90e685f3311f73b6dbb3b0f6773d10e64623...HEAD > /tmp/changed.txt
          if grep -vE '^(experiments/driv3r/frankenlayers_lab/|[.]github/workflows/driv3r-frankenlayers-lab[.]yml$)' /tmp/changed.txt > /tmp/unexpected.txt; then
            cat /tmp/unexpected.txt
            exit 1
          fi
          test ! -s /tmp/unexpected.txt

  brain:
    name: Held-out 72-step System One / ${{ matrix.mode }}
    if: github.repository == 'techrote/cybersand' && github.event_name == 'push' && github.ref == 'refs/heads/research/619-frankenlayers-lab'
    needs: cheap
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include:
          - mode: aero4_no10_q4_holdout
            flow: aero4_no10
            quant: q4_k_m
            seed: 1741
          - mode: aero5_no23_q4_holdout
            flow: aero5_no23
            quant: q4_k_m
            seed: 1741
          - mode: aero4_no2_q8_holdout
            flow: aero4_no2
            quant: q8
            seed: 1741
          - mode: aerohound8_q8_holdout
            flow: aerohound
            quant: q8
            seed: 1741
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire source-pinned immutable d1 Q8 donor
        run: |
          set -euo pipefail
          mkdir -p "evidence/${{ matrix.mode }}"
          timeout --signal=TERM --kill-after=30 1250 python3 -m experiments.driv3r.backend acquire \
            --runtime-dir "$RUNNER_TEMP/d1-lab-donor" \
            --evidence "evidence/${{ matrix.mode }}/donor-acquisition" --timeout-seconds 1200
      - name: Build patched pinned llama.cpp LFM3 decision-only runtime
        run: |
          set -euo pipefail
          export LLAMA_ROOT="$RUNNER_TEMP/franken-lab-llama"
          git init "$LLAMA_ROOT"
          git -C "$LLAMA_ROOT" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$LLAMA_ROOT" fetch --depth=1 origin 8642541b255bfb5dc39cd351a178be09013a55d6
          git -C "$LLAMA_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$LLAMA_ROOT" rev-parse HEAD)" = 8642541b255bfb5dc39cd351a178be09013a55d6
          python3 -m experiments.driv3r.frankenlayers_lab.patch_lab \
            --llama-root "$LLAMA_ROOT" --receipt "evidence/${{ matrix.mode }}/runtime-patch.json"
          git -C "$LLAMA_ROOT" diff -- src/models/lfm3.cpp > "evidence/${{ matrix.mode }}/lfm3.patch"
          cmake -S "$LLAMA_ROOT" -B "$LLAMA_ROOT/build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build "$LLAMA_ROOT/build" --config Release --target llama-server llama-quantize -j2
          sha256sum "$LLAMA_ROOT/build/bin/llama-server" > "evidence/${{ matrix.mode }}/binary.sha256"
          ldd "$LLAMA_ROOT/build/bin/llama-server" > "evidence/${{ matrix.mode }}/binary-ldd.txt"
      - name: Acquire read-only pinned W0 legal-action host
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61
          git show 4bb9d6e1d0d0d78183f87d1e3c29648edafacf61:experiments/agent_painter/worm/common/worm.py > "$RUNNER_TEMP/franken-w0.py"
          test "$(git hash-object "$RUNNER_TEMP/franken-w0.py")" = 8979b6f0296e81051194bacc907992d38e006605
      - name: Requantise pinned Q8 donor to reproducible Q4_K_M
        if: matrix.quant == 'q4_k_m'
        run: |
          set -euo pipefail
          MODEL_PATH="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          print(json.loads(Path(os.environ['RUNNER_TEMP']+'/d1-lab-donor/runtime-manifest.json').read_text())['model'])
          PY
          )"
          mkdir -p "$RUNNER_TEMP/franken-lab-q4"
          Q4_MODEL="$RUNNER_TEMP/franken-lab-q4/d1-2B-from-Q8-Q4_K_M.gguf"
          timeout --signal=TERM --kill-after=20 1000 "$RUNNER_TEMP/franken-lab-llama/build/bin/llama-quantize" \
            --allow-requantize "$MODEL_PATH" "$Q4_MODEL" Q4_K_M 2 \
            > "evidence/${{ matrix.mode }}/quantize.log" 2>&1
          test -s "$Q4_MODEL"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from experiments.driv3r.backend import PINS,sha256_file
          old=Path(os.environ["RUNNER_TEMP"]+"/d1-lab-donor/runtime-manifest.json")
          src=Path(json.loads(old.read_text())["model"])
          out=Path(os.environ["RUNNER_TEMP"]+"/franken-lab-q4/d1-2B-from-Q8-Q4_K_M.gguf")
          assert sha256_file(src)==PINS["model"]["sha256"]
          r={"schema":"cybersand-franken-q4-requant/1","quant":"Q4_K_M",
             "allow_requantize":True,"source_kind":"immutable Q8 donor, not FP16",
             "q8_sha256":sha256_file(src),"q8_bytes":src.stat().st_size,
             "q4_sha256":sha256_file(out),"q4_bytes":out.stat().st_size,
             "llama_commit":"8642541b255bfb5dc39cd351a178be09013a55d6"}
          p=Path("evidence/"+os.environ["MATRIX_MODE"]+"/quantize-receipt.json")
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps(r,sort_keys=True))
          PY
        env:
          MATRIX_MODE: ${{ matrix.mode }}
      - name: Source-pinned 72-step held-out obstacle/recovery game-policy trial
        run: |
          set -euo pipefail
          MODEL_PATH="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          print(json.loads(Path(os.environ['RUNNER_TEMP']+'/d1-lab-donor/runtime-manifest.json').read_text())['model'])
          PY
          )"
          if [[ "${{ matrix.quant }}" == "q4_k_m" ]]; then
            timeout --signal=TERM --kill-after=45 4200 python3 -m experiments.driv3r.frankenlayers_lab.holdout \
              --binary "$RUNNER_TEMP/franken-lab-llama/build/bin/llama-server" \
              --model-q8 "$MODEL_PATH" \
              --model-q4 "$RUNNER_TEMP/franken-lab-q4/d1-2B-from-Q8-Q4_K_M.gguf" \
              --quant-receipt "evidence/${{ matrix.mode }}/quantize-receipt.json" \
              --w0 "$RUNNER_TEMP/franken-w0.py" \
              --mode "${{ matrix.flow }}" --seed "${{ matrix.seed }}" --source-sha "$GITHUB_SHA" \
              --output "evidence/${{ matrix.mode }}/inference"
          else
            timeout --signal=TERM --kill-after=45 4200 python3 -m experiments.driv3r.frankenlayers_lab.holdout \
              --binary "$RUNNER_TEMP/franken-lab-llama/build/bin/llama-server" \
              --model "$MODEL_PATH" --w0 "$RUNNER_TEMP/franken-w0.py" \
              --mode "${{ matrix.flow }}" --seed "${{ matrix.seed }}" --source-sha "$GITHUB_SHA" \
              --output "evidence/${{ matrix.mode }}/inference"
          fi
      - name: Retain true failure evidence and checksums
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "evidence/${{ matrix.mode }}"
          lscpu > "evidence/${{ matrix.mode }}/cpu.txt"
          (cd "evidence/${{ matrix.mode }}" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > "evidence/${{ matrix.mode }}/SHA256SUMS.txt"
      - name: Upload original per-carcass W0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driv3r-franken-lab-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_id }}
          path: evidence/${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 90
