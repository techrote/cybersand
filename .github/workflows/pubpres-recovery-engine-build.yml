name: PUBPRES recovery atomic admission engine component

on:
  push:
    branches: [codex/pubpres-playability-final-001-20261124]
    paths: ['.github/pubpres-recovery-engine-build-run.json']

permissions:
  contents: read
  actions: read

env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Exact component and unchanged predecessor gates
        run: |
          python3 tools/ci/check_ci_provider_policy.py
          python3 tools/pubpres_recovery_engine/request_contract.py
          python3 tools/pubpres_recovery_engine/engine_contract.py --verify
          python3 -m unittest discover -s tools/pubpres_recovery_engine -p 'test_*.py' -v
          python3 -m unittest discover -s tools/pubpres_final_frame_budget -p 'test_*.py' -v
          python3 -m unittest discover -s tools/pubpres_final_engine -p 'test_*.py' -v
      - name: Exact bounded producer and rejected-draw clock qualification
        run: |
          mkdir -p build/pubpres-recovery-engine-plan
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread tools/pubpres_final_frame_budget/test_frame_budget.cpp -o build/pubpres-recovery-engine-plan/normal
          build/pubpres-recovery-engine-plan/normal > build/pubpres-recovery-engine-plan/normal.log
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tools/pubpres_recovery_engine/test_admission_clock.cpp -o build/pubpres-recovery-engine-plan/admission
          build/pubpres-recovery-engine-plan/admission > build/pubpres-recovery-engine-plan/admission.log
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer tools/pubpres_final_frame_budget/test_frame_budget.cpp -o build/pubpres-recovery-engine-plan/sanitized
          ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1 UBSAN_OPTIONS=halt_on_error=1 build/pubpres-recovery-engine-plan/sanitized > build/pubpres-recovery-engine-plan/sanitized.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-recovery-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pubpres-recovery-engine-plan/*.log
          retention-days: 90
          if-no-files-found: warn

  atomic-engine-windows:
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Canonical Windows source bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Exact clean Godot 4.7 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $EngineSource = Join-Path $env:RUNNER_TEMP 'godot-atomic-source'
          git init $EngineSource
          if ($LASTEXITCODE -ne 0) { throw 'Engine source initialization failed' }
          git -C $EngineSource remote add origin https://github.com/godotengine/godot.git
          if ($LASTEXITCODE -ne 0) { throw 'Engine source remote setup failed' }
          git -C $EngineSource fetch --depth=1 --no-tags origin 5b4e0cb0fd279832bbdd69fed5354d4e5ad26f88
          if ($LASTEXITCODE -ne 0) { throw 'Exact engine source fetch failed' }
          git -C $EngineSource checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Exact engine source checkout failed' }
      - name: Build separately identified atomic application admission engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/pubpres_recovery_engine/request_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Component request admission failed' }
          python tools/pubpres_recovery_engine/build_engine.py --source-dir (Join-Path $env:RUNNER_TEMP 'godot-atomic-source') --output build/pubpres-recovery-atomic/payload --evidence build/pubpres-recovery-atomic/proof --workers 2
          if ($LASTEXITCODE -ne 0) { throw 'Exact atomic admission engine build or ABI gate failed' }
      - name: Independently re-admit exact engine payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Proof = Get-Item build/pubpres-recovery-atomic/payload/build-provenance.json
          $Hash = (Get-FileHash -Algorithm SHA256 $Proof.FullName).Hash.ToLowerInvariant()
          python tools/pubpres_recovery_engine/payload.py --directory build/pubpres-recovery-atomic/payload --engine-build-source $env:GITHUB_SHA --engine-build-run $env:GITHUB_RUN_ID --engine-build-attempt $env:GITHUB_RUN_ATTEMPT --engine-proof-sha256 $Hash --evidence build/pubpres-recovery-atomic/proof/payload-admission.json
          if ($LASTEXITCODE -ne 0) { throw 'Exact component payload re-admission failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: pubpres-recovery-atomic-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pubpres-recovery-atomic/payload/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pubpres-recovery-atomic-engine-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/pubpres-recovery-atomic/proof/
            !build/pubpres-recovery-atomic/proof/dependencies/**
            !build/pubpres-recovery-atomic/proof/downloads/*.zip
            !build/pubpres-recovery-atomic/proof/downloads/*.whl
          retention-days: 90
          if-no-files-found: warn
