name: MZ-012 phase-gated recurrent long-horizon game memory (HOLD)
on:
  push:
    branches: ['research/model-zoo-phase-state-mz012']
    paths:
      - 'experiments/driv3r/model_zoo/phase_state_mz012/**'
      - '.github/workflows/driv3r-model-zoo-phase-mz012.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mz012-phase-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  cpu-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact-parent research-only fence
        run: |
          git diff --name-only bcd759b8f8a351998d61829b3f527c965ca041d4 HEAD > "$RUNNER_TEMP/mz012-changes.txt"
          cat "$RUNNER_TEMP/mz012-changes.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          f = Path(os.environ["RUNNER_TEMP"], "mz012-changes.txt").read_text().splitlines()
          assert f and all(p.startswith("experiments/driv3r/model_zoo/phase_state_mz012/")
                           or p == ".github/workflows/driv3r-model-zoo-phase-mz012.yml"
                           for p in f), f
          print("Exact-parent scope fence PASS")
          PY
      - name: Install pinned CPU-only PyTorch
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip freeze > "$RUNNER_TEMP/mz012-packages.txt"
      - name: Source-pinned prior host and new model contracts
        run: |
          python -m unittest -v \
            experiments.driv3r.model_zoo.material_forks_mz009.test_world \
            experiments.driv3r.model_zoo.diag_state_mz011.test_diag \
            experiments.driv3r.model_zoo.phase_state_mz012.test_phase
      - name: Real exposure-matched recurrent training and long-corridor evaluation
        run: |
          python -m experiments.driv3r.model_zoo.phase_state_mz012.run \
            --out "$RUNNER_TEMP/mz012" --train-seeds 128 --eval-seeds 24 \
            --rollout-seeds 8 --updates 500 --batch 32
      - name: Independent checkpoint reload and exact held-out score reproduction
        run: |
          python - <<'PY'
          import hashlib,json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          import torch
          from experiments.driv3r.model_zoo.phase_state_mz012 import run as mz
          from experiments.driv3r.model_zoo.material_forks_mz009 import run as host
          torch.set_num_threads(2)
          out = Path(os.environ["RUNNER_TEMP"], "mz012")
          r=json.loads((out/"metrics.json").read_text())
          assert r["schema"]==mz.SCHEMA
          assert r["source_sha"]==os.environ["GITHUB_SHA"]
          assert r["parent_sha"]==mz.PARENT_SHA
          assert r["training"]["updates_per_model"]==500
          assert r["training"]["disjoint_seed_families"]
          assert r["training"]["test_episodes"]==288
          assert r["training"]["shifted_test_episodes"]==288
          assert hashlib.sha256((out/"models.pt").read_bytes()).hexdigest()==r["checkpoint_sha256"]
          ck=torch.load(out/"models.pt",map_location="cpu",weights_only=True)
          assert ck["schema"]==mz.SCHEMA
          assert ck["source_sha"]==r["source_sha"]
          assert tuple(ck["actions"])==host.ACTIONS
          models=mz.build_models(torch,ck["hidden"])
          assert mz.counts(models)==r["parameters"]
          for name,net in models.items():
              net.load_state_dict(ck["models"][name],strict=True)
              net.eval()
              for label,ood in (("test",False),("shifted_long_test",True)):
                  rows=mz.dataset(range(6000,6024) if ood else range(5000,5024),ood=ood)
                  x,y=mz.tensors(torch,rows)
                  with torch.inference_mode():
                      result=host.class_scores(net(x),y,x)
                  assert result==r["scores"][name][label],(name,label,result,r["scores"][name][label])
              assert r["stateful_prefix_parity"][name]["matched"]==r["stateful_prefix_parity"][name]["episodes"]
          assert ET.parse(out/"trajectories.svg").getroot().tag.endswith("svg")
          print("Exact source / checkpoints / both held-out domains / SVG PASS")
          PY
      - name: Trained-phase causal ablation on original and shifted held-out worlds
        run: |
          python -m experiments.driv3r.model_zoo.phase_state_mz012.ablate --input "$RUNNER_TEMP/mz012"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"],"mz012","phase_ablation.json")
          a=json.loads(p.read_text())
          assert a["source_sha"]==os.environ["GITHUB_SHA"]
          assert len(a["conditions"])==5
          assert a["conditions"]["trained"]["shifted_closed_loop"]["episodes"]==32
          print("Trained-phase intervention / source provenance verified")
          PY
      - name: Preserve original checkpoint, metrics, trajectory and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mz012-phase-state-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mz012/**
            ${{ runner.temp }}/mz012-packages.txt
            ${{ runner.temp }}/mz012-changes.txt
          if-no-files-found: warn
          retention-days: 14
