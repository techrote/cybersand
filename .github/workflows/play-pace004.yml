      - name: Check out exact result head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PACE004_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Select Python
