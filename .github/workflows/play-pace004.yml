            2>&1 | tee "$EVIDENCE_DIR/offline-readback.log"
      - name: Preserve original positive and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: play-pace004-windows_headless-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/play-pace004-windows_headless/
          if-no-files-found: error
          retention-days: 30

  linux_graphical:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE_DIR: build/play-pace004-linux_graphical
    steps:
      - name: Check out exact result head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PACE004_SHA }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
